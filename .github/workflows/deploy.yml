name: Validate and Deploy StudioKit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studiokit-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site
        run: python tools/validate_site.py
      - name: Check JavaScript syntax
        run: |
          node --check shared/home.js
          node --check shared/site-shell.js
          node --check apps/arcade/engine.js
          node --check apps/arcade/sw.js
      - name: Build site artifact
        run: python tools/build_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Upload deployable artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ./dist
          retention-days: 3
          if-no-files-found: error

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: cloudflare-pages
      url: "${{ vars.CF_PAGES_URL || 'https://studiokit.pages.dev/' }}"
    steps:
      - name: Checkout for commit metadata
        uses: actions/checkout@v4
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=studiokit --branch=main

  verify:
    name: Verify both deployments
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy-pages, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare GitHub Pages and Cloudflare Pages
        run: >
          python tools/verify_deploy.py
          --base "${{ needs.deploy-pages.outputs.page_url || 'https://shawlaw.github.io/studiokit/' }}"
          --base "${{ needs.deploy-cloudflare.outputs.deployment_url || vars.CF_PAGES_URL }}"
          --base "${{ vars.CF_PAGES_URL }}"
          --retries 15
          --delay 8
