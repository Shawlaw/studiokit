<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="__TOOL_DESCRIPTION__" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site-shell.js" defer></script>
  <title>__TOOL_NAME__ · StudioKit</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #1d2940; background: #f4f6fb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .tool-page { width: min(980px, calc(100% - 32px)); margin: 36px auto; }
    .tool-panel { padding: 24px; border: 1px solid #e1e5ed; border-radius: 16px; background: #fff; box-shadow: 0 8px 24px rgba(20,28,45,.05); }
    .tool-panel h1 { margin: 0 0 8px; font-size: 24px; }
    .tool-panel p { color: #68758b; line-height: 1.7; }
    .placeholder { margin-top: 20px; padding: 24px; border: 1px dashed #cbd5e3; border-radius: 12px; color: #718096; text-align: center; }
  </style>
</head>
<body data-studiokit-app="__TOOL_ID__" data-studiokit-app-title="__TOOL_NAME__">
  <main class="tool-page">
    <section class="tool-panel">
      <p>STUDIOKIT TOOL · v__TOOL_VERSION__</p>
      <h1>__TOOL_NAME__</h1>
      <p>__TOOL_DESCRIPTION__</p>
      <div class="placeholder">工具页面骨架已创建。请在这里实现独立的工具 UI 与业务逻辑，再将注册表状态改为 available。</div>
    </section>
  </main>
</body>
</html>
