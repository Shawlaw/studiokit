<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="iOS PWA 顶部导航条（StudioKit / 街机厅 Arcade / 源码）模糊诊断：使用站点真实 shellbar。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../shared/site.css" />
  <link rel="stylesheet" href="./arcade.css" />
  <script src="../../shared/site-shell.js" defer></script>
  <title>iOS PWA 顶部导航条模糊诊断 · 街机厅</title>
  <style>
    /* 页面占位内容，让 shellbar 停在真实位置（文档流最顶部） */
    .diag-body { padding: 20px 16px 60vh; color: #c9d2ee; font: 14px/1.7 system-ui, sans-serif; }
    .diag-body h2 { color: #ffd23f; font-size: 16px; }

    /* 底部方案面板（诊断页独有，不遮挡顶部观察） */
    .diag-panel {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 52dvh; overflow: auto;
      padding: 12px 12px 18px;
      background: #111a33; border-top: 1px solid #2a3560;
      z-index: 100000;
      -webkit-user-select: text; user-select: text;
    }
    .diag-panel h1 { font-size: 14px; margin: 0 0 5px; color: #ffd23f; }
    .diag-panel .hint { font-size: 12px; line-height: 1.55; color: #a7b0d0; margin: 0 0 9px; }
    .diag-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .diag-opt {
      min-height: 44px; padding: 7px 9px;
      border: 1px solid #3a4780; border-radius: 10px;
      background: #1b2444; color: #eef1ff;
      font-size: 12px; text-align: left; line-height: 1.35;
    }
    .diag-opt.on { background: #ffd23f; color: #1a1405; border-color: #ffd23f; font-weight: 700; }
    .diag-metrics { margin-top: 10px; font: 11px/1.65 ui-monospace, Menlo, monospace; color: #93a0c8; word-break: break-all; }
    .diag-metrics b { color: #ffd23f; font-weight: 600; }

    /* ===== 各方案只作用于真实 shellbar（由 site-shell.js 注入） ===== */
    body.diag-1 .studiokit-shellbar { position: sticky !important; top: 0 !important; z-index: 9998 !important; }
    body.diag-2 .studiokit-shellbar { transform: translateZ(0); -webkit-transform: translateZ(0); }
    body.diag-3 .studiokit-shellbar { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; z-index: 9998 !important; }
    body.diag-4::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0;
      height: 100px; background: #0b1020; z-index: 9997; pointer-events: none;
    }
    body.diag-5 .studiokit-shellbar { will-change: transform; }
    body.diag-6 .studiokit-shellbar { contain: layout paint; }
    body.diag-7 * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    body.diag-8 .studiokit-shellbar { isolation: isolate; }
    body.diag-9 .studiokit-shellbar { position: sticky !important; top: 0 !important; z-index: 99999 !important; background: #0b1020 !important; }
    body.diag-10 .studiokit-shellbar { position: sticky !important; top: 0 !important; z-index: 9998 !important; transform: translateZ(0); -webkit-transform: translateZ(0); background: #0b1020 !important; }
  </style>
</head>
<body class="arcade-body" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade">
  <noscript><p class="ac-noscript">此页需要启用 JavaScript。</p></noscript>

  <div class="diag-body">
    <h2>诊断对象：最顶部那条导航条</h2>
    <p>请看屏幕最顶上那一行 —— <b>StudioKit / 街机厅 Arcade ···· 源码 ↗</b>（深色/浅色横条）。<br>下面是方案按钮，点一个就切换一次顶部渲染方式。</p>
  </div>

  <div class="diag-panel">
    <h1>iOS PWA 顶部导航条发虚 · 方案对比</h1>
    <p class="hint">
      从主屏幕 PWA 打开此页。<b>盯住最顶部「StudioKit / 街机厅 Arcade / 源码」那一行字</b>，逐个点按钮，找出<b>最清晰、不发虚</b>的方案编号告诉我。<br>
      方案 0 = 当前线上效果（基线）。此页用的是站点真实的导航条，和中心页完全一致。
    </p>
    <div class="diag-opts" id="diagOpts"></div>
    <div class="diag-metrics" id="diagMetrics"></div>
    <p class="hint" style="margin-top:9px">
      定位后会删除此页。<a href="./index.html" style="color:#4fc3f7">← 返回中心页</a>
    </p>
  </div>

  <script>
    (() => {
      'use strict';
      const names = [
        '0 当前线上（基线）',
        '1 shellbar 改 sticky 贴顶',
        '2 shellbar 独立渲染层',
        '3 shellbar 改 fixed 贴顶',
        '4 顶部加 100px 纯色条',
        '5 shellbar will-change',
        '6 shellbar contain:paint',
        '7 禁用全部毛玻璃滤镜',
        '8 shellbar 隔离层',
        '9 sticky + 深色不透明',
        '10 sticky + 独立层 + 深色',
      ];
      const opts = document.getElementById('diagOpts');
      let current = 0;
      function set(i) {
        current = i;
        document.body.className = 'arcade-body diag-' + i;
        [...opts.children].forEach((b, idx) => b.classList.toggle('on', idx === i));
        try { history.replaceState(null, '', '?diag=' + i); } catch (e) {}
        renderMetrics();
      }
      names.forEach((n, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'diag-opt' + (i === 0 ? ' on' : '');
        b.textContent = n;
        b.addEventListener('click', () => set(i));
        opts.appendChild(b);
      });

      function renderMetrics() {
        const bar = document.querySelector('.studiokit-shellbar');
        if (!bar) { document.getElementById('diagMetrics').textContent = 'shellbar 未注入（请刷新）'; return; }
        const r = bar.getBoundingClientRect();
        const cs = getComputedStyle(bar);
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);width:0;pointer-events:none';
        document.body.appendChild(probe);
        const sat = probe.getBoundingClientRect().height;
        probe.remove();
        const m = {
          '当前方案': current,
          'shellbar top/高': Math.round(r.top) + 'px / ' + Math.round(r.height) + 'px',
          'shellbar position': cs.position,
          'shellbar z-index': cs.zIndex,
          'shellbar 背景': cs.backgroundColor,
          'safe-area-inset-top': sat + 'px',
          'devicePixelRatio': window.devicePixelRatio || 0,
          'standalone': (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches),
        };
        document.getElementById('diagMetrics').innerHTML =
          Object.entries(m).map(([k, v]) => `<b>${k}</b>: ${String(v).replace(/</g, '&lt;')}`).join('<br>');
      }

      // site-shell.js 是 defer，等它注入 shellbar 后再测量
      function boot() {
        renderMetrics();
        const q = location.search.match(/diag=(\d+)/);
        if (q) set(Math.min(10, Math.max(0, parseInt(q[1], 10))));
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 50));
      else setTimeout(boot, 50);
    })();
  </script>
</body>
</html>
