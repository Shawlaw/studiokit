          A.draw.label(ctx, labelText, labelX, Math.max(88, topScreenY - 18), {
            font: 'bold 12px system-ui',
            color: willMiss ? '#ff9a9a' : aligned ? '#63d68c' : '#ffd23f',
          });
          ctx.restore();
        }

        if (feedback) {
          A.draw.label(ctx, feedback.text, W / 2, 112, {
            font: 'bold 18px system-ui',
            color: feedback.color,
            alpha: clamp(feedback.life / 1.1, 0, 1),
          });
        }

        if (flash > 0) {
          ctx.fillStyle = `rgba(255,220,110,${flash * 0.35})`;
          ctx.fillRect(0, 0, W, H);
        }

        if (state === 'playing' || state === 'paused') {
          const bw = 150;
          ctx.fillStyle = 'rgba(10,14,30,0.5)';
          A.draw.roundRect(ctx, W / 2 - bw / 2, H - 30, bw, 10, 5);
          ctx.fill();
          const mid = W / 2;
          ctx.fillStyle = leanMeter > 0.7 ? '#ff5d5d' : leanMeter > 0.4 ? '#ffd23f' : '#63d68c';
          const dir = towerLean >= 0 ? 1 : -1;
          A.draw.roundRect(ctx, dir > 0 ? mid : mid - (bw / 2 - 4) * leanMeter, H - 28, (bw / 2 - 4) * leanMeter, 6, 3);
          if ((bw / 2 - 4) * leanMeter > 2) ctx.fill();
          A.draw.label(ctx, '平稳', mid - bw / 2 - 22, H - 25, { font: '10px system-ui', color: '#93a0c8' });

          },
          /* ---------- 0.9 挑战模式钩子（契约见 docs/arcade/0.9/INTEGRATION-CONTRACT.md §5） ---------- */
          /* 修复回归：同步、确定性断言（#test 专用；调用结束后恢复被临时改动的标量）。 */
          regression() {
            const details = [];
            let pass = 0;
            let fail = 0;
            const check = (ok, text) => {
              if (ok) {
                pass += 1;
                details.push('PASS ' + text);
              } else {
                fail += 1;
                details.push('FAIL ' + text);
              }
            };
            const oldLean = towerLean;
            const oldLeanVel = leanVel;
            const oldPeak = chPeakLean;
            try {
              /* 1) 挑战对齐用 targetOffsetPx ± tolerancePx（容差内真、容差外假）。 */
              const inside = challengeAlignState(210 + 8 + 7, 8, 8, 210);
              const edge = challengeAlignState(210 + 8 + 8, 8, 8, 210);
              const outside = challengeAlignState(210 + 8 + 9, 8, 8, 210);
              check(inside.aligned === true && Math.abs(inside.offsetPx - 7) < 1e-9, '挑战对齐：目标+8px、容差 8px，偏差 7px 判定对齐');
              check(edge.aligned === true && outside.aligned === false, '挑战对齐：偏差=容差 判定对齐，超出 1px 判定未对齐');
              const classic = classicAlignState(226, { x: 170, w: 64 });
              check(classic.aligned === false && challengeAlignState(226, 8, 8, 210).aligned === true, '挑战对齐与经典 85% 重叠判定不同：同一位置挑战判定对齐、经典判定未对齐');
              /* 2) 恢复归一化：下落中恢复同一箱、工具次数不补回、guideArmed 按条件恢复。 */
              const caps = { guide: 3, brace: 2 };
              const midDrop = normalizeChallengeRestore(
                { drop: { x: 180, y: -300, w: 64, h: 40, vy: 120, prevBottom: -260 }, pendHasBox: false, pendReload: 0.3, tools: { guide: 2, brace: 0 }, guideArmed: true },
                caps
              );
              check(midDrop.drop && midDrop.drop.x === 180 && midDrop.drop.y === -300 && midDrop.pendHasBox === false, '下落中刷新：恢复同一箱（drop 位置不变、pendHasBox=false），不重给一箱');
              check(midDrop.tools.guide === 2 && midDrop.tools.brace === 0 && midDrop.guideArmed === false, '恢复：剩余工具次数保持、drop 期间不恢复 armed（配重后刷新不补回额度）');
              const armed = normalizeChallengeRestore({ pendHasBox: true, tools: { guide: 1, brace: 2 }, guideArmed: true }, caps);
              check(armed.guideArmed === true && armed.tools.guide === 1 && armed.tools.brace === 2, '恢复：无 drop 时 guideArmed 与剩余工具次数一致恢复');
              const reloading = normalizeChallengeRestore({ pendHasBox: false, pendReload: 0.4, tools: { guide: 1, brace: 1 }, guideArmed: true }, caps);
              check(reloading.pendHasBox === true && reloading.pendReload === 0, '恢复：无 drop 的补箱读秒状态恢复为持 1 只箱（与 0.8.6 续玩一致，不额外生成箱子）');
              const clamped = normalizeChallengeRestore({ pendHasBox: true, tools: { guide: 99, brace: 99 }, guideArmed: true }, caps);
              const wiped = normalizeChallengeRestore({ drop: { x: 10, y: 10 }, pendHasBox: true, tools: { guide: 0, brace: 0 }, guideArmed: true }, caps);
              check(clamped.tools.guide === 3 && clamped.tools.brace === 2, '恢复：工具次数按关卡允许上限 clamp');
              check(wiped.guideArmed === false && wiped.tools.guide === 0 && wiped.pendHasBox === false, '恢复：工具次数 0 时不恢复 armed，且 drop 期间强制 pendHasBox=false');
              /* 3) 倾斜峰值记录整局真实最大值，而不是当前 abs(towerLean)。 */
              chPeakLean = 0;
              towerLean = -0.03;
              recordPeakLean();
              towerLean = 0.06;
              recordPeakLean();
              towerLean = 0.01;
              recordPeakLean();
              const peak = chPeakLean;
              check(Math.abs(peak - 0.06) < 1e-9 && peakLeanText() === '0.060', '倾斜峰值记录整局最大 |lean|（0.060），结算文案使用峰值');
              /* 4) 0.10.0 C05/C06 win 门槛：注入数据覆盖正反例（不依赖设计源是否已同步字段）。 */
              const m = (within) => ({ withinTolerance: within });
              check(consecutiveWithinTolerance([m(true), m(true), m(true)]).best === 3, '连续容差计数：连续三层全在内 → best=3');
              check(consecutiveWithinTolerance([m(true), m(true), m(false), m(true)]).best === 2, '连续容差计数：中断后只算最长连续段 → best=2');
              check(consecutiveWithinTolerance([m(false), m(true), m(true)]).current === 2, '连续容差计数：current 表示末尾连续段');
              const c05Run = [m(true), m(false), m(true), m(true), m(false), m(true)];
              check(evaluateWinGates(c05Run, 3, null, null) !== '', 'C05 反例：无连续三层容差内 → 不放行（带原因）');
              const c05Pass = [m(false), m(true), m(true), m(true), m(false)];
              check(evaluateWinGates(c05Pass, 3, null, null) === '', 'C05 正例：存在连续三层容差内 → 放行');
              check(evaluateWinGates([m(true), m(true), m(true)], 2, null, null) === '', 'C05 门槛可调（2 层）仍按数据放行');
              check(evaluateWinGates([m(true), m(true), m(true)], null, null, null) === '', '旧关缺省 min=null：不启用连续层门槛（零回归）');
              check(evaluateWinGates([], 3, 15, 10) !== '', 'C06 反例：无 marks 时 C05 门槛仍生效');
              check(evaluateWinGates(c05Pass, 3, 15, 16) !== '', 'C06 反例：塔顶偏移 16px > 15px → 不放行');
              check(evaluateWinGates(c05Pass, 3, 15, 15) === '', 'C06 正例：塔顶偏移等于 15px → 放行');
              check(evaluateWinGates(c05Pass, 3, 15, 8) === '', 'C06 正例：塔顶偏移 8px < 15px → 放行');
              check(evaluateWinGates(c05Pass, 3, null, null) === '', '旧关缺省 max=null：不启用塔顶偏移门槛（零回归）');
              const winRead = { minConsecutiveWithinTolerance: 3, maxFinalTopCenterOffsetPx: 15, floorsAtLeast: 6 };
              const readOpt = (v) => (v === null || v === undefined || v === '' ? null : (Number.isFinite(Number(v)) && Number(v) >= 0 ? Number(v) : null));
              check(
                readOpt(winRead.minConsecutiveWithinTolerance) === 3 &&
                readOpt(winRead.maxFinalTopCenterOffsetPx) === 15 &&
                readOpt({}.minConsecutiveWithinTolerance) === null,
                'win 字段读取：3/15 生效，缺省为 null'
              );
              /* 5) 持久重心模型：一直偏置 → comOffset 单调累积；交替左右 → 重心抵消。 */
              const oldBoxes = boxes.slice();
              const oldCom = comOffset;
              const oldMoment = comMoment;
              const oldLoad = comLoad;
              const mkBox = (dx) => ({ x: 210 - BOX_W / 2 + dx, y: -84, w: BOX_W, h: BOX_H, cargo: CARGO_TYPES[0] });
              boxes = [{ x: 155, y: -44, w: 110, h: 44, base: true }];
              comMoment = 0;
              computeComOffset();
              const com0 = comOffset;
              boxes.push(mkBox(20)); comMoment += 20; computeComOffset(); const com1 = comOffset;
              boxes.push(mkBox(40)); comMoment += 20; computeComOffset(); const com2 = comOffset;
              boxes.push(mkBox(60)); comMoment += 20; computeComOffset(); const com3 = comOffset;
              check(com0 === 0 && com1 > 0 && com2 > com1 && com3 > com2, '持续右偏堆叠：重心投影单调右移（' + [com0, com1, com2, com3].map((v) => v.toFixed(1)).join('/') + '）');
              check(com3 > STABILITY_LIMIT * 0.5, '持续偏置 3 层后重心明显超出稳定半宽（' + com3.toFixed(1) + ' > ' + (STABILITY_LIMIT / 2).toFixed(1) + '）');
              boxes = [{ x: 155, y: -44, w: 110, h: 44, base: true }];
              comMoment = 0;
              computeComOffset();
              boxes.push(mkBox(20)); comMoment += 20; computeComOffset();
              boxes.push(mkBox(-20)); comMoment -= 20; computeComOffset();
              boxes.push(mkBox(20)); comMoment += 20; computeComOffset();
              boxes.push(mkBox(-20)); comMoment -= 20; computeComOffset();
              check(Math.abs(comOffset) < 1, '左右交替对称堆叠：重心投影回到中心附近（' + comOffset.toFixed(2) + 'px）');
              boxes = oldBoxes;
              comOffset = oldCom;
              comMoment = oldMoment;
              comLoad = oldLoad;
            } catch (err) {
              fail += 1;
              details.push('FAIL regression 异常：' + (err && err.message ? err.message : String(err)));
            } finally {
              towerLean = oldLean;
              leanVel = oldLeanVel;
              chPeakLean = oldPeak;
            }
            return { pass, fail, details };
          },
          /* 对齐判定证据：同一投影箱心下的挑战判定（targetOffset±tolerance）与经典判定（85% 重叠）。 */
          alignInfo(centerX) {

          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              stageIndex: chStageIndex,
              state,

              collectibles: [],
              assisted: chAssisted,
              floors: chPlaced,
              floorsRequired: chWin.floorsAtLeast || chBoxesData.length,
              marks: chMarks.slice(),
              consecutiveWithinTolerance: consecutiveWithinTolerance(chMarks),
              minConsecutiveWithinTolerance: chMinConsecutiveWithinTolerance,
              maxFinalTopCenterOffsetPx: chMaxFinalTopCenterOffsetPx,
              finalTopCenterOffsetPx: finalTopCenterOffset(),
              misses: chMisses,
              maxDroppedBoxes: chLimits.maxDroppedBoxes,
              towerLean,

          stageObservable() {

          },
          releaseWhenAligned(offset, tolerance) {

          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing' || !chStage) return false;

          },
          forceStageFail(reason) {

          },
          /* 0.10.0：注入数据的纯门槛判定（给 CDP 验证读正反例，不改游戏状态）。 */
          checkWinGates(opts) {
            const o = opts && typeof opts === 'object' ? opts : {};
            const marks = Array.isArray(o.marks) ? o.marks : [];
            const min = o.minConsecutive === null || o.minConsecutive === undefined ? null : (Number.isFinite(Number(o.minConsecutive)) && Number(o.minConsecutive) >= 0 ? Math.floor(Number(o.minConsecutive)) : null);
            const maxOffset = o.maxOffsetPx === null || o.maxOffsetPx === undefined ? null : (Number.isFinite(Number(o.maxOffsetPx)) && Number(o.maxOffsetPx) >= 0 ? Number(o.maxOffsetPx) : null);
            const finalOffset = o.finalOffsetPx === null || o.finalOffsetPx === undefined ? null : Number(o.finalOffsetPx);
            const blocker = evaluateWinGates(marks, min, maxOffset, Number.isFinite(finalOffset) ? finalOffset : null);
            return { blocker, pass: blocker === '', consecutive: consecutiveWithinTolerance(marks) };
          },
          exitChallenge() {
            return exitChallengeToStart();
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '层塔',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync(); syncJoyTools();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
