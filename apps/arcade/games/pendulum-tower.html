<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 0.11.5：禁止移动端双击误触放大（游戏误操作防护）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="层塔：钟摆叠箱子物理游戏，钟摆从慢到快逐层加速，偏心会让塔倾斜倒塌，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/pendulum-tower.js"></script>
  <style>
    .challenge-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; background: rgba(8, 13, 28, 0.96); border-radius: inherit; }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-btn[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud { position: absolute; left: 8px; right: 8px; top: 8px; width: auto; z-index: 4; pointer-events: none; }
    /* 全览按钮保持 44px 触控目标；三列等宽，与 1 垂线 / 2 配重同排不冲突。 */
    .touch-pad.tower-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .touch-pad.tower-tools .touch-btn { min-height: 44px; }
  </style>
  <title>层塔 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#e5941b; --card-accent:#e5941b">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🏗 层塔</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>层数 <strong data-hud-floor>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="层塔游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>层塔</h2>
            <p data-ov-text>钟摆叠箱子</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <div class="touch-pad game-tools tower-tools" aria-label="可选道具与全览（快捷键 1 / 2 / 3）">
      <button type="button" class="touch-btn" data-joy-tool="guide" aria-label="垂线预览，剩余 3 次（快捷键 1）"><span aria-hidden="true">📐</span> 垂线 <strong data-joy-count>3</strong></button>
      <button type="button" class="touch-btn" data-joy-tool="brace" aria-label="配重，剩余 2 次（快捷键 2）"><span aria-hidden="true">⚖️</span> 配重 <strong data-joy-count>2</strong></button>
      <button type="button" class="touch-btn" data-overview-btn aria-label="全览全塔（快捷键 3）" aria-pressed="false"><span aria-hidden="true">🗺</span> 全览</button>
    </div>
    <p class="game-hint">吊臂摇摆吊装集装箱 · 点击 / 空格松手 · 1 垂线 / 2 配重 / 3 全览 · 完美对齐有连击 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const BOX_W = 64;
      const BOX_H = 40;
      const GRAVITY = 1300;
      const PIVOT_X = W / 2;
      const PIVOT_Y = 64;
      const PEND_LEN = 135;
      /* 0.12.1 可达性修复：经典模式吊臂小车沿臂架滑移跟随塔顶（真实塔吊就靠变幅对位），
         使「摆幅可达范围」始终覆盖落点；挑战模式仍按关卡数据固定 pivotX（合同不变）。
         JIB_MIN/MAX 保证吊钩在最大摆角下仍留在画布内：pivot ± sin(1.05)*135 ≈ ±118。 */
      const JIB_MIN_X = 120;
      const JIB_MAX_X = 300;
      const LEAN_LIMIT = 0.35;
      /* 持久重心模型：支撑半宽按箱体宽度计，重心投影超出即倾覆；
       * 稳定阈值比硬极限保守，避免“持续偏心晃一晃又归零”永不倒的假象。 */
      const SUPPORT_HALF = BOX_W / 2;
      const STABILITY_LIMIT = SUPPORT_HALF * 0.62;
      const BASE_Y = 0;
      const JOY_START = { guide: 3, brace: 2 };
      const JOY_CAPS = { guide: 3, brace: 2 };
      const BRACE_MIN_LEAN = 0.015;
      const BRACE_MIN_VEL = 0.04;
      /* 集装箱属性：确定性伪随机（每局 seed），全部真实影响物理或计分。 */
      const CARGO_TYPES = [
        { id: 'std',    icon: '📦', label: '标准',     color: '#c8792f', trim: '#7a4a1c', weight: 1,    bonus: 0 },
        { id: 'heavy',  icon: '⚓', label: '重型',     color: '#c0552d', trim: '#77331a', weight: 1.65, bonus: 5 },
        { id: 'fragile',icon: '🍷', label: '易碎',     color: '#d98fae', trim: '#8c4f68', weight: 0.8,  bonus: 8 },
        { id: 'bonus',  icon: '💎', label: '奖励',     color: '#2f9e8f', trim: '#176259', weight: 1,    bonus: 25 },
      ];
      let cargoSeed = 1;
      function nextRandom() {
        cargoSeed = (cargoSeed * 1664525 + 1013904223) >>> 0;
        return cargoSeed / 4294967296;
      }
      function rollCargo() {
        const r = nextRandom();
        const t = r < 0.5 ? 0 : r < 0.72 ? 1 : r < 0.9 ? 2 : 3;
        return CARGO_TYPES[t];
      }

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudFloor: document.querySelector('[data-hud-floor]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);
      const joyButtons = {
        guide: document.querySelector('[data-joy-tool="guide"]'),
        brace: document.querySelector('[data-joy-tool="brace"]'),
      };

      const particles = A.createParticles();

      /* ---------- 0.9 挑战模式：建筑委托（固定钟摆/目标偏置/限次） ---------- */
      const gameId = 'pendulum-tower';
      const challengeData = A.Challenge ? A.Challenge.stages(gameId) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chBoxesData = [];
      let chMarks = [];
      let chPlaced = 0;
      let chMisses = 0;
      let chElapsed = 0;
      let chAssisted = false;
      let chErrorReason = '';
      let chLastResult = null;
      let chMaxLean = LEAN_LIMIT;
      let chPeakLean = 0;
      let chWin = { floorsAtLeast: 4, noCollapse: true };
      /* 0.10.0：C05 连续容差内层数门槛 / C06 塔顶中心最终偏移上限，缺省 null 表示不启用。 */
      let chMinConsecutiveWithinTolerance = null;
      let chMaxFinalTopCenterOffsetPx = null;
      let chLimits = { maxDroppedBoxes: 5, braceUsesAllowed: 0, guideUsesAllowed: 0 };
      let chToolsUsed = { guide: 0, brace: 0 };
      let chGoalHintTimer = 0;
      let chHudSecond = -1;
      let chEvaluation = null;

      let boxes = [];
      let drop = null;
      const pend = { angle: 0.95, vel: 0, length: PEND_LEN, gravity: 680, damping: 0.006 };
      let pendHasBox = true;
      let pendReload = 0;
      let towerLean = 0;
      let leanVel = 0;
      let jibXCur = PIVOT_X;  // 吊臂小车当前 x（向 jibTargetX() 平滑滑移）
      let comOffset = 0;      // 当前重心相对地基中心的水平投影（逻辑 px）
      let comMoment = 0;      // 累计未抵消的倾覆力矩（重量×偏心，逻辑力矩单位）
      let comLoad = 0;        // 当前塔上总重量
      let activeCargo = CARGO_TYPES[0]; // 吊钩当前集装箱属性
      let nextCargo = CARGO_TYPES[0];   // 下一箱预告
      let fragileArmed = true;         // 本局易碎箱奖励可否触发（每局限一次）
      /* 全览：0=正常跟随塔顶，1=地基到塔顶总览；overviewReveal 为结算前动画式拉远。 */
      let overviewActive = false;
      let overviewT = 1;
      let overviewHold = 0;
      let overviewReveal = null;
      let overviewSettled = false; // 结算拉远后保持全塔缩放视图（不要弹层出现时缩回 1:1）
      let camY = -474;
      let score = 0;
      let perfectCombo = 0;
      let state = 'ready';
      let recordSaved = false;
      let collapseTimer = 0;
      let collapsed = [];
      let flash = 0;
      let leanMeter = 0;
      let shakeVal = 0;
      let floorsReached = 0;
      let feedback = null;
      const tools = { guide: JOY_START.guide, brace: JOY_START.brace };
      let guideArmed = false;

      let high = A.Progress.get('pendulum-tower').high;
      dom.hudHigh.textContent = String(high);

      /* 钟摆速度随层数递增：低层慢悠悠，高层明显加速。 */
      function swingGravity(floors) {
        return Math.min(1700, 680 + Math.max(0, floors) * 34);
      }

      function updateSwingDifficulty() {
        pend.gravity = swingGravity(floorsReached);
      }

      function towerTop() {
        return boxes[boxes.length - 1];
      }
      function baseCenter() {
        if (mode === 'challenge' && chStage && chStage.content) return Number(chStage.content.baseCenterX) || W / 2;
        return boxes[0] ? boxes[0].x + boxes[0].w / 2 : W / 2;
      }
      /* 重心投影：每只箱按自身重量加权，持久累积；左右对称放置会互相抵消。 */
      function computeComOffset() {
        let sum = 0;
        let load = 0;
        boxes.forEach((b) => {
          const w = b.base ? 3.2 : (b.cargo ? b.cargo.weight : 1);
          sum += (b.x + b.w / 2 - baseCenter()) * w;
          load += w;
        });
        comLoad = load;
        comOffset = load > 0 ? sum / load : 0;
        return comOffset;
      }
      function towerExtent() {
        let topY = BASE_Y;
        boxes.forEach((b) => { topY = Math.min(topY, b.y); });
        collapsed.forEach((b) => { topY = Math.min(topY, b.y); });
        return { bottom: BASE_Y + 60, top: topY };
      }
      /* 0.12.1 全览重做：真正的 zoom-to-fit。
         旧实现只平移相机、没有缩放，几十层时塔身远超 740 画布而被裁掉。
         现在按「地基→塔顶」跨度算缩放比，把整塔压进可视区（上下各留白），
         再与跟随视角按 overviewT 插值，得到统一的 {scale, centerY} 视图参数。 */
      /* 上下留白：顶部要避开 HUD(y=20/44/62) 与全览横幅(74–102)，故取 116。 */
      const VIEW_MARGIN_Y = 116;
      function overviewFit() {
        const e = towerExtent();
        const span = Math.max(140, e.bottom - e.top);
        const avail = Math.max(140, H - VIEW_MARGIN_Y * 2);
        const scale = clamp(avail / span, 0.08, 1);
        return { scale, span, extent: e, centerY: (e.top + e.bottom) / 2 };
      }
      /* 跟随视角：把塔顶固定在屏幕 y≈430（与原实现等价）。 */
      function currentTargetCam() {
        return towerTop().y - 430;
      }
      /* 统一视图：scale=1 时世界 x 不变、y 减 camY（等价旧渲染）；全览时整体缩小居中。 */
      function viewParams() {
        const t = clamp(overviewT, 0, 1);
        const followCenterY = camY + H / 2;
        if (t <= 0.0004) return { scale: 1, centerY: followCenterY };
        const fit = overviewFit();
        const scale = lerp(1, fit.scale, t);
        return { scale, centerY: lerp(followCenterY, fit.centerY, t) };
      }
      /* 世界坐标 → 屏幕坐标（供屏幕空间的层号/标注使用，避免文字被缩小）。 */
      function worldToScreen(view, x, y) {
        return {
          x: x * view.scale + W / 2 * (1 - view.scale),
          y: y * view.scale + H / 2 - view.centerY * view.scale,
        };
      }
      /* 吊臂小车 x：挑战模式用关卡固定 pivotX；经典模式滑移到塔顶正上方，
         这样「塔顶」永远落在钟摆摆幅的中心，不会出现塔没倒却再也够不到的必败局面。 */
      /* 吊臂小车的目标 x。挑战模式的 pivotX 在 content.pendulum 里（关卡数据契约），
         经典模式跟随塔顶中心并在 JIB_MIN..JIB_MAX 行程内。 */
      function jibTargetX() {
        if (mode === 'challenge' && chStage && chStage.content) {
          const cfg = chStage.content.pendulum || {};
          const fixed = Number(cfg.pivotX);
          if (Number.isFinite(fixed)) return clamp(fixed, 0, W);
          if (Number.isFinite(Number(chStage.content.pivotX))) return clamp(Number(chStage.content.pivotX), 0, W);
        }
        const top = towerTop();
        const topCenter = top ? top.x + top.w / 2 : PIVOT_X;
        return clamp(topCenter, JIB_MIN_X, JIB_MAX_X);
      }
      /* 实际吊臂位置：向目标平滑滑移（真实塔吊变幅需要时间，也避免整根吊臂瞬移跳变）。 */
      function jibPivotX() {
        return jibXCur;
      }

      function pendulumBoxScreen() {
        const ang = pend.angle;
        const pivotX = jibPivotX();
        const px = pivotX + Math.sin(ang) * pend.length;
        const py = PIVOT_Y + Math.cos(ang) * pend.length;
        return { x: px, y: py, angle: ang, pivotX };
      }

      /* 摆幅可达区间（当前振幅下吊钩中心能到的 x 范围）与落点可达性判定。
         用于 HUD 提示 + #test 门禁，避免「看不见的必败释放」。 */
      function swingReach() {
        const pivotX = jibPivotX();
        const amp = Math.abs(pend.angle) + Math.abs(pend.vel) / Math.sqrt(pend.gravity / pend.length);
        const span = Math.min(1, Math.sin(Math.min(Math.PI / 2, Math.max(0.08, amp)))) * pend.length;
        return { pivotX, amp, min: pivotX - span, max: pivotX + span };
      }
      function landingForecast(centerX) {
        const top = towerTop();
        if (!top) return { landable: false, perfect: false, overlap: 0, offset: 0, topCenter: W / 2 };
        const topCenter = top.x + top.w / 2;
        const offset = centerX - topCenter;
        const overlap = Math.min(centerX + BOX_W / 2, top.x + top.w) - Math.max(centerX - BOX_W / 2, top.x);
        return { landable: overlap > 6, perfect: overlap >= BOX_W * 0.85, overlap, offset, topCenter };
      }

      /* ---------- 每局主动道具 ---------- */
      function canBrace() {
        return Math.abs(towerLean) > BRACE_MIN_LEAN || Math.abs(leanVel) > BRACE_MIN_VEL;
      }
      function syncJoyTools() {
        Object.keys(joyButtons).forEach((id) => {
          const button = joyButtons[id];
          const active = id === 'guide' && guideArmed;
          const usable = id === 'guide'
            ? (mode === 'challenge'
              ? tools.guide > 0 && pendHasBox && !drop && !guideArmed
              : floorsReached >= 3 && pendHasBox && !drop && !guideArmed)
            : (mode === 'challenge' ? tools.brace > 0 && !drop : canBrace());
          const name = id === 'guide' ? '垂线预览' : '配重';
          const detail = id === 'guide' ? '显示下一箱落点投影' : '当前倾斜减半、角速度降至 25%';
          button.querySelector('[data-joy-count]').textContent = String(tools[id]);
          button.disabled = state !== 'playing' || tools[id] <= 0 || !usable;
          button.classList.toggle('is-armed', active);
          button.setAttribute('aria-pressed', String(active));
          button.setAttribute('aria-label', name + '，' + detail + '，剩余 ' + tools[id] + ' 次（快捷键 ' + (id === 'guide' ? '1' : '2') + '）');
        });
        if (typeof syncOverviewButton === 'function') syncOverviewButton();
      }
      function useJoy(id) {
        if (state !== 'playing' || !Object.prototype.hasOwnProperty.call(tools, id) || tools[id] <= 0) return false;
        if (id === 'guide') {
          if (mode !== 'challenge' && floorsReached < 3) return false;
          if (!pendHasBox || drop || guideArmed) return false;
          /* 次数在真正释放时扣；武装后放弃（暂停/离开）不会白白消耗。 */
          guideArmed = true;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('spring');
        } else if (id === 'brace') {
          if (!canBrace()) return false;
          tools.brace -= 1;
          towerLean *= 0.5;
          leanVel *= 0.25;
          /* 配重真实抵消一部分持久重心偏移（不只是压低瞬时晃动）。 */
          comMoment *= 0.75;
          computeComOffset();
          if (mode === 'challenge') {
            chAssisted = true;
            chToolsUsed.brace += 1;
          }
          feedback = { text: '配重稳住！', color: '#7ce8e0', life: 1.1 };
          A.Sfx.play('land');
        } else {
          return false;
        }
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      Object.keys(joyButtons).forEach((id) => {
        joyButtons[id].addEventListener('click', () => useJoy(id));
      });

      /* ---------- 全览（地图式缩放）：按钮 / 快捷键 3，切换时动画，期间禁止落箱 ---------- */
      const overviewBtn = document.querySelector('[data-overview-btn]');
      function syncOverviewButton() {
        if (!overviewBtn) return;
        const on = overviewActive || !!overviewReveal;
        overviewBtn.setAttribute('aria-pressed', String(overviewActive));
        overviewBtn.classList.toggle('is-armed', overviewActive);
        overviewBtn.disabled = state !== 'playing' && !overviewReveal;
        overviewBtn.setAttribute('aria-label', overviewActive ? '返回跟随视角（快捷键 3）' : '全览全塔（快捷键 3）');
        overviewBtn.querySelector('[aria-hidden]').textContent = on ? '🔙' : '🗺';
      }
      function toggleOverview() {
        if (state !== 'playing' || overviewReveal) return false;
        overviewActive = !overviewActive;
        A.Sfx.play('ui');
        syncOverviewButton();
        syncJoyTools();
        return overviewActive;
      }
      if (overviewBtn) overviewBtn.addEventListener('click', toggleOverview);
      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        const target = e.target;
        if (target && target.tagName) {
          const tag = target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        }
        if (e.key === '3') { e.preventDefault(); toggleOverview(); return; }
        const id = { '1': 'guide', '2': 'brace' }[e.key];
        if (!id) return;
        e.preventDefault();
        useJoy(id);
      });

      /* ---------- 流程 ---------- */
      function reset() {
        boxes = [];
        collapsed = [];
        drop = null;
        pend.angle = rand(0.75, 1.05) * (Math.random() > 0.5 ? 1 : -1);
        pend.vel = 0;
        pend.gravity = swingGravity(0);
        pendHasBox = true;
        pendReload = 0;
        towerLean = 0;
        leanVel = 0;
        jibXCur = PIVOT_X;
        comOffset = 0;
        comMoment = 0;
        comLoad = 0;
        cargoSeed = (Date.now() >>> 0) || 1;
        activeCargo = rollCargo();
        nextCargo = rollCargo();
        fragileArmed = true;
        overviewActive = false;
        overviewSettled = false;
        overviewT = 0;
        overviewHold = 0;
        overviewReveal = null;
        if (typeof syncOverviewButton === 'function') syncOverviewButton();
        camY = -474;
        score = 0;
        perfectCombo = 0;
        recordSaved = false;
        collapseTimer = 0;
        flash = 0;
        shakeVal = 0;
        floorsReached = 0;
        feedback = null;
        tools.guide = JOY_START.guide;
        tools.brace = JOY_START.brace;
        guideArmed = false;
        particles.clear();
        boxes.push({ x: W / 2 - 55, y: -44, w: 110, h: 44, base: true });
        boxes.push({ x: W / 2 - BOX_W / 2, y: -44 - BOX_H, w: BOX_W, h: BOX_H, cargo: CARGO_TYPES[0] });
        computeComOffset();
        syncHud();
        syncJoyTools();
      }

      function syncHud() {
        floorsReached = mode === 'challenge' ? chPlaced : Math.max(0, boxes.length - 2);
        if (mode === 'challenge') {
          syncChallengeHud();
          return;
        }
        dom.hudScore.textContent = String(score);
        dom.hudFloor.textContent = String(floorsReached);
        syncJoyTools();
      }

      function startGame() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
      }

      function finishRun(title, subtitle) {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('pendulum-tower', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        const showResult = () => {
          loop.pause();
          ui.show({
            title,
            text:
              `<span class="ac-score">${score}</span>` +
              (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
              subtitle +
              ` · ${floorsReached} 层`,
            btn: '再来一局',
            onBtn: showStart,
            result: '回看塔身',
          });
          pauseUi.sync(); syncJoyTools();
        };
        revealThen(showResult);
      }

      function gameOver() {
        finishRun('工程结束', '最终得分');
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        const opts = {
          title: '已暂停',
          text: '吊臂停住了。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge') {
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        }
        ui.show(opts);
        pauseUi.sync(); syncJoyTools();
      }

      function showStart() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        ui.show({
          title: '层塔',
          text: '钟摆叠箱：看准时机松手。<br/>钟摆会随层数慢慢加速<br/>偏心会让高塔晃动甚至倒塌 · 完美对齐有连击',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeAvailable ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }

      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(gameId);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }

      function showChallengePanel() {
        if (!challengeAvailable) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        if (chDom.back) chDom.back.hidden = false;
        loop.pause();
        state = 'challenge-menu';
        pauseUi.sync();
      }

      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        if (chDom.back) chDom.back.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }

      function backToStartFromPanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        showStart();
        pauseUi.sync();
        syncJoyTools();
      }

      function chCurrentSpec() {
        return chPlaced < chBoxesData.length ? chBoxesData[chPlaced] : null;
      }

      function chTargetOffset() {
        const spec = chCurrentSpec();
        return spec ? Number(spec.targetOffsetPx) || 0 : 0;
      }

      function chTolerance() {
        const spec = chCurrentSpec();
        return spec ? Number(spec.tolerancePx) || 8 : 8;
      }

      /* 挑战对齐判定：投影箱心 vs 关卡目标偏置（targetOffsetPx ± tolerancePx）。
       * 与经典的「85% 重叠」判定分开，避免把玩家引向错误位置。 */
      function challengeAlignState(centerX, targetOffsetPx, tolerancePx, baseCenterX) {
        const base = Number.isFinite(Number(baseCenterX)) ? Number(baseCenterX) : W / 2;
        const offset = Number(centerX) - (base + (Number(targetOffsetPx) || 0));
        const tol = Math.max(0, Number(tolerancePx) || 0);
        return { offsetPx: offset, tolerancePx: tol, aligned: Math.abs(offset) <= tol };
      }

      function challengeAlignNow(centerX) {
        const content = chStage && chStage.content ? chStage.content : {};
        return challengeAlignState(centerX, chTargetOffset(), chTolerance(), Number(content.baseCenterX) || W / 2);
      }

      function classicAlignState(centerX, topBox) {
        const overlap = Math.min(centerX + BOX_W / 2, topBox.x + topBox.w) - Math.max(centerX - BOX_W / 2, topBox.x);
        return { overlapPx: overlap, ratio: overlap / BOX_W, aligned: overlap >= BOX_W * 0.85 };
      }

      /* 0.10.0：连续「容差内」层数（逐层落箱后 marks 的最长连续 true 段）。 */
      function consecutiveWithinTolerance(marks) {
        let run = 0;
        let best = 0;
        (Array.isArray(marks) ? marks : []).forEach((mark) => {
          if (mark && mark.withinTolerance === true) {
            run += 1;
            if (run > best) best = run;
          } else {
            run = 0;
          }
        });
        return { current: run, best: best };
      }

      /* 0.10.0：塔顶中心相对 baseCenterX 的最终偏移（绝对值）。 */
      function finalTopCenterOffset() {
        const top = towerTop();
        if (!top) return null;
        const baseCenterX = Number(chStage && chStage.content ? chStage.content.baseCenterX : NaN);
        const base = Number.isFinite(baseCenterX) ? baseCenterX : W / 2;
        return Math.abs(top.x + top.w / 2 - base);
      }

      /* 0.10.0：交付中事件的文本（等待设计源同步，运行时不硬编码箱序/方案数）。 */
      function deliveryText() {
        const parts = [];
        if (chMinConsecutiveWithinTolerance !== null) {
          parts.push('连续容差内 ' + consecutiveWithinTolerance(chMarks).best + '/' + chMinConsecutiveWithinTolerance + ' 层');
        }
        if (chMaxFinalTopCenterOffsetPx !== null) {
          const offset = finalTopCenterOffset();
          parts.push('塔顶中心偏差 ' + (offset === null ? '—' : Math.round(offset * 10) / 10 + 'px') + '/' + chMaxFinalTopCenterOffsetPx + 'px');
        }
        return parts.join(' · ');
      }

      /* 挑战倾斜峰值：记录整局真实最大 |towerLean|，结算/复盘用它而不是当前瞬时值。 */
      function recordPeakLean() {
        chPeakLean = Math.max(chPeakLean, Math.abs(towerLean));
        return chPeakLean;
      }
      function peakLeanText() {
        return chPeakLean.toFixed(3);
      }

      function evaluationLevel() {
        const allWithin = chMarks.length > 0 && chMarks.every((mark) => mark.withinTolerance);
        const noTools = chToolsUsed.guide + chToolsUsed.brace === 0;
        const noMiss = chMisses === 0;
        if (allWithin && noTools && noMiss) return 'gold';
        if (allWithin) return 'silver';
        if (chMinConsecutiveWithinTolerance !== null && consecutiveWithinTolerance(chMarks).best < chMinConsecutiveWithinTolerance) return 'bronze';
        return 'bronze';
      }

      function evaluationLabel(level) {
        return { gold: '金牌：全标记达成且零道具零失误', silver: '银牌：全部标记在容差内', bronze: '铜牌：完成并保持稳定' }[level] || '—';
      }

      function buildChallengeStage(index) {
        const stage = challengeData[index];
        if (!stage) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = index;
        const content = stage.content || {};
        chBoxesData = (Array.isArray(content.boxes) ? content.boxes.slice() : []).sort((a, b) => (a.order || 0) - (b.order || 0));
        chMarks = [];
        chPlaced = 0;
        chMisses = 0;
        chElapsed = 0;
        chAssisted = false;
        chErrorReason = '';
        chLastResult = null;
        chEvaluation = null;
        chGoalHintTimer = 3;
        chHudSecond = -1;
        chLimits = Object.assign({ maxDroppedBoxes: 5, braceUsesAllowed: 0, guideUsesAllowed: 0 }, content.limits || {});
        chWin = Object.assign({ floorsAtLeast: chBoxesData.length, noCollapse: true, allMarkTargetsWithinTolerance: false }, content.win || {});
        /* 0.10.0：win 新增字段可缺省；null/undefined/负值/非法值 fail closed（视为不启用该门槛）。
         * 注意 Number(null)===0，必须先排除空值，否则显式 null 会被误读成门槛 0。 */
        const optNum = (value) => (value === null || value === undefined || value === '' ? null : (Number.isFinite(Number(value)) && Number(value) >= 0 ? Number(value) : null));
        const minRaw = optNum(chWin.minConsecutiveWithinTolerance);
        const maxRaw = optNum(chWin.maxFinalTopCenterOffsetPx);
        chMinConsecutiveWithinTolerance = minRaw === null ? null : Math.floor(minRaw);
        chMaxFinalTopCenterOffsetPx = maxRaw;
        chMaxLean = Number(chLimits.maxTowerLeanAbs) || LEAN_LIMIT;
        chPeakLean = 0;
        const pendulum = content.pendulum || {};
        pend.length = Number(pendulum.length) || PEND_LEN;
        pend.gravity = 680 * (Number(pendulum.speedFactor) || 1);
        pend.angle = Number(pendulum.deterministicStartPhaseRad) || 0;
        /* 设计只给起始角（0=垂直），需确定性初始角速度才能形成可预测摆幅（约 ±0.95rad，与经典一致）。 */
        pend.vel = 2.05 * (Number(pendulum.speedFactor) || 1);
        pend.damping = 0.006;
        const baseCenterX = Number(content.baseCenterX) || W / 2;
        boxes = [{ x: baseCenterX - 55, y: -44, w: 110, h: 44, base: true }];
        drop = null;
        collapsed = [];
        towerLean = 0;
        leanVel = 0;
        jibXCur = PIVOT_X;
        comOffset = 0;
        comMoment = 0;
        comLoad = 0;
        overviewActive = false;
        overviewSettled = false;
        overviewT = 0;
        overviewReveal = null;
        syncOverviewButton();
        camY = -474;
        score = 0;
        perfectCombo = 0;
        floorsReached = 0;
        collapseTimer = 0;
        flash = 0;
        shakeVal = 0;
        feedback = null;
        pendHasBox = true;
        pendReload = 0;
        guideArmed = false;
        chToolsUsed = { guide: 0, brace: 0 };
        tools.guide = Math.min(JOY_CAPS.guide, Math.max(0, Number(chLimits.guideUsesAllowed) || 0));
        tools.brace = Math.min(JOY_CAPS.brace, Math.max(0, Number(chLimits.braceUsesAllowed) || 0));
        particles.clear();
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) return;
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chElapsed);
        if (second === chHudSecond && state === 'playing') return;
        chHudSecond = second;
        const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0');
        const spec = chCurrentSpec();
        const targetText = spec ? '目标 ' + (Number(spec.targetOffsetPx) || 0) + 'px ±' + (Number(spec.tolerancePx) || 8) : '委托完成';
        chDom.hud.innerHTML =
          '<strong>' + chEsc(label + ' ' + chStage.title) + '</strong>' +
          '<span>' + chEsc(chStage.goalStatement || '') + '</span>' +
          '<span>楼层 ' + chPlaced + '/' + (chWin.floorsAtLeast || chBoxesData.length) + '</span>' +
          '<span>' + chEsc(targetText) + '</span>' +
          '<span>倾斜 ' + Math.abs(towerLean).toFixed(3) + '/' + chMaxLean + '</span>' +
          '<span>落空 ' + chMisses + '/' + (chLimits.maxDroppedBoxes || 0) + '</span>' +
          (deliveryText() ? '<span>交付核验：' + chEsc(deliveryText()) + '</span>' : '') +
          '<span>用时 ' + A.Challenge.formatTime(chElapsed) + '</span>';
      }

      function startChallenge(ref) {
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(gameId, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(gameId, stage.id)) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        state = 'playing';
        hideChallengePanel();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        syncChallengeHud();
        autosave.clear();
        autosave.saveNow();
        return true;
      }

      /* 挑战落箱：不自动吸附，按真实释放位置落箱；记录与目标偏置的偏差。 */
      function settleChallengeDrop() {
        const top = towerTop();
        const overlap = Math.min(drop.x + drop.w, top.x + top.w) - Math.max(drop.x, top.x);
        const baseCenterX = Number(chStage.content.baseCenterX) || W / 2;
        if (overlap < 6) {
          chMisses += 1;
          feedback = { text: '落空！', color: '#ff5d5d', life: 1.1 };
          A.Sfx.play('land');
          drop = null;
          syncHud();
          syncChallengeHud();
          if (chMisses > (chLimits.maxDroppedBoxes || 0)) {
            challengeFail('落空 ' + chMisses + ' 次，超过委托允许的 ' + chLimits.maxDroppedBoxes + ' 次');
          }
          return;
        }
        const center = drop.x + drop.w / 2;
        const actualOffset = Math.round((center - baseCenterX) * 10) / 10;
        const targetOffset = chTargetOffset();
        const tolerance = chTolerance();
        const within = Math.abs(actualOffset - targetOffset) <= tolerance;
        chMarks.push({ order: chPlaced + 1, targetOffsetPx: targetOffset, actualOffsetPx: actualOffset, tolerancePx: tolerance, withinTolerance: within });
        chPlaced += 1;
        const y = top.y - drop.h;
        boxes.push({ x: drop.x, y, w: drop.w, h: drop.h });
        const e = center - (top.x + top.w / 2);
        leanVel += e * 0.006 * (1 + chPlaced * 0.02);
        /* 挑战重量归一化：关卡目标 ±12px、5–6 层，统一真实箱重 1；
         * 只累积真实重心投影（低增益），不改变 targetOffsetPx/tolerancePx 判定语义。 */
        comMoment += (center - baseCenter()) * 1;
        computeComOffset();
        perfectCombo = 0;
        feedback = { text: (within ? '标记内 ' : '偏离 ') + Math.round(actualOffset) + 'px', color: within ? '#ffd23f' : '#93a0c8', life: 1.1 };
        A.Sfx.play(within ? 'perfect' : 'land');
        particles.emit(center, y + drop.h, {
          count: A.reducedMotion ? 6 : 14,
          speed: [30, 140],
          angle: [Math.PI * 1.05, Math.PI * 1.95],
          life: [0.25, 0.6],
          size: [2, 4],
          colors: within ? ['#ffd23f', '#ffffff'] : ['#c9a06b', '#8a6a43'],
          gravity: 500,
        });
        drop = null;
        syncHud();
        syncChallengeHud();
        autosave.saveNow();
      }

      function updateChallenge(dt) {
        particles.update(dt);
        flash = Math.max(0, flash - dt);
        shakeVal = Math.max(0, shakeVal - dt * 20);
        if (feedback) {
          feedback.life -= dt;
          if (feedback.life <= 0) feedback = null;
        }
        leanMeter = chMaxLean > 0 ? clamp(Math.abs(towerLean) / chMaxLean, 0, 1) : 0;
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chElapsed += dt;
        chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
        A.Physics.pendulumStep(pend, dt);
        if (!pendHasBox) {
          pendReload -= dt;
          if (pendReload <= 0) {
            pendHasBox = true;
            syncJoyTools();
          }
        }
        /* 挑战：瞬时晃动弹簧 + 持久重心 restoring；chMaxLean 仍按关卡数据判定，
         * 重心力用较小增益避免已有关卡字面不可解（挑战目标最大 ±12px）。 */
        const stiffness = 6.2;
        const damp = 0.9;
        const comGain = 0.0016;
        const equilibrium = comGain * comOffset;
        leanVel += (-stiffness * (towerLean - equilibrium) - damp * leanVel) * dt;
        towerLean += leanVel * dt;
        recordPeakLean();
        if (Math.abs(towerLean) > chMaxLean) {
          challengeFail('塔身倾斜 ' + peakLeanText() + ' 超过委托上限 ' + chMaxLean + '，结构失稳');
          input.endFrame();
          return;
        }
        if (drop) {
          drop.prevBottom = drop.y + drop.h;
          drop.vy += GRAVITY * dt;
          drop.y += drop.vy * dt;
          drop.squash = Math.max(0, drop.squash - dt);
          const top = towerTop();
          if (drop.vy > 0 && drop.prevBottom <= top.y + 1 && drop.y + drop.h >= top.y) {
            settleChallengeDrop();
          } else if (drop && drop.y > camY + H + 120) {
            drop = null;
            chMisses += 1;
            syncChallengeHud();
            if (chMisses > (chLimits.maxDroppedBoxes || 0)) {
              challengeFail('落空 ' + chMisses + ' 次，超过委托允许的 ' + chLimits.maxDroppedBoxes + ' 次');
              input.endFrame();
              return;
            }
          }
        }
        const spaceNow = input.isDown(' ');
        if (!overviewActive && !overviewReveal && (input.pointer.wentDown || (spaceNow && !updateChallenge._space))) releaseBox();
        updateChallenge._space = spaceNow;
        camY = lerp(camY, currentTargetCam(), Math.min(1, 4 * dt));
        /* 吊臂平滑滑移（~0.2s 时间常数），避免非完美落箱后整根吊臂瞬移。 */
        jibXCur = lerp(jibXCur, jibTargetX(), Math.min(1, 12 * dt));
        if (!drop && chPlaced >= (chWin.floorsAtLeast || chBoxesData.length) && Math.abs(towerLean) <= chMaxLean * 0.98 && Math.abs(leanVel) < 0.4) {
          challengeClear();
          input.endFrame();
          return;
        }
        syncChallengeHud();
        input.endFrame();
      }

      /* 0.10.0：交付前门槛（纯函数，便于 regression 用注入数据覆盖正反例）。
       * 只消费 win 数据，缺省即不启用，旧关零回归。 */
      function evaluateWinGates(marks, minConsecutive, maxOffsetPx, finalOffsetPx) {
        if (minConsecutive !== null && consecutiveWithinTolerance(marks).best < minConsecutive) {
          return '连续容差内仅 ' + consecutiveWithinTolerance(marks).best + ' 层，未达到 ' + minConsecutive + ' 层';
        }
        if (maxOffsetPx !== null) {
          if (finalOffsetPx === null || finalOffsetPx > maxOffsetPx) {
            return '塔顶中心偏差 ' + (finalOffsetPx === null ? '—' : Math.round(finalOffsetPx * 10) / 10 + 'px') + ' 超过 ' + maxOffsetPx + 'px';
          }
        }
        return '';
      }

      function challengeWinBlocker() {
        return evaluateWinGates(chMarks, chMinConsecutiveWithinTolerance, chMaxFinalTopCenterOffsetPx, finalTopCenterOffset());
      }

      function challengeClear() {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'revealing' || state === 'cleared' || state === 'failed') return false;
        const blocker = challengeWinBlocker();
        if (blocker) return challengeFail('未满足交付条件：' + blocker);
        chGoalHintTimer = 0;
        autosave.clear();
        syncJoyTools();
        chEvaluation = evaluationLevel();
        const result = { timeSec: Math.round(chElapsed * 10) / 10, assisted: chAssisted, collectibles: [] };
        chLastResult = result;
        if (A.Challenge) A.Challenge.markCleared(gameId, chStage.id, result);
        const isLast = chStageIndex >= challengeData.length - 1;
        const marksText = chMarks.map((mark) => mark.order + ':' + mark.actualOffsetPx + 'px' + (mark.withinTolerance ? '✓' : '✗')).join(' ');
        const delivery = deliveryText();
        const resultText =
          A.Challenge.resultHtml(chStage, result) +
          '<p class="ac-challenge-tip">' + chEsc(evaluationLabel(chEvaluation)) + '<br/>落点 ' + chEsc(marksText || '—') + ' · 落空 ' + chMisses + ' · 倾斜峰值 ' + peakLeanText() + '</p>' +
          (delivery ? '<p class="ac-challenge-result-row">交付核验：' + chEsc(delivery) + '</p>' : '');
        state = 'revealing';
        revealThen(() => {
          state = 'cleared';
          loop.pause();
          ui.show({
            title: '挑战通关',
            text: resultText,
            btn: isLast ? '返回选关' : '下一关',
            onBtn: () => {
              if (isLast) exitToChallengeSelect();
              else startChallenge(challengeData[chStageIndex + 1].id);
            },
            btn2: '重玩本关',
            onBtn2: () => startChallenge(chStage.id),
            result: '回看塔身',
          });
          pauseUi.sync();
          syncJoyTools();
          syncChallengeHud();
        });
        return true;
      }

      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared' || state === 'revealing') return false;
        chErrorReason = reason || '本关失败';
        chEvaluation = evaluationLevel();
        autosave.clear();
        syncJoyTools();
        const stageTitle = chStage.goalStatement || '';
        const placed = chPlaced;
        const delivery = (chMinConsecutiveWithinTolerance !== null || chMaxFinalTopCenterOffsetPx !== null) ? deliveryText() : '';
        state = 'revealing';
        revealThen(() => {
          state = 'failed';
          loop.pause();
          ui.show({
            title: '挑战失败',
            text:
              '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
              '<p class="ac-challenge-result-row">本关目标：' + chEsc(stageTitle) + ' · 已放 ' + placed + ' 层</p>' +
              (delivery ? '<p class="ac-challenge-result-row">交付核验：' + chEsc(delivery) + '</p>' : ''),
            btn: '重试本关',
            onBtn: () => startChallenge(chStage.id),
            btn2: '返回选关',
            onBtn2: exitToChallengeSelect,
            result: '回看塔身',
          });
          pauseUi.sync();
          syncChallengeHud();
        });
        return true;
      }

      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chMarks = [];
        chLastResult = null;
        chErrorReason = '';
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showChallengePanel();
        return true;
      }

      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chMarks = [];
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showStart();
        return true;
      }

      /* 挑战恢复归一化：按 classic 的字段校验方式恢复 drop/tools 次数/guideArmed 等（全部 clamp）。
       * 关键点：下落中的 drop 要原样恢复（pendHasBox 必为 false），不能靠"重给一箱"续玩；
       * 工具剩余次数按关卡允许上限 clamp，避免刷新补回额度。 */
      function normalizeChallengeRestore(data, caps) {
        const guideCap = clamp(Math.floor(Number(caps && caps.guide)), 0, JOY_CAPS.guide);
        const braceCap = clamp(Math.floor(Number(caps && caps.brace)), 0, JOY_CAPS.brace);
        const d = data && typeof data === 'object' ? data : {};
        let drop = null;
        if (d.drop && isFinite(d.drop.x) && isFinite(d.drop.y)) {
          drop = {
            x: Number(d.drop.x),
            y: Number(d.drop.y),
            w: clamp(Number(d.drop.w) || BOX_W, 20, 200),
            h: clamp(Number(d.drop.h) || BOX_H, 12, 80),
            vy: Number(d.drop.vy) || 0,
            prevBottom: Number(d.drop.prevBottom) || 0,
            missed: !!d.drop.missed,
            squash: Number(d.drop.squash) || 0,
          };
        }
        /* drop 在飞：必须恢复 drop 且 pendHasBox=false，避免刷新重给一箱；
         * 无 drop（上一箱已落定、正处于补箱读秒）：沿用 0.8.6 挑战续玩语义，恢复后钟摆持有 1 只箱，
         * 不产生额外箱子（否则会与既有挑战续玩测试 CH-PT-004 的「钟摆有箱」契约冲突）。 */
        const hasBox = drop ? false : true;
        let reload = hasBox ? 0 : clamp(Number(d.pendReload) || 0, 0, 2);
        if (!hasBox && !drop && reload <= 0) reload = 0.55;
        const toolsNext = {
          guide: d.tools && Number.isFinite(Number(d.tools.guide)) ? clamp(Math.floor(Number(d.tools.guide)), 0, guideCap) : guideCap,
          brace: d.tools && Number.isFinite(Number(d.tools.brace)) ? clamp(Math.floor(Number(d.tools.brace)), 0, braceCap) : braceCap,
        };
        const guideArmedNext = !!d.guideArmed && hasBox && !drop && toolsNext.guide > 0;
        return { drop, pendHasBox: hasBox, pendReload: reload, tools: toolsNext, guideArmed: guideArmedNext };
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(gameId, data.stageId);
        if (!stage) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        /* buildChallengeStage 已按关卡 limits 写好初始额度，以此作为恢复时 clamp 的上限。 */
        const caps = { guide: tools.guide, brace: tools.brace };
        if (Array.isArray(data.boxes) && data.boxes.length >= 1) {
          boxes = data.boxes
            .filter((box) => box && isFinite(box.x) && isFinite(box.y))
            .map((box) => ({ x: Number(box.x), y: Number(box.y), w: clamp(Number(box.w), 20, 200), h: clamp(Number(box.h), 12, 80), base: !!box.base }));
          if (!boxes.length || !boxes[0].base) return false;
        }
        if (data.pend && isFinite(data.pend.angle)) {
          pend.angle = Number(data.pend.angle);
          pend.vel = Number(data.pend.vel) || 0;
          pend.length = clamp(Number(data.pend.length) || pend.length, 40, 320);
          pend.gravity = Number(data.pend.gravity) || pend.gravity;
        }
        chPlaced = Math.max(0, Number(data.chPlaced) || 0);
        chMisses = Math.max(0, Number(data.chMisses) || 0);
        chMarks = Array.isArray(data.chMarks) ? data.chMarks.filter((mark) => mark && typeof mark === 'object') : [];
        chElapsed = Math.max(0, Number(data.chElapsed) || 0);
        chAssisted = !!data.chAssisted;
        chToolsUsed = data.chToolsUsed && typeof data.chToolsUsed === 'object' ? { guide: Number(data.chToolsUsed.guide) || 0, brace: Number(data.chToolsUsed.brace) || 0 } : { guide: 0, brace: 0 };
        towerLean = Number(data.towerLean) || 0;
        leanVel = Number(data.leanVel) || 0;
        /* 新增重心字段缺省值：旧档无字段时按箱体几何重算（挑战箱统一重量 1）。 */
        if (Number.isFinite(Number(data.comOffset)) && Number.isFinite(Number(data.comMoment))) {
          comOffset = Number(data.comOffset);
          comMoment = Number(data.comMoment);
          comLoad = Number(data.comLoad) || 0;
        } else {
          comMoment = 0;
          computeComOffset();
        }
        overviewActive = false;
        overviewSettled = false;
        overviewT = 0;
        overviewReveal = null;
        camY = Number(data.camY) || -474;
        /* 恢复 drop / pendHasBox / pendReload / tools / guideArmed（不再强制 drop=null 重给一箱）。 */
        const restored = normalizeChallengeRestore(data, caps);
        drop = restored.drop;
        pendHasBox = restored.pendHasBox;
        pendReload = restored.pendReload;
        tools.guide = restored.tools.guide;
        tools.brace = restored.tools.brace;
        guideArmed = restored.guideArmed;
        chPeakLean = Math.abs(towerLean);
        chEvaluation = null;
        chErrorReason = '';
        state = 'playing';
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function challengeObservable() {
        const top = towerTop();
        const pb = pendulumBoxScreen();
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageNumber: chStage ? chStage.stageNumber : null,
          state,
          boxes: boxes.map((box) => ({ x: box.x, y: box.y, w: box.w, h: box.h, base: !!box.base })),
          floors: chPlaced,
          floorsRequired: chWin.floorsAtLeast || chBoxesData.length,
          top: { x: top.x, y: top.y },
          pendulum: { x: pb.x, y: pb.y, angle: pb.angle, vel: pend.vel, hasBox: pendHasBox },
          drop: drop ? { x: drop.x, y: drop.y } : null,
          towerLean,
          leanVel,
          maxLean: chMaxLean,
          peakLean: chPeakLean,
          marks: chMarks.slice(),
          consecutiveWithinTolerance: consecutiveWithinTolerance(chMarks),
          minConsecutiveWithinTolerance: chMinConsecutiveWithinTolerance,
          maxFinalTopCenterOffsetPx: chMaxFinalTopCenterOffsetPx,
          finalTopCenterOffsetPx: finalTopCenterOffset(),
          currentTargetOffsetPx: chTargetOffset(),
          currentTolerancePx: chTolerance(),
          misses: chMisses,
          maxDroppedBoxes: chLimits.maxDroppedBoxes,
          tools: { guide: tools.guide, brace: tools.brace },
          toolsUsed: { guide: chToolsUsed.guide, brace: chToolsUsed.brace },
          assisted: chAssisted,
          elapsedSec: Math.round(chElapsed * 10) / 10,
          goalStatement: chStage ? chStage.goalStatement : null,
          evaluation: chEvaluation,
          errorReason: chErrorReason,
          cleared: !!chLastResult,
        };
      }

      /* 测试便捷钩子：在钟摆箱中心到达 baseCenterX+offset 的下一帧立即松手（仍是真实 releaseBox 物理）。 */
      function releaseWhenAligned(offset, tolerance) {
        if (mode !== 'challenge' || state !== 'playing') return Promise.resolve(false);
        const baseCenterX = Number(chStage.content.baseCenterX) || W / 2;
        const target = baseCenterX + (Number(offset) || 0);
        const tol = Math.max(1, Number(tolerance) || 6);
        const started = performance.now();
        return new Promise((resolve) => {
          function check() {
            if (mode !== 'challenge' || state !== 'playing' || !pendHasBox || drop) {
              resolve(false);
              return;
            }
            const p = pendulumBoxScreen();
            if (Math.abs(p.x - target) <= tol) {
              releaseBox();
              resolve(true);
              return;
            }
            if (performance.now() - started > 9000) {
              resolve(false);
              return;
            }
            requestAnimationFrame(check);
          }
          requestAnimationFrame(check);
        });
      }


      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: mode === 'challenge' && chStage ? chStage.id : null,
          chPlaced,
          chMisses,
          chMarks: chMarks.slice(),
          chElapsed,
          chAssisted,
          chToolsUsed: { guide: chToolsUsed.guide, brace: chToolsUsed.brace },
          boxes: boxes.map((b) => ({ x: b.x, y: b.y, w: b.w, h: b.h, base: !!b.base, cargo: b.cargo ? b.cargo.id : null })),
          drop: drop
            ? { x: drop.x, y: drop.y, w: drop.w, h: drop.h, vy: drop.vy, prevBottom: drop.prevBottom, missed: !!drop.missed, squash: drop.squash, cargo: drop.cargo ? drop.cargo.id : null }
            : null,
          pend: { angle: pend.angle, vel: pend.vel, length: pend.length, gravity: pend.gravity, damping: pend.damping },
          pendHasBox,
          pendReload,
          towerLean,
          leanVel,
          comOffset,
          comMoment,
          comLoad,
          cargoSeed,
          activeCargo: activeCargo.id,
          nextCargo: nextCargo.id,
          fragileArmed,
          camY,
          score,
          perfectCombo,
          floorsReached,
          tools: { guide: tools.guide, brace: tools.brace },
          guideArmed,
        };
      }

      function restoreClassic(data) {
        if (!data || !Array.isArray(data.boxes) || data.boxes.length < 2) return false;
        try {
          reset();
          boxes = data.boxes
            .filter((b) => b && isFinite(b.x) && isFinite(b.y) && isFinite(b.w) && isFinite(b.h))
            .map((b) => ({
              x: Number(b.x),
              y: Number(b.y),
              w: clamp(Number(b.w), 20, 200),
              h: clamp(Number(b.h), 12, 80),
              base: !!b.base,
              cargo: CARGO_TYPES.find((c) => c.id === b.cargo) || CARGO_TYPES[0],
            }));
          if (boxes.length < 2) return false;
          if (data.drop && isFinite(data.drop.x) && isFinite(data.drop.y)) {
            drop = {
              x: Number(data.drop.x),
              y: Number(data.drop.y),
              w: BOX_W,
              h: BOX_H,
              vy: Number(data.drop.vy) || 0,
              prevBottom: Number(data.drop.prevBottom) || 0,
              missed: !!data.drop.missed,
              squash: Number(data.drop.squash) || 0,
              cargo: CARGO_TYPES.find((c) => c.id === data.drop.cargo) || activeCargo,
            };
          } else {
            drop = null;
          }
          if (data.pend && isFinite(data.pend.angle)) {
            pend.angle = Number(data.pend.angle);
            pend.vel = Number(data.pend.vel) || 0;
            pend.length = PEND_LEN;
            pend.gravity = Number(data.pend.gravity) || swingGravity(0);
          }
          pendHasBox = data.pendHasBox !== false;
          pendReload = Number(data.pendReload) || 0;
          towerLean = Number(data.towerLean) || 0;
          leanVel = Number(data.leanVel) || 0;
          /* 新增重心/属性字段缺省值：旧档无字段时从箱体几何反推，保持兼容。 */
          cargoSeed = Number.isFinite(Number(data.cargoSeed)) ? (Number(data.cargoSeed) >>> 0) : (Date.now() >>> 0) || 1;
          activeCargo = CARGO_TYPES.find((c) => c.id === data.activeCargo) || CARGO_TYPES[0];
          nextCargo = CARGO_TYPES.find((c) => c.id === data.nextCargo) || CARGO_TYPES[0];
          fragileArmed = data.fragileArmed !== false;
          if (Number.isFinite(Number(data.comOffset)) && Number.isFinite(Number(data.comMoment))) {
            comOffset = Number(data.comOffset);
            comMoment = Number(data.comMoment);
            comLoad = Number(data.comLoad) || 0;
          } else {
            comMoment = 0;
            computeComOffset();
          }
          camY = Number(data.camY) || -474;
          score = Math.max(0, Number(data.score) || 0);
          perfectCombo = Math.max(0, Number(data.perfectCombo) || 0);
          tools.guide = data.tools && Number.isFinite(Number(data.tools.guide))
            ? clamp(Math.floor(Number(data.tools.guide)), 0, JOY_CAPS.guide)
            : JOY_START.guide;
          tools.brace = data.tools && Number.isFinite(Number(data.tools.brace))
            ? clamp(Math.floor(Number(data.tools.brace)), 0, JOY_CAPS.brace)
            : JOY_START.brace;
          guideArmed = !!data.guideArmed;
          recordSaved = false;
          syncHud();
          guideArmed = guideArmed && pendHasBox && !drop && floorsReached >= 3;
          updateSwingDifficulty();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      /* 统一恢复入口：0.8 及更早存档缺 mode 一律按经典恢复；mode:'challenge' 走挑战恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      const autosave = A.createRunAutosave('pendulum-tower', serialize, {
        every: 4,
        meta: () => ({ score, summary: mode === 'challenge' && chStage ? '挑战 ' + chStage.id + ' · ' + chPlaced + ' 层' : `得分 ${score} · ${floorsReached} 层` }),
      });

      /* ---------- 松手放箱 ---------- */
      function releaseBox(force) {
        if (!force && (overviewActive || overviewReveal)) return;
        if (!pendHasBox || drop) return;
        const p = pendulumBoxScreen();
        pendHasBox = false;
        pendReload = 0.55;
        drop = {
          x: p.x - BOX_W / 2,
          y: p.y + camY - BOX_H / 2,
          w: BOX_W,
          h: BOX_H,
          vy: 60,
          prevBottom: 0,
          landed: false,
          squash: 0,
          cargo: activeCargo,
        };
        drop.prevBottom = drop.y + drop.h;
        const usedGuide = guideArmed;
        guideArmed = false;
        if (usedGuide) {
          tools.guide = Math.max(0, tools.guide - 1);
          if (mode === 'challenge') {
            chAssisted = true;
            chToolsUsed.guide += 1;
          }
        }
        syncJoyTools();
        A.Sfx.play('ui');
        if (usedGuide) autosave.saveNow();
      }

      function settleDrop() {
        const top = towerTop();
        const overlap = Math.min(drop.x + drop.w, top.x + top.w) - Math.max(drop.x, top.x);
        const e = drop.x + drop.w / 2 - (top.x + top.w / 2);

        const cargo = drop.cargo || CARGO_TYPES[0];
        let points = 10;
        let perfect = false;
        if (overlap >= BOX_W * 0.85) {
          drop.x = top.x;
          perfectCombo += 1;
          points = 10 + perfectCombo * 10;
          perfect = true;
          flash = 0.5;
          A.Sfx.play('perfect');
          particles.emit(drop.x + drop.w / 2, drop.y, {
            count: A.reducedMotion ? 8 : 22,
            speed: [60, 220],
            angle: [Math.PI * 1.05, Math.PI * 1.95],
            life: [0.3, 0.7],
            size: [2, 4],
            colors: ['#ffd23f', '#ffffff'],
            gravity: 500,
          });
          leanVel += e * 0.0006;
        } else if (overlap > 6) {
          perfectCombo = 0;
          A.Sfx.play('land');
          particles.emit(drop.x + drop.w / 2, drop.y + drop.h, {
            count: 6,
            speed: [30, 120],
            angle: [Math.PI * 0.1, Math.PI * 0.9],
            life: [0.2, 0.5],
            size: [2, 4],
            colors: ['#c9a06b', '#8a6a43'],
            gravity: 600,
          });
          const n = boxes.length - 1;
          /* 瞬时晃动冲量保留，但不再作为唯一稳定性来源。 */
          leanVel += e * 0.006 * (1 + n * 0.022);
        } else {
          perfectCombo = 0;
          drop.missed = true;
          feedback = { text: '落空！', color: '#ff5d5d', life: 1.1 };
        }

        if (!drop.missed) {
          drop.y = top.y - drop.h;
          const heightGain = 1 + (boxes.length - 1) * 0.06;
          /* 0.12.1：力矩用「吸附后的真实偏移」计算，而不是吸附前的 e。
             旧实现完美分支会把 drop.x 吸附到 top.x（几何偏移归零）却仍按吸附前的 e 累积力矩，
             于是「每次都完美但偏 +9.5px」能堆出 comOffset=0 却 comMoment 很大、塔永久歪而不倒。 */
          const settledE = drop.x + drop.w / 2 - (top.x + top.w / 2);
          comMoment += settledE * cargo.weight * heightGain;
          boxes.push({ x: drop.x, y: drop.y, w: drop.w, h: drop.h, cargo });
          computeComOffset();
          /* 属性真实生效：重量放大瞬时冲量；奖励直接加分；易碎箱仅在稳稳落定时一次性奖励。 */
          points += cargo.bonus;
          /* 反馈文案前缀始终是方向/偏差（保持既有「偏右 18px」语义），属性信息追加在后。 */
          const alignText = perfect ? '完美对齐 +' + (10 + perfectCombo * 10) : (e < 0 ? '偏左 ' : '偏右 ') + Math.round(Math.abs(e)) + 'px';
          if (cargo.id === 'fragile') {
            if (perfect && fragileArmed) {
              points += 20;
              fragileArmed = false;
              feedback = { text: alignText + ' · 🍷 易碎箱稳放 +20', color: '#ff9ac2', life: 1.4 };
            } else {
              feedback = { text: alignText + ' · 🍷 易碎箱轻放', color: '#ff9ac2', life: 1.1 };
            }
          } else {
            feedback = {
              text: alignText + (cargo.bonus ? ' · ' + cargo.icon + cargo.label + ' +' + cargo.bonus : (perfect ? '' : ' · +10')),
              color: perfect ? '#ffd23f' : '#93a0c8',
              life: 1.1,
            };
          }
          score += points;
          /* 下一箱属性入钩，保持确定性可预告。 */
          activeCargo = nextCargo;
          nextCargo = rollCargo();
          drop.squash = 0.25;
          drop = null;
          syncHud();
          updateSwingDifficulty();
        }
      }

      function startCollapse() {
        state = 'collapse';
        collapseTimer = 1.5;
        autosave.clear();
        A.Sfx.play('crash');
        shakeVal = A.reducedMotion ? 0 : 9;
        const dir = towerLean > 0 ? 1 : -1;
        boxes.forEach((b, i) => {
          collapsed.push({
            x: b.x,
            y: b.y,
            w: b.w,
            h: b.h,
            vx: dir * rand(30, 140) * (i / boxes.length),
            vy: rand(-60, -10),
            rot: 0,
            vr: dir * rand(0.6, 2.4),
            base: b.base,
            cargo: b.cargo || null,
          });
        });
        boxes = [];
      }

      /* ---------- 更新 ---------- */
      /* 全览缩放插值：0.45s 动画；减少动态偏好下静态瞬切。 */
      function updateOverview(dt) {
        const goal = overviewActive || overviewReveal || overviewSettled ? 1 : 0;
        if (A.reducedMotion) overviewT = goal;
        else overviewT += (goal - overviewT) * Math.min(1, 8 * dt);
        if (overviewReveal) {
          overviewReveal.remaining -= dt;
          if (overviewReveal.remaining <= 0) {
            const done = overviewReveal.after;
            overviewReveal = null;
            overviewActive = false;
            /* 0.12.1：拉远完成后保持全塔缩放视图，让结算弹层出现时仍能看完整塔身；
               旧实现这里把 overviewT 归 0，导致弹层一出现就缩回只看得见塔顶的 1:1。 */
            overviewSettled = true;
            if (done) done();
          }
        } else if (overviewHold > 0) {
          overviewHold = Math.max(0, overviewHold - dt);
        }
      }

      /* 结算前动画式拉远全塔（<=1s）；减少动态偏好下静态瞬切。 */
      function revealThen(after) {
        if (overviewReveal) return;
        const duration = A.reducedMotion ? 0.06 : 0.9;
        overviewActive = false;
        overviewReveal = { remaining: duration, after };
        syncOverviewButton();
        syncJoyTools();
      }

      function update(dt) {
        if (mode === 'challenge') {
          updateChallenge(dt);
          updateOverview(dt);
          return;
        }
        updateOverview(dt);
        particles.update(dt);
        flash = Math.max(0, flash - dt);
        shakeVal = Math.max(0, shakeVal - dt * 20);
        if (feedback) {
          feedback.life -= dt;
          if (feedback.life <= 0) feedback = null;
        }
        leanMeter = clamp(Math.abs(towerLean) / LEAN_LIMIT, 0, 1);

        if (state === 'collapse') {
          collapseTimer -= dt;
          collapsed.forEach((b) => {
            b.vy += GRAVITY * dt;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.rot += b.vr * dt;
          });
          if (collapseTimer <= 0) gameOver();
          input.endFrame();
          return;
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);

        A.Physics.pendulumStep(pend, dt);
        if (!pendHasBox) {
          pendReload -= dt;
          if (pendReload <= 0) {
            pendHasBox = true;
            syncJoyTools();
          }
        }

        /* 持久重心模型：弹簧平衡点由 comOffset 决定，不再总是回归 0；
         * 同时 comMoment 产生的静态倾斜使持续偏心最终超出支撑面而倒塌。 */
        computeComOffset();
        const stiffness = 6.2;
        const damp = 0.9;
        const comGain = 0.0075;
        const equilibrium = clamp(comGain * comOffset + comMoment * 0.00035, -LEAN_LIMIT * 1.6, LEAN_LIMIT * 1.6);
        const leanAcc = -stiffness * (towerLean - equilibrium) - damp * leanVel;
        leanVel += leanAcc * dt;
        towerLean += leanVel * dt;
        /* 倒塌判定：瞬时倾角硬极限，或重心投影持续超出支撑面（带轻微宽限避免单箱误杀）。 */
        const supportExceeded = Math.abs(comOffset) > STABILITY_LIMIT && Math.abs(towerLean) > LEAN_LIMIT * 0.34;
        if (Math.abs(towerLean) > LEAN_LIMIT || supportExceeded) {
          startCollapse();
          return;
        }

        if (drop) {
          drop.prevBottom = drop.y + drop.h;
          drop.vy += GRAVITY * dt;
          drop.y += drop.vy * dt;
          drop.squash = Math.max(0, drop.squash - dt);
          const top = towerTop();
          if (drop.missed) {
            if (drop.y + drop.h >= BASE_Y) {
              particles.emit(drop.x + drop.w / 2, BASE_Y, {
                count: 14,
                speed: [40, 200],
                angle: [Math.PI * 1.1, Math.PI * 1.9],
                life: [0.3, 0.7],
                size: [2, 5],
                colors: ['#c9a06b', '#7a5222', '#ffffff'],
                gravity: 700,
              });
              A.Sfx.play('explode');
              drop = null;
              finishRun('地基失守', '箱子完全落空 · 最终得分');
              input.endFrame();
              return;
            }
          } else if (drop.vy > 0 && drop.prevBottom <= top.y + 1 && drop.y + drop.h >= top.y) {
            settleDrop();
          }
          if (drop && drop.y > camY + H + 120) {
            drop = null;
            finishRun('地基失守', '箱子完全落空 · 最终得分');
            input.endFrame();
            return;
          }
        }

        /* 松手输入（指针边沿 / 空格边沿）；全览期间不允许落箱。 */
        const spaceNow = input.isDown(' ');
        if (!overviewActive && !overviewReveal && (input.pointer.wentDown || (spaceNow && !update._space))) releaseBox();
        update._space = spaceNow;

        camY = lerp(camY, currentTargetCam(), Math.min(1, 4 * dt));
        /* 吊臂平滑滑移（~0.2s 时间常数），避免非完美落箱后整根吊臂瞬移。 */
        jibXCur = lerp(jibXCur, jibTargetX(), Math.min(1, 12 * dt));

        const braceUsable = canBrace();
        if (update._braceUsable !== braceUsable) {
          update._braceUsable = braceUsable;
          syncJoyTools();
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      /* 工地集装箱：波纹侧板 + 角件 + 编号 + 属性色带/图标。 */
      function drawCrate(x, y, w, h, opts) {
        const o = Object.assign({ squash: 0, alpha: 1, cargo: null, floor: 0 }, opts);
        const cargo = o.cargo || CARGO_TYPES[0];
        ctx.save();
        ctx.globalAlpha = o.alpha;
        const sy = 1 - o.squash * 0.4;
        const sx = 1 + o.squash * 0.4;
        ctx.translate(x + w / 2, y + h);
        ctx.scale(sx, sy);
        ctx.translate(-(x + w / 2), -(y + h));
        /* 箱体底色 */
        ctx.fillStyle = cargo.color;
        ctx.fillRect(x, y, w, h);
        /* 竖向波纹板 */
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1;
        for (let gx = x + 6; gx < x + w - 4; gx += 7) {
          ctx.beginPath();
          ctx.moveTo(gx, y + 4);
          ctx.lineTo(gx, y + h - 4);
          ctx.stroke();
        }
        /* 上下横梁 + 四角角件 */
        ctx.fillStyle = cargo.trim;
        ctx.fillRect(x, y, w, 5);
        ctx.fillRect(x, y + h - 5, w, 5);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        [[x + 2, y + 2], [x + w - 8, y + 2], [x + 2, y + h - 8], [x + w - 8, y + h - 8]].forEach((p) => {
          ctx.fillRect(p[0], p[1], 6, 6);
        });
        /* 属性色带 + 图标 + 箱号（可读提示） */
        ctx.fillStyle = cargo.trim;
        ctx.fillRect(x + 2, y + h / 2 - 7, 14, 14);
        ctx.font = 'bold 11px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.fillText(cargo.icon, x + 9, y + h / 2);
        ctx.textAlign = 'left';
        ctx.font = 'bold 9px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.fillText('SK-' + String(o.floor || 0).padStart(2, '0') + '-' + cargo.id.slice(0, 2).toUpperCase(), x + 20, y + h - 12);
        ctx.strokeStyle = cargo.trim;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
        ctx.restore();
      }

      function drawSky() {
        /* 工地黄昏：暖灰天空 + 远处城市剪影 + 地面。 */
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#3b4a5e');
        bg.addColorStop(0.55, '#8a7a68');
        bg.addColorStop(1, '#d8b483');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255,228,170,0.7)';
        ctx.beginPath();
        ctx.arc(W / 2, H - 240, 54, 0, TAU);
        ctx.fill();
        const par = (camY * 0.16) % 260;
        ctx.fillStyle = 'rgba(38,42,50,0.4)';
        for (let k = -1; k < 4; k++) {
          const rowY = 520 + k * 260 + par;
          for (let b = 0; b < 7; b++) {
            const bw = 44 + ((b * 37) % 30);
            const bh = 50 + ((b * 53 + k * 31) % 90);
            ctx.fillRect(b * 62 - 10, rowY - bh, bw, bh);
          }
        }
        /* 远处塔吊剪影 */
        ctx.strokeStyle = 'rgba(30,34,40,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(40, 430 + par); ctx.lineTo(40, 250 + par); ctx.lineTo(150, 250 + par);
        ctx.moveTo(40, 300 + par); ctx.lineTo(150, 250 + par);
        ctx.stroke();
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shakeVal > 0) ctx.translate(rand(-shakeVal, shakeVal), rand(-shakeVal, shakeVal));
        drawSky();

        ctx.save();
        /* 0.12.1：统一视图变换（scale=1 时与旧的 translate(0,-camY) 完全等价；
           全览时整体缩小居中，几十层也能一屏看完）。 */
        const view = viewParams();
        ctx.translate((W / 2) * (1 - view.scale), H / 2 - view.centerY * view.scale);
        ctx.scale(view.scale, view.scale);

        ctx.fillStyle = '#3a2f28';
        ctx.fillRect(-40, BASE_Y, W + 80, 60);
        ctx.fillStyle = '#4d4036';
        ctx.fillRect(-40, BASE_Y, W + 80, 6);

        /* 0.12.1：站立塔的稳定性改为「地基支撑面 + 重心投影」可视化（代替原先会误导的整塔旋转）：
           重心投影一旦越过支撑面，玩家立刻能看出塔要倒。 */
        if (boxes.length && (state === 'playing' || state === 'paused')) {
          const baseX = baseCenter();
          const danger = Math.abs(comOffset) > STABILITY_LIMIT * 0.62;
          ctx.save();
          ctx.strokeStyle = danger ? 'rgba(255,93,93,0.9)' : 'rgba(99,224,200,0.55)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(baseX - SUPPORT_HALF, BASE_Y + 4);
          ctx.lineTo(baseX + SUPPORT_HALF, BASE_Y + 4);
          ctx.stroke();
          const comX = clamp(baseX + comOffset, 2, W - 2);
          ctx.fillStyle = danger ? '#ff5d5d' : '#63d68c';
          ctx.beginPath();
          ctx.arc(comX, BASE_Y + 4, 3.5, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        if (boxes.length) {
          ctx.save();
          /* 0.12.1 物理一致性修复：站立中的塔不再按 towerLean 整体旋转。
             旧实现把整塔绕塔底转最多 0.35rad≈20°，而 settleDrop / 落点判定 / towerLean
             全用未旋转坐标 —— 10 层塔在 lean=0.19 时视觉塔顶偏 ~83px、超过箱宽 64px，
             玩家对着看到的塔顶松手必然判偏，且新箱会「跟着转」出现在没点的位置。
             现在塔身始终轴对齐（所见即所判），倾斜改用底部重心/支撑面指示 + 预警表达；
             真正的旋转只发生在倒塌动画里。 */
          boxes.forEach((b) => {
            if (b.base) {
              ctx.fillStyle = '#6b7590';
              ctx.fillRect(b.x, b.y, b.w, b.h);
              ctx.fillStyle = '#8b96b3';
              ctx.fillRect(b.x, b.y, b.w, 6);
            } else {
              drawCrate(b.x, b.y, b.w, b.h, { cargo: b.cargo, floor: boxes.indexOf(b) });
            }
          });
          ctx.restore();
        }

        /* 0.12.1：塔不再靠「整体歪斜」表达不稳定，改用塔顶的警示描边 + 文案，
           既保留「快倒了」的空间反馈，又不会让玩家误判落点。 */
        if (boxes.length > 1 && (state === 'playing' || state === 'paused')) {
          const stress = Math.max(
            Math.abs(comOffset) / STABILITY_LIMIT,
            Math.abs(towerLean) / LEAN_LIMIT
          );
          if (stress > 0.62) {
            const top = towerTop();
            const warn = stress > 0.85;
            const pulse = A.reducedMotion ? 0.75 : 0.55 + 0.4 * ((Math.sin(Date.now() / 1000 * 9) + 1) / 2);
            ctx.save();
            ctx.globalAlpha = clamp((stress - 0.6) * 2.2, 0, 1) * pulse;
            ctx.strokeStyle = warn ? '#ff5d5d' : '#ffd23f';
            ctx.lineWidth = 3;
            ctx.setLineDash([7, 5]);
            A.draw.roundRect(ctx, top.x - 4, top.y - 4, top.w + 8, top.h * 2 + 8, 8);
            ctx.stroke();
            ctx.setLineDash([]);
            A.draw.label(ctx, warn ? '⚠ 塔身将倾' : '塔身不稳', top.x + top.w / 2, top.y - 14, {
              font: 'bold 12px system-ui', color: warn ? '#ff8a8a' : '#ffe08a',
            });
            ctx.restore();
          }
        }

        collapsed.forEach((b) => {
          ctx.save();
          ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
          ctx.rotate(b.rot);
          ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
          drawCrate(b.x, b.y, b.w, b.h, { cargo: b.cargo });
          ctx.restore();
        });

        if (drop) drawCrate(drop.x, drop.y, drop.w, drop.h, { squash: drop.squash, cargo: drop.cargo, floor: boxes.length });

        /* 挑战委托：在塔顶画出当前箱的目标偏置标记（不吸附，只提示）。 */
        if (mode === 'challenge' && chStage && chPlaced < chBoxesData.length) {
          const topBox = towerTop();
          const targetX = (Number(chStage.content.baseCenterX) || W / 2) + chTargetOffset();
          const tol = chTolerance();
          ctx.save();
          ctx.strokeStyle = 'rgba(99,224,200,0.85)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(targetX, topBox.y - 46);
          ctx.lineTo(targetX, topBox.y + 6);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(99,224,200,0.8)';
          ctx.fillRect(targetX - BOX_W / 2, topBox.y - 50, BOX_W, 4);
          A.draw.label(ctx, '目标 ' + chTargetOffset() + 'px ±' + tol, clamp(targetX, 46, W - 46), topBox.y - 62, {
            font: 'bold 11px system-ui',
            color: '#63e0c8',
          });
          ctx.restore();
        }

        particles.draw(ctx);
        ctx.restore();

        /* 0.12.1：全览层号在屏幕空间绘制（不随缩放变小），几十层时按可读间距抽稀。 */
        if (overviewT > 0.35 && boxes.length > 1) {
          const alpha = clamp((overviewT - 0.35) / 0.65, 0, 1);
          const spacing = BOX_H * view.scale;
          const step = Math.max(1, Math.ceil(16 / Math.max(1, spacing)));
          const rows = boxes.filter((b) => !b.base);
          ctx.save();
          ctx.globalAlpha = alpha;
          rows.forEach((b, i) => {
            const floor = i + 1;
            const isEdge = floor === 1 || floor === rows.length;
            if (!isEdge && floor % step !== 0) return;
            const p = worldToScreen(view, b.x + b.w / 2, b.y + b.h / 2);
            A.draw.label(ctx, '#' + floor, p.x - Math.max(18, (b.w * view.scale) / 2 + 10), p.y, {
              align: 'right', font: 'bold 11px system-ui', color: '#ffe08a',
            });
            /* 抽稀时给首尾箱补属性图标，保证属性仍可读。 */
            if (isEdge) {
              const cargo = b.cargo || CARGO_TYPES[0];
              A.draw.label(ctx, cargo.icon, p.x + Math.max(18, (b.w * view.scale) / 2 + 10), p.y, {
                align: 'left', font: '11px system-ui', color: '#fff',
              });
            }
          });
          ctx.restore();
        }

        /* 塔吊：桁架吊臂 + 塔身 + 配重臂 + 吊具（吊臂小车滑移跟塔顶对位）。
           全览/结算拉远时随缩放淡出，避免与缩小的塔身脱节。 */
        const jibX = jibPivotX();
        const jibAlpha = clamp(1 - overviewT * 1.6, 0, 1);
        ctx.save();
        ctx.globalAlpha = jibAlpha;
        ctx.strokeStyle = '#e0b13c';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(jibX - 140, PIVOT_Y - 30);
        ctx.lineTo(jibX + 150, PIVOT_Y - 30);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(60,50,20,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let gx = jibX - 130; gx <= jibX + 140; gx += 22) {
          ctx.moveTo(gx, PIVOT_Y - 34);
          ctx.lineTo(gx + 11, PIVOT_Y - 26);
        }
        ctx.stroke();
        ctx.fillStyle = '#c9962a';
        ctx.fillRect(jibX - 156, PIVOT_Y - 40, 26, 20);
        ctx.fillStyle = '#7a5a14';
        ctx.fillRect(jibX - 150, PIVOT_Y - 20, 14, 14);
        ctx.fillStyle = '#e0b13c';
        ctx.fillRect(jibX - 6, PIVOT_Y - 52, 12, 26);

        const pb = pendulumBoxScreen();
        if (overviewT < 0.5) {
          ctx.strokeStyle = pendHasBox ? '#ffe4a0' : 'rgba(255,228,160,0.35)';
          ctx.lineWidth = 2;
          ctx.setLineDash(pendHasBox ? [] : [4, 6]);
          ctx.beginPath();
          ctx.moveTo(jibX, PIVOT_Y - 24);
          ctx.lineTo(pb.x, pb.y - 18);
          ctx.stroke();
          ctx.setLineDash([]);
          /* 吊具横梁 */
          ctx.fillStyle = '#e0b13c';
          ctx.fillRect(pb.x - 22, pb.y - 24, 44, 6);
          ctx.strokeStyle = '#ffe4a0';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(pb.x - 18, pb.y - 18); ctx.lineTo(pb.x - 26, pb.y - 10);
          ctx.moveTo(pb.x + 18, pb.y - 18); ctx.lineTo(pb.x + 26, pb.y - 10);
          ctx.stroke();
        }
        ctx.fillStyle = '#fff4d0';
        ctx.beginPath();
        ctx.arc(jibX, PIVOT_Y - 26, 5, 0, TAU);
        ctx.fill();
        ctx.restore();

        if (pendHasBox && overviewT < 0.5 && (state === 'playing' || state === 'paused')) {
          ctx.save();
          ctx.translate(pb.x, pb.y);
          ctx.rotate(pb.angle * 0.35);
          drawCrate(-BOX_W / 2, -BOX_H / 2, BOX_W, BOX_H, { cargo: activeCargo, floor: boxes.length });
          ctx.restore();
          /* 下一箱属性预告（吊钩旁可读提示）。 */
          if (overviewT < 0.3) {
            A.draw.label(ctx, '下一箱 ' + nextCargo.icon + nextCargo.label, pb.x, pb.y + BOX_H / 2 + 16, {
              font: 'bold 10px system-ui', color: '#ffd23f', alpha: 0.85,
            });
          }
        }

        /* 0.12.1：落点投影常显（此前只在 前 3 层 / 用掉垂线道具 时显示，
           第 4 层以后玩家看不见落点，容易「莫名落空」）。
           - 常显细虚线 + 落点方块：红=这一下的确会落空；
           - 前 3 层教学、或消耗「垂线预览」道具时，追加精确偏差数值与延长引导线（道具价值保留）。
           挑战关用「投影箱心 vs 关卡 targetOffsetPx ± tolerancePx」判定。 */
        if (state === 'playing' && pendHasBox && overviewT < 0.3) {
          const top = towerTop();
          const topScreenY = top.y - camY;
          const precise = floorsReached < 3 || guideArmed;
          const forecast = landingForecast(pb.x);
          /* 落点预测分三态：会落空(红) / 能落但会偏(黄) / 完美对齐(绿)。 */
          const willMiss = !forecast.landable;
          const aligned = mode === 'challenge' && chStage ? challengeAlignNow(pb.x).aligned : forecast.perfect;
          let labelText;
          let labelX;
          if (mode === 'challenge' && chStage) {
            const model = challengeAlignNow(pb.x);
            const rounded = Math.round(model.offsetPx);
            labelText = precise
              ? '预计偏差 ' + (rounded > 0 ? '+' : '') + rounded + 'px' + (model.aligned ? ' · 对齐' : ' / ±' + Math.round(model.tolerancePx) + 'px')
              : (model.aligned ? '对齐' : '偏差 ' + (rounded > 0 ? '+' : '') + rounded + 'px');
            labelX = clamp(pb.x, 96, W - 96);
          } else {
            labelText = willMiss ? '会落空！' : forecast.perfect ? '完美对齐' : precise ? '偏 ' + Math.round(forecast.offset) + 'px' : '偏离 ' + Math.round(Math.abs(forecast.offset)) + 'px';
            labelX = clamp(pb.x, 46, W - 46);
          }
          const guideColor = willMiss ? 'rgba(255,93,93,0.85)' : aligned ? 'rgba(99,214,140,0.8)' : 'rgba(255,210,63,0.65)';
          ctx.save();
          ctx.strokeStyle = guideColor;
          ctx.lineWidth = willMiss ? 2 : 1.5;
          ctx.setLineDash(precise || willMiss ? [5, 5] : [2, 7]);
          ctx.beginPath();
          ctx.moveTo(pb.x, pb.y + BOX_H / 2);
          ctx.lineTo(pb.x, topScreenY);
          ctx.stroke();
          ctx.setLineDash([]);
          /* 预计落点方块：常显，红框表示必然落空。 */
          ctx.strokeStyle = guideColor;
          ctx.lineWidth = willMiss ? 2 : 1.2;
          ctx.strokeRect(pb.x - BOX_W / 2, topScreenY, BOX_W, 4);
          ctx.fillStyle = willMiss ? 'rgba(255,93,93,0.55)' : aligned ? 'rgba(99,214,140,0.55)' : 'rgba(255,210,63,0.45)';
          ctx.fillRect(top.x, topScreenY - 5, top.w, 5);
