<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="层塔：钟摆叠箱子物理游戏，钟摆从慢到快逐层加速，偏心会让塔倾斜倒塌，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/pendulum-tower.js"></script>
  <style>
    .challenge-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; background: rgba(8, 13, 28, 0.96); border-radius: inherit; }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-btn[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud { position: absolute; left: 8px; right: 8px; top: 8px; width: auto; z-index: 4; pointer-events: none; }
  </style>
  <title>层塔 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#e5941b; --card-accent:#e5941b">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🏗 层塔</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>层数 <strong data-hud-floor>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="层塔游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>层塔</h2>
            <p data-ov-text>钟摆叠箱子</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <div class="touch-pad game-tools" aria-label="可选道具（快捷键 1 / 2）">
      <button type="button" class="touch-btn" data-joy-tool="guide" aria-label="垂线预览，剩余 3 次（快捷键 1）"><span aria-hidden="true">📐</span> 垂线 <strong data-joy-count>3</strong></button>
      <button type="button" class="touch-btn" data-joy-tool="brace" aria-label="配重，剩余 2 次（快捷键 2）"><span aria-hidden="true">⚖️</span> 配重 <strong data-joy-count>2</strong></button>
    </div>
    <p class="game-hint">看准时机点击 / 空格松手 · 1 垂线 / 2 配重 · 完美对齐有连击 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const BOX_W = 64;
      const BOX_H = 40;
      const GRAVITY = 1300;
      const PIVOT_X = W / 2;
      const PIVOT_Y = 64;
      const PEND_LEN = 135;
      const LEAN_LIMIT = 0.35;
      const BASE_Y = 0;
      const JOY_START = { guide: 3, brace: 2 };
      const JOY_CAPS = { guide: 3, brace: 2 };
      const BRACE_MIN_LEAN = 0.015;
      const BRACE_MIN_VEL = 0.04;

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudFloor: document.querySelector('[data-hud-floor]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);
      const joyButtons = {
        guide: document.querySelector('[data-joy-tool="guide"]'),
        brace: document.querySelector('[data-joy-tool="brace"]'),
      };

      const particles = A.createParticles();

      /* ---------- 0.9 挑战模式：建筑委托（固定钟摆/目标偏置/限次） ---------- */
      const gameId = 'pendulum-tower';
      const challengeData = A.Challenge ? A.Challenge.stages(gameId) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chBoxesData = [];
      let chMarks = [];
      let chPlaced = 0;
      let chMisses = 0;
      let chElapsed = 0;
      let chAssisted = false;
      let chErrorReason = '';
      let chLastResult = null;
      let chMaxLean = LEAN_LIMIT;
      let chWin = { floorsAtLeast: 4, noCollapse: true };
      let chLimits = { maxDroppedBoxes: 5, braceUsesAllowed: 0, guideUsesAllowed: 0 };
      let chToolsUsed = { guide: 0, brace: 0 };
      let chGoalHintTimer = 0;
      let chHudSecond = -1;
      let chEvaluation = null;

      let boxes = [];
      let drop = null;
      const pend = { angle: 0.95, vel: 0, length: PEND_LEN, gravity: 680, damping: 0.006 };
      let pendHasBox = true;
      let pendReload = 0;
      let towerLean = 0;
      let leanVel = 0;
      let camY = -474;
      let score = 0;
      let perfectCombo = 0;
      let state = 'ready';
      let recordSaved = false;
      let collapseTimer = 0;
      let collapsed = [];
      let flash = 0;
      let leanMeter = 0;
      let shakeVal = 0;
      let floorsReached = 0;
      let feedback = null;
      const tools = { guide: JOY_START.guide, brace: JOY_START.brace };
      let guideArmed = false;

      let high = A.Progress.get('pendulum-tower').high;
      dom.hudHigh.textContent = String(high);

      /* 钟摆速度随层数递增：低层慢悠悠，高层明显加速。 */
      function swingGravity(floors) {
        return Math.min(1700, 680 + Math.max(0, floors) * 34);
      }

      function updateSwingDifficulty() {
        pend.gravity = swingGravity(floorsReached);
      }

      function towerTop() {
        return boxes[boxes.length - 1];
      }
      function currentTargetCam() {
        return towerTop().y - 430;
      }
      function pendulumBoxScreen() {
        const ang = pend.angle;
        const px = PIVOT_X + Math.sin(ang) * pend.length;
        const py = PIVOT_Y + Math.cos(ang) * pend.length;
        return { x: px, y: py, angle: ang };
      }

      /* ---------- 每局主动道具 ---------- */
      function canBrace() {
        return Math.abs(towerLean) > BRACE_MIN_LEAN || Math.abs(leanVel) > BRACE_MIN_VEL;
      }
      function syncJoyTools() {
        Object.keys(joyButtons).forEach((id) => {
          const button = joyButtons[id];
          const active = id === 'guide' && guideArmed;
          const usable = id === 'guide'
            ? (mode === 'challenge'
              ? tools.guide > 0 && pendHasBox && !drop && !guideArmed
              : floorsReached >= 3 && pendHasBox && !drop && !guideArmed)
            : (mode === 'challenge' ? tools.brace > 0 && !drop : canBrace());
          const name = id === 'guide' ? '垂线预览' : '配重';
          const detail = id === 'guide' ? '显示下一箱落点投影' : '当前倾斜减半、角速度降至 25%';
          button.querySelector('[data-joy-count]').textContent = String(tools[id]);
          button.disabled = state !== 'playing' || tools[id] <= 0 || !usable;
          button.classList.toggle('is-armed', active);
          button.setAttribute('aria-pressed', String(active));
          button.setAttribute('aria-label', name + '，' + detail + '，剩余 ' + tools[id] + ' 次（快捷键 ' + (id === 'guide' ? '1' : '2') + '）');
        });
      }
      function useJoy(id) {
        if (state !== 'playing' || !Object.prototype.hasOwnProperty.call(tools, id) || tools[id] <= 0) return false;
        if (id === 'guide') {
          if (mode !== 'challenge' && floorsReached < 3) return false;
          if (!pendHasBox || drop || guideArmed) return false;
          /* 次数在真正释放时扣；武装后放弃（暂停/离开）不会白白消耗。 */
          guideArmed = true;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('spring');
        } else if (id === 'brace') {
          if (!canBrace()) return false;
          tools.brace -= 1;
          towerLean *= 0.5;
          leanVel *= 0.25;
          if (mode === 'challenge') {
            chAssisted = true;
            chToolsUsed.brace += 1;
          }
          feedback = { text: '配重稳住！', color: '#7ce8e0', life: 1.1 };
          A.Sfx.play('land');
        } else {
          return false;
        }
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      Object.keys(joyButtons).forEach((id) => {
        joyButtons[id].addEventListener('click', () => useJoy(id));
      });
      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        const target = e.target;
        if (target && target.tagName) {
          const tag = target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        }
        const id = { '1': 'guide', '2': 'brace' }[e.key];
        if (!id) return;
        e.preventDefault();
        useJoy(id);
      });

      /* ---------- 流程 ---------- */
      function reset() {
        boxes = [];
        collapsed = [];
        drop = null;
        pend.angle = rand(0.75, 1.05) * (Math.random() > 0.5 ? 1 : -1);
        pend.vel = 0;
        pend.gravity = swingGravity(0);
        pendHasBox = true;
        pendReload = 0;
        towerLean = 0;
        leanVel = 0;
        camY = -474;
        score = 0;
        perfectCombo = 0;
        recordSaved = false;
        collapseTimer = 0;
        flash = 0;
        shakeVal = 0;
        floorsReached = 0;
        feedback = null;
        tools.guide = JOY_START.guide;
        tools.brace = JOY_START.brace;
        guideArmed = false;
        particles.clear();
        boxes.push({ x: W / 2 - 55, y: -44, w: 110, h: 44, base: true });
        boxes.push({ x: W / 2 - BOX_W / 2, y: -44 - BOX_H, w: BOX_W, h: BOX_H });
        syncHud();
        syncJoyTools();
      }

      function syncHud() {
        floorsReached = mode === 'challenge' ? chPlaced : Math.max(0, boxes.length - 2);
        if (mode === 'challenge') {
          syncChallengeHud();
          return;
        }
        dom.hudScore.textContent = String(score);
        dom.hudFloor.textContent = String(floorsReached);
        syncJoyTools();
      }

      function startGame() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
      }

      function finishRun(title, subtitle) {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('pendulum-tower', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          title,
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            subtitle +
            ` · ${floorsReached} 层`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync(); syncJoyTools();
      }

      function gameOver() {
        finishRun('工程结束', '最终得分');
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        const opts = {
          title: '已暂停',
          text: '吊臂停住了。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge') {
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        }
        ui.show(opts);
        pauseUi.sync(); syncJoyTools();
      }

      function showStart() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        ui.show({
          title: '层塔',
          text: '钟摆叠箱：看准时机松手。<br/>钟摆会随层数慢慢加速<br/>偏心会让高塔晃动甚至倒塌 · 完美对齐有连击',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeAvailable ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }

      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(gameId);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }

      function showChallengePanel() {
        if (!challengeAvailable) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        if (chDom.back) chDom.back.hidden = false;
        loop.pause();
        state = 'challenge-menu';
        pauseUi.sync();
      }

      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        if (chDom.back) chDom.back.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }

      function backToStartFromPanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        showStart();
        pauseUi.sync();
        syncJoyTools();
      }

      function chCurrentSpec() {
        return chPlaced < chBoxesData.length ? chBoxesData[chPlaced] : null;
      }

      function chTargetOffset() {
        const spec = chCurrentSpec();
        return spec ? Number(spec.targetOffsetPx) || 0 : 0;
      }

      function chTolerance() {
        const spec = chCurrentSpec();
        return spec ? Number(spec.tolerancePx) || 8 : 8;
      }

      function evaluationLevel() {
        const allWithin = chMarks.length > 0 && chMarks.every((mark) => mark.withinTolerance);
        const noTools = chToolsUsed.guide + chToolsUsed.brace === 0;
        const noMiss = chMisses === 0;
        if (allWithin && noTools && noMiss) return 'gold';
        if (allWithin) return 'silver';
        return 'bronze';
      }

      function evaluationLabel(level) {
        return { gold: '金牌：全标记达成且零道具零失误', silver: '银牌：全部标记在容差内', bronze: '铜牌：完成并保持稳定' }[level] || '—';
      }

      function buildChallengeStage(index) {
        const stage = challengeData[index];
        if (!stage) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = index;
        const content = stage.content || {};
        chBoxesData = (Array.isArray(content.boxes) ? content.boxes.slice() : []).sort((a, b) => (a.order || 0) - (b.order || 0));
        chMarks = [];
        chPlaced = 0;
        chMisses = 0;
        chElapsed = 0;
        chAssisted = false;
        chErrorReason = '';
        chLastResult = null;
        chEvaluation = null;
        chGoalHintTimer = 3;
        chHudSecond = -1;
        chLimits = Object.assign({ maxDroppedBoxes: 5, braceUsesAllowed: 0, guideUsesAllowed: 0 }, content.limits || {});
        chWin = Object.assign({ floorsAtLeast: chBoxesData.length, noCollapse: true, allMarkTargetsWithinTolerance: false }, content.win || {});
        chMaxLean = Number(chLimits.maxTowerLeanAbs) || LEAN_LIMIT;
        const pendulum = content.pendulum || {};
        pend.length = Number(pendulum.length) || PEND_LEN;
        pend.gravity = 680 * (Number(pendulum.speedFactor) || 1);
        pend.angle = Number(pendulum.deterministicStartPhaseRad) || 0;
        /* 设计只给起始角（0=垂直），需确定性初始角速度才能形成可预测摆幅（约 ±0.95rad，与经典一致）。 */
        pend.vel = 2.05 * (Number(pendulum.speedFactor) || 1);
        pend.damping = 0.006;
        const baseCenterX = Number(content.baseCenterX) || W / 2;
        boxes = [{ x: baseCenterX - 55, y: -44, w: 110, h: 44, base: true }];
        drop = null;
        collapsed = [];
        towerLean = 0;
        leanVel = 0;
        camY = -474;
        score = 0;
        perfectCombo = 0;
        floorsReached = 0;
        collapseTimer = 0;
        flash = 0;
        shakeVal = 0;
        feedback = null;
        pendHasBox = true;
        pendReload = 0;
        guideArmed = false;
        chToolsUsed = { guide: 0, brace: 0 };
        tools.guide = Math.min(JOY_CAPS.guide, Math.max(0, Number(chLimits.guideUsesAllowed) || 0));
        tools.brace = Math.min(JOY_CAPS.brace, Math.max(0, Number(chLimits.braceUsesAllowed) || 0));
        particles.clear();
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) return;
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chElapsed);
        if (second === chHudSecond && state === 'playing') return;
        chHudSecond = second;
        const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0');
        const spec = chCurrentSpec();
        const targetText = spec ? '目标 ' + (Number(spec.targetOffsetPx) || 0) + 'px ±' + (Number(spec.tolerancePx) || 8) : '委托完成';
        chDom.hud.innerHTML =
          '<strong>' + chEsc(label + ' ' + chStage.title) + '</strong>' +
          '<span>' + chEsc(chStage.goalStatement || '') + '</span>' +
          '<span>楼层 ' + chPlaced + '/' + (chWin.floorsAtLeast || chBoxesData.length) + '</span>' +
          '<span>' + chEsc(targetText) + '</span>' +
          '<span>倾斜 ' + Math.abs(towerLean).toFixed(3) + '/' + chMaxLean + '</span>' +
          '<span>落空 ' + chMisses + '/' + (chLimits.maxDroppedBoxes || 0) + '</span>' +
          '<span>用时 ' + A.Challenge.formatTime(chElapsed) + '</span>';
      }

      function startChallenge(ref) {
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(gameId, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(gameId, stage.id)) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        state = 'playing';
        hideChallengePanel();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        syncChallengeHud();
        autosave.clear();
        autosave.saveNow();
        return true;
      }

      /* 挑战落箱：不自动吸附，按真实释放位置落箱；记录与目标偏置的偏差。 */
      function settleChallengeDrop() {
        const top = towerTop();
        const overlap = Math.min(drop.x + drop.w, top.x + top.w) - Math.max(drop.x, top.x);
        const baseCenterX = Number(chStage.content.baseCenterX) || W / 2;
        if (overlap < 6) {
          chMisses += 1;
          feedback = { text: '落空！', color: '#ff5d5d', life: 1.1 };
          A.Sfx.play('land');
          drop = null;
          syncHud();
          syncChallengeHud();
          if (chMisses > (chLimits.maxDroppedBoxes || 0)) {
            challengeFail('落空 ' + chMisses + ' 次，超过委托允许的 ' + chLimits.maxDroppedBoxes + ' 次');
          }
          return;
        }
        const center = drop.x + drop.w / 2;
        const actualOffset = Math.round((center - baseCenterX) * 10) / 10;
        const targetOffset = chTargetOffset();
        const tolerance = chTolerance();
        const within = Math.abs(actualOffset - targetOffset) <= tolerance;
        chMarks.push({ order: chPlaced + 1, targetOffsetPx: targetOffset, actualOffsetPx: actualOffset, tolerancePx: tolerance, withinTolerance: within });
        chPlaced += 1;
        const y = top.y - drop.h;
        boxes.push({ x: drop.x, y, w: drop.w, h: drop.h });
        const e = center - (top.x + top.w / 2);
        leanVel += e * 0.006 * (1 + chPlaced * 0.02);
        perfectCombo = 0;
        feedback = { text: (within ? '标记内 ' : '偏离 ') + Math.round(actualOffset) + 'px', color: within ? '#ffd23f' : '#93a0c8', life: 1.1 };
        A.Sfx.play(within ? 'perfect' : 'land');
        particles.emit(center, y + drop.h, {
          count: A.reducedMotion ? 6 : 14,
          speed: [30, 140],
          angle: [Math.PI * 1.05, Math.PI * 1.95],
          life: [0.25, 0.6],
          size: [2, 4],
          colors: within ? ['#ffd23f', '#ffffff'] : ['#c9a06b', '#8a6a43'],
          gravity: 500,
        });
        drop = null;
        syncHud();
        syncChallengeHud();
        autosave.saveNow();
      }

      function updateChallenge(dt) {
        particles.update(dt);
        flash = Math.max(0, flash - dt);
        shakeVal = Math.max(0, shakeVal - dt * 20);
        if (feedback) {
          feedback.life -= dt;
          if (feedback.life <= 0) feedback = null;
        }
        leanMeter = chMaxLean > 0 ? clamp(Math.abs(towerLean) / chMaxLean, 0, 1) : 0;
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chElapsed += dt;
        chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
        A.Physics.pendulumStep(pend, dt);
        if (!pendHasBox) {
          pendReload -= dt;
          if (pendReload <= 0) {
            pendHasBox = true;
            syncJoyTools();
          }
        }
        const stiffness = 6.2;
        const damp = 0.9;
        leanVel += (-stiffness * towerLean - damp * leanVel) * dt;
        towerLean += leanVel * dt;
        if (Math.abs(towerLean) > chMaxLean) {
          challengeFail('塔身倾斜 ' + Math.abs(towerLean).toFixed(3) + ' 超过委托上限 ' + chMaxLean + '，结构失稳');
          input.endFrame();
          return;
        }
        if (drop) {
          drop.prevBottom = drop.y + drop.h;
          drop.vy += GRAVITY * dt;
          drop.y += drop.vy * dt;
          drop.squash = Math.max(0, drop.squash - dt);
          const top = towerTop();
          if (drop.vy > 0 && drop.prevBottom <= top.y + 1 && drop.y + drop.h >= top.y) {
            settleChallengeDrop();
          } else if (drop && drop.y > camY + H + 120) {
            drop = null;
            chMisses += 1;
            syncChallengeHud();
            if (chMisses > (chLimits.maxDroppedBoxes || 0)) {
              challengeFail('落空 ' + chMisses + ' 次，超过委托允许的 ' + chLimits.maxDroppedBoxes + ' 次');
              input.endFrame();
              return;
            }
          }
        }
        const spaceNow = input.isDown(' ');
        if (input.pointer.wentDown || (spaceNow && !updateChallenge._space)) releaseBox();
        updateChallenge._space = spaceNow;
        camY = lerp(camY, currentTargetCam(), Math.min(1, 4 * dt));
        if (!drop && chPlaced >= (chWin.floorsAtLeast || chBoxesData.length) && Math.abs(towerLean) <= chMaxLean * 0.98 && Math.abs(leanVel) < 0.4) {
          challengeClear();
          input.endFrame();
          return;
        }
        syncChallengeHud();
        input.endFrame();
      }

      function challengeClear() {
        if (mode !== 'challenge' || !chStage) return false;
        state = 'cleared';
        chGoalHintTimer = 0;
        autosave.clear();
        loop.pause();
        syncJoyTools();
        chEvaluation = evaluationLevel();
        const result = { timeSec: Math.round(chElapsed * 10) / 10, assisted: chAssisted, collectibles: [] };
        chLastResult = result;
        if (A.Challenge) A.Challenge.markCleared(gameId, chStage.id, result);
        const isLast = chStageIndex >= challengeData.length - 1;
        const marksText = chMarks.map((mark) => mark.order + ':' + mark.actualOffsetPx + 'px' + (mark.withinTolerance ? '✓' : '✗')).join(' ');
        const resultText =
          A.Challenge.resultHtml(chStage, result) +
          '<p class="ac-challenge-tip">' + chEsc(evaluationLabel(chEvaluation)) + '<br/>落点 ' + chEsc(marksText || '—') + ' · 落空 ' + chMisses + ' · 倾斜峰值 ' + Math.abs(towerLean).toFixed(3) + '</p>';
        ui.show({
          title: '挑战通关',
          text: resultText,
          btn: isLast ? '返回选关' : '下一关',
          onBtn: () => {
            if (isLast) exitToChallengeSelect();
            else startChallenge(challengeData[chStageIndex + 1].id);
          },
          btn2: '重玩本关',
          onBtn2: () => startChallenge(chStage.id),
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        chErrorReason = reason || '本关失败';
        chEvaluation = evaluationLevel();
        autosave.clear();
        loop.pause();
        syncJoyTools();
        ui.show({
          title: '挑战失败',
          text:
            '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
            '<p class="ac-challenge-result-row">本关目标：' + chEsc(chStage.goalStatement || '') + ' · 已放 ' + chPlaced + ' 层</p>',
          btn: '重试本关',
          onBtn: () => startChallenge(chStage.id),
          btn2: '返回选关',
          onBtn2: exitToChallengeSelect,
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chMarks = [];
        chLastResult = null;
        chErrorReason = '';
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showChallengePanel();
        return true;
      }

      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chMarks = [];
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showStart();
        return true;
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(gameId, data.stageId);
        if (!stage) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        if (Array.isArray(data.boxes) && data.boxes.length >= 1) {
          boxes = data.boxes
            .filter((box) => box && isFinite(box.x) && isFinite(box.y))
            .map((box) => ({ x: Number(box.x), y: Number(box.y), w: clamp(Number(box.w), 20, 200), h: clamp(Number(box.h), 12, 80), base: !!box.base }));
          if (!boxes.length || !boxes[0].base) return false;
        }
        if (data.pend && isFinite(data.pend.angle)) {
          pend.angle = Number(data.pend.angle);
          pend.vel = Number(data.pend.vel) || 0;
        }
        chPlaced = Math.max(0, Number(data.chPlaced) || 0);
        chMisses = Math.max(0, Number(data.chMisses) || 0);
        chMarks = Array.isArray(data.chMarks) ? data.chMarks.filter((mark) => mark && typeof mark === 'object') : [];
        chElapsed = Math.max(0, Number(data.chElapsed) || 0);
        chAssisted = !!data.chAssisted;
        chToolsUsed = data.chToolsUsed && typeof data.chToolsUsed === 'object' ? { guide: Number(data.chToolsUsed.guide) || 0, brace: Number(data.chToolsUsed.brace) || 0 } : { guide: 0, brace: 0 };
        towerLean = Number(data.towerLean) || 0;
        leanVel = Number(data.leanVel) || 0;
        camY = Number(data.camY) || -474;
        drop = null;
        pendHasBox = true;
        pendReload = 0;
        guideArmed = false;
        chEvaluation = null;
        chErrorReason = '';
        state = 'playing';
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function challengeObservable() {
        const top = towerTop();
        const pb = pendulumBoxScreen();
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageNumber: chStage ? chStage.stageNumber : null,
          state,
          boxes: boxes.map((box) => ({ x: box.x, y: box.y, w: box.w, h: box.h, base: !!box.base })),
          floors: chPlaced,
          floorsRequired: chWin.floorsAtLeast || chBoxesData.length,
          top: { x: top.x, y: top.y },
          pendulum: { x: pb.x, y: pb.y, angle: pb.angle, vel: pend.vel, hasBox: pendHasBox },
          drop: drop ? { x: drop.x, y: drop.y } : null,
          towerLean,
          leanVel,
          maxLean: chMaxLean,
          marks: chMarks.slice(),
          currentTargetOffsetPx: chTargetOffset(),
          currentTolerancePx: chTolerance(),
          misses: chMisses,
          maxDroppedBoxes: chLimits.maxDroppedBoxes,
          tools: { guide: tools.guide, brace: tools.brace },
          toolsUsed: { guide: chToolsUsed.guide, brace: chToolsUsed.brace },
          assisted: chAssisted,
          elapsedSec: Math.round(chElapsed * 10) / 10,
          goalStatement: chStage ? chStage.goalStatement : null,
          evaluation: chEvaluation,
          errorReason: chErrorReason,
          cleared: !!chLastResult,
        };
      }

      /* 测试便捷钩子：在钟摆箱中心到达 baseCenterX+offset 的下一帧立即松手（仍是真实 releaseBox 物理）。 */
      function releaseWhenAligned(offset, tolerance) {
        if (mode !== 'challenge' || state !== 'playing') return Promise.resolve(false);
        const baseCenterX = Number(chStage.content.baseCenterX) || W / 2;
        const target = baseCenterX + (Number(offset) || 0);
        const tol = Math.max(1, Number(tolerance) || 6);
        const started = performance.now();
        return new Promise((resolve) => {
          function check() {
            if (mode !== 'challenge' || state !== 'playing' || !pendHasBox || drop) {
              resolve(false);
              return;
            }
            const p = pendulumBoxScreen();
            if (Math.abs(p.x - target) <= tol) {
              releaseBox();
              resolve(true);
              return;
            }
            if (performance.now() - started > 9000) {
              resolve(false);
              return;
            }
            requestAnimationFrame(check);
          }
          requestAnimationFrame(check);
        });
      }


      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: mode === 'challenge' && chStage ? chStage.id : null,
          chPlaced,
          chMisses,
          chMarks: chMarks.slice(),
          chElapsed,
          chAssisted,
          chToolsUsed: { guide: chToolsUsed.guide, brace: chToolsUsed.brace },
          boxes: boxes.map((b) => ({ x: b.x, y: b.y, w: b.w, h: b.h, base: !!b.base })),
          drop: drop
            ? { x: drop.x, y: drop.y, w: drop.w, h: drop.h, vy: drop.vy, prevBottom: drop.prevBottom, missed: !!drop.missed, squash: drop.squash }
            : null,
          pend: { angle: pend.angle, vel: pend.vel, length: pend.length, gravity: pend.gravity, damping: pend.damping },
          pendHasBox,
          pendReload,
          towerLean,
          leanVel,
          camY,
          score,
          perfectCombo,
          floorsReached,
          tools: { guide: tools.guide, brace: tools.brace },
          guideArmed,
        };
      }

      function restoreClassic(data) {
        if (!data || !Array.isArray(data.boxes) || data.boxes.length < 2) return false;
        try {
          reset();
          boxes = data.boxes
            .filter((b) => b && isFinite(b.x) && isFinite(b.y) && isFinite(b.w) && isFinite(b.h))
            .map((b) => ({
              x: Number(b.x),
              y: Number(b.y),
              w: clamp(Number(b.w), 20, 200),
              h: clamp(Number(b.h), 12, 80),
              base: !!b.base,
            }));
          if (boxes.length < 2) return false;
          if (data.drop && isFinite(data.drop.x) && isFinite(data.drop.y)) {
            drop = {
              x: Number(data.drop.x),
              y: Number(data.drop.y),
              w: BOX_W,
              h: BOX_H,
              vy: Number(data.drop.vy) || 0,
              prevBottom: Number(data.drop.prevBottom) || 0,
              missed: !!data.drop.missed,
              squash: Number(data.drop.squash) || 0,
            };
          } else {
            drop = null;
          }
          if (data.pend && isFinite(data.pend.angle)) {
            pend.angle = Number(data.pend.angle);
            pend.vel = Number(data.pend.vel) || 0;
            pend.length = PEND_LEN;
            pend.gravity = Number(data.pend.gravity) || swingGravity(0);
          }
          pendHasBox = data.pendHasBox !== false;
          pendReload = Number(data.pendReload) || 0;
          towerLean = Number(data.towerLean) || 0;
          leanVel = Number(data.leanVel) || 0;
          camY = Number(data.camY) || -474;
          score = Math.max(0, Number(data.score) || 0);
          perfectCombo = Math.max(0, Number(data.perfectCombo) || 0);
          tools.guide = data.tools && Number.isFinite(Number(data.tools.guide))
            ? clamp(Math.floor(Number(data.tools.guide)), 0, JOY_CAPS.guide)
            : JOY_START.guide;
          tools.brace = data.tools && Number.isFinite(Number(data.tools.brace))
            ? clamp(Math.floor(Number(data.tools.brace)), 0, JOY_CAPS.brace)
            : JOY_START.brace;
          guideArmed = !!data.guideArmed;
          recordSaved = false;
          syncHud();
          guideArmed = guideArmed && pendHasBox && !drop && floorsReached >= 3;
          updateSwingDifficulty();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      /* 统一恢复入口：0.8 及更早存档缺 mode 一律按经典恢复；mode:'challenge' 走挑战恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      const autosave = A.createRunAutosave('pendulum-tower', serialize, {
        every: 4,
        meta: () => ({ score, summary: mode === 'challenge' && chStage ? '挑战 ' + chStage.id + ' · ' + chPlaced + ' 层' : `得分 ${score} · ${floorsReached} 层` }),
      });

      /* ---------- 松手放箱 ---------- */
      function releaseBox() {
        if (!pendHasBox || drop) return;
        const p = pendulumBoxScreen();
        pendHasBox = false;
        pendReload = 0.55;
        drop = {
          x: p.x - BOX_W / 2,
          y: p.y + camY - BOX_H / 2,
          w: BOX_W,
          h: BOX_H,
          vy: 60,
          prevBottom: 0,
          landed: false,
          squash: 0,
        };
        drop.prevBottom = drop.y + drop.h;
        const usedGuide = guideArmed;
        guideArmed = false;
        if (usedGuide) {
          tools.guide = Math.max(0, tools.guide - 1);
          if (mode === 'challenge') {
            chAssisted = true;
            chToolsUsed.guide += 1;
          }
        }
        syncJoyTools();
        A.Sfx.play('ui');
        if (usedGuide) autosave.saveNow();
      }

      function settleDrop() {
        const top = towerTop();
        const overlap = Math.min(drop.x + drop.w, top.x + top.w) - Math.max(drop.x, top.x);
        const e = drop.x + drop.w / 2 - (top.x + top.w / 2);

        if (overlap >= BOX_W * 0.85) {
          drop.x = top.x;
          perfectCombo += 1;
          score += 10 + perfectCombo * 10;
          flash = 0.5;
          feedback = { text: '完美对齐 +' + (10 + perfectCombo * 10), color: '#ffd23f', life: 1.1 };
          A.Sfx.play('perfect');
          particles.emit(drop.x + drop.w / 2, drop.y, {
            count: A.reducedMotion ? 8 : 22,
            speed: [60, 220],
            angle: [Math.PI * 1.05, Math.PI * 1.95],
            life: [0.3, 0.7],
            size: [2, 4],
            colors: ['#ffd23f', '#ffffff'],
            gravity: 500,
          });
          leanVel += e * 0.0006;
        } else if (overlap > 6) {
          perfectCombo = 0;
          score += 10;
          feedback = { text: (e < 0 ? '偏左 ' : '偏右 ') + Math.round(Math.abs(e)) + 'px · +10', color: '#93a0c8', life: 1.1 };
          A.Sfx.play('land');
          particles.emit(drop.x + drop.w / 2, drop.y + drop.h, {
            count: 6,
            speed: [30, 120],
            angle: [Math.PI * 0.1, Math.PI * 0.9],
            life: [0.2, 0.5],
            size: [2, 4],
            colors: ['#c9a06b', '#8a6a43'],
            gravity: 600,
          });
          const n = boxes.length - 1;
          leanVel += e * 0.01 * (1 + n * 0.022);
        } else {
          perfectCombo = 0;
          drop.missed = true;
          feedback = { text: '落空！', color: '#ff5d5d', life: 1.1 };
        }

        if (!drop.missed) {
          drop.y = top.y - drop.h;
          boxes.push({ x: drop.x, y: drop.y, w: drop.w, h: drop.h });
          drop.squash = 0.25;
          drop = null;
          syncHud();
          updateSwingDifficulty();
        }
      }

      function startCollapse() {
        state = 'collapse';
        collapseTimer = 1.5;
        autosave.clear();
        A.Sfx.play('crash');
        shakeVal = A.reducedMotion ? 0 : 9;
        const dir = towerLean > 0 ? 1 : -1;
        boxes.forEach((b, i) => {
          collapsed.push({
            x: b.x,
            y: b.y,
            w: b.w,
            h: b.h,
            vx: dir * rand(30, 140) * (i / boxes.length),
            vy: rand(-60, -10),
            rot: 0,
            vr: dir * rand(0.6, 2.4),
            base: b.base,
          });
        });
        boxes = [];
      }

      /* ---------- 更新 ---------- */
      function update(dt) {
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        particles.update(dt);
        flash = Math.max(0, flash - dt);
        shakeVal = Math.max(0, shakeVal - dt * 20);
        if (feedback) {
          feedback.life -= dt;
          if (feedback.life <= 0) feedback = null;
        }
        leanMeter = clamp(Math.abs(towerLean) / LEAN_LIMIT, 0, 1);

        if (state === 'collapse') {
          collapseTimer -= dt;
          collapsed.forEach((b) => {
            b.vy += GRAVITY * dt;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.rot += b.vr * dt;
          });
          if (collapseTimer <= 0) gameOver();
          input.endFrame();
          return;
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);

        A.Physics.pendulumStep(pend, dt);
        if (!pendHasBox) {
          pendReload -= dt;
          if (pendReload <= 0) {
            pendHasBox = true;
            syncJoyTools();
          }
        }

        const stiffness = 6.2;
        const damp = 0.9;
        const leanAcc = -stiffness * towerLean - damp * leanVel;
        leanVel += leanAcc * dt;
        towerLean += leanVel * dt;
        if (Math.abs(towerLean) > LEAN_LIMIT) {
          startCollapse();
          return;
        }

        if (drop) {
          drop.prevBottom = drop.y + drop.h;
          drop.vy += GRAVITY * dt;
          drop.y += drop.vy * dt;
          drop.squash = Math.max(0, drop.squash - dt);
          const top = towerTop();
          if (drop.missed) {
            if (drop.y + drop.h >= BASE_Y) {
              particles.emit(drop.x + drop.w / 2, BASE_Y, {
                count: 14,
                speed: [40, 200],
                angle: [Math.PI * 1.1, Math.PI * 1.9],
                life: [0.3, 0.7],
                size: [2, 5],
                colors: ['#c9a06b', '#7a5222', '#ffffff'],
                gravity: 700,
              });
              A.Sfx.play('explode');
              drop = null;
              finishRun('地基失守', '箱子完全落空 · 最终得分');
              input.endFrame();
              return;
            }
          } else if (drop.vy > 0 && drop.prevBottom <= top.y + 1 && drop.y + drop.h >= top.y) {
            settleDrop();
          }
          if (drop && drop.y > camY + H + 120) {
            drop = null;
            finishRun('地基失守', '箱子完全落空 · 最终得分');
            input.endFrame();
            return;
          }
        }

        /* 松手输入（指针边沿 / 空格边沿） */
        const spaceNow = input.isDown(' ');
        if (input.pointer.wentDown || (spaceNow && !update._space)) releaseBox();
        update._space = spaceNow;

        camY = lerp(camY, currentTargetCam(), Math.min(1, 4 * dt));

        const braceUsable = canBrace();
        if (update._braceUsable !== braceUsable) {
          update._braceUsable = braceUsable;
          syncJoyTools();
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      function drawCrate(x, y, w, h, opts) {
        const o = Object.assign({ squash: 0, alpha: 1 }, opts);
        ctx.save();
        ctx.globalAlpha = o.alpha;
        const sy = 1 - o.squash * 0.4;
        const sx = 1 + o.squash * 0.4;
        ctx.translate(x + w / 2, y + h);
        ctx.scale(sx, sy);
        ctx.translate(-(x + w / 2), -(y + h));
        ctx.fillStyle = '#c9884b';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#7a5222';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(122,82,34,0.75)';
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 4);
        ctx.lineTo(x + w - 4, y + h - 4);
        ctx.moveTo(x + w - 4, y + 4);
        ctx.lineTo(x + 4, y + h - 4);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,220,160,0.28)';
        ctx.fillRect(x + 4, y + 4, w - 8, 4);
        ctx.restore();
      }

      function drawSky() {
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#2c2560');
        bg.addColorStop(0.55, '#7a4a86');
        bg.addColorStop(1, '#e08d5a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255,214,150,0.85)';
        ctx.beginPath();
        ctx.arc(W / 2, H - 210, 64, 0, TAU);
        ctx.fill();
        const par = (camY * 0.18) % 260;
        ctx.fillStyle = 'rgba(30,20,50,0.55)';
        for (let k = -1; k < 4; k++) {
          const rowY = 470 + k * 260 + par;
          for (let b = 0; b < 7; b++) {
            const bw = 44 + ((b * 37) % 30);
            const bh = 60 + ((b * 53 + k * 31) % 110);
            ctx.fillRect(b * 62 - 10, rowY - bh, bw, bh);
          }
        }
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shakeVal > 0) ctx.translate(rand(-shakeVal, shakeVal), rand(-shakeVal, shakeVal));
        drawSky();

        ctx.save();
        ctx.translate(0, -camY);

        ctx.fillStyle = '#3a2f28';
        ctx.fillRect(-40, BASE_Y, W + 80, 60);
        ctx.fillStyle = '#4d4036';
        ctx.fillRect(-40, BASE_Y, W + 80, 6);

        if (boxes.length) {
          ctx.save();
          const pivot = boxes[0];
          ctx.translate(pivot.x + pivot.w / 2, pivot.y + pivot.h);
          ctx.rotate(towerLean);
          ctx.translate(-(pivot.x + pivot.w / 2), -(pivot.y + pivot.h));
          boxes.forEach((b) => {
            if (b.base) {
              ctx.fillStyle = '#6b7590';
              ctx.fillRect(b.x, b.y, b.w, b.h);
              ctx.fillStyle = '#8b96b3';
              ctx.fillRect(b.x, b.y, b.w, 6);
            } else {
              drawCrate(b.x, b.y, b.w, b.h, {});
            }
          });
          ctx.restore();
        }

        collapsed.forEach((b) => {
          ctx.save();
          ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
          ctx.rotate(b.rot);
          ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
          drawCrate(b.x, b.y, b.w, b.h, {});
          ctx.restore();
        });

        if (drop) drawCrate(drop.x, drop.y, drop.w, drop.h, { squash: drop.squash });

        /* 挑战委托：在塔顶画出当前箱的目标偏置标记（不吸附，只提示）。 */
        if (mode === 'challenge' && chStage && chPlaced < chBoxesData.length) {
          const topBox = towerTop();
          const targetX = (Number(chStage.content.baseCenterX) || W / 2) + chTargetOffset();
          const tol = chTolerance();
          ctx.save();
          ctx.strokeStyle = 'rgba(99,224,200,0.85)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(targetX, topBox.y - 46);
          ctx.lineTo(targetX, topBox.y + 6);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(99,224,200,0.8)';
          ctx.fillRect(targetX - BOX_W / 2, topBox.y - 50, BOX_W, 4);
          A.draw.label(ctx, '目标 ' + chTargetOffset() + 'px ±' + tol, clamp(targetX, 46, W - 46), topBox.y - 62, {
            font: 'bold 11px system-ui',
            color: '#63e0c8',
          });
          ctx.restore();
        }

        particles.draw(ctx);
        ctx.restore();

        /* 吊臂 */
        ctx.strokeStyle = '#3b466f';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(PIVOT_X - 130, PIVOT_Y - 26);
        ctx.lineTo(PIVOT_X + 130, PIVOT_Y - 26);
        ctx.stroke();
        ctx.fillStyle = '#2a3358';
        ctx.fillRect(PIVOT_X - 150, PIVOT_Y - 34, 24, 16);
        ctx.fillRect(PIVOT_X + 126, PIVOT_Y - 34, 24, 16);

        const pb = pendulumBoxScreen();
        ctx.strokeStyle = pendHasBox ? '#d8dcf0' : 'rgba(216,220,240,0.35)';
        ctx.lineWidth = 2;
        ctx.setLineDash(pendHasBox ? [] : [4, 6]);
        ctx.beginPath();
        ctx.moveTo(PIVOT_X, PIVOT_Y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#e8ecff';
        ctx.beginPath();
        ctx.arc(PIVOT_X, PIVOT_Y, 5, 0, TAU);
        ctx.fill();

        if (pendHasBox && (state === 'playing' || state === 'paused')) {
          ctx.save();
          ctx.translate(pb.x, pb.y);
          ctx.rotate(pb.angle * 0.35);
          drawCrate(-BOX_W / 2, -BOX_H / 2, BOX_W, BOX_H, {});
          ctx.restore();
        }

        /* 前 3 层免费教学；之后仅玩家主动消耗“垂线预览”时显示。 */
        if (state === 'playing' && pendHasBox && (floorsReached < 3 || guideArmed)) {
          const top = towerTop();
          const topScreenY = top.y - camY;
          const overlap = Math.min(pb.x + BOX_W / 2, top.x + top.w) - Math.max(pb.x - BOX_W / 2, top.x);
          const aligned = overlap >= BOX_W * 0.85;
          ctx.save();
          ctx.strokeStyle = aligned ? 'rgba(99,214,140,0.8)' : 'rgba(255,210,63,0.65)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(pb.x, pb.y + BOX_H / 2);
          ctx.lineTo(pb.x, topScreenY);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = aligned ? 'rgba(99,214,140,0.55)' : 'rgba(255,210,63,0.45)';
          ctx.fillRect(top.x, topScreenY - 5, top.w, 5);
          A.draw.label(ctx, aligned ? '对齐' : '左右微调', pb.x, Math.max(88, topScreenY - 18), {
            font: 'bold 12px system-ui',
            color: aligned ? '#63d68c' : '#ffd23f',
          });
          ctx.restore();
        }

        if (feedback) {
          A.draw.label(ctx, feedback.text, W / 2, 112, {
            font: 'bold 18px system-ui',
            color: feedback.color,
            alpha: clamp(feedback.life / 1.1, 0, 1),
          });
        }

        if (flash > 0) {
          ctx.fillStyle = `rgba(255,220,110,${flash * 0.35})`;
          ctx.fillRect(0, 0, W, H);
        }

        if (state === 'playing' || state === 'paused') {
          const bw = 150;
          ctx.fillStyle = 'rgba(10,14,30,0.5)';
          A.draw.roundRect(ctx, W / 2 - bw / 2, H - 30, bw, 10, 5);
          ctx.fill();
          const mid = W / 2;
          ctx.fillStyle = leanMeter > 0.7 ? '#ff5d5d' : leanMeter > 0.4 ? '#ffd23f' : '#63d68c';
          const dir = towerLean >= 0 ? 1 : -1;
          A.draw.roundRect(ctx, dir > 0 ? mid : mid - (bw / 2 - 4) * leanMeter, H - 28, (bw / 2 - 4) * leanMeter, 6, 3);
          if ((bw / 2 - 4) * leanMeter > 2) ctx.fill();
          A.draw.label(ctx, '平稳', mid - bw / 2 - 22, H - 25, { font: '10px system-ui', color: '#93a0c8' });
          A.draw.label(ctx, '倒塌', mid + bw / 2 + 22, H - 25, { font: '10px system-ui', color: '#93a0c8' });
        }

        if (mode === 'challenge' && chStage) {
          const chLabel = 'C' + String(chStage.stageNumber || 0).padStart(2, '0') + ' ' + chStage.title;
          A.draw.label(ctx, chLabel, 12, 20, { align: 'left', font: 'bold 14px system-ui', color: '#63e0c8' });
          A.draw.label(ctx, '楼层 ' + chPlaced + '/' + (chWin.floorsAtLeast || chBoxesData.length) + ' · 目标 ' + chTargetOffset() + 'px', W / 2, 44, {
            font: '11px system-ui',
            color: 'rgba(238,241,255,0.72)',
          });
          A.draw.label(ctx, '倾斜 ' + Math.abs(towerLean).toFixed(3) + '/' + chMaxLean + ' · 落空 ' + chMisses, W - 12, 20, {
            align: 'right',
            font: 'bold 12px system-ui',
            color: Math.abs(towerLean) > chMaxLean * 0.8 ? '#ff9a9a' : '#93a0c8',
          });
          if (chGoalHintTimer > 0) {
            A.draw.label(ctx, chStage.goalStatement || '', W / 2, 64, { font: '12px system-ui', color: '#ffe08a' });
          }
        } else {
          A.draw.label(ctx, 'SCORE ' + score, 12, 20, { align: 'left', font: 'bold 14px system-ui', color: '#ffd23f' });
          A.draw.label(ctx, '第 ' + floorsReached + ' 层 · 摆速 ' + (pend.gravity / 680).toFixed(1) + '×', W / 2, 44, {
            font: '11px system-ui',
            color: 'rgba(238,241,255,0.55)',
          });
          if (perfectCombo >= 2) {
            A.draw.label(ctx, 'PERFECT ×' + perfectCombo, W - 12, 20, { align: 'right', font: 'bold 13px system-ui', color: '#63d68c' });
          }
        }
        ctx.restore();
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      syncChallengePanel();
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return this.joyInfo();
          },
          joyInfo() {
            return {
              tools: { guide: tools.guide, brace: tools.brace },
              guideArmed,
              guideVisible: state === 'playing' && pendHasBox && (floorsReached < 3 || guideArmed),
              towerLean,
              leanVel,
              leanMeter,
              floorsReached,
              score,
              state,
              feedback: feedback ? feedback.text : null,
              pendHasBox,
              dropping: !!drop,
            };
          },
          useJoyTool(id) {
            const button = joyButtons[id];
            if (!button || button.disabled) return false;
            button.click();
            return true;
          },
          setLean(lean, vel) {
            towerLean = clamp(Number(lean) || 0, -LEAN_LIMIT + 0.01, LEAN_LIMIT - 0.01);
            leanVel = Number(vel) || 0;
            leanMeter = clamp(Math.abs(towerLean) / LEAN_LIMIT, 0, 1);
            syncJoyTools();
            return this.joyInfo();
          },
          stackTo(floors) {
            const target = clamp(Math.floor(Number(floors) || 0), 0, 40);
            while (floorsReached < target) {
              const top = towerTop();
              boxes.push({ x: top.x, y: top.y - BOX_H, w: BOX_W, h: BOX_H });
              syncHud();
            }
            updateSwingDifficulty();
            syncJoyTools();
            return floorsReached;
          },
          releaseNow() {
            const available = pendHasBox && !drop;
            releaseBox();
            return !!(available && !pendHasBox && drop);
          },
          forceSettle(offset) {
            const top = towerTop();
            const e = Number(offset) || 0;
            drop = {
              x: top.x + e,
              y: top.y - BOX_H,
              w: BOX_W,
              h: BOX_H,
              vy: 120,
              prevBottom: top.y - BOX_H,
              missed: false,
              squash: 0,
            };
            settleDrop();
            syncJoyTools();
            return feedback ? feedback.text : null;
          },
          /* ---------- 0.9 挑战模式钩子（契约见 docs/arcade/0.9/INTEGRATION-CONTRACT.md §5） ---------- */
          challengeStages() {
            return challengeData.map((stage) => {
              const best = A.Challenge.progress(gameId).best[stage.id] || null;
              return {
                id: stage.id,
                stageNumber: stage.stageNumber,
                title: stage.title,
                unlocked: A.Challenge.isUnlocked(gameId, stage.id),
                best: best ? { timeSec: best.timeSec, assisted: !!best.assisted } : null,
              };
            });
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              stageIndex: chStageIndex,
              state,
              elapsedSec: Math.round(chElapsed * 10) / 10,
              objective: chStage ? chStage.goalStatement : null,
              cleared: !!chLastResult,
              collectibles: [],
              assisted: chAssisted,
              floors: chPlaced,
              floorsRequired: chWin.floorsAtLeast || chBoxesData.length,
              marks: chMarks.slice(),
              misses: chMisses,
              maxDroppedBoxes: chLimits.maxDroppedBoxes,
              towerLean,
              maxLean: chMaxLean,
              toolsUsed: { guide: chToolsUsed.guide, brace: chToolsUsed.brace },
              evaluation: chEvaluation,
              errorReason: chErrorReason,
            };
          },
          stageObservable() {
            return challengeObservable();
          },
          releaseWhenAligned(offset, tolerance) {
            return releaseWhenAligned(offset, tolerance);
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing' || !chStage) return false;
            if (assisted === true) chAssisted = true;
            return challengeClear();
          },
          forceStageFail(reason) {
            return challengeFail(typeof reason === 'string' && reason ? reason : '测试强制失败');
          },
          exitChallenge() {
            return exitChallengeToStart();
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '层塔',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync(); syncJoyTools();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
