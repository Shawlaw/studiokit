<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="极速车道：n 路赛车避障竞速游戏，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <title>极速车道 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#ff7847; --card-accent:#ff7847">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🏎 极速车道</h1>
      <div class="game-hud">
        <span>距离 <strong data-hud-score>0</strong>m</span>
        <span>最高 <strong data-hud-high>0</strong>m</span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="极速车道游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>极速车道</h2>
            <p data-ov-text>n 路赛车避障</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
      </div>
    </div>
    <div class="touch-pad road-pad" data-touch-pad aria-label="赛车变道操作面板">
      <button type="button" class="touch-btn" data-touch="left" aria-label="向左变道">←</button>
      <button type="button" class="touch-btn" data-touch="right" aria-label="向右变道">→</button>
      <button type="button" class="touch-btn" data-joy-tool="shield" aria-pressed="false" aria-label="防撞气囊，剩余 1 次（快捷键 1）" title="防撞气囊（1）：武装后，下一次撞车不扣命、不减速">
        <span aria-hidden="true">🛡</span><span data-joy-count aria-hidden="true">1</span>
      </button>
      <button type="button" class="touch-btn" data-joy-tool="calm" aria-label="车流慢放 6 秒，剩余 2 次（快捷键 2）" title="车流慢放（2）：6 秒内迎面车流相对速度降至 55%">
        <span aria-hidden="true">🫧</span><span data-joy-count aria-hidden="true">2</span>
      </button>
    </div>
    <p class="game-hint">←→ / A D 变道 · 道具 1/2 · 5000m 抵达终点 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const HORIZON = 236;
      const ROAD_BOTTOM = 744;
      const ROAD_W_FAR = 54;
      const ROAD_W_NEAR = 336;
      const CX = W / 2;
      const LANES = 4;
      const PLAYER_Y = 636;
      const PERSP = 2.6; /* 透视曲线指数 */

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        joyShield: document.querySelector('[data-joy-tool="shield"]'),
        joyCalm: document.querySelector('[data-joy-tool="calm"]'),
      };
      const ui = A.createOverlayUi(dom);

      const particles = A.createParticles();

      /* z ∈ [0(玩家处), 1(地平线)] → 屏幕 u（0 地平线 1 底部） */
      function uOf(z) {
        return 1 - z;
      }
      function scaleAt(u) {
        return Math.pow(u, PERSP);
      }
      function yAt(u) {
        return HORIZON + (ROAD_BOTTOM - HORIZON) * Math.pow(u, PERSP);
      }
      function roadHalfAt(u) {
        return lerp(ROAD_W_FAR, ROAD_W_NEAR, Math.pow(u, PERSP)) / 2;
      }
      function laneCenterX(lane, u) {
        const half = roadHalfAt(u);
        return CX + half * 2 * ((lane + 0.5) / LANES - 0.5);
      }
      function dividerX(k, u) {
        const half = roadHalfAt(u);
        return CX + half * 2 * (k / LANES - 0.5);
      }
      function nearestLane(x) {
        let best = 1;
        let bestDistance = Infinity;
        for (let lane = 0; lane < LANES; lane++) {
          const d = Math.abs(x - laneCenterX(lane, uOf(0)));
          if (d < bestDistance) {
            bestDistance = d;
            best = lane;
          }
        }
        return best;
      }

      const player = { x: CX, lane: 1, vx: 0, tilt: 0, invul: 0 };
      let cars = [];
      let props = [];
      let speed = 0.28; /* 归一化速度 0~1 */
      let dist = 0;
      let lives = 3;
      let spawnTimer = 0.8;
      let dashOffset = 0;
      let state = 'ready';
      let recordSaved = false;
      let shake = 0;
      let exhaustTimer = 0;
      let keyWasDown = {};
      const JOY_GOAL_DIST = 5000;
      const CALM_SECONDS = 6;
      const tools = { shield: 1, calm: 2 };
      let shieldArmed = false;
      /* 只有 0.7.0 新开的局才启用 5000m 终点；旧版无尽档恢复后保持原玩法。 */
      let shortRun = true;
      let calmTimer = 0;
      let joyLastResult = null;

      let high = A.Progress.get('road-rush').high;
      dom.hudHigh.textContent = String(high);

      const CAR_COLORS = ['#e05656', '#4f7cff', '#3fbf7f', '#f2d13d', '#c06bff', '#ff9a3d'];
      const CAR_KINDS = [
        { w: 40, h: 62, own: [0.14, 0.3], color: null }, /* 慢车 */
        { w: 40, h: 62, own: [0.34, 0.48], color: null }, /* 中速 */
        { w: 44, h: 78, own: [0.05, 0.14], color: '#9aa6c8', truck: true }, /* 卡车慢大 */
      ];

      /* ---------- 流程 ---------- */
      function reset() {
        cars = [];
        props = [];
        for (let i = 0; i < 10; i++) {
          props.push({ z: i / 10 + rand(0, 0.05), side: i % 2 === 0 ? -1 : 1, kind: randInt(0, 1) });
        }
        player.x = laneCenterX(1, uOf(0));
        player.lane = 1;
        player.vx = 0;
        player.tilt = 0;
        player.invul = 0;
        speed = 0.28;
        dist = 0;
        lives = 3;
        spawnTimer = 0.8;
        dashOffset = 0;
        shake = 0;
        recordSaved = false;
        keyWasDown = {};
        tools.shield = 1;
        tools.calm = 2;
        shieldArmed = false;
        calmTimer = 0;
        shortRun = true;
        particles.clear();
        syncHud();
      }

      function syncHud() {
        dom.hudScore.textContent = String(Math.floor(dist));
      }

      function showOverlay(title, text, btn, onBtn, btn2, onBtn2) {
        ui.show({ title, text, btn, onBtn, btn2, onBtn2 });
      }
      function hideOverlay() {
        ui.hide();
      }

      function startGame() {
        autosave.clear();
        reset();
        state = 'playing';
        hideOverlay();
        loop.resume();
        pauseUi.sync();
        syncTouchPad();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        hideOverlay();
        loop.resume();
        pauseUi.sync();
        syncTouchPad();
      }

      function gameOver(won) {
        if (state === 'over') return;
        const wonRun = won === true;
        state = 'over';
        A.Sfx.play(wonRun ? 'perfect' : 'over');
        autosave.clear();
        const finalDist = Math.floor(dist);
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('road-rush', finalDist); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, finalDist));
        }
        loop.pause();
        showOverlay(
          wonRun ? '抵达终点！' : '车辆损毁',
          `<span class="ac-score">${finalDist}m</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `行驶距离 · 最高 ${Math.max(high, finalDist)}m`,
          '再来一局',
          startGame
        );
        pauseUi.sync();
        syncTouchPad();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        showOverlay('已暂停', '引擎怠速中。<br/>局内进度已保存，可以随时离开。', '继续', resumeGame);
        pauseUi.sync();
        syncTouchPad();
      }

      function showStart() {
        showOverlay(
          '极速车道',
          '四车道赛车避障：5000m 抵达终点。<br/>点击左右按钮或 ←→ 一次变一条车道<br/>生命 ×3 · 道具 1/2 主动使用',
          '开始游戏',
          startGame
        );
      }

      function syncJoyTools() {
        if (!dom.joyShield || !dom.joyCalm) return;
        dom.joyShield.querySelector('[data-joy-count]').textContent = String(tools.shield);
        dom.joyCalm.querySelector('[data-joy-count]').textContent = String(tools.calm);
        dom.joyShield.disabled = state !== 'playing' || shieldArmed || tools.shield <= 0;
        dom.joyCalm.disabled = state !== 'playing' || calmTimer > 0 || tools.calm <= 0;
        dom.joyShield.setAttribute('aria-pressed', String(shieldArmed));
        dom.joyShield.setAttribute('aria-label', shieldArmed
          ? '防撞气囊已武装，下一次撞车不扣命、不减速'
          : '防撞气囊，剩余 ' + tools.shield + ' 次（快捷键 1）');
        dom.joyCalm.setAttribute('aria-label', calmTimer > 0
          ? '车流慢放生效中，剩余 ' + calmTimer.toFixed(1) + ' 秒'
          : '车流慢放 6 秒，剩余 ' + tools.calm + ' 次（快捷键 2）');
      }

      function activateJoyTool(id) {
        if (state !== 'playing') return false;
        if (id === 'shield') {
          if (shieldArmed || tools.shield <= 0) return false;
          shieldArmed = true;
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        if (id === 'calm') {
          if (calmTimer > 0 || tools.calm <= 0) return false;
          tools.calm -= 1;
          calmTimer = CALM_SECONDS;
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        return false;
      }

      function clickJoyTool(id) {
        const button = document.querySelector('[data-joy-tool="' + id + '"]');
        if (!button) return false;
        joyLastResult = null;
        button.click();
        return joyLastResult === true;
      }

      function bindJoyTools() {
        document.querySelectorAll('[data-joy-tool]').forEach((button) => {
          button.addEventListener('click', () => {
            joyLastResult = activateJoyTool(button.dataset.joyTool);
          });
        });
        window.addEventListener('keydown', (e) => {
          if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
          const target = e.target;
          if (target && target.tagName) {
            const tag = target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
          }
          const id = { '1': 'shield', '2': 'calm' }[e.key];
          if (!id) return;
          e.preventDefault();
          clickJoyTool(id);
        });
      }

      function changeLane(delta) {
        if (state !== 'playing') return;
        const next = clamp(player.lane + delta, 0, LANES - 1);
        if (next === player.lane) return;
        player.lane = next;
        A.Sfx.play('ui');
      }

      function syncTouchPad() {
        document.querySelectorAll('[data-touch]').forEach((btn) => {
          btn.disabled = state !== 'playing';
        });
        syncJoyTools();
      }

      function bindTouchPad() {
        const pad = document.querySelector('[data-touch-pad]');
        if (!pad) return;
        pad.querySelectorAll('[data-touch]').forEach((btn) => {
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (state !== 'playing') return;
            changeLane(btn.dataset.touch === 'left' ? -1 : 1);
          });
          btn.addEventListener('contextmenu', (e) => e.preventDefault());
        });
        syncTouchPad();
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          cars: cars.map((c) => ({ lane: c.lane, z: c.z, own: c.own, w: c.w, h: c.h, truck: c.truck, color: c.color, passed: c.passed })),
          props: props.map((p) => ({ z: p.z, side: p.side, kind: p.kind })),
          speed,
          dist,
          lives,
          spawnTimer,
          dashOffset,
          player: { x: player.x, lane: player.lane, vx: player.vx, tilt: player.tilt, invul: player.invul },
          tools: { shield: tools.shield, calm: tools.calm },
          shieldArmed,
          calmTimer,
          shortRun,
        };
      }

      function restore(data) {
        if (!data || !Array.isArray(data.cars) || !data.player) return false;
        try {
          reset();
          cars = data.cars
            .filter((c) => c && isFinite(c.z) && isFinite(c.lane))
            .map((c) => ({
              lane: clamp(Math.round(Number(c.lane)), 0, LANES - 1),
              z: clamp(Number(c.z), -0.2, 1.2),
              own: clamp(Number(c.own) || 0.2, 0.02, 0.6),
              w: Number(c.w) || 40,
              h: Number(c.h) || 62,
              truck: !!c.truck,
              color: typeof c.color === 'string' ? c.color : CAR_COLORS[0],
              passed: !!c.passed,
            }));
          props = Array.isArray(data.props)
            ? data.props
                .filter((p) => p && isFinite(p.z))
                .map((p) => ({ z: clamp(Number(p.z), 0, 1), side: p.side === -1 ? -1 : 1, kind: p.kind === 1 ? 1 : 0 }))
            : [];
          speed = clamp(Number(data.speed) || 0.28, 0.2, 1);
          dist = Math.max(0, Number(data.dist) || 0);
          lives = clamp(Number(data.lives) || 3, 1, 3);
          spawnTimer = Number(data.spawnTimer) || 0.8;
          dashOffset = Number(data.dashOffset) || 0;
          player.x = clamp(Number(data.player.x) || laneCenterX(1, uOf(0)), CX - 150, CX + 150);
          const savedLane = Number(data.player.lane);
          player.lane = Number.isFinite(savedLane) ? clamp(Math.round(savedLane), 0, LANES - 1) : nearestLane(player.x);
          player.vx = Number(data.player.vx) || 0;
          player.tilt = Number(data.player.tilt) || 0;
          player.invul = Number(data.player.invul) || 0;
          if (data.tools && typeof data.tools === 'object') {
            tools.shield = Number.isFinite(Number(data.tools.shield)) ? clamp(Math.floor(Number(data.tools.shield)), 0, 1) : 1;
            tools.calm = Number.isFinite(Number(data.tools.calm)) ? clamp(Math.floor(Number(data.tools.calm)), 0, 2) : 2;
          }
          shieldArmed = !!data.shieldArmed && tools.shield > 0;
          calmTimer = clamp(Number(data.calmTimer) || 0, 0, CALM_SECONDS);
          shortRun = data.shortRun === true;
          recordSaved = false;
          syncHud();
          syncTouchPad();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('road-rush', serialize, {
        every: 4,
        meta: () => ({ score: Math.floor(dist), summary: `${Math.floor(dist)}m · ${Math.round(speed * 360)}km/h` }),
      });

      function laneClearTime(lane, extra) {
        let min = Infinity;
        const consider = (car) => {
          if (!car || car.lane !== lane || car.own >= speed) return;
          const closing = (speed - car.own) / 0.9;
          if (closing <= 0) return;
          const t = Math.max(0, car.z) / closing;
          if (t < min) min = t;
        };
        cars.forEach(consider);
        if (extra) consider(extra);
        return min;
      }

      function safeLaneList(extra) {
        const out = [];
        for (let lane = 0; lane < LANES; lane++) {
          if (laneClearTime(lane, extra) > 1.2) out.push(lane);
        }
        return out;
      }

      /* 未来 2.4s 内，玩家当前/相邻车道必须始终留有一条可躲避车道。 */
      function futureSafe(extra) {
        const list = extra ? cars.concat(extra) : cars;
        for (let t = 0; t <= 2.4; t += 0.1) {
          const danger = [false, false, false, false];
          for (const car of list) {
            const z = car.z - ((speed - car.own) / 0.9) * t;
            if (z > -0.08 && z < 0.5) danger[car.lane] = true;
          }
          let escape = false;
          const from = Math.max(0, player.lane - 1);
          const to = Math.min(LANES - 1, player.lane + 1);
          for (let lane = from; lane <= to; lane++) {
            if (!danger[lane]) escape = true;
          }
          if (!escape) return false;
        }
        return true;
      }

      function spawnCar() {
        if (cars.length >= 18) return;
        for (let attempt = 0; attempt < 14; attempt++) {
          const lane = randInt(0, LANES - 1);
          if (cars.some((c) => c.lane === lane && c.z > 0.9)) continue;
          const kindIdx = speed > 0.55 && Math.random() > 0.85 ? 2 : randInt(0, 1);
          const k = CAR_KINDS[kindIdx];
          const candidate = {
            lane,
            z: 1,
            own: rand(k.own[0], k.own[1]),
            w: k.w,
            h: k.h,
            truck: !!k.truck,
            color: k.truck ? k.color : CAR_COLORS[randInt(0, CAR_COLORS.length - 1)],
            passed: false,
          };
          const safe = safeLaneList(candidate);
          /* 保留一条玩家在 1.2 秒内（最多两车道）能到达的安全走廊。 */
          const reachable = safe.some((l) => Math.abs(l - player.lane) <= 2);
          if (reachable && futureSafe(candidate)) {
            cars.push(candidate);
            return;
          }
        }
      }

      /* ---------- 更新 ---------- */
      function update(dt) {
        particles.update(dt);
        shake = Math.max(0, shake - dt * 20);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        const hadCalm = calmTimer > 0;
        calmTimer = Math.max(0, calmTimer - dt);
        if (hadCalm && calmTimer <= 0) syncJoyTools();

        /* 加速曲线 */
        speed = Math.min(1, speed + 0.02 * dt + 0.004 * dt);
        const kmh = speed * 360;
        const mps = kmh / 3.6;
        dist += mps * dt;
        syncHud();
        if (shortRun && dist >= JOY_GOAL_DIST) {
          gameOver(true);
          input.endFrame();
          return;
        }

        /* 玩家变道：一次按键/点击移动一条车道，x 只做短过渡动画。 */
        const leftNow = input.isDown('ArrowLeft', 'a');
        const rightNow = input.isDown('ArrowRight', 'd');
        if (leftNow && !keyWasDown.left) changeLane(-1);
        if (rightNow && !keyWasDown.right) changeLane(1);
        keyWasDown.left = leftNow;
        keyWasDown.right = rightNow;
        if (input.pointer.wentDown) changeLane(input.pointer.x < W / 2 ? -1 : 1);
        const targetX = laneCenterX(player.lane, uOf(0));
        const prevX = player.x;
        player.x = lerp(player.x, targetX, Math.min(1, 16 * dt));
        player.vx = dt > 0 ? (player.x - prevX) / dt : 0;
        player.tilt = lerp(player.tilt, clamp(player.vx / 420, -1, 1) * 0.14, Math.min(1, 10 * dt));
        player.invul = Math.max(0, player.invul - dt);

        /* 车道虚线滚动 */
        dashOffset = (dashOffset + speed * dt * 2.2) % (1 / 7);

        /* 敌车 */
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = lerp(1.15, 0.52, speed);
          spawnCar();
          if (speed > 0.7 && Math.random() > 0.6) spawnCar();
        }
        const playerBox = { x: player.x - 19, y: PLAYER_Y - 26, w: 38, h: 54 };
        for (let i = cars.length - 1; i >= 0; i--) {
          const c = cars[i];
          c.z -= ((speed - c.own) * dt * (calmTimer > 0 ? 0.55 : 1)) / 0.9;
          if (c.z < -0.14) {
            cars.splice(i, 1);
            continue;
          }
          /* 超车计分提示（可选不做） */
          if (!c.passed && c.z < -0.02) c.passed = true;
          /* 碰撞（玩家段） */
          if (c.z < 0.07 && c.z > -0.07 && player.invul <= 0) {
            const u = uOf(Math.max(c.z, 0));
            const sc = scaleAt(u);
            const cx2 = laneCenterX(c.lane, u);
            const cw = c.w * sc;
            const ch = c.h * sc;
            const box = { x: cx2 - cw / 2, y: yAt(u) - ch, w: cw, h: ch };
            if (A.Physics.aabbOverlap(playerBox, box)) {
              hitPlayer(c, i);
            }
          }
        }

        /* 路边装饰 */
        props.forEach((p) => {
          p.z -= speed * dt / 0.9;
          if (p.z < 0) {
            p.z += 1;
            p.side = Math.random() > 0.5 ? 1 : -1;
            p.kind = randInt(0, 1);
          }
        });

        /* 排气粒子 */
        exhaustTimer -= dt;
        if (exhaustTimer <= 0 && !A.reducedMotion) {
          exhaustTimer = 0.06;
          particles.emit(player.x + rand(-10, 10), PLAYER_Y + 30, {
            count: 1,
            speed: [10, 40],
            angle: [Math.PI * 0.35, Math.PI * 0.65],
            life: [0.2, 0.4],
            size: [2, 4],
            colors: ['rgba(200,205,230,0.5)'],
          });
        }

        input.endFrame();
      }

      function hitPlayer(c, idx) {
        cars.splice(idx, 1);
        if (shieldArmed) {
          shieldArmed = false;
          tools.shield = Math.max(0, tools.shield - 1);
          player.invul = 1.0;
          shake = A.reducedMotion ? 0 : 5;
          A.Sfx.play('perfect');
          particles.emit(player.x, PLAYER_Y, {
            count: A.reducedMotion ? 6 : 16,
            speed: [50, 180], life: [0.2, 0.5], size: [2, 5],
            colors: ['#7ce8e0', '#ffffff'],
          });
          syncJoyTools();
          autosave.saveNow();
          return;
        }
        lives -= 1;
        speed = Math.max(0.2, speed * 0.45);
        player.invul = 1.9;
        shake = A.reducedMotion ? 0 : 9;
        A.Sfx.play('explode');
        particles.emit(player.x, PLAYER_Y, {
          count: 26,
          speed: [60, 280],
          life: [0.3, 0.8],
          size: [2, 5],
          colors: ['#ff7847', '#ffd23f', '#ffffff'],
          gravity: 60,
        });
        if (lives <= 0) {
          gameOver();
        }
      }

      /* ---------- 渲染 ---------- */
      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 60);
        sky.addColorStop(0, '#2c1a4d');
        sky.addColorStop(0.7, '#c4557a');
        sky.addColorStop(1, '#ffb46b');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, HORIZON + 60);
        /* 落日 */
        ctx.fillStyle = 'rgba(255,235,190,0.95)';
        ctx.beginPath();
        ctx.arc(CX, HORIZON - 26, 34, 0, TAU);
        ctx.fill();
        /* 远山 */
        ctx.fillStyle = 'rgba(40,22,64,0.8)';
        ctx.beginPath();
        ctx.moveTo(0, HORIZON);
        ctx.lineTo(70, HORIZON - 46);
        ctx.lineTo(150, HORIZON - 12);
        ctx.lineTo(250, HORIZON - 60);
        ctx.lineTo(340, HORIZON - 18);
        ctx.lineTo(420, HORIZON - 38);
        ctx.lineTo(420, HORIZON + 4);
        ctx.lineTo(0, HORIZON + 4);
        ctx.closePath();
        ctx.fill();
      }

      function drawRoad() {
        /* 草地 */
        const grass = ctx.createLinearGradient(0, HORIZON, 0, H);
        grass.addColorStop(0, '#27502f');
        grass.addColorStop(1, '#1c3a24');
        ctx.fillStyle = grass;
        ctx.fillRect(0, HORIZON, W, H - HORIZON);

        /* 路面梯形（含路肩） */
        function roadPoly(uTop, uBottom, halfMargin) {
          const x1 = CX - roadHalfAt(uBottom) * halfMargin;
          const x2 = CX + roadHalfAt(uBottom) * halfMargin;
          const x3 = CX + roadHalfAt(uTop) * halfMargin;
          const x4 = CX - roadHalfAt(uTop) * halfMargin;
          ctx.beginPath();
          ctx.moveTo(x1, yAt(uBottom));
          ctx.lineTo(x2, yAt(uBottom));
          ctx.lineTo(x3, yAt(uTop));
          ctx.lineTo(x4, yAt(uTop));
          ctx.closePath();
        }
        /* 路肩红白条（z 空间按 dashOffset 滚动） */
        const segLen = 1 / 8;
        for (let i = -1; i < 9; i++) {
          const zA = clamp(i / 8 + dashOffset * 0.9, 0, 1);
          const zB = clamp(zA + segLen / 2, 0, 1);
          if (zB <= zA) continue;
          ctx.fillStyle = i % 2 === 0 ? '#d8443f' : '#f0f2fa';
          roadPoly(uOf(zB), uOf(zA), 1.08);
          ctx.fill();
        }
        /* 主路面 */
        ctx.fillStyle = '#3a3f52';
        roadPoly(0, 1, 1);
        ctx.fill();
        /* 中央车道虚线 ×3 */
        ctx.fillStyle = 'rgba(240,242,250,0.85)';
        for (let lane = 1; lane < LANES; lane++) {
          for (let i = 0; i < 8; i++) {
            const zA = clamp(i / 8 + dashOffset, 0, 1);
            const zB = clamp(zA + 0.05, 0, 1);
            if (zB <= zA) continue;
            const wA = 3 * scaleAt(uOf(zA)) * 1.4;
            const wB = 3 * scaleAt(uOf(zB)) * 1.4;
            const xA = dividerX(lane, uOf(zA));
            const xB = dividerX(lane, uOf(zB));
            ctx.beginPath();
            ctx.moveTo(xA - wA / 2, yAt(uOf(zA)));
            ctx.lineTo(xA + wA / 2, yAt(uOf(zA)));
            ctx.lineTo(xB + wB / 2, yAt(uOf(zB)));
            ctx.lineTo(xB - wB / 2, yAt(uOf(zB)));
            ctx.closePath();
            ctx.fill();
          }
        }
        /* 路缘白线 */
        ctx.fillStyle = 'rgba(240,242,250,0.9)';
        ctx.beginPath();
        ctx.moveTo(CX - roadHalfAt(1) * 0.96, yAt(1));
        ctx.lineTo(CX - roadHalfAt(1) * 0.99, yAt(1));
        ctx.lineTo(CX - roadHalfAt(0) * 0.94, yAt(0));
        ctx.lineTo(CX - roadHalfAt(0) * 0.9, yAt(0));
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(CX + roadHalfAt(1) * 0.99, yAt(1));
        ctx.lineTo(CX + roadHalfAt(1) * 0.96, yAt(1));
        ctx.lineTo(CX + roadHalfAt(0) * 0.9, yAt(0));
        ctx.lineTo(CX + roadHalfAt(0) * 0.94, yAt(0));
        ctx.closePath();
        ctx.fill();
      }

      function drawProp(p) {
        const u = uOf(clamp(p.z, 0, 1));
        const sc = scaleAt(u);
        const y = yAt(u);
        const half = roadHalfAt(u);
        const x = CX + (p.side > 0 ? 1 : -1) * (half + 26 * sc + 10 * sc);
        if (p.kind === 0) {
          /* 树 */
          const th = 66 * sc;
          ctx.fillStyle = '#3a2a20';
          ctx.fillRect(x - 3 * sc, y - th * 0.4, 6 * sc, th * 0.4);
          ctx.fillStyle = '#2e6b3e';
          ctx.beginPath();
          ctx.moveTo(x, y - th);
          ctx.lineTo(x + 16 * sc, y - th * 0.32);
          ctx.lineTo(x - 16 * sc, y - th * 0.32);
          ctx.closePath();
          ctx.fill();
        } else {
          /* 里程牌 */
          const ph = 46 * sc;
          ctx.fillStyle = '#8d94ad';
          ctx.fillRect(x - 2 * sc, y - ph, 4 * sc, ph);
          ctx.fillStyle = '#2f7d4f';
          ctx.fillRect(x - 12 * sc, y - ph - 16 * sc, 24 * sc, 18 * sc);
        }
      }

      function drawCar(x, yBottom, w, h, color, truck, tilt, isPlayer) {
        ctx.save();
        ctx.translate(x, yBottom);
        if (tilt) ctx.rotate(tilt);
        /* 阴影 */
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(0, -2, w * 0.55, h * 0.09, 0, 0, TAU);
        ctx.fill();
        if (truck) {
          /* 车厢 */
          ctx.fillStyle = '#b7c0d8';
          ctx.fillRect(-w / 2, -h, w, h * 0.62);
          ctx.strokeStyle = '#7d8aa8';
          ctx.strokeRect(-w / 2 + 2, -h + 2, w - 4, h * 0.62 - 4);
          /* 车头 */
          ctx.fillStyle = color;
          A.draw.roundRect(ctx, -w / 2 + 2, -h * 0.38, w - 4, h * 0.38, 6);
          ctx.fill();
        } else {
          /* 车身 */
          ctx.fillStyle = color;
          A.draw.roundRect(ctx, -w / 2, -h, w, h * 0.86, 8);
          ctx.fill();
          /* 车窗 */
          ctx.fillStyle = 'rgba(20,26,48,0.85)';
          A.draw.roundRect(ctx, -w * 0.32, -h * 0.92, w * 0.64, h * 0.3, 4);
          ctx.fill();
          A.draw.roundRect(ctx, -w * 0.3, -h * 0.55, w * 0.6, h * 0.22, 3);
          ctx.fill();
          /* 尾灯 */
          if (isPlayer) {
            ctx.fillStyle = '#ff5d5d';
            ctx.fillRect(-w / 2 + 2, -h * 0.26, 6, 4);
            ctx.fillRect(w / 2 - 8, -h * 0.26, 6, 4);
          } else {
            ctx.fillStyle = '#ffd23f';
            ctx.fillRect(-w / 2 + 2, -h * 0.28, 6, 4);
            ctx.fillRect(w / 2 - 8, -h * 0.28, 6, 4);
          }
        }
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        drawSky();
        drawRoad();

        /* 路边装饰（远→近） */
        props
          .slice()
          .sort((a, b) => b.z - a.z)
          .forEach(drawProp);

        /* 敌车（远→近） */
        cars
          .slice()
          .sort((a, b) => b.z - a.z)
          .forEach((c) => {
            const u = uOf(clamp(c.z, 0, 1));
            const sc = scaleAt(u);
            drawCar(laneCenterX(c.lane, u), yAt(u), c.w * sc, c.h * sc, c.color, c.truck, 0, false);
          });

        particles.draw(ctx);

        /* 玩家车 */
        if ((state === 'playing' || state === 'paused') && !(player.invul > 0 && Math.floor(player.invul * 12) % 2 === 0)) {
          drawCar(player.x, PLAYER_Y + 30, 40, 62, '#ff7847', false, player.tilt, true);
        }

        /* HUD */
        A.draw.label(ctx, Math.floor(dist) + ' / ' + JOY_GOAL_DIST + ' m', 12, 22, { align: 'left', font: 'bold 15px system-ui', color: '#ffd23f' });
        const kmh = Math.round(speed * 360);
        A.draw.label(ctx, kmh + ' km/h', W - 14, 22, { align: 'right', font: 'bold 15px system-ui', color: '#eef1ff' });
        const joyText = calmTimer > 0 ? '慢放 ' + calmTimer.toFixed(1) + 's' : shieldArmed ? '气囊已武装' : '';
        if (joyText) A.draw.label(ctx, joyText, W / 2, 48, { font: 'bold 12px system-ui', color: '#7ce8e0' });
        for (let i = 0; i < lives; i++) {
          ctx.save();
          ctx.translate(W - 24 - i * 18, 44);
          ctx.fillStyle = '#ff7847';
          ctx.beginPath();
          ctx.moveTo(0, -6);
          ctx.lineTo(6, 6);
          ctx.lineTo(-6, 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      /* ---------- 输入与循环 ---------- */
      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      bindTouchPad();
      bindJoyTools();
      syncTouchPad();
      syncJoyTools();
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              lane: player.lane,
              x: player.x,
              speed,
              cars: cars.length,
              safe: safeLaneList(),
              state,
              dist,
              lives,
              tools: { shield: tools.shield, calm: tools.calm },
              shieldArmed,
              calmTimer,
            };
          },
          joyInfo() {
            return {
              state,
              tools: { shield: tools.shield, calm: tools.calm },
              shieldArmed,
              calmTimer,
              dist,
              goal: JOY_GOAL_DIST,
              speed,
              lives,
            };
          },
          useJoyTool(id) {
            return clickJoyTool(id);
          },
          forceCollision() {
            cars.push({
              lane: player.lane, z: 0.06, own: 0.2, w: 40, h: 62,
              truck: false, color: CAR_COLORS[0], passed: false,
            });
            return true;
          },
          setDist(value) {
            dist = Math.max(0, Number(value) || 0);
            syncHud();
            return dist;
          },
          stressSpawn(count) {
            let violations = 0;
            let spawned = 0;
            for (let i = 0; i < (count || 100); i++) {
              const before = cars.length;
              spawnCar();
              if (cars.length > before) spawned += 1;
              if (!futureSafe(null)) violations += 1;
            }
            return { violations, spawned, cars: cars.length, safe: safeLaneList() };
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '极速车道',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              syncTouchPad();
              hideOverlay();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
