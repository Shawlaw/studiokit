<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="极速车道：n 路赛车避障竞速游戏，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/road-rush.js"></script>
  <title>极速车道 · 街机厅 · StudioKit</title>
  <style>
    /* 0.9 挑战模式：选关层盖住画布；挑战 HUD 叠在画布顶部，不拦截点击。 */
    .challenge-layer {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      overflow-y: auto;
      background: rgba(8, 13, 28, 0.96);
      border-radius: inherit;
    }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 8px;
      width: auto;
      z-index: 4;
      pointer-events: none;
    }
  </style>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#ff7847; --card-accent:#ff7847">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🏎 极速车道</h1>
      <div class="game-hud">
        <span>距离 <strong data-hud-score>0</strong>m</span>
        <span>最高 <strong data-hud-high>0</strong>m</span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="极速车道游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>极速车道</h2>
            <p data-ov-text>n 路赛车避障</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <p class="ac-challenge-tip" data-ch-tip hidden></p>
    <div class="touch-pad road-pad" data-touch-pad aria-label="赛车变道操作面板">
      <button type="button" class="touch-btn" data-touch="left" aria-label="向左变道">←</button>
      <button type="button" class="touch-btn" data-touch="right" aria-label="向右变道">→</button>
      <button type="button" class="touch-btn" data-joy-tool="shield" aria-pressed="false" aria-label="防撞气囊，剩余 1 次（快捷键 1）" title="防撞气囊（1）：武装后，下一次撞车不扣命、不减速">
        <span aria-hidden="true">🛡</span><span data-joy-count aria-hidden="true">1</span>
      </button>
      <button type="button" class="touch-btn" data-joy-tool="calm" aria-label="车流慢放 6 秒，剩余 2 次（快捷键 2）" title="车流慢放（2）：6 秒内迎面车流相对速度降至 55%">
        <span aria-hidden="true">🫧</span><span data-joy-count aria-hidden="true">2</span>
      </button>
    </div>
    <p class="game-hint">←→ / A D 变道 · 道具 1/2 · 5000m 抵达终点 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const HORIZON = 236;
      const ROAD_BOTTOM = 744;
      const ROAD_W_FAR = 54;
      const ROAD_W_NEAR = 336;
      const CX = W / 2;
      const LANES = 4;
      const PLAYER_Y = 636;
      const PERSP = 2.6; /* 透视曲线指数 */
      /* 0.8.5 车流规则：转向灯换道、加速带、连超尾流。 */
      const SIGNAL_LEAD = 0.55; /* 打灯到开始变道的预告时长 */
      const LANE_CHANGE_TIME = 0.5; /* 横向挪一条车道的过渡时长 */
      const COMBO_WINDOW = 4.5; /* 连超窗口：超时没有新的超车就归零 */
      const BOOST_SECONDS = 3; /* 加速带冲刺时长 */
      const PICKUP_GAP_MIN = 6;
      const PICKUP_GAP_MAX = 9.5;
      const MAX_CARS = 18; /* 车辆上限：旧测试与安全走廊都依赖它 */

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        joyShield: document.querySelector('[data-joy-tool="shield"]'),
        joyCalm: document.querySelector('[data-joy-tool="calm"]'),
      };
      const ui = A.createOverlayUi(dom);

      const particles = A.createParticles();

      /* z ∈ [0(玩家处), 1(地平线)] → 屏幕 u（0 地平线 1 底部） */
      function uOf(z) {
        return 1 - z;
      }
      function scaleAt(u) {
        /* 与路面共用同一条透视曲线：地平线处保留 ROAD_W_FAR/ROAD_W_NEAR ≈ 16% 的尺寸。
           旧实现用 u^2.6，车在地平线尺寸为 0，直到中段才突然“长”出来；
           现在远处车辆从地平线起就以小车身出现，位置在进入视野前就已固定。 */
        const t = Math.pow(clamp(u, 0, 1.2), PERSP);
        return (ROAD_W_FAR + (ROAD_W_NEAR - ROAD_W_FAR) * t) / ROAD_W_NEAR;
      }
      function laneWidthAt(u) {
        return (roadHalfAt(u) * 2) / LANES;
      }
      function yAt(u) {
        return HORIZON + (ROAD_BOTTOM - HORIZON) * Math.pow(u, PERSP);
      }
      function roadHalfAt(u) {
        return lerp(ROAD_W_FAR, ROAD_W_NEAR, Math.pow(u, PERSP)) / 2;
      }
      function laneCenterX(lane, u) {
        const half = roadHalfAt(u);
        return CX + half * 2 * ((lane + 0.5) / LANES - 0.5);
      }
      function dividerX(k, u) {
        const half = roadHalfAt(u);
        return CX + half * 2 * (k / LANES - 0.5);
      }
      function nearestLane(x) {
        let best = 1;
        let bestDistance = Infinity;
        for (let lane = 0; lane < LANES; lane++) {
          const d = Math.abs(x - laneCenterX(lane, uOf(0)));
          if (d < bestDistance) {
            bestDistance = d;
            best = lane;
          }
        }
        return best;
      }

      const player = { x: CX, lane: 1, vx: 0, tilt: 0, invul: 0 };
      let cars = [];
      let props = [];
      let speed = 0.28; /* 归一化速度 0~1 */
      let dist = 0;
      let lives = 3;
      let spawnTimer = 0.8;
      let dashOffset = 0;
      let state = 'ready';
      let recordSaved = false;
      let shake = 0;
      let exhaustTimer = 0;
      let keyWasDown = {};
      const JOY_GOAL_DIST = 5000;
      const CALM_SECONDS = 6;
      const tools = { shield: 1, calm: 2 };
      let shieldArmed = false;
      /* 只有 0.7.0 新开的局才启用 5000m 终点；旧版无尽档恢复后保持原玩法。 */
      let shortRun = true;
      let calmTimer = 0;
      let joyLastResult = null;
      /* 0.8.5：有效速度 = 巡航 + 尾流/氮气加成；连超、拾取与分段节奏。 */
      let cruise = 0.28;
      let pickups = [];
      let pickupTimer = 5;
      let combo = 0;
      let comboBest = 0;
      let comboTimer = 0;
      let comboFlash = 0;
      let nearPasses = 0;
      let passedCars = 0;
      let crashes = 0;
      let boostTimer = 0;
      let runSeconds = 0;
      let nextMilestone = 1000;
      let rushTimer = 0;
      let bannerTimer = 0;
      let bannerText = '';

      /* ---------- 0.9 挑战模式：固定车流时间轴（数据来自 ../challenge/road-rush.js） ---------- */
      const GAME_ID = 'road-rush';
      const challengeData = A.Challenge ? A.Challenge.stages(GAME_ID) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
        tip: document.querySelector('[data-ch-tip]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      const CH_GOAL_HINT_SEC = 3;
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chSimTime = 0;
      let chDuration = 12;
      let chSlots = [];
      let chSlotCheck = 0;
      let chLane = 1;
      let chLanePos = 1;
      let chLaneFrom = 1;
      let chLaneChangeTotal = 0.22;
      let chLaneChangeLeft = 0;
      let chScore = 0;
      let chPassed = 0;
      let chNear = 0;
      let chDistance = 0;
      let chGoalHintTimer = 0;
      let chHudSecond = -1;
      let chResult = null;
      let chAssisted = false;
      let chErrorReason = '';
      let chFailedSlot = null;
      let chKeyDown = { left: false, right: false };

      let high = A.Progress.get('road-rush').high;
      dom.hudHigh.textContent = String(high);

      const CAR_COLORS = ['#e05656', '#4f7cff', '#3fbf7f', '#f2d13d', '#c06bff', '#ff9a3d'];
      const CAR_KINDS = [
        { w: 40, h: 62, own: [0.14, 0.3], color: null }, /* 慢车 */
        { w: 40, h: 62, own: [0.34, 0.48], color: null }, /* 中速 */
        { w: 44, h: 78, own: [0.05, 0.14], color: '#9aa6c8', truck: true }, /* 卡车慢大 */
      ];

      /* ---------- 流程 ---------- */
      function reset() {
        cars = [];
        props = [];
        pickups = [];
        for (let i = 0; i < 10; i++) {
          props.push({ z: i / 10 + rand(0, 0.05), side: i % 2 === 0 ? -1 : 1, kind: randInt(0, 1) });
        }
        player.x = laneCenterX(1, uOf(0));
        player.lane = 1;
        player.vx = 0;
        player.tilt = 0;
        player.invul = 0;
        cruise = 0.28;
        speed = 0.28;
        dist = 0;
        lives = 3;
        spawnTimer = 0.8;
        pickupTimer = 5;
        dashOffset = 0;
        shake = 0;
        recordSaved = false;
        keyWasDown = {};
        tools.shield = 1;
        tools.calm = 2;
        shieldArmed = false;
        calmTimer = 0;
        shortRun = true;
        combo = 0;
        comboBest = 0;
        comboTimer = 0;
        comboFlash = 0;
        nearPasses = 0;
        passedCars = 0;
        crashes = 0;
        boostTimer = 0;
        runSeconds = 0;
        nextMilestone = 1000;
        rushTimer = 0;
        bannerTimer = 0;
        bannerText = '';
        particles.clear();
        syncHud();
      }

      function syncHud() {
        dom.hudScore.textContent = String(Math.floor(dist));
      }

      function showOverlay(title, text, btn, onBtn, btn2, onBtn2) {
        ui.show({ title, text, btn, onBtn, btn2, onBtn2 });
      }
      function hideOverlay() {
        ui.hide();
      }

      function startGame() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (chDom.tip) chDom.tip.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        autosave.clear();
        reset();
        state = 'playing';
        hideOverlay();
        loop.resume();
        pauseUi.sync();
        syncTouchPad();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        hideOverlay();
        loop.resume();
        pauseUi.sync();
        syncTouchPad();
      }

      /* 本局评价：无事故且连超多给 S+，每撞一次降一档。 */
      function runRating() {
        if (crashes === 0) return comboBest >= 8 ? 'S+' : 'S';
        if (crashes === 1) return 'A';
        if (crashes === 2) return 'B';
        return 'C';
      }

      function gameOver(won) {
        if (state === 'over') return;
        const wonRun = won === true;
        state = 'over';
        A.Sfx.play(wonRun ? 'perfect' : 'over');
        autosave.clear();
        const finalDist = Math.floor(dist);
        const rating = runRating();
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('road-rush', finalDist, {
            detail: '评价 ' + rating + ' · 最高连超 ×' + comboBest + ' · 超车 ' + passedCars + ' 次',
          });
          if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, finalDist));
        }
        loop.pause();
        showOverlay(
          wonRun ? '抵达终点！' : '车辆损毁',
          `<span class="ac-score">${finalDist}m</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `行驶距离 · 最高 ${Math.max(high, finalDist)}m<br/>` +
            `评价 <strong>${rating}</strong> · 最高连超 ×${comboBest} · 超车 ${passedCars} 次` +
            (wonRun ? ` · 用时 ${runSeconds.toFixed(1)}s` : ''),
          '再来一局',
          showStart
        );
        pauseUi.sync();
        syncTouchPad();
      }

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }
      function fmtTime(sec) {
        const s = Math.max(0, Math.floor(Number(sec) || 0));
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }
      function chContent() {
        return (chStage && chStage.content) || {};
      }
      function chGoalMinDistance() {
        const goal = chContent().goal || {};
        return Math.max(0, Number(goal.minDistanceMeters) || 0);
      }
      function chLaneCount() {
        return Math.max(2, Math.floor(Number(chContent().laneCount) || LANES));
      }
      function chBuildSlots(stage) {
        const content = (stage && stage.content) || {};
        const laneCount = Math.max(2, Math.floor(Number(content.laneCount) || LANES));
        const slotDuration = Math.max(0.3, Number(content.slotDurationSec) || 1.15);
        const timeline = Array.isArray(content.timeline) ? content.timeline : [];
        return timeline.map((slot, index) => ({
          slot: index + 1,
          atSec: Math.max(0, Number(slot && slot.atSec) || 0),
          occupiedLanes: (Array.isArray(slot && slot.occupiedLanes) ? slot.occupiedLanes : [])
            .map(Number)
            .filter((lane) => Number.isInteger(lane) && lane >= 0 && lane < laneCount),
          telegraphLeadSec: Math.max(0, Number(slot && slot.telegraphLeadSec) || 0),
          optionalNearPassBonusLanes: (Array.isArray(slot && slot.optionalNearPassBonusLanes) ? slot.optionalNearPassBonusLanes : [])
            .map(Number)
            .filter((lane) => Number.isInteger(lane) && lane >= 0 && lane < laneCount),
          durationSec: slotDuration,
          passAt: Math.max(0, Number(slot && slot.atSec) || 0) + slotDuration,
        }));
      }
      function chComputeDuration() {
        return chSlots.length ? chSlots[chSlots.length - 1].passAt : 0;
      }
      function chProgressLabel() {
        return Math.min(chSlots.length, chSlotCheck + 1) + '/' + chSlots.length;
      }
      function fmtChallengeLabel(stage) {
        return 'C' + String((stage && stage.stageNumber) || 0).padStart(2, '0');
      }
      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }
      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(GAME_ID);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }
      function showChallengePanel() {
        if (!challengeAvailable || !A.Challenge) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return false;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        if (chDom.hud) chDom.hud.hidden = true;
        if (chDom.tip) chDom.tip.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        loop.pause();
        ui.hide();
        state = 'challenge-menu';
        pauseUi.sync();
        syncTouchPad();
        return true;
      }
      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }
      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) return;
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chSimTime);
        if (second === chHudSecond) return;
        chHudSecond = second;
        chDom.hud.innerHTML =
          '<strong>' + chEsc(fmtChallengeLabel(chStage) + ' ' + (chStage.title || '')) + '</strong>' +
          '<span>目标 ' + Math.round(chGoalMinDistance()) + 'm · 路段 ' + chProgressLabel() + '</span>' +
          '<span>用时 ' + fmtTime(chSimTime) + '</span>';
      }
      function showGoalTip() {
        if (!chDom.tip || !chStage) return;
        chDom.tip.hidden = false;
        chDom.tip.textContent = '目标：' + (chStage.goalStatement || '') + ' · ' + (chStage.decision || '提前变道，避开被占用车道');
      }
      function startChallenge(ref) {
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(GAME_ID, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(GAME_ID, stage.id)) return false;
        autosave.clear();
        mode = 'challenge';
        chStage = stage;
        chStageIndex = challengeData.findIndex((item) => item.id === stage.id);
        chSlots = chBuildSlots(stage);
        if (!chSlots.length) return false;
        chDuration = chComputeDuration();
        chLaneChangeTotal = Math.max(0.05, Number(chContent().laneChangeTimeSec) || 0.22);
        chLane = clamp(Math.floor(Number(chContent().startLane) || 0), 0, chLaneCount() - 1);
        chLanePos = chLane;
        chLaneFrom = chLane;
        chLaneChangeLeft = 0;
        chSimTime = 0;
        chSlotCheck = 0;
        chScore = 0;
        chPassed = 0;
        chNear = 0;
        chDistance = 0;
        chFailedSlot = null;
        chResult = null;
        chAssisted = false;
        chErrorReason = '';
        chGoalHintTimer = CH_GOAL_HINT_SEC;
        chHudSecond = -1;
        chKeyDown = { left: false, right: false };
        cars = [];
        particles.clear();
        player.lane = chLane;
        player.x = laneCenterX(chLane, uOf(0));
        player.tilt = 0;
        recordSaved = false;
        hideChallengePanel();
        ui.hide();
        state = 'playing';
        loop.resume();
        pauseUi.sync();
        syncTouchPad();
        syncChallengeHud();
        showGoalTip();
        autosave.saveNow();
        return true;
      }
      function chChangeLane(delta) {
        if (mode !== 'challenge' || state !== 'playing') return false;
        const next = clamp(chLane + delta, 0, chLaneCount() - 1);
        if (next === chLane) return false;
        chLaneFrom = chLanePos;
        chLane = next;
        chLaneChangeLeft = chLaneChangeTotal;
        player.lane = next;
        A.Sfx.play('ui');
        return true;
      }
      function chLanePosition() {
        if (chLaneChangeLeft <= 0) return chLane;
        const progress = 1 - chLaneChangeLeft / chLaneChangeTotal;
        return chLaneFrom + (chLane - chLaneFrom) * clamp(progress, 0, 1);
      }
      function chCheckSlot(slot) {
        /* 车辆在时隙结束时到达玩家段：按“真实车道位置（含变道过渡）”判定碰撞。 */
        const collided = slot.occupiedLanes.some((lane) => Math.abs(chLanePos - lane) <= 0.5);
        if (collided) {
          chFailedSlot = slot;
          const laneText = slot.occupiedLanes.map((lane) => '第 ' + (lane + 1) + ' 车道').join('、');
          return chFail('第 ' + slot.slot + ' 段：' + laneText + '有车，变道没有在车辆到达前完成');
        }
        const near = slot.optionalNearPassBonusLanes.indexOf(Math.round(chLanePos)) !== -1;
        const rules = chContent().scoreRules || {};
        if (near) {
          chNear += 1;
          chScore += Math.max(0, Number(rules.nearPassBonus) || 0);
        } else {
          chScore += Math.max(0, Number(rules.passBonus) || 0);
        }
        chPassed += 1;
        return true;
      }
      function chFinishSuccess() {
        if (mode !== 'challenge' || !chStage || state !== 'playing') return false;
        const distance = chGoalMinDistance();
        if (distance > 0 && chDistance + 0.5 < distance) {
          return chFail('距离 ' + Math.round(chDistance) + 'm 未达到目标 ' + Math.round(distance) + 'm');
        }
        state = 'cleared';
        chGoalHintTimer = 0;
        if (chDom.tip) chDom.tip.hidden = true;
        chResult = { timeSec: Math.round(chSimTime * 10) / 10, assisted: chAssisted, collectibles: [] };
        if (A.Challenge) A.Challenge.markCleared(GAME_ID, chStage.id, chResult);
        autosave.clear();
        loop.pause();
        syncTouchPad();
        const isLast = chStageIndex >= challengeData.length - 1;
        ui.show({
          title: '挑战通关',
          text:
            A.Challenge.resultHtml(chStage, chResult) +
            '<p class="ac-challenge-tip">得分 ' + chScore + ' · 近距超车 ' + chNear + ' 次 · 目标 ' +
            chEsc(chStage.goalStatement || '') + '</p>',
          btn: isLast ? '返回选关' : '下一关',
          onBtn: () => {
            if (isLast) exitToChallengeSelect();
            else startChallenge(challengeData[chStageIndex + 1].id);
          },
          btn2: '重玩本关',
          onBtn2: () => startChallenge(chStage.id),
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }
      function chFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        chErrorReason = reason || '本关失败';
        chGoalHintTimer = 0;
        if (chDom.tip) chDom.tip.hidden = true;
        autosave.clear();
        loop.pause();
        syncTouchPad();
        ui.show({
          title: '挑战失败',
          text:
            '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
            '<p class="ac-challenge-result-row">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>',
          btn: '重试本关',
          onBtn: () => startChallenge(chStage.id),
          btn2: '返回选关',
          onBtn2: exitToChallengeSelect,
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }
      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chResult = null;
        chErrorReason = '';
        chFailedSlot = null;
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (chDom.tip) chDom.tip.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncTouchPad();
        showChallengePanel();
        return true;
      }
      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (chDom.tip) chDom.tip.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncTouchPad();
        showStart();
        return true;
      }
      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        const opts = {
          title: '已暂停',
          text: '引擎怠速中。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge' && chStage) {
          opts.text = '挑战暂停：' + fmtChallengeLabel(chStage) + ' ' + chEsc(chStage.title || '') + '。<br/>本关进度已保存。';
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        }
        ui.show(opts);
        pauseUi.sync();
        syncTouchPad();
      }

      function showStart() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (chDom.tip) chDom.tip.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        ui.show({
          title: '极速车道',
          text: '四车道赛车避障：5000m 抵达终点。<br/>点击左右按钮或 ←→ 一次变一条车道<br/>生命 ×3 · 道具 1/2 主动使用',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeAvailable ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      function syncJoyTools() {
        if (!dom.joyShield || !dom.joyCalm) return;
        const classicPlaying = state === 'playing' && mode === 'classic';
        dom.joyShield.querySelector('[data-joy-count]').textContent = String(tools.shield);
        dom.joyCalm.querySelector('[data-joy-count]').textContent = String(tools.calm);
        dom.joyShield.disabled = !classicPlaying || shieldArmed || tools.shield <= 0;
        dom.joyCalm.disabled = !classicPlaying || calmTimer > 0 || tools.calm <= 0;
        dom.joyShield.setAttribute('aria-pressed', String(shieldArmed));
        dom.joyShield.setAttribute('aria-label', shieldArmed
          ? '防撞气囊已武装，下一次撞车不扣命、不减速'
          : '防撞气囊，剩余 ' + tools.shield + ' 次（快捷键 1）');
        dom.joyCalm.setAttribute('aria-label', calmTimer > 0
          ? '车流慢放生效中，剩余 ' + calmTimer.toFixed(1) + ' 秒'
          : '车流慢放 6 秒，剩余 ' + tools.calm + ' 次（快捷键 2）');
      }

      function activateJoyTool(id) {
        if (state !== 'playing') return false;
        /* 挑战模式使用固定时间轴，禁用 0.7 限量道具以保证路线可复现（见 impl 文档设计差异）。 */
        if (mode === 'challenge') {
          A.showToast('挑战模式使用固定车流脚本，道具不可用');
          return false;
        }
        if (id === 'shield') {
          if (shieldArmed || tools.shield <= 0) return false;
          shieldArmed = true;
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        if (id === 'calm') {
          if (calmTimer > 0 || tools.calm <= 0) return false;
          tools.calm -= 1;
          calmTimer = CALM_SECONDS;
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        return false;
      }

      function clickJoyTool(id) {
        const button = document.querySelector('[data-joy-tool="' + id + '"]');
        if (!button) return false;
        joyLastResult = null;
        button.click();
        return joyLastResult === true;
      }

      function bindJoyTools() {
        document.querySelectorAll('[data-joy-tool]').forEach((button) => {
          button.addEventListener('click', () => {
            joyLastResult = activateJoyTool(button.dataset.joyTool);
          });
        });
        window.addEventListener('keydown', (e) => {
          if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
          const target = e.target;
          if (target && target.tagName) {
            const tag = target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
          }
          const id = { '1': 'shield', '2': 'calm' }[e.key];
          if (!id) return;
          e.preventDefault();
          clickJoyTool(id);
        });
      }

      function changeLane(delta) {
        if (state !== 'playing') return;
        if (mode === 'challenge') {
          chChangeLane(delta);
          return;
        }
        const next = clamp(player.lane + delta, 0, LANES - 1);
        if (next === player.lane) return;
        player.lane = next;
        A.Sfx.play('ui');
      }

      function syncTouchPad() {
        document.querySelectorAll('[data-touch]').forEach((btn) => {
          btn.disabled = state !== 'playing';
        });
        syncJoyTools();
      }

      function bindTouchPad() {
        const pad = document.querySelector('[data-touch-pad]');
        if (!pad) return;
        pad.querySelectorAll('[data-touch]').forEach((btn) => {
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (state !== 'playing') return;
            changeLane(btn.dataset.touch === 'left' ? -1 : 1);
          });
          btn.addEventListener('contextmenu', (e) => e.preventDefault());
        });
        syncTouchPad();
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        if (mode === 'challenge') {
          if (!chStage) return null;
          return {
            mode: 'challenge',
            stageId: chStage.id,
            challengeState: {
              chSimTime,
              chSlotCheck,
              chLane,
              chLanePos,
              chLaneFrom,
              chLaneChangeLeft,
              chScore,
              chPassed,
              chNear,
              chDistance,
              chAssisted,
            },
          };
        }
        return {
          mode: 'classic',
          cars: cars.map((c) => ({
            lane: c.lane,
            lanePos: c.lanePos,
            z: c.z,
            own: c.own,
            w: c.w,
            h: c.h,
            truck: c.truck,
            color: c.color,
            passed: c.passed,
            changeState: c.changeState,
            signalDir: c.signalDir,
            signalLeft: c.signalLeft,
            changeLeft: c.changeLeft,
            changeFrom: c.changeFrom,
            changeTo: c.changeTo,
            targetLane: c.targetLane,
            blinkPhase: c.blinkPhase,
            wantsChange: c.wantsChange,
            triggerZ: c.triggerZ,
          })),
          props: props.map((p) => ({ z: p.z, side: p.side, kind: p.kind })),
          pickups: pickups.map((p) => ({ lane: p.lane, lanePos: p.lanePos, z: p.z, type: p.type, phase: p.phase })),
          speed,
          cruise,
          dist,
          lives,
          spawnTimer,
          pickupTimer,
          dashOffset,
          player: { x: player.x, lane: player.lane, vx: player.vx, tilt: player.tilt, invul: player.invul },
          tools: { shield: tools.shield, calm: tools.calm },
          shieldArmed,
          calmTimer,
          shortRun,
          combo,
          comboBest,
          comboTimer,
          nearPasses,
          passedCars,
          crashes,
          boostTimer,
          runSeconds,
          nextMilestone,
          rushTimer,
          bannerTimer,
          bannerText,
        };
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(GAME_ID, data.stageId);
        if (!stage) return false;
        /* 契约要求挑战状态放在 data.challengeState；旧/异常档缺失时回退顶层字段，保持兼容。 */
        const stateData = data.challengeState && typeof data.challengeState === 'object' ? data.challengeState : data;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = challengeData.findIndex((item) => item.id === stage.id);
        chSlots = chBuildSlots(stage);
        if (!chSlots.length) return false;
        chDuration = chComputeDuration();
        chLaneChangeTotal = Math.max(0.05, Number(chContent().laneChangeTimeSec) || 0.22);
        chSimTime = clamp(Number(stateData.chSimTime) || 0, 0, chDuration);
        chSlotCheck = clamp(Math.floor(Number(stateData.chSlotCheck) || 0), 0, chSlots.length);
        chLane = clamp(Math.floor(Number(stateData.chLane) || 0), 0, chLaneCount() - 1);
        chLanePos = clamp(Number(stateData.chLanePos) || chLane, 0, chLaneCount() - 1);
        chLaneFrom = clamp(Number(stateData.chLaneFrom) || chLane, 0, chLaneCount() - 1);
        chLaneChangeLeft = clamp(Number(stateData.chLaneChangeLeft) || 0, 0, chLaneChangeTotal);
        chScore = Math.max(0, Number(stateData.chScore) || 0);
        chPassed = Math.max(0, Math.floor(Number(stateData.chPassed) || 0));
        chNear = Math.max(0, Math.floor(Number(stateData.chNear) || 0));
        chDistance = Math.max(0, Number(stateData.chDistance) || 0);
        chAssisted = !!stateData.chAssisted;
        chFailedSlot = null;
        chResult = null;
        chErrorReason = '';
        chGoalHintTimer = 0;
        chHudSecond = -1;
        chKeyDown = { left: false, right: false };
        cars = [];
        player.lane = chLane;
        player.x = laneCenterX(chLanePos, uOf(0));
        player.tilt = 0;
        if (chDom.tip) chDom.tip.hidden = true;
        state = 'playing';
        syncChallengeHud();
        syncTouchPad();
        return true;
      }

      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        if (!Array.isArray(data.cars) || !data.player) return false;
        try {
          reset();
          mode = 'classic';
          chStage = null;
          chStageIndex = -1;
          if (chDom.hud) chDom.hud.hidden = true;
          if (chDom.tip) chDom.tip.hidden = true;
          if (gameHudEl) gameHudEl.hidden = false;
          cars = data.cars
            .filter((c) => c && isFinite(c.z) && isFinite(c.lane))
            .map((c) => {
              const lane = clamp(Math.round(Number(c.lane)), 0, LANES - 1);
              const changeState = c.changeState === 'signal' || c.changeState === 'moving' ? c.changeState : 'none';
              return {
                lane,
                lanePos: Number.isFinite(Number(c.lanePos)) ? clamp(Number(c.lanePos), 0, LANES - 1) : lane,
                z: clamp(Number(c.z), -0.2, 2),
                own: clamp(Number(c.own) || 0.2, 0.02, 0.6),
                w: Number(c.w) || 40,
                h: Number(c.h) || 62,
                truck: !!c.truck,
                color: typeof c.color === 'string' ? c.color : CAR_COLORS[0],
                passed: !!c.passed,
                changeState,
                signalDir: c.signalDir === -1 || c.signalDir === 1 ? c.signalDir : 0,
                signalLeft: clamp(Number(c.signalLeft) || 0, 0, SIGNAL_LEAD),
                changeLeft: clamp(Number(c.changeLeft) || 0, 0, LANE_CHANGE_TIME),
                changeFrom: Number.isFinite(Number(c.changeFrom)) ? clamp(Number(c.changeFrom), 0, LANES - 1) : lane,
                changeTo: Number.isFinite(Number(c.changeTo)) ? clamp(Number(c.changeTo), 0, LANES - 1) : lane,
                targetLane: Number.isFinite(Number(c.targetLane)) ? clamp(Math.round(Number(c.targetLane)), 0, LANES - 1) : lane,
                blinkPhase: Number(c.blinkPhase) || 0,
                wantsChange: !!c.wantsChange,
                triggerZ: Number.isFinite(Number(c.triggerZ)) ? clamp(Number(c.triggerZ), 1, 1.4) : 1.15,
              };
            });
          props = Array.isArray(data.props)
            ? data.props
                .filter((p) => p && isFinite(p.z))
                .map((p) => ({ z: clamp(Number(p.z), 0, 1), side: p.side === -1 ? -1 : 1, kind: p.kind === 1 ? 1 : 0 }))
            : [];
          pickups = Array.isArray(data.pickups)
            ? data.pickups
                .filter((p) => p && isFinite(p.z) && isFinite(p.lane))
                .map((p) => ({
                  lane: clamp(Math.round(Number(p.lane)), 0, LANES - 1),
                  lanePos: Number.isFinite(Number(p.lanePos)) ? clamp(Number(p.lanePos), 0, LANES - 1) : clamp(Math.round(Number(p.lane)), 0, LANES - 1),
                  z: clamp(Number(p.z), -0.1, 1.2),
                  type: p.type === 'repair' ? 'repair' : 'boost',
                  phase: Number(p.phase) || 0,
                }))
            : [];
          cruise = clamp(Number(data.cruise != null ? data.cruise : data.speed) || 0.28, 0.2, 1);
          speed = clamp(Number(data.speed) || cruise, 0.2, 1.2);
          dist = Math.max(0, Number(data.dist) || 0);
          lives = clamp(Number(data.lives) || 3, 1, 3);
          spawnTimer = Number(data.spawnTimer) || 0.8;
          pickupTimer = Number(data.pickupTimer) || 5;
          dashOffset = Number(data.dashOffset) || 0;
          player.x = clamp(Number(data.player.x) || laneCenterX(1, uOf(0)), CX - 150, CX + 150);
          const savedLane = Number(data.player.lane);
          player.lane = Number.isFinite(savedLane) ? clamp(Math.round(savedLane), 0, LANES - 1) : nearestLane(player.x);
          player.vx = Number(data.player.vx) || 0;
          player.tilt = Number(data.player.tilt) || 0;
          player.invul = Number(data.player.invul) || 0;
          if (data.tools && typeof data.tools === 'object') {
            tools.shield = Number.isFinite(Number(data.tools.shield)) ? clamp(Math.floor(Number(data.tools.shield)), 0, 1) : 1;
            tools.calm = Number.isFinite(Number(data.tools.calm)) ? clamp(Math.floor(Number(data.tools.calm)), 0, 2) : 2;
          }
          shieldArmed = !!data.shieldArmed && tools.shield > 0;
          calmTimer = clamp(Number(data.calmTimer) || 0, 0, CALM_SECONDS);
          shortRun = data.shortRun === true;
          combo = Math.max(0, Math.floor(Number(data.combo) || 0));
          comboBest = Math.max(combo, Math.floor(Number(data.comboBest) || 0));
          comboTimer = clamp(Number(data.comboTimer) || 0, 0, COMBO_WINDOW);
          nearPasses = Math.max(0, Math.floor(Number(data.nearPasses) || 0));
          passedCars = Math.max(0, Math.floor(Number(data.passedCars) || 0));
          crashes = Math.max(0, Math.floor(Number(data.crashes) || 0));
          boostTimer = clamp(Number(data.boostTimer) || 0, 0, BOOST_SECONDS);
          runSeconds = Math.max(0, Number(data.runSeconds) || 0);
          /* 旧档没有分段字段：从当前距离的下一公里继续，避免恢复时连播多条横幅。 */
          nextMilestone = (Math.floor(dist / 1000) + 1) * 1000;
          rushTimer = Math.max(0, Number(data.rushTimer) || 0);
          bannerTimer = 0;
          bannerText = '';
          recordSaved = false;
          syncHud();
          syncTouchPad();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('road-rush', serialize, {
        every: 4,
        meta: () => (
          mode === 'challenge' && chStage
            ? { score: chScore, summary: `挑战 ${fmtChallengeLabel(chStage)} · 路段 ${chProgressLabel()} · ${Math.round(chDistance)}m` }
            : { score: Math.floor(dist), summary: `${Math.floor(dist)}m · ${Math.round(speed * 360)}km/h` }
        ),
      });

      /* 一辆车当前占用的车道：变道过程中同时占两条，安全判定按最保守处理。 */
      function carLanes(car) {
        const pos = Number.isFinite(car.lanePos) ? car.lanePos : car.lane;
        const lanes = [clamp(Math.round(pos), 0, LANES - 1)];
        if (car.changeState === 'signal' || car.changeState === 'moving') {
          const target = Math.round(Number(car.targetLane));
          if (Number.isFinite(target)) {
            const lane = clamp(target, 0, LANES - 1);
            if (lanes.indexOf(lane) === -1) lanes.push(lane);
          }
        }
        return lanes;
      }

      function laneClearTime(lane, extra) {
        let min = Infinity;
        const consider = (car) => {
          if (!car || car.own >= speed) return;
          if (carLanes(car).indexOf(lane) === -1) return;
          const closing = (speed - car.own) / 0.9;
          if (closing <= 0) return;
          const t = Math.max(0, car.z) / closing;
          if (t < min) min = t;
        };
        cars.forEach(consider);
        if (extra) consider(extra);
        return min;
      }

      function safeLaneList(extra) {
        const out = [];
        for (let lane = 0; lane < LANES; lane++) {
          if (laneClearTime(lane, extra) > 1.2) out.push(lane);
        }
        return out;
      }

      /* 未来 2.4s 内，玩家当前/相邻车道必须始终留有一条可躲避车道。 */
      function futureSafe(extra) {
        const list = extra ? cars.concat(extra) : cars;
        for (let t = 0; t <= 2.4; t += 0.1) {
          const danger = [false, false, false, false];
          for (const car of list) {
            const z = car.z - ((speed - car.own) / 0.9) * t;
            if (z > -0.08 && z < 0.5) {
              carLanes(car).forEach((lane) => {
                if (danger[lane] !== undefined) danger[lane] = true;
              });
            }
          }
          let escape = false;
          const from = Math.max(0, player.lane - 1);
          const to = Math.min(LANES - 1, player.lane + 1);
          for (let lane = from; lane <= to; lane++) {
            if (!danger[lane]) escape = true;
          }
          if (!escape) return false;
        }
        return true;
      }

      /* 目标车道在当前 z 附近是否空着（变道车同时占两条，也会被算进去）。 */
      function targetLaneFree(car, target) {
        return !cars.some((other) => {
          if (other === car) return false;
          if (Math.abs(other.z - car.z) > 0.16) return false;
          return carLanes(other).indexOf(target) !== -1;
        });
      }

      /* 打灯换道：先闪灯预告，再横移。目标车道被占或换过去会堵死玩家走廊时放弃。 */
      function startSignal(car) {
        const options = [car.lane - 1, car.lane + 1].filter((lane) => lane >= 0 && lane < LANES);
        if (!options.length) return false;
        if (Math.random() > 0.5) options.reverse();
        for (const target of options) {
          if (!targetLaneFree(car, target)) continue;
          const prevLane = car.lane;
          const prevPos = car.lanePos;
          car.lane = target;
          car.lanePos = target;
          const fair = futureSafe();
          car.lane = prevLane;
          car.lanePos = prevPos;
          if (!fair) continue;
          car.changeState = 'signal';
          car.signalDir = target > car.lane ? 1 : -1;
          car.targetLane = target;
          car.signalLeft = SIGNAL_LEAD;
          A.Sfx.play('ui');
          return true;
        }
        car.wantsChange = false;
        return false;
      }

      function updateCarChange(car, dt) {
        if (Number.isFinite(car.blinkPhase)) car.blinkPhase += dt * 6;
        else car.blinkPhase = 0;
        if (car.changeState === 'none') {
          if (car.wantsChange && car.z > 0.5 && car.z <= car.triggerZ) startSignal(car);
          return;
        }
        if (car.changeState === 'signal') {
          car.signalLeft -= dt;
          /* 打灯期间目标车道被别的车占了就取消，避免两车叠进同一条车道。 */
          if (!targetLaneFree(car, car.targetLane)) {
            car.changeState = 'none';
            car.signalDir = 0;
            car.wantsChange = false;
            return;
          }
          if (car.signalLeft <= 0) {
            car.changeState = 'moving';
            car.changeLeft = LANE_CHANGE_TIME;
            car.changeFrom = car.lanePos;
            car.changeTo = car.targetLane;
          }
          return;
        }
        if (car.changeState === 'moving') {
          car.changeLeft = Math.max(0, car.changeLeft - dt);
          const t = 1 - car.changeLeft / LANE_CHANGE_TIME;
          /* 平滑横移，避免一格一格瞬移。 */
          const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          car.lanePos = lerp(car.changeFrom, car.changeTo, clamp(eased, 0, 1));
          if (car.changeLeft <= 0) {
            car.lane = car.changeTo;
            car.lanePos = car.lane;
            car.changeState = 'none';
            car.signalDir = 0;
            car.wantsChange = false;
          }
        }
      }

      function spawnCar() {
        if (cars.length >= MAX_CARS) return;
        for (let attempt = 0; attempt < 14; attempt++) {
          const lane = randInt(0, LANES - 1);
          /* 玩家可见范围之外（z>1）就确定车道、速度与是否换道，进入视野时位置已固定。 */
          if (cars.some((c) => Math.round(c.lanePos) === lane && c.z > 0.92)) continue;
          const kindIdx = speed > 0.55 && Math.random() > 0.85 ? 2 : randInt(0, 1);
          const k = CAR_KINDS[kindIdx];
          const candidate = {
            lane,
            lanePos: lane,
            z: 1.02 + rand(0, 0.5),
            own: rand(k.own[0], k.own[1]),
            w: k.w,
            h: k.h,
            truck: !!k.truck,
            color: k.truck ? k.color : CAR_COLORS[randInt(0, CAR_COLORS.length - 1)],
            passed: false,
            changeState: 'none',
            signalDir: 0,
            signalLeft: 0,
            changeLeft: 0,
            changeFrom: lane,
            changeTo: lane,
            targetLane: lane,
            blinkPhase: rand(0, 1),
            /* 大卡车不换道；速度越高，愿意打灯换道的车越多。 */
            wantsChange: !k.truck && Math.random() < 0.16 + speed * 0.26,
            triggerZ: rand(1.06, 1.34),
          };
          const safe = safeLaneList(candidate);
          /* 保留一条玩家在 1.2 秒内（最多两车道）能到达的安全走廊。 */
          const reachable = safe.some((l) => Math.abs(l - player.lane) <= 2);
          if (reachable && futureSafe(candidate)) {
            cars.push(candidate);
            return;
          }
        }
      }

      /* ---------- 0.8.5 拾取物与连超 ---------- */
      function spawnPickup() {
        if (pickups.length >= 3) return;
        for (let attempt = 0; attempt < 8; attempt++) {
          const lane = randInt(0, LANES - 1);
          if (pickups.some((p) => p.lane === lane && p.z > 0.6)) continue;
          if (cars.some((c) => Math.round(c.lanePos) === lane && c.z > 0.45 && c.z < 1.25)) continue;
          const type = lives < 3 && Math.random() < 0.55 ? 'repair' : 'boost';
          pickups.push({ lane, lanePos: lane, z: 1.12, type, phase: rand(0, TAU) });
          return;
        }
      }

      function collectPickup(index) {
        const p = pickups[index];
        if (!p) return;
        pickups.splice(index, 1);
        if (p.type === 'repair') {
          lives = Math.min(3, lives + 1);
          A.Sfx.play('perfect');
          A.showToast('维修箱：恢复 1 点车况');
          particles.emit(player.x, PLAYER_Y, {
            count: A.reducedMotion ? 6 : 16, speed: [40, 150], life: [0.25, 0.6], size: [2, 4],
            colors: ['#66d36e', '#ffffff'], gravity: 80,
          });
        } else {
          boostTimer = Math.max(boostTimer, BOOST_SECONDS);
          /* 当帧就抬速，HUD 不会慢一帧才变化（下一帧仍按 cruise+加成重算）。 */
          speed = Math.min(1.2, speed + 0.16);
          A.Sfx.play('spring');
          A.showToast('加速带：冲刺 ' + BOOST_SECONDS + ' 秒');
          particles.emit(player.x, PLAYER_Y + 20, {
            count: A.reducedMotion ? 6 : 18, speed: [60, 220], life: [0.25, 0.6], size: [2, 5],
            colors: ['#41d9d9', '#ffffff'],
          });
        }
        autosave.saveNow();
        syncJoyTools();
      }

      function updatePickups(dt) {
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.z -= (speed * dt) / 0.9;
          if (p.z < -0.08) {
            pickups.splice(i, 1);
            continue;
          }
          if (p.z < 0.08) {
            const px = laneCenterX(p.lanePos, uOf(0));
            if (Math.abs(px - player.x) < 34) collectPickup(i);
          }
        }
      }

      function bumpCombo() {
        combo += 1;
        comboBest = Math.max(comboBest, combo);
        comboTimer = COMBO_WINDOW;
        comboFlash = 1;
        nearPasses += 1;
        if (combo === 3 || combo === 6 || combo === 10 || combo === 15) {
          A.Sfx.play('bell', Math.min(12, 3 + combo));
          A.showToast('连超 ×' + combo + '：尾流加速');
        }
      }

      /* ---------- 更新 ---------- */
      /* ---------- 挑战模式更新 ---------- */
      function updateChallenge(dt) {
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chSimTime += dt;
        if (chGoalHintTimer > 0) {
          chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
          if (chGoalHintTimer <= 0 && chDom.tip) chDom.tip.hidden = true;
        }
        const goalMin = chGoalMinDistance();
        chDistance = chDuration > 0 ? Math.min(goalMin, (goalMin * chSimTime) / chDuration) : 0;

        /* 玩家变道：一次按键/点击恰好一条车道，过渡时长来自 laneChangeTimeSec。 */
        const leftNow = input.isDown('ArrowLeft', 'a');
        const rightNow = input.isDown('ArrowRight', 'd');
        if (leftNow && !chKeyDown.left) chChangeLane(-1);
        if (rightNow && !chKeyDown.right) chChangeLane(1);
        chKeyDown.left = leftNow;
        chKeyDown.right = rightNow;
        if (input.pointer.wentDown) chChangeLane(input.pointer.x < W / 2 ? -1 : 1);

        if (chLaneChangeLeft > 0) chLaneChangeLeft = Math.max(0, chLaneChangeLeft - dt);
        chLanePos = chLanePosition();
        player.lane = chLane;
        player.x = laneCenterX(chLanePos, uOf(0));

        /* 时隙到达：按真实车道位置（含过渡）做碰撞判定。 */
        while (chSlotCheck < chSlots.length && chSimTime >= chSlots[chSlotCheck].passAt) {
          chCheckSlot(chSlots[chSlotCheck]);
          if (state !== 'playing') {
            input.endFrame();
            return;
          }
          chSlotCheck += 1;
        }
        syncChallengeHud();
        if (state === 'playing' && chSimTime >= chDuration) {
          chFinishSuccess();
          input.endFrame();
          return;
        }
        input.endFrame();
      }

      function update(dt) {
        particles.update(dt);
        shake = Math.max(0, shake - dt * 20);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        autosave.tick(dt);
        runSeconds += dt;
        const hadCalm = calmTimer > 0;
        calmTimer = Math.max(0, calmTimer - dt);
        if (hadCalm && calmTimer <= 0) syncJoyTools();
        boostTimer = Math.max(0, boostTimer - dt);
        if (comboTimer > 0) {
          comboTimer = Math.max(0, comboTimer - dt);
          if (comboTimer <= 0) combo = 0;
        }
        comboFlash = Math.max(0, comboFlash - dt * 2.2);
        if (rushTimer > 0) rushTimer = Math.max(0, rushTimer - dt);
        if (bannerTimer > 0) bannerTimer = Math.max(0, bannerTimer - dt);

        /* 加速曲线：巡航速度 + 连超尾流 + 加速带冲刺。 */
        cruise = Math.min(1, cruise + 0.02 * dt + 0.004 * dt);
        const draft = combo >= 3 ? 0.05 : 0;
        const boost = boostTimer > 0 ? 0.16 : 0;
        speed = Math.min(1.2, cruise + draft + boost);
        const kmh = speed * 360;
        const mps = kmh / 3.6;
        dist += mps * dt;
        syncHud();
        if (dist >= nextMilestone) {
          bannerText = Math.floor(nextMilestone) + 'm 达成 · 车流加密 5 秒';
          bannerTimer = 2;
          nextMilestone += 1000;
          rushTimer = 5;
          A.Sfx.play('bell', 10);
        }
        if (shortRun && dist >= JOY_GOAL_DIST) {
          gameOver(true);
          input.endFrame();
          return;
        }

        /* 玩家变道：一次按键/点击移动一条车道，x 只做短过渡动画。 */
        const leftNow = input.isDown('ArrowLeft', 'a');
        const rightNow = input.isDown('ArrowRight', 'd');
        if (leftNow && !keyWasDown.left) changeLane(-1);
        if (rightNow && !keyWasDown.right) changeLane(1);
        keyWasDown.left = leftNow;
        keyWasDown.right = rightNow;
        if (input.pointer.wentDown) changeLane(input.pointer.x < W / 2 ? -1 : 1);
        const targetX = laneCenterX(player.lane, uOf(0));
        const prevX = player.x;
        player.x = lerp(player.x, targetX, Math.min(1, 16 * dt));
        player.vx = dt > 0 ? (player.x - prevX) / dt : 0;
        player.tilt = lerp(player.tilt, clamp(player.vx / 420, -1, 1) * 0.14, Math.min(1, 10 * dt));
        player.invul = Math.max(0, player.invul - dt);

        /* 车道虚线滚动 */
        dashOffset = (dashOffset + speed * dt * 2.2) % (1 / 7);

        /* 敌车 */
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = lerp(1.15, 0.52, speed) * (rushTimer > 0 ? 0.78 : 1);
          spawnCar();
          if (speed > 0.7 && Math.random() > 0.6) spawnCar();
        }
        pickupTimer -= dt;
        if (pickupTimer <= 0) {
          pickupTimer = rand(PICKUP_GAP_MIN, PICKUP_GAP_MAX);
          spawnPickup();
        }
        updatePickups(dt);
        const playerBox = { x: player.x - 19, y: PLAYER_Y - 26, w: 38, h: 54 };
        for (let i = cars.length - 1; i >= 0; i--) {
          const c = cars[i];
          c.z -= ((speed - c.own) * dt * (calmTimer > 0 ? 0.55 : 1)) / 0.9;
          /* 被玩家甩开的慢车会退到地平线外；超过 z=2 直接回收，避免占满车辆上限导致不再发车。 */
          if (c.z < -0.14 || c.z > 2) {
            cars.splice(i, 1);
            continue;
          }
          updateCarChange(c, dt);
          /* 超车：相邻车道（含变道中擦身）才算贴身连超。 */
          if (!c.passed && c.z < -0.02) {
            c.passed = true;
            passedCars += 1;
            const gap = Math.abs(laneCenterX(c.lanePos, uOf(0)) - player.x);
            if (gap < laneWidthAt(1) * 1.15) bumpCombo();
          }
          /* 碰撞（玩家段）：用连续 lanePos，变道中的车横跨两条车道。 */
          if (c.z < 0.07 && c.z > -0.07 && player.invul <= 0) {
            const u = uOf(Math.max(c.z, 0));
            const sc = scaleAt(u);
            const cx2 = laneCenterX(c.lanePos, u);
            const cw = c.w * sc;
            const ch = c.h * sc;
            const box = { x: cx2 - cw / 2, y: yAt(u) - ch, w: cw, h: ch };
            if (A.Physics.aabbOverlap(playerBox, box)) {
              hitPlayer(c, i);
              /* 本帧已经收局：不再对同一帧里的其它车重复扣命。 */
              if (state !== 'playing') break;
            }
          }
        }

        /* 路边装饰 */
        props.forEach((p) => {
          p.z -= speed * dt / 0.9;
          if (p.z < 0) {
            p.z += 1;
            p.side = Math.random() > 0.5 ? 1 : -1;
            p.kind = randInt(0, 1);
          }
        });

        /* 排气粒子 */
        exhaustTimer -= dt;
        if (exhaustTimer <= 0 && !A.reducedMotion) {
          exhaustTimer = 0.06;
          particles.emit(player.x + rand(-10, 10), PLAYER_Y + 30, {
            count: 1,
            speed: [10, 40],
            angle: [Math.PI * 0.35, Math.PI * 0.65],
            life: [0.2, 0.4],
            size: [2, 4],
            colors: ['rgba(200,205,230,0.5)'],
          });
        }

        input.endFrame();
      }

      function hitPlayer(c, idx) {
        cars.splice(idx, 1);
        if (shieldArmed) {
          shieldArmed = false;
          tools.shield = Math.max(0, tools.shield - 1);
          player.invul = 1.0;
          shake = A.reducedMotion ? 0 : 5;
          A.Sfx.play('perfect');
          particles.emit(player.x, PLAYER_Y, {
            count: A.reducedMotion ? 6 : 16,
            speed: [50, 180], life: [0.2, 0.5], size: [2, 5],
            colors: ['#7ce8e0', '#ffffff'],
          });
          syncJoyTools();
          autosave.saveNow();
          return;
        }
        lives -= 1;
        crashes += 1;
        cruise = Math.max(0.2, cruise * 0.45);
        speed = Math.max(0.2, speed * 0.45);
        /* 事故打断连超与冲刺，重新积累。 */
        combo = 0;
        comboTimer = 0;
        boostTimer = 0;
        player.invul = 1.9;
        shake = A.reducedMotion ? 0 : 9;
        A.Sfx.play('explode');
        particles.emit(player.x, PLAYER_Y, {
          count: 26,
          speed: [60, 280],
          life: [0.3, 0.8],
          size: [2, 5],
          colors: ['#ff7847', '#ffd23f', '#ffffff'],
          gravity: 60,
        });
        if (lives <= 0) {
          gameOver();
        }
      }

      /* ---------- 渲染 ---------- */
      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 60);
        sky.addColorStop(0, '#2c1a4d');
        sky.addColorStop(0.7, '#c4557a');
        sky.addColorStop(1, '#ffb46b');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, HORIZON + 60);
        /* 落日 */
        ctx.fillStyle = 'rgba(255,235,190,0.95)';
        ctx.beginPath();
        ctx.arc(CX, HORIZON - 26, 34, 0, TAU);
        ctx.fill();
        /* 远山 */
        ctx.fillStyle = 'rgba(40,22,64,0.8)';
        ctx.beginPath();
        ctx.moveTo(0, HORIZON);
        ctx.lineTo(70, HORIZON - 46);
        ctx.lineTo(150, HORIZON - 12);
        ctx.lineTo(250, HORIZON - 60);
        ctx.lineTo(340, HORIZON - 18);
        ctx.lineTo(420, HORIZON - 38);
        ctx.lineTo(420, HORIZON + 4);
        ctx.lineTo(0, HORIZON + 4);
        ctx.closePath();
        ctx.fill();
      }

      function drawRoad() {
        /* 草地 */
        const grass = ctx.createLinearGradient(0, HORIZON, 0, H);
        grass.addColorStop(0, '#27502f');
        grass.addColorStop(1, '#1c3a24');
        ctx.fillStyle = grass;
        ctx.fillRect(0, HORIZON, W, H - HORIZON);

        /* 路面梯形（含路肩） */
        function roadPoly(uTop, uBottom, halfMargin) {
          const x1 = CX - roadHalfAt(uBottom) * halfMargin;
          const x2 = CX + roadHalfAt(uBottom) * halfMargin;
          const x3 = CX + roadHalfAt(uTop) * halfMargin;
          const x4 = CX - roadHalfAt(uTop) * halfMargin;
          ctx.beginPath();
          ctx.moveTo(x1, yAt(uBottom));
          ctx.lineTo(x2, yAt(uBottom));
          ctx.lineTo(x3, yAt(uTop));
          ctx.lineTo(x4, yAt(uTop));
          ctx.closePath();
        }
        /* 路肩红白条（z 空间按 dashOffset 滚动） */
        const segLen = 1 / 8;
        for (let i = -1; i < 9; i++) {
          const zA = clamp(i / 8 + dashOffset * 0.9, 0, 1);
          const zB = clamp(zA + segLen / 2, 0, 1);
          if (zB <= zA) continue;
          ctx.fillStyle = i % 2 === 0 ? '#d8443f' : '#f0f2fa';
          roadPoly(uOf(zB), uOf(zA), 1.08);
          ctx.fill();
        }
        /* 主路面 */
        ctx.fillStyle = '#3a3f52';
        roadPoly(0, 1, 1);
        ctx.fill();
        /* 中央车道虚线 ×3 */
        ctx.fillStyle = 'rgba(240,242,250,0.85)';
        for (let lane = 1; lane < LANES; lane++) {
          for (let i = 0; i < 8; i++) {
            const zA = clamp(i / 8 + dashOffset, 0, 1);
            const zB = clamp(zA + 0.05, 0, 1);
            if (zB <= zA) continue;
            const wA = 3 * scaleAt(uOf(zA)) * 1.4;
            const wB = 3 * scaleAt(uOf(zB)) * 1.4;
            const xA = dividerX(lane, uOf(zA));
            const xB = dividerX(lane, uOf(zB));
            ctx.beginPath();
            ctx.moveTo(xA - wA / 2, yAt(uOf(zA)));
            ctx.lineTo(xA + wA / 2, yAt(uOf(zA)));
            ctx.lineTo(xB + wB / 2, yAt(uOf(zB)));
            ctx.lineTo(xB - wB / 2, yAt(uOf(zB)));
            ctx.closePath();
            ctx.fill();
          }
        }
        /* 路缘白线 */
        ctx.fillStyle = 'rgba(240,242,250,0.9)';
        ctx.beginPath();
        ctx.moveTo(CX - roadHalfAt(1) * 0.96, yAt(1));
        ctx.lineTo(CX - roadHalfAt(1) * 0.99, yAt(1));
        ctx.lineTo(CX - roadHalfAt(0) * 0.94, yAt(0));
        ctx.lineTo(CX - roadHalfAt(0) * 0.9, yAt(0));
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(CX + roadHalfAt(1) * 0.99, yAt(1));
        ctx.lineTo(CX + roadHalfAt(1) * 0.96, yAt(1));
        ctx.lineTo(CX + roadHalfAt(0) * 0.9, yAt(0));
        ctx.lineTo(CX + roadHalfAt(0) * 0.94, yAt(0));
        ctx.closePath();
        ctx.fill();
      }

      function drawProp(p) {
        const u = uOf(clamp(p.z, 0, 1));
        const sc = scaleAt(u);
        const y = yAt(u);
        const half = roadHalfAt(u);
        const x = CX + (p.side > 0 ? 1 : -1) * (half + 26 * sc + 10 * sc);
        if (p.kind === 0) {
          /* 树 */
          const th = 66 * sc;
          ctx.fillStyle = '#3a2a20';
          ctx.fillRect(x - 3 * sc, y - th * 0.4, 6 * sc, th * 0.4);
          ctx.fillStyle = '#2e6b3e';
          ctx.beginPath();
          ctx.moveTo(x, y - th);
          ctx.lineTo(x + 16 * sc, y - th * 0.32);
          ctx.lineTo(x - 16 * sc, y - th * 0.32);
          ctx.closePath();
          ctx.fill();
        } else {
          /* 里程牌 */
          const ph = 46 * sc;
          ctx.fillStyle = '#8d94ad';
          ctx.fillRect(x - 2 * sc, y - ph, 4 * sc, ph);
          ctx.fillStyle = '#2f7d4f';
          ctx.fillRect(x - 12 * sc, y - ph - 16 * sc, 24 * sc, 18 * sc);
        }
      }

      function drawCar(x, yBottom, w, h, color, truck, tilt, isPlayer, signalDir, blinkOn) {
        /* 远端缩放很小时固定像素内缩会变成负尺寸；直接跳过亚像素车身，避免无效绘制。 */
        if (!Number.isFinite(w) || !Number.isFinite(h) || w < 0.6 || h < 0.6) return;
        const inset = Math.max(0.5, Math.min(2, w * 0.06));
        ctx.save();
        ctx.translate(x, yBottom);
        if (tilt) ctx.rotate(tilt);
        /* 阴影 */
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(0, -2, w * 0.55, h * 0.09, 0, 0, TAU);
        ctx.fill();
        if (truck) {
          /* 车厢 */
          ctx.fillStyle = '#b7c0d8';
          ctx.fillRect(-w / 2, -h, w, h * 0.62);
          ctx.strokeStyle = '#7d8aa8';
          ctx.strokeRect(-w / 2 + inset, -h + inset, Math.max(0, w - inset * 2), Math.max(0, h * 0.62 - inset * 2));
          /* 车头 */
          ctx.fillStyle = color;
          A.draw.roundRect(ctx, -w / 2 + inset, -h * 0.38, Math.max(0, w - inset * 2), h * 0.38, 6);
          ctx.fill();
        } else {
          /* 车身 */
          ctx.fillStyle = color;
          A.draw.roundRect(ctx, -w / 2, -h, w, h * 0.86, 8);
          ctx.fill();
          /* 车窗 */
          ctx.fillStyle = 'rgba(20,26,48,0.85)';
          A.draw.roundRect(ctx, -w * 0.32, -h * 0.92, w * 0.64, h * 0.3, 4);
          ctx.fill();
          A.draw.roundRect(ctx, -w * 0.3, -h * 0.55, w * 0.6, h * 0.22, 3);
          ctx.fill();
          /* 尾灯 */
          if (isPlayer) {
            ctx.fillStyle = '#ff5d5d';
            ctx.fillRect(-w / 2 + inset, -h * 0.26, Math.max(1, w * 0.15), Math.max(1, h * 0.06));
            ctx.fillRect(w / 2 - inset - Math.max(1, w * 0.15), -h * 0.26, Math.max(1, w * 0.15), Math.max(1, h * 0.06));
          } else {
            ctx.fillStyle = '#ffd23f';
            ctx.fillRect(-w / 2 + inset, -h * 0.28, Math.max(1, w * 0.15), Math.max(1, h * 0.06));
            ctx.fillRect(w / 2 - inset - Math.max(1, w * 0.15), -h * 0.28, Math.max(1, w * 0.15), Math.max(1, h * 0.06));
          }
        }
        /* 转向灯：对应侧车灯闪烁，并在车顶画同向箭头，远处也能看清换道意图。 */
        if (signalDir && !isPlayer) {
          const lampW = Math.max(1, w * 0.16);
          const lampH = Math.max(1, h * 0.055);
          const lampX = signalDir > 0 ? w * 0.5 - lampW - inset : -w * 0.5 + inset;
          ctx.fillStyle = blinkOn ? '#ffd23f' : 'rgba(255,210,63,0.22)';
          ctx.fillRect(lampX, -h * 0.94, lampW, lampH);
          if (blinkOn) {
            const ax = signalDir * w * 0.8;
            const ay = -h - Math.max(4, h * 0.24);
            const size = Math.max(3, w * 0.24);
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.moveTo(ax, ay - size * 0.72);
            ctx.lineTo(ax + signalDir * size, ay);
            ctx.lineTo(ax, ay + size * 0.72);
            ctx.closePath();
            ctx.fill();
          }
        }
        ctx.restore();
      }

      /* 打灯后沿目标车道铺一条琥珀色虚线导引，明确“这辆车要并到这里”。 */
      function drawSignalPath(car) {
        if (!car.signalDir) return;
        if (!Number.isFinite(Number(car.targetLane))) return;
        if (car.z > 1.02) return;
        const pulse = 0.55 + 0.45 * Math.sin(car.blinkPhase * Math.PI);
        ctx.save();
        ctx.fillStyle = '#ffd23f';
        ctx.globalAlpha = 0.3 + pulse * 0.28;
        /* 从车的位置往玩家方向铺短虚线，不铺满整条车道，避免像一块暗色阴影。 */
        for (let z = clamp(car.z, 0.06, 1); z > 0.04; z -= 0.09) {
          const uA = uOf(z);
          const uB = uOf(Math.max(0.02, z - 0.045));
          const xA = laneCenterX(car.targetLane, uA);
          const xB = laneCenterX(car.targetLane, uB);
          const wA = Math.max(1.5, laneWidthAt(uA) * 0.09);
          const wB = Math.max(1.5, laneWidthAt(uB) * 0.09);
          ctx.beginPath();
          ctx.moveTo(xA - wA / 2, yAt(uA));
          ctx.lineTo(xA + wA / 2, yAt(uA));
          ctx.lineTo(xB + wB / 2, yAt(uB));
          ctx.lineTo(xB - wB / 2, yAt(uB));
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPickup(p) {
        if (p.z > 1.04) return;
        const u = uOf(clamp(p.z, 0, 1));
        const sc = scaleAt(u);
        if (sc <= 0.01) return;
        const x = laneCenterX(p.lanePos, u);
        const y = yAt(u);
        const w = 30 * sc;
        const h = 18 * sc;
        ctx.save();
        ctx.translate(x, y);
        /* 远处一根淡光柱，保证小尺寸时也能在车流里被发现。 */
        ctx.fillStyle = p.type === 'repair' ? 'rgba(102,211,110,0.18)' : 'rgba(65,217,217,0.18)';
        ctx.fillRect(-Math.max(1, w * 0.06), -h * 4, Math.max(2, w * 0.12), h * 4);
        if (p.type === 'repair') {
          ctx.fillStyle = 'rgba(6,20,12,0.85)';
          A.draw.roundRect(ctx, -w / 2, -h, w, h, 5 * sc);
          ctx.fill();
          ctx.strokeStyle = '#66d36e';
          ctx.lineWidth = Math.max(1, 1.6 * sc);
          ctx.stroke();
          const cs = Math.max(1.2, 4.4 * sc);
          ctx.fillStyle = '#9bf0a4';
          ctx.fillRect(-cs / 2, -h / 2 - cs * 1.4, cs, cs * 2.8);
          ctx.fillRect(-cs * 1.4, -h / 2 - cs / 2, cs * 2.8, cs);
        } else {
          const pulse = 0.5 + 0.5 * Math.sin(p.phase + performance.now() / 180);
          ctx.fillStyle = 'rgba(65,217,217,' + (0.35 + pulse * 0.45) + ')';
          for (let k = 0; k < 2; k++) {
            const ay = -h * (0.2 + k * 0.42);
            const aw = w * 0.46;
            ctx.beginPath();
            ctx.moveTo(-aw / 2, ay + h * 0.22);
            ctx.lineTo(0, ay);
            ctx.lineTo(aw / 2, ay + h * 0.22);
            ctx.lineTo(aw / 2, ay + h * 0.36);
            ctx.lineTo(0, ay + h * 0.14);
            ctx.lineTo(-aw / 2, ay + h * 0.36);
            ctx.closePath();
            ctx.fill();
          }
        }
        ctx.restore();
      }

      /* 挑战模式：按固定时间轴绘制被占用车道上的车流与预告。 */
      function drawChallengeTraffic() {
        const laneCount = chLaneCount();
        chSlots.forEach((slot) => {
          const rel = (chSimTime - slot.atSec) / slot.durationSec;
          if (rel < 0) {
            if (chSimTime >= slot.atSec - slot.telegraphLeadSec) {
              const warn = clamp(1 - (slot.atSec - chSimTime) / Math.max(0.01, slot.telegraphLeadSec), 0, 1);
              const uTop = uOf(0.55);
              const uBottom = uOf(0.02);
              const laneWidthTop = (roadHalfAt(uTop) * 2) / laneCount;
              const laneWidthBottom = (roadHalfAt(uBottom) * 2) / laneCount;
              ctx.save();
              ctx.globalAlpha = 0.16 + warn * 0.3;
              ctx.fillStyle = '#ff7847';
              slot.occupiedLanes.forEach((lane) => {
                const xTop = laneCenterX(lane, uTop);
                const xBottom = laneCenterX(lane, uBottom);
                ctx.beginPath();
                ctx.moveTo(xTop - laneWidthTop * 0.45, yAt(uTop));
                ctx.lineTo(xTop + laneWidthTop * 0.45, yAt(uTop));
                ctx.lineTo(xBottom + laneWidthBottom * 0.45, yAt(uBottom));
                ctx.lineTo(xBottom - laneWidthBottom * 0.45, yAt(uBottom));
                ctx.closePath();
                ctx.fill();
              });
              ctx.restore();
            }
            return;
          }
          if (rel > 1) return;
          const u = uOf(clamp(1 - rel, 0, 1));
          const sc = scaleAt(u);
          slot.occupiedLanes.forEach((lane) => {
            drawCar(laneCenterX(lane, u), yAt(u), 40 * sc, 62 * sc, '#e05656', false, 0, false);
          });
        });
      }

      function drawChallengePlayer() {
        drawCar(laneCenterX(chLanePos, uOf(0)), PLAYER_Y + 30, 40, 62, '#ff7847', false, clamp((chLane - chLaneFrom) * 0.1, -0.14, 0.14), true);
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        drawSky();
        drawRoad();

        /* 路边装饰（远→近） */
        props
          .slice()
          .sort((a, b) => b.z - a.z)
          .forEach(drawProp);

        if (mode === 'challenge') {
          drawChallengeTraffic();
          particles.draw(ctx);
          drawChallengePlayer();
        } else {
          /* 转向灯车道提示带（画在车流下面） */
          cars.forEach(drawSignalPath);

          /* 拾取物（远→近，画在车流下方） */
          pickups
            .slice()
            .sort((a, b) => b.z - a.z)
            .forEach(drawPickup);

          /* 敌车（远→近）；打灯中的车同时显示闪烁指示灯与箭头。 */
          cars
            .filter((c) => c.z <= 1.02)
            .sort((a, b) => b.z - a.z)
            .forEach((c) => {
              const u = uOf(clamp(c.z, 0, 1));
              const sc = scaleAt(u);
              const blinkOn = Math.floor(c.blinkPhase) % 2 === 0;
              drawCar(laneCenterX(c.lanePos, u), yAt(u), c.w * sc, c.h * sc, c.color, c.truck, 0, false, c.signalDir, blinkOn);
            });

          particles.draw(ctx);

          /* 玩家车 */
          if ((state === 'playing' || state === 'paused') && !(player.invul > 0 && Math.floor(player.invul * 12) % 2 === 0)) {
            drawCar(player.x, PLAYER_Y + 30, 40, 62, '#ff7847', false, player.tilt, true);
          }

          /* 分段节奏提示 */
          if (bannerTimer > 0) {
            A.draw.label(ctx, bannerText, W / 2, HORIZON + 92, {
              font: 'bold 17px system-ui',
              color: '#ffd23f',
              alpha: Math.min(1, bannerTimer / 0.45),
            });
          }
        }

        /* HUD */
        if (mode === 'challenge' && chStage) {
          A.draw.label(ctx, fmtChallengeLabel(chStage) + ' ' + (chStage.title || ''), 12, 22, { align: 'left', font: 'bold 14px system-ui', color: '#5ad1a0' });
          A.draw.label(ctx, Math.round(chDistance) + ' / ' + Math.round(chGoalMinDistance()) + ' m', W - 14, 22, {
            align: 'right',
            font: 'bold 15px system-ui',
            color: '#ffd23f',
          });
          A.draw.label(ctx, '路段 ' + chProgressLabel() + ' · 得分 ' + chScore + (chNear > 0 ? ' · 近距 ' + chNear : ''), W / 2, 48, {
            font: 'bold 12px system-ui',
            color: '#7ce8e0',
          });
          if (chFailedSlot) {
            A.draw.label(ctx, '第 ' + chFailedSlot.slot + ' 段撞车', W / 2, 70, { font: 'bold 12px system-ui', color: '#ff8f8f' });
          }
        } else {
          A.draw.label(ctx, Math.floor(dist) + ' / ' + JOY_GOAL_DIST + ' m', 12, 22, { align: 'left', font: 'bold 15px system-ui', color: '#ffd23f' });
          const kmh = Math.round(speed * 360);
          A.draw.label(ctx, kmh + ' km/h', W - 14, 22, { align: 'right', font: 'bold 15px system-ui', color: '#eef1ff' });
          /* 连超：连击数 + 剩余窗口进度条；尾流/氮气状态单独一行。 */
          if (combo >= 2) {
            A.draw.label(ctx, '连超 ×' + combo, W / 2, 44, {
              font: 'bold 14px system-ui',
              color: comboFlash > 0.35 ? '#ffd23f' : '#7ce8e0',
            });
            const barW = 76;
            const ratio = clamp(comboTimer / COMBO_WINDOW, 0, 1);
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(W / 2 - barW / 2, 54, barW, 3);
            ctx.fillStyle = '#ffd23f';
            ctx.fillRect(W / 2 - barW / 2, 54, barW * ratio, 3);
          }
          const statuses = [];
          if (boostTimer > 0) statuses.push('氮气 ' + boostTimer.toFixed(1) + 's');
          if (calmTimer > 0) statuses.push('慢放 ' + calmTimer.toFixed(1) + 's');
          if (shieldArmed) statuses.push('气囊已武装');
          if (statuses.length) A.draw.label(ctx, statuses.join(' · '), W / 2, combo >= 2 ? 72 : 48, { font: 'bold 12px system-ui', color: '#7ce8e0' });
          for (let i = 0; i < lives; i++) {
            ctx.save();
            ctx.translate(W - 24 - i * 18, 44);
            ctx.fillStyle = '#ff7847';
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(6, 6);
            ctx.lineTo(-6, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();
      }

      /* ---------- 输入与循环 ---------- */
      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      bindTouchPad();
      bindJoyTools();
      syncTouchPad();
      syncJoyTools();
      if (chDom.back) {
        chDom.back.addEventListener('click', () => {
          hideChallengePanel();
          showStart();
        });
      }
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              lane: player.lane,
              x: player.x,
              speed,
              cruise,
              cars: cars.length,
              safe: safeLaneList(),
              state,
              dist,
              lives,
              tools: { shield: tools.shield, calm: tools.calm },
              shieldArmed,
              calmTimer,
              /* 0.8.5 车流规则与娱乐点（纯新增字段）。 */
              pickups: pickups.length,
              combo,
              comboBest,
              comboTimer,
              nearPasses,
              passedCars,
              crashes,
              boostTimer,
              rating: runRating(),
              signalingCars: cars.filter((c) => c.signalDir !== 0 && c.changeState !== 'none').length,
            };
          },
          joyInfo() {
            return {
              state,
              tools: { shield: tools.shield, calm: tools.calm },
              shieldArmed,
              calmTimer,
              dist,
              goal: JOY_GOAL_DIST,
              speed,
              lives,
            };
          },
          useJoyTool(id) {
            return clickJoyTool(id);
          },
          forceCollision() {
            if (mode === 'challenge') {
              return chFail('第 ' + (chSlotCheck + 1) + ' 段：测试碰撞');
            }
            cars.push({
              lane: player.lane, lanePos: player.lane, z: 0.06, own: 0.2, w: 40, h: 62,
              truck: false, color: CAR_COLORS[0], passed: false,
              changeState: 'none', signalDir: 0, signalLeft: 0, changeLeft: 0,
              changeFrom: player.lane, changeTo: player.lane, targetLane: player.lane,
              blinkPhase: 0, wantsChange: false, triggerZ: 1,
            });
            return true;
          },
          /* 0.8.5 测试钩子：在玩家相邻车道生成一辆打灯并线的车。 */
          spawnSignalCar(fromLane, targetLane, z) {
            if (mode !== 'classic' || state !== 'playing') return null;
            const from = clamp(Math.floor(Number(fromLane)), 0, LANES - 1);
            const target = clamp(Math.floor(Number(targetLane)), 0, LANES - 1);
            if (from === target) return null;
            const car = {
              lane: from, lanePos: from, z: Number.isFinite(Number(z)) ? clamp(Number(z), 0.2, 1.2) : 0.75,
              own: 0.2, w: 40, h: 62, truck: false, color: CAR_COLORS[0], passed: false,
              changeState: 'signal', signalDir: target > from ? 1 : -1, signalLeft: 0.35,
              changeLeft: 0, changeFrom: from, changeTo: target, targetLane: target,
              blinkPhase: 0, wantsChange: true, triggerZ: 1,
            };
            cars.push(car);
            return { lane: car.lane, lanePos: car.lanePos, z: car.z, signalDir: car.signalDir, targetLane: car.targetLane };
          },
          /* 0.8.5 测试钩子：在指定车道放一辆可被超车的慢车。 */
          spawnCarForTest(lane, z, own) {
            if (mode !== 'classic' || state !== 'playing') return null;
            const laneIdx = clamp(Math.floor(Number(lane)), 0, LANES - 1);
            const car = {
              lane: laneIdx, lanePos: laneIdx, z: Number.isFinite(Number(z)) ? clamp(Number(z), 0.02, 1.2) : 0.12,
              own: Number.isFinite(Number(own)) ? clamp(Number(own), 0.02, 0.5) : 0.1,
              w: 40, h: 62, truck: false, color: CAR_COLORS[0], passed: false,
              changeState: 'none', signalDir: 0, signalLeft: 0, changeLeft: 0,
              changeFrom: laneIdx, changeTo: laneIdx, targetLane: laneIdx,
              blinkPhase: 0, wantsChange: false, triggerZ: 1,
            };
            cars.push(car);
            return { lane: car.lane, z: car.z, own: car.own };
          },
          clearCars() {
            cars = [];
            return true;
          },
          carsSnapshot() {
            return cars.map((c) => ({
              lane: c.lane,
              lanePos: c.lanePos,
              z: c.z,
              own: c.own,
              passed: c.passed,
              changeState: c.changeState,
              signalDir: c.signalDir,
              targetLane: c.targetLane,
            }));
          },
          spawnPickupForTest(type) {
            if (mode !== 'classic' || state !== 'playing') return false;
            pickups.push({
              lane: player.lane, lanePos: player.lane, z: 0.5,
              type: type === 'repair' ? 'repair' : 'boost', phase: 0,
            });
            return true;
          },
          setCombo(value) {
            combo = Math.max(0, Math.floor(Number(value) || 0));
            comboBest = Math.max(comboBest, combo);
            comboTimer = combo > 0 ? COMBO_WINDOW : 0;
            return combo;
          },
          visualInfo() {
            /* 远景出场验收：地平线处的车身尺寸必须明显大于 0，才能从最远处看见车流。 */
            const horizon = scaleAt(0);
            return {
              horizonScale: horizon,
              horizonCarWidth: 40 * horizon,
              horizonCarHeight: 62 * horizon,
              roadFarWidth: roadHalfAt(0) * 2,
              laneWidthAtPlayer: laneWidthAt(1),
            };
          },
          setDist(value) {
            dist = Math.max(0, Number(value) || 0);
            syncHud();
            return dist;
          },
          stressSpawn(count) {
            let violations = 0;
            let spawned = 0;
            for (let i = 0; i < (count || 100); i++) {
              const before = cars.length;
              spawnCar();
              if (cars.length > before) spawned += 1;
              if (!futureSafe(null)) violations += 1;
            }
            return { violations, spawned, cars: cars.length, safe: safeLaneList() };
          },
          challengeStages() {
            if (!A.Challenge || !challengeAvailable) return [];
            const progress = A.Challenge.progress(GAME_ID);
            return challengeData.map((stage) => ({
              id: stage.id,
              stageNumber: stage.stageNumber,
              title: stage.title,
              unlocked: A.Challenge.isUnlocked(GAME_ID, stage.id),
              best: progress.best[stage.id] || null,
            }));
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              stageIndex: chStageIndex,
              state,
              elapsedSec: chSimTime,
              durationSec: chDuration,
              objective: chStage ? chStage.goalStatement : null,
              decision: chStage ? chStage.decision : null,
              cleared: !!chResult,
              collectibles: chResult ? chResult.collectibles.slice() : [],
              assisted: chAssisted,
              score: chScore,
              distance: chDistance,
              goalDistance: chGoalMinDistance(),
              lane: chLane,
              lanePos: chLanePos,
              passedSlots: chPassed,
              nearPasses: chNear,
              error: chErrorReason,
              failedSlot: chFailedSlot ? chFailedSlot.slot : null,
            };
          },
          stageObservable() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              simTime: chSimTime,
              durationSec: chDuration,
              lane: chLane,
              lanePos: chLanePos,
              score: chScore,
              distance: chDistance,
              goal: chContent().goal || {},
              laneChangeTimeSec: chLaneChangeTotal,
              slots: chSlots.map((slot) => ({
                slot: slot.slot,
                atSec: slot.atSec,
                passAt: slot.passAt,
                occupiedLanes: slot.occupiedLanes.slice(),
                optionalNearPassBonusLanes: slot.optionalNearPassBonusLanes.slice(),
              })),
              checkedSlots: chSlotCheck,
              passedSlots: chPassed,
              nearPasses: chNear,
              failedSlot: chFailedSlot ? chFailedSlot.slot : null,
            };
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || !chStage) return false;
            chAssisted = !!assisted;
            chDistance = chGoalMinDistance();
            chSimTime = chDuration;
            chSlotCheck = chSlots.length;
            chPassed = chSlots.length;
            return chFinishSuccess();
          },
          forceStageFail(reason) {
            if (mode !== 'challenge' || !chStage) return false;
            return chFail(String(reason || '测试失败'));
          },
          exitChallenge() {
            return exitToChallengeSelect();
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '极速车道',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              syncTouchPad();
              hideOverlay();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
