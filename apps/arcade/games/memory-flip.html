<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 0.11.5：禁止移动端双击误触放大（游戏误操作防护）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="记忆翻牌：翻牌配对，5 个关卡牌数逐渐增加、预览时间逐渐缩短，适合地铁通勤的竖屏小游戏。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../career/bridge.js"></script>
  <script src="../challenge/memory-flip.js"></script>
  <style>
    /* 0.9 挑战模式页面局部微调：挑战层覆盖舞台，面板/提示/返回可滚动且不横向溢出 */
    .challenge-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; background: rgba(8, 13, 28, 0.96); border-radius: inherit; }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-btn[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud { position: absolute; left: 8px; right: 8px; top: 8px; width: auto; z-index: 4; pointer-events: none; }
    /* 0.17 职业委托：开局/暂停/结算弹层里的戏内目标行；320/375 也不超过两行。 */
    .career-mission-line { display: block; margin: 2px auto 0; padding: 3px 9px; max-width: 100%; border: 1px solid rgba(90, 209, 160, 0.55); border-radius: 10px; background: rgba(90, 209, 160, 0.12); color: #d9ffe9; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .overlay-panel .career-mission-line { color: #d9ffe9; }
  </style>
  <title>记忆翻牌 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#5ad1a0; --card-accent:#5ad1a0">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🃏 记忆翻牌</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="记忆翻牌游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>记忆翻牌</h2>
            <p data-ov-text>翻牌配对</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <p class="game-hint">点击翻牌，两张相同即配对 · 每关先亮牌预览 · 道具 1 再看一眼 / 2 灵犀提示 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const career = window.ArcadeCareer || null;
      const { clamp, rand, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);

      /* ---------- 0.9 挑战模式：数据/记录/选关 UI（A.Challenge 由 engine.js 提供） ---------- */
      const gameId = 'memory-flip';
      const challengeData = A.Challenge ? A.Challenge.stages(gameId) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      const CH_GOAL_HINT_MS = 3000;
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chElapsed = 0;
      let chMismatches = 0;
      let chAssisted = false;
      let chErrorReason = '';
      let chLastResult = null;
      let chGoalHintTimer = 0;
      let chHudSecond = -1;
      /* 挑战预览计划：按区域数均分实际 previewSeconds，最后区域不会被切没；HUD 预览剩余时间元素缓存。 */
      let chPreviewPlan = null;
      let chPreviewEl = null;

      /* ===== 0.17 职业委托（ADR §19.2 / 19.3 / 19.4 / 19.8）=====
         - 只有玩家从旧港告示板接单后带 ?career=<ticketId> 进入本页、且 bridge 确认
           属于本页 gameId 时才进入职业 run；
         - 职业 run 内不读不写 studiokit:arcade:runs:v1，不写 Progress/Scores/挑战/最高分，
           经典结算弹层也不会把职业局记进最高分；结算只走 career.finish 的独立职业收据；
         - 无 ticket / ticket 不匹配 / bridge 缺失时本段全部 no-op，页面与 0.16 行为一致。 */
      let careerLocked = false;        // 已确认进入职业 run：本页生命周期内经典记录全禁用
      let careerSettled = null;        // {pending:true} → {ok, reason, credits, duplicate}
      let careerGoalSource = null;     // 接单时缓存的委托内容（结算后仍可显示戏内目标）
      let careerGoalDone = false;      // 已结算：开始弹层不再展示旧目标
      let careerPostSettled = false;   // 结算后在本页再开的新局（不再写任何记录，也不重复展示收据）
      let quitRequested = false;

      function careerTicketParam() {
        try {
          const search = String((window.location && window.location.search) || '');
          const match = /(?:^|[?&])career=([^&]+)/.exec(search);
          if (!match) return '';
          const value = decodeURIComponent(match[1].replace(/\+/g, ' '));
          return /^[A-Za-z0-9._:-]{1,120}$/.test(value) ? value : '';
        } catch (err) {
          return '';
        }
      }

      /* 本页当前是否有属于本游戏的职业 run（bridge 只在 ticket 校验通过时填充）。 */
      function readCareerRun() {
        try {
          if (!career || typeof career.isCommissionRun !== 'function' || !career.isCommissionRun()) return null;
          const run = career.commissionRun;
          if (!run || run.gameId !== gameId) return null;
          return run;
        } catch (err) {
          return null;
        }
      }

      /* 戏内目标只来自真实委托内容（commissionRun.commission）；内容缺失时返回 null，不发明文案。 */
      function goalPartsOf(commission) {
        if (!commission || typeof commission !== 'object') return null;
        const title = typeof commission.title === 'string' ? commission.title : '';
        const summary = typeof commission.summary === 'string' ? commission.summary : '';
        if (!title && !summary) return null;
        const objective = commission.objective && typeof commission.objective === 'object' ? commission.objective : {};
        const raw = Number(objective.atLeast);
        const atLeast = Number.isFinite(raw) && raw > 0 ? Math.floor(raw) : 0;
        const kind = typeof objective.kind === 'string' ? objective.kind : '';
        return { title, summary, atLeast, kind };
      }

      function careerGoalParts() {
        const run = readCareerRun();
        const commission = (run && run.commission) || careerGoalSource;
        return goalPartsOf(commission);
      }

      /* 一行戏内目标：只 title + 目标张数（summary 在告示板可读），320/375 也不超两行。 */
      function careerGoalLine() {
        const goal = careerGoalParts();
        if (!goal) return '';
        const text = goal.title || goal.summary;
        const unit = goal.kind === 'pair.match' ? '对' : goal.kind === 'session.finish' ? '局' : '';
        const target = goal.atLeast ? '（目标 ' + goal.atLeast + (unit ? ' ' + unit : '') + '）' : '';
        return '<span class="career-mission-line" data-career-goal="1">委托：' + chEsc(text) + chEsc(target) + '</span>';
      }

      /* 职业 run 内断开旧 RunSave：serialize() 返回 null，并兜底替换 autosave 的四个出口。 */
      function lockRunSave() {
        if (careerLocked) return;
        careerLocked = true;
        try {
          autosave.saveNow = function () { return false; };
          autosave.tick = function () {};
          autosave.clear = function () {};
          autosave.load = function () { return null; };
        } catch (err) {
          /* 忽略：serialize() 的 career 门禁仍是最终兜底 */
        }
      }

      function activateCareerRun(runInfo) {
        if (!runInfo || runInfo.gameId !== gameId) return false;
        lockRunSave();
        careerGoalSource = runInfo.commission && typeof runInfo.commission === 'object' ? runInfo.commission : null;
        careerGoalDone = false;
        try {
          document.body.classList.toggle('is-career-run', true);
        } catch (err) {
          /* ignore */
        }
        return true;
      }

      /* 观察事件：职业 run 只进本 run 的委托缓冲（bridge 负责路由），经典路径保持 0.16 原样。 */
      function careerObserve(kind, payload) {
        if (!career || typeof career.observe !== 'function') return false;
        if (careerLocked) {
          if (careerSettled) return false;
          return career.observe(kind, payload);
        }
        if (mode !== 'classic') return false;
        return career.observe(kind, payload);
      }

      function summarizeCareerResult(result) {
        if (!result || typeof result !== 'object') return { ok: false, reason: 'empty' };
        if (result.ok === true) {
          const receipt = result.receipt && typeof result.receipt === 'object' ? result.receipt : null;
          return {
            ok: true,
            duplicate: result.duplicate === true,
            credits: receipt && Number.isFinite(Number(receipt.credits)) ? Number(receipt.credits) : Number(result.credits) || 0,
            hasItems: !!(receipt && receipt.items && Object.keys(receipt.items).length),
            receiptId: receipt && (receipt.receiptId || receipt.txId) ? String(receipt.receiptId || receipt.txId) : null,
          };
        }
        return {
          ok: false,
          reason: typeof result.reason === 'string' ? result.reason : 'failed',
          observed: Number.isFinite(Number(result.observed)) ? Number(result.observed) : null,
        };
      }

      /* 结算：职业 run 走 bridge/commission-core 独立收据；经典路径保持 0.16 原样调用。 */
      function careerFinish(outcome) {
        if (!career || typeof career.finish !== 'function') return;
        if (!careerLocked) {
          if (mode !== 'classic') return;
          career.finish({ mode: 'classic', outcome: outcome || 'lost', stats: { level, moves, score } });
          return;
        }
        if (careerSettled) return;
        careerSettled = { pending: true };
        const stats = { level, moves, score, matches: sessionMatches };
        let promise = null;
        try {
          promise = career.finish({ mode: 'classic', outcome: outcome || 'lost', stats: stats });
        } catch (err) {
          careerSettled = { ok: false, reason: 'finish-threw' };
          careerGoalDone = true;
          if (state === 'over') showCareerResult(quitRequested !== true);
          return;
        }
        Promise.resolve(promise)
          .then((result) => {
            careerSettled = summarizeCareerResult(result);
            careerGoalDone = true;
            if (state === 'over') showCareerResult(quitRequested !== true);
          })
          .catch(() => {
            careerSettled = { ok: false, reason: 'finish-error' };
            careerGoalDone = true;
            if (state === 'over') showCareerResult(quitRequested !== true);
          });
      }

      /* 结算文案只用戏内措辞；技术原因只留在测试探针（careerInfo），不写给玩家。 */
      function careerResultText(won) {
        const settled = careerSettled;
        let line = '这一局正在结算，收据会记入旧港档案。';
        if (careerPostSettled) {
          line = '委托已结算；这局不写入最高分与积分记录。';
        } else if (settled && settled.pending !== true) {
          if (settled.ok) {
            line =
              '委托结算完成：报酬 ' + settled.credits +
              (settled.hasItems ? ' · 材料已入册' : '') +
              (settled.duplicate ? '（此前已结算）' : '') +
              '<br/>收据已记入旧港档案。';
          } else if (settled.reason === 'objective-not-met' || settled.reason === 'value-not-met') {
            line = '目标还差一点，这次没有报酬；可回旧港重新接单。';
          } else {
            line = '结算没有完成，可回旧港核对档案记录。';
          }
        }
        const goal = careerPostSettled ? '' : careerGoalLine();
        return (
          `<span class="ac-score">${score}</span>` +
          (won ? `全部 ${LEVELS.length} 关完成 · ${moves} 次翻牌 · 用时 ${fmtTime(elapsed)}<br/>` : `第 ${level} 关 · ${moves} 次翻牌<br/>`) +
          (goal ? goal + '<br/>' : '') +
          line
        );
      }

      function showCareerResult(won) {
        ui.show({
          result: '回看牌面',
          title: won ? '全部通关！' : '游戏结束',
          text: careerResultText(won),
          btn: '再来一局',
          onBtn: showStart,
        });
        pauseUi.sync();
      }

      /* 玩家主动收工（仅职业 run 的暂停弹层）：自然结束本局并如实结算。 */
      function endCareerSession() {
        if (!careerLocked || state === 'over') return false;
        quitRequested = true;
        finish(false);
        return true;
      }

      const SYMBOLS = ['🍎', '🍋', '🍇', '🍒', '🥝', '🍑', '🍉', '🍊', '🥥', '🍍', '🫐', '🥕', '🌽', '🍄', '🌻', '🐳', '🐙', '🦊', '🐼', '🦉', '⭐', '🌙', '☀️', '🔥'];
      const LEVELS = [
        { cols: 3, rows: 2, preview: 3.2 },
        { cols: 4, rows: 2, preview: 3.0 },
        { cols: 4, rows: 3, preview: 2.7 },
        { cols: 4, rows: 4, preview: 2.4 },
        { cols: 5, rows: 4, preview: 2.1 },
        { cols: 6, rows: 4, preview: 1.8 },
      ];
      const BOARD = { x: 26, y: 168, w: W - 52, h: 448 };
      const TOOL_START = { peek: 2, hint: 2 };
      const TOOL_CAPS = { peek: 2, hint: 2 };
      const PEEK_DURATION = 1.2;
      const HINT_DURATION = 1.5;
      const PREVIEW_MIN = 0.6;
      const tools = { peek: TOOL_START.peek, hint: TOOL_START.hint };
      let peekTimer = 0;
      let hintArmed = false;
      let hintTargetId = -1;
      let hintTimer = 0;

      let cards = [];
      let layout = null;
      let level = 1;
      let score = 0;
      let moves = 0;
      let sessionMatches = 0;
      let elapsed = 0;
      let previewTimer = 0;
      let mismatchTimer = 0;
      let flippedIds = [];
      let levelClearTimer = 0;
      let state = 'ready';
      let recordSaved = false;
      let lastTap = 0;

      let high = A.Progress.get('memory-flip').high;
      dom.hudHigh.textContent = String(high);

      function levelConfig(lv) {
        return LEVELS[clamp(lv - 1, 0, LEVELS.length - 1)];
      }

      function computeLayout(cfg) {
        const gap = Math.max(6, Math.min(12, Math.floor(360 / Math.max(cfg.cols, cfg.rows) / 12)));
        const cw = (BOARD.w - gap * (cfg.cols - 1)) / cfg.cols;
        const ch = Math.min(cw * 1.08, (BOARD.h - gap * (cfg.rows - 1)) / cfg.rows);
        const totalW = cw * cfg.cols + gap * (cfg.cols - 1);
        const totalH = ch * cfg.rows + gap * (cfg.rows - 1);
        return {
          gap,
          cw,
          ch,
          x: BOARD.x + (BOARD.w - totalW) / 2,
          y: BOARD.y + (BOARD.h - totalH) / 2,
        };
      }

      function cardRect(card) {
        const l = layout;
        return {
          x: l.x + card.c * (l.cw + l.gap),
          y: l.y + card.r * (l.ch + l.gap),
          w: l.cw,
          h: l.ch,
        };
      }

      function buildLevel(lv) {
        const cfg = levelConfig(lv);
        const pairs = (cfg.cols * cfg.rows) / 2;
        const pool = SYMBOLS.slice();
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        const symbols = [];
        for (let i = 0; i < pairs; i++) symbols.push(pool[i % pool.length], pool[i % pool.length]);
        for (let i = symbols.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
        }
        layout = computeLayout(cfg);
        cards = symbols.map((symbol, index) => ({
          id: index,
          symbol,
          r: Math.floor(index / cfg.cols),
          c: index % cfg.cols,
          matched: false,
          pop: 0,
        }));
        previewTimer = cfg.preview;
        mismatchTimer = 0;
        flippedIds = [];
        levelClearTimer = 0;
        peekTimer = 0;
        hintArmed = false;
        hintTargetId = -1;
        hintTimer = 0;
      }

      function reset() {
        level = 1;
        score = 0;
        moves = 0;
        sessionMatches = 0;
        elapsed = 0;
        tools.peek = TOOL_START.peek;
        tools.hint = TOOL_START.hint;
        recordSaved = false;
        buildLevel(1);
        syncHud();
      }

      function syncHud() {
        if (mode === 'challenge') {
          syncChallengeHud();
          return;
        }
        dom.hudScore.textContent = String(score);
      }

      function startGame() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        if (careerLocked && careerGoalDone) careerPostSettled = true;
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        joyTools.sync();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        joyTools.sync();
      }

      function finish(won) {
        if (state === 'over') return;
        state = 'over';
        hintArmed = false;
        peekTimer = 0;
        hintTargetId = -1;
        hintTimer = 0;
        joyTools.sync();
        autosave.clear();
        A.Sfx.play(won ? 'perfect' : 'over');
        /* 0.17 职业 run：不写 Progress/Scores/最高分与局内档；先提交自然结束事件，再走职业收据结算。 */
        if (careerLocked) {
          const outcome = won ? 'won' : 'quit';
          careerObserve('session.finish', { level, matches: sessionMatches, outcome });
          loop.pause();
          showCareerResult(won);
          careerFinish(outcome);
          return;
        }
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('memory-flip', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        const text = won
          ? `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `全部 ${LEVELS.length} 关完成 · ${moves} 次翻牌 · 用时 ${fmtTime(elapsed)}`
          : `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `第 ${level} 关 · ${moves} 次翻牌`;
        ui.show({
          result: '回看牌面',
          title: won ? '全部通关！' : '游戏结束',
          text,
          btn: '再来一局',
          onBtn: showStart,
        });
        if (career && mode === 'classic') career.finish({ mode: 'classic', outcome: won ? 'won' : 'lost', stats: { level, moves, score } });
        pauseUi.sync();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        joyTools.sync();
        autosave.saveNow();
        /* 0.17 职业 run：局内进度不落旧 RunSave，文案改为戏内目标 + 如实说明不计分。 */
        const careerGoal = careerLocked && !careerGoalDone ? careerGoalParts() : null;
        const opts = {
          title: '已暂停',
          text: careerLocked
            ? (careerGoal
              ? '牌面已盖好。<br/>' + careerGoalLine() + '<br/>本局不计入最高分与积分记录。'
              : '牌面已盖好。<br/>本局不计入最高分与积分记录。')
            : '牌面已盖好，等你回来。<br/>局内进度已保存。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge') {
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        } else if (careerLocked && !careerGoalDone) {
          /* 职业 run 才有的收工出口：玩家达成目标后不必打满 6 关才能交差。 */
          opts.btn2 = '结束本局';
          opts.onBtn2 = endCareerSession;
        }
        ui.show(opts);
        pauseUi.sync();
      }

      function showStart() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        /* 0.17 职业 run：追加一行戏内目标；挑战入口不可进入（职业 run 不写挑战记录）。 */
        const careerGoal = careerLocked && !careerGoalDone ? careerGoalLine() : '';
        const challengeEntry = !careerLocked;
        ui.show({
          title: '记忆翻牌',
          text: '点开两张牌找相同图案。<br/>每关开始会先亮牌预览<br/>6 关由少到多、预览时间逐步缩短' + (careerGoal ? '<br/>' + careerGoal : ''),
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeEntry ? (challengeAvailable ? '挑战 6 关' : '挑战数据不可用') : '',
          onBtn2: challengeEntry && challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      function fmtTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function chStageIndexFor(stage) {
        return challengeData.findIndex((item) => item.id === stage.id);
      }

      function chMaxMismatches() {
        return chStage && chStage.content && Number.isFinite(Number(chStage.content.maxMismatches)) ? Number(chStage.content.maxMismatches) : 4;
      }

      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }

      /* 选关面板：由 A.Challenge.stageListHtml 统一生成；初始 root.hidden=true（开始弹层默认不可见）。 */
      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(gameId);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }

      function showChallengePanel() {
        /* 0.17：职业委托 run 内不开挑战入口（避免写挑战进度记录）。 */
        if (careerLocked) return;
        if (!challengeAvailable) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        if (chDom.back) chDom.back.hidden = false;
        loop.pause();
        state = 'challenge-menu';
        pauseUi.sync();
      }

      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        if (chDom.back) chDom.back.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }

      function backToStartFromPanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        state = 'ready';
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        showStart();
        pauseUi.sync();
        joyTools.sync();
      }

      /* 分区预览按「区域数」均分实际 previewSeconds（而不是用 clue 里的每区秒数硬切），
         保证最后区域至少曝光 PREVIEW_MIN 秒；均分不足时把总预览延长到 regionCount*PREVIEW_MIN。 */
      function chPreviewRegions(content) {
        const clues = content.clues || {};
        const rows = Math.max(1, Number(content.grid && content.grid.rows) || 1);
        const cols = Math.max(1, Number(content.grid && content.grid.cols) || 1);
        if (clues.previewMode === 'row-by-row') {
          const regions = [];
          for (let r = 0; r < rows; r++) regions.push({ type: 'row', r: r });
          return regions;
        }
        if (clues.previewMode === 'quadrants') {
          const halfR = Math.ceil(rows / 2);
          const halfC = Math.ceil(cols / 2);
          const order = [[0, 0], [0, 1], [1, 0], [1, 1]];
          return order
            .filter((item) => item[0] * halfR < rows && item[1] * halfC < cols)
            .map((item) => ({ type: 'quadrant', qy: item[0], qx: item[1], halfR: halfR, halfC: halfC }));
        }
        return [{ type: 'all' }];
      }

      function chBuildPreviewPlan(content) {
        const raw = Math.max(0, Number(content && content.previewSeconds) || 0);
        const regions = chPreviewRegions(content || {});
        const regionCount = Math.max(1, regions.length);
        let total = raw;
        let per = total / regionCount;
        if (per < PREVIEW_MIN) {
          per = PREVIEW_MIN;
          total = regionCount * PREVIEW_MIN;
        }
        return { mode: regions[0].type, regions: regions, regionCount: regionCount, total: total, per: per };
      }

      function chPreviewTotal() {
        if (mode === 'challenge') return chPreviewPlan ? chPreviewPlan.total : Math.max(0, Number(chStage && chStage.content.previewSeconds) || 0);
        return levelConfig(level).preview;
      }

      function chPreviewRegionIndex() {
        const plan = chPreviewPlan;
        if (!plan || plan.mode === 'all') return 0;
        const elapsed = Math.max(0, plan.total - previewTimer);
        return Math.min(plan.regionCount - 1, Math.max(0, Math.floor(elapsed / plan.per)));
      }

      function chPreviewReveal(card) {
        if (previewTimer <= 0 || !chStage) return false;
        const plan = chPreviewPlan;
        if (!plan || plan.mode === 'all') return true;
        const region = plan.regions[chPreviewRegionIndex()];
        if (!region) return true;
        if (region.type === 'row') return card.r === region.r;
        return (
          card.r >= region.qy * region.halfR &&
          card.r < (region.qy + 1) * region.halfR &&
          card.c >= region.qx * region.halfC &&
          card.c < (region.qx + 1) * region.halfC
        );
      }

      /* 布局变换：设计包允许 identity/mirror-horizontal/mirror-vertical，用于重玩变化。
         挑战参考解按 identity 冻结；这里实现三种变换函数但默认使用 identity（见 impl 文档的设计差异）。 */
      function challengeTransformFaces(rows, cols, faces, transform) {
        const out = [];
        for (let r = 0; r < rows; r++) {
          out.push([]);
          for (let c = 0; c < cols; c++) {
            let sr = r;
            let sc = c;
            if (transform === 'mirror-horizontal') sr = rows - 1 - r;
            else if (transform === 'mirror-vertical') sc = cols - 1 - c;
            out[r].push(faces[sr][sc]);
          }
        }
        return out;
      }

      function buildChallengeBoard(stage) {
        const content = stage.content || {};
        const rows = Number(content.grid && content.grid.rows) || 2;
        const cols = Number(content.grid && content.grid.cols) || 2;
        const allowed = Array.isArray(content.layoutTransforms) && content.layoutTransforms.length ? content.layoutTransforms : ['identity'];
        const transform = allowed.indexOf('identity') !== -1 ? 'identity' : allowed[0];
        const faces = challengeTransformFaces(rows, cols, content.faces || [], transform);
        layout = computeLayout({ rows, cols });
        cards = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const symbol = faces[r] && faces[r][c] != null ? String(faces[r][c]) : '❔';
            cards.push({ id: r * cols + c, symbol, r, c, matched: false, pop: 0 });
          }
        }
        chPreviewPlan = chBuildPreviewPlan(content);
        previewTimer = chPreviewPlan.total;
        mismatchTimer = 0;
        flippedIds = [];
        levelClearTimer = 0;
        peekTimer = 0;
        hintArmed = false;
        hintTargetId = -1;
        hintTimer = 0;
        return { rows, cols, transform };
      }

      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) {
          chPreviewEl = null;
          return;
        }
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chElapsed);
        if (second === chHudSecond) return;
        chHudSecond = second;
        const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0');
        const clues = (chStage.content && chStage.content.clues) || {};
        let clueText = clues.hintText || '';
        if (!clueText && clues.previewMode === 'row-by-row') clueText = '逐行预览：记住每一行的位置';
        if (!clueText && clues.previewMode === 'quadrants') clueText = '象限预览：用象限编码记住图案';
        chDom.hud.innerHTML =
          '<strong>' + chEsc(label + ' ' + chStage.title) + '</strong>' +
          '<span>' + chEsc(chStage.goalStatement || '') + '</span>' +
          (clueText ? '<span>线索：' + chEsc(clueText) + '</span>' : '') +
          '<span data-ch-preview hidden></span>' +
          '<span>用时 ' + fmtTime(chElapsed) + '</span>' +
          '<span>翻错 ' + chMismatches + '/' + chMaxMismatches() + '</span>';
        chPreviewEl = chDom.hud.querySelector('[data-ch-preview]');
        syncChallengePreviewLabel();
      }

      /* 预览剩余时间：HUD 每帧更新真实倒计时（与画布上的 toFixed(1) 标签同源），
         让「延长总预览」后的剩余时间也如实可见。 */
      function syncChallengePreviewLabel() {
        if (!chPreviewEl) return;
        if (mode === 'challenge' && previewTimer > 0) {
          const total = chPreviewPlan ? chPreviewPlan.total : previewTimer;
          chPreviewEl.hidden = false;
          chPreviewEl.textContent = '预览剩余 ' + previewTimer.toFixed(1) + 's / ' + total.toFixed(1) + 's';
        } else {
          chPreviewEl.hidden = true;
          chPreviewEl.textContent = '';
        }
      }

      function startChallenge(ref) {
        /* 0.17：职业委托 run 内拒绝进入挑战（真实点击也到不了挑战记录）。 */
        if (careerLocked) return false;
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(gameId, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(gameId, stage.id)) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = chStageIndexFor(stage);
        chElapsed = 0;
        chMismatches = 0;
        chAssisted = false;
        chErrorReason = '';
        chLastResult = null;
        chGoalHintTimer = 3;
        chHudSecond = -1;
        buildChallengeBoard(stage);
        state = 'playing';
        hideChallengePanel();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        joyTools.sync();
        syncChallengeHud();
        autosave.clear();
        autosave.saveNow();
        return true;
      }

      function challengeClear() {
        if (mode !== 'challenge' || !chStage) return false;
        state = 'cleared';
        chGoalHintTimer = 0;
        hintArmed = false;
        joyTools.sync();
        autosave.clear();
        const result = { timeSec: Math.round(chElapsed * 10) / 10, assisted: chAssisted, collectibles: [] };
        chLastResult = result;
        if (A.Challenge) A.Challenge.markCleared(gameId, chStage.id, result);
        loop.pause();
        const isLast = chStageIndex >= challengeData.length - 1;
        const tip = '<p class="ac-challenge-tip">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>';
        ui.show({
          result: '回看牌面',
          title: '挑战通关',
          text: A.Challenge.resultHtml(chStage, result) + tip,
          btn: isLast ? '返回选关' : '下一关',
          onBtn: () => {
            if (isLast) exitToChallengeSelect();
            else startChallenge(challengeData[chStageIndex + 1].id);
          },
          btn2: '重玩本关',
          onBtn2: () => startChallenge(chStage.id),
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        chErrorReason = reason || '本关失败';
        autosave.clear();
        loop.pause();
        joyTools.sync();
        ui.show({
          result: '回看牌面',
          title: '挑战失败',
          text:
            '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
            '<p class="ac-challenge-result-row">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>',
          btn: '重试本关',
          onBtn: () => startChallenge(chStage.id),
          btn2: '返回选关',
          onBtn2: exitToChallengeSelect,
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chLastResult = null;
        chErrorReason = '';
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        joyTools.sync();
        showChallengePanel();
        return true;
      }

      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        joyTools.sync();
        showStart();
        return true;
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(gameId, data.stageId);
        if (!stage) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = chStageIndexFor(stage);
        const built = buildChallengeBoard(stage);
        const rows = built.rows;
        const cols = built.cols;
        if (!Array.isArray(data.cards) || data.cards.length !== rows * cols) return false;
        cards = data.cards.map((card, index) => ({
          id: index,
          symbol: card && typeof card.symbol === 'string' ? card.symbol : '❔',
          r: Math.floor(index / cols),
          c: index % cols,
          matched: !!(card && card.matched),
          pop: 0,
        }));
        chElapsed = Math.max(0, Number(data.chElapsed) || 0);
        chMismatches = Math.max(0, Number(data.chMismatches) || 0);
        chAssisted = !!data.chAssisted;
        chLastResult = null;
        chHudSecond = -1;
        previewTimer = Math.max(0, Number(data.previewTimer) || 0);
        mismatchTimer = Math.max(0, Number(data.mismatchTimer) || 0);
        flippedIds = Array.isArray(data.flippedIds) ? data.flippedIds.filter((id) => Number.isInteger(id) && cards[id] && !cards[id].matched) : [];
        /* 刷新续玩：道具次数与 peek / 灵犀效果一并恢复（与 restoreClassic 同样的字段校验与 clamp）。 */
        if (data.tools && typeof data.tools === 'object') {
          tools.peek = Number.isFinite(Number(data.tools.peek)) ? clamp(Math.floor(Number(data.tools.peek)), 0, TOOL_CAPS.peek) : TOOL_START.peek;
          tools.hint = Number.isFinite(Number(data.tools.hint)) ? clamp(Math.floor(Number(data.tools.hint)), 0, TOOL_CAPS.hint) : TOOL_START.hint;
        }
        peekTimer = clamp(Number(data.peekTimer) || 0, 0, PEEK_DURATION);
        hintTimer = clamp(Number(data.hintTimer) || 0, 0, HINT_DURATION);
        const savedHint = Number(data.hintTargetId);
        hintTargetId = hintTimer > 0 && Number.isInteger(savedHint) && cards[savedHint] && !cards[savedHint].matched ? savedHint : -1;
        if (hintTargetId < 0) hintTimer = 0;
        hintArmed =
          !!data.hintArmed &&
          tools.hint > 0 &&
          previewTimer <= 0 &&
          mismatchTimer <= 0 &&
          peekTimer <= 0 &&
          flippedIds.length === 0;
        state = 'playing';
        syncChallengeHud();
        return true;
      }

      function challengeObservable() {
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageNumber: chStage ? chStage.stageNumber : null,
          state,
          rows: cards.length ? (chStage ? chStage.content.grid.rows : 0) : 0,
          cols: cards.length ? (chStage ? chStage.content.grid.cols : 0) : 0,
          faces: chStage ? chStage.content.faces : [],
          cards: cards.map((card) => Object.assign({}, cardRect(card), { id: card.id, r: card.r, c: card.c, symbol: card.symbol, matched: card.matched })),
          matched: cards.map((card) => card.matched),
          flippedIds: flippedIds.slice(),
          previewTimer,
          mismatchTimer,
          mismatches: chMismatches,
          maxMismatches: chMaxMismatches(),
          goalStatement: chStage ? chStage.goalStatement : null,
          clues: chStage ? chStage.content.clues || {} : {},
          layoutTransform: 'identity',
          assisted: chAssisted,
          cleared: !!chLastResult,
        };
      }

      function serialize() {
        /* 0.17 职业 run：绝不写 studiokit:arcade:runs:v1（经典/挑战局内档保持原样）。 */
        if (careerLocked) return null;
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: mode === 'challenge' && chStage ? chStage.id : null,
          chElapsed,
          chMismatches,
          chAssisted,
          level,
          score,
          moves,
          elapsed,
          previewTimer,
          mismatchTimer,
          flippedIds: flippedIds.slice(),
          tools: { peek: tools.peek, hint: tools.hint },
          peekTimer,
          hintArmed,
          hintTargetId,
          hintTimer,
          cards: cards.map((c) => ({ symbol: c.symbol, matched: c.matched })),
        };
      }

      function restoreClassic(data) {
        if (!data || !Array.isArray(data.cards) || !data.cards.length) return false;
        try {
          const lv = clamp(Number(data.level) || 1, 1, LEVELS.length);
          const cfg = levelConfig(lv);
          if (data.cards.length !== cfg.cols * cfg.rows) return false;
          reset();
          level = lv;
          layout = computeLayout(cfg);
          cards = data.cards.map((c, index) => ({
            id: index,
            symbol: typeof c.symbol === 'string' ? c.symbol : '❔',
            r: Math.floor(index / cfg.cols),
            c: index % cfg.cols,
            matched: !!c.matched,
            pop: 0,
          }));
          score = Math.max(0, Number(data.score) || 0);
          moves = Math.max(0, Number(data.moves) || 0);
          elapsed = Math.max(0, Number(data.elapsed) || 0);
          previewTimer = Math.max(0, Number(data.previewTimer) || 0);
          mismatchTimer = Math.max(0, Number(data.mismatchTimer) || 0);
          flippedIds = Array.isArray(data.flippedIds) ? data.flippedIds.filter((id) => Number.isInteger(id) && cards[id]) : [];
          if (data.tools && typeof data.tools === 'object') {
            tools.peek = Number.isFinite(Number(data.tools.peek)) ? clamp(Math.floor(Number(data.tools.peek)), 0, TOOL_CAPS.peek) : TOOL_START.peek;
            tools.hint = Number.isFinite(Number(data.tools.hint)) ? clamp(Math.floor(Number(data.tools.hint)), 0, TOOL_CAPS.hint) : TOOL_START.hint;
          }
          peekTimer = clamp(Number(data.peekTimer) || 0, 0, PEEK_DURATION);
          hintTimer = clamp(Number(data.hintTimer) || 0, 0, HINT_DURATION);
          const savedHint = Number(data.hintTargetId);
          hintTargetId = hintTimer > 0 && Number.isInteger(savedHint) && cards[savedHint] && !cards[savedHint].matched ? savedHint : -1;
          if (hintTargetId < 0) hintTimer = 0;
          hintArmed = !!data.hintArmed && tools.hint > 0 && previewTimer <= 0 && mismatchTimer <= 0 && peekTimer <= 0 && flippedIds.length === 0;
          levelClearTimer = 0;
          recordSaved = false;
          joyTools.sync();
          syncHud();
          return true;
        } catch (err) {
          return false;
        }
      }

      /* 统一恢复入口：0.8 及更早存档缺 mode 一律按经典恢复；mode:'challenge' 走挑战恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      const autosave = A.createRunAutosave('memory-flip', serialize, {
        every: 3,
        meta: () => ({
          score,
          summary: mode === 'challenge' && chStage ? '挑战 ' + chStage.id + ' · ' + chMismatches + ' 次翻错' : `第 ${level} 关 · ${moves} 次翻牌 · ${score} 分`,
        }),
      });

      function useTool(id) {
        if (state !== 'playing') return false;
        if (id === 'peek') {
          if (tools.peek <= 0 || peekTimer > 0 || previewTimer > 0 || mismatchTimer > 0 || flippedIds.length > 0) {
            A.showToast('请在两张牌都盖好时再看一眼');
            return false;
          }
          tools.peek -= 1;
          hintArmed = false;
          peekTimer = PEEK_DURATION;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('spring');
          A.showToast('再看一眼：1.2 秒');
          autosave.saveNow();
          joyTools.sync();
          return true;
        }
        if (id === 'hint') {
          if (hintArmed) {
            hintArmed = false;
            A.showToast('已取消灵犀提示');
            autosave.saveNow();
            joyTools.sync();
            return true;
          }
          if (tools.hint <= 0 || peekTimer > 0 || previewTimer > 0 || mismatchTimer > 0 || flippedIds.length > 0) {
            A.showToast('请在翻开首张牌前使用灵犀提示');
            return false;
          }
          hintArmed = true;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('ui');
          A.showToast('翻开一张牌，会标出它的伙伴');
          autosave.saveNow();
          joyTools.sync();
          return true;
        }
        return false;
      }

      const joyTools = A.createToolbelt([
        { id: 'peek', icon: '👀', name: '再看一眼', description: '显示未配对牌 1.2 秒', getCount: () => tools.peek, use: () => useTool('peek'), active: () => peekTimer > 0 },
        { id: 'hint', icon: '💡', name: '灵犀提示', description: '翻开首张牌后标出配对牌', getCount: () => tools.hint, use: () => useTool('hint'), active: () => hintArmed },
      ], { isPlaying: () => state === 'playing', keys: ['1', '2'], label: '记忆翻牌道具', placement: 'below' });

      function reveal(card) {
        if (card.matched) return;
        if (previewTimer > 0 || peekTimer > 0 || mismatchTimer > 0 || flippedIds.length >= 2) return;
        if (flippedIds.indexOf(card.id) !== -1) return;
        flippedIds.push(card.id);
        card.pop = 1;
        A.Sfx.play('ui');
        if (flippedIds.length === 1 && hintArmed) {
          const mate = cards.find((c) => c.id !== card.id && !c.matched && c.symbol === card.symbol);
          if (mate && tools.hint > 0) {
            tools.hint -= 1;
            hintArmed = false;
            hintTargetId = mate.id;
            hintTimer = HINT_DURATION;
            A.Sfx.play('bell', 2);
            A.showToast('灵犀已标出配对牌');
            autosave.saveNow();
            joyTools.sync();
          }
        }
        if (flippedIds.length === 2) {
          const a = cards[flippedIds[0]];
          const b = cards[flippedIds[1]];
          moves += 1;
          if (a.symbol === b.symbol) {
            a.matched = true;
            b.matched = true;
            sessionMatches += 1;
            score += 100 + level * 20;
            careerObserve('pair.match', { symbol: a.symbol, level, moves });
            flippedIds = [];
            syncHud();
            A.Sfx.play('perfect');
            if (cards.every((c) => c.matched)) {
              if (mode === 'challenge') {
                challengeClear();
                return;
              }
              levelClearTimer = 1.35;
              state = 'levelclear';
              hintArmed = false;
              joyTools.sync();
              A.Sfx.play('spring');
            }
          } else {
            mismatchTimer = mode === 'challenge' ? 0.7 : Math.max(0.7, 0.95 - (level - 1) * 0.04);
            A.Sfx.play('land');
            if (mode === 'challenge') {
              chMismatches += 1;
              if (chMismatches > chMaxMismatches()) {
                challengeFail('翻错 ' + chMismatches + ' 次，超过本关上限 ' + chMaxMismatches() + ' 次');
                return;
              }
            }
          }
        }
      }

      function skipPreview() {
        if (state !== 'playing' || previewTimer <= 0) return false;
        /* 挑战可能因「每区至少 0.6 秒」延长了总预览，这里必须用实际总时长判断已看够 0.6 秒。 */
        const totalPreview = chPreviewTotal();
        if (totalPreview - previewTimer < PREVIEW_MIN) return false;
        previewTimer = 0;
        A.Sfx.play('ui');
        autosave.saveNow();
        joyTools.sync();
        return true;
      }

      function handleTap(x, y) {
        if (state !== 'playing') return;
        if (previewTimer > 0) {
          skipPreview();
          return;
        }
        for (const card of cards) {
          const rect = cardRect(card);
          if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) {
            reveal(card);
            return;
          }
        }
      }

      function updateChallenge(dt) {
        for (const card of cards) card.pop = Math.max(0, card.pop - dt * 4);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chElapsed += dt;
        chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
        if (previewTimer > 0) {
          previewTimer = Math.max(0, previewTimer - dt);
          syncChallengePreviewLabel();
        }
        if (mismatchTimer > 0) {
          mismatchTimer -= dt;
          if (mismatchTimer <= 0) {
            flippedIds = [];
            mismatchTimer = 0;
          }
        }
        /* 挑战模式必须按 dt 推进「再看一眼 / 灵犀」计时：到期后牌面恢复盖好、可以继续翻牌，
           暂停（loop 暂停、state 非 playing）时与经典一致不推进。 */
        if (peekTimer > 0) {
          peekTimer = Math.max(0, peekTimer - dt);
          if (peekTimer === 0) joyTools.sync();
        }
        if (hintTimer > 0) {
          hintTimer = Math.max(0, hintTimer - dt);
          if (hintTimer === 0) {
            hintTargetId = -1;
            joyTools.sync();
          }
        }
        if (input.pointer.wentDown) handleTap(input.pointer.x, input.pointer.y);
        syncChallengeHud();
        input.endFrame();
      }

      function update(dt) {
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        for (const card of cards) card.pop = Math.max(0, card.pop - dt * 4);
        if (peekTimer > 0) {
          peekTimer = Math.max(0, peekTimer - dt);
          if (peekTimer === 0) joyTools.sync();
        }
        if (hintTimer > 0) {
          hintTimer = Math.max(0, hintTimer - dt);
          if (hintTimer === 0) {
            hintTargetId = -1;
            joyTools.sync();
          }
        }
        if (state === 'levelclear') {
          levelClearTimer -= dt;
          if (levelClearTimer <= 0) {
            if (level >= LEVELS.length) {
              finish(true);
            } else {
              level += 1;
              score += 100;
              buildLevel(level);
              state = 'playing';
              joyTools.sync();
              autosave.saveNow();
              syncHud();
            }
          }
          input.endFrame();
          return;
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        elapsed += dt;
        if (previewTimer > 0) previewTimer = Math.max(0, previewTimer - dt);
        if (mismatchTimer > 0) {
          mismatchTimer -= dt;
          if (mismatchTimer <= 0) {
            flippedIds = [];
            mismatchTimer = 0;
          }
        }
        if (input.pointer.wentDown) handleTap(input.pointer.x, input.pointer.y);
        input.endFrame();
      }

      /* 牌面是否朝上：暂停 / 弹层可见时未配对牌一律按背面绘制，和暂停文案「牌面已盖好」一致。 */
      function cardFaceVisible(card) {
        if (card.matched) return true;
        if (state === 'paused' || ui.visible) return false;
        const previewVisible = mode === 'challenge' ? chPreviewReveal(card) : previewTimer > 0;
        return previewVisible || peekTimer > 0 || flippedIds.indexOf(card.id) !== -1 || state === 'levelclear';
      }

      function drawCard(card) {
        const rect = cardRect(card);
        const revealed = cardFaceVisible(card);
        const pop = A.reducedMotion ? 1 : 1 + card.pop * 0.06;
        ctx.save();
        ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2);
        ctx.scale(pop, pop);
        ctx.translate(-rect.w / 2, -rect.h / 2);
        A.draw.roundRect(ctx, 0, 0, rect.w, rect.h, Math.min(12, rect.w * 0.16));
        if (revealed) {
          ctx.fillStyle = card.matched ? 'rgba(90,209,160,0.2)' : '#f3f6ff';
          ctx.fill();
          ctx.strokeStyle = card.matched ? '#5ad1a0' : '#b9c8ec';
          ctx.lineWidth = 2;
          ctx.stroke();
          A.draw.label(ctx, card.symbol, rect.w / 2, rect.h / 2 + 1, {
            font: `${Math.floor(Math.min(rect.w, rect.h) * 0.46)}px system-ui, sans-serif`,
            color: '#1a2140',
          });
        } else {
          const g = ctx.createLinearGradient(0, 0, rect.w, rect.h);
          g.addColorStop(0, '#253566');
          g.addColorStop(1, '#182448');
          ctx.fillStyle = g;
          ctx.fill();
          ctx.strokeStyle = '#3f5188';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = 'rgba(90,209,160,0.5)';
          ctx.font = `${Math.floor(Math.min(rect.w, rect.h) * 0.3)}px system-ui`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('?', rect.w / 2, rect.h / 2 + 1);
        }
        if (card.id === hintTargetId && hintTimer > 0 && !card.matched) {
          A.draw.roundRect(ctx, 1, 1, rect.w - 2, rect.h - 2, Math.min(12, rect.w * 0.16));
          ctx.strokeStyle = '#ffd23f';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0b1328');
        bg.addColorStop(1, '#12213d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 40; i++) {
          const x = ((i * 97) % W);
          const y = ((i * 53) % H);
          ctx.fillStyle = i % 3 === 0 ? 'rgba(90,209,160,0.35)' : 'rgba(147,160,200,0.22)';
          ctx.fillRect(x, y, 2, 2);
        }

        if (mode === 'challenge' && chStage) {
          const chLabel = 'C' + String(chStage.stageNumber || 0).padStart(2, '0') + ' ' + chStage.title;
          const matchedPairs = cards.filter((card) => card.matched).length / 2;
          A.draw.label(ctx, chLabel, 12, 24, { align: 'left', font: 'bold 14px system-ui', color: '#5ad1a0' });
          A.draw.label(ctx, '用时 ' + fmtTime(chElapsed), W - 12, 24, { align: 'right', font: 'bold 14px system-ui', color: '#ffd23f' });
          A.draw.label(ctx, '翻错 ' + chMismatches + '/' + chMaxMismatches() + ' · 配对 ' + matchedPairs + '/' + cards.length / 2, W / 2, 52, {
            font: '12px system-ui',
            color: '#93a0c8',
          });
          if (previewTimer > 0) {
            A.draw.label(ctx, '记住牌面 ' + previewTimer.toFixed(1) + 's · 点击可跳过', W / 2, 84, {
              font: 'bold 15px system-ui',
              color: '#ffd23f',
            });
          } else if (mismatchTimer > 0) {
            A.draw.label(ctx, '不匹配，再看一眼…', W / 2, 84, { font: '13px system-ui', color: '#ff9a9a' });
          } else {
            A.draw.label(ctx, chStage.goalStatement || '点开两张相同的牌', W / 2, 84, { font: '13px system-ui', color: '#93a0c8' });
          }
        } else {
          A.draw.label(ctx, 'LEVEL ' + level + ' / ' + LEVELS.length, 12, 24, {
            align: 'left',
            font: 'bold 14px system-ui',
            color: '#5ad1a0',
          });
          A.draw.label(ctx, 'SCORE ' + score, W - 12, 24, { align: 'right', font: 'bold 14px system-ui', color: '#ffd23f' });
          A.draw.label(ctx, '翻牌 ' + moves + ' · ' + fmtTime(elapsed), W / 2, 52, {
            font: '12px system-ui',
            color: '#93a0c8',
          });
          if (previewTimer > 0) {
            A.draw.label(ctx, '记住牌面 ' + previewTimer.toFixed(1) + 's · 点击可跳过', W / 2, 84, {
              font: 'bold 15px system-ui',
              color: '#ffd23f',
            });
          } else if (mismatchTimer > 0) {
            A.draw.label(ctx, '不匹配，再看一眼…', W / 2, 84, { font: '13px system-ui', color: '#ff9a9a' });
          } else {
            A.draw.label(ctx, '点开两张相同的牌', W / 2, 84, { font: '13px system-ui', color: '#93a0c8' });
          }
        }

        cards.forEach(drawCard);

        if (mode !== 'challenge' && state === 'levelclear') {
          A.draw.label(ctx, '第 ' + level + ' 关完成', W / 2, 654, {
            font: 'bold 22px system-ui',
            color: '#5ad1a0',
          });
        }
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      syncChallengePanel();
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              level,
              totalLevels: LEVELS.length,
              cards: cards.length,
              previewTimer,
              score,
              moves,
              cardList: cards.map((c) => ({ id: c.id, symbol: c.symbol, matched: c.matched })),
            };
          },
          joyInfo() {
            return {
              tools: { peek: tools.peek, hint: tools.hint },
              peekTimer,
              hintArmed,
              hintTargetId,
              hintTimer,
              previewTimer,
              flippedIds: flippedIds.slice(),
              state,
            };
          },
          useJoyTool(id) {
            const button = joyTools.buttons[id];
            if (!button) return false;
            button.click();
            return true;
          },
          revealById(id) {
            const card = cards[Number(id)];
            if (!card) return false;
            reveal(card);
            return true;
          },
          skipPreviewNow() {
            return skipPreview();
          },
          setLevel(value) {
            level = clamp(Number(value) || 1, 1, LEVELS.length);
            buildLevel(level);
            state = 'playing';
            ui.hide();
            joyTools.sync();
            syncHud();
            return true;
          },
          /* ---------- 0.9 挑战模式钩子（契约见 docs/arcade/0.9/INTEGRATION-CONTRACT.md §5） ---------- */
          challengeStages() {
            return challengeData.map((stage) => {
              const best = A.Challenge.progress(gameId).best[stage.id] || null;
              return {
                id: stage.id,
                stageNumber: stage.stageNumber,
                title: stage.title,
                unlocked: A.Challenge.isUnlocked(gameId, stage.id),
                best: best ? { timeSec: best.timeSec, assisted: !!best.assisted } : null,
              };
            });
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              stageIndex: chStageIndex,
              state,
              elapsedSec: Math.round(chElapsed * 10) / 10,
              objective: chStage ? chStage.goalStatement : null,
              cleared: !!chLastResult,
              collectibles: [],
              assisted: chAssisted,
              mismatches: chMismatches,
              maxMismatches: chMaxMismatches(),
              pairsMatched: cards.filter((card) => card.matched).length / 2,
              pairsTotal: cards.length / 2,
              previewTimer,
              previewPlan: chPreviewPlan
                ? { mode: chPreviewPlan.mode, regionCount: chPreviewPlan.regionCount, total: chPreviewPlan.total, per: chPreviewPlan.per }
                : null,
              tools: { peek: tools.peek, hint: tools.hint },
              peekTimer,
              hintArmed,
              hintTargetId,
              hintTimer,
              errorReason: chErrorReason,
            };
          },
          stageObservable() {
            return challengeObservable();
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing' || !chStage) return false;
            if (assisted === true) chAssisted = true;
            return challengeClear();
          },
          forceStageFail(reason) {
            return challengeFail(typeof reason === 'string' && reason ? reason : '测试强制失败');
          },
          exitChallenge() {
            return exitChallengeToStart();
          },
          /* ---------- 确定性回归：覆盖 0.9 修复（同步执行、不依赖真实计时/异步等待） ---------- */
          regression() {
            const details = [];
            let pass = 0;
            let fail = 0;
            const check = (ok, name, extra) => {
              if (ok) {
                pass += 1;
                details.push('PASS ' + name);
              } else {
                fail += 1;
                details.push('FAIL ' + name + (extra ? ' — ' + extra : ''));
              }
            };
            const keys = [
              'studiokit:arcade:progress:v1',
              'studiokit:arcade:runs:v1',
              'studiokit:arcade:playtime:v1',
              'studiokit:arcade:scores:v1',
              'studiokit:arcade:challenge:v1',
            ];
            const snap = {};
            keys.forEach((key) => {
              try {
                snap[key] = localStorage.getItem(key);
              } catch (err) {
                snap[key] = null;
              }
            });
            const advanceChallenge = (seconds) => {
              const frames = Math.max(1, Math.ceil(seconds / (1 / 60)));
              for (let i = 0; i < frames; i++) updateChallenge(1 / 60);
            };
            try {
              if (!challengeAvailable || !challengeData.length) {
                check(false, '挑战数据可用（6 关）');
              } else {
                /* A. 挑战 peek 按 dt 递减，到期后恢复可翻牌（缺陷 1）。 */
                startChallenge(challengeData[0].id);
                advanceChallenge(0.7);
                check(skipPreview(), '挑战预览可跳过');
                const peekUsed = useTool('peek');
                check(
                  peekUsed && peekTimer > 0 && tools.peek === TOOL_START.peek - 1,
                  '挑战使用再看一眼扣次数并开始计时',
                  JSON.stringify({ used: peekUsed, peekTimer: peekTimer, peek: tools.peek })
                );
                state = 'paused';
                const pausedPeek = peekTimer;
                advanceChallenge(0.5);
                check(peekTimer === pausedPeek, '挑战暂停时不推进 peek 计时', 'peekTimer=' + peekTimer);
                state = 'playing';
                advanceChallenge(PEEK_DURATION + 0.3);
                check(peekTimer === 0, '挑战 peek 计时按 dt 递减到 0', 'peekTimer=' + peekTimer);
                const firstId = cards.findIndex((card) => !card.matched && flippedIds.indexOf(card.id) === -1);
                if (firstId < 0) {
                  check(false, '挑战存在可翻的未配对牌');
                } else {
                  reveal(cards[firstId]);
                  check(flippedIds.length === 1, 'peek 结束后可以继续翻牌', JSON.stringify({ flippedIds: flippedIds.slice() }));
                  const mate = cards.filter((card) => card.id !== firstId && !card.matched && card.symbol === cards[firstId].symbol)[0];
                  if (mate) reveal(mate);
                  check(!!mate && cards[firstId].matched && mate.matched, 'peek 结束后可以继续配对');
                }
                /* B. 刷新恢复工具次数 / hintArmed / 灵犀标记 / peekTimer（缺陷 2）。 */
                startChallenge(challengeData[0].id);
                advanceChallenge(0.7);
                skipPreview();
                useTool('hint');
                const hintToolsBefore = tools.hint;
                const snapHint = JSON.parse(JSON.stringify(serialize()));
                restore(JSON.parse(JSON.stringify(snapHint)));
                check(
                  hintArmed === true && tools.hint === hintToolsBefore && hintToolsBefore === TOOL_START.hint,
                  '刷新恢复灵犀待命与次数',
                  JSON.stringify({ hintArmed: hintArmed, hint: tools.hint })
                );
                const hintTargetCard = cards.filter((card) => !card.matched)[0];
                if (hintTargetCard) {
                  reveal(hintTargetCard);
                  const snapTarget = JSON.parse(JSON.stringify(serialize()));
                  restore(JSON.parse(JSON.stringify(snapTarget)));
                  check(
                    hintTimer > 0 && hintTargetId >= 0 && !!cards[hintTargetId] && !cards[hintTargetId].matched,
                    '刷新恢复灵犀标记与倒计时',
                    JSON.stringify({ hintTimer: hintTimer, hintTargetId: hintTargetId })
                  );
                } else {
                  check(false, '存在未配对牌用于灵犀恢复');
                }
                restore(JSON.parse(JSON.stringify(snapHint)));
                useTool('peek');
                const peekToolsBefore = tools.peek;
                const snapPeek = JSON.parse(JSON.stringify(serialize()));
                restore(JSON.parse(JSON.stringify(snapPeek)));
                check(
                  peekTimer > 0 && tools.peek === peekToolsBefore && peekToolsBefore === TOOL_START.peek - 2,
                  '刷新恢复再看一眼计时与次数',
                  JSON.stringify({ peekTimer: peekTimer, peek: tools.peek })
                );
                /* C. 分区预览按区域均分实际时长，末区至少 0.6 秒（缺陷 3）。 */
                const stageC05 = challengeData.filter((stage) => stage.stageNumber === 5)[0];
                const stageC03 = challengeData.filter((stage) => stage.stageNumber === 3)[0];
                if (stageC05) {
                  mode = 'challenge';
                  chStage = stageC05;
                  chStageIndex = chStageIndexFor(stageC05);
                  chElapsed = 0;
                  state = 'playing';
                  buildChallengeBoard(stageC05);
                  const plan = chPreviewPlan;
                  const halfR = Math.ceil(stageC05.content.grid.rows / 2);
                  const halfC = Math.ceil(stageC05.content.grid.cols / 2);
                  const lastQuadrantCard = cards.filter((card) => card.r >= halfR && card.c >= halfC)[0];
                  previewTimer = plan.per * 0.2;
                  check(
                    plan.regionCount === 4 && plan.per >= PREVIEW_MIN - 1e-9 && chPreviewReveal(lastQuadrantCard) === true,
                    'C05 象限均分且末象限有曝光',
                    JSON.stringify({ regionCount: plan.regionCount, total: plan.total, per: plan.per })
                  );
                } else {
                  check(false, 'C05 关卡数据存在');
                }
                if (stageC03) {
                  mode = 'challenge';
                  chStage = stageC03;
                  chStageIndex = chStageIndexFor(stageC03);
                  chElapsed = 0;
                  state = 'playing';
                  buildChallengeBoard(stageC03);
                  const plan = chPreviewPlan;
                  const lastRowCard = cards.filter((card) => card.r === stageC03.content.grid.rows - 1)[0];
                  previewTimer = plan.per * 0.2;
                  check(
                    plan.regionCount === 3 && plan.per >= PREVIEW_MIN - 1e-9 && chPreviewReveal(lastRowCard) === true,
                    'C03 逐行均分且末行有曝光',
                    JSON.stringify({ regionCount: plan.regionCount, total: plan.total, per: plan.per })
                  );
                } else {
                  check(false, 'C03 关卡数据存在');
                }
                const syntheticStage = {
                  content: {
                    grid: { rows: 2, cols: 2 },
                    faces: [['A', 'A'], ['B', 'B']],
                    previewSeconds: 0.5,
                    clues: { previewMode: 'row-by-row' },
                  },
                };
                buildChallengeBoard(syntheticStage);
                check(
                  chPreviewPlan.total >= 1.2 - 1e-9 && previewTimer >= 1.2 - 1e-9,
                  '均分不足 0.6s 时延长总预览',
                  JSON.stringify({ total: chPreviewPlan.total, per: chPreviewPlan.per })
                );
                /* D. 暂停时未配对牌按背面绘制（缺陷 4）。 */
                mode = 'classic';
                chStage = null;
                reset();
                state = 'playing';
                ui.hide();
                previewTimer = 0;
                peekTimer = 0;
                flippedIds = [cards[0].id];
                const facePlaying = cardFaceVisible(cards[0]);
                state = 'paused';
                const facePaused = cardFaceVisible(cards[0]);
                state = 'playing';
                ui.show({ title: '回归弹层', text: '' });
                const faceOverlay = cardFaceVisible(cards[0]);
                ui.hide();
                check(
                  facePlaying === true && facePaused === false && faceOverlay === false,
                  '暂停/弹层可见时未配对牌按背面绘制',
                  JSON.stringify({ playing: facePlaying, paused: facePaused, overlay: faceOverlay })
                );
              }
            } catch (err) {
              check(false, 'regression 执行未抛异常', String(err && err.message ? err.message : err));
            } finally {
              try {
                autosave.clear();
                mode = 'classic';
                chStage = null;
                chStageIndex = -1;
                chPreviewPlan = null;
                reset();
                state = 'ready';
                if (chDom.hud) chDom.hud.hidden = true;
                if (gameHudEl) gameHudEl.hidden = false;
                showStart();
                pauseUi.sync();
                joyTools.sync();
              } catch (err) {
                /* 清理失败不掩盖断言结果 */
              }
              keys.forEach((key) => {
                try {
                  if (snap[key] === null) localStorage.removeItem(key);
                  else localStorage.setItem(key, snap[key]);
                } catch (err) {
                  /* 忽略存储不可用 */
                }
              });
            }
            return { pass: pass, fail: fail, details: details };
          },
        };
        /* 0.17 职业委托只读钩子：只在 ?careerTest=1 追加；生产 URL 与既有 #test 探针不变。 */
        if (/(?:^|[?&])careerTest=1(?:&|$)/.test(String((window.location && window.location.search) || ''))) {
          window.__arcadeTest.careerInfo = function () {
            const run = readCareerRun();
            const goal = careerGoalParts();
            const goalEl = document.querySelector('[data-career-goal]');
            let runSave = null;
            try {
              runSave = A.RunSave.get('memory-flip');
            } catch (err) {
              runSave = null;
            }
            return {
              isCommission: !!run,
              locked: careerLocked,
              settled: careerSettled
                ? {
                  pending: careerSettled.pending === true,
                  ok: careerSettled.ok === true,
                  reason: careerSettled.reason || null,
                  credits: Number(careerSettled.credits) || 0,
                  duplicate: careerSettled.duplicate === true,
                }
                : null,
              commissionId: run ? run.commissionId : (careerGoalSource ? careerGoalSource.commissionId : null),
              objectiveKind: goal ? goal.kind : null,
              atLeast: goal ? goal.atLeast : null,
              objective: goal ? [goal.title, goal.summary].filter(Boolean).join(' · ') : null,
              matches: sessionMatches,
              level,
              mode,
              state,
              serializeNull: serialize() === null,
              runSave: runSave,
              goalLineVisible: !!goalEl && goalEl.getClientRects().length > 0,
              goalLineHeight: goalEl ? Math.round(goalEl.getBoundingClientRect().height) : 0,
              challengeEntryHidden: !dom.ovBtn2 || dom.ovBtn2.hidden === true,
              careerChrome: document.body.classList.contains('is-career-run'),
            };
          };
          /* 仅测试：等价于暂停弹层里的「结束本局」，走同一条 finish(false) 真实结算路径。 */
          window.__arcadeTest.endCommissionSession = function () {
            return endCareerSession();
          };
        }
      }

      /* 开局弹层（0.16 行为逐字保留）：只有这条经典路径会读旧 RunSave。 */
      function prepareStartScreen() {
        const saved = autosave.load();
        if (saved) {
          A.showResumePrompt(ui, saved, {
            name: '记忆翻牌',
            onResume: () => {
              if (restore(saved.data)) {
                state = 'playing';
                ui.hide();
                loop.resume();
                pauseUi.sync();
                joyTools.sync();
                autosave.saveNow();
              } else {
                autosave.clear();
                showStart();
              }
            },
            onRestart: () => {
              autosave.clear();
              showStart();
            },
          });
        } else {
          showStart();
        }
      }

      /* 0.17 职业入口：URL 带 ?career=<ticketId> 时先等桥确认 ticket，再决定
         「职业开局弹层」还是经典开局；无参数时同步走 0.16 路径（零延迟、零行为变化）。 */
      function bootStartScreen() {
        const ticketId = careerTicketParam();
        const ready = career && career.ready;
        if (!ticketId || !career || !ready || typeof ready.then !== 'function') {
          prepareStartScreen();
          return;
        }
        let settled = false;
        let guard = null;
        const finishBoot = () => {
          if (settled) return;
          settled = true;
          try {
            if (guard) clearTimeout(guard);
          } catch (err) {
            /* ignore */
          }
          /* 只有桥确认了属于本游戏的 run 才锁死经典记录；否则按 0.16 经典启动（fail-open）。 */
          const runInfo = readCareerRun();
          if (runInfo) activateCareerRun(runInfo);
          prepareStartScreen();
        };
        try {
          guard = setTimeout(finishBoot, 3500);
        } catch (err) {
          guard = null;
        }
        Promise.resolve(ready).then(finishBoot, finishBoot);
        /* 极端慢启动兜底：若 3.5s 计时器已按经典开局、桥随后才确认职业 run，
           立刻切回职业开局（清掉这段时间可能写下的经典局内档，不产生任何经典记录）。 */
        try {
          setTimeout(() => {
            if (careerLocked) return;
            const late = readCareerRun();
            if (!late) return;
            try {
              A.RunSave.clear('memory-flip');
            } catch (err) {
              /* ignore */
            }
            activateCareerRun(late);
            showStart();
          }, 1500);
        } catch (err) {
          /* ignore */
        }
      }
      bootStartScreen();
      loop.start();
    })();
  </script>
</body>
</html>
