<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="影跃：忍者无尽上跳平台游戏，平台落点保证可达，越往高处越容易出现移动与易碎平台，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/shadow-leap.js"></script>
  <title>影跃 · 街机厅 · StudioKit</title>
  <style>
    /* 0.9 挑战选关面板：放在 .stage-wrap 内紧邻 .stage-box（合同允许），
       这样窄屏下不局限在画布宽度内，标题/最佳成绩可读。 */
    .stage-wrap { position: relative; }
    .stage-wrap > .ac-challenge-panel[data-ch-panel] {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: min(520px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 18px 12px calc(18px + env(safe-area-inset-bottom));
      border-radius: 16px;
      background: rgba(9, 13, 28, 0.96);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stage-wrap > .ac-challenge-panel[data-ch-panel][hidden] { display: none; }
    .stage-wrap > .ac-challenge-panel[data-ch-panel] .ac-challenge-tip { margin: 2px 0 0; }
    .stage-wrap > .ac-challenge-panel[data-ch-panel] [data-ch-back] {
      width: 100%;
      min-height: 44px;
      margin: 2px 0 0;
    }
  </style>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#e0567f; --card-accent:#e0567f">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🥷 影跃</h1>
      <div class="game-hud">
        <span data-hud-height>高度 <strong data-hud-score>0</strong>m</span>
        <span data-hud-high-wrap>最高 <strong data-hud-high>0</strong>m</span>
        <span class="ac-challenge-hud" data-ch-hud hidden></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="影跃游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>影跃</h2>
            <p data-ov-text>忍者无尽上跳</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
      </div>
      <div class="ac-challenge-panel" data-ch-panel hidden role="region" aria-label="挑战 6 关"></div>
    </div>
    <div class="touch-pad game-tools has-air-dash" aria-label="影冲与可选道具（影冲 Shift / J，道具 1 / 2）">
      <button type="button" class="touch-btn" data-joy-tool="feather" aria-label="羽落，剩余 2 次（快捷键 1）"><span aria-hidden="true">🪶</span> 羽落 <strong data-joy-count>2</strong></button>
      <button type="button" class="touch-btn" data-joy-tool="boost" aria-label="月弹，剩余 2 次（快捷键 2）"><span aria-hidden="true">🌙</span> 月弹 <strong data-joy-count>2</strong></button>
      <button type="button" class="touch-btn touch-btn-air" data-air-dash aria-label="影冲：本跳可用 1 次（Shift / J 或点按）"><span aria-hidden="true">💨</span> 影冲 <strong data-air-dash-count>1</strong></button>
    </div>
    <p class="game-hint">←→ / A D 或触摸左右半屏移动 · Shift / J 或点 💨 影冲（着陆补充） · 1 羽落 / 2 月弹 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const PLAYER_W = 26;
      const PLAYER_H = 30;
      const GRAVITY = 1500;
      const JUMP_V = -640;
      const MAX_FALL = 900;
      const FEATHER_DURATION = 5;
      const FEATHER_GRAVITY = 0.35;
      const FEATHER_MAX_FALL = 360;
      const BOOST_JUMP_V = -768;
      const JOY_START = { feather: 2, boost: 2 };
      const JOY_CAPS = { feather: 2, boost: 2 };
      /* GP004 影冲：空中沿朝向的一次短距离水平冲刺；每次成功着陆补充一次。 */
      const DASH_SPEED = 620;
      const DASH_TIME = 0.13;
      const DASH_GRAVITY_SCALE = 0.25;
      const DASH_LAND_KEEP = 0.6;
      const DASH_CARRY_TIME = 0.1;
      const DASH_MAX_CHARGES = 1;

      /* ----------
       * 0.9 挑战模式（数据源 ../challenge/shadow-leap.js，经 A.Challenge.stages 读取）
       * - 世界坐标：height=0 为起始平台（mainRoute 第一块）台面，向上为正；platform.worldY = CH_START_WORLD_Y - height。
       * - 设计 xCenter + width → 引擎平台左上角 x = xCenter - width/2；影门为圆（xCenter,height,radius）。
       * - 保留 0.8 的影冲/自动起跳/单向平台/卷轴/双路线/失败复盘/局内存档语义。
       * ---------- */
      const CHALLENGE_GAME_ID = 'shadow-leap';
      const CHALLENGE_STAGE_COUNT = 6;
      const CH_START_WORLD_Y = 620;
      const CH_SCROLL_W = 18;
      const CH_SCROLL_H = 22;
      const CH_SCROLL_LIFT = 46;
      const CH_GOAL_RADIUS_FALLBACK = 38;
      const CH_TIP_SECONDS = 3;
      const CH_OPTIONAL_TAG = '（可选）';
      const CLASSIC_HINT = '←→ / A D 或触摸左右半屏移动 · Shift / J 或点 💨 影冲（着陆补充） · 1 羽落 / 2 月弹 · P / Esc 暂停';
      const CHALLENGE_HINT = '←→ / A D 或触摸移动 · Shift / J 影冲（着陆补充） · 金色卷轴可选收集 · 抵达影门过关 · P / Esc 暂停';
      /* GP006 失败复盘按 stageRule 给可归因提示（不改关卡数据）。 */
      const CH_FAIL_HINTS = {
        'side-scroll': '主路不强制影冲：先把落点对准下一块平台，再决定是否加速。',
        gap: '大缺口要先起跳、空中朝缺口方向点一次影冲（落地补充）；不冲会掉进月蚀裂隙。',
        wind: '风区会把角色往左推：提前向右修方向，或借风滑过。',
        fork: '两条路线都能到影门；换一条更宽的平台线往往更稳。',
        'two-switch': '影门需要两座半月雕像都点亮：先踩左/右开关台，再回中央平台调整。',
      };
      const CH_FAIL_SCROLL_NOTE = '卷轴是可选的，不影响通关与解锁。';
      const CH_GOAL_LOCKED_TEXT = '影门未开启：还需触碰 {n} 座半月雕像。';

      const CH_DATA = (() => {
        try {
          return A.Challenge && typeof A.Challenge.stages === 'function' ? A.Challenge.stages(CHALLENGE_GAME_ID) : [];
        } catch (err) {
          return [];
        }
      })();
      const CH_DATA_AVAILABLE = CH_DATA.length === CHALLENGE_STAGE_COUNT;

      function chPad2(v) {
        return (v < 10 ? '0' : '') + v;
      }

      /* 平台路线标注：把所有路线经过的平台反标 routes；两条路线都经过的平台视为共享。 */
      function chTagRoutes(def) {
        def.platforms.forEach((p) => {
          p.routes = [];
        });
        def.routes.forEach((route) => {
          route.platforms.forEach((idx) => {
            const p = def.platforms[idx];
            if (p && p.routes.indexOf(route.id) === -1) p.routes.push(route.id);
          });
        });
      }

      /* 双路线关的分流提示：找出两条路线第一次分开的平台，按左右位置给出“左·X / 右·Y”。 */
      function chBuildRouteHint(def) {
        const routes = def.routes || [];
        if (routes.length < 2) return '';
        const a = routes[0].platforms;
        const b = routes[1].platforms;
        if (a.length < 2 || b.length < 2) return routes.map((r) => r.label).join(' / ');
        let k = 0;
        while (k < a.length && k < b.length && a[k] === b[k]) k += 1;
        if (k >= a.length || k >= b.length) return routes.map((r) => r.label).join(' / ');
        const pa = def.platforms[a[k]];
        const pb = def.platforms[b[k]];
        if (!pa || !pb) return routes.map((r) => r.label).join(' / ');
        const leftFirst = pa.x + pa.w / 2 <= pb.x + pb.w / 2;
        const left = leftFirst ? routes[0].label : routes[1].label;
        const right = leftFirst ? routes[1].label : routes[0].label;
        return '左·' + left + ' / 右·' + right;
      }

      /* 设计数据（xCenter + height，height 相对起始台向上为正）→ 引擎世界坐标（x 左上、y 台面 top）。 */
      function chNormalizeStage(stage, index) {
        const content = stage && stage.content && typeof stage.content === 'object' ? stage.content : {};
        const rawPlatforms = Array.isArray(content.platforms) ? content.platforms : [];
        const platforms = rawPlatforms.map((p, pi) => {
          const kind = p && p.kind === 'moving' ? 'moving' : p && p.kind === 'fragile' ? 'fragile' : 'normal';
          const w = clamp(Number(p && p.width) || 100, 40, W - 8);
          const x = clamp(Number(p && p.xCenter) - w / 2, -40, W - w + 40);
          const y = CH_START_WORLD_Y - (Number(p && p.height) || 0);
          const period = Number(p && p.periodSec) || 0;
          return {
            id: String((p && p.id) || 'p' + pi),
            index: pi,
            x,
            y,
            w,
            h: 12,
            kind,
            baseX: x,
            range: kind === 'moving' ? clamp(Number(p && p.amplitude) || 0, 0, 30) : 0,
            speed: kind === 'moving' ? (period > 0 ? TAU / period : 2.1) : 0,
            phase: kind === 'moving' && Number.isFinite(Number(p && p.phase)) ? Number(p.phase) : 0,
            breakDelay: clamp(Number(p && p.breakDelaySec) || 0.65, 0.2, 3),
            broken: false,
            breakTimer: 0,
            crackTimer: -1,
            routes: [],
          };
        });
        if (!platforms.length) return null;
        const byId = Object.create(null);
        platforms.forEach((p) => {
          byId[p.id] = p;
        });
        const mainRouteIds = (Array.isArray(content.mainRoute) ? content.mainRoute : [])
          .map((id) => String(id))
          .filter((id) => byId[id]);
        if (!mainRouteIds.length) mainRouteIds.push(platforms[0].id);
        const alternativeIds = (Array.isArray(content.alternativeRoute) ? content.alternativeRoute : [])
          .map((id) => String(id))
          .filter((id, i, list) => byId[id] && list.indexOf(id) === i);
        const routes = [
          { id: 'main', label: '主路线', platforms: mainRouteIds.map((id) => byId[id].index) },
          { id: 'alt', label: '备选路线', platforms: alternativeIds.map((id) => byId[id].index) },
        ].filter((route) => route.platforms.length >= 2);
        const spawnRaw = content.playerSpawn && typeof content.playerSpawn === 'object' ? content.playerSpawn : {};
        const spawnPlatform = byId[String(spawnRaw.platformId || '')] || byId[mainRouteIds[0]];
        const spawnOffsetX = clamp(Number(spawnRaw.offsetX) || 0, -spawnPlatform.w / 2, spawnPlatform.w / 2);
        const goalRaw = content.goal && typeof content.goal === 'object' ? content.goal : {};
        const goal = {
          cx: clamp(Number(goalRaw.xCenter) || spawnPlatform.x + spawnPlatform.w / 2, 0, W),
          cy: CH_START_WORLD_Y - (Number(goalRaw.height) || 0),
          r: clamp(Number(goalRaw.radius) || CH_GOAL_RADIUS_FALLBACK, 12, 80),
          unlock: typeof goalRaw.unlock === 'string' ? goalRaw.unlock : null,
        };
        const switches = (Array.isArray(content.switches) ? content.switches : [])
          .map((s) => {
            const plat = s && byId[String(s.platformId)];
            return plat
              ? { platformId: plat.id, index: plat.index, persistentWithinAttempt: !!(s && s.persistentWithinAttempt) }
              : null;
          })
          .filter(Boolean);
        const collectibles = (Array.isArray(content.collectibles) ? content.collectibles : [])
          .map((c, ci) => {
            const plat = c && byId[String(c.platformId)];
            if (!plat) return null;
            return {
              id: String((c && c.id) || 'scroll-' + ci),
              platformId: plat.id,
              x: plat.x + plat.w / 2,
              y: plat.y - CH_SCROLL_LIFT,
              optional: !c || c.optional !== false,
              label: '残卷',
            };
          })
          .filter(Boolean);
        const winds = (Array.isArray(content.winds) ? content.winds : [])
          .map((w) => ({
            heightFrom: Number(w && w.heightFrom) || 0,
            heightTo: Number(w && w.heightTo) || 0,
            forceX: Number(w && w.forceX) || 0,
          }))
          .filter((w) => w.forceX !== 0 && w.heightTo > w.heightFrom);
        const def = {
          index,
          raw: stage,
          id: String(stage.id || 'shadow-leap-C' + chPad2(index + 1)),
          stageNumber: clamp(Math.floor(Number(stage.stageNumber) || index + 1), 1, CHALLENGE_STAGE_COUNT),
          title: String(stage.title || '挑战关卡'),
          difficulty: clamp(Math.floor(Number(stage.difficulty) || index + 1), 1, 9),
          goalStatement: String(stage.goalStatement || '抵达影门'),
          decision: String(stage.decision || ''),
          practicedSkill: String(stage.practicedSkill || ''),
          discovery: String(stage.discovery || ''),
          requiredAbility: typeof content.requiredAbility === 'string' ? content.requiredAbility : 'none',
          stageRule: typeof content.stageRule === 'string' ? content.stageRule : 'side-scroll',
          deathPolicy: String(content.deathPolicy || ''),
          platforms,
          byId,
          routes,
          mainRoute: mainRouteIds,
          alternativeRoute: alternativeIds,
          spawn: {
            x: clamp(spawnPlatform.x + spawnPlatform.w / 2 - PLAYER_W / 2 + spawnOffsetX, -PLAYER_W / 2, W - PLAYER_W / 2),
            y: spawnPlatform.y - PLAYER_H,
            platformId: spawnPlatform.id,
          },
          spawnPlatform,
          goal,
          switches,
          switchSet: Object.create(null),
          collectibles,
          winds,
          worldBottom: CH_START_WORLD_Y + 160,
        };
        def.worldTop = Math.min(goal.cy, ...platforms.map((p) => p.y)) - 120;
        switches.forEach((s) => {
          def.switchSet[s.platformId] = true;
        });
        chTagRoutes(def);
        def.routeHint = chBuildRouteHint(def);
        return def;
      }

      const STAGES = CH_DATA.map((stage, index) => chNormalizeStage(stage, index)).filter((def) => def && def.platforms.length);


      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        hudHeight: document.querySelector('[data-hud-height]'),
        hudHighWrap: document.querySelector('[data-hud-high-wrap]'),
        chHud: document.querySelector('[data-ch-hud]'),
        chPanel: document.querySelector('[data-ch-panel]'),
        hint: document.querySelector('.game-hint'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);
      const joyButtons = {
        feather: document.querySelector('[data-joy-tool="feather"]'),
        boost: document.querySelector('[data-joy-tool="boost"]'),
      };
      const dashButton = document.querySelector('[data-air-dash]');
      const dashCount = document.querySelector('[data-air-dash-count]');

      const particles = A.createParticles();

      const player = { x: W / 2 - 13, y: H - 120, w: PLAYER_W, h: PLAYER_H, vx: 0, vy: 0, face: 1, prevBottom: 0, jumpTimer: 0 };
      let platforms = [];
      let camY = 0;
      let topY = 0;
      let startY = 0;
      let state = 'ready';
      let recordSaved = false;
      let score = 0;
      let hintTimer = 0;
      let landingHint = '';
      let generatedCount = 0;
      const tools = { feather: JOY_START.feather, boost: JOY_START.boost };
      let featherTimer = 0;
      let boostArmed = false;
      let dashCharges = DASH_MAX_CHARGES;
      let dashTimer = 0;
      let dashDir = 1;
      let dashCarryTimer = 0;
      /* 挑战状态：mode 为 'classic' 时下面这些字段不参与逻辑。 */
      let mode = 'classic';
      let stageIndex = 0;
      let stageDef = null;
      let chElapsed = 0;
      let chCollectibles = [];
      let chSwitches = [];
      let challengeAssisted = false;
      let chDashes = 0;
      let chResults = [];
      let lastChSecond = -1;
      /* 死亡检查点：最近一次成功着陆的平台（死亡策略：最近房间检查点重试，关卡任务不回退）。 */
      let chCheckpoint = null;
      let chRouteLanded = [];
      let chRouteShared = false;
      let chRouteStep = 1;
      let chLastLandedId = null;
      let chLandings = [];
      let chTipTimer = 0;
      let chGoalLockedTimer = 0;
      let chFailReason = '';
      let chPanelOpen = false;

      let high = A.Progress.get('shadow-leap').high;
      dom.hudHigh.textContent = String(high);

      function worldToScreenY(y) {
        return y - camY;
      }

      /* ---------- 确定性随机：默认走 Math.random，仅平台生成使用；#test 可 setSeed 固定随机流 ---------- */
      function mulberry32(seed) {
        let t = seed >>> 0;
        return function next() {
          t = (t + 0x6d2b79f5) >>> 0;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function normalizeSeed(seed) {
        const n = Number(seed);
        if (!Number.isFinite(n)) return 1;
        const s = Math.floor(Math.abs(n)) % 4294967296;
        return s === 0 ? 1 : s;
      }

      let rng = Math.random;
      let activeSeed = null;
      function rnd(lo, hi) {
        return lo + rng() * (hi - lo);
      }
      function applySeed(seed) {
        const s = normalizeSeed(seed);
        activeSeed = s;
        rng = mulberry32(s);
        return s;
      }

      /* ---------- 平台生成：横向距离受控，保证每一跳都够得着 ---------- */
      function makePlatform(x, y, kind) {
        const w = kind === 'fragile' ? rnd(74, 100) : rnd(82, 118);
        return {
          x: clamp(x, 6, W - w - 6),
          y,
          w,
          h: 12,
          kind: kind || 'normal',
          baseX: clamp(x, 6, W - w - 6),
          range: kind === 'moving' ? rnd(18, 30) : 0,
          speed: kind === 'moving' ? rnd(0.8, 1.4) : 0,
          broken: false,
          breakTimer: 0,
          phase: rnd(0, TAU),
        };
      }

      function platformChance(y, index) {
        /* 前 8 块生成平台保持静态宽平台，让玩家先学会起跳；之后才引入机制。 */
        if (index <= 8) return 'normal';
        if (index <= 12) return rng() < 0.16 ? 'moving' : 'normal';
        const t = clamp(-y / 12000, 0, 1);
        const r = rng();
        if (r < 0.05 + t * 0.10) return 'fragile';
        if (r < 0.14 + t * 0.24) return 'moving';
        return 'normal';
      }

      /* 保守水平可达距离：从静止起跑，忽略“已经在跑”的乐观情况。 */
      function maxRunDistance(t) {
        const ACC = 2400;
        const MAX_VX = 265;
        const tAcc = MAX_VX / ACC;
        if (t <= tAcc) return 0.5 * ACC * t * t;
        return 0.5 * ACC * tAcc * tAcc + MAX_VX * (t - tAcc);
      }

      function descentTimeForGap(gap) {
        const v = Math.abs(JUMP_V);
        const disc = v * v - 2 * GRAVITY * gap;
        if (disc <= 0) return 0;
        return (v + Math.sqrt(disc)) / GRAVITY;
      }

      function addPlatformAbove(highest) {
        const t = clamp(-highest.y / 12000, 0, 1);
        const gap = rnd(62, 92 + t * 26);
        const y = highest.y - gap;
        const prevCenter = highest.x + highest.w / 2;
        /* 只用保守滞空时间计算可达横向距离，再留 18px 安全余量。 */
        const reach = Math.max(42, maxRunDistance(descentTimeForGap(gap)) - 18);
        const offset = clamp(reach, 42, 120);
        generatedCount += 1;
        const nextW = generatedCount <= 8 ? rnd(100, 118) : rnd(74, 118);
        const kind = platformChance(y, generatedCount);
        /* 移动平台会在飞行期间继续横移，进一步收紧落点偏移。 */
        const safeOffset = kind === 'moving' ? Math.min(offset, 90) : offset;
        const center = clamp(prevCenter + rnd(-safeOffset, safeOffset), nextW / 2 + 8, W - nextW / 2 - 8);
        const p = makePlatform(center - nextW / 2, y, kind);
        p.w = nextW;
        return p;
      }

      function ensurePlatforms() {
        let highest = platforms.length ? platforms[platforms.length - 1] : null;
        const genLine = camY - 80;
        while (!highest || highest.y > genLine) {
          const p = highest ? addPlatformAbove(highest) : makePlatform(rnd(6, W - 120), camY - 100, 'normal');
          platforms.push(p);
          highest = p;
        }
        while (platforms.length && platforms[0].y > camY + H + 40) platforms.shift();
      }

      /* ---------- 每局主动道具 ---------- */
      function syncJoyTools() {
        Object.keys(joyButtons).forEach((id) => {
          const button = joyButtons[id];
          const active = id === 'feather' ? featherTimer > 0 : boostArmed;
          const name = id === 'feather' ? '羽落' : '月弹';
          const detail = id === 'feather' ? '下落 5 秒更轻缓' : '下一次着陆弹跳增强';
          button.querySelector('[data-joy-count]').textContent = String(tools[id]);
          button.disabled = state !== 'playing' || tools[id] <= 0 || active;
          button.classList.toggle('is-armed', active);
          button.setAttribute('aria-pressed', String(active));
          button.setAttribute('aria-label', name + '，' + detail + '，剩余 ' + tools[id] + ' 次（快捷键 ' + (id === 'feather' ? '1' : '2') + '）');
        });
        syncDashUi();
      }
      function useJoy(id) {
        if (state !== 'playing' || !Object.prototype.hasOwnProperty.call(tools, id) || tools[id] <= 0) return false;
        if (id === 'feather') {
          if (featherTimer > 0) return false;
          tools.feather -= 1;
          featherTimer = FEATHER_DURATION;
          A.Sfx.play('bell', 2);
        } else if (id === 'boost') {
          if (boostArmed) return false;
          tools.boost -= 1;
          boostArmed = true;
          A.Sfx.play('spring');
        } else {
          return false;
        }
        /* 挑战中主动使用羽落/月弹记为辅助（影冲不算辅助）。 */
        if (mode === 'challenge') {
          challengeAssisted = true;
          syncHud();
        }
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      Object.keys(joyButtons).forEach((id) => {
        joyButtons[id].addEventListener('click', () => useJoy(id));
      });

      /* ---------- GP004 影冲：一次空中水平短冲，每次着陆补充 ---------- */
      function syncDashUi() {
        if (!dashButton) return;
        const usable = state === 'playing' && dashCharges > 0 && dashTimer <= 0;
        dashButton.disabled = !usable;
        dashButton.classList.toggle('is-ready', usable);
        if (dashCount) dashCount.textContent = String(dashCharges);
        dashButton.setAttribute(
          'aria-label',
          '影冲：' +
            (dashCharges > 0 ? '本跳可用 1 次' : '本跳已用，着陆后补充') +
            '（Shift / J 或点按按钮）'
        );
      }
      /* 冲刺方向优先取当前按住的方向键/触点，否则用角色朝向；保证“按住方向同时冲刺”可复现。 */
      function heldDirection() {
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) dir = input.pointer.x < W / 2 ? -1 : 1;
        return dir;
      }
      /* 仅用于 #test 观察：角色是否正踩在某块平台上（无尽模式落地即自动起跳）。 */
      function isOnPlatform() {
        const bottom = player.y + player.h;
        return platforms.some(
          (p) =>
            !p.broken &&
            bottom >= p.y - 1.5 &&
            bottom <= p.y + 2.5 &&
            player.x + player.w > p.x + 2 &&
            player.x < p.x + p.w - 2
        );
      }
      function emitDashTrail(count) {
        const cx = player.x + player.w / 2;
        const cy = worldToScreenY(player.y) + player.h / 2;
        particles.emit(cx, cy, {
          count: A.reducedMotion ? 1 : count,
          speed: [40, 150],
          angle: dashDir > 0 ? [Math.PI * 0.82, Math.PI * 1.18] : [-Math.PI * 0.18, Math.PI * 0.18],
          life: [0.12, 0.3],
          size: [1.5, 3],
          colors: ['#e0567f', '#ffd23f', '#ffffff'],
          gravity: 0,
        });
      }
      function tryDash() {
        if (state !== 'playing') return false;
        if (dashCharges <= 0 || dashTimer > 0) return false;
        const dir = heldDirection();
        dashDir = dir !== 0 ? dir : player.face >= 0 ? 1 : -1;
        player.face = dashDir;
        player.vx = dashDir * DASH_SPEED;
        dashCharges -= 1;
        dashTimer = DASH_TIME;
        dashCarryTimer = 0;
        if (mode === 'challenge') chDashes += 1;
        A.Sfx.play('jump');
        emitDashTrail(6);
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      if (dashButton) dashButton.addEventListener('click', () => tryDash());

      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        const target = e.target;
        if (target && target.tagName) {
          const tag = target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        }
        /* Shift / J 影冲：按住方向键再按也可以；不可用时直接忽略，不缓存待发。 */
        if (e.key === 'Shift' || e.key === 'j' || e.key === 'J') {
          e.preventDefault();
          tryDash();
          return;
        }
        const id = { '1': 'feather', '2': 'boost' }[e.key];
        if (!id) return;
        e.preventDefault();
        useJoy(id);
      });

      /* ---------- 流程 ---------- */
      function reset() {
        platforms = [];
        camY = 0;
        score = 0;
        recordSaved = false;
        player.x = W / 2 - player.w / 2;
        player.y = H - 160;
        player.vx = 0;
        player.vy = 0;
        player.face = 1;
        player.jumpTimer = 0;
        startY = player.y;
        topY = player.y;
        generatedCount = 0;
        tools.feather = JOY_START.feather;
        tools.boost = JOY_START.boost;
        featherTimer = 0;
        boostArmed = false;
        /* 开局与重开各有一次影冲，之后只在成功着陆时补充。 */
        dashCharges = DASH_MAX_CHARGES;
        dashTimer = 0;
        dashDir = 1;
        dashCarryTimer = 0;
        hintTimer = 0;
        landingHint = '';
        particles.clear();
        const ground = { x: 40, y: H - 60, w: W - 80, h: 12, kind: 'normal', speed: 0, broken: false, breakTimer: 0, phase: 0 };
        platforms.push(ground);
        let highest = ground;
        while (highest.y > -80) {
          const p = addPlatformAbove(highest);
          platforms.push(p);
          highest = p;
        }
        syncHud();
        syncJoyTools();
      }

      function fmtTime(seconds) {
        const total = Math.max(0, Math.floor(Number(seconds) || 0));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }

      function syncHint() {
        if (dom.hint) dom.hint.textContent = mode === 'challenge' ? CHALLENGE_HINT : CLASSIC_HINT;
      }

      function chGoalProgressText() {
        if (!stageDef) return '';
        if (stageDef.collectibles.length) {
          return '卷轴 ' + chCollectibles.length + '/' + stageDef.collectibles.length + CH_OPTIONAL_TAG;
        }
        return '';
      }

      function syncHud() {
        if (mode === 'challenge') {
          dom.hudHeight.hidden = true;
          dom.hudHighWrap.hidden = true;
          dom.chHud.hidden = false;
          dom.chHud.textContent = stageDef
            ? 'C' + chPad2(stageDef.stageNumber) + ' ' + stageDef.title + ' · 影门 ' + (CH_START_WORLD_Y - stageDef.goal.cy) + 'm · ' + fmtTime(chElapsed)
            : '';
          return;
        }
        dom.hudHeight.hidden = false;
        dom.hudHighWrap.hidden = false;
        dom.chHud.hidden = true;
        dom.hudScore.textContent = String(score);
      }

      function startGame() {
        mode = 'classic';
        stageDef = null;
        chElapsed = 0;
        chCollectibles = [];
        chSwitches = [];
        challengeAssisted = false;
        chDashes = 0;
        chResults = [];
        chCheckpoint = null;
        chRouteLanded = [];
        chRouteShared = false;
        chRouteStep = 1;
        chLastLandedId = null;
        chLandings = [];
        chTipTimer = 0;
        chGoalLockedTimer = 0;
        chFailReason = '';
        chPanelOpen = false;
        dom.chPanel.hidden = true;
        autosave.clear();
        reset();
        state = 'playing';
        syncHint();
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
      }

      function gameOver() {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('shadow-leap', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          title: '坠落',
          text:
            `<span class="ac-score">${score}m</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `攀升高度 · 最高 ${Math.max(high, score)}m`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync(); syncJoyTools();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        const paused = {
          title: '已暂停',
          text: '影子随时待命。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge') {
          paused.btn2 = '退出挑战';
          paused.onBtn2 = exitChallengeToSelect;
        }
        ui.show(paused);
        pauseUi.sync(); syncJoyTools(); syncHud();
      }

      let pendingNoticeText = '';

      function showStart() {
        const notice = pendingNoticeText;
        pendingNoticeText = '';
        ui.show({
          title: '影跃',
          text:
            '无尽上跳：踩平台起跳，触墙反弹。<br/>紫色平台会移动 · 白色平台踩一次就碎<br/>空中按 Shift / J 或点 💨 影冲，每次着陆补充一次<br/>平台落点保证可达，越往高处越难' +
            (notice ? '<br/><br/>' + notice : ''),
          btn: '开始游戏',
          onBtn: startGame,
          btn2: CH_DATA_AVAILABLE ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: showChallengeSelect,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !CH_DATA_AVAILABLE;
      }

      /* ---------- 0.9 挑战：选关面板 / 世界构建 / 进出关卡 / 胜负 ---------- */
      function chBestOf(stageId) {
        try {
          const progress = A.Challenge.progress(CHALLENGE_GAME_ID);
          return progress.best && progress.best[stageId] ? progress.best[stageId] : null;
        } catch (err) {
          return null;
        }
      }

      function renderChallengePanel() {
        let progress = { cleared: [], best: {} };
        try {
          progress = A.Challenge.progress(CHALLENGE_GAME_ID);
        } catch (err) {
          /* 记录损坏时 fail closed：面板仍可进入 C01。 */
        }
        const clearedCount = STAGES.filter((def) => progress.cleared.indexOf(def.id) !== -1).length;
        const buttons = STAGES.map((def) => {
          const cleared = progress.cleared.indexOf(def.id) !== -1;
          const unlocked = CH_DATA_AVAILABLE && A.Challenge.isUnlocked(CHALLENGE_GAME_ID, def.id);
          const best = cleared ? chBestOf(def.id) : null;
          const classes = 'ac-stage-btn' + (cleared ? ' is-cleared' : '') + (unlocked ? '' : ' is-locked');
          const attrs = unlocked ? '' : ' disabled aria-disabled="true"';
          let meta = '🔒 需先通关上一关';
          if (cleared) {
            meta = '✅ 最佳 ' + (best ? A.Challenge.formatTime(best.timeSec) : '—') + (best && best.assisted ? ' · 辅助' : '');
          } else if (unlocked) {
            meta = '未通关 · ' + (def.goalStatement || '抵达影门');
          }
          return (
            '<button type="button" class="' + classes + '" data-stage-id="' + A.escapeHtml(def.id) + '"' + attrs + '>' +
            '<span class="ac-stage-name">' + A.escapeHtml('C' + chPad2(def.stageNumber) + ' ' + def.title) + '</span>' +
            '<span class="ac-stage-meta">' + A.escapeHtml(meta) + '</span>' +
            '</button>'
          );
        }).join('');
        const tip = CH_DATA_AVAILABLE
          ? '6 关影林挑战：C01 起逐关解锁 · 穿过发光影门通关 · 卷轴为可选收集，不影响通关与经典最高分。'
          : '挑战数据不可用：请确认 ../challenge/shadow-leap.js 已随页面加载（经典无尽不受影响）。';
        dom.chPanel.innerHTML =
          '<div class="ac-challenge-head"><strong>挑战 6 关</strong><span>' + clearedCount + '/' + STAGES.length + ' 已通关</span></div>' +
          '<div class="ac-challenge-grid">' + buttons + '</div>' +
          '<p class="ac-challenge-tip">' + A.escapeHtml(tip) + '</p>' +
          '<button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>';
      }

      function showChallengeSelect() {
        if (!CH_DATA_AVAILABLE) {
          pendingNoticeText = '挑战数据不可用（../challenge/shadow-leap.js 未加载或不足 6 关），请稍后重试。';
          showStart();
          return;
        }
        autosave.clear();
        mode = 'challenge';
        stageDef = null;
        chPanelOpen = true;
        state = 'ready';
        loop.resume();
        ui.hide();
        renderChallengePanel();
        dom.chPanel.hidden = false;
        pauseUi.sync(); syncJoyTools(); syncHud(); syncHint();
      }

      function hideChallengePanel() {
        chPanelOpen = false;
        dom.chPanel.hidden = true;
      }

      dom.chPanel.addEventListener('click', (e) => {
        const target = e.target && e.target.closest ? e.target.closest('[data-stage-id], [data-ch-back]') : null;
        if (!target) return;
        if (target.hasAttribute('data-ch-back')) {
          A.Sfx.play('ui');
          hideChallengePanel();
          showStart();
          return;
        }
        if (target.disabled) return;
        A.Sfx.play('ui');
        startChallengeRef(target.getAttribute('data-stage-id'));
      });

      function buildChallengeWorld(index) {
        const def = STAGES[clamp(index, 0, STAGES.length - 1)];
        if (!def || !def.platforms.length) return false;
        stageIndex = def.index;
        stageDef = def;
        platforms = def.platforms.map((p) => ({
          id: p.id,
          index: p.index,
          x: p.x,
          y: p.y,
          w: p.w,
          h: p.h,
          kind: p.kind,
          baseX: p.baseX,
          range: p.range,
          speed: p.speed,
          phase: p.phase,
          breakDelay: p.breakDelay,
          broken: false,
          breakTimer: 0,
          crackTimer: -1,
          routes: p.routes.slice(),
        }));
        /* 0.9 关卡垂直跨度 ≤ 435px（一屏内），挑战不滚屏；失败线固定在屏幕下方。 */
        camY = 0;
        player.x = def.spawn.x;
        player.y = def.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.face = 1;
        player.prevBottom = player.y + player.h;
        startY = player.y;
        topY = player.y;
        score = 0;
        particles.clear();
        tools.feather = JOY_START.feather;
        tools.boost = JOY_START.boost;
        featherTimer = 0;
        boostArmed = false;
        dashCharges = DASH_MAX_CHARGES;
        dashTimer = 0;
        dashDir = 1;
        dashCarryTimer = 0;
        hintTimer = 0;
        landingHint = '';
        chElapsed = 0;
        chCollectibles = [];
        chSwitches = [];
        challengeAssisted = false;
        chDashes = 0;
        lastChSecond = -1;
        chCheckpoint = null;
        chRouteLanded = [];
        chRouteShared = false;
        chRouteStep = 1;
        chLastLandedId = null;
        chLandings = [];
        chTipTimer = CH_TIP_SECONDS;
        chGoalLockedTimer = 0;
        chFailReason = '';
        return true;
      }

      function enterStage(index, keep) {
        if (!STAGES.length) return false;
        mode = 'challenge';
        if (!buildChallengeWorld(index)) return false;
        if (keep) {
          chCollectibles = Array.isArray(keep.collectibles) ? keep.collectibles.slice() : [];
          chSwitches = Array.isArray(keep.switches) ? keep.switches.slice() : [];
          chRouteLanded = Array.isArray(keep.routeLanded) ? keep.routeLanded.slice() : [];
          chRouteShared = !!keep.routeShared;
          chRouteStep = clamp(Math.floor(Number(keep.routeStep) || 1), 1, Math.max(1, stageDef.mainRoute.length));
          chDashes = Math.max(0, Math.floor(Number(keep.dashes) || 0));
          challengeAssisted = !!keep.assisted;
          chCheckpoint =
            keep.checkpoint && typeof keep.checkpoint === 'object'
              ? { platformIndex: Math.floor(Number(keep.checkpoint.platformIndex) || 0), x: Number(keep.checkpoint.x) || 0 }
              : null;
        }
        /* 死亡重试：从最近检查点平台继续（关卡任务不回退：卷轴/开关保留），计时重新开始。 */
        if (chCheckpoint) {
          const cp = platforms.filter((p) => p.index === chCheckpoint.platformIndex)[0];
          if (cp) {
            player.x = clamp(chCheckpoint.x, cp.x + 2, cp.x + cp.w - player.w - 2);
            player.y = cp.y - player.h;
            player.prevBottom = cp.y;
            player.vx = 0;
            player.vy = 0;
          }
        }
        hideChallengePanel();
        state = 'playing';
        syncHint();
        syncHud();
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
        autosave.saveNow();
        return true;
      }

      function startChallengeRef(ref) {
        if (!STAGES.length) return false;
        let def = null;
        if (typeof ref === 'string') def = STAGES.filter((d) => d.id === ref)[0] || null;
        else def = STAGES[clamp(Math.floor(Number(ref) || 0), 0, STAGES.length - 1)];
        if (!def) return false;
        return enterStage(def.index, null);
      }

      function retryStage() {
        if (!STAGES.length) return false;
        const keep = {
          collectibles: chCollectibles.slice(),
          switches: chSwitches.slice(),
          routeLanded: chRouteLanded.slice(),
          routeShared: chRouteShared,
          routeStep: chRouteStep,
          dashes: chDashes,
          assisted: challengeAssisted,
          checkpoint: chCheckpoint,
        };
        return enterStage(stageIndex, keep);
      }

      function exitChallengeToSelect() {
        autosave.clear();
        mode = 'challenge';
        stageDef = null;
        stageIndex = 0;
        chElapsed = 0;
        chCollectibles = [];
        chSwitches = [];
        chResults = [];
        challengeAssisted = false;
        chDashes = 0;
        chCheckpoint = null;
        chRouteLanded = [];
        chRouteShared = false;
        chRouteStep = 1;
        chLastLandedId = null;
        chLandings = [];
        chTipTimer = 0;
        chGoalLockedTimer = 0;
        chFailReason = '';
        reset();
        state = 'ready';
        loop.resume();
        showChallengeSelect();
        pauseUi.sync(); syncJoyTools(); syncHud(); syncHint();
      }

      /* ---------- 挑战进度条件：开关 / 影门 ---------- */
      function chGoalUnlocked() {
        if (!stageDef) return false;
        if (stageDef.goal.unlock !== 'all-switches') return true;
        return stageDef.switches.every((s) => chSwitches.indexOf(s.platformId) !== -1);
      }

      function chRemainingSwitches() {
        if (!stageDef) return 0;
        return stageDef.switches.filter((s) => chSwitches.indexOf(s.platformId) === -1).length;
      }

      function chRouteLabel(routeId) {
        if (!stageDef) return '未判定';
        if (routeId === 'mixed') return '混合';
        if (routeId === 'free') return '自由路线';
        const found = (stageDef.routes || []).filter((r) => r.id === routeId)[0];
        return found ? found.label : '未判定';
      }

      function chRouteVerdict() {
        if (!stageDef || !stageDef.routes || !stageDef.routes.length) return null;
        if (stageDef.routes.length === 1) return stageDef.routes[0].id;
        if (chRouteLanded.length >= 2) return 'mixed';
        if (chRouteLanded.length === 1) return chRouteLanded[0];
        if (chRouteShared) return 'free';
        return null;
      }

      /* 每次成功着陆记录：落在“只属于一条路线”的平台才算走上那条路；共享平台不算分流。 */
      function trackChallengeLanding(p) {
        if (!stageDef || !p || !Array.isArray(p.routes) || !p.routes.length) return;
        if (stageDef.routes.length < 2) return;
        if (p.routes.length === 1) {
          if (chRouteLanded.indexOf(p.routes[0]) === -1) chRouteLanded.push(p.routes[0]);
        } else {
          chRouteShared = true;
        }
      }

      function onChallengeLanded(landPlat) {
        if (!stageDef || !landPlat) return;
        chLastLandedId = landPlat.id;
        chLandings.push(landPlat.id);
        /* 死亡检查点 = 最近一次成功着陆的平台（0.9 deathPolicy：最近房间检查点）。 */
        chCheckpoint = { platformIndex: landPlat.index, x: player.x };
        if (stageDef.switchSet[landPlat.id] && chSwitches.indexOf(landPlat.id) === -1) {
          chSwitches.push(landPlat.id);
          A.Sfx.play('bell', 3);
          particles.emit(landPlat.x + landPlat.w / 2, worldToScreenY(landPlat.y) - 20, {
            count: A.reducedMotion ? 4 : 12,
            speed: [30, 130],
            angle: [0, TAU],
            life: [0.3, 0.7],
            size: [1.5, 3.5],
            colors: ['#7cf0d2', '#ffe08a'],
            gravity: 30,
          });
          syncHud();
          autosave.saveNow();
        }
        const route = stageDef.mainRoute;
        if (route[chRouteStep] === landPlat.id) {
          chRouteStep += 1;
        } else {
          for (let k = chRouteStep; k < route.length; k += 1) {
            if (route[k] === landPlat.id) {
              chRouteStep = k + 1;
              break;
            }
          }
        }
        trackChallengeLanding(landPlat);
      }

      function buildChallengeRouteInfo() {
        if (mode !== 'challenge' || !stageDef) {
          return { stageId: null, route: null, routeLabel: '', routeIds: [], routes: [], routeHint: '', exclusiveLanded: [], sharedLanded: false, landedRouted: false };
        }
        const verdict = chRouteVerdict();
        return {
          stageId: stageDef.id,
          route: verdict,
          routeLabel: chRouteLabel(verdict),
          routeIds: stageDef.routes.map((r) => r.id),
          routes: stageDef.routes.map((r) => r.label),
          routeHint: stageDef.routeHint || '',
          exclusiveLanded: chRouteLanded.slice(),
          sharedLanded: chRouteShared,
          landedRouted: chRouteLanded.length > 0 || chRouteShared,
        };
      }

      /* ---------- C04 可预测侧风：按世界高度区间施加固定水平加速度 ---------- */
      function chPlayerHeight() {
        return CH_START_WORLD_Y - (player.y + player.h / 2);
      }

      function chWindForce() {
        if (mode !== 'challenge' || !stageDef || !stageDef.winds.length) return 0;
        const height = chPlayerHeight();
        for (let i = 0; i < stageDef.winds.length; i += 1) {
          const wind = stageDef.winds[i];
          if (height >= wind.heightFrom && height <= wind.heightTo) return wind.forceX;
        }
        return 0;
      }

      function chWindLabel() {
        const force = chWindForce();
        return force === 0 ? '' : force < 0 ? '侧风 ←' : '侧风 →';
      }

      /* ---------- 挑战通关 / 失败 / 更新 ---------- */
      function stageClear() {
        if (state !== 'playing' || mode !== 'challenge' || !stageDef) return;
        state = 'cleared';
        A.Sfx.play('perfect');
        const g = stageDef.goal;
        particles.emit(g.cx, g.cy, {
          count: A.reducedMotion ? 6 : 18,
          speed: [40, 170],
          angle: [Math.PI * 0.1, Math.PI * 0.9],
          life: [0.35, 0.85],
          size: [2, 4],
          colors: ['#7cf0d2', '#ffd23f', '#ffffff'],
          gravity: 120,
        });
        const timeSec = Math.round(chElapsed * 10) / 10;
        const result = { timeSec, assisted: challengeAssisted, collectibles: chCollectibles.slice() };
        try {
          A.Challenge.markCleared(CHALLENGE_GAME_ID, stageDef.id, result);
        } catch (err) {
          /* 记录写入失败不阻塞本局结算。 */
        }
        const verdict = chRouteVerdict();
        chResults = chResults.filter((item) => item.id !== stageDef.id);
        chResults.push({ id: stageDef.id, title: stageDef.title, time: timeSec, scrolls: chCollectibles.length, dashes: chDashes, route: verdict || null });
        chResults.sort((a, b) => STAGES.findIndex((s) => s.id === a.id) - STAGES.findIndex((s) => s.id === b.id));
        autosave.clear();
        loop.pause();
        const isLast = stageIndex >= STAGES.length - 1;
        const nextDef = isLast ? null : STAGES[stageIndex + 1];
        let resultHtml = '';
        try {
          resultHtml = A.Challenge.resultHtml(stageDef.raw, result);
        } catch (err) {
          resultHtml = '<div class="ac-challenge-result"><p class="ac-challenge-result-title">C' + chPad2(stageDef.stageNumber) + ' ' + A.escapeHtml(stageDef.title) + ' · 通关</p></div>';
        }
        const extra =
          '<p class="ac-challenge-result-row">路线 <strong>' + A.escapeHtml(chRouteLabel(verdict)) + '</strong> · 影冲 ' + chDashes + ' 次</p>' +
          '<p class="ac-challenge-tip">' +
          (isLast
            ? '6 关影林全部完成；挑战记录与最佳用时已保存到本机。'
            : '下一关已解锁：C' + chPad2(nextDef.stageNumber) + ' ' + A.escapeHtml(nextDef.title)) +
          '</p>';
        ui.show({
          title: '影门开启',
          text: resultHtml + extra,
          btn: isLast ? '返回选关' : '下一关',
          onBtn: isLast ? showChallengeSelect : () => enterStage(stageIndex + 1, null),
          btn2: '重玩本关',
          onBtn2: () => enterStage(stageIndex, null),
        });
        pauseUi.sync(); syncJoyTools(); syncHud();
      }

      function stageFail(reason) {
        if (state !== 'playing' || mode !== 'challenge') return;
        state = 'over';
        chFailReason = String(reason || 'fall');
        A.Sfx.play('over');
        autosave.clear();
        loop.pause();
        const hint = CH_FAIL_HINTS[stageDef ? stageDef.stageRule : ''] || '先观察下一块平台的落点，再起跳。';
        const hasCheckpoint = !!(chCheckpoint && platforms.some((p) => p.index === chCheckpoint.platformIndex));
        ui.show({
          title: '失足',
          text:
            (stageDef ? 'C' + chPad2(stageDef.stageNumber) + ' ' + stageDef.title + ' · ' : '') +
            '跌落出影林边界。<br/>' +
            hint +
            (stageDef && stageDef.collectibles.length ? '<br/>' + CH_FAIL_SCROLL_NOTE : '') +
            '<br/>1 次点击即可重试：' +
            (hasCheckpoint ? '从最近落脚的平台继续，' : '从本关起点继续，') +
            '计时重新开始；已点亮的雕像与已收集卷轴保留。',
          btn: hasCheckpoint ? '从最近检查点重试' : '从本关起点重试',
          onBtn: retryStage,
          btn2: '返回选关',
          onBtn2: showChallengeSelect,
        });
        pauseUi.sync(); syncJoyTools(); syncHud();
      }

      function updateChallenge(dt) {
        if (!stageDef) {
          stageFail('no-stage');
          return;
        }
        chElapsed += dt;
        chTipTimer = Math.max(0, chTipTimer - dt);
        chGoalLockedTimer = Math.max(0, chGoalLockedTimer - dt);
        /* 卷轴：18×22 圆形近似触发半径 14，只影响探索记录，不影响战力/通关。 */
        for (const scroll of stageDef.collectibles) {
          if (chCollectibles.indexOf(scroll.id) !== -1) continue;
          if (A.Physics.circleBox(scroll.x, scroll.y, 14, player)) {
            chCollectibles.push(scroll.id);
            A.Sfx.play('bell', 5);
            particles.emit(scroll.x, worldToScreenY(scroll.y), {
              count: A.reducedMotion ? 4 : 10,
              speed: [30, 120],
              angle: [0, TAU],
              life: [0.25, 0.55],
              size: [1.5, 3],
              colors: ['#ffd23f', '#fff3c4'],
              gravity: 40,
            });
            syncHud();
            autosave.saveNow();
          }
        }
        /* 影门：圆（xCenter,height,radius）与角色矩形相交；C06 需先点亮两座半月雕像。 */
        const goal = stageDef.goal;
        if (A.Physics.circleBox(goal.cx, goal.cy, goal.r, player)) {
          if (chGoalUnlocked()) {
            stageClear();
            return;
          }
          if (chGoalLockedTimer <= 0) {
            chGoalLockedTimer = 2.4;
            A.Sfx.play('hit');
          }
        }
        if (player.y > H + 30) {
          stageFail('fall');
          return;
        }
        const sec = Math.floor(chElapsed);
        if (sec !== lastChSecond) {
          lastChSecond = sec;
          syncHud();
        }
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        const out = {
          /* mode：classic / challenge；旧 0.8 的 'trial' 不再写入（仅 restore 兼容降级）。 */
          mode,
          stageId: mode === 'challenge' && stageDef ? stageDef.id : null,
          stageIndex: mode === 'challenge' ? stageIndex : 0,
          player: {
            x: player.x,
            y: player.y,
            vx: player.vx,
            vy: player.vy,
            face: player.face,
          },
          platforms: platforms.map((p) => ({
            id: p.id || null,
            index: Number.isFinite(Number(p.index)) ? Number(p.index) : null,
            x: p.x,
            y: p.y,
            w: p.w,
            kind: p.kind,
            baseX: p.baseX,
            range: p.range,
            speed: p.speed,
            broken: p.broken,
            breakTimer: p.breakTimer,
            crackTimer: Number.isFinite(Number(p.crackTimer)) ? Number(p.crackTimer) : -1,
            phase: p.phase,
          })),
          camY,
          topY,
          startY,
          score,
          generatedCount,
          tools: { feather: tools.feather, boost: tools.boost },
          featherTimer,
          boostArmed,
          dashCharges,
          dashTimer,
          dashDir,
        };
        if (mode === 'challenge' && stageDef) {
          out.challengeState = {
            elapsed: chElapsed,
            collectibles: chCollectibles.slice(),
            switches: chSwitches.slice(),
            assisted: challengeAssisted,
            dashes: chDashes,
            checkpoint: chCheckpoint ? { platformIndex: chCheckpoint.platformIndex, x: chCheckpoint.x } : null,
            routeLanded: chRouteLanded.slice(),
            routeShared: chRouteShared,
            routeStep: chRouteStep,
          };
        }
        return out;
      }

      function mapSavedPlatforms(list, keepOrder) {
        const mapped = list
          .filter((p) => p && isFinite(p.x) && isFinite(p.y) && isFinite(p.w))
          .map((p) => ({
            id: typeof p.id === 'string' ? p.id : null,
            index: Number.isFinite(Number(p.index)) ? Math.floor(Number(p.index)) : null,
            x: Number(p.x),
            y: Number(p.y),
            w: clamp(Number(p.w), 40, W - 12),
            h: 12,
            kind: ['normal', 'moving', 'fragile'].indexOf(p.kind) !== -1 ? p.kind : 'normal',
            baseX: Number.isFinite(Number(p.baseX)) ? Number(p.baseX) : Number(p.x),
            range: clamp(Number(p.range) || (p.kind === 'moving' ? 18 : 0), 0, 32),
            speed: p.kind === 'moving' ? clamp(Number(p.speed) || 1, 0.2, 6) : 0,
            broken: !!p.broken,
            breakTimer: Number(p.breakTimer) || 0,
            crackTimer: Number.isFinite(Number(p.crackTimer)) ? Number(p.crackTimer) : -1,
            phase: Number(p.phase) || 0,
            routes: [],
            breakDelay: 0.65,
          }));
        return keepOrder ? mapped : mapped.sort((a, b) => b.y - a.y);
      }

      /**
       * 恢复局内档。
       * @returns {'classic'|'challenge'|'legacy-trial'|false}
       * - 旧档没有 mode：按经典恢复（0.7.0 存档零回归）。
       * - 旧 0.8 mode:'trial'：返回 'legacy-trial'，由调用方提示并可映射到 C01–C03；不静默删档。
       */
      function restore(data) {
        if (!data || !data.player || !Array.isArray(data.platforms) || !data.platforms.length) return false;
        if (data.mode === 'trial') return 'legacy-trial';
        try {
          const isChallenge = data.mode === 'challenge' && typeof data.stageId === 'string';
          mode = isChallenge ? 'challenge' : 'classic';
          if (isChallenge) {
            const target = STAGES.filter((def) => def.id === data.stageId)[0];
            if (!target || !buildChallengeWorld(target.index)) {
              mode = 'classic';
              reset();
              return false;
            }
            const cs = data.challengeState && typeof data.challengeState === 'object' ? data.challengeState : {};
            chElapsed = clamp(Number(cs.elapsed) || 0, 0, 36000);
            lastChSecond = Math.floor(chElapsed);
            const scrollIds = stageDef.collectibles.map((c) => c.id);
            chCollectibles = Array.isArray(cs.collectibles)
              ? cs.collectibles.map((id) => String(id)).filter((id) => scrollIds.indexOf(id) !== -1)
              : [];
            const switchIds = stageDef.switches.map((s) => s.platformId);
            chSwitches = Array.isArray(cs.switches)
              ? cs.switches.map((id) => String(id)).filter((id) => switchIds.indexOf(id) !== -1)
              : [];
            challengeAssisted = !!cs.assisted;
            chDashes = clamp(Math.floor(Number(cs.dashes) || 0), 0, 9999);
            const routeIds = (stageDef.routes || []).map((r) => r.id);
            chRouteLanded = Array.isArray(cs.routeLanded)
              ? cs.routeLanded.map((id) => String(id)).filter((id) => routeIds.indexOf(id) !== -1)
              : [];
            chRouteShared = !!cs.routeShared;
            chRouteStep = clamp(Math.floor(Number(cs.routeStep) || 1), 1, Math.max(1, stageDef.mainRoute.length));
            chCheckpoint =
              cs.checkpoint && typeof cs.checkpoint === 'object'
                ? { platformIndex: Math.floor(Number(cs.checkpoint.platformIndex) || 0), x: Number(cs.checkpoint.x) || 0 }
                : null;
            chTipTimer = 0;
            chGoalLockedTimer = 0;
            chFailReason = '';
            chLastLandedId = null;
            chLandings = [];
          } else {
            reset();
          }
          const restoredPlatforms = mapSavedPlatforms(data.platforms, isChallenge);
          if (!restoredPlatforms.length) return false;
          platforms = restoredPlatforms;
          if (isChallenge && stageDef) {
            /* 挑战平台按 index 重新贴回 id/route 标签，保证路线判定与开关/结算语义不丢。 */
            platforms.forEach((p) => {
              const meta = stageDef.platforms.filter((d) => d.index === p.index)[0];
              if (meta) {
                p.id = meta.id;
                p.routes = meta.routes.slice();
                p.breakDelay = meta.breakDelay;
              }
            });
          }
          const px = Number(data.player.x);
          const py = Number(data.player.y);
          player.x = Number.isFinite(px) ? clamp(px, -player.w / 2, W - player.w / 2) : W / 2 - player.w / 2;
          player.y = Number.isFinite(py) ? py : isChallenge && stageDef ? stageDef.spawn.y : H - 160;
          player.vx = Number(data.player.vx) || 0;
          player.vy = Number(data.player.vy) || 0;
          player.face = data.player.face === -1 ? -1 : 1;
          player.prevBottom = player.y + player.h;
          const savedCam = Number(data.camY);
          camY = isChallenge ? 0 : Number.isFinite(savedCam) ? savedCam : 0;
          topY = Number(data.topY) || player.y;
          startY = Number(data.startY) || player.y;
          score = Math.max(0, Number(data.score) || 0);
          generatedCount = Math.max(0, Number(data.generatedCount) || platforms.length - 1);
          tools.feather =
            data.tools && Number.isFinite(Number(data.tools.feather))
              ? clamp(Math.floor(Number(data.tools.feather)), 0, JOY_CAPS.feather)
              : JOY_START.feather;
          tools.boost =
            data.tools && Number.isFinite(Number(data.tools.boost))
              ? clamp(Math.floor(Number(data.tools.boost)), 0, JOY_CAPS.boost)
              : JOY_START.boost;
          featherTimer = clamp(Number(data.featherTimer) || 0, 0, FEATHER_DURATION);
          boostArmed = !!data.boostArmed;
          if (data.dashCharges === undefined || data.dashCharges === null) {
            /* 旧无尽档没有影冲字段：按开局 1 次可用恢复，不丢局。 */
            dashCharges = DASH_MAX_CHARGES;
            dashTimer = 0;
            dashDir = player.face >= 0 ? 1 : -1;
          } else {
            dashCharges = clamp(Math.floor(Number(data.dashCharges) || 0), 0, DASH_MAX_CHARGES);
            dashTimer = clamp(Number(data.dashTimer) || 0, 0, DASH_TIME);
            dashDir = data.dashDir === -1 ? -1 : data.dashDir === 1 ? 1 : player.face >= 0 ? 1 : -1;
          }
          dashCarryTimer = 0;
          recordSaved = false;
          chPanelOpen = false;
          dom.chPanel.hidden = true;
          syncHud();
          syncHint();
          syncJoyTools();
          return isChallenge ? 'challenge' : 'classic';
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('shadow-leap', serialize, {
        every: 4,
        meta: () =>
          mode === 'challenge' && stageDef
            ? {
                score: chElapsed,
                summary:
                  '挑战 C' + chPad2(stageDef.stageNumber) + ' ' + stageDef.title + ' · ' + fmtTime(chElapsed) +
                  (stageDef.collectibles.length ? ' · 卷轴 ' + chCollectibles.length + '/' + stageDef.collectibles.length : ''),
              }
            : { score, summary: `高度 ${score}m · 最高 ${Math.max(high, score)}m` },
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        particles.update(dt);
        hintTimer = Math.max(0, hintTimer - dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        const hadFeather = featherTimer > 0;
        featherTimer = Math.max(0, featherTimer - dt);
        if (hadFeather && featherTimer <= 0) {
          syncJoyTools();
          autosave.saveNow();
        }

        /* 水平控制：影冲期间锁定为朝向 × DASH_SPEED，不再响应转向；结束后保留冲刺方向惯性。 */
        const ACC = 2400;
        const MAX_VX = 265;
        const dashing = dashTimer > 0;
        if (dashing) {
          dashTimer = Math.max(0, dashTimer - dt);
          player.vx = dashDir * DASH_SPEED;
          player.face = dashDir;
          player.x += player.vx * dt;
          emitDashTrail(2);
        } else {
          let dir = heldDirection();
          const maxVx = dashCarryTimer > 0 ? DASH_SPEED * DASH_LAND_KEEP : MAX_VX;
          if (dir !== 0) {
            player.vx += dir * ACC * dt;
            player.face = dir;
          } else {
            player.vx -= player.vx * Math.min(1, 12 * dt);
          }
          player.vx = clamp(player.vx, -maxVx, maxVx);
          /* C04 风之回廊：按世界高度区间施加固定风向的侧风加速度（可预测，非随机）。 */
          const windForce = chWindForce();
          if (windForce !== 0) player.vx = clamp(player.vx + windForce * dt, -MAX_VX - 60, MAX_VX + 60);
          player.x += player.vx * dt;
          dashCarryTimer = Math.max(0, dashCarryTimer - dt);
        }

        /* 触墙反弹（保留速度）；冲刺中反弹后改为朝反方向继续冲，避免长时间贴墙。 */
        if (player.x < -player.w / 2) {
          player.x = -player.w / 2;
          player.vx = Math.abs(player.vx) * 0.95;
          if (dashing) dashDir = 1;
        } else if (player.x > W - player.w / 2) {
          player.x = W - player.w / 2;
          player.vx = -Math.abs(player.vx) * 0.95;
          if (dashing) dashDir = -1;
        }

        /* 重力：羽落只改变下落，不改变上升高度、平台生成或单向碰撞；影冲期间重力降到 25%。 */
        player.prevBottom = player.y + player.h;
        const feathering = featherTimer > 0 && player.vy > 0;
        const gravity = GRAVITY * (feathering ? FEATHER_GRAVITY : 1) * (dashing ? DASH_GRAVITY_SCALE : 1);
        const maxFall = feathering ? FEATHER_MAX_FALL : MAX_FALL;
        player.vy = Math.min(maxFall, player.vy + gravity * dt);
        player.y += player.vy * dt;

        /* 平台行为 */
        platforms.forEach((p) => {
          if (p.kind === 'moving') {
            p.phase += p.speed * dt;
            p.x = clamp(p.baseX + Math.sin(p.phase) * p.range, 4, W - p.w - 4);
          }
          if (p.kind === 'fragile' && p.crackTimer > 0) {
            /* 0.9 挑战：易碎平台先裂纹预警 breakDelaySec 秒再坍塌。 */
            p.crackTimer -= dt;
            if (p.crackTimer <= 0) {
              p.crackTimer = -1;
              p.broken = true;
              p.breakTimer = 0.35;
            }
          }
          if (p.broken) p.breakTimer -= dt;
        });
        platforms = platforms.filter((p) => !(p.broken && p.breakTimer <= 0));

        /* 单向平台着陆 */
        for (const p of platforms) {
          if (p.broken) continue;
          if (A.Physics.oneWayLanding(player, player.prevBottom, p)) {
            player.y = p.y - player.h;
            const wasDashing = dashTimer > 0;
            if (wasDashing) {
              /* 落地立刻终止影冲，但保留 60% 冲速的横向惯性，避免手感断崖。 */
              dashTimer = 0;
              dashCarryTimer = DASH_CARRY_TIME;
              player.vx = dashDir * DASH_SPEED * DASH_LAND_KEEP;
            }
            const hadDashCharge = dashCharges >= DASH_MAX_CHARGES;
            /* 每次成功着陆补充一次影冲（平台上没有可无限刷的消耗品）。 */
            dashCharges = DASH_MAX_CHARGES;
            /* 0.9 挑战：记录检查点/路线/开关（通关结算用）。 */
            if (mode === 'challenge') onChallengeLanded(p);
            const usedBoost = boostArmed;
            player.vy = usedBoost ? BOOST_JUMP_V : JUMP_V;
            if (usedBoost) boostArmed = false;
            landingHint = usedBoost ? '月弹！' : p.kind === 'fragile' ? '快跳！' : p.kind === 'moving' ? '借势！' : '稳！';
            hintTimer = 0.55;
            A.Sfx.play(usedBoost ? 'spring' : 'jump');
            particles.emit(player.x + player.w / 2, player.y + player.h, {
              count: A.reducedMotion ? 3 : 7,
              speed: [20, 90],
              angle: [Math.PI * 0.15, Math.PI * 0.85],
              life: [0.2, 0.45],
              size: [1.5, 3],
              colors: ['#e0567f', '#ffffff'],
              gravity: 300,
            });
            if (p.kind === 'fragile') {
              if (mode === 'challenge') {
                /* 设计 breakDelaySec：先出现醒目裂纹预警，再坍塌（不是无预警消失）。 */
                if (p.crackTimer < 0) p.crackTimer = p.breakDelay || 0.65;
              } else {
                p.broken = true;
                p.breakTimer = 0.22;
              }
              A.Sfx.play('hit');
            }
            if (usedBoost || wasDashing || !hadDashCharge) {
              syncJoyTools();
              autosave.saveNow();
            }
            break;
          }
        }

        /* 0.9 挑战：计时、卷轴、影门、开关与失败全部走世界坐标，不跑经典的高度/无限生成逻辑。 */
        if (mode === 'challenge') {
          updateChallenge(dt);
          input.endFrame();
          return;
        }

        /* 相机跟随：玩家越过中线以上时上移 */
        const line = camY + H * 0.42;
        if (player.y < line) camY -= line - player.y;

        /* 分数 = 从起点算起的最大攀升高度（米） */
        if (player.y < topY) {
          topY = player.y;
          const meters = Math.max(0, Math.floor((startY - topY) / 10));
          if (meters > score) {
            score = meters;
            syncHud();
          }
        }

        ensurePlatforms();

        if (player.y > camY + H + 30) {
          gameOver();
          input.endFrame();
          return;
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      function drawPlatform(p) {
        const y = worldToScreenY(p.y);
        if (y < -20 || y > H + 20) return;
        ctx.save();
        if (p.kind === 'normal') {
          ctx.fillStyle = '#3b466f';
          A.draw.roundRect(ctx, p.x, y, p.w, p.h, 5);
          ctx.fill();
          ctx.fillStyle = '#93a0c8';
          ctx.fillRect(p.x + 3, y + 2, p.w - 6, 2);
        } else if (p.kind === 'moving') {
          ctx.fillStyle = '#8a4bd3';
          A.draw.roundRect(ctx, p.x, y, p.w, p.h, 5);
          ctx.fill();
          ctx.fillStyle = '#e6ccff';
          ctx.fillRect(p.x + 3, y + 2, p.w - 6, 2);
          ctx.fillStyle = 'rgba(230,204,255,0.8)';
          const movingDir = Math.cos(p.phase) >= 0 ? 1 : -1;
          const ax = movingDir > 0 ? p.x + p.w - 8 : p.x + 4;
          ctx.beginPath();
          ctx.moveTo(ax, y + p.h / 2);
          ctx.lineTo(ax + movingDir * 5, y + p.h / 2 - 3);
          ctx.lineTo(ax + movingDir * 5, y + p.h / 2 + 3);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.strokeStyle = '#cfd8f2';
          ctx.lineWidth = 2;
          ctx.setLineDash(p.broken ? [3, 5] : []);
          A.draw.roundRect(ctx, p.x, y, p.w, p.h, 5);
          ctx.stroke();
          ctx.setLineDash([]);
          if (!p.broken) {
            ctx.strokeStyle = 'rgba(207,216,242,0.6)';
            ctx.beginPath();
            ctx.moveTo(p.x + p.w * 0.3, y + 2);
            ctx.lineTo(p.x + p.w * 0.42, y + p.h - 2);
            ctx.lineTo(p.x + p.w * 0.55, y + 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      /* 影冲残影：只画在冲刺中的短尾迹，reducedMotion 时减量。 */
      function drawDashTrail() {
        if (dashTimer <= 0) return;
        const ghosts = A.reducedMotion ? 1 : 3;
        const y = worldToScreenY(player.y);
        const fade = clamp(dashTimer / DASH_TIME, 0, 1);
        ctx.save();
        for (let i = 1; i <= ghosts; i++) {
          const gx = player.x + player.w / 2 - dashDir * i * 11;
          ctx.globalAlpha = (0.3 - i * 0.07) * (0.45 + fade * 0.55);
          ctx.fillStyle = '#e0567f';
          A.draw.roundRect(ctx, gx - 9 - dashDir * i * 2, y + 3, 18 + i * 3, 22 - i * 2, 6);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawNinja() {
        const y = worldToScreenY(player.y);
        ctx.save();
        ctx.translate(player.x + player.w / 2, y + player.h / 2);
        const squash = clamp(1 - player.vy / -2600, 0.82, 1.18);
        ctx.scale(player.face >= 0 ? 1 : -1, 1);
        ctx.fillStyle = '#232842';
        A.draw.roundRect(ctx, -9, -12 * squash, 18, 22 * squash, 6);
        ctx.fill();
        ctx.fillStyle = '#e0567f';
        const flutter = Math.sin(performance.now() / 90) * 3;
        ctx.beginPath();
        ctx.moveTo(-8, -8 * squash);
        ctx.lineTo(-20 - Math.abs(player.vx) * 0.02, -4 + flutter);
        ctx.lineTo(-8, -3 * squash);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#2c3352';
        A.draw.roundRect(ctx, -8, -22 * squash, 16, 13, 5);
        ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(-1, -18 * squash, 7, 3.4);
        ctx.fillStyle = '#e0567f';
        ctx.fillRect(-9, 2 * squash, 18, 3);
        ctx.restore();
      }

      /* 0.9 挑战：月影门（设计 goal 圆：xCenter / height / radius，圆-矩相交判定）。 */
      function drawChallengeGoal(g) {
        const y = worldToScreenY(g.cy);
        if (y + g.r < -40 || y - g.r > H + 40) return;
        const unlocked = chGoalUnlocked();
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 420);
        ctx.save();
        ctx.fillStyle = 'rgba(124,240,210,' + (unlocked ? (0.06 + pulse * 0.07).toFixed(3) : '0.04') + ')';
        ctx.beginPath();
        ctx.arc(g.cx, y, g.r + 8 + pulse * 3, 0, TAU);
        ctx.fill();
        const grad = ctx.createRadialGradient(g.cx, y, g.r * 0.2, g.cx, y, g.r);
        grad.addColorStop(0, unlocked ? 'rgba(124,240,210,0.38)' : 'rgba(147,160,200,0.16)');
        grad.addColorStop(1, 'rgba(124,240,210,0.03)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(g.cx, y, g.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = unlocked ? '#7cf0d2' : 'rgba(147,160,200,0.75)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(g.cx, y, g.r, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(124,240,210,0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(g.cx, y, Math.max(4, g.r - 6), 0, TAU);
        ctx.stroke();
        A.draw.label(ctx, unlocked ? '影门' : '影门（未开启）', g.cx, y + g.r + 14, {
          font: 'bold 11px system-ui, sans-serif',
          color: unlocked ? 'rgba(124,240,210,0.92)' : 'rgba(207,216,242,0.7)',
        });
        ctx.restore();
      }

      /* 0.9 挑战：金色卷轴（可选收集，18×22 视觉 / 触发半径 14）。 */
      function drawChallengeScroll(s) {
        if (chCollectibles.indexOf(s.id) !== -1) return;
        const y = worldToScreenY(s.y);
        if (y < -24 || y > H + 24) return;
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300 + s.x * 0.05);
        ctx.save();
        ctx.fillStyle = 'rgba(255,210,63,' + (0.1 + pulse * 0.1).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(s.x, y, 14 + pulse * 3, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#ffd23f';
        A.draw.roundRect(ctx, s.x - CH_SCROLL_W / 2, y - CH_SCROLL_H / 2, CH_SCROLL_W, CH_SCROLL_H, 4);
        ctx.fill();
        ctx.fillStyle = '#3b2a05';
        ctx.fillRect(s.x - CH_SCROLL_W / 2 + 2, y - 4, CH_SCROLL_W - 4, 2);
        ctx.fillRect(s.x - CH_SCROLL_W / 2 + 2, y + 1, CH_SCROLL_W - 4, 2);
        ctx.fillStyle = '#ff9f1c';
        ctx.fillRect(s.x - CH_SCROLL_W / 2 - 2, y - CH_SCROLL_H / 2, 3, CH_SCROLL_H);
        ctx.fillRect(s.x + CH_SCROLL_W / 2 - 1, y - CH_SCROLL_H / 2, 3, CH_SCROLL_H);
        ctx.restore();
      }

      /* C06 半月雕像开关：落上开关台即点亮（persistentWithinAttempt）。 */
      function drawChallengeSwitch(plat) {
        const active = chSwitches.indexOf(plat.id) !== -1;
        const y = worldToScreenY(plat.y);
        if (y < -40 || y > H + 40) return;
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 360);
        ctx.save();
        ctx.translate(clamp(plat.x + plat.w / 2, 18, W - 18), y - 20);
        ctx.fillStyle = active ? '#7cf0d2' : 'rgba(147,160,200,0.8)';
        ctx.beginPath();
        ctx.arc(0, 0, active ? 10 + pulse * 1.5 : 9, Math.PI * 0.5, Math.PI * 1.5);
        ctx.fill();
        ctx.strokeStyle = active ? 'rgba(124,240,210,0.9)' : 'rgba(147,160,200,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, TAU);
        ctx.stroke();
        if (!active) {
          ctx.fillStyle = 'rgba(9,13,28,0.85)';
          ctx.fillRect(-2.5, -4, 5, 8);
        }
        ctx.restore();
      }

      /* C04 风之回廊：风区可视（半透明带 + 方向箭头 + 边界虚线），固定风向不做随机。 */
      function drawChallengeWind() {
        if (!stageDef || !stageDef.winds.length) return;
        for (const wind of stageDef.winds) {
          const topY = worldToScreenY(CH_START_WORLD_Y - wind.heightTo);
          const bottomY = worldToScreenY(CH_START_WORLD_Y - wind.heightFrom);
          ctx.save();
          ctx.fillStyle = 'rgba(124,240,210,0.05)';
          ctx.fillRect(0, topY, W, bottomY - topY);
          ctx.strokeStyle = 'rgba(124,240,210,0.28)';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(0, topY);
          ctx.lineTo(W, topY);
          ctx.moveTo(0, bottomY);
          ctx.lineTo(W, bottomY);
          ctx.stroke();
          ctx.setLineDash([]);
          const dir = wind.forceX < 0 ? -1 : 1;
          const drift = (performance.now() / 22) % 90;
          ctx.strokeStyle = 'rgba(124,240,210,0.4)';
          for (let i = 0; i < 6; i += 1) {
            const ax = ((i * 90 + drift) % (W + 90)) - 45;
            const ay = topY + 18 + i * Math.max(12, (bottomY - topY - 36) / 5);
            if (ay > bottomY - 12) continue;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(ax + dir * 16, ay);
            ctx.stroke();
          }
          A.draw.label(ctx, dir < 0 ? '风 ←' : '风 →', W - 16, (topY + bottomY) / 2, {
            align: 'right',
            font: 'bold 12px system-ui, sans-serif',
            color: 'rgba(124,240,210,0.6)',
          });
          ctx.restore();
        }
      }

      function render() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#170f2e');
        bg.addColorStop(0.6, '#1d1638');
        bg.addColorStop(1, '#28143c');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(255,236,180,0.9)';
        ctx.beginPath();
        ctx.arc(340, 110, 30, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(23,15,46,0.55)';
        ctx.beginPath();
        ctx.arc(328, 100, 26, 0, TAU);
        ctx.fill();

        const par = (camY * 0.25) % (H + 200);
        ctx.fillStyle = 'rgba(12,10,30,0.8)';
        for (let k = -1; k < 2; k++) {
          const baseY = k * (H + 200) + par + H;
          ctx.beginPath();
          ctx.moveTo(0, baseY);
          ctx.lineTo(80, baseY - 130);
          ctx.lineTo(190, baseY - 40);
          ctx.lineTo(300, baseY - 170);
          ctx.lineTo(420, baseY - 60);
          ctx.lineTo(420, baseY + 200);
          ctx.lineTo(0, baseY + 200);
          ctx.closePath();
          ctx.fill();
        }

        if (mode !== 'challenge') {
          /* 经典无尽独有的高度标尺（挑战关卡是一屏内的固定世界，不显示米数）。 */
          const meterLines = 20;
          ctx.strokeStyle = 'rgba(147,160,200,0.14)';
          ctx.lineWidth = 1;
          for (let m = Math.floor(-camY / 500) * 5; m < Math.floor((-camY + H) / 500) * 5 + 10; m += 5) {
            const y = worldToScreenY(-m * 100);
            if (y < -10 || y > H + 10) continue;
            ctx.setLineDash([4, 8]);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
            ctx.setLineDash([]);
            if (m > 0 && m % meterLines === 0) {
              A.draw.label(ctx, m * 10 + 'm', W - 8, y - 8, {
                align: 'right',
                font: '10px system-ui, sans-serif',
                color: 'rgba(147,160,200,0.4)',
              });
            }
          }
        }

        if (mode === 'challenge' && stageDef) {
          drawChallengeWind();
          drawChallengeGoal(stageDef.goal);
          stageDef.collectibles.forEach(drawChallengeScroll);
        }
        platforms.forEach(drawPlatform);
        if (mode === 'challenge' && stageDef && stageDef.switches.length) {
          stageDef.switches.forEach((sw) => {
            const plat = platforms.filter((p) => p.index === sw.index)[0];
            if (plat) drawChallengeSwitch(plat);
          });
        }
        particles.draw(ctx);
        drawDashTrail();
        if (state === 'playing' || state === 'paused' || state === 'ready' || state === 'cleared') drawNinja();
        if (hintTimer > 0 && landingHint && (state === 'playing' || state === 'paused')) {
          A.draw.label(ctx, landingHint, clamp(player.x + player.w / 2, 46, W - 46), clamp(worldToScreenY(player.y) - 34, 76, H - 40), {
            font: 'bold 14px system-ui',
            color: '#ffe08a',
            alpha: clamp(hintTimer / 0.55, 0, 1),
          });
        }

        if (mode === 'challenge' && stageDef) {
          /* 挑战画布内 HUD：Cxx 标题 · 目标/用时 · 首次进入操作与目标提示。 */
          A.draw.label(ctx, 'C' + chPad2(stageDef.stageNumber) + ' ' + stageDef.title, W / 2, 26, {
            font: 'bold 15px system-ui, sans-serif',
            color: 'rgba(255,255,255,0.72)',
          });
          const infoLine =
            chTipTimer > 0
              ? '目标：' + stageDef.goalStatement
              : fmtTime(chElapsed) +
                (chGoalProgressText() ? ' · ' + chGoalProgressText() : '') +
                (stageDef.switches.length ? ' · 半月雕像 ' + chSwitches.length + '/' + stageDef.switches.length : '');
          A.draw.label(ctx, infoLine, W / 2, 48, {
            font: 'bold 13px system-ui, sans-serif',
            color: 'rgba(255,210,63,0.8)',
          });
          if (chTipTimer > 0) {
            A.draw.label(ctx, '←→ 移动 · Shift / J 影冲 · 卷轴可选 · P 暂停', W / 2, 70, {
              font: '11px system-ui, sans-serif',
              color: 'rgba(147,160,200,0.8)',
              alpha: clamp(chTipTimer / 1.2, 0, 1),
            });
          } else if (stageDef.routeHint) {
            A.draw.label(ctx, stageDef.routeHint, W / 2, 70, {
              font: '11px system-ui, sans-serif',
              color: 'rgba(124,240,210,0.7)',
            });
          }
          if (chGoalLockedTimer > 0) {
            A.draw.label(ctx, CH_GOAL_LOCKED_TEXT.replace('{n}', String(chRemainingSwitches())), W / 2, 94, {
              font: 'bold 12px system-ui, sans-serif',
              color: '#ffb3c6',
            });
          }
          const windLabel = chWindLabel();
          if (windLabel) {
            A.draw.label(ctx, windLabel, 10, 94, {
              align: 'left',
              font: 'bold 12px system-ui, sans-serif',
              color: 'rgba(124,240,210,0.85)',
            });
          }
        } else if (mode !== 'challenge') {
          A.draw.label(ctx, score + 'm', W / 2, 46, {
            font: 'bold 30px system-ui, sans-serif',
            color: 'rgba(255,255,255,0.14)',
          });
        }

        /* 画面内常驻影冲状态：静音也能看出“本跳可用/已用/正在冲”。 */
        if (state === 'playing' || state === 'paused') {
          const dashLabel = dashTimer > 0 ? '影冲！' : dashCharges > 0 ? '影冲 可用' : '影冲 已用';
          A.draw.label(ctx, dashLabel, 10, 72, {
            align: 'left',
            font: 'bold 12px system-ui, sans-serif',
            color: dashTimer > 0 ? '#ffd23f' : dashCharges > 0 ? '#e0567f' : 'rgba(147,160,200,0.55)',
            alpha: dashTimer > 0 ? 1 : 0.9,
          });
        }
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      function resetChallengeRuntime() {
        chElapsed = 0;
        chCollectibles = [];
        chSwitches = [];
        challengeAssisted = false;
        chDashes = 0;
        chResults = [];
        lastChSecond = -1;
        chCheckpoint = null;
        chRouteLanded = [];
        chRouteShared = false;
        chRouteStep = 1;
        chLastLandedId = null;
        chLandings = [];
        chTipTimer = 0;
        chGoalLockedTimer = 0;
        chFailReason = '';
        chPanelOpen = false;
        dom.chPanel.hidden = true;
      }

      reset();
      state = 'ready';
      if (location.hash === '#test') {
        const testPlayer = () => ({
          x: player.x,
          y: player.y,
          w: player.w,
          h: player.h,
          vx: player.vx,
          vy: player.vy,
          face: player.face,
        });
        window.__arcadeTest = {
          /* ---------- 经典无尽（0.7/0.8 既有钩子，全部保留） ---------- */
          info() {
            return {
              score,
              platforms: platforms.map((p) => ({ x: p.x, y: p.y, w: p.w, kind: p.kind, range: p.range, broken: p.broken })),
            };
          },
          joyInfo() {
            return {
              tools: { feather: tools.feather, boost: tools.boost },
              featherTimer,
              featherActive: featherTimer > 0,
              boostArmed,
              player: { x: player.x, y: player.y, vy: player.vy },
              landingHint,
              hintTimer,
              score,
              state,
            };
          },
          useJoyTool(id) {
            const button = joyButtons[id];
            if (!button || button.disabled) return false;
