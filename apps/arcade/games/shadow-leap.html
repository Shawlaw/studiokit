            button.click();
            return true;
          },
          setMotion(vy) {
            player.vy = Number(vy) || 0;
            return player.vy;
          },
          setPosition(x, y) {
            player.x = clamp(Number(x) || player.x, 0, W - player.w);
            player.y = clamp(Number(y) || player.y, 0, H);
            player.prevBottom = player.y + player.h;
            return { x: player.x, y: player.y };
          },
          fallInfo() {
            const feathering = featherTimer > 0 && player.vy > 0;
            return {
              feathering,
              gravity: GRAVITY * (feathering ? FEATHER_GRAVITY : 1),
              maxFall: feathering ? FEATHER_MAX_FALL : MAX_FALL,
              baseGravity: GRAVITY,
              baseMaxFall: MAX_FALL,
              vy: player.vy,
            };
          },
          setFeatherTimer(seconds) {
            featherTimer = clamp(Number(seconds) || 0, 0, FEATHER_DURATION);
            syncJoyTools();
            return featherTimer;
          },
          forceLand(index) {
            const p = platforms[index];
            if (!p) return false;
            player.x = clamp(p.x + p.w / 2 - player.w / 2, -player.w / 2, W - player.w / 2);
            player.y = p.y - player.h - 2;
            player.vy = 120;
            player.prevBottom = p.y - 2;
            return true;
          },
          /* ---------- GP004 影冲 / 确定性种子（保留） ---------- */
          dashInfo() {
            return {
              dashCharges,
              dashTimer,
              dashing: dashTimer > 0,
              vx: player.vx,
              vy: player.vy,
              face: player.face,
              landingHint,
              state,
            };
          },
          triggerDash() {
            return tryDash();
          },
          setSeed(seed) {
            return applySeed(seed);
          },
          seed() {
            return activeSeed;
          },
          /* 设置种子并重生成经典模式平台；返回平台数。会清掉旧局内存档，避免与旧局混用。 */
          resetWithSeed(seed) {
            applySeed(seed);
            autosave.clear();
            mode = 'classic';
            stageDef = null;
            resetChallengeRuntime();
            reset();
            syncHint();
            return platforms.length;
          },
          /* 等于“用种子开一局经典”：设置种子 + 重生成平台 + 进入游玩态；返回平台数。 */
          startClassicWithSeed(seed) {
            applySeed(seed);
            autosave.clear();
            mode = 'classic';
            stageDef = null;
            resetChallengeRuntime();
            reset();
            state = 'playing';
            syncHint();
            syncHud();
            ui.hide();
            loop.resume();
            pauseUi.sync();
            syncJoyTools();
            autosave.saveNow();
            return platforms.length;
          },
          airborne() {
            return !isOnPlatform();
          },
          /* ---------- 0.9 挑战模式（INTEGRATION-CONTRACT §5） ---------- */
          challengeStages() {
            let progress = { cleared: [], best: {} };
            try {
              progress = A.Challenge.progress(CHALLENGE_GAME_ID);
            } catch (err) {
              /* 记录损坏时按空记录观察。 */
            }
            return STAGES.map((def) => {
              const cleared = progress.cleared.indexOf(def.id) !== -1;
              const best = cleared && progress.best[def.id] ? progress.best[def.id] : null;
              let unlocked = false;
              try {
                unlocked = A.Challenge.isUnlocked(CHALLENGE_GAME_ID, def.id);
              } catch (err) {
                /* fail closed */
              }
              return {
                id: def.id,
                stageNumber: def.stageNumber,
                title: def.title,
                difficulty: def.difficulty,
                goalStatement: def.goalStatement,
                requiredAbility: def.requiredAbility,
                stageRule: def.stageRule,
                unlocked,
                cleared,
                best: best ? { timeSec: best.timeSec, assisted: !!best.assisted, collectibles: (best.collectibles || []).slice() } : null,
                platforms: def.platforms.length,
                collectibles: def.collectibles.map((c) => c.id),
                routeIds: def.routes.map((r) => r.id),
                targetDurationSec: def.raw && def.raw.targetDurationSec ? def.raw.targetDurationSec.slice() : null,
              };
            });
          },
          startChallenge(ref) {
            /* 测试钩子：显式进入指定关（不经过 UI 解锁判断，便于逐关确定性验证）。 */
            return startChallengeRef(ref);
          },
          challengeInfo() {
            const verdict = chRouteVerdict();
            return {
              mode,
              stageId: stageDef ? stageDef.id : null,
              stageIndex,
              stageNumber: stageDef ? stageDef.stageNumber : null,
              state,
              elapsedSec: chElapsed,
              objective: stageDef ? stageDef.goalStatement : '',
              cleared: state === 'cleared',
              failed: state === 'over',
              collectibles: chCollectibles.slice(),
              collectiblesTotal: stageDef ? stageDef.collectibles.length : 0,
              assisted: challengeAssisted,
              switches: chSwitches.slice(),
              switchRequired: stageDef ? stageDef.switches.length : 0,
              route: verdict,
              routeLabel: chRouteLabel(verdict),
              routeInfo: buildChallengeRouteInfo(),
              checkpoint: chCheckpoint ? { platformIndex: chCheckpoint.platformIndex } : null,
              dashes: chDashes,
              failReason: chFailReason,
              goal: stageDef ? { cx: stageDef.goal.cx, cy: stageDef.goal.cy, r: stageDef.goal.r, unlocked: chGoalUnlocked() } : null,
              player: testPlayer(),
              panelOpen: chPanelOpen,
              challengeDataAvailable: CH_DATA_AVAILABLE,
              results: chResults.map((r) => ({ id: r.id, title: r.title, time: r.time, scrolls: r.scrolls, dashes: r.dashes, route: r.route || null })),
            };
          },
          stageObservable() {
            return {
              mode,
              stageId: stageDef ? stageDef.id : null,
              state,
              elapsed: chElapsed,
              platforms: platforms.map((p) => ({
                id: p.id || null,
                index: p.index === undefined || p.index === null ? null : p.index,
                x: p.x,
                y: p.y,
                w: p.w,
                kind: p.kind,
                phase: p.phase,
                broken: !!p.broken,
                cracking: p.crackTimer > 0,
              })),
              player: testPlayer(),
              goal: stageDef ? { cx: stageDef.goal.cx, cy: stageDef.goal.cy, r: stageDef.goal.r, unlocked: chGoalUnlocked() } : null,
              mainRoute: stageDef ? stageDef.mainRoute.slice() : [],
              alternativeRoute: stageDef ? stageDef.alternativeRoute.slice() : [],
              routeStep: chRouteStep,
              lastLandedId: chLastLandedId,
              landings: chLandings.slice(),
              collectibles: stageDef
                ? stageDef.collectibles.map((c) => ({ id: c.id, x: c.x, y: c.y, optional: c.optional, collected: chCollectibles.indexOf(c.id) !== -1 }))
                : [],
              switches: stageDef
                ? stageDef.switches.map((s) => ({ id: s.platformId, index: s.index, active: chSwitches.indexOf(s.platformId) !== -1 }))
                : [],
              winds: stageDef ? stageDef.winds.map((w) => ({ heightFrom: w.heightFrom, heightTo: w.heightTo, forceX: w.forceX })) : [],
              goalLockedHint: chGoalLockedTimer > 0,
              tipActive: chTipTimer > 0,
              cameraY: camY,
            };
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing') return false;
            if (assisted) challengeAssisted = true;
            stageClear();
            return true;
          },
          forceStageFail(reason) {
            if (mode !== 'challenge' || state !== 'playing') return false;
            stageFail(String(reason || 'forced'));
            return true;
          },
          exitChallenge() {
            if (mode !== 'challenge') return false;
            exitChallengeToSelect();
            return true;
          },
          /* ---------- 0.8 影之试炼旧钩子（函数名保留；数据源已迁移到 C01–C06，供旧脚本平滑对照） ---------- */
          stageList() {
            return STAGES.map((def) => ({
              index: def.index,
              id: def.id,
              title: def.title,
              height: def.worldBottom - def.worldTop,
              start: { x: def.spawn.x, y: def.spawn.y },
              goal: { x: def.goal.cx - def.goal.r, y: def.goal.cy - def.goal.r, w: def.goal.r * 2, h: def.goal.r * 2 },
              platforms: def.platforms.length,
              scrolls: def.collectibles.length,
              routeIds: def.routes.map((r) => r.id),
              routes: def.routes.map((r) => r.label),
              routeHint: def.routeHint || '',
            }));
          },
          startTrial(index) {
            return startChallengeRef(clamp(Math.floor(Number(index) || 0), 0, Math.max(0, STAGES.length - 1)));
          },
          loadStage(index) {
            return startChallengeRef(clamp(Math.floor(Number(index) || 0), 0, Math.max(0, STAGES.length - 1)));
          },
          trialInfo() {
            const verdict = chRouteVerdict();
            return {
              mode,
              stageIndex,
              stageId: stageDef ? stageDef.id : null,
              state,
              elapsed: chElapsed,
              player: { x: player.x, y: player.y, vx: player.vx, vy: player.vy },
              scrolls: chCollectibles.slice(),
              scrollsCollected: chCollectibles.slice(),
              scrollsTotal: stageDef ? stageDef.collectibles.length : 0,
              goal: stageDef ? { x: stageDef.goal.cx - stageDef.goal.r, y: stageDef.goal.cy - stageDef.goal.r, w: stageDef.goal.r * 2, h: stageDef.goal.r * 2 } : null,
              route: verdict,
              routeLabel: chRouteLabel(verdict),
              routes: stageDef ? stageDef.routes.map((r) => r.label) : [],
              routeInfo: buildChallengeRouteInfo(),
              cleared: state === 'cleared',
              results: chResults.map((r) => ({ id: r.id, title: r.title, time: r.time, scrolls: r.scrolls, dashes: r.dashes, route: r.route || null })),
            };
          },
          routeInfo() {
            return buildChallengeRouteInfo();
          },
          forceRoute(routeId) {
            if (mode !== 'challenge' || !stageDef) return false;
            const route = stageDef.routes.filter((r) => r.id === String(routeId))[0];
            if (!route) return false;
            if (stageDef.routes.length < 2) return route.id === chRouteVerdict();
            const target = platforms.filter((p) => Array.isArray(p.routes) && p.routes.length === 1 && p.routes[0] === route.id)[0];
            if (!target) return false;
            if (chRouteLanded.indexOf(route.id) === -1) chRouteLanded.push(route.id);
            player.x = clamp(target.x + target.w / 2 - player.w / 2, -player.w / 2, W - player.w / 2);
            player.y = clamp(target.y - player.h - 2, 0, H);
            player.vy = 120;
            player.prevBottom = target.y - 2;
            syncHud();
            return true;
          },
          stagePlatforms() {
            return platforms.map((p) => ({
              id: p.id || null,
              index: p.index === undefined || p.index === null ? null : p.index,
              x: p.x,
              y: p.y,
              w: p.w,
              kind: p.kind,
              range: p.range,
              broken: p.broken,
              cracking: p.crackTimer > 0,
            }));
          },
          forceReachGoal() {
            if (mode !== 'challenge' || !stageDef) return false;
            player.x = clamp(stageDef.goal.cx - player.w / 2, -player.w / 2, W - player.w / 2);
            player.y = clamp(stageDef.goal.cy - player.h / 2, 0, H);
            player.vy = 0;
            player.prevBottom = player.y + player.h;
            return true;
          },
          forceFall() {
            if (mode !== 'challenge' || !stageDef) return false;
            player.y = H + 200;
            player.vy = 400;
            player.prevBottom = player.y + player.h;
            return true;
          },
          forceCollectScroll(index) {
            if (mode !== 'challenge' || !stageDef || !stageDef.collectibles.length) return false;
            const c = stageDef.collectibles[clamp(Math.floor(Number(index) || 0), 0, stageDef.collectibles.length - 1)];
            if (!c) return false;
            player.x = clamp(c.x - player.w / 2, -player.w / 2, W - player.w / 2);
            player.y = clamp(c.y - player.h / 2, 0, H);
            player.prevBottom = player.y + player.h;
            return true;
          },
          trialResults() {
            return chResults.map((r) => ({ id: r.id, title: r.title, time: r.time, scrolls: r.scrolls, dashes: r.dashes, route: r.route || null }));
          },
        };
      }

      /* 旧 0.8 mode:'trial' 存档安全降级：能映射 C01–C03 则提示继续，不能则提示重开；不静默删档。 */
      function legacyTrialPrompt(saved) {
        const mappedIndex = clamp(Math.floor(Number(saved && saved.data && saved.data.stageIndex) || 0), 0, 2);
        const mapped = STAGES[mappedIndex];
        if (mapped) {
          ui.show({
            title: '试炼数据已升级',
            text:
              '旧版「影之试炼 S1–S3」的局内进度已升级为 0.9 挑战关卡。<br/>可以把进度继续为 C' +
              chPad2(mapped.stageNumber) +
              ' ' +
              A.escapeHtml(mapped.title) +
              '（从本关起点开始），或返回开始界面重新选择。<br/>最高分与挑战记录不会受影响。',
            btn: '继续 C' + chPad2(mapped.stageNumber),
            onBtn: () => {
              autosave.clear();
              enterStage(mapped.index, null);
              A.showToast('旧试炼进度已升级为挑战 C' + chPad2(mapped.stageNumber));
            },
            btn2: '返回开始',
            onBtn2: () => {
              autosave.clear();
              showStart();
            },
          });
          return;
        }
        ui.show({
          title: '试炼数据已升级',
          text: '旧版「影之试炼」数据已升级，请选择关卡。<br/>局内进度已重置；你的最高分与挑战记录不受影响。',
          btn: '选择关卡',
          onBtn: () => {
            autosave.clear();
            showChallengeSelect();
          },
          btn2: '开始游戏',
          onBtn2: () => {
            autosave.clear();
            showStart();
          },
        });
      }

      const saved = autosave.load();
      if (saved) {
        if (saved.data && saved.data.mode === 'trial') {
          legacyTrialPrompt(saved);
        } else {
          A.showResumePrompt(ui, saved, {
            name: '影跃',
            onResume: () => {
              const restored = restore(saved.data);
              if (restored === 'classic' || restored === 'challenge') {
                state = 'playing';
                ui.hide();
                loop.resume();
                pauseUi.sync(); syncJoyTools(); syncHud(); syncHint();
                autosave.saveNow();
              } else if (restored === 'legacy-trial') {
                legacyTrialPrompt(saved);
              } else {
                autosave.clear();
                showStart();
              }
            },
            onRestart: () => {
              autosave.clear();
              showStart();
            },
          });
        }
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
