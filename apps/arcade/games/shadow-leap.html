<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="影跃：忍者无尽上跳平台游戏，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <title>影跃 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#e0567f; --card-accent:#e0567f">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html">‹ 街机厅</a>
      <h1 class="game-title">🥷 影跃</h1>
      <div class="game-hud">
        <span>高度 <strong data-hud-score>0</strong>m</span>
        <span>最高 <strong data-hud-high>0</strong>m</span>
      </div>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="影跃游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>影跃</h2>
            <p data-ov-text>忍者无尽上跳</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
          </div>
        </div>
      </div>
    </div>
    <p class="game-hint">←→ / A D 或触摸左右半屏移动 · 触墙反弹 · P 或 Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const GRAVITY = 1500;
      const JUMP_V = -640;
      const MAX_FALL = 900;

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        mute: document.querySelector('[data-mute]'),
      };

      const particles = A.createParticles();

      const player = { x: W / 2 - 13, y: H - 120, w: 26, h: 30, vx: 0, vy: 0, face: 1, prevBottom: 0, jumpTimer: 0 };
      let platforms = [];
      let camY = 0;          /* 相机：屏幕顶部的世界坐标 */
      let topY = 0;          /* 本局到达的最高点（世界坐标，越小越高） */
      let state = 'ready';
      let recordSaved = false;
      let score = 0;
      let hintTimer = 0;

      const high = A.Progress.get('shadow-leap').high;
      dom.hudHigh.textContent = String(high);

      function worldToScreenY(y) {
        return y - camY;
      }

      /* ---------- 平台生成 ---------- */
      function makePlatform(x, y, kind) {
        const w = kind === 'fragile' ? rand(70, 96) : rand(78, 112);
        return {
          x: clamp(x, 6, W - w - 6),
          y,
          w,
          h: 12,
          kind: kind || 'normal',
          dir: Math.random() > 0.5 ? 1 : -1,
          speed: rand(40, 80),
          broken: false,
          breakTimer: 0,
          phase: rand(0, TAU),
        };
      }

      function platformChance(y) {
        /* 越高越容易出现移动 / 易碎平台 */
        const t = clamp(-y / 12000, 0, 1);
        const r = Math.random();
        if (r < 0.06 + t * 0.10) return 'fragile';
        if (r < 0.16 + t * 0.24) return 'moving';
        return 'normal';
      }

      function ensurePlatforms() {
        /* 从最高平台上方持续补平台，直到超过生成线 */
        let highest = platforms.length ? platforms[platforms.length - 1].y : camY + H;
        const genLine = camY - 80;
        while (highest > genLine) {
          const gap = rand(68, 118);
          const y = highest - gap;
          const x = rand(6, W - 100);
          platforms.push(makePlatform(x, y, platformChance(y)));
          highest = y;
        }
        /* 清理掉出屏幕下方的平台 */
        while (platforms.length && platforms[0].y > camY + H + 40) platforms.shift();
      }

      /* ---------- 流程 ---------- */
      function reset() {
        platforms = [];
        camY = 0;
        topY = 0;
        score = 0;
        recordSaved = false;
        player.x = W / 2 - player.w / 2;
        player.y = H - 160;
        player.vx = 0;
        player.vy = 0;
        player.face = 1;
        particles.clear();
        /* 起始大地面 */
        platforms.push({ x: 40, y: H - 60, w: W - 80, h: 12, kind: 'normal', dir: 1, speed: 0, broken: false, breakTimer: 0, phase: 0 });
        let y = H - 60;
        while (y > -80) {
          y -= rand(68, 110);
          platforms.push(makePlatform(rand(6, W - 110), y, 'normal'));
        }
        syncHud();
      }

      function syncHud() {
        dom.hudScore.textContent = String(score);
      }

      function showOverlay(title, text, btn, onBtn) {
        dom.ovTitle.textContent = title;
        dom.ovText.innerHTML = text;
        dom.ovBtn.textContent = btn;
        dom.overlay.hidden = false;
        dom.ovBtn.onclick = () => {
          A.Sfx.play('ui');
          onBtn();
        };
      }

      function startGame() {
        reset();
        state = 'playing';
        dom.overlay.hidden = true;
        loop.resume();
      }

      function gameOver() {
        state = 'over';
        A.Sfx.play('over');
        if (!recordSaved) {
          const rec = A.Progress.recordPlay('shadow-leap', score);
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
          loop.pause();
          showOverlay(
            '坠落',
            `<span class="ac-score">${score}m</span>` +
              (rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
              `攀升高度 · 最高 ${Math.max(high, score)}m`,
            '再来一局',
            startGame
          );
          return;
        }
        loop.pause();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        showOverlay('已暂停', '影子随时待命。', '继续', () => {
          state = 'playing';
          dom.overlay.hidden = true;
          loop.resume();
        });
      }

      /* ---------- 更新 ---------- */
      function update(dt) {
        particles.update(dt);
        hintTimer = Math.max(0, hintTimer - dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }

        /* 水平控制 */
        const ACC = 2400;
        const MAX_VX = 265;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) {
          dir = input.pointer.x < W / 2 ? -1 : 1;
        }
        if (dir !== 0) {
          player.vx += dir * ACC * dt;
          player.face = dir;
        } else {
          player.vx -= player.vx * Math.min(1, 12 * dt);
        }
        player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
        player.x += player.vx * dt;

        /* 触墙反弹（保留速度） */
        if (player.x < -player.w / 2) {
          player.x = -player.w / 2;
          player.vx = Math.abs(player.vx) * 0.95;
        } else if (player.x > W - player.w / 2) {
          player.x = W - player.w / 2;
          player.vx = -Math.abs(player.vx) * 0.95;
        }

        /* 重力 */
        player.prevBottom = player.y + player.h;
        player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
        player.y += player.vy * dt;

        /* 平台行为 */
        platforms.forEach((p) => {
          if (p.kind === 'moving') {
            p.x += p.dir * p.speed * dt;
            if (p.x < 4) {
              p.x = 4;
              p.dir = 1;
            } else if (p.x + p.w > W - 4) {
              p.x = W - 4 - p.w;
              p.dir = -1;
            }
          }
          if (p.broken) {
            p.breakTimer -= dt;
          }
        });
        platforms = platforms.filter((p) => !(p.broken && p.breakTimer <= 0));

        /* 单向平台着陆 */
        for (const p of platforms) {
          if (p.broken) continue;
          if (A.Physics.oneWayLanding(player, player.prevBottom, p)) {
            player.y = p.y - player.h;
            player.vy = JUMP_V;
            A.Sfx.play('jump');
            particles.emit(player.x + player.w / 2, player.y + player.h, {
              count: A.reducedMotion ? 3 : 7,
              speed: [20, 90],
              angle: [Math.PI * 0.15, Math.PI * 0.85],
              life: [0.2, 0.45],
              size: [1.5, 3],
              colors: ['#e0567f', '#ffffff'],
              gravity: 300,
            });
            if (p.kind === 'fragile') {
              p.broken = true;
              p.breakTimer = 0.22;
              A.Sfx.play('hit');
            }
            break;
          }
        }

        /* 相机跟随：玩家越过中线以上时上移 */
        const line = camY + H * 0.42;
        if (player.y < line) {
          camY -= line - player.y;
        }

        /* 分数 = 最大攀升高度（米） */
        if (player.y < topY) {
          topY = player.y;
          const meters = Math.floor(-topY / 10);
          if (meters > score) {
            score = meters;
            syncHud();
          }
        }

        ensurePlatforms();

        /* 掉出底部 */
        if (player.y > camY + H + 30) gameOver();
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      function drawPlatform(p) {
        const y = worldToScreenY(p.y);
        if (y < -20 || y > H + 20) return;
        ctx.save();
        if (p.kind === 'normal') {
          ctx.fillStyle = '#3b466f';
          A.draw.roundRect(ctx, p.x, y, p.w, p.h, 5);
          ctx.fill();
          ctx.fillStyle = '#93a0c8';
          ctx.fillRect(p.x + 3, y + 2, p.w - 6, 2);
        } else if (p.kind === 'moving') {
          ctx.fillStyle = '#8a4bd3';
          A.draw.roundRect(ctx, p.x, y, p.w, p.h, 5);
          ctx.fill();
          ctx.fillStyle = '#e6ccff';
          ctx.fillRect(p.x + 3, y + 2, p.w - 6, 2);
          /* 侧向小箭头指示 */
          ctx.fillStyle = 'rgba(230,204,255,0.8)';
          const ax = p.dir > 0 ? p.x + p.w - 8 : p.x + 4;
          ctx.beginPath();
          ctx.moveTo(ax, y + p.h / 2);
          ctx.lineTo(ax + p.dir * 5, y + p.h / 2 - 3);
          ctx.lineTo(ax + p.dir * 5, y + p.h / 2 + 3);
          ctx.closePath();
          ctx.fill();
        } else {
          /* fragile */
          ctx.strokeStyle = '#cfd8f2';
          ctx.lineWidth = 2;
          ctx.setLineDash(p.broken ? [3, 5] : []);
          A.draw.roundRect(ctx, p.x, y, p.w, p.h, 5);
          ctx.stroke();
          ctx.setLineDash([]);
          if (!p.broken) {
            ctx.strokeStyle = 'rgba(207,216,242,0.6)';
            ctx.beginPath();
            ctx.moveTo(p.x + p.w * 0.3, y + 2);
            ctx.lineTo(p.x + p.w * 0.42, y + p.h - 2);
            ctx.lineTo(p.x + p.w * 0.55, y + 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawNinja() {
        const y = worldToScreenY(player.y);
        ctx.save();
        ctx.translate(player.x + player.w / 2, y + player.h / 2);
        const squash = clamp(1 - player.vy / -2600, 0.82, 1.18);
        ctx.scale(player.face >= 0 ? 1 : -1, 1);
        /* 身体 */
        ctx.fillStyle = '#232842';
        A.draw.roundRect(ctx, -9, -12 * squash, 18, 22 * squash, 6);
        ctx.fill();
        /* 围巾 */
        ctx.fillStyle = '#e0567f';
        const flutter = Math.sin(performance.now() / 90) * 3;
        ctx.beginPath();
        ctx.moveTo(-8, -8 * squash);
        ctx.lineTo(-20 - Math.abs(player.vx) * 0.02, -4 + flutter);
        ctx.lineTo(-8, -3 * squash);
        ctx.closePath();
        ctx.fill();
        /* 头 / 面罩 */
        ctx.fillStyle = '#2c3352';
        A.draw.roundRect(ctx, -8, -22 * squash, 16, 13, 5);
        ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(-1, -18 * squash, 7, 3.4);
        /* 束带 */
        ctx.fillStyle = '#e0567f';
        ctx.fillRect(-9, 2 * squash, 18, 3);
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        /* 背景：夜色渐变 + 远山视差 */
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#170f2e');
        bg.addColorStop(0.6, '#1d1638');
        bg.addColorStop(1, '#28143c');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        /* 远景月亮 */
        ctx.fillStyle = 'rgba(255,236,180,0.9)';
        ctx.beginPath();
        ctx.arc(340, 110, 30, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(23,15,46,0.55)';
        ctx.beginPath();
        ctx.arc(328, 100, 26, 0, TAU);
        ctx.fill();

        /* 视差远山 */
        const par = (camY * 0.25) % (H + 200);
        ctx.fillStyle = 'rgba(12,10,30,0.8)';
        for (let k = -1; k < 2; k++) {
          const baseY = k * (H + 200) + par + H;
          ctx.beginPath();
          ctx.moveTo(0, baseY);
          ctx.lineTo(80, baseY - 130);
          ctx.lineTo(190, baseY - 40);
          ctx.lineTo(300, baseY - 170);
          ctx.lineTo(420, baseY - 60);
          ctx.lineTo(420, baseY + 200);
          ctx.lineTo(0, baseY + 200);
          ctx.closePath();
          ctx.fill();
        }

        /* 高度标尺（每 50m 一条虚线） */
        const meterLines = 20;
        ctx.strokeStyle = 'rgba(147,160,200,0.14)';
        ctx.lineWidth = 1;
        for (let m = Math.floor(-camY / 500) * 5; m < Math.floor((-camY + H) / 500) * 5 + 10; m += 5) {
          const y = worldToScreenY(-m * 100);
          if (y < -10 || y > H + 10) continue;
          ctx.setLineDash([4, 8]);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
          ctx.setLineDash([]);
          if (m > 0 && m % meterLines === 0) {
            A.draw.label(ctx, m * 10 + 'm', W - 8, y - 8, {
              align: 'right',
              font: '10px system-ui, sans-serif',
              color: 'rgba(147,160,200,0.4)',
            });
          }
        }

        platforms.forEach(drawPlatform);
        particles.draw(ctx);
        if (state === 'playing' || state === 'paused' || state === 'ready') drawNinja();

        A.draw.label(ctx, score + 'm', W / 2, 46, {
          font: 'bold 30px system-ui, sans-serif',
          color: 'rgba(255,255,255,0.14)',
        });
      }

      /* ---------- 输入与循环 ---------- */
      window.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
          if (state === 'playing') pauseByUser();
        }
      });

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      showOverlay('影跃', '无尽上跳：踩平台起跳，触墙反弹。<br/>紫色平台会移动 · 白色平台踩一次就碎', '开始游戏', startGame);
      loop.start();
    })();
  </script>
</body>
</html>
