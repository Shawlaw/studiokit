<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="贪吃蛇：吃果实变长，速度逐渐加快并出现障碍，支持方向键 / 滑动与局内进度恢复，竖屏街机小游戏。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/snake-run.js"></script>
  <style>
    /* 0.9 挑战模式页面局部微调：挑战层覆盖舞台，面板/提示/返回可滚动且不横向溢出 */
    .challenge-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; background: rgba(8, 13, 28, 0.96); border-radius: inherit; }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-btn[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud { position: absolute; left: 8px; right: 8px; top: 8px; width: auto; z-index: 4; pointer-events: none; }
  </style>
  <title>贪吃蛇 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#66d36e; --card-accent:#66d36e">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🐍 贪吃蛇</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="贪吃蛇游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>贪吃蛇</h2>
            <p data-ov-text>吃果实，别咬到自己</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <div class="touch-pad game-tools" data-game-tools aria-label="主动道具（快捷键 1 / 2）">
      <button type="button" class="touch-btn" data-joy-tool="slow" aria-label="慢速泡泡 6 秒，剩余 2 次（快捷键 1）" title="慢速泡泡（1）：6 秒内每格间隔增加 0.06 秒">
        <span aria-hidden="true">🫧</span><span>慢速</span><span data-joy-count aria-hidden="true">2</span>
      </button>
      <button type="button" class="touch-btn" data-joy-tool="trim" aria-label="轻身剪，剩余 1 次（快捷键 2）" title="轻身剪（2）：去掉尾巴 6 节，最短保留 3 节，不扣分">
        <span aria-hidden="true">✂</span><span>轻身</span><span data-joy-count aria-hidden="true">1</span>
      </button>
    </div>
    <p class="game-hint">方向键 / WASD 或滑动转向 · 道具 1/2 · 吃满 20 个果实丰收收局 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const N = 18;
      const CELL = 18;
      const BOARD = N * CELL;
      const BOARD_X = (W - BOARD) / 2;
      const BOARD_Y = 190;

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        joySlow: document.querySelector('[data-joy-tool="slow"]'),
        joyTrim: document.querySelector('[data-joy-tool="trim"]'),
      };
      const ui = A.createOverlayUi(dom);
      const particles = A.createParticles();

      /* ---------- 0.9 挑战模式：数据/记录/选关 UI（A.Challenge 由 engine.js 提供） ---------- */
      const gameId = 'snake-run';
      const challengeData = A.Challenge ? A.Challenge.stages(gameId) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      const DIRS = { U: { x: 0, y: -1 }, D: { x: 0, y: 1 }, L: { x: -1, y: 0 }, R: { x: 1, y: 0 } };
      const DIR_KEYS = { ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 } };
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chElapsed = 0;
      let chSteps = 0;
      let chFruitIndex = 0;
      let chFruitsEaten = 0;
      let chAssisted = false;
      let chErrorReason = '';
      let chLastResult = null;
      let chDirQueue = [];
      let chGoalHintTimer = 0;
      let chHudSecond = -1;
      let chSwipeStart = null;

      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = null;
      let golden = null;
      let goldenTimer = 0;
      let obstacles = [];
      let score = 0;
      let foodsEaten = 0;
      let lives = 3;
      let stepTimer = 0;
      let stepInterval = 0.19;
      let stun = 0;
      let invul = 0;
      let state = 'ready';
      let recordSaved = false;
      let swipeStart = null;
      let keyWasDown = {};
      const JOY_GOAL_FOODS = 20;
      const SLOW_SECONDS = 6;
      const SLOW_INTERVAL = 0.06;
      const tools = { slow: 2, trim: 1 };
      let slowTimer = 0;
      /* 旧版无尽档缺少该字段时保持原玩法，不被 20 果实丰收强制收尾。 */
      let shortRun = true;
      let joyLastResult = null;

      let high = A.Progress.get('snake-run').high;
      dom.hudHigh.textContent = String(high);

      function cellFree(x, y) {
        if (x < 0 || y < 0 || x >= N || y >= N) return false;
        if (snake.some((s) => s.x === x && s.y === y)) return false;
        if (food && food.x === x && food.y === y) return false;
        if (golden && golden.x === x && golden.y === y) return false;
        if (obstacles.some((o) => o.x === x && o.y === y)) return false;
        return true;
      }

      function randomFreeCell() {
        for (let tries = 0; tries < 200; tries++) {
          const x = randInt(0, N - 1);
          const y = randInt(0, N - 1);
          if (cellFree(x, y)) return { x, y };
        }
        return null;
      }

      function spawnFood() {
        const cell = randomFreeCell();
        if (cell) food = cell;
      }

      function spawnGolden() {
        const cell = randomFreeCell();
        if (cell) golden = { ...cell, phase: 0 };
        goldenTimer = 6;
      }

      function addObstacles(count) {
        for (let i = 0; i < count; i++) {
          const cell = randomFreeCell();
          if (cell) obstacles.push(cell);
        }
      }

      function effectiveStepInterval() {
        return stepInterval + (slowTimer > 0 ? SLOW_INTERVAL : 0);
      }

      function syncJoyTools() {
        if (!dom.joySlow || !dom.joyTrim) return;
        dom.joySlow.querySelector('[data-joy-count]').textContent = String(tools.slow);
        dom.joyTrim.querySelector('[data-joy-count]').textContent = String(tools.trim);
        dom.joySlow.disabled = state !== 'playing' || slowTimer > 0 || tools.slow <= 0;
        dom.joyTrim.disabled = state !== 'playing' || snake.length <= 3 || tools.trim <= 0;
        dom.joySlow.setAttribute('aria-pressed', String(slowTimer > 0));
        dom.joySlow.setAttribute('aria-label', slowTimer > 0
          ? '慢速泡泡生效中，剩余 ' + slowTimer.toFixed(1) + ' 秒'
          : '慢速泡泡 6 秒，剩余 ' + tools.slow + ' 次（快捷键 1）');
        dom.joyTrim.setAttribute('aria-label', '轻身剪，剩余 ' + tools.trim + ' 次（快捷键 2）；当前长度 ' + snake.length);
      }

      function activateJoyTool(id) {
        if (state !== 'playing') return false;
        if (id === 'slow') {
          if (slowTimer > 0 || tools.slow <= 0) return false;
          tools.slow -= 1;
          slowTimer = SLOW_SECONDS;
          if (mode === 'challenge') chAssisted = true;
          stepTimer = Math.min(stepTimer, effectiveStepInterval());
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        if (id === 'trim') {
          if (snake.length <= 3 || tools.trim <= 0) return false;
          tools.trim -= 1;
          snake.length = Math.max(3, snake.length - 6);
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('spring');
          particles.emit(BOARD_X + snake[0].x * CELL + CELL / 2, BOARD_Y + snake[0].y * CELL + CELL / 2, {
            count: A.reducedMotion ? 4 : 12,
            speed: [30, 130], life: [0.2, 0.5], size: [2, 4],
            colors: ['#66d36e', '#ffffff'],
          });
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        return false;
      }

      function clickJoyTool(id) {
        const button = document.querySelector('[data-joy-tool="' + id + '"]');
        if (!button) return false;
        joyLastResult = null;
        button.click();
        return joyLastResult === true;
      }

      function bindJoyTools() {
        document.querySelectorAll('[data-joy-tool]').forEach((button) => {
          button.addEventListener('click', () => {
            joyLastResult = activateJoyTool(button.dataset.joyTool);
          });
        });
        window.addEventListener('keydown', (e) => {
          if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
          const target = e.target;
          if (target && target.tagName) {
            const tag = target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
          }
          const id = { '1': 'slow', '2': 'trim' }[e.key];
          if (!id) return;
          e.preventDefault();
          clickJoyTool(id);
        });
      }

      function resetSnake() {
        snake = [
          { x: Math.floor(N / 2), y: Math.floor(N / 2) },
          { x: Math.floor(N / 2) - 1, y: Math.floor(N / 2) },
          { x: Math.floor(N / 2) - 2, y: Math.floor(N / 2) },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        stepTimer = 0;
      }

      function reset() {
        obstacles = [];
        score = 0;
        foodsEaten = 0;
        lives = 3;
        stepInterval = 0.19;
        stun = 0;
        invul = 0;
        golden = null;
        goldenTimer = 0;
        tools.slow = 2;
        tools.trim = 1;
        slowTimer = 0;
        shortRun = true;
        recordSaved = false;
        swipeStart = null;
        resetSnake();
        food = null;
        spawnFood();
        particles.clear();
        syncHud();
        syncJoyTools();
      }

      function syncHud() {
        dom.hudScore.textContent = String(score);
      }

      function startGame() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
      }

      function finish(won) {
        if (state === 'over') return;
        const wonRun = won === true;
        state = 'over';
        autosave.clear();
        A.Sfx.play(wonRun ? 'perfect' : 'over');
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('snake-run', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          title: wonRun ? '果园丰收！' : '游戏结束',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `吃到 ${foodsEaten} 个果实 · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync();
        syncJoyTools();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        const opts = { title: '已暂停', text: '蛇停住了。<br/>局内进度已保存，可以随时离开。', btn: '继续', onBtn: resumeGame };
        if (mode === 'challenge') {
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        }
        ui.show(opts);
        pauseUi.sync();
        syncJoyTools();
      }

      function showStart() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        ui.show({
          title: '贪吃蛇',
          text: '吃果实变长，别撞墙、别咬到自己。<br/>道具 1/2 主动使用 · 吃满 20 个果实丰收收局<br/>生命 ×3 · 支持方向键 / 滑动',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeAvailable ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      function loseLife() {
        if (invul > 0) return;
        lives -= 1;
        invul = 1.4;
        stun = 0.9;
        A.Sfx.play('explode');
        particles.emit(BOARD_X + snake[0].x * CELL + CELL / 2, BOARD_Y + snake[0].y * CELL + CELL / 2, {
          count: A.reducedMotion ? 8 : 20,
          speed: [40, 200],
          life: [0.25, 0.6],
          size: [2, 4],
          colors: ['#66d36e', '#ff5d7a', '#ffffff'],
          gravity: 100,
        });
        if (lives <= 0) {
          finish(false);
          return;
        }
        resetSnake();
        obstacles = obstacles.filter((o) => Math.abs(o.x - Math.floor(N / 2)) > 4 || Math.abs(o.y - Math.floor(N / 2)) > 4);
        food = null;
        golden = null;
        spawnFood();
      }

      function stepSnake() {
        dir = nextDir;
        const head = snake[0];
        const nx = head.x + dir.x;
        const ny = head.y + dir.y;

        if (nx < 0 || ny < 0 || nx >= N || ny >= N) {
          loseLife();
          return;
        }
        if (obstacles.some((o) => o.x === nx && o.y === ny)) {
          loseLife();
          return;
        }
        const bodyLimit = snake.length - 1;
        for (let i = 0; i < bodyLimit; i++) {
          if (snake[i].x === nx && snake[i].y === ny) {
            loseLife();
            return;
          }
        }

        snake.unshift({ x: nx, y: ny });
        let ate = false;
        if (food && food.x === nx && food.y === ny) {
          score += 10;
          foodsEaten += 1;
          ate = true;
          A.Sfx.play('bell', Math.min(foodsEaten, 12));
          spawnFood();
          if (foodsEaten % 5 === 0) spawnGolden();
          if (foodsEaten % 5 === 0) addObstacles(2);
          stepInterval = Math.max(0.085, 0.19 - foodsEaten * 0.006);
        }
        if (golden && golden.x === nx && golden.y === ny) {
          score += 30;
          foodsEaten += 1;
          ate = true;
          golden = null;
          A.Sfx.play('perfect');
          particles.emit(BOARD_X + nx * CELL + CELL / 2, BOARD_Y + ny * CELL + CELL / 2, {
            count: A.reducedMotion ? 6 : 16,
            speed: [30, 160],
            life: [0.25, 0.6],
            size: [2, 4],
            colors: ['#ffd23f', '#fff3c4', '#ffffff'],
            gravity: 120,
          });
        }
        if (!ate) snake.pop();
        syncHud();
        syncJoyTools();
        if (shortRun && foodsEaten >= JOY_GOAL_FOODS) finish(true);
      }

      function handleSwipe(dx, dy) {
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
        const want = Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 };
        if (want.x === -dir.x && want.y === -dir.y) return;
        nextDir = want;
      }

      function normalizeDir(value) {
        if (!value || !isFinite(value.x) || !isFinite(value.y)) return null;
        if (Math.abs(value.x) >= Math.abs(value.y)) return { x: value.x >= 0 ? 1 : -1, y: 0 };
        return { x: 0, y: value.y >= 0 ? 1 : -1 };
      }

      function update(dt) {
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        particles.update(dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        if (shortRun && foodsEaten >= JOY_GOAL_FOODS) {
          finish(true);
          input.endFrame();
          return;
        }
        const hadSlow = slowTimer > 0;
        slowTimer = Math.max(0, slowTimer - dt);
        if (hadSlow && slowTimer <= 0) {
          stepTimer = Math.min(stepTimer, stepInterval);
          syncJoyTools();
        }
        stun = Math.max(0, stun - dt);
        invul = Math.max(0, invul - dt);
        if (goldenTimer > 0) {
          goldenTimer -= dt;
          if (goldenTimer <= 0) golden = null;
        }

        const keys = { left: ['ArrowLeft', 'a'], right: ['ArrowRight', 'd'], up: ['ArrowUp', 'w'], down: ['ArrowDown', 's'] };
        Object.keys(keys).forEach((key) => {
          const down = input.isDown(...keys[key]);
          if (down && !keyWasDown[key]) {
            const want = { left: { x: -1, y: 0 }, right: { x: 1, y: 0 }, up: { x: 0, y: -1 }, down: { x: 0, y: 1 } }[key];
            if (!(want.x === -dir.x && want.y === -dir.y)) nextDir = want;
          }
          keyWasDown[key] = down;
        });
        if (input.pointer.wentDown) swipeStart = { x: input.pointer.x, y: input.pointer.y };
        if (input.pointer.wentUp && swipeStart) {
          handleSwipe(input.pointer.x - swipeStart.x, input.pointer.y - swipeStart.y);
          swipeStart = null;
        }

        if (stun <= 0) {
          const interval = effectiveStepInterval();
          stepTimer += dt;
          while (stepTimer >= interval) {
            stepTimer -= interval;
            stepSnake();
            if (state !== 'playing') break;
          }
        }
        input.endFrame();
      }

      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: mode === 'challenge' && chStage ? chStage.id : null,
          chElapsed,
          chSteps,
          chFruitIndex,
          chFruitsEaten,
          chAssisted,
          dirQueue: chDirQueue.map((item) => ({ x: item.x, y: item.y })),
          snake: snake.map((s) => ({ x: s.x, y: s.y })),
          dir,
          nextDir,
          food,
          golden: golden ? { x: golden.x, y: golden.y } : null,
          goldenTimer,
          obstacles: obstacles.map((o) => ({ x: o.x, y: o.y })),
          score,
          foodsEaten,
          lives,
          stepTimer,
          stepInterval,
          stun,
          invul,
          tools: { slow: tools.slow, trim: tools.trim },
          slowTimer,
          shortRun,
        };
      }

      function restoreClassic(data) {
        if (!data || !Array.isArray(data.snake) || data.snake.length < 2) return false;
        try {
          reset();
          snake = data.snake
            .filter((s) => s && Number.isInteger(s.x) && Number.isInteger(s.y) && s.x >= 0 && s.y >= 0 && s.x < N && s.y < N)
            .map((s) => ({ x: s.x, y: s.y }));
          if (snake.length < 2) return false;
          dir = normalizeDir(data.dir) || { x: 1, y: 0 };
          nextDir = normalizeDir(data.nextDir) || { ...dir };
          food = data.food && Number.isInteger(data.food.x) ? { x: data.food.x, y: data.food.y } : null;
          golden = data.golden && Number.isInteger(data.golden.x) ? { x: data.golden.x, y: data.golden.y, phase: 0 } : null;
          goldenTimer = Math.max(0, Number(data.goldenTimer) || 0);
          obstacles = Array.isArray(data.obstacles)
            ? data.obstacles.filter((o) => o && Number.isInteger(o.x) && Number.isInteger(o.y) && o.x >= 0 && o.y >= 0 && o.x < N && o.y < N).map((o) => ({ x: o.x, y: o.y }))
            : [];
          score = Math.max(0, Number(data.score) || 0);
          foodsEaten = Math.max(0, Number(data.foodsEaten) || 0);
          lives = clamp(Number(data.lives) || 3, 1, 3);
          stepTimer = Number(data.stepTimer) || 0;
          stepInterval = clamp(Number(data.stepInterval) || 0.19, 0.08, 0.25);
          stun = Math.max(0, Number(data.stun) || 0);
          invul = Math.max(0, Number(data.invul) || 0);
          if (data.tools && typeof data.tools === 'object') {
            tools.slow = Number.isFinite(Number(data.tools.slow)) ? clamp(Math.floor(Number(data.tools.slow)), 0, 2) : 2;
            tools.trim = Number.isFinite(Number(data.tools.trim)) ? clamp(Math.floor(Number(data.tools.trim)), 0, 1) : 1;
          }
          slowTimer = clamp(Number(data.slowTimer) || 0, 0, SLOW_SECONDS);
          shortRun = data.shortRun === true;
          recordSaved = false;
          state = 'playing';
          syncHud();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      /* 统一恢复入口：0.8 及更早存档缺 mode 一律按经典恢复；mode:'challenge' 走挑战恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      const autosave = A.createRunAutosave('snake-run', serialize, {
        every: 3,
        meta: () => ({
          score,
          summary: mode === 'challenge' && chStage ? '挑战 ' + chStage.id + ' · 果实 ' + chFruitsEaten + '/' + chWinCount() : `得分 ${score} · 长度 ${snake.length} · 生命 ${lives}`,
        }),
      });

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }

      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(gameId);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }

      function showChallengePanel() {
        if (!challengeAvailable) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        if (chDom.back) chDom.back.hidden = false;
        loop.pause();
        state = 'challenge-menu';
        pauseUi.sync();
      }

      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        if (chDom.back) chDom.back.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }

      function backToStartFromPanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        showStart();
        pauseUi.sync();
        syncJoyTools();
      }

      function chFruitTotal() {
        return chStage && chStage.content && Array.isArray(chStage.content.fruitQueue) ? chStage.content.fruitQueue.length : 0;
      }

      function chWinCount() {
        const win = chStage && chStage.content && chStage.content.win;
        const count = win && Number(win.fruitCount);
        return Number.isFinite(count) && count > 0 ? count : chFruitTotal();
      }

      /* 固定地图挑战：从 stage.content 构建蛇/墙/脚本果实，不随机、不加速、无金果实。 */
      function buildChallengeStage(index) {
        const stage = challengeData[index];
        if (!stage) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = index;
        const content = stage.content || {};
        const initSnake = Array.isArray(content.initialSnake) ? content.initialSnake : [[3, 3], [2, 3], [1, 3]];
        snake = initSnake.map((cell) => ({ x: Number(cell[0]), y: Number(cell[1]) }));
        dir = Object.assign({}, DIRS[content.initialDirection] || { x: 1, y: 0 });
        nextDir = Object.assign({}, dir);
        chDirQueue = [];
        obstacles = (Array.isArray(content.walls) ? content.walls : []).map((cell) => ({ x: Number(cell[0]), y: Number(cell[1]) }));
        golden = null;
        goldenTimer = 0;
        chFruitIndex = 0;
        chFruitsEaten = 0;
        chSteps = 0;
        chElapsed = 0;
        chAssisted = false;
        chErrorReason = '';
        chLastResult = null;
        chGoalHintTimer = 3;
        chHudSecond = -1;
        chSwipeStart = null;
        lives = 1;
        score = 0;
        foodsEaten = 0;
        stun = 0;
        invul = 0;
        shortRun = false;
        stepInterval = clamp((Number(content.stepIntervalMs) || 230) / 1000, 0.08, 0.6);
        stepTimer = 0;
        tools.slow = 2;
        tools.trim = 1;
        slowTimer = 0;
        const queue = Array.isArray(content.fruitQueue) ? content.fruitQueue : [];
        food = queue.length ? { x: Number(queue[0][0]), y: Number(queue[0][1]) } : null;
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) return;
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chElapsed);
        if (second === chHudSecond && state === 'playing') return;
        chHudSecond = second;
        const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0');
        chDom.hud.innerHTML =
          '<strong>' + chEsc(label + ' ' + chStage.title) + '</strong>' +
          '<span>' + chEsc(chStage.goalStatement || '') + '</span>' +
          '<span>果实 ' + chFruitsEaten + '/' + chWinCount() + '</span>' +
          '<span>用时 ' + A.Challenge.formatTime(chElapsed) + '</span>' +
          '<span>步数 ' + chSteps + '</span>';
      }

      function startChallenge(ref) {
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(gameId, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(gameId, stage.id)) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        state = 'playing';
        hideChallengePanel();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        syncChallengeHud();
        autosave.clear();
        autosave.saveNow();
        return true;
      }

      function queueChallengeDir(want) {
        if (mode !== 'challenge' || state !== 'playing') return false;
        const nd = normalizeDir(want);
        if (!nd) return false;
        const last = chDirQueue.length ? chDirQueue[chDirQueue.length - 1] : dir;
        if (nd.x === -last.x && nd.y === -last.y) return false;
        if (chDirQueue.length >= 2) return false;
        chDirQueue.push(nd);
        return true;
      }

      function challengeClear() {
        if (mode !== 'challenge' || !chStage) return false;
        state = 'cleared';
        chGoalHintTimer = 0;
        chDirQueue = [];
        autosave.clear();
        loop.pause();
        syncJoyTools();
        const result = { timeSec: Math.round(chElapsed * 10) / 10, assisted: chAssisted, collectibles: [] };
        chLastResult = result;
        if (A.Challenge) A.Challenge.markCleared(gameId, chStage.id, result);
        const isLast = chStageIndex >= challengeData.length - 1;
        const tip = '<p class="ac-challenge-tip">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>';
        ui.show({
          title: '挑战通关',
          text: A.Challenge.resultHtml(chStage, result) + tip,
          btn: isLast ? '返回选关' : '下一关',
          onBtn: () => {
            if (isLast) exitToChallengeSelect();
            else startChallenge(challengeData[chStageIndex + 1].id);
          },
          btn2: '重玩本关',
          onBtn2: () => startChallenge(chStage.id),
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        chErrorReason = reason || '本关失败';
        chDirQueue = [];
        autosave.clear();
        loop.pause();
        syncJoyTools();
        ui.show({
          title: '挑战失败',
          text:
            '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
            '<p class="ac-challenge-result-row">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>',
          btn: '重试本关',
          onBtn: () => startChallenge(chStage.id),
          btn2: '返回选关',
          onBtn2: exitToChallengeSelect,
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function stepChallenge() {
        if (state !== 'playing' || mode !== 'challenge') return;
        const queued = chDirQueue.shift();
        if (queued) dir = queued;
        const head = snake[0];
        const nx = head.x + dir.x;
        const ny = head.y + dir.y;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) {
          challengeFail('撞到边界墙：先看缺口再决定掉头或绕行');
          return;
        }
        if (obstacles.some((o) => o.x === nx && o.y === ny)) {
          challengeFail('撞到石墙：缺口是唯一入口，提前把蛇头对准它');
          return;
        }
        for (let i = 0; i < snake.length - 1; i++) {
          if (snake[i].x === nx && snake[i].y === ny) {
            challengeFail('咬到自己的身体：长蛇转弯要先给自己留出空间');
            return;
          }
        }
        snake.unshift({ x: nx, y: ny });
        chSteps += 1;
        let ate = false;
        if (food && food.x === nx && food.y === ny) {
          ate = true;
          chFruitsEaten += 1;
          chFruitIndex += 1;
          A.Sfx.play('bell', Math.min(chFruitsEaten, 12));
          if (chFruitIndex >= chWinCount()) {
            food = null;
            challengeClear();
            return;
          }
          const queue = chStage.content.fruitQueue;
          food = { x: Number(queue[chFruitIndex][0]), y: Number(queue[chFruitIndex][1]) };
        }
        if (!ate) snake.pop();
        syncHud();
        syncJoyTools();
        syncChallengeHud();
      }

      function updateChallenge(dt) {
        particles.update(dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chElapsed += dt;
        chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
        const hadSlow = slowTimer > 0;
        slowTimer = Math.max(0, slowTimer - dt);
        if (hadSlow && slowTimer <= 0) syncJoyTools();
        Object.keys(DIR_KEYS).forEach((key) => {
          const down = input.isDown(key);
          if (down && !keyWasDown[key]) queueChallengeDir(DIR_KEYS[key]);
          keyWasDown[key] = down;
        });
        if (input.pointer.wentDown) chSwipeStart = { x: input.pointer.x, y: input.pointer.y };
        if (input.pointer.wentUp && chSwipeStart) {
          const dx = input.pointer.x - chSwipeStart.x;
          const dy = input.pointer.y - chSwipeStart.y;
          if (Math.abs(dx) >= 20 || Math.abs(dy) >= 20) {
            queueChallengeDir(Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 });
          }
          chSwipeStart = null;
        }
        const interval = effectiveStepInterval();
        stepTimer += dt;
        let guard = 0;
        while (stepTimer >= interval && guard < 6) {
          stepTimer -= interval;
          stepChallenge();
          guard += 1;
          if (state !== 'playing') break;
        }
        syncChallengeHud();
        input.endFrame();
      }

      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chLastResult = null;
        chErrorReason = '';
        chDirQueue = [];
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showChallengePanel();
        return true;
      }

      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chDirQueue = [];
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showStart();
        return true;
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(gameId, data.stageId);
        if (!stage) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        const savedSnake = Array.isArray(data.snake) ? data.snake.filter((cell) => cell && Number.isInteger(cell.x) && Number.isInteger(cell.y)) : [];
        if (savedSnake.length < 2) return false;
        snake = savedSnake.map((cell) => ({ x: cell.x, y: cell.y }));
        dir = normalizeDir(data.dir) || { x: 1, y: 0 };
        chDirQueue = Array.isArray(data.dirQueue) ? data.dirQueue.map((item) => normalizeDir(item)).filter(Boolean).slice(0, 2) : [];
        chFruitIndex = clamp(Number(data.chFruitIndex) || 0, 0, Math.max(0, chWinCount() - 1));
        chFruitsEaten = clamp(Number(data.chFruitsEaten) || 0, 0, chWinCount());
        chSteps = Math.max(0, Number(data.chSteps) || 0);
        chElapsed = Math.max(0, Number(data.chElapsed) || 0);
        chAssisted = !!data.chAssisted;
        chLastResult = null;
        chErrorReason = '';
        chHudSecond = -1;
        stepTimer = Math.max(0, Number(data.stepTimer) || 0);
        const queue = chStage.content.fruitQueue;
        food = queue.length > chFruitIndex ? { x: Number(queue[chFruitIndex][0]), y: Number(queue[chFruitIndex][1]) } : null;
        state = 'playing';
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function challengeObservable() {
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageNumber: chStage ? chStage.stageNumber : null,
          state,
          snake: snake.map((cell) => ({ x: cell.x, y: cell.y })),
          dir: { x: dir.x, y: dir.y },
          dirQueue: chDirQueue.map((item) => ({ x: item.x, y: item.y })),
          food: food ? { x: food.x, y: food.y } : null,
          walls: obstacles.map((cell) => ({ x: cell.x, y: cell.y })),
          fruitIndex: chFruitIndex,
          fruitTotal: chWinCount(),
          fruitsEaten: chFruitsEaten,
          steps: chSteps,
          stepIntervalMs: Math.round(stepInterval * 1000),
          elapsedSec: Math.round(chElapsed * 10) / 10,
          assisted: chAssisted,
          errorReason: chErrorReason,
          cleared: !!chLastResult,
        };
      }

      function drawSnake() {
        snake.forEach((s, i) => {
          const x = BOARD_X + s.x * CELL;
          const y = BOARD_Y + s.y * CELL;
          const isHead = i === 0;
          const t = i / Math.max(1, snake.length);
          ctx.fillStyle = isHead ? '#9bf0a4' : `hsl(${128 + t * 16}, ${58 - t * 20}%, ${54 - t * 16}%)`;
          A.draw.roundRect(ctx, x + 1, y + 1, CELL - 2, CELL - 2, isHead ? 7 : 4);
          ctx.fill();
          if (isHead) {
            ctx.fillStyle = '#16351c';
            const ex = dir.x * 3;
            const ey = dir.y * 3;
            ctx.beginPath();
            ctx.arc(x + CELL / 2 + ex - 4, y + CELL / 2 + ey - 4, 2, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + CELL / 2 + ex + 4, y + CELL / 2 + ey - 4, 2, 0, TAU);
            ctx.fill();
          }
        });
      }

      function drawFood(item, isGolden) {
        const x = BOARD_X + item.x * CELL + CELL / 2;
        const y = BOARD_Y + item.y * CELL + CELL / 2;
        const pulse = 1 + Math.sin(performance.now() / 220) * 0.08;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(pulse, pulse);
        if (isGolden) {
          ctx.fillStyle = '#ffd23f';
          ctx.beginPath();
          for (let k = 0; k < 5; k++) {
            const ang = -Math.PI / 2 + (k * TAU) / 5;
            const px = Math.cos(ang) * 8;
            const py = Math.sin(ang) * 8;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
            const ang2 = ang + TAU / 10;
            ctx.lineTo(Math.cos(ang2) * 3.5, Math.sin(ang2) * 3.5);
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = '#ff5d6b';
          ctx.beginPath();
          ctx.arc(0, 1, 7, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#66d36e';
          ctx.beginPath();
          ctx.ellipse(2, -7, 4, 2.4, -0.5, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0a1810');
        bg.addColorStop(1, '#10251a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(8, 20, 14, 0.7)';
        A.draw.roundRect(ctx, BOARD_X - 8, BOARD_Y - 8, BOARD + 16, BOARD + 16, 14);
        ctx.fill();
        ctx.strokeStyle = 'rgba(102,211,110,0.25)';
        ctx.lineWidth = 2;
        ctx.strokeRect(BOARD_X - 2, BOARD_Y - 2, BOARD + 4, BOARD + 4);

        for (let x = 0; x <= N; x++) {
          ctx.strokeStyle = 'rgba(102,211,110,0.07)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(BOARD_X + x * CELL, BOARD_Y);
          ctx.lineTo(BOARD_X + x * CELL, BOARD_Y + BOARD);
          ctx.stroke();
        }
        for (let y = 0; y <= N; y++) {
          ctx.strokeStyle = 'rgba(102,211,110,0.07)';
          ctx.beginPath();
          ctx.moveTo(BOARD_X, BOARD_Y + y * CELL);
          ctx.lineTo(BOARD_X + BOARD, BOARD_Y + y * CELL);
          ctx.stroke();
        }

        obstacles.forEach((o) => {
          const x = BOARD_X + o.x * CELL;
          const y = BOARD_Y + o.y * CELL;
          ctx.fillStyle = '#4a5268';
          A.draw.roundRect(ctx, x + 1, y + 1, CELL - 2, CELL - 2, 4);
          ctx.fill();
          ctx.fillStyle = '#6b7590';
          ctx.fillRect(x + 4, y + 4, CELL - 8, 3);
        });

        if (food) drawFood(food, false);
        if (golden) drawFood(golden, true);
        drawSnake();
        particles.draw(ctx);

        if (mode === 'challenge' && chStage) {
          const chLabel = 'C' + String(chStage.stageNumber || 0).padStart(2, '0') + ' ' + chStage.title;
          A.draw.label(ctx, chLabel, 12, 24, { align: 'left', font: 'bold 14px system-ui', color: '#66d36e' });
          A.draw.label(ctx, '果实 ' + chFruitsEaten + '/' + chWinCount() + ' · 步数 ' + chSteps, W / 2, 24, {
            font: '12px system-ui',
            color: '#93a0c8',
          });
          A.draw.label(ctx, '用时 ' + A.Challenge.formatTime(chElapsed), W - 12, 24, { align: 'right', font: 'bold 14px system-ui', color: '#ffd23f' });
          if (chGoalHintTimer > 0) {
            A.draw.label(ctx, chStage.goalStatement || '', W / 2, 52, { font: '12px system-ui', color: '#ffe08a' });
          }
        } else {
          A.draw.label(ctx, 'SCORE ' + score, 12, 24, { align: 'left', font: 'bold 14px system-ui', color: '#ffd23f' });
          A.draw.label(ctx, '长度 ' + snake.length + ' · ' + (1 / stepInterval).toFixed(1) + ' 格/秒', W / 2, 24, {
            font: '12px system-ui',
            color: '#93a0c8',
          });
          for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#ff5d7a';
            ctx.beginPath();
            ctx.arc(W - 20 - i * 17, 24, 5, 0, TAU);
            ctx.fill();
          }
          if (invul > 0) {
            A.draw.label(ctx, '无敌 ' + invul.toFixed(1) + 's', W / 2, 52, { font: '12px system-ui', color: '#66d36e' });
          }
          if (goldenTimer > 0) {
            A.draw.label(ctx, '★ 金果实 ' + goldenTimer.toFixed(1) + 's', W / 2, 52, { font: '12px system-ui', color: '#ffd23f' });
          }
        }
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      bindJoyTools();
      syncChallengePanel();
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              state,
              score,
              foodsEaten,
              goal: JOY_GOAL_FOODS,
              length: snake.length,
              lives,
              stepInterval,
              slowTimer,
              tools: { slow: tools.slow, trim: tools.trim },
              golden: !!golden,
              food: food ? { x: food.x, y: food.y } : null,
            };
          },
          joyInfo() {
            return this.info();
          },
          useJoyTool(id) {
            return clickJoyTool(id);
          },
          growTo(length) {
            const target = clamp(Math.floor(Number(length) || 0), 3, 60);
            const tail = snake[snake.length - 1];
            while (snake.length < target) snake.push({ x: tail.x, y: tail.y });
            syncJoyTools();
            return snake.length;
          },
          eatNext() {
            const head = snake[0];
            const options = [dir, { x: 1, y: 0 }, { x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }];
            for (const d of options) {
              const nx = head.x + d.x;
              const ny = head.y + d.y;
              if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
              if (obstacles.some((o) => o.x === nx && o.y === ny)) continue;
              if (snake.slice(0, snake.length - 1).some((s) => s.x === nx && s.y === ny)) continue;
              dir = { ...d };
              nextDir = { ...d };
              food = { x: nx, y: ny };
              const before = foodsEaten;
              stepSnake();
              return foodsEaten > before;
            }
            return false;
          },
          clearObstacles() {
            obstacles = [];
            return true;
          },
          setFood(x, y) {
            food = { x: clamp(Math.floor(Number(x)), 0, N - 1), y: clamp(Math.floor(Number(y)), 0, N - 1) };
            return true;
          },
          /* ---------- 0.9 挑战模式钩子（契约见 docs/arcade/0.9/INTEGRATION-CONTRACT.md §5） ---------- */
          challengeStages() {
            return challengeData.map((stage) => {
              const best = A.Challenge.progress(gameId).best[stage.id] || null;
              return {
                id: stage.id,
                stageNumber: stage.stageNumber,
                title: stage.title,
                unlocked: A.Challenge.isUnlocked(gameId, stage.id),
                best: best ? { timeSec: best.timeSec, assisted: !!best.assisted } : null,
              };
            });
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              stageIndex: chStageIndex,
              state,
              elapsedSec: Math.round(chElapsed * 10) / 10,
              objective: chStage ? chStage.goalStatement : null,
              cleared: !!chLastResult,
              collectibles: [],
              assisted: chAssisted,
              fruitsEaten: chFruitsEaten,
              fruitTotal: chWinCount(),
              steps: chSteps,
              errorReason: chErrorReason,
            };
          },
          stageObservable() {
            return challengeObservable();
          },
          queueChallengeDirection(dirName) {
            return queueChallengeDir(DIRS[dirName] || dirName);
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing' || !chStage) return false;
            if (assisted === true) chAssisted = true;
            return challengeClear();
          },
          forceStageFail(reason) {
            return challengeFail(typeof reason === 'string' && reason ? reason : '测试强制失败');
          },
          exitChallenge() {
            return exitChallengeToStart();
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '贪吃蛇',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
