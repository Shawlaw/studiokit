          /* ---------- 确定性回归：覆盖 0.9 修复（同步执行、不依赖真实计时/异步等待） ---------- */
          regression() {
            const details = [];
            let pass = 0;
            let fail = 0;
            const api = window.__arcadeTest;
            const check = (ok, name, extra) => {
              if (ok) {
                pass += 1;
                details.push('PASS ' + name);
              } else {
                fail += 1;
                details.push('FAIL ' + name + (extra ? ' — ' + extra : ''));
              }
            };
            const keys = [
              'studiokit:arcade:progress:v1',
              'studiokit:arcade:runs:v1',
              'studiokit:arcade:playtime:v1',
              'studiokit:arcade:scores:v1',
              'studiokit:arcade:challenge:v1',
            ];
            const snap = {};
            keys.forEach((key) => {
              try {
                snap[key] = localStorage.getItem(key);
              } catch (err) {
                snap[key] = null;
              }
            });
            try {
              if (!challengeDataReady()) {
                check(false, '挑战数据可用（6 关）');
              } else {
                const stages = challengeStagesData();
                const c06 = stages.filter((stage) => stage.stageNumber === 6)[0];
                if (!c06 || !c06.content) {
                  check(false, 'C06 挑战数据存在');
                } else {
                  /* A. 挑战换块：cur/next 交换 + 固定队列同步 + 实际出块与 NEXT 一致（缺陷 8）。 */
                  applyChallengeStage(c06);
                  const before = api.stageObservable();
                  const beforeCur = before.piece ? before.piece.key : null;
                  const beforeNext = before.nextKey;
                  const beforeQueue = before.queue.slice();
                  check(beforeCur !== beforeNext, 'C06 起手 cur/next 不同', JSON.stringify({ cur: beforeCur, next: beforeNext }));
                  const swapped = useSwapNext();
                  const afterSwap = api.stageObservable();
                  check(
                    swapped && afterSwap.piece && afterSwap.piece.key === beforeNext && nextKey === beforeCur,
                    '挑战换块后 cur/next 交换',
                    JSON.stringify({ cur: afterSwap.piece && afterSwap.piece.key, next: nextKey, expectCur: beforeNext, expectNext: beforeCur })
                  );
                  check(
                    chQueue.length === beforeQueue.length && chQueue.slice().sort().join(',') === beforeQueue.slice().sort().join(','),
                    '换块保持固定队列长度与多块集合',
                    JSON.stringify({ before: beforeQueue, after: chQueue.slice() })
                  );
                  check(chQueue[chQueueIndex] === nextKey && nextKey === beforeCur, 'NEXT 显示与固定队列对应项一致', JSON.stringify({ index: chQueueIndex, queue: chQueue.slice(), next: nextKey }));
                  const savedNext = nextKey;
                  spawnChallenge(); /* 真实推进到下一块：实际出块必须等于刚才 NEXT 显示。 */
                  const spawned = { mode: mode, state: state, curKey: cur ? cur.key : null, nextKey: nextKey, index: chQueueIndex };
                  check(spawned.curKey === savedNext, '挑战换块后实际出块与 NEXT 一致', JSON.stringify({ expected: savedNext, spawned: spawned }));
                  check(spawned.nextKey === (chQueue[chQueueIndex] || null), '后续 NEXT 仍取自固定队列', JSON.stringify({ next: spawned.nextKey, expected: chQueue[chQueueIndex] || null }));
                  /* A2. 0.10.0 自然重力契约：place-by-place 由 data 决定「无自然重力」，其余保持自然重力；不硬编码关卡几何。 */
                  check(gravitySecFor('challenge', 'place-by-place', 1) === Infinity, 'place-by-place 挑战：gravSec=∞（无自然重力）');
                  check(gravitySecFor('challenge', 'gravity', 1) === 0.8 && gravitySecFor('classic', 'place-by-place', 1) === 0.8, '自然重力/经典模式仍按 level 计速（零回归）');
                  check(gravitySecFor('zen', 'gravity', 3) < gravitySecFor('zen', 'gravity', 1), 'zen 自然重力仍随 speedLevel 递减');
                  const pbpStages = stages.filter((stage) => stage.content && stage.content.gravityModel === 'place-by-place');
                  check(pbpStages.length === 0 || pbpStages.every((stage) => !/"(referencePlan|acceptance)"/.test(JSON.stringify(stage))), 'gravityModel 来自运行时 data，不引入剧透字段');
                  /* B. 挑战失败弹层追加 practicedSkill / goalStatement 建议（缺陷 9，判定不变）。 */
                  applyChallengeStage(c06);
                  challengeFail('出块次数用完了');
                  const failText = dom.ovText.textContent || '';
                  const failTitle = dom.ovTitle.textContent || '';
                  check(state === 'over' && /挑战失败/.test(failTitle), '挑战失败判定与标题不变', JSON.stringify({ state: state, title: failTitle }));
                  check(
                    failText.indexOf('建议') !== -1 && failText.indexOf(c06.practicedSkill) !== -1 && failText.indexOf(c06.goalStatement) !== -1,
                    '失败弹层追加具体可执行建议',
                    JSON.stringify({ text: failText })
                  );
                  /* C. 经典换块仍不改变 7-bag（缺陷 8 的回归保护）。 */
                  startGame();
                  const bagBefore = bag.slice();
                  const curBefore = cur ? cur.key : null;
                  const nextBefore = nextKey;
                  useSwapNext();
                  check(
                    cur && cur.key === nextBefore && nextKey === curBefore && bag.slice().join(',') === bagBefore.join(','),
                    '经典换块不动 7-bag',
                    JSON.stringify({ cur: cur && cur.key, next: nextKey, bag: bag.slice() })
                  );
                }
              }
            } catch (err) {
              check(false, 'regression 执行未抛异常', String(err && err.message ? err.message : err));
            } finally {
              try {
                autosave.clear();
                mode = 'classic';
                chStage = null;
                chStageId = null;
                chQueue = [];
                state = 'ready';
                reset();
                loop.resume();
                showStart();
                syncChallengeHud();
                updateChallengeTip();
                pauseUi.sync();
                syncTouchPad();
              } catch (err) {
                /* 清理失败不掩盖断言结果 */
              }
              keys.forEach((key) => {
                try {
                  if (snap[key] === null) localStorage.removeItem(key);
                  else localStorage.setItem(key, snap[key]);
                } catch (err) {
                  /* 忽略存储不可用 */
                }
              });
            }
            return { pass: pass, fail: fail, details: details };
          },
        };
        /* 0.17（ADR §19.3 / §19.8）：职业只读 / 确定性驱动钩子只在 ?careerTest=1 追加；
           生产 URL 与既有 #test 探针（无 careerTest）完全不变。 */
        if (/(?:^|[?&])careerTest=1(?:&|$)/.test(String((window.location && window.location.search) || ''))) {

            return { events, lineEvents, rows };
          };

          const careerGoalElement = () => document.querySelector('[data-career-goal]');
          window.__arcadeTest.careerInfo = function () {
            const run = readCareerRun();

            const stats = careerEventStats();
            let runSave = null;

            } catch (err) {

            }
            let progress = null;
            try {
              progress = A.Progress.get(CAREER_GAME_ID);
            } catch (err) {

            }
            let scoresCount = null;
            try {
              scoresCount = A.Scores && typeof A.Scores.list === 'function' ? A.Scores.list({ gameId: CAREER_GAME_ID }).length : null;
            } catch (err) {
              scoresCount = null;
            }
            return {
              isCommission: !!run,
              locked: careerLocked,
              active: careerActive(),
              state,
              mode,
              commissionId: run ? run.commissionId : (careerGoalSource && careerGoalSource.commissionId ? careerGoalSource.commissionId : null),
              objectiveKind: goal ? goal.kind : null,
              atLeast: goal ? goal.atLeast : null,
              goalText: careerGoalText() || null,
              score,
              lines,
              level,
              shortRun,
              goalLineVisible: !!goalEl && goalEl.getClientRects().length > 0,
              goalLineHeight: goalEl ? Math.round(goalEl.getBoundingClientRect().height) : 0,
              serializeNull: serialize() === null,
              challengeEntryHidden: !dom.ovBtn2 || dom.ovBtn2.hidden === true,
              zenEntryHidden: !dom.ovBtn3 || dom.ovBtn3.hidden === true,
              challengeLayerHidden: !dom.chLayer || dom.chLayer.hidden === true,
              careerChrome: document.body.classList.contains('is-career-run'),
              lineEvents: stats.lineEvents.length,
              eventBuffer: stats.events.length,
              eventRows: stats.rows,
              runSavePresent: !!runSave,
              runSaveScore: runSave ? runSave.score : null,
              progress: progress ? { high: progress.high, plays: progress.plays } : null,
              scoresCount,
              settled: careerSettled
                ? {
                  pending: careerSettled.pending === true,
                  ok: careerSettled.ok === true,
                  reason: careerSettled.reason || null,
                  credits: Number(careerSettled.credits) || 0,
                  duplicate: careerSettled.duplicate === true,
                  observed: careerSettled.observed === undefined ? null : careerSettled.observed,
                }
                : null,
            };
          };
          /* 确定性驱动：用真实 hardDrop()/lockPiece()/applyClear() 消掉 1 或 4 行；
             只布置盘面与当前块（等价 merge-2048 的 setBoard），落块/消行/事件全走真实分支。 */
          window.__arcadeTest.careerClearScenario = function (kind) {
            if (!careerLocked || !careerActive()) return { ok: false, reason: 'not-career-active' };
            const n = Number(kind) === 4 ? 4 : Number(kind) === 1 ? 1 : 0;

            if (state !== 'playing' || !cur) return { ok: false, reason: 'bad-state', state, hasCur: !!cur };
            mode = 'classic';
            shortRun = true;
            clearing = null;

            for (let r = 0; r < ROWS; r += 1) board.push(new Array(COLS).fill(null));
            if (n === 1) {
              for (let c = 0; c < 6; c += 1) board[ROWS - 1][c] = '#7c5cff';

              cur = {
                key: 'I',

          window.__arcadeTest.careerSelfCheck = function () {

                check(stats.lineEvents.length === lines, '事件条数 == 真实消行数（' + stats.lineEvents.length + ' / ' + lines + '）');
                check(stats.lineEvents.every((event, index) => Number(event.payload && event.payload.lines) === index + 1), 'lines 载荷随真实消行数递增');

              } else {

      /* 无 ticket 时同步走 0.16 路径（零延迟、零行为变化）。 */

            name: '俄罗斯方块',
            onResume: () => {
              if (restore(saved.data)) {
                state = 'playing';
                hideOverlay();
                loop.resume();
                pauseUi.sync();
                autosave.saveNow();
              } else {
                autosave.clear();
                showStart();
              }
            },
            onRestart: () => {
              autosave.clear();
              showStart();
            },
          });
        } else {
          showStart();
        }
      }

      /* 0.17 职业入口：URL 带 ?career=<ticketId> 时先等桥确认 ticket，再决定「职业开局」还是
         经典开局；无参数时同步走 0.16 路径（零延迟、零行为变化）。只有桥确认了属于本游戏的
         run 才锁死旧 RunSave；确认不到时 fail-open 回经典。 */
      function bootStartScreen() {
        const ticketId = careerTicketParam();
        const ready = career && career.ready;
        if (!ticketId || !career || !ready || typeof ready.then !== 'function') {
          prepareStartScreen();
          return;
        }
        let settled = false;
        let guard = null;
        const finishBoot = () => {
          if (settled) return;
          settled = true;
          try {
            if (guard) clearTimeout(guard);
          } catch (err) {
            /* ignore */
          }
          const runInfo = readCareerRun();
          if (runInfo) activateCareerRun(runInfo);
          else { try { window.__arcadeMode = 'classic'; } catch (err) { /* ignore */ } }
          prepareStartScreen();
        };
        try {
          guard = setTimeout(finishBoot, 10000);
        } catch (err) {
          guard = null;
        }
        Promise.resolve(ready).then(finishBoot, finishBoot);
        /* 极端慢启动兜底：若 3.5s 计时器已按经典开局、桥随后才确认职业 run，
           立刻切回职业开局（清掉这段时间可能写下的经典局内档，不产生任何经典记录）。 */
        try {
          setTimeout(() => {
            if (careerLocked) return;
            const late = readCareerRun();
            if (!late) return;
            try {
              /* 保留经典局内档：职业 run 只用自己的内存/IDB，不删除玩家经典存档。 */
            } catch (err) {
              /* ignore */
            }
            activateCareerRun(late);
            showStart();
          }, 1500);
        } catch (err) {
          /* ignore */
        }
      }
      bootStartScreen();
      loop.start();
    })();
  </script>
</body>
</html>
