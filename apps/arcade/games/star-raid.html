<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="星海突击：雷电式纵版弹幕射击，可吃散射 / 激光 / 追踪 / 速射四种弹种 Buff，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/star-raid.js"></script>
  <style>
    /* 0.9 挑战模式：选关容器放进 .stage-box 后需要页面本地定位；面板本体来自 A.Challenge.stageListHtml。 */
    .stage-box > .challenge-select[data-ch-panel] {
      position: absolute;
      inset: 6px;
      z-index: 5;
      max-height: calc(100% - 12px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stage-box > .challenge-select[data-ch-panel][hidden] { display: none; }
    .stage-box > .challenge-select[data-ch-panel] .ac-challenge-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .stage-box > .challenge-select[data-ch-panel] .ac-challenge-head {
      flex-wrap: wrap;
      row-gap: 2px;
    }
    @media (max-width: 340px) {
      .stage-box > .challenge-select[data-ch-panel] .ac-challenge-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .stage-box > .challenge-select[data-ch-panel] [data-ch-back] {
      display: block;
      width: 100%;
      min-height: 44px;
      margin: 8px 0 0;
    }
    .ac-challenge-hud[data-ch-hud] {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 3;
      width: auto;
      max-width: none;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
    }
    .ac-challenge-tip[data-ch-tip] {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 10px;
      z-index: 3;
      margin: 0;
      font-size: 11px;
      pointer-events: none;
    }
    .ac-challenge-tip[data-ch-tip][hidden] { display: none; }
    body.has-challenge .game-hud { display: none; }
  </style>
  <title>星海突击 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#4f7cff; --card-accent:#4f7cff">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🚀 星海突击</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>关卡 <strong data-hud-stage>1</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
        <span data-hud-buff hidden>弹种 <strong data-hud-weapon>普通</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="星海突击游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>星海突击</h2>
            <p data-ov-text>纵版弹幕射击</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <span class="ac-challenge-hud" data-ch-hud hidden></span>
        <p class="ac-challenge-tip" data-ch-tip hidden></p>
        <div class="challenge-select" data-ch-panel hidden role="region" aria-label="挑战 6 关"></div>
      </div>
    </div>
    <div class="touch-pad game-tools" data-game-tools aria-label="主动道具（快捷键 1 / 2）">
      <button type="button" class="touch-btn" data-joy-tool="pulse" aria-label="电磁脉冲，剩余 1 次（快捷键 1）" title="电磁脉冲（1）：清空敌弹并击坠普通敌机，Boss 扣 100 HP">
        <span aria-hidden="true">💥</span><span>脉冲</span><span data-joy-count aria-hidden="true">1</span>
      </button>
      <button type="button" class="touch-btn" data-joy-tool="shield" aria-pressed="false" aria-label="星盾 5 秒，剩余 1 次（快捷键 2）" title="星盾（2）：5 秒内不扣生命">
        <span aria-hidden="true">🛡</span><span>星盾</span><span data-joy-count aria-hidden="true">1</span>
      </button>
    </div>
    <p class="game-hint">拖动或 ←→↑↓ / WASD 全屏移动 · 自动开火 · 道具 1/2 · Boss 后可收局 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, rand, randInt, pick, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudStage: document.querySelector('[data-hud-stage]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        hudBuff: document.querySelector('[data-hud-buff]'),
        hudWeapon: document.querySelector('[data-hud-weapon]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        joyPulse: document.querySelector('[data-joy-tool="pulse"]'),
        joyShield: document.querySelector('[data-joy-tool="shield"]'),
        chPanel: document.querySelector('[data-ch-panel]'),
        chHud: document.querySelector('[data-ch-hud]'),
        chTip: document.querySelector('[data-ch-tip]'),
      };
      const ui = A.createOverlayUi(dom);

      const stars = A.createStarfield(W, H);
      const particles = A.createParticles();

      const PLAYER_MIN_Y = 46;
      const PLAYER_MAX_Y = H - 26;
      const STAGE_WAVE_SECONDS = 30;
      const BOSS_NAMES = ['赤焰旗舰', '雷霆母舰', '虚空堡垒'];
      const BOSS_BASE_HP = 700;
      const BOSS_HP_STEP = 300;
      const player = { x: W / 2, y: H - 90, w: 34, h: 30, cool: 0, invul: 0 };
      let bullets = [];
      let enemies = [];
      let shots = [];
      let pickups = [];
      let floaters = [];
      let score = 0;
      let lives = 3;
      let spawnTimer = 0;
      let shake = 0;
      let state = 'ready';
      let recordSaved = false;
      let dragOffset = null;
      let nextUid = 1;
      let pickupPity = 0;
      const BUFF_TYPES = ['spread', 'laser', 'homing', 'rapid'];
      const buffs = { spread: 0, laser: 0, homing: 0, rapid: 0 };
      let lastBuff = 'normal';
      let level = 1;
      let stageTime = 0;
      /* 保存“CLEAR 弹层还在等待选择”的关卡；刷新后重新给出下一关/收局选择。 */
      let pendingClearStage = 0;
      let boss = null;
      let stageBanner = 0;
      let stageBannerText = '';
      let elapsed = 0;
      const JOY_TOOL_CAPS = { pulse: 2, shield: 2 };
      const SHIELD_SECONDS = 5;
      const tools = { pulse: 1, shield: 1 };
      let shieldTimer = 0;
      let joyLastResult = null;
      let high = A.Progress.get('star-raid').high;
      dom.hudHigh.textContent = String(high);

      /* ----------------------------------------------------------
       * 0.9 挑战模式（C01–C06）
       * - 数据来自 ../challenge/star-raid.js（window.ArcadeChallengeData）经 A.Challenge 读取。
       * - 挑战用设计源固定波次时间轴替换经典随机刷怪；每个攻击段保证 safeBandXRatio 内为无弹走廊。
       * - 与经典完全隔离：不写 progress 最高分 / Playtime 轮次；数据缺失时入口 fail closed。
       * ---------------------------------------------------------- */
      const CHALLENGE_GAME_ID = 'star-raid';
      const CHALLENGE_COLUMN_STEP = 36;
      let mode = 'classic'; /* classic | challenge | panel */
      let chStage = null;
      let chContent = null;
      let chTime = 0;
      let chHealth = 3;
      let chAssisted = false;
      let chCollectibles = [];
      let chEvents = [];
      let chDamageLog = [];
      let chPowerupLog = [];
      let chBossDefeated = false;
      let chBossMaxPhase = 0;
      let chBossExposedWindows = 0;
      let chBossExposedSeconds = 0;
      let chFiredVolleys = 0;
      let chBossHits = 0;
      let chTipTimer = 0;
      let chHudTick = 0;
      let chPowerupSpawned = [];

      function pad2(value) {
        return String(value).padStart(2, '0');
      }
      function challengeStagesList() {
        if (!A.Challenge || typeof A.Challenge.stages !== 'function') return [];
        const stages = A.Challenge.stages(CHALLENGE_GAME_ID);
        return Array.isArray(stages) ? stages : [];
      }
      function challengeAvailable() {
        return challengeStagesList().length === 6;
      }
      function challengeStageByRef(ref) {
        if (!challengeAvailable()) return null;
        const stage = A.Challenge.stage(CHALLENGE_GAME_ID, ref);
        return stage && typeof stage === 'object' ? stage : null;
      }
      function challengeStagesInfo() {
        const progress = A.Challenge && A.Challenge.progress ? A.Challenge.progress(CHALLENGE_GAME_ID) : { best: {} };
        return challengeStagesList().map((stage) => ({
          id: stage.id,
          stageNumber: stage.stageNumber,
          title: stage.title,
          unlocked: !!(A.Challenge && A.Challenge.isUnlocked && A.Challenge.isUnlocked(CHALLENGE_GAME_ID, stage.id)),
          best: (progress.best && progress.best[stage.id]) || null,
        }));
      }
      function challengeFmt(sec) {
        return A.Challenge && A.Challenge.formatTime
          ? A.Challenge.formatTime(sec)
          : pad2(Math.floor((Number(sec) || 0) / 60)) + ':' + pad2(Math.floor(Number(sec) || 0) % 60);
      }
      function challengeLabel(stage) {
        return stage ? 'C' + pad2(stage.stageNumber || 0) + ' ' + (stage.title || '') : '挑战';
      }
      function challengePatternLabel(ev) {
        if (!ev) return '';
        const names = {
          single: '单发',
          aimed: '瞄准',
          fan3: '三发扇弹',
          fan5: '五发扇弹',
          'sweep-lr': '左→右扫射',
          'sweep-rl': '右→左扫射',
          'mark-charge': '冲锋预警',
          'weak-left-right': 'Boss 双翼弱点',
          'phase-sweep-and-core': 'Boss 双阶段',
        };
        return names[ev.attackPattern] || ev.attackPattern || '';
      }
      function challengeBand(ev) {
        const ratio = ev && ev.safeBandXRatio ? ev.safeBandXRatio : { center: 0.5, halfWidth: 0.12 };
        const center = clamp(Number(ratio.center), 0, 1) || 0.5;
        const halfWidth = clamp(Number(ratio.halfWidth) || 0.12, 0.06, 0.3);
        return { center, halfWidth, left: Math.max(0, (center - halfWidth) * W), right: Math.min(W, (center + halfWidth) * W) };
      }
      /* 危险列只取安全走廊 ±16px 之外：走廊内绝不会出现敌弹（玩家判定半宽 9 + 最大弹半径 5）。 */
      function challengeDangerColumns(band) {
        const cols = [];
        for (let x = 18; x <= W - 18; x += CHALLENGE_COLUMN_STEP) {
          if (x <= band.left - 16 || x >= band.right + 16) cols.push(x);
        }
        return cols;
      }
      function challengeActiveEvents() {
        return chEvents.filter((ev) => ev.started && !ev.done && ev.phase !== 'pending');
      }
      function challengeCurrentBand() {
        const active = challengeActiveEvents();
        return active.length ? challengeBand(active[0]) : null;
      }
      function challengeSpawnEnemy(kind, x, opts) {
        const def = KINDS[kind] || KINDS.drone;
        const o = opts || {};
        const enemy = {
          uid: nextUid++,
          kind,
          x: clamp(Number(x) || W / 2, 4, W - def.w - 4),
          y: -def.h - 8,
          w: def.w,
          h: def.h,
          hp: Number(o.hp) || 2,
          maxHp: Number(o.hp) || 2,
          score: def.score,
          color: def.color,
          vy: Number(o.vy) || 120,
          t: 0,
          fireTimer: 999,
          baseX: clamp(Number(x) || W / 2, 4, W - def.w - 4),
          vx: 0,
          chSway: Number(o.sway) || 0,
          chChargeAt: Number(o.chargeAt) || 0,
        };
        enemies.push(enemy);
        return enemy;
      }
      function challengeSpawnWaveEnemies(ev) {
        const spawnX = clamp(ev.spawnXRatio * W, 24, W - 24);
        if (ev.enemyType === 'pair') {
          challengeSpawnEnemy('drone', spawnX - 64, { hp: 2, vy: 110 });
          challengeSpawnEnemy('drone', spawnX + 64, { hp: 2, vy: 110 });
        } else if (ev.enemyType === 'sweeper') {
          challengeSpawnEnemy('sine', spawnX, { hp: 3, vy: 36, sway: 140 });
        } else if (ev.enemyType === 'charger') {
          challengeSpawnEnemy('diver', spawnX, { hp: 2, vy: 42, chargeAt: chTime + ev.telegraphSec });
        } else {
          challengeSpawnEnemy('drone', spawnX, { hp: 2, vy: 130 });
        }
      }
      function challengeStartEvent(ev) {
        ev.started = true;
        ev.phase = 'telegraph';
        ev.phaseTime = 0;
        ev.salvoIndex = 0;
        ev.lastSalvo = 0;
        /* 训练段之间清空上一段残留敌弹，保证新预警的安全走廊真实可达。 */
        shots = [];
        if (ev.enemyType === 'boss') {
          chBossMaxPhase = 1;
          chBossExposedWindows = 0;
          chBossExposedSeconds = 0;
          challengeSpawnBoss(ev);
          stageBannerText = 'WARNING · ' + (boss ? boss.name : 'BOSS');
          stageBanner = 1.8;
        } else {
          challengeSpawnWaveEnemies(ev);
          stageBannerText = challengePatternLabel(ev);
          stageBanner = 0.9;
        }
        A.Sfx.play('ui');
      }
      function challengeSpawnBoss(ev) {
        const band = challengeBand(ev);
        const stageNumber = Math.max(1, Number(chStage && chStage.stageNumber) || 1);
        /* Boss 血量按设计 targetDurationSec 与基础武器 DPS（约 15.4/s）+ 暴露窗口折算：
         * C05 双翼弱点暴露率约 80% → 290 HP ≈ 24s 战斗（+37s 波次 ≈ 61s）；
         * C06 两阶段（阶段 2 核心窗口约 61%）→ 400 HP ≈ 27s 战斗（+44s 波次 ≈ 71s）。 */
        const maxHp = stageNumber >= 6 ? 400 : 290;
        const w = 118;
        const h = 86;
        const centerX = clamp(band.center * W - w / 2, 4, W - w - 4);
        boss = {
          uid: nextUid++,
          kind: 'boss',
          name: stageNumber >= 6 ? '星域母舰 · 终阶' : '双翼堡垒',
          x: centerX,
          y: -h,
          w,
          h,
          hp: maxHp,
          maxHp,
          score: 1200,
          color: '#ff5d7a',
          vy: 55,
          t: 0,
          fireTimer: 1.2,
          baseX: centerX,
          vx: 0,
          phase: 1,
          exposed: true,
          wasExposed: true,
          weakSide: 'left',
          salvoIndex: 0,
        };
        enemies.push(boss);
        shots = [];
      }
      function challengeSalvoColumns(ev) {
        const band = challengeBand(ev);
        const cols = challengeDangerColumns(band);
        if (!cols.length) return [];
        const spawnX = clamp(ev.spawnXRatio * W, 18, W - 18);
        const nearest = (x) => cols.reduce((best, col) => (Math.abs(col - x) < Math.abs(best - x) ? col : best), cols[0]);
        const pattern = ev.attackPattern;
        if (pattern === 'fan3' || pattern === 'fan5') {
          const count = Math.min(cols.length, pattern === 'fan3' ? 3 : 5);
          const picked = [];
          for (let i = 0; i < count; i += 1) {
            const idx = Math.round((i * (cols.length - 1)) / Math.max(1, count - 1));
            picked.push(cols[(idx + ev.salvoIndex) % cols.length]);
          }
          return picked;
        }
        if (pattern === 'sweep-lr' || pattern === 'sweep-rl') {
          const ordered = pattern === 'sweep-lr' ? cols : cols.slice().reverse();
          const index = ev.salvoIndex % ordered.length;
          const picked = [ordered[index]];
          if (ordered.length > 1) picked.push(ordered[(index + 1) % ordered.length]);
          return picked;
        }
        return [nearest(spawnX)];
      }
      function challengeSpawnSalvo(ev) {
        const band = challengeBand(ev);
        const cols = challengeSalvoColumns(ev);
        const charge = ev.attackPattern === 'mark-charge';
        cols.forEach((x, index) => {
          const outward = x < band.center * W ? -1 : 1;
          shots.push({
            x,
            y: -12,
            vx: charge ? 0 : outward * (ev.attackPattern.indexOf('fan') === 0 ? 26 : 0),
            vy: charge ? 440 : 180 + (index % 2) * 24,
            r: 4,
            chSource: ev.id,
          });
        });
        if (cols.length) A.Sfx.play('shoot');
      }
      function challengeSpawnBossSalvo(ev) {
        const band = challengeBand(ev);
        const cols = challengeDangerColumns(band);
        if (!cols.length) return;
        const b = boss;
        let picked;
        if (ev.attackPattern === 'weak-left-right') {
          const ordered = b && b.weakSide === 'right' ? cols.slice().reverse() : cols;
          const index = (b ? b.salvoIndex : 0) % ordered.length;
          picked = [ordered[index], ordered[(index + 1) % ordered.length]];
          if (b) b.salvoIndex += 1;
        } else {
          const ordered = (b ? b.salvoIndex : 0) % 2 === 0 ? cols : cols.slice().reverse();
          const index = (b ? b.salvoIndex : 0) % ordered.length;
          picked = [ordered[index], ordered[(index + 2) % ordered.length]];
          if (b) b.salvoIndex += 1;
        }
        picked.forEach((x) => shots.push({ x, y: -12, vx: 0, vy: 195, r: 5, chSource: ev.id }));
        A.Sfx.play('shoot');
      }
      function challengeUpdateBoss(ev, dt) {
        const b = boss;
        if (!b) return;
        b.t += dt;
        if (b.y < 104) b.y += b.vy * dt;
        else b.y = 104 + Math.sin(b.t * 1.2) * 6;
        const ratio = b.hp / b.maxHp;
        if (ev.attackPattern === 'weak-left-right') {
          /* 2s 左翼暴露 → 1s 护盾 → 2s 右翼暴露，循环。 */
          const cycle = b.t % 5;
          b.weakSide = cycle < 2.5 ? 'left' : 'right';
          b.exposed = cycle < 2 || (cycle >= 3 && cycle < 5);
          b.phase = 1;
        } else if (ratio > 0.6) {
          b.phase = 1;
          b.exposed = true;
        } else {
          b.phase = 2;
          /* 第 2 阶段：1.4s 扫射护盾 → 2.2s 中央核心暴露。 */
          const cycle = b.t % 3.6;
          b.exposed = cycle >= 1.4;
        }
        if (b.exposed && !b.wasExposed) chBossExposedWindows += 1;
        if (b.exposed) chBossExposedSeconds += dt;
        b.wasExposed = b.exposed;
        if (b.phase > chBossMaxPhase) chBossMaxPhase = b.phase;
        b.fireTimer -= dt;
        if (b.fireTimer <= 0 && b.y >= 88) {
          challengeSpawnBossSalvo(ev);
          b.fireTimer = 0.55;
        }
      }
      function challengePowerupsSpawned() {
        const list = chContent && Array.isArray(chContent.powerups) ? chContent.powerups : [];
        list.forEach((powerup, index) => {
          const atSec = Number(powerup.atSec) || 0;
          if (chTime < atSec || chPowerupSpawned[index]) return;
          chPowerupSpawned[index] = true;
          const type = WEAPONS[powerup.kind] && powerup.kind !== 'normal' ? powerup.kind : 'spread';
          pickups.push({
            x: clamp((Number(powerup.xRatio) || 0.5) * W, 24, W - 24),
            y: -20,
            vy: 72,
            r: 15,
            type,
            spin: 0,
            chPowerup: powerup.kind || type,
          });
        });
      }
      function updateChallenge(dt) {
        chTime += dt;
        stageTime = chTime;
        chTipTimer = Math.max(0, chTipTimer - dt);
        stageBanner = Math.max(0, stageBanner - dt);
        chEvents.forEach((ev) => {
          if (ev.done) return;
          if (!ev.started) {
            if (chTime >= ev.atSec) challengeStartEvent(ev);
            return;
          }
          ev.phaseTime += dt;
          if (ev.phase === 'telegraph') {
            if (ev.phaseTime >= ev.telegraphSec) {
              ev.phase = 'attack';
              ev.phaseTime = 0;
              ev.salvoIndex = 0;
              ev.lastSalvo = 0;
              if (ev.enemyType !== 'boss') challengeSpawnSalvo(ev);
            }
            return;
          }
          if (ev.phase !== 'attack') return;
          if (ev.enemyType === 'boss') {
            challengeUpdateBoss(ev, dt);
            return;
          }
          ev.lastSalvo -= dt;
          if (ev.phaseTime <= ev.attackActiveSec && ev.lastSalvo <= 0) {
            challengeSpawnSalvo(ev);
            ev.salvoIndex += 1;
            ev.lastSalvo = 0.45;
          }
          if (ev.phaseTime >= ev.attackActiveSec + 0.6) {
            ev.phase = 'done';
            ev.done = true;
          }
        });
        challengePowerupsSpawned();
        chHudTick -= dt;
        if (chHudTick <= 0) {
          chHudTick = 0.15;
          syncChallengeHud(false);
        }
        if (chContent && chContent.endCondition === 'defeat-boss') {
          if (chBossDefeated) challengeClear();
          return;
        }
        if (chTime >= Math.max(1, Number(chContent && chContent.stageDurationSec) || 35)) {
          challengeClear();
        }
      }
      function updateChallengeEnemies(dt) {
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (e.kind === 'boss') continue;
          e.t += dt;
          if (e.chChargeAt > 0 && chTime >= e.chChargeAt) {
            e.vy = 640;
            e.chChargeAt = 0;
          }
          e.y += e.vy * dt;
          if (e.chSway) e.x = clamp(e.baseX + Math.sin(e.t * 2.2) * e.chSway, 4, W - e.w - 4);
          if (e.y > H + 60) enemies.splice(i, 1);
        }
      }
      function challengeHit(reason) {
        if (player.invul > 0 || shieldTimer > 0) return;
        chHealth -= 1;
        player.invul = 1.8;
        shake = A.reducedMotion ? 0 : 8;
        A.Sfx.play('explode');
        chDamageLog.push({ atSec: Math.round(chTime * 10) / 10, reason: reason || 'hit' });
        particles.emit(player.x, player.y, {
          count: 24,
          speed: [60, 260],
          life: [0.3, 0.8],
          size: [2, 5],
          colors: ['#4f7cff', '#ffffff', '#ffd23f'],
          gravity: 100,
        });
        if (chHealth <= 0) {
          chHealth = 0;
          challengeFail('机体损毁 · 生命归零');
        }
      }
      function syncChallengeHud(force) {
        if (!dom.chHud || mode !== 'challenge' || !chStage) return;
        const duration = Math.max(1, Number(chContent && chContent.stageDurationSec) || 35);
        const active = chEvents.find((ev) => ev.started && !ev.done);
        let text =
          challengeLabel(chStage) +
          ' · 生命 ' +
          chHealth +
          ' · ' +
          challengeFmt(chTime) +
          '/' +
          duration +
          's';
        if (boss) text += ' · BOSS ' + Math.max(0, Math.ceil(boss.hp)) + '/' + boss.maxHp;
        else if (active) text += ' · ' + challengePatternLabel(active);
        if (force || dom.chHud.textContent !== text) dom.chHud.textContent = text;
        if (dom.chTip) {
          const show = chTipTimer > 0 && state === 'playing';
          dom.chTip.hidden = !show;
          if (show) dom.chTip.textContent = '目标：' + (chStage.goalStatement || '') + ' · ' + (chStage.decision || '');
        }
      }
      function setChallengeChrome(active) {
        document.body.classList.toggle('has-challenge', !!active);
        if (dom.chHud) dom.chHud.hidden = !active;
        if (dom.chTip) dom.chTip.hidden = !active || chTipTimer <= 0;
        syncJoyTools();
      }
      function showChallengePanel() {
        if (!challengeAvailable()) {
          A.showToast('挑战数据不可用');
          return false;
        }
        mode = 'panel';
        state = 'ready';
        loop.pause();
        autosave.clear();
        if (dom.chPanel) {
          dom.chPanel.innerHTML =
            A.Challenge.stageListHtml(CHALLENGE_GAME_ID) +
            '<button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>';
          dom.chPanel.hidden = false;
        }
        setChallengeChrome(false);
        ui.hide();
        pauseUi.sync();
        syncJoyTools();
        return true;
      }
      function hideChallengePanel() {
        if (dom.chPanel) {
          dom.chPanel.hidden = true;
          dom.chPanel.innerHTML = '';
        }
      }
      function closeChallengePanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chContent = null;
        chEvents = [];
        reset();
        state = 'ready';
        setChallengeChrome(false);
        showStart();
        pauseUi.sync();
        syncJoyTools();
        return true;
      }
      function resetChallenge(stage) {
        chStage = stage;
        chContent = stage && stage.content ? stage.content : {};
        mode = 'challenge';
        const spawn = chContent.playerSpawn || { xRatio: 0.5, yRatio: 0.85 };
        player.x = clamp((Number(spawn.xRatio) || 0.5) * W, 20, W - 20);
        player.y = clamp((Number(spawn.yRatio) || 0.85) * H, PLAYER_MIN_Y, PLAYER_MAX_Y);
        player.invul = 0;
        player.cool = 0;
        bullets = [];
        enemies = [];
        shots = [];
        pickups = [];
        floaters = [];
        score = 0;
        chTime = 0;
        chHealth = Math.max(1, Math.floor(Number(chContent.startingHealth) || 3));
        chAssisted = false;
        chCollectibles = [];
        chDamageLog = [];
        chPowerupLog = [];
        chBossDefeated = false;
        chBossMaxPhase = 0;
        chBossExposedWindows = 0;
        chBossExposedSeconds = 0;
        chFiredVolleys = 0;
        chBossHits = 0;
        chTipTimer = 3.2;
        chHudTick = 0;
        chPowerupSpawned = [];
        boss = null;
        stageBanner = 0;
        stageBannerText = '';
        stageTime = 0;
        pendingClearStage = 0;
        BUFF_TYPES.forEach((type) => {
          buffs[type] = 0;
        });
        lastBuff = 'normal';
        tools.pulse = 1;
        tools.shield = 1;
        shieldTimer = 0;
        particles.clear();
        chEvents = (Array.isArray(chContent.events) ? chContent.events : []).map((event, index) => ({
          id: String(event.id || 'w' + (index + 1)),
          atSec: Math.max(0, Number(event.atSec) || 0),
          enemyType: String(event.enemyType || 'scout'),
          attackPattern: String(event.attackPattern || 'single'),
          telegraphSec: Math.max(0.2, Number(event.telegraphSec) || 0.9),
          attackActiveSec: Math.max(0.5, Number(event.attackActiveSec) || 3.4),
          spawnXRatio: clamp(Number(event.spawnXRatio) || 0.5, 0, 1),
          safeBandXRatio: event.safeBandXRatio || { center: 0.5, halfWidth: 0.12 },
          started: false,
          phase: 'pending',
          phaseTime: 0,
          salvoIndex: 0,
          lastSalvo: 0,
          done: false,
        }));
        syncHud();
        syncJoyTools();
        setChallengeChrome(true);
        syncChallengeHud(true);
      }
      function startChallenge(ref) {
        const stage = challengeStageByRef(ref);
        if (!stage) {
          A.showToast('挑战数据不可用');
          return false;
        }
        if (!A.Challenge.isUnlocked(CHALLENGE_GAME_ID, stage.id)) {
          A.showToast('先通关上一关');
          return false;
        }
        autosave.clear();
        hideChallengePanel();
        resetChallenge(stage);
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      function retryChallenge() {
        if (!chStage) return false;
        return startChallenge(chStage.id);
      }
      function nextChallengeStage() {
        if (!chStage) return null;
        const list = challengeStagesList();
        const index = list.findIndex((stage) => stage.id === chStage.id);
        return index >= 0 && index + 1 < list.length ? list[index + 1] : null;
      }
      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        A.Sfx.play('over');
        autosave.clear();
        loop.pause();
        ui.show({
          title: '挑战失败',
          text:
            '<b>' + challengeLabel(chStage) + '</b><br/>' +
            (reason || '本关失败') +
            '<br/>已坚持 ' + challengeFmt(chTime) + ' · 生命归零',
          btn: '重试本关',
          onBtn: retryChallenge,
          btn2: '返回选关',
          onBtn2: showChallengePanel,
        });
        pauseUi.sync();
        syncJoyTools();
        return true;
      }
      function challengeClear() {
        if (mode !== 'challenge' || !chStage || state === 'cleared') return false;
        const timeSec = Math.round(Math.max(0, chTime) * 10) / 10;
        state = 'cleared';
        const result = { timeSec, assisted: chAssisted, collectibles: chCollectibles.slice() };
        A.Challenge.markCleared(CHALLENGE_GAME_ID, chStage.id, result);
        A.Sfx.play('perfect');
        autosave.clear();
        loop.pause();
        const next = nextChallengeStage();
        ui.show({
          title: '挑战通关 · C' + pad2(chStage.stageNumber || 0),
          text: A.Challenge.resultHtml(chStage, result),
          btn: next ? '下一关' : '返回选关',
          onBtn: next ? () => startChallenge(next.id) : showChallengePanel,
          btn2: '重玩本关',
          onBtn2: retryChallenge,
        });
        syncChallengeHud(true);
        pauseUi.sync();
        syncJoyTools();
        return true;
      }
      function challengeInfo() {
        const active = chEvents.find((ev) => ev.started && !ev.done);
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageIndex: chStage ? Math.max(0, (Number(chStage.stageNumber) || 1) - 1) : -1,
          state,
          elapsedSec: Math.round(chTime * 10) / 10,
          objective: chStage ? chStage.goalStatement : '',
          cleared: state === 'cleared',
          collectibles: chCollectibles.slice(),
          assisted: chAssisted,
          health: chHealth,
          startingHealth: chStage ? Math.max(1, Math.floor(Number(chContent && chContent.startingHealth) || 3)) : 3,
          player: { x: player.x, y: player.y, invul: player.invul },
          activeEvent: active ? { id: active.id, phase: active.phase, pattern: active.attackPattern } : null,
          eventsDone: chEvents.filter((ev) => ev.done).length,
          eventsTotal: chEvents.length,
          boss: boss ? { hp: boss.hp, maxHp: boss.maxHp, phase: boss.phase, exposed: boss.exposed !== false, weakSide: boss.weakSide } : null,
          bossDefeated: chBossDefeated,
          bossMaxPhase: chBossMaxPhase,
          shots: shots.length,
          challengeAvailable: challengeAvailable(),
        };
      }
      function stageObservable() {
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          state,
          time: Math.round(chTime * 10) / 10,
          stageDurationSec: chStage && chContent ? Math.max(1, Number(chContent.stageDurationSec) || 35) : 0,
          endCondition: chContent ? chContent.endCondition : null,
          health: chHealth,
          startingHealth: chStage ? Math.max(1, Math.floor(Number(chContent && chContent.startingHealth) || 3)) : 3,
          events: chEvents.map((ev) => ({
            id: ev.id,
            atSec: ev.atSec,
            enemyType: ev.enemyType,
            attackPattern: ev.attackPattern,
            phase: ev.phase,
            started: ev.started,
            done: ev.done,
            safeBand: challengeBand(ev),
          })),
          activeEventIds: challengeActiveEvents().map((ev) => ev.id),
          safeBand: challengeCurrentBand(),
          shots: shots.map((s) => ({ x: Math.round(s.x * 10) / 10, y: Math.round(s.y * 10) / 10, r: s.r, source: s.chSource || null })),
          player: { x: player.x, y: player.y, invul: player.invul },
          boss: boss ? { hp: boss.hp, maxHp: boss.maxHp, phase: boss.phase, exposed: boss.exposed !== false, weakSide: boss.weakSide } : null,
          bossDefeated: chBossDefeated,
          bossMaxPhase: chBossMaxPhase,
          bossExposedWindows: chBossExposedWindows,
          bossExposedSeconds: Math.round(chBossExposedSeconds * 10) / 10,
          firedVolleys: chFiredVolleys,
          bossHits: chBossHits,
          buffs: { ...buffs },
          bulletsInFlight: bullets.length,
          enemiesCount: enemies.length,
          bossCount: enemies.filter((e) => e.kind === 'boss').length,
          damageLog: chDamageLog.slice(),
          collectibles: chCollectibles.slice(),
          powerupLog: chPowerupLog.slice(),
          assisted: chAssisted,
          eventsDone: chEvents.filter((ev) => ev.done).length,
          eventsTotal: chEvents.length,
          panelVisible: !!(dom.chPanel && !dom.chPanel.hidden),
        };
      }

      /* ---------- 弹种 Buff ---------- */
      const WEAPONS = {
        normal: { name: '普通', short: '普', color: '#e8f4ff', duration: 0, interval: 0.13 },
        spread: { name: '散射', short: '散', color: '#7cf5b2', duration: 12, interval: 0.16 },
        laser: { name: '激光', short: '激', color: '#ff86c8', duration: 10, interval: 0.24 },
        homing: { name: '追踪', short: '追', color: '#ffd23f', duration: 11, interval: 0.2 },
        rapid: { name: '速射', short: '速', color: '#63d68c', duration: 9, interval: 0.065 },
      };
      const PICKUP_TYPES = ['spread', 'laser', 'homing', 'rapid'];

      function syncJoyTools() {
        if (!dom.joyPulse || !dom.joyShield) return;
        dom.joyPulse.querySelector('[data-joy-count]').textContent = String(tools.pulse);
        dom.joyShield.querySelector('[data-joy-count]').textContent = String(tools.shield);
        dom.joyPulse.disabled = state !== 'playing' || tools.pulse <= 0;
        dom.joyShield.disabled = state !== 'playing' || tools.shield <= 0 || shieldTimer > 0;
        dom.joyShield.setAttribute('aria-pressed', String(shieldTimer > 0));
        dom.joyPulse.setAttribute('aria-label', '电磁脉冲，剩余 ' + tools.pulse + ' 次（快捷键 1）');
        dom.joyShield.setAttribute('aria-label', shieldTimer > 0
          ? '星盾生效中，剩余 ' + shieldTimer.toFixed(1) + ' 秒'
          : '星盾 5 秒，剩余 ' + tools.shield + ' 次（快捷键 2）');
      }

      function activateJoyTool(id) {
        if (state !== 'playing') return false;
        if (id === 'pulse') {
          if (tools.pulse <= 0 || (!shots.length && !enemies.length)) return false;
          tools.pulse -= 1;
          if (mode === 'challenge') chAssisted = true;
          shots = [];
          enemies.slice().forEach((e) => {
            const index = enemies.indexOf(e);
            if (index < 0) return;
            if (e.kind === 'boss') {
              e.hp = Math.max(0, e.hp - 100);
              if (e.hp <= 0) killEnemy(e, index);
            } else {
              killEnemy(e, index);
            }
          });
          addFloater(player.x, player.y - 42, '电磁脉冲！', '#7ce8e0');
          particles.emit(player.x, player.y, {
            count: A.reducedMotion ? 8 : 24,
            speed: [80, 280], life: [0.25, 0.65], size: [2, 5],
            colors: ['#7ce8e0', '#ffffff', '#4f7cff'],
          });
          shake = A.reducedMotion ? 0 : 6;
          A.Sfx.play('explode');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        if (id === 'shield') {
          if (tools.shield <= 0 || shieldTimer > 0) return false;
          tools.shield -= 1;
          if (mode === 'challenge') chAssisted = true;
          shieldTimer = SHIELD_SECONDS;
          addFloater(player.x, player.y - 38, '星盾 5 秒', '#7ce8e0');
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        return false;
      }

      function clickJoyTool(id) {
        const button = document.querySelector('[data-joy-tool="' + id + '"]');
        if (!button) return false;
        joyLastResult = null;
        button.click();
        return joyLastResult === true;
      }

      function bindJoyTools() {
        document.querySelectorAll('[data-joy-tool]').forEach((button) => {
          button.addEventListener('click', () => {
            joyLastResult = activateJoyTool(button.dataset.joyTool);
          });
        });
        window.addEventListener('keydown', (e) => {
          if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
          const target = e.target;
          if (target && target.tagName) {
            const tag = target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
          }
          const id = { '1': 'pulse', '2': 'shield' }[e.key];
          if (!id) return;
          e.preventDefault();
          clickJoyTool(id);
        });
      }

      function activeBuffs() {
        return BUFF_TYPES.filter((type) => buffs[type] > 0);
      }
      function buffColor() {
        if (lastBuff !== 'normal' && buffs[lastBuff] > 0) return WEAPONS[lastBuff].color;
        const active = activeBuffs();
        return active.length ? WEAPONS[active[active.length - 1]].color : WEAPONS.normal.color;
      }
      function buffHudText() {
        return activeBuffs()
          .map((type) => WEAPONS[type].short + Math.ceil(buffs[type]) + 's')
          .join(' ');
      }

      /* ---------- 敌机类型 ---------- */
      const KINDS = {
        drone: { w: 30, h: 24, hp: 1, score: 10, color: '#c06bff', speed: [95, 150] },
        sine: { w: 32, h: 26, hp: 2, score: 25, color: '#35e0d0', speed: [65, 85] },
        diver: { w: 28, h: 30, hp: 2, score: 20, color: '#ffa53d', speed: [130, 170] },
        tank: { w: 54, h: 44, hp: 6, score: 80, color: '#ff5d7a', speed: [38, 50] },
      };

      function bossSpec(lv) {
        const cycle = Math.max(0, lv - 1);
        return {
          name: BOSS_NAMES[cycle % BOSS_NAMES.length] + ' MK.' + lv,
          w: 118,
          h: 86,
          hp: BOSS_BASE_HP + cycle * BOSS_HP_STEP,
          score: 500 * lv,
        };
      }

      /* ---------- 波次：让难度以可读的阶段递进，而不是只看分数 ---------- */
      const WAVES = [
        { name: '巡逻', at: 0, spawn: 1.2, speed: 1.0, kinds: ['drone'], fire: false, maxEnemies: 7, maxShots: 0 },
        { name: '俯冲', at: 20, spawn: 1.05, speed: 1.08, kinds: ['drone', 'diver'], fire: false, maxEnemies: 8, maxShots: 0 },
        { name: '弹幕', at: 45, spawn: 0.94, speed: 1.15, kinds: ['drone', 'diver', 'sine'], fire: true, maxEnemies: 9, maxShots: 12 },
        { name: '精英', at: 75, spawn: 0.84, speed: 1.22, kinds: ['drone', 'diver', 'sine', 'tank'], fire: true, maxEnemies: 10, maxShots: 18 },
        { name: '休整', at: 95, spawn: 1.7, speed: 0.92, kinds: ['drone'], fire: false, maxEnemies: 5, maxShots: 0, rest: true },
      ];
      const WAVE_CYCLE = 103;

      function waveInfo() {
        const cycle = Math.floor(elapsed / WAVE_CYCLE);
        const t = elapsed % WAVE_CYCLE;
        let phase = WAVES[0];
        for (let i = 0; i < WAVES.length; i++) {
          if (t >= WAVES[i].at) phase = WAVES[i];
        }
        return {
          cycle,
          phase,
          label: 'W' + (cycle + 1) + ' ' + phase.name,
          scale: 1 + cycle * 0.12,
          maxEnemies: Math.min(14, phase.maxEnemies + cycle * 2),
          maxShots: Math.min(26, phase.maxShots + cycle * 2),
        };
      }

      function spawnEnemy() {
        const wave = waveInfo();
        const defs = wave.phase.kinds.map((k) => KINDS[k]);
        const def = pick(defs);
        const kind = Object.keys(KINDS).find((k) => KINDS[k] === def) || 'drone';
        const e = {
          uid: nextUid++,
          kind,
          x: rand(30, W - 30 - def.w),
          y: -def.h - 6,
          w: def.w,
          h: def.h,
          hp: def.hp + (kind === 'tank' ? Math.min(4, wave.cycle * 2) : 0) + (level - 1),
          score: def.score,
          color: def.color,
          vy: rand(def.speed[0], def.speed[1]) * wave.phase.speed * (1 + wave.cycle * 0.06 + (level - 1) * 0.06),
          t: rand(0, 10),
          fireTimer: wave.phase.fire ? rand(0.8, 2.2) : 999,
          baseX: 0,
          vx: 0,
        };
        e.baseX = e.x;
        if (kind === 'diver') {
          const dx = player.x - (e.x + e.w / 2);
          e.vx = clamp(dx / 1.6, -110, 110);
        }
        enemies.push(e);
      }

      function enemyShot(e, speed) {
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h;
        const dx = player.x - cx;
        const dy = player.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        shots.push({ x: cx, y: cy, vx: (dx / len) * speed, vy: (dy / len) * speed, r: 4 });
      }

      /* ---------- 关卡 Boss ---------- */
      function spawnBoss() {
        if (boss) return;
        const spec = bossSpec(level);
        enemies = [];
        boss = {
          uid: nextUid++,
          kind: 'boss',
          name: spec.name,
          x: (W - spec.w) / 2,
          y: -spec.h,
          w: spec.w,
          h: spec.h,
          hp: spec.hp,
          maxHp: spec.hp,
          score: spec.score,
          color: '#ff5d7a',
          vy: 55,
          t: 0,
          fireTimer: 1.4,
          baseX: (W - spec.w) / 2,
          vx: 0,
          phase: 1,
        };
        enemies.push(boss);
        shots = [];
        spawnTimer = 999;
        stageTime = STAGE_WAVE_SECONDS;
        stageBannerText = 'WARNING · ' + spec.name;
        stageBanner = 2.0;
        shake = A.reducedMotion ? 0 : 5;
        A.Sfx.play('explode');
        syncHud();
      }

      function updateBoss(b, dt) {
        b.t += dt;
        if (b.y < 112) b.y += b.vy * dt;
        else b.y = 112 + Math.sin(b.t * 1.4) * 9;
        b.x = clamp(b.baseX + (b.t < 1.4 ? 0 : Math.sin(b.t * 0.75) * 90), 22, W - b.w - 22);

        const ratio = b.hp / b.maxHp;
        if (ratio <= 0.6 && b.phase < 2) {
          b.phase = 2;
          stageBannerText = 'BOSS 狂暴';
          stageBanner = 1.2;
          shake = A.reducedMotion ? 0 : 6;
          A.Sfx.play('explode');
        }
        if (ratio <= 0.3 && b.phase < 3) {
          b.phase = 3;
          stageBannerText = 'BOSS 濒危 · 火力全开';
          stageBanner = 1.2;
          shake = A.reducedMotion ? 0 : 8;
          A.Sfx.play('explode');
        }

        b.fireTimer -= dt;
        if (b.fireTimer <= 0 && b.y >= 104) {
          bossFire(b);
          b.fireTimer = ratio < 0.3 ? 0.72 : ratio < 0.6 ? 0.95 : 1.25;
        }
      }

      function bossFire(b) {
        const ratio = b.hp / b.maxHp;
        const spd = 160 + level * 12;
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h * 0.72;
        const base = Math.atan2(player.y - cy, player.x - cx);
        const fan = ratio < 0.3 ? 7 : 5;
        for (let i = -(fan - 1) / 2; i <= (fan - 1) / 2; i++) {
          if (shots.length >= 60) break;
          const angle = base + i * 0.17;
          shots.push({ x: cx, y: cy, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, r: 4 });
        }
        if (ratio < 0.6) {
          const count = ratio < 0.3 ? 14 : 10;
          for (let i = 0; i < count; i++) {
            if (shots.length >= 60) break;
            const angle = (i / count) * TAU + b.t * 0.6;
            shots.push({ x: cx, y: cy, vx: Math.cos(angle) * spd * 0.8, vy: Math.sin(angle) * spd * 0.8, r: 4 });
          }
        }
        A.Sfx.play('shoot');
      }

      function stageClear(cleared) {
        boss = null;
        level += 1;
        stageTime = 0;
        shots = [];
        spawnTimer = 1.3;
        lives = Math.min(5, lives + 1);
        tools.pulse = Math.min(JOY_TOOL_CAPS.pulse, tools.pulse + 1);
        tools.shield = Math.min(JOY_TOOL_CAPS.shield, tools.shield + 1);
        stageBannerText = 'STAGE ' + cleared + ' CLEAR';
        stageBanner = 2.4;
        state = 'clear';
        pendingClearStage = cleared;
        A.Sfx.play('perfect');
        syncHud();
        syncJoyTools();
        autosave.saveNow();
        loop.pause();
        showClearPanel(cleared);
        pauseUi.sync();
      }

      /* CLEAR 选择弹层抽成函数：刷新恢复后也能重新给出「下一关 / 圆满收局」。 */
      function showClearPanel(cleared) {
        ui.show({
          title: 'STAGE ' + cleared + ' CLEAR',
          text: '击坠得分 ' + score + ' · 道具各补给 1 次<br/>可以继续下一关，也可以轻松收局。',
          btn: '下一关',
          onBtn: resumeClear,
          btn2: '圆满收局',
          onBtn2: () => gameOver(true),
        });
      }

      function resumeClear() {
        if (state !== 'clear') return false;
        state = 'playing';
        pendingClearStage = 0;
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        autosave.saveNow();
        return true;
      }

      /* ---------- 游戏流程 ---------- */
      function reset() {
        bullets = [];
        enemies = [];
        shots = [];
        pickups = [];
        floaters = [];
        score = 0;
        lives = 3;
        spawnTimer = 0.4;
        shake = 0;
        recordSaved = false;
        dragOffset = null;
        nextUid = 1;
        pickupPity = 0;
        BUFF_TYPES.forEach((type) => {
          buffs[type] = 0;
        });
        lastBuff = 'normal';
        level = 1;
        stageTime = 0;
        pendingClearStage = 0;
        boss = null;
        stageBanner = 0;
        stageBannerText = '';
        elapsed = 0;
        tools.pulse = 1;
        tools.shield = 1;
        shieldTimer = 0;
        player.x = W / 2;
        player.y = H - 90;
        player.cool = 0;
        player.invul = 0;
        particles.clear();
        syncHud();
        syncJoyTools();
      }

      function syncHud() {
        dom.hudScore.textContent = String(score);
        if (dom.hudStage) dom.hudStage.textContent = String(level);
        const text = buffHudText();
        if (text) {
          dom.hudBuff.hidden = false;
          if (dom.hudWeapon.textContent !== text) dom.hudWeapon.textContent = text;
        } else {
          dom.hudBuff.hidden = true;
        }
      }

      function startGame() {
        autosave.clear();
        mode = 'classic';
        chStage = null;
        chContent = null;
        chEvents = [];
        hideChallengePanel();
        setChallengeChrome(false);
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
      }

      function gameOver(won) {
        if (state === 'over') return;
        const wonRun = won === true;
        state = 'over';
        pendingClearStage = 0;
        A.Sfx.play(wonRun ? 'perfect' : 'over');
        autosave.clear();
        const rec = recordSaved ? null : A.Progress.recordPlay('star-raid', score); if (rec) high = rec.high;
        recordSaved = true;
        dom.hudHigh.textContent = String(Math.max(high, score));
        loop.pause();
        ui.show({
          title: wonRun ? '星海凯旋！' : '机体损毁',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `击坠得分 · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync();
        syncJoyTools();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        if (mode === 'challenge') {
          ui.show({
            title: '已暂停 · 挑战 ' + (chStage ? 'C' + pad2(chStage.stageNumber || 0) : ''),
            text: challengeLabel(chStage) + '<br/>进度已保存，可以随时离开。',
            btn: '继续',
            onBtn: resumeGame,
            btn2: '退出挑战',
            onBtn2: showChallengePanel,
          });
        } else {
          ui.show({
            title: '已暂停',
            text: '休息一下，敌人不会等太久。<br/>局内进度已保存，可以随时离开。',
            btn: '继续',
            onBtn: resumeGame,
          });
        }
        pauseUi.sync();
        syncJoyTools();
      }

      function showStart() {
        mode = 'classic';
        state = 'ready';
        chStage = null;
        chContent = null;
        chEvents = [];
        setChallengeChrome(false);
        const hasChallenge = challengeAvailable();
        ui.show({
          title: '星海突击',
          text: '纵版弹幕射击：击落敌机，躲开弹幕。<br/>吃下 <b>散射 / 激光 / 追踪 / 速射</b>，弹种可叠加<br/>道具 1/2 主动使用 · 每关 Boss 后可继续或收局 · 生命 ×3',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: hasChallenge ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: hasChallenge ? showChallengePanel : () => A.showToast('挑战数据不可用'),
        });
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused' && state !== 'clear') return null;
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          player: { x: player.x, y: player.y, invul: player.invul },
          bullets: bullets.map((b) => ({
            x: b.x,
            y: b.y,
            vx: b.vx,
            vy: b.vy,
            r: b.r,
            dmg: b.dmg,
            pierce: !!b.pierce,
            laser: !!b.laser,
            homing: !!b.homing,
            hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
          })),
          enemies: enemies.map((e) => ({
            uid: e.uid,
            kind: e.kind,
            x: e.x,
            y: e.y,
            w: e.w,
            h: e.h,
            hp: e.hp,
            maxHp: e.maxHp || e.hp,
            score: e.score,
            name: e.name || '',
            phase: e.phase || 1,
            vy: e.vy,
            t: e.t,
            fireTimer: e.fireTimer,
            baseX: e.baseX,
            vx: e.vx,
            chSway: e.chSway || 0,
            chChargeAt: e.chChargeAt || 0,
            exposed: e.exposed !== false,
            weakSide: e.weakSide || 'left',
            salvoIndex: e.salvoIndex || 0,
          })),
          shots,
          pickups,
          score,
          lives,
          spawnTimer,
          nextUid,
          pickupPity,
          buffs: { ...buffs },
          lastBuff,
          stage: level,
          stageTime,
          elapsed,
          tools: { pulse: tools.pulse, shield: tools.shield },
          shieldTimer,
          clearStage: pendingClearStage,
          challenge:
            mode === 'challenge'
              ? {
                  time: chTime,
                  health: chHealth,
                  assisted: chAssisted,
                  collectibles: chCollectibles.slice(),
                  damageLog: chDamageLog.slice(0, 40),
                  powerupLog: chPowerupLog.slice(0, 40),
                  bossDefeated: chBossDefeated,
                  bossMaxPhase: chBossMaxPhase,
                  bossExposedWindows: chBossExposedWindows,
                  events: chEvents.map((ev) => ({
                    id: ev.id,
                    started: ev.started,
                    phase: ev.phase,
                    phaseTime: ev.phaseTime,
                    salvoIndex: ev.salvoIndex,
                    lastSalvo: ev.lastSalvo,
                    done: ev.done,
                  })),
                  boss: boss
                    ? {
                        uid: boss.uid,
                        hp: boss.hp,
                        maxHp: boss.maxHp,
                        phase: boss.phase,
                        exposed: boss.exposed !== false,
                        weakSide: boss.weakSide || 'left',
                        salvoIndex: boss.salvoIndex || 0,
                        t: boss.t,
                      }
                    : null,
                }
              : null,
        };
      }

      function restoreChallenge(data) {
        const stage = challengeStageByRef(String(data.stageId || ''));
        if (!stage) return false;
        try {
          resetChallenge(stage);
          const savedPlayer = data.player && typeof data.player === 'object' ? data.player : {};
          player.x = clamp(Number(savedPlayer.x) || player.x, 20, W - 20);
          player.y = clamp(Number(savedPlayer.y) || player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
          player.invul = Number(savedPlayer.invul) || 0;
          bullets = (data.bullets || [])
            .filter((b) => b && isFinite(b.x) && isFinite(b.y))
            .map((b) => ({
              x: Number(b.x) || 0,
              y: Number(b.y) || 0,
              vx: Number(b.vx) || 0,
              vy: Number(b.vy) || -640,
              r: Number(b.r) || 3,
              dmg: Number(b.dmg) || 1,
              pierce: !!b.pierce,
              laser: !!b.laser,
              homing: !!b.homing,
              hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
            }));
          shots = (data.shots || [])
            .filter((s) => s && isFinite(s.x) && isFinite(s.y))
            .map((s) => ({
              x: Number(s.x) || 0,
              y: Number(s.y) || 0,
              vx: Number(s.vx) || 0,
              vy: Number(s.vy) || 0,
              r: Number(s.r) || 4,
              chSource: s.chSource ? String(s.chSource) : null,
            }));
          pickups = (data.pickups || [])
            .filter((p) => p && WEAPONS[p.type])
            .map((p) => ({
              x: Number(p.x) || W / 2,
              y: Number(p.y) || 0,
              vy: Number(p.vy) || 70,
              r: 15,
              type: p.type,
              spin: Number(p.spin) || 0,
              chPowerup: p.chPowerup ? String(p.chPowerup) : null,
            }));
          enemies = (data.enemies || [])
            .filter((e) => e && (e.kind === 'boss' || KINDS[e.kind]) && isFinite(e.x) && isFinite(e.y))
            .map((e) => {
              const isBoss = e.kind === 'boss';
              const hp = Math.max(1, Number(e.hp) || 1);
              return {
                uid: Number(e.uid) || nextUid++,
                kind: e.kind,
                x: Number(e.x) || 0,
                y: Number(e.y) || 0,
                w: Number(e.w) || (isBoss ? 118 : KINDS[e.kind].w),
                h: Number(e.h) || (isBoss ? 86 : KINDS[e.kind].h),
                hp,
                maxHp: Math.max(hp, Number(e.maxHp) || hp),
                score: Number(e.score) || (isBoss ? 1200 : KINDS[e.kind].score),
                color: isBoss ? '#ff5d7a' : KINDS[e.kind].color,
                vy: Number(e.vy) || 120,
                t: Number(e.t) || 0,
                fireTimer: 999,
                baseX: Number(e.baseX) || Number(e.x) || 0,
                vx: 0,
                name: isBoss ? String(e.name || 'BOSS') : '',
                phase: Number(e.phase) || 1,
                exposed: e.exposed !== false,
                wasExposed: e.exposed !== false,
                weakSide: e.weakSide === 'right' ? 'right' : 'left',
                salvoIndex: Math.max(0, Math.floor(Number(e.salvoIndex) || 0)),
                chSway: Number(e.chSway) || 0,
                chChargeAt: Number(e.chChargeAt) || 0,
              };
            });
          boss = enemies.find((e) => e.kind === 'boss') || null;
          score = Math.max(0, Number(data.score) || 0);
          nextUid = Math.max(nextUid, Number(data.nextUid) || 1);
          BUFF_TYPES.forEach((type) => {
            buffs[type] = 0;
          });
          if (data.buffs && typeof data.buffs === 'object') {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = Math.max(0, Number(data.buffs[type]) || 0);
            });
          }
          lastBuff = activeBuffs().slice(-1)[0] || 'normal';
          if (data.lastBuff && buffs[data.lastBuff] > 0) lastBuff = data.lastBuff;
          if (data.tools && typeof data.tools === 'object') {
            tools.pulse = Number.isFinite(Number(data.tools.pulse)) ? clamp(Math.floor(Number(data.tools.pulse)), 0, JOY_TOOL_CAPS.pulse) : 1;
            tools.shield = Number.isFinite(Number(data.tools.shield)) ? clamp(Math.floor(Number(data.tools.shield)), 0, JOY_TOOL_CAPS.shield) : 1;
          }
          shieldTimer = clamp(Number(data.shieldTimer) || 0, 0, SHIELD_SECONDS);
          const ch = data.challenge && typeof data.challenge === 'object' ? data.challenge : {};
          chTime = clamp(Number(ch.time) || 0, 0, 3600);
          const maxHealth = Math.max(1, Math.floor(Number(chContent.startingHealth) || 3));
          chHealth = clamp(Math.floor(Number(ch.health) || maxHealth), 1, maxHealth);
          chAssisted = !!ch.assisted;
          chCollectibles = Array.isArray(ch.collectibles) ? ch.collectibles.filter((id) => typeof id === 'string').slice(0, 48) : [];
          chDamageLog = Array.isArray(ch.damageLog) ? ch.damageLog.slice(0, 40) : [];
          chPowerupLog = Array.isArray(ch.powerupLog) ? ch.powerupLog.slice(0, 40) : [];
          chBossDefeated = !!ch.bossDefeated;
          chBossMaxPhase = clamp(Math.floor(Number(ch.bossMaxPhase) || 0), 0, 9);
          chBossExposedWindows = clamp(Math.floor(Number(ch.bossExposedWindows) || 0), 0, 999);
          const savedEvents = Array.isArray(ch.events) ? ch.events : [];
          chEvents.forEach((ev) => {
            const saved = savedEvents.find((item) => item && item.id === ev.id);
            if (!saved) return;
            ev.started = !!saved.started;
            ev.phase = ['pending', 'telegraph', 'attack', 'done'].indexOf(saved.phase) !== -1 ? saved.phase : 'pending';
            ev.phaseTime = clamp(Number(saved.phaseTime) || 0, 0, 120);
            ev.salvoIndex = Math.max(0, Math.floor(Number(saved.salvoIndex) || 0));
            ev.lastSalvo = Number(saved.lastSalvo) || 0;
            ev.done = !!saved.done;
          });
          if (boss && ch.boss && typeof ch.boss === 'object') {
            boss.exposed = ch.boss.exposed !== false;
            boss.wasExposed = ch.boss.exposed !== false;
            boss.weakSide = ch.boss.weakSide === 'right' ? 'right' : 'left';
            boss.salvoIndex = Math.max(0, Math.floor(Number(ch.boss.salvoIndex) || 0));
            if (Number.isFinite(Number(ch.boss.hp))) boss.hp = clamp(Number(ch.boss.hp), 1, boss.maxHp);
          }
          recordSaved = false;
          state = 'playing';
          syncHud();
          syncJoyTools();
          setChallengeChrome(true);
          syncChallengeHud(true);
          return true;
        } catch (err) {
          return false;
        }
      }

      function restore(data) {
        if (!data) return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        if (!data.player || !Array.isArray(data.enemies)) return false;
        try {
          mode = 'classic';
          chStage = null;
          chContent = null;
          chEvents = [];
          setChallengeChrome(false);
          reset();
          player.x = clamp(Number(data.player.x) || W / 2, 20, W - 20);
          player.y = clamp(Number(data.player.y) || H - 90, PLAYER_MIN_Y, PLAYER_MAX_Y);
          player.invul = Number(data.player.invul) || 0;
          bullets = (data.bullets || []).filter((b) => b && isFinite(b.x) && isFinite(b.y)).map((b) => ({
            x: Number(b.x) || 0,
            y: Number(b.y) || 0,
            vx: Number(b.vx) || 0,
            vy: Number(b.vy) || -640,
            r: Number(b.r) || 3,
            dmg: Number(b.dmg) || 1,
            pierce: !!b.pierce,
            laser: !!b.laser,
            homing: !!b.homing,
            hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
          }));
          level = clamp(Math.floor(Number(data.stage) || 1), 1, 999);
          stageTime = Math.max(0, Number(data.stageTime) || 0);
          const bossDef = bossSpec(level);
          enemies = data.enemies
            .filter((e) => e && (e.kind === 'boss' || KINDS[e.kind]) && isFinite(e.x) && isFinite(e.y))
            .map((e) => {
              const isBoss = e.kind === 'boss';
              const hp = Math.max(1, Number(e.hp) || (isBoss ? bossDef.hp : 1));
              return {
                uid: Number(e.uid) || nextUid++,
                kind: e.kind,
                x: Number(e.x) || 0,
                y: Number(e.y) || 0,
                w: Number(e.w) || (isBoss ? bossDef.w : KINDS[e.kind].w),
                h: Number(e.h) || (isBoss ? bossDef.h : KINDS[e.kind].h),
                hp,
                maxHp: Math.max(hp, Number(e.maxHp) || (isBoss ? bossDef.hp : hp)),
                score: Number(e.score) || (isBoss ? bossDef.score : KINDS[e.kind].score),
                color: isBoss ? '#ff5d7a' : KINDS[e.kind].color,
                vy: Number(e.vy) || 100,
                t: Number(e.t) || 0,
                fireTimer: Number(e.fireTimer) || 1,
                baseX: Number(e.baseX) || 0,
                vx: Number(e.vx) || 0,
                name: isBoss ? String(e.name || bossDef.name) : '',
                phase: Number(e.phase) || 1,
              };
            });
          boss = enemies.find((e) => e.kind === 'boss') || null;
          shots = (data.shots || []).filter((s) => s && isFinite(s.x) && isFinite(s.y)).map((s) => ({
            x: Number(s.x) || 0,
            y: Number(s.y) || 0,
            vx: Number(s.vx) || 0,
            vy: Number(s.vy) || 0,
            r: Number(s.r) || 4,
          }));
          pickups = (data.pickups || []).filter((p) => p && WEAPONS[p.type]).map((p) => ({
            x: Number(p.x) || W / 2,
            y: Number(p.y) || 0,
            vy: Number(p.vy) || 70,
            r: 15,
            type: p.type,
            spin: Number(p.spin) || 0,
          }));
          score = Math.max(0, Number(data.score) || 0);
          lives = clamp(Number(data.lives) || 3, 1, 5);
          spawnTimer = Number(data.spawnTimer) || 0.4;
          nextUid = Math.max(nextUid, Number(data.nextUid) || 1);
          pickupPity = Number(data.pickupPity) || 0;
          BUFF_TYPES.forEach((type) => {
            buffs[type] = 0;
          });
          if (data.buffs && typeof data.buffs === 'object') {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = Math.max(0, Number(data.buffs[type]) || 0);
            });
          } else if (WEAPONS[data.weapon] && data.weapon !== 'normal') {
            /* 旧版单弹种存档迁移为对应 Buff。 */
            buffs[data.weapon] = Math.max(0, Number(data.weaponTimer) || 0);
          }
          lastBuff = activeBuffs().slice(-1)[0] || 'normal';
          if (data.lastBuff && buffs[data.lastBuff] > 0) lastBuff = data.lastBuff;
          elapsed = Math.max(0, Number(data.elapsed) || 0);
          if (data.tools && typeof data.tools === 'object') {
            tools.pulse = Number.isFinite(Number(data.tools.pulse)) ? clamp(Math.floor(Number(data.tools.pulse)), 0, JOY_TOOL_CAPS.pulse) : 1;
            tools.shield = Number.isFinite(Number(data.tools.shield)) ? clamp(Math.floor(Number(data.tools.shield)), 0, JOY_TOOL_CAPS.shield) : 1;
          }
          shieldTimer = clamp(Number(data.shieldTimer) || 0, 0, SHIELD_SECONDS);
          pendingClearStage = clamp(Math.floor(Number(data.clearStage) || 0), 0, 999);
          recordSaved = false;
          syncHud();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('star-raid', serialize, {
        every: 4,
        meta: () =>
          mode === 'challenge'
            ? {
                score: Math.floor(chTime),
                summary: `挑战 ${chStage ? 'C' + pad2(chStage.stageNumber || 0) : ''} · 生命 ${chHealth} · ${challengeFmt(chTime)}`,
              }
            : {
                score,
                summary: `得分 ${score} · 第 ${level} 关${boss ? ' · BOSS' : ' · ' + waveInfo().label} · 生命 ${lives}`,
              },
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        stars.update(dt, state === 'playing' ? 2.2 : 0.6);
        particles.update(dt);
        shake = Math.max(0, shake - dt * 26);
        updateFloaters(dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        if (mode === 'challenge') {
          updateChallenge(dt);
          if (state !== 'playing') {
            input.endFrame();
            return;
          }
          updatePlayer(dt);
          updateChallengeEnemies(dt);
          updateBullets(dt);
          updatePickups(dt);
          collide();
          input.endFrame();
          return;
        }
        elapsed += dt;
        stageBanner = Math.max(0, stageBanner - dt);
        if (!boss) {
          stageTime += dt;
          if (stageTime >= STAGE_WAVE_SECONDS) spawnBoss();
        }
        updatePlayer(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updatePickups(dt);
        collide();
        input.endFrame();
      }

      function fire() {
        player.cool = buffs.rapid > 0 ? 0.075 : 0.13;
        if (mode === 'challenge') chFiredVolleys += 1;
        /* 普通弹始终存在；每种已激活 Buff 在每一轮里追加自己的弹型，形成叠加。 */
        bullets.push({ x: player.x - 10, y: player.y - 14, vx: 0, vy: -640, r: 3, dmg: 1 });
        bullets.push({ x: player.x + 10, y: player.y - 14, vx: 0, vy: -640, r: 3, dmg: 1 });
        if (buffs.spread > 0) {
          [-0.24, 0, 0.24].forEach((ang) => {
            bullets.push({
              x: player.x,
              y: player.y - 14,
              vx: Math.sin(ang) * 560,
              vy: -Math.cos(ang) * 560,
              r: 3.2,
              dmg: 1,
            });
          });
        }
        if (buffs.laser > 0) {
          bullets.push({
            x: player.x,
            y: player.y - 22,
            vx: 0,
            vy: -980,
            r: 5,
            dmg: 2,
            pierce: true,
            laser: true,
            hitIds: [],
          });
        }
        if (buffs.homing > 0) {
          [-9, 9].forEach((dx) => {
            bullets.push({
              x: player.x + dx,
              y: player.y - 12,
              vx: rand(-60, 60),
              vy: -480,
              r: 4,
              dmg: 1.4,
              homing: true,
            });
          });
        }
        if (buffs.rapid > 0) {
          bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -780, r: 2.5, dmg: 1 });
        }
        A.Sfx.play('shoot');
      }

      function updatePlayer(dt) {
        const speed = 320;
        if (input.isDown('ArrowLeft', 'a')) player.x -= speed * dt;
        if (input.isDown('ArrowRight', 'd')) player.x += speed * dt;
        if (input.isDown('ArrowUp', 'w')) player.y -= speed * dt;
        if (input.isDown('ArrowDown', 's')) player.y += speed * dt;

        if (input.pointer.down) {
          if (dragOffset === null) {
            dragOffset = { x: input.pointer.x - player.x, y: input.pointer.y - player.y };
          }
          player.x = input.pointer.x - dragOffset.x;
          player.y = input.pointer.y - dragOffset.y;
        } else {
          dragOffset = null;
        }

        player.x = clamp(player.x, 20, W - 20);
        player.y = clamp(player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
        player.invul = Math.max(0, player.invul - dt);
        const hadShield = shieldTimer > 0;
        shieldTimer = Math.max(0, shieldTimer - dt);
        if (hadShield && shieldTimer <= 0) syncJoyTools();

        let buffChanged = false;
        BUFF_TYPES.forEach((type) => {
          if (buffs[type] <= 0) return;
          buffs[type] = Math.max(0, buffs[type] - dt);
          if (buffs[type] <= 0) {
            buffChanged = true;
            if (lastBuff === type) lastBuff = activeBuffs().slice(-1)[0] || 'normal';
            addFloater(player.x, player.y - 30, WEAPONS[type].name + '结束', '#93a0c8');
          }
        });
        if (buffChanged || activeBuffs().length) syncHud();

        player.cool -= dt;
        if (player.cool <= 0) fire();
      }

      function updateEnemies(dt) {
        const wave = waveInfo();
        if (!boss) {
          if (shots.length > wave.maxShots) shots.length = wave.maxShots;
          spawnTimer -= dt;
          if (!wave.phase.rest && enemies.length < wave.maxEnemies) {
            if (spawnTimer <= 0) {
              spawnTimer = wave.phase.spawn / wave.scale;
              spawnEnemy();
            }
          } else if (spawnTimer < 0.2) {
            spawnTimer = 0.2;
          }
        } else if (shots.length > 60) {
          shots.length = 60;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.kind === 'boss') {
            updateBoss(e, dt);
            continue;
          }
          e.t += dt;
          e.y += e.vy * dt;
          if (e.kind === 'sine') {
            e.x = e.baseX + Math.sin(e.t * 2.4) * 70;
            e.x = clamp(e.x, 4, W - e.w - 4);
          } else if (e.kind === 'diver') {
            e.x += e.vx * dt;
          }
          if (wave.phase.fire && (e.kind === 'sine' || e.kind === 'tank')) {
            e.fireTimer -= dt;
            if (e.fireTimer <= 0 && e.y > 0 && e.y < H - 260) {
              e.fireTimer = e.kind === 'tank' ? rand(1.6, 2.4) : rand(2.0, 3.2);
              const spd = 165 + wave.cycle * 14;
              if (e.kind === 'tank') {
                for (let k = -1; k <= 1; k++) {
                  if (shots.length >= wave.maxShots) break;
                  const ang = Math.atan2(player.y - e.y, player.x - e.x) + k * 0.38;
                  shots.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 4 });
                }
              } else if (shots.length < wave.maxShots) {
                enemyShot(e, spd);
              }
            }
          }
          if (e.y > H + 40) enemies.splice(i, 1);
        }
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (b.homing) {
            let best = null;
            let bestD = Infinity;
            for (const e of enemies) {
              const d = (e.x + e.w / 2 - b.x) ** 2 + (e.y + e.h / 2 - b.y) ** 2;
              if (d < bestD) {
                bestD = d;
                best = e;
              }
            }
            if (best) {
              const tx = best.x + best.w / 2 - b.x;
              const ty = best.y + best.h / 2 - b.y;
              const len = Math.hypot(tx, ty) || 1;
              b.vx += (tx / len) * 1500 * dt;
              b.vy += (ty / len) * 1500 * dt;
              const sp = Math.hypot(b.vx, b.vy) || 1;
              const targetSpeed = 560;
              b.vx = (b.vx / sp) * targetSpeed;
              b.vy = (b.vy / sp) * targetSpeed;
            }
          }
          b.x += (b.vx || 0) * dt;
          b.y += (b.vy || 0) * dt;
          if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) bullets.splice(i, 1);
        }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          if (s.y > H + 20 || s.y < -20 || s.x < -20 || s.x > W + 20) shots.splice(i, 1);
        }
      }

      function updatePickups(dt) {
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.y += p.vy * dt;
          p.spin += dt * 3;
          /* 靠近玩家时轻微吸附，避免辛苦打出的 Buff 从旁边滑走。 */
          if (p.y > H * 0.55) p.x += clamp(player.x - p.x, -80 * dt, 80 * dt);
          const box = { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
          const hb = { x: player.x - 20, y: player.y - 20, w: 40, h: 40 };
          if (A.Physics.aabbOverlap(hb, box)) {
            buffs[p.type] = Math.max(buffs[p.type], WEAPONS[p.type].duration);
            lastBuff = p.type;
            if (mode === 'challenge') {
              /* 挑战收集物：设计源 powerups 的拾取记录（不影响通关，不标记 assisted）。 */
              const collectedId = p.chPowerup || p.type;
              if (chCollectibles.indexOf(collectedId) === -1) chCollectibles.push(collectedId);
              chPowerupLog.push({ atSec: Math.round(chTime * 10) / 10, kind: collectedId });
            }
            syncHud();
            A.Sfx.play('perfect');
            addFloater(player.x, player.y - 34, (activeBuffs().length > 1 ? '叠加 ' : '') + WEAPONS[p.type].name + '弹！', WEAPONS[p.type].color);
            particles.emit(p.x, p.y, {
              count: A.reducedMotion ? 6 : 18,
              speed: [40, 180],
              life: [0.25, 0.6],
              size: [2, 4],
              colors: [WEAPONS[p.type].color, '#ffffff'],
              gravity: 80,
            });
            pickups.splice(i, 1);
            continue;
          }
          if (p.y > H + 30) pickups.splice(i, 1);
        }
      }

      function addFloater(x, y, text, color) {
        floaters.push({ x, y, text, color, life: 0.8, maxLife: 0.8 });
      }
      function updateFloaters(dt) {
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.life -= dt;
          f.y -= 34 * dt;
          if (f.life <= 0) floaters.splice(i, 1);
        }
      }

      function dropPickup(e) {
        const missing = PICKUP_TYPES.filter((type) => buffs[type] <= 0);
        let type;
        if (missing.length && Math.random() < 0.75) type = pick(missing);
        else type = PICKUP_TYPES[randInt(0, PICKUP_TYPES.length - 1)];
        pickups.push({
          x: clamp(e.x + e.w / 2, 24, W - 24),
          y: e.y + e.h / 2,
          vy: 72,
          r: 15,
          type,
          spin: 0,
        });
        pickupPity = 0;
        A.Sfx.play('bell', 8);
      }

      function killEnemy(e, idx, award) {
        enemies.splice(idx, 1);
        if (e.kind === 'boss') {
          score += e.score;
          addFloater(e.x + e.w / 2, e.y + e.h / 2, '+' + e.score, '#ffd23f');
          particles.emit(e.x + e.w / 2, e.y + e.h / 2, {
            count: A.reducedMotion ? 14 : 46,
            speed: [80, 360],
            life: [0.4, 1.1],
            size: [2, 7],
            colors: ['#ff5d7a', '#ffd23f', '#ffffff', '#4f7cff'],
            gravity: 90,
          });
          A.Sfx.play('explode');
          shake = A.reducedMotion ? 0 : 10;
          if (mode === 'challenge') {
            /* 挑战 Boss 击破 = 关卡通关（endCondition: defeat-boss）。 */
            chBossDefeated = true;
            boss = null;
            shots = [];
            chEvents.forEach((ev) => {
              if (ev.enemyType === 'boss') {
                ev.done = true;
                ev.phase = 'done';
              }
            });
            challengeClear();
            syncHud();
            return;
          }
          for (let i = 0; i < 3; i++) {
            dropPickup({
              x: e.x + rand(-40, 40),
              y: e.y + rand(-24, 24),
              w: 0,
              h: 0,
            });
          }
          stageClear(level);
          syncHud();
          return;
        }
        if (award !== false) {
          score += e.score;
          syncHud();
          addFloater(e.x + e.w / 2, e.y, '+' + e.score, '#ffd23f');
          pickupPity += 1;
          /* 挑战模式不使用随机掉落：掉 Buff 只由设计源 powerups 时间轴决定。 */
          if (mode !== 'challenge' && (Math.random() < (e.kind === 'tank' ? 0.8 : 0.1) || pickupPity >= 12)) dropPickup(e);
        } else {
          addFloater(e.x + e.w / 2, e.y, '撞毁', '#ff9a9a');
        }
        particles.emit(e.x + e.w / 2, e.y + e.h / 2, {
          count: A.reducedMotion ? 6 : 16,
          speed: [40, 220],
          life: [0.25, 0.7],
          size: [2, 5],
          colors: [e.color, '#ffd23f', '#ffffff'],
          gravity: 120,
        });
        A.Sfx.play(e.kind === 'tank' ? 'explode' : 'hit');
        if (e.kind === 'tank') shake = A.reducedMotion ? 0 : 5;
      }

      function hitPlayer() {
        if (mode === 'challenge') {
          challengeHit('弹幕/碰撞');
          return;
        }
        if (player.invul > 0 || shieldTimer > 0) return;
        lives -= 1;
        player.invul = 1.8;
        shake = A.reducedMotion ? 0 : 8;
        A.Sfx.play('explode');
        particles.emit(player.x, player.y, {
          count: 24,
          speed: [60, 260],
          life: [0.3, 0.8],
          size: [2, 5],
          colors: ['#4f7cff', '#ffffff', '#ffd23f'],
          gravity: 100,
        });
        if (lives <= 0) gameOver();
      }

      function collide() {
        /* 子弹 × 敌机 */
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (b.hitIds && b.hitIds.indexOf(e.uid) !== -1) continue;
            if (A.Physics.circleBox(b.x, b.y, (b.r || 3) + 2, e)) {
              /* 挑战 Boss 的护盾/未暴露阶段吸收伤害（弱点窗口才掉血）。 */
              if (mode === 'challenge' && e.kind === 'boss' && e.exposed === false) {
                particles.emit(b.x, b.y, { count: 2, speed: [20, 70], life: [0.08, 0.22], size: [1.5, 3], colors: ['#7ce8e0'] });
                if (b.pierce) {
                  if (b.hitIds.indexOf(e.uid) === -1) b.hitIds.push(e.uid);
                } else {
                  bullets.splice(j, 1);
                }
                continue;
              }
              e.hp -= b.dmg || 1;
              if (mode === 'challenge' && e.kind === 'boss') chBossHits += 1;
              particles.emit(b.x, b.y, { count: 3, speed: [20, 90], life: [0.1, 0.3], size: [1.5, 3], colors: [buffColor()] });
              if (b.pierce) {
                b.hitIds.push(e.uid);
              } else {
                bullets.splice(j, 1);
              }
              if (e.hp <= 0) {
                killEnemy(e, i);
                break;
              }
            }
          }
        }
        /* 玩家判定盒缩小（弹幕游戏惯例） */
        const hb = { x: player.x - 9, y: player.y - 8, w: 18, h: 16 };
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (!A.Physics.aabbOverlap(hb, e)) continue;
          if (e.kind === 'boss') {
            /* Boss 入场穿过顶部时不应撞伤贴顶玩家；完全进入后再启用机体碰撞。 */
            if (e.y >= 100 && player.invul <= 0) hitPlayer();
            continue;
          }
          if (player.invul <= 0) {
            killEnemy(e, i, false);
            hitPlayer();
          }
        }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          if (A.Physics.circleBox(s.x, s.y, s.r, hb)) {
            shots.splice(i, 1);
            hitPlayer();
          }
        }
      }

      /* ---------- 渲染 ---------- */
      function drawPlayer() {
        if (player.invul > 0 && Math.floor(player.invul * 12) % 2 === 0) return;
        ctx.save();
        ctx.translate(player.x, player.y);
        const active = activeBuffs();
        const spec = WEAPONS[lastBuff !== 'normal' && buffs[lastBuff] > 0 ? lastBuff : active[0] || 'normal'];
        active.forEach((type, index) => {
          ctx.strokeStyle = WEAPONS[type].color;
          ctx.globalAlpha = 0.35 + Math.sin(performance.now() / 120 + index) * 0.12;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 22 + index * 4, 0, TAU);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
        if (shieldTimer > 0) {
          ctx.strokeStyle = '#7ce8e0';
          ctx.lineWidth = 3;
          ctx.globalAlpha = 0.72;
          ctx.beginPath();
          ctx.arc(0, 0, 31, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        /* 喷焰 */
        const flame = 8 + Math.sin(performance.now() / 40) * 4;
