        ctx.fillStyle = '#ffb43d';
        ctx.beginPath();
        ctx.moveTo(-5, 12);
        ctx.lineTo(5, 12);
        ctx.lineTo(0, 12 + flame);
        ctx.closePath();
        ctx.fill();
        /* 机体 */
        ctx.fillStyle = '#e8eeff';
        ctx.strokeStyle = spec.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(13, 10);
        ctx.lineTo(5, 6);
        ctx.lineTo(0, 12);
        ctx.lineTo(-5, 6);
        ctx.lineTo(-13, 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = spec.color;
        ctx.beginPath();
        ctx.arc(0, -2, 3.4, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawBoss(b) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
        ctx.fillStyle = '#ff5d7a';
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -b.h / 2);
        ctx.lineTo(b.w * 0.28, -b.h * 0.16);
        ctx.lineTo(b.w / 2, 0);
        ctx.lineTo(b.w * 0.34, b.h * 0.34);
        ctx.lineTo(0, b.h / 2);
        ctx.lineTo(-b.w * 0.34, b.h * 0.34);
        ctx.lineTo(-b.w / 2, 0);
        ctx.lineTo(-b.w * 0.28, -b.h * 0.16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#3b1e3f';
        ctx.beginPath();
        ctx.ellipse(0, 0, b.w * 0.2, b.h * 0.2, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = b.phase >= 3 ? '#ffb0a0' : '#ffd23f';
        ctx.globalAlpha = 0.65 + pulse * 0.35;
        ctx.beginPath();
        ctx.arc(0, 0, 9 + pulse * 3, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        for (const side of [-1, 1]) {
          ctx.fillStyle = '#4f7cff';
          ctx.fillRect(side * b.w * 0.3 - 4, -b.h * 0.08, 8, b.h * 0.32);
        }
        if (mode === 'challenge' && b.exposed === false) {
          ctx.strokeStyle = 'rgba(124, 232, 224, 0.85)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(b.w, b.h) * 0.55 + pulse * 3, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawEnemy(e) {
        if (e.kind === 'boss') {
          drawBoss(e);
          return;
        }
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = e.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (e.kind === 'drone') {
          ctx.moveTo(0, -e.h / 2);
          ctx.lineTo(e.w / 2, 0);
          ctx.lineTo(0, e.h / 2);
          ctx.lineTo(-e.w / 2, 0);
          ctx.closePath();
        } else if (e.kind === 'sine') {
          for (let k = 0; k < 6; k++) {
            const ang = (k / 6) * TAU + Math.PI / 6;
            const px = Math.cos(ang) * (e.w / 2);
            const py = Math.sin(ang) * (e.h / 2);
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (e.kind === 'diver') {
          ctx.moveTo(0, e.h / 2);
          ctx.lineTo(e.w / 2, -e.h / 2);
          ctx.lineTo(-e.w / 2, -e.h / 2);
          ctx.closePath();
        } else {
          for (let k = 0; k < 8; k++) {
            const ang = (k / 8) * TAU;
            const px = Math.cos(ang) * (e.w / 2);
            const py = Math.sin(ang) * (e.h / 2);
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();
        /* 核心 */
        ctx.fillStyle = 'rgba(10,14,30,0.85)';
        ctx.beginPath();
        ctx.arc(0, 0, Math.min(e.w, e.h) * 0.22, 0, TAU);
        ctx.fill();
        if (e.kind === 'tank' && e.hp <= 2) {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillRect(-e.w / 2 + 4, -e.h / 2 + 4, e.w - 8, 2);
        }
        ctx.restore();
      }

      function drawPickup(p) {
        const spec = WEAPONS[p.type];
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.sin(p.spin) * 0.25);
        ctx.fillStyle = 'rgba(8,12,26,0.9)';
        A.draw.roundRect(ctx, -p.r, -p.r, p.r * 2, p.r * 2, 7);
        ctx.fill();
        ctx.strokeStyle = spec.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = spec.color;
        A.draw.label(ctx, spec.name.charAt(0), 0, 1, { font: 'bold 13px system-ui', color: spec.color });
        ctx.restore();
      }

      function drawBullets() {
        bullets.forEach((b) => {
          if (b.laser) {
            ctx.fillStyle = 'rgba(255,134,200,0.3)';
            ctx.fillRect(b.x - 5, b.y - 16, 10, 32);
            ctx.fillStyle = '#ff86c8';
            ctx.fillRect(b.x - 2, b.y - 18, 4, 34);
          } else if (b.homing) {
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#fff6cf';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU);
            ctx.fill();
          } else {
            ctx.fillStyle = '#e8f4ff';
            ctx.fillRect(b.x - 1.5, b.y - 7, 3, 12);
          }
        });
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shake > 0) {
          ctx.translate(rand(-shake, shake), rand(-shake, shake));
        }
        /* 背景 */
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0a0f26');
        bg.addColorStop(1, '#141b42');
        ctx.fillStyle = bg;
        ctx.fillRect(-10, -10, W + 20, H + 20);
        stars.draw(ctx);
        particles.draw(ctx);
        if (mode === 'challenge') drawChallengeOverlay();

        enemies.forEach(drawEnemy);
        pickups.forEach(drawPickup);
        drawBullets();
        shots.forEach((s) => {
          ctx.fillStyle = '#ff86c8';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 0.45, 0, TAU);
          ctx.fill();
        });

        if (state === 'playing' || state === 'paused') drawPlayer();

        /* 浮动得分 */
        floaters.forEach((f) => {
          A.draw.label(ctx, f.text, f.x, f.y, {
            font: 'bold 13px system-ui, sans-serif',
            color: f.color,
            alpha: clamp(f.life / f.maxLife, 0, 1),
          });
        });

        /* 画布内 HUD */
        if (mode === 'challenge') {
          drawChallengeHud();
          ctx.restore();
          return;
        }
        A.draw.label(ctx, 'SCORE ' + score, 12, 20, { align: 'left', font: 'bold 14px system-ui, sans-serif', color: '#ffd23f' });
        const wave = waveInfo();
        A.draw.label(ctx, boss ? 'STG ' + level + ' · BOSS' : 'STG ' + level + ' · ' + wave.label, W / 2, 20, {
          font: 'bold 12px system-ui, sans-serif',
          color: boss ? '#ff9a9d' : wave.phase.rest ? '#63d68c' : '#93a0c8',
        });
        for (let i = 0; i < lives; i++) {
          ctx.save();
          ctx.translate(W - 20 - i * 18, 20);
          ctx.fillStyle = '#4f7cff';
          ctx.beginPath();
          ctx.moveTo(0, -7);
          ctx.lineTo(6, 6);
          ctx.lineTo(-6, 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        const active = activeBuffs();
        if (active.length) {
          const text = active.map((type) => WEAPONS[type].short + Math.ceil(buffs[type])).join(' ');
          A.draw.label(ctx, text, W / 2, 42, {
            font: 'bold 13px system-ui, sans-serif',
            color: buffColor(),
          });
        }
        if (boss) {
          const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
          A.draw.label(ctx, boss.name, W / 2, 57, {
            font: 'bold 11px system-ui, sans-serif',
            color: '#ff9a9d',
          });
          ctx.fillStyle = 'rgba(7,11,24,0.72)';
          ctx.fillRect(60, 65, 300, 7);
          ctx.fillStyle = boss.phase >= 3 ? '#ff5d7a' : boss.phase >= 2 ? '#ff9a3d' : '#ffd23f';
          ctx.fillRect(60, 65, 300 * ratio, 7);
        }
        if (stageBanner > 0) {
          A.draw.label(ctx, stageBannerText, W / 2, H * 0.34, {
            font: 'bold 22px system-ui, sans-serif',
            color: boss ? '#ff9a9d' : '#ffd23f',
            alpha: clamp(stageBanner / 0.5, 0, 1),
          });
        }
        ctx.restore();
      }

      /* ---------- 挑战模式渲染：安全走廊 / 预警 / 挑战 HUD ---------- */
      function drawChallengeOverlay() {
        challengeActiveEvents().forEach((ev) => {
          const band = challengeBand(ev);
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
          ctx.save();
          ctx.fillStyle = ev.phase === 'attack' ? 'rgba(90, 209, 160, 0.16)' : 'rgba(90, 209, 160, 0.10)';
          ctx.fillRect(band.left, 0, band.right - band.left, H);
          ctx.strokeStyle = 'rgba(90, 209, 160, 0.6)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(band.left, 0);
          ctx.lineTo(band.left, H);
          ctx.moveTo(band.right, 0);
          ctx.lineTo(band.right, H);
          ctx.stroke();
          if (ev.phase === 'telegraph') {
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = 'rgba(255, 210, 63, ' + (0.28 + pulse * 0.3) + ')';
            ctx.lineWidth = 1.5;
            challengeDangerColumns(band).forEach((x) => {
              ctx.beginPath();
              ctx.moveTo(x, 96);
              ctx.lineTo(x, H);
              ctx.stroke();
            });
            ctx.setLineDash([]);
            A.draw.label(ctx, '预警 · ' + challengePatternLabel(ev) + ' · 移向绿色安全走廊', W / 2, 88, {
              font: 'bold 12px system-ui, sans-serif',
              color: '#ffd23f',
            });
          } else if (ev.attackPattern === 'mark-charge') {
            ctx.fillStyle = 'rgba(255, 93, 107, 0.14)';
            challengeDangerColumns(band).forEach((x) => ctx.fillRect(x - 11, 90, 22, H - 90));
          }
          ctx.restore();
        });
      }
      function drawChallengeHud() {
        const duration = Math.max(1, Number(chContent && chContent.stageDurationSec) || 35);
        const maxHealth = Math.max(1, Math.floor(Number(chContent && chContent.startingHealth) || 3));
        const shade = ctx.createLinearGradient(0, 0, 0, 54);
        shade.addColorStop(0, 'rgba(7, 11, 24, 0.82)');
        shade.addColorStop(1, 'rgba(7, 11, 24, 0)');
        ctx.fillStyle = shade;
        ctx.fillRect(0, 0, W, 54);
        A.draw.label(ctx, '生命 ' + chHealth + '/' + maxHealth, 12, 20, {
          align: 'left',
          font: 'bold 14px system-ui, sans-serif',
          color: chHealth <= 1 ? '#ff8f86' : '#7ce8e0',
        });
        A.draw.label(ctx, challengeLabel(chStage), W / 2, 20, {
          font: 'bold 13px system-ui, sans-serif',
          color: '#ffd23f',
        });
        A.draw.label(ctx, challengeFmt(chTime) + ' / ' + duration + 's', W - 12, 20, {
          align: 'right',
          font: 'bold 13px system-ui, sans-serif',
          color: '#e8f4ff',
        });
        const active = chEvents.find((ev) => ev.started && !ev.done);
        const sub = boss
          ? 'BOSS ' + Math.ceil(boss.hp) + ' / ' + boss.maxHp + (boss.exposed === false ? ' · 护盾' : ' · 弱点暴露')
          : active
            ? challengePatternLabel(active) + (active.phase === 'telegraph' ? ' · 预警' : '')
            : '准备';
        A.draw.label(ctx, sub, W / 2, 38, {
          font: 'bold 12px system-ui, sans-serif',
          color: boss ? (boss.exposed === false ? '#7ce8e0' : '#ff9a9d') : '#93a0c8',
        });
        if (boss) {
          const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
          ctx.fillStyle = 'rgba(7,11,24,0.72)';
          ctx.fillRect(60, 50, 300, 6);
          ctx.fillStyle = boss.exposed === false ? '#4f7cff' : '#ff5d7a';
          ctx.fillRect(60, 50, 300 * ratio, 6);
        }
        if (stageBanner > 0) {
          A.draw.label(ctx, stageBannerText, W / 2, H * 0.34, {
            font: 'bold 20px system-ui, sans-serif',
            color: boss ? '#ff9a9d' : '#ffd23f',
            alpha: clamp(stageBanner / 0.6, 0, 1),
          });
        }
      }

      /* ---------- 输入与循环 ---------- */
      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();
      bindJoyTools();
      if (dom.chPanel) {
        dom.chPanel.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          if (target.closest('[data-ch-back]')) {
            closeChallengePanel();
            return;
          }
          const stageBtn = target.closest('.ac-stage-btn[data-stage-id]');
          if (!stageBtn || stageBtn.disabled) return;
          startChallenge(stageBtn.dataset.stageId);
        });
      }

      reset();
      state = 'ready';
      if (location.hash === '#test') {
        window.__arcadeTest = {
          giveBuff(type) {
            if (!WEAPONS[type] || type === 'normal') return false;
            buffs[type] = Math.max(buffs[type], WEAPONS[type].duration);
            lastBuff = type;
            syncHud();
            return true;
          },
          spawnPickup(type) {
            if (!WEAPONS[type] || type === 'normal') return false;
            pickups.push({ x: player.x, y: player.y - 44, vy: 120, r: 15, type, spin: 0 });
            return true;
          },
          clearBuffs() {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = 0;
            });
            lastBuff = 'normal';
            syncHud();
            return true;
          },
          info() {
            const wave = waveInfo();
            const active = activeBuffs();
            return {
              weapon: active.join('+') || 'normal',
              state,
              tools: { pulse: tools.pulse, shield: tools.shield },
              shieldTimer,
              buffs: { ...buffs },
              pickups: pickups.length,
              score,
              lives,
              stage: level,
              stageTime,
              bossActive: !!boss,
              bossHp: boss ? boss.hp : 0,
              bossMaxHp: boss ? boss.maxHp : 0,
              bossName: boss ? boss.name : '',
              player: { x: player.x, y: player.y },
              bulletCount: bullets.length,
              elapsed,
              wave: wave.label,
              maxEnemies: wave.maxEnemies,
              maxShots: wave.maxShots,
              shots: shots.length,
              enemies: enemies.length,
            };
          },
          joyInfo() {
            return {
              state,
              tools: { pulse: tools.pulse, shield: tools.shield },
              shieldTimer,
              shots: shots.length,
              enemies: enemies.length,
              stage: level,
              bossActive: !!boss,
              clear: state === 'clear',
            };
          },
          useJoyTool(id) {
            return clickJoyTool(id);
          },
          continueClear() {
            return resumeClear();
          },
          spawnShotAtPlayer() {
            shots.push({ x: player.x, y: player.y - 40, vx: 0, vy: 0, r: 4 });
            return shots.length;
          },
          fireNow() {
            const before = bullets.length;
            player.cool = 999;
            fire();
            const fresh = bullets.slice(before);
            return {
              added: fresh.length,
              laser: fresh.some((b) => b.laser),
              homing: fresh.filter((b) => b.homing).length,
              spread: fresh.filter((b) => b.r === 3.2).length,
            };
          },
          spawnBossNow() {
            stageTime = STAGE_WAVE_SECONDS;
            spawnBoss();
            return this.info();
          },
          damageBoss(amount) {
            if (!boss) return this.info();
            boss.hp -= Math.max(1, Number(amount) || 1);
            if (boss.hp <= 0) {
              const index = enemies.indexOf(boss);
              if (index >= 0) killEnemy(boss, index);
            }
            return this.info();
          },
          setPlayer(x, y) {
            player.x = clamp(Number(x) || player.x, 20, W - 20);
            player.y = clamp(Number(y) || player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
            return { x: player.x, y: player.y };
          },
          setElapsed(seconds) {
            elapsed = Math.max(0, Number(seconds) || 0);
            return waveInfo().label;
          },
          forceBodyCollision() {
            bullets = [];
            player.cool = 999;
            enemies.push({
              uid: nextUid++,
              kind: 'drone',
              x: player.x - 15,
              y: player.y - 12,
              w: 30,
              h: 24,
              hp: 1,
              score: 10,
              color: '#c06bff',
              vy: 0,
              t: 0,
              fireTimer: 999,
              baseX: player.x - 15,
              vx: 0,
            });
            return true;
          },
          /* ---------- 0.9 挑战模式钩子（契约 INTEGRATION-CONTRACT §5） ---------- */
          challengeStages() {
            return challengeStagesInfo();
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return challengeInfo();
          },
          stageObservable() {
            return stageObservable();
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing') return false;
            if (assisted) chAssisted = true;
            return challengeClear();
          },
          forceStageFail(reason) {
            return challengeFail(String(reason || 'force'));
          },
          exitChallenge() {
            if (mode !== 'challenge' && mode !== 'failed' && mode !== 'cleared') return false;
            return showChallengePanel();
          },
          openChallengePanel() {
            return showChallengePanel();
          },
          /* #test 专用：同步推进挑战时间轴（固定 1/60 步长，确定性驱动/回放用）。 */
          advanceChallenge(seconds) {
            const total = Math.max(0, Number(seconds) || 0);
            const step = 1 / 60;
            let guard = Math.ceil(total / step) + 2;
            while (guard-- > 0 && state === 'playing') update(step);
            return { state, info: challengeInfo() };
          },
          setPlayerPos(x, y) {
            player.x = clamp(Number(x) || player.x, 20, W - 20);
            player.y = clamp(Number(y) || player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
            return { x: player.x, y: player.y };
          },
          challengePanelVisible() {
            return !!(dom.chPanel && !dom.chPanel.hidden);
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '星海突击',
          onResume: () => {
            if (restore(saved.data)) {
              if (pendingClearStage > 0) {
                /* 刷新前正停在 CLEAR 弹层：恢复后继续让玩家选择下一关或收局。 */
                state = 'clear';
                loop.pause();
                syncJoyTools();
                ui.hide();
                showClearPanel(pendingClearStage);
                pauseUi.sync();
                autosave.saveNow();
                return;
              }
              state = 'playing';
              syncJoyTools();
              ui.hide();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
