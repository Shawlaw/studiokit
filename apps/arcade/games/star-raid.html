<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="星海突击：雷电式纵版弹幕射击，可吃散射 / 激光 / 追踪 / 速射四种弹种 Buff，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <title>星海突击 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#4f7cff; --card-accent:#4f7cff">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🚀 星海突击</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>关卡 <strong data-hud-stage>1</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
        <span data-hud-buff hidden>弹种 <strong data-hud-weapon>普通</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="星海突击游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>星海突击</h2>
            <p data-ov-text>纵版弹幕射击</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
      </div>
    </div>
    <p class="game-hint">拖动或 ←→↑↓ / WASD 全屏移动 · 自动开火 · Buff 可叠加 · 30 秒后 Boss 战 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, rand, randInt, pick, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudStage: document.querySelector('[data-hud-stage]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        hudBuff: document.querySelector('[data-hud-buff]'),
        hudWeapon: document.querySelector('[data-hud-weapon]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);

      const stars = A.createStarfield(W, H);
      const particles = A.createParticles();

      const PLAYER_MIN_Y = 46;
      const PLAYER_MAX_Y = H - 26;
      const STAGE_WAVE_SECONDS = 30;
      const BOSS_NAMES = ['赤焰旗舰', '雷霆母舰', '虚空堡垒'];
      const BOSS_BASE_HP = 700;
      const BOSS_HP_STEP = 300;
      const player = { x: W / 2, y: H - 90, w: 34, h: 30, cool: 0, invul: 0 };
      let bullets = [];
      let enemies = [];
      let shots = [];
      let pickups = [];
      let floaters = [];
      let score = 0;
      let lives = 3;
      let spawnTimer = 0;
      let shake = 0;
      let state = 'ready';
      let recordSaved = false;
      let dragOffset = null;
      let nextUid = 1;
      let pickupPity = 0;
      const BUFF_TYPES = ['spread', 'laser', 'homing', 'rapid'];
      const buffs = { spread: 0, laser: 0, homing: 0, rapid: 0 };
      let lastBuff = 'normal';
      let level = 1;
      let stageTime = 0;
      let boss = null;
      let stageBanner = 0;
      let stageBannerText = '';
      let elapsed = 0;
      let high = A.Progress.get('star-raid').high;
      dom.hudHigh.textContent = String(high);

      /* ---------- 弹种 Buff ---------- */
      const WEAPONS = {
        normal: { name: '普通', short: '普', color: '#e8f4ff', duration: 0, interval: 0.13 },
        spread: { name: '散射', short: '散', color: '#7cf5b2', duration: 12, interval: 0.16 },
        laser: { name: '激光', short: '激', color: '#ff86c8', duration: 10, interval: 0.24 },
        homing: { name: '追踪', short: '追', color: '#ffd23f', duration: 11, interval: 0.2 },
        rapid: { name: '速射', short: '速', color: '#63d68c', duration: 9, interval: 0.065 },
      };
      const PICKUP_TYPES = ['spread', 'laser', 'homing', 'rapid'];

      function activeBuffs() {
        return BUFF_TYPES.filter((type) => buffs[type] > 0);
      }
      function buffColor() {
        if (lastBuff !== 'normal' && buffs[lastBuff] > 0) return WEAPONS[lastBuff].color;
        const active = activeBuffs();
        return active.length ? WEAPONS[active[active.length - 1]].color : WEAPONS.normal.color;
      }
      function buffHudText() {
        return activeBuffs()
          .map((type) => WEAPONS[type].short + Math.ceil(buffs[type]) + 's')
          .join(' ');
      }

      /* ---------- 敌机类型 ---------- */
      const KINDS = {
        drone: { w: 30, h: 24, hp: 1, score: 10, color: '#c06bff', speed: [95, 150] },
        sine: { w: 32, h: 26, hp: 2, score: 25, color: '#35e0d0', speed: [65, 85] },
        diver: { w: 28, h: 30, hp: 2, score: 20, color: '#ffa53d', speed: [130, 170] },
        tank: { w: 54, h: 44, hp: 6, score: 80, color: '#ff5d7a', speed: [38, 50] },
      };

      function bossSpec(lv) {
        const cycle = Math.max(0, lv - 1);
        return {
          name: BOSS_NAMES[cycle % BOSS_NAMES.length] + ' MK.' + lv,
          w: 118,
          h: 86,
          hp: BOSS_BASE_HP + cycle * BOSS_HP_STEP,
          score: 500 * lv,
        };
      }

      /* ---------- 波次：让难度以可读的阶段递进，而不是只看分数 ---------- */
      const WAVES = [
        { name: '巡逻', at: 0, spawn: 1.2, speed: 1.0, kinds: ['drone'], fire: false, maxEnemies: 7, maxShots: 0 },
        { name: '俯冲', at: 20, spawn: 1.05, speed: 1.08, kinds: ['drone', 'diver'], fire: false, maxEnemies: 8, maxShots: 0 },
        { name: '弹幕', at: 45, spawn: 0.94, speed: 1.15, kinds: ['drone', 'diver', 'sine'], fire: true, maxEnemies: 9, maxShots: 12 },
        { name: '精英', at: 75, spawn: 0.84, speed: 1.22, kinds: ['drone', 'diver', 'sine', 'tank'], fire: true, maxEnemies: 10, maxShots: 18 },
        { name: '休整', at: 95, spawn: 1.7, speed: 0.92, kinds: ['drone'], fire: false, maxEnemies: 5, maxShots: 0, rest: true },
      ];
      const WAVE_CYCLE = 103;

      function waveInfo() {
        const cycle = Math.floor(elapsed / WAVE_CYCLE);
        const t = elapsed % WAVE_CYCLE;
        let phase = WAVES[0];
        for (let i = 0; i < WAVES.length; i++) {
          if (t >= WAVES[i].at) phase = WAVES[i];
        }
        return {
          cycle,
          phase,
          label: 'W' + (cycle + 1) + ' ' + phase.name,
          scale: 1 + cycle * 0.12,
          maxEnemies: Math.min(14, phase.maxEnemies + cycle * 2),
          maxShots: Math.min(26, phase.maxShots + cycle * 2),
        };
      }

      function spawnEnemy() {
        const wave = waveInfo();
        const defs = wave.phase.kinds.map((k) => KINDS[k]);
        const def = pick(defs);
        const kind = Object.keys(KINDS).find((k) => KINDS[k] === def) || 'drone';
        const e = {
          uid: nextUid++,
          kind,
          x: rand(30, W - 30 - def.w),
          y: -def.h - 6,
          w: def.w,
          h: def.h,
          hp: def.hp + (kind === 'tank' ? Math.min(4, wave.cycle * 2) : 0) + (level - 1),
          score: def.score,
          color: def.color,
          vy: rand(def.speed[0], def.speed[1]) * wave.phase.speed * (1 + wave.cycle * 0.06 + (level - 1) * 0.06),
          t: rand(0, 10),
          fireTimer: wave.phase.fire ? rand(0.8, 2.2) : 999,
          baseX: 0,
          vx: 0,
        };
        e.baseX = e.x;
        if (kind === 'diver') {
          const dx = player.x - (e.x + e.w / 2);
          e.vx = clamp(dx / 1.6, -110, 110);
        }
        enemies.push(e);
      }

      function enemyShot(e, speed) {
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h;
        const dx = player.x - cx;
        const dy = player.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        shots.push({ x: cx, y: cy, vx: (dx / len) * speed, vy: (dy / len) * speed, r: 4 });
      }

      /* ---------- 关卡 Boss ---------- */
      function spawnBoss() {
        if (boss) return;
        const spec = bossSpec(level);
        enemies = [];
        boss = {
          uid: nextUid++,
          kind: 'boss',
          name: spec.name,
          x: (W - spec.w) / 2,
          y: -spec.h,
          w: spec.w,
          h: spec.h,
          hp: spec.hp,
          maxHp: spec.hp,
          score: spec.score,
          color: '#ff5d7a',
          vy: 55,
          t: 0,
          fireTimer: 1.4,
          baseX: (W - spec.w) / 2,
          vx: 0,
          phase: 1,
        };
        enemies.push(boss);
        shots = [];
        spawnTimer = 999;
        stageTime = STAGE_WAVE_SECONDS;
        stageBannerText = 'WARNING · ' + spec.name;
        stageBanner = 2.0;
        shake = A.reducedMotion ? 0 : 5;
        A.Sfx.play('explode');
        syncHud();
      }

      function updateBoss(b, dt) {
        b.t += dt;
        if (b.y < 112) b.y += b.vy * dt;
        else b.y = 112 + Math.sin(b.t * 1.4) * 9;
        b.x = clamp(b.baseX + (b.t < 1.4 ? 0 : Math.sin(b.t * 0.75) * 90), 22, W - b.w - 22);

        const ratio = b.hp / b.maxHp;
        if (ratio <= 0.6 && b.phase < 2) {
          b.phase = 2;
          stageBannerText = 'BOSS 狂暴';
          stageBanner = 1.2;
          shake = A.reducedMotion ? 0 : 6;
          A.Sfx.play('explode');
        }
        if (ratio <= 0.3 && b.phase < 3) {
          b.phase = 3;
          stageBannerText = 'BOSS 濒危 · 火力全开';
          stageBanner = 1.2;
          shake = A.reducedMotion ? 0 : 8;
          A.Sfx.play('explode');
        }

        b.fireTimer -= dt;
        if (b.fireTimer <= 0 && b.y > 30) {
          bossFire(b);
          b.fireTimer = ratio < 0.3 ? 0.72 : ratio < 0.6 ? 0.95 : 1.25;
        }
      }

      function bossFire(b) {
        const ratio = b.hp / b.maxHp;
        const spd = 160 + level * 12;
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h * 0.72;
        const base = Math.atan2(player.y - cy, player.x - cx);
        const fan = ratio < 0.3 ? 7 : 5;
        for (let i = -(fan - 1) / 2; i <= (fan - 1) / 2; i++) {
          if (shots.length >= 60) break;
          const angle = base + i * 0.17;
          shots.push({ x: cx, y: cy, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, r: 4 });
        }
        if (ratio < 0.6) {
          const count = ratio < 0.3 ? 14 : 10;
          for (let i = 0; i < count; i++) {
            if (shots.length >= 60) break;
            const angle = (i / count) * TAU + b.t * 0.6;
            shots.push({ x: cx, y: cy, vx: Math.cos(angle) * spd * 0.8, vy: Math.sin(angle) * spd * 0.8, r: 4 });
          }
        }
        A.Sfx.play('shoot');
      }

      function stageClear(cleared) {
        boss = null;
        level += 1;
        stageTime = 0;
        shots = [];
        spawnTimer = 1.3;
        lives = Math.min(5, lives + 1);
        stageBannerText = 'STAGE ' + cleared + ' CLEAR';
        stageBanner = 2.4;
        A.Sfx.play('perfect');
        syncHud();
      }

      /* ---------- 游戏流程 ---------- */
      function reset() {
        bullets = [];
        enemies = [];
        shots = [];
        pickups = [];
        floaters = [];
        score = 0;
        lives = 3;
        spawnTimer = 0.4;
        shake = 0;
        recordSaved = false;
        dragOffset = null;
        nextUid = 1;
        pickupPity = 0;
        BUFF_TYPES.forEach((type) => {
          buffs[type] = 0;
        });
        lastBuff = 'normal';
        level = 1;
        stageTime = 0;
        boss = null;
        stageBanner = 0;
        stageBannerText = '';
        elapsed = 0;
        player.x = W / 2;
        player.y = H - 90;
        player.cool = 0;
        player.invul = 0;
        particles.clear();
        syncHud();
      }

      function syncHud() {
        dom.hudScore.textContent = String(score);
        if (dom.hudStage) dom.hudStage.textContent = String(level);
        const text = buffHudText();
        if (text) {
          dom.hudBuff.hidden = false;
          if (dom.hudWeapon.textContent !== text) dom.hudWeapon.textContent = text;
        } else {
          dom.hudBuff.hidden = true;
        }
      }

      function startGame() {
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
      }

      function gameOver() {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        const rec = recordSaved ? null : A.Progress.recordPlay('star-raid', score); if (rec) high = rec.high;
        recordSaved = true;
        dom.hudHigh.textContent = String(Math.max(high, score));
        loop.pause();
        ui.show({
          title: '机体损毁',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `击坠得分 · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        ui.show({
          title: '已暂停',
          text: '休息一下，敌人不会等太久。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        });
        pauseUi.sync();
      }

      function showStart() {
        ui.show({
          title: '星海突击',
          text: '纵版弹幕射击：击落敌机，躲开弹幕。<br/>吃下 <b>散射 / 激光 / 追踪 / 速射</b>，弹种可叠加<br/>每关 30 秒后 Boss 战 · 整屏移动 · 生命 ×3',
          btn: '开始游戏',
          onBtn: startGame,
        });
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          player: { x: player.x, y: player.y, invul: player.invul },
          bullets: bullets.map((b) => ({
            x: b.x,
            y: b.y,
            vx: b.vx,
            vy: b.vy,
            r: b.r,
            dmg: b.dmg,
            pierce: !!b.pierce,
            laser: !!b.laser,
            homing: !!b.homing,
            hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
          })),
          enemies: enemies.map((e) => ({
            uid: e.uid,
            kind: e.kind,
            x: e.x,
            y: e.y,
            w: e.w,
            h: e.h,
            hp: e.hp,
            maxHp: e.maxHp || e.hp,
            score: e.score,
            name: e.name || '',
            phase: e.phase || 1,
            vy: e.vy,
            t: e.t,
            fireTimer: e.fireTimer,
            baseX: e.baseX,
            vx: e.vx,
          })),
          shots,
          pickups,
          score,
          lives,
          spawnTimer,
          nextUid,
          pickupPity,
          buffs: { ...buffs },
          lastBuff,
          stage: level,
          stageTime,
          elapsed,
        };
      }

      function restore(data) {
        if (!data || !data.player || !Array.isArray(data.enemies)) return false;
        try {
          reset();
          player.x = clamp(Number(data.player.x) || W / 2, 20, W - 20);
          player.y = clamp(Number(data.player.y) || H - 90, PLAYER_MIN_Y, PLAYER_MAX_Y);
          player.invul = Number(data.player.invul) || 0;
          bullets = (data.bullets || []).filter((b) => b && isFinite(b.x) && isFinite(b.y)).map((b) => ({
            x: Number(b.x) || 0,
            y: Number(b.y) || 0,
            vx: Number(b.vx) || 0,
            vy: Number(b.vy) || -640,
            r: Number(b.r) || 3,
            dmg: Number(b.dmg) || 1,
            pierce: !!b.pierce,
            laser: !!b.laser,
            homing: !!b.homing,
            hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
          }));
          level = clamp(Math.floor(Number(data.stage) || 1), 1, 999);
          stageTime = Math.max(0, Number(data.stageTime) || 0);
          const bossDef = bossSpec(level);
          enemies = data.enemies
            .filter((e) => e && (e.kind === 'boss' || KINDS[e.kind]) && isFinite(e.x) && isFinite(e.y))
            .map((e) => {
              const isBoss = e.kind === 'boss';
              const hp = Math.max(1, Number(e.hp) || (isBoss ? bossDef.hp : 1));
              return {
                uid: Number(e.uid) || nextUid++,
                kind: e.kind,
                x: Number(e.x) || 0,
                y: Number(e.y) || 0,
                w: Number(e.w) || (isBoss ? bossDef.w : KINDS[e.kind].w),
                h: Number(e.h) || (isBoss ? bossDef.h : KINDS[e.kind].h),
                hp,
                maxHp: Math.max(hp, Number(e.maxHp) || (isBoss ? bossDef.hp : hp)),
                score: Number(e.score) || (isBoss ? bossDef.score : KINDS[e.kind].score),
                color: isBoss ? '#ff5d7a' : KINDS[e.kind].color,
                vy: Number(e.vy) || 100,
                t: Number(e.t) || 0,
                fireTimer: Number(e.fireTimer) || 1,
                baseX: Number(e.baseX) || 0,
                vx: Number(e.vx) || 0,
                name: isBoss ? String(e.name || bossDef.name) : '',
                phase: Number(e.phase) || 1,
              };
            });
          boss = enemies.find((e) => e.kind === 'boss') || null;
          shots = (data.shots || []).filter((s) => s && isFinite(s.x) && isFinite(s.y)).map((s) => ({
            x: Number(s.x) || 0,
            y: Number(s.y) || 0,
            vx: Number(s.vx) || 0,
            vy: Number(s.vy) || 0,
            r: Number(s.r) || 4,
          }));
          pickups = (data.pickups || []).filter((p) => p && WEAPONS[p.type]).map((p) => ({
            x: Number(p.x) || W / 2,
            y: Number(p.y) || 0,
            vy: Number(p.vy) || 70,
            r: 15,
            type: p.type,
            spin: Number(p.spin) || 0,
          }));
          score = Math.max(0, Number(data.score) || 0);
          lives = clamp(Number(data.lives) || 3, 1, 5);
          spawnTimer = Number(data.spawnTimer) || 0.4;
          nextUid = Math.max(nextUid, Number(data.nextUid) || 1);
          pickupPity = Number(data.pickupPity) || 0;
          BUFF_TYPES.forEach((type) => {
            buffs[type] = 0;
          });
          if (data.buffs && typeof data.buffs === 'object') {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = Math.max(0, Number(data.buffs[type]) || 0);
            });
          } else if (WEAPONS[data.weapon] && data.weapon !== 'normal') {
            /* 旧版单弹种存档迁移为对应 Buff。 */
            buffs[data.weapon] = Math.max(0, Number(data.weaponTimer) || 0);
          }
          lastBuff = activeBuffs().slice(-1)[0] || 'normal';
          if (data.lastBuff && buffs[data.lastBuff] > 0) lastBuff = data.lastBuff;
          elapsed = Math.max(0, Number(data.elapsed) || 0);
          recordSaved = false;
          syncHud();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('star-raid', serialize, {
        every: 4,
        meta: () => ({
          score,
          summary: `得分 ${score} · 第 ${level} 关${boss ? ' · BOSS' : ' · ' + waveInfo().label} · 生命 ${lives}`,
        }),
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        stars.update(dt, state === 'playing' ? 2.2 : 0.6);
        particles.update(dt);
        shake = Math.max(0, shake - dt * 26);
        updateFloaters(dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        elapsed += dt;
        stageBanner = Math.max(0, stageBanner - dt);
        if (!boss) {
          stageTime += dt;
          if (stageTime >= STAGE_WAVE_SECONDS) spawnBoss();
        }
        updatePlayer(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updatePickups(dt);
        collide();
        input.endFrame();
      }

      function fire() {
        player.cool = buffs.rapid > 0 ? 0.075 : 0.13;
        /* 普通弹始终存在；每种已激活 Buff 在每一轮里追加自己的弹型，形成叠加。 */
        bullets.push({ x: player.x - 10, y: player.y - 14, vx: 0, vy: -640, r: 3, dmg: 1 });
        bullets.push({ x: player.x + 10, y: player.y - 14, vx: 0, vy: -640, r: 3, dmg: 1 });
        if (buffs.spread > 0) {
          [-0.24, 0, 0.24].forEach((ang) => {
            bullets.push({
              x: player.x,
              y: player.y - 14,
              vx: Math.sin(ang) * 560,
              vy: -Math.cos(ang) * 560,
              r: 3.2,
              dmg: 1,
            });
          });
        }
        if (buffs.laser > 0) {
          bullets.push({
            x: player.x,
            y: player.y - 22,
            vx: 0,
            vy: -980,
            r: 5,
            dmg: 2,
            pierce: true,
            laser: true,
            hitIds: [],
          });
        }
        if (buffs.homing > 0) {
          [-9, 9].forEach((dx) => {
            bullets.push({
              x: player.x + dx,
              y: player.y - 12,
              vx: rand(-60, 60),
              vy: -480,
              r: 4,
              dmg: 1.4,
              homing: true,
            });
          });
        }
        if (buffs.rapid > 0) {
          bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -780, r: 2.5, dmg: 1 });
        }
        A.Sfx.play('shoot');
      }

      function updatePlayer(dt) {
        const speed = 320;
        if (input.isDown('ArrowLeft', 'a')) player.x -= speed * dt;
        if (input.isDown('ArrowRight', 'd')) player.x += speed * dt;
        if (input.isDown('ArrowUp', 'w')) player.y -= speed * dt;
        if (input.isDown('ArrowDown', 's')) player.y += speed * dt;

        if (input.pointer.down) {
          if (dragOffset === null) {
            dragOffset = { x: input.pointer.x - player.x, y: input.pointer.y - player.y };
          }
          player.x = input.pointer.x - dragOffset.x;
          player.y = input.pointer.y - dragOffset.y;
        } else {
          dragOffset = null;
        }

        player.x = clamp(player.x, 20, W - 20);
        player.y = clamp(player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
        player.invul = Math.max(0, player.invul - dt);

        let buffChanged = false;
        BUFF_TYPES.forEach((type) => {
          if (buffs[type] <= 0) return;
          buffs[type] = Math.max(0, buffs[type] - dt);
          if (buffs[type] <= 0) {
            buffChanged = true;
            if (lastBuff === type) lastBuff = activeBuffs().slice(-1)[0] || 'normal';
            addFloater(player.x, player.y - 30, WEAPONS[type].name + '结束', '#93a0c8');
          }
        });
        if (buffChanged || activeBuffs().length) syncHud();

        player.cool -= dt;
        if (player.cool <= 0) fire();
      }

      function updateEnemies(dt) {
        const wave = waveInfo();
        if (!boss) {
          if (shots.length > wave.maxShots) shots.length = wave.maxShots;
          spawnTimer -= dt;
          if (!wave.phase.rest && enemies.length < wave.maxEnemies) {
            if (spawnTimer <= 0) {
              spawnTimer = wave.phase.spawn / wave.scale;
              spawnEnemy();
            }
          } else if (spawnTimer < 0.2) {
            spawnTimer = 0.2;
          }
        } else if (shots.length > 60) {
          shots.length = 60;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.kind === 'boss') {
            updateBoss(e, dt);
            continue;
          }
          e.t += dt;
          e.y += e.vy * dt;
          if (e.kind === 'sine') {
            e.x = e.baseX + Math.sin(e.t * 2.4) * 70;
            e.x = clamp(e.x, 4, W - e.w - 4);
          } else if (e.kind === 'diver') {
            e.x += e.vx * dt;
          }
          if (wave.phase.fire && (e.kind === 'sine' || e.kind === 'tank')) {
            e.fireTimer -= dt;
            if (e.fireTimer <= 0 && e.y > 0 && e.y < H - 260) {
              e.fireTimer = e.kind === 'tank' ? rand(1.6, 2.4) : rand(2.0, 3.2);
              const spd = 165 + wave.cycle * 14;
              if (e.kind === 'tank') {
                for (let k = -1; k <= 1; k++) {
                  if (shots.length >= wave.maxShots) break;
                  const ang = Math.atan2(player.y - e.y, player.x - e.x) + k * 0.38;
                  shots.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 4 });
                }
              } else if (shots.length < wave.maxShots) {
                enemyShot(e, spd);
              }
            }
          }
          if (e.y > H + 40) enemies.splice(i, 1);
        }
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (b.homing) {
            let best = null;
            let bestD = Infinity;
            for (const e of enemies) {
              const d = (e.x + e.w / 2 - b.x) ** 2 + (e.y + e.h / 2 - b.y) ** 2;
              if (d < bestD) {
                bestD = d;
                best = e;
              }
            }
            if (best) {
              const tx = best.x + best.w / 2 - b.x;
              const ty = best.y + best.h / 2 - b.y;
              const len = Math.hypot(tx, ty) || 1;
              b.vx += (tx / len) * 1500 * dt;
              b.vy += (ty / len) * 1500 * dt;
              const sp = Math.hypot(b.vx, b.vy) || 1;
              const targetSpeed = 560;
              b.vx = (b.vx / sp) * targetSpeed;
              b.vy = (b.vy / sp) * targetSpeed;
            }
          }
          b.x += (b.vx || 0) * dt;
          b.y += (b.vy || 0) * dt;
          if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) bullets.splice(i, 1);
        }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          if (s.y > H + 20 || s.y < -20 || s.x < -20 || s.x > W + 20) shots.splice(i, 1);
        }
      }

      function updatePickups(dt) {
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.y += p.vy * dt;
          p.spin += dt * 3;
          /* 靠近玩家时轻微吸附，避免辛苦打出的 Buff 从旁边滑走。 */
          if (p.y > H * 0.55) p.x += clamp(player.x - p.x, -80 * dt, 80 * dt);
          const box = { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
          const hb = { x: player.x - 20, y: player.y - 20, w: 40, h: 40 };
          if (A.Physics.aabbOverlap(hb, box)) {
            buffs[p.type] = Math.max(buffs[p.type], WEAPONS[p.type].duration);
            lastBuff = p.type;
            syncHud();
            A.Sfx.play('perfect');
            addFloater(player.x, player.y - 34, (activeBuffs().length > 1 ? '叠加 ' : '') + WEAPONS[p.type].name + '弹！', WEAPONS[p.type].color);
            particles.emit(p.x, p.y, {
              count: A.reducedMotion ? 6 : 18,
              speed: [40, 180],
              life: [0.25, 0.6],
              size: [2, 4],
              colors: [WEAPONS[p.type].color, '#ffffff'],
              gravity: 80,
            });
            pickups.splice(i, 1);
            continue;
          }
          if (p.y > H + 30) pickups.splice(i, 1);
        }
      }

      function addFloater(x, y, text, color) {
        floaters.push({ x, y, text, color, life: 0.8, maxLife: 0.8 });
      }
      function updateFloaters(dt) {
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.life -= dt;
          f.y -= 34 * dt;
          if (f.life <= 0) floaters.splice(i, 1);
        }
      }

      function dropPickup(e) {
        const missing = PICKUP_TYPES.filter((type) => buffs[type] <= 0);
        let type;
        if (missing.length && Math.random() < 0.75) type = pick(missing);
        else type = PICKUP_TYPES[randInt(0, PICKUP_TYPES.length - 1)];
        pickups.push({
          x: clamp(e.x + e.w / 2, 24, W - 24),
          y: e.y + e.h / 2,
          vy: 72,
          r: 15,
          type,
          spin: 0,
        });
        pickupPity = 0;
        A.Sfx.play('bell', 8);
      }

      function killEnemy(e, idx, award) {
        enemies.splice(idx, 1);
        if (e.kind === 'boss') {
          score += e.score;
          addFloater(e.x + e.w / 2, e.y + e.h / 2, '+' + e.score, '#ffd23f');
          particles.emit(e.x + e.w / 2, e.y + e.h / 2, {
            count: A.reducedMotion ? 14 : 46,
            speed: [80, 360],
            life: [0.4, 1.1],
            size: [2, 7],
            colors: ['#ff5d7a', '#ffd23f', '#ffffff', '#4f7cff'],
            gravity: 90,
          });
          A.Sfx.play('explode');
          shake = A.reducedMotion ? 0 : 10;
          for (let i = 0; i < 3; i++) {
            dropPickup({
              x: e.x + rand(-40, 40),
              y: e.y + rand(-24, 24),
              w: 0,
              h: 0,
            });
          }
          stageClear(level);
          syncHud();
          return;
        }
        if (award !== false) {
          score += e.score;
          syncHud();
          addFloater(e.x + e.w / 2, e.y, '+' + e.score, '#ffd23f');
          pickupPity += 1;
          if (Math.random() < (e.kind === 'tank' ? 0.8 : 0.1) || pickupPity >= 12) dropPickup(e);
        } else {
          addFloater(e.x + e.w / 2, e.y, '撞毁', '#ff9a9a');
        }
        particles.emit(e.x + e.w / 2, e.y + e.h / 2, {
          count: A.reducedMotion ? 6 : 16,
          speed: [40, 220],
          life: [0.25, 0.7],
          size: [2, 5],
          colors: [e.color, '#ffd23f', '#ffffff'],
          gravity: 120,
        });
        A.Sfx.play(e.kind === 'tank' ? 'explode' : 'hit');
        if (e.kind === 'tank') shake = A.reducedMotion ? 0 : 5;
      }

      function hitPlayer() {
        if (player.invul > 0) return;
        lives -= 1;
        player.invul = 1.8;
        shake = A.reducedMotion ? 0 : 8;
        A.Sfx.play('explode');
        particles.emit(player.x, player.y, {
          count: 24,
          speed: [60, 260],
          life: [0.3, 0.8],
          size: [2, 5],
          colors: ['#4f7cff', '#ffffff', '#ffd23f'],
          gravity: 100,
        });
        if (lives <= 0) gameOver();
      }

      function collide() {
        /* 子弹 × 敌机 */
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (b.hitIds && b.hitIds.indexOf(e.uid) !== -1) continue;
            if (A.Physics.circleBox(b.x, b.y, (b.r || 3) + 2, e)) {
              e.hp -= b.dmg || 1;
              particles.emit(b.x, b.y, { count: 3, speed: [20, 90], life: [0.1, 0.3], size: [1.5, 3], colors: [buffColor()] });
              if (b.pierce) {
                b.hitIds.push(e.uid);
              } else {
                bullets.splice(j, 1);
              }
              if (e.hp <= 0) {
                killEnemy(e, i);
                break;
              }
            }
          }
        }
        /* 玩家判定盒缩小（弹幕游戏惯例） */
        const hb = { x: player.x - 9, y: player.y - 8, w: 18, h: 16 };
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (!A.Physics.aabbOverlap(hb, e)) continue;
          if (e.kind === 'boss') {
            if (player.invul <= 0) hitPlayer();
            continue;
          }
          if (player.invul <= 0) {
            killEnemy(e, i, false);
            hitPlayer();
          }
        }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          if (A.Physics.circleBox(s.x, s.y, s.r, hb)) {
            shots.splice(i, 1);
            hitPlayer();
          }
        }
      }

      /* ---------- 渲染 ---------- */
      function drawPlayer() {
        if (player.invul > 0 && Math.floor(player.invul * 12) % 2 === 0) return;
        ctx.save();
        ctx.translate(player.x, player.y);
        const active = activeBuffs();
        const spec = WEAPONS[lastBuff !== 'normal' && buffs[lastBuff] > 0 ? lastBuff : active[0] || 'normal'];
        active.forEach((type, index) => {
          ctx.strokeStyle = WEAPONS[type].color;
          ctx.globalAlpha = 0.35 + Math.sin(performance.now() / 120 + index) * 0.12;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 22 + index * 4, 0, TAU);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
        /* 喷焰 */
        const flame = 8 + Math.sin(performance.now() / 40) * 4;
        ctx.fillStyle = '#ffb43d';
        ctx.beginPath();
        ctx.moveTo(-5, 12);
        ctx.lineTo(5, 12);
        ctx.lineTo(0, 12 + flame);
        ctx.closePath();
        ctx.fill();
        /* 机体 */
        ctx.fillStyle = '#e8eeff';
        ctx.strokeStyle = spec.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(13, 10);
        ctx.lineTo(5, 6);
        ctx.lineTo(0, 12);
        ctx.lineTo(-5, 6);
        ctx.lineTo(-13, 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = spec.color;
        ctx.beginPath();
        ctx.arc(0, -2, 3.4, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawBoss(b) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
        ctx.fillStyle = '#ff5d7a';
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -b.h / 2);
        ctx.lineTo(b.w * 0.28, -b.h * 0.16);
        ctx.lineTo(b.w / 2, 0);
        ctx.lineTo(b.w * 0.34, b.h * 0.34);
        ctx.lineTo(0, b.h / 2);
        ctx.lineTo(-b.w * 0.34, b.h * 0.34);
        ctx.lineTo(-b.w / 2, 0);
        ctx.lineTo(-b.w * 0.28, -b.h * 0.16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#3b1e3f';
        ctx.beginPath();
        ctx.ellipse(0, 0, b.w * 0.2, b.h * 0.2, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = b.phase >= 3 ? '#ffb0a0' : '#ffd23f';
        ctx.globalAlpha = 0.65 + pulse * 0.35;
        ctx.beginPath();
        ctx.arc(0, 0, 9 + pulse * 3, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        for (const side of [-1, 1]) {
          ctx.fillStyle = '#4f7cff';
          ctx.fillRect(side * b.w * 0.3 - 4, -b.h * 0.08, 8, b.h * 0.32);
        }
        ctx.restore();
      }

      function drawEnemy(e) {
        if (e.kind === 'boss') {
          drawBoss(e);
          return;
        }
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = e.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (e.kind === 'drone') {
          ctx.moveTo(0, -e.h / 2);
          ctx.lineTo(e.w / 2, 0);
          ctx.lineTo(0, e.h / 2);
          ctx.lineTo(-e.w / 2, 0);
          ctx.closePath();
        } else if (e.kind === 'sine') {
          for (let k = 0; k < 6; k++) {
            const ang = (k / 6) * TAU + Math.PI / 6;
            const px = Math.cos(ang) * (e.w / 2);
            const py = Math.sin(ang) * (e.h / 2);
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (e.kind === 'diver') {
          ctx.moveTo(0, e.h / 2);
          ctx.lineTo(e.w / 2, -e.h / 2);
          ctx.lineTo(-e.w / 2, -e.h / 2);
          ctx.closePath();
        } else {
          for (let k = 0; k < 8; k++) {
            const ang = (k / 8) * TAU;
            const px = Math.cos(ang) * (e.w / 2);
            const py = Math.sin(ang) * (e.h / 2);
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();
        /* 核心 */
        ctx.fillStyle = 'rgba(10,14,30,0.85)';
        ctx.beginPath();
        ctx.arc(0, 0, Math.min(e.w, e.h) * 0.22, 0, TAU);
        ctx.fill();
        if (e.kind === 'tank' && e.hp <= 2) {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillRect(-e.w / 2 + 4, -e.h / 2 + 4, e.w - 8, 2);
        }
        ctx.restore();
      }

      function drawPickup(p) {
        const spec = WEAPONS[p.type];
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.sin(p.spin) * 0.25);
        ctx.fillStyle = 'rgba(8,12,26,0.9)';
        A.draw.roundRect(ctx, -p.r, -p.r, p.r * 2, p.r * 2, 7);
        ctx.fill();
        ctx.strokeStyle = spec.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = spec.color;
        A.draw.label(ctx, spec.name.charAt(0), 0, 1, { font: 'bold 13px system-ui', color: spec.color });
        ctx.restore();
      }

      function drawBullets() {
        bullets.forEach((b) => {
          if (b.laser) {
            ctx.fillStyle = 'rgba(255,134,200,0.3)';
            ctx.fillRect(b.x - 5, b.y - 16, 10, 32);
            ctx.fillStyle = '#ff86c8';
            ctx.fillRect(b.x - 2, b.y - 18, 4, 34);
          } else if (b.homing) {
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#fff6cf';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU);
            ctx.fill();
          } else {
            ctx.fillStyle = '#e8f4ff';
            ctx.fillRect(b.x - 1.5, b.y - 7, 3, 12);
          }
        });
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shake > 0) {
          ctx.translate(rand(-shake, shake), rand(-shake, shake));
        }
        /* 背景 */
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0a0f26');
        bg.addColorStop(1, '#141b42');
        ctx.fillStyle = bg;
        ctx.fillRect(-10, -10, W + 20, H + 20);
        stars.draw(ctx);
        particles.draw(ctx);

        enemies.forEach(drawEnemy);
        pickups.forEach(drawPickup);
        drawBullets();
        shots.forEach((s) => {
          ctx.fillStyle = '#ff86c8';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 0.45, 0, TAU);
          ctx.fill();
        });

        if (state === 'playing' || state === 'paused') drawPlayer();

        /* 浮动得分 */
        floaters.forEach((f) => {
          A.draw.label(ctx, f.text, f.x, f.y, {
            font: 'bold 13px system-ui, sans-serif',
            color: f.color,
            alpha: clamp(f.life / f.maxLife, 0, 1),
          });
        });

        /* 画布内 HUD */
        A.draw.label(ctx, 'SCORE ' + score, 12, 20, { align: 'left', font: 'bold 14px system-ui, sans-serif', color: '#ffd23f' });
        const wave = waveInfo();
        A.draw.label(ctx, boss ? 'STG ' + level + ' · BOSS' : 'STG ' + level + ' · ' + wave.label, W / 2, 20, {
          font: 'bold 12px system-ui, sans-serif',
          color: boss ? '#ff9a9d' : wave.phase.rest ? '#63d68c' : '#93a0c8',
        });
        for (let i = 0; i < lives; i++) {
          ctx.save();
          ctx.translate(W - 20 - i * 18, 20);
          ctx.fillStyle = '#4f7cff';
          ctx.beginPath();
          ctx.moveTo(0, -7);
          ctx.lineTo(6, 6);
          ctx.lineTo(-6, 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        const active = activeBuffs();
        if (active.length) {
          const text = active.map((type) => WEAPONS[type].short + Math.ceil(buffs[type])).join(' ');
          A.draw.label(ctx, text, W / 2, 42, {
            font: 'bold 13px system-ui, sans-serif',
            color: buffColor(),
          });
        }
        if (boss) {
          const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
          A.draw.label(ctx, boss.name, W / 2, 57, {
            font: 'bold 11px system-ui, sans-serif',
            color: '#ff9a9d',
          });
          ctx.fillStyle = 'rgba(7,11,24,0.72)';
          ctx.fillRect(60, 65, 300, 7);
          ctx.fillStyle = boss.phase >= 3 ? '#ff5d7a' : boss.phase >= 2 ? '#ff9a3d' : '#ffd23f';
          ctx.fillRect(60, 65, 300 * ratio, 7);
        }
        if (stageBanner > 0) {
          A.draw.label(ctx, stageBannerText, W / 2, H * 0.34, {
            font: 'bold 22px system-ui, sans-serif',
            color: boss ? '#ff9a9d' : '#ffd23f',
            alpha: clamp(stageBanner / 0.5, 0, 1),
          });
        }
        ctx.restore();
      }

      /* ---------- 输入与循环 ---------- */
      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      if (location.hash === '#test') {
        window.__arcadeTest = {
          giveBuff(type) {
            if (!WEAPONS[type] || type === 'normal') return false;
            buffs[type] = Math.max(buffs[type], WEAPONS[type].duration);
            lastBuff = type;
            syncHud();
            return true;
          },
          spawnPickup(type) {
            if (!WEAPONS[type] || type === 'normal') return false;
            pickups.push({ x: player.x, y: player.y - 44, vy: 120, r: 15, type, spin: 0 });
            return true;
          },
          clearBuffs() {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = 0;
            });
            lastBuff = 'normal';
            syncHud();
            return true;
          },
          info() {
            const wave = waveInfo();
            const active = activeBuffs();
            return {
              weapon: active.join('+') || 'normal',
              buffs: { ...buffs },
              pickups: pickups.length,
              score,
              lives,
              stage: level,
              stageTime,
              bossActive: !!boss,
              bossHp: boss ? boss.hp : 0,
              bossMaxHp: boss ? boss.maxHp : 0,
              bossName: boss ? boss.name : '',
              player: { x: player.x, y: player.y },
              bulletCount: bullets.length,
              elapsed,
              wave: wave.label,
              maxEnemies: wave.maxEnemies,
              maxShots: wave.maxShots,
              shots: shots.length,
              enemies: enemies.length,
            };
          },
          fireNow() {
            const before = bullets.length;
            player.cool = 999;
            fire();
            const fresh = bullets.slice(before);
            return {
              added: fresh.length,
              laser: fresh.some((b) => b.laser),
              homing: fresh.filter((b) => b.homing).length,
              spread: fresh.filter((b) => b.r === 3.2).length,
            };
          },
          spawnBossNow() {
            stageTime = STAGE_WAVE_SECONDS;
            spawnBoss();
            return this.info();
          },
          damageBoss(amount) {
            if (!boss) return this.info();
            boss.hp -= Math.max(1, Number(amount) || 1);
            if (boss.hp <= 0) {
              const index = enemies.indexOf(boss);
              if (index >= 0) killEnemy(boss, index);
            }
            return this.info();
          },
          setPlayer(x, y) {
            player.x = clamp(Number(x) || player.x, 20, W - 20);
            player.y = clamp(Number(y) || player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
            return { x: player.x, y: player.y };
          },
          setElapsed(seconds) {
            elapsed = Math.max(0, Number(seconds) || 0);
            return waveInfo().label;
          },
          forceBodyCollision() {
            bullets = [];
            player.cool = 999;
            enemies.push({
              uid: nextUid++,
              kind: 'drone',
              x: player.x - 15,
              y: player.y - 12,
              w: 30,
              h: 24,
              hp: 1,
              score: 10,
              color: '#c06bff',
              vy: 0,
              t: 0,
              fireTimer: 999,
              baseX: player.x - 15,
              vx: 0,
            });
            return true;
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '星海突击',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
