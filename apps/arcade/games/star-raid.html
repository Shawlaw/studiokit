        player.cool -= dt;
        if (player.cool <= 0) fire();
      }

      function updateEnemies(dt) {
        const wave = waveInfo();
        const theme = run.theme || themeForLevel(level);
        const freezeScale = run.freezeTimer > 0 ? 0.3 : 1;
        if (!boss) {
          if (shots.length > wave.maxShots) shots.length = wave.maxShots;
          spawnTimer -= dt;
          const enemyCap = isMow()
            ? Math.min(MOW.enemyCap, wave.maxEnemies)
            : Math.min(16, wave.maxEnemies + (theme.tankBias > 0 ? 2 : 0));
          if (!wave.phase.rest && enemies.length < enemyCap) {
            if (spawnTimer <= 0) {
              spawnTimer = wave.phase.spawn / wave.scale / (theme.spawnRate || 1);
              spawnEnemy();
              /* 割草：一次刷怪帧有概率再来一架，形成密集星潮。 */
              if (isMow() && Math.random() < MOW.spawnDoubleChance && enemies.length < enemyCap) spawnEnemy();
            }
          } else if (spawnTimer < 0.2) {
            spawnTimer = 0.2;
          }
        } else if (isMow()) {
          /* Boss 战不停潮：低频补充杂兵，与 Boss 招式叠加成割草战场。 */
          if (shots.length > MOW.bossShotCap) shots.length = MOW.bossShotCap;
          spawnTimer -= dt;
          if (spawnTimer <= 0 && enemies.length < MOW.bossEscortCap) {
            spawnTimer = 0.62;
            spawnEnemy();
            if (Math.random() < 0.45 && enemies.length < MOW.bossEscortCap) spawnEnemy();
          }
        } else if (shots.length > 60) {
          shots.length = 60;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.kind === 'boss') {
            updateBoss(e, dt * (run.freezeTimer > 0 ? 0.55 : 1));
            continue;
          }
          e.t += dt * (e.kind === 'rock' ? 1 : freezeScale);
          if (e.kind === 'rock') {
            e.y += e.vy * dt * freezeScale;
            e.x = clamp(e.x + e.vx * dt * freezeScale, 4, W - e.w - 4);
            e.rot += e.rotSpeed * dt * freezeScale;
            e.flash = Math.max(0, e.flash - dt);
            if (e.y > H + 40) enemies.splice(i, 1);
            continue;
          }
          e.y += e.vy * dt * freezeScale;
          if (e.kind === 'sine') {
            e.x = e.baseX + Math.sin(e.t * 2.4) * 70;
            e.x = clamp(e.x, 4, W - e.w - 4);
          } else if (e.kind === 'diver') {
            e.x += e.vx * dt * freezeScale;
          }
          if (wave.phase.fire && (e.kind === 'sine' || e.kind === 'tank')) {
            e.fireTimer -= dt * freezeScale;
            if (e.fireTimer <= 0 && e.y > 0 && e.y < H - 260) {
              e.fireTimer = e.kind === 'tank' ? rand(1.6, 2.4) : rand(2.0, 3.2);
              const spd = (165 + wave.cycle * 14) * (theme.shotSpeed || 1);
              if (e.kind === 'tank') {
                for (let k = -1; k <= 1; k++) {
                  if (shots.length >= wave.maxShots) break;
                  const ang = Math.atan2(player.y - e.y, player.x - e.x) + k * 0.38;
                  shots.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 4 });
                }
              } else if (shots.length < wave.maxShots) {
                enemyShot(e, spd);
              }
            }
          }
          if (e.y > H + 40) enemies.splice(i, 1);
        }
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (b.homing) {
            let best = null;
            let bestD = Infinity;
            for (const e of enemies) {
              const d = (e.x + e.w / 2 - b.x) ** 2 + (e.y + e.h / 2 - b.y) ** 2;
              if (d < bestD) {
                bestD = d;
                best = e;
              }
            }
            if (best) {
              const tx = best.x + best.w / 2 - b.x;
              const ty = best.y + best.h / 2 - b.y;
              const len = Math.hypot(tx, ty) || 1;
              b.vx += (tx / len) * 1500 * dt;
              b.vy += (ty / len) * 1500 * dt;
              const sp = Math.hypot(b.vx, b.vy) || 1;
              const targetSpeed = 560;
              b.vx = (b.vx / sp) * targetSpeed;
              b.vy = (b.vy / sp) * targetSpeed;
            }
          }
          b.x += (b.vx || 0) * dt;
          b.y += (b.vy || 0) * dt;
          if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) bullets.splice(i, 1);
        }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          const shotScale = run.freezeTimer > 0 ? 0.25 : 1;
          s.x += s.vx * dt * shotScale;
          s.y += s.vy * dt * shotScale;
          if (s.y > H + 20 || s.y < -20 || s.x < -20 || s.x > W + 20) shots.splice(i, 1);
        }
      }

      function updatePickups(dt) {
        if (isMow() && pickups.length > MOW.pickupCap) {
          pickups.splice(0, pickups.length - MOW.pickupCap);
        }
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.y += p.vy * dt;
          p.spin += dt * 3;
          /* 靠近玩家时轻微吸附，避免辛苦打出的 Buff 从旁边滑走；稀有军械吸得更紧。 */
          const magnet = (p.type === 'item' ? 150 : 80) * magnetMultiplier() * (isMow() ? 1.35 : 1);
          if (p.y > H * 0.55) p.x += clamp(player.x - p.x, -magnet * dt, magnet * dt);
          const box = { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
          const hb = { x: player.x - 20, y: player.y - 20, w: 40, h: 40 };
          if (A.Physics.aabbOverlap(hb, box)) {
            const special = SPECIAL_PICKUPS[p.type];
            if (special) {
              if (p.type === 'energy') {
                const energyGain = isMow() ? MOW.energyCoreAmount : 18;
                addEnergy(energyGain);
                addFloater(player.x, player.y - 34, '能量 +' + energyGain, special.color);
              } else if (p.type === 'core') {
                if (isMow()) {
                  addEnergy(MOW.powerCoreEnergy);
                  addFloater(player.x, player.y - 34, '火力核心 · 能量 +' + MOW.powerCoreEnergy, special.color);
                } else if (run.power < 5) {
                  run.power += 1;
                  addFloater(player.x, player.y - 34, '火力 LV' + run.power, special.color);
                } else {
                  addEnergy(12);
                  addFloater(player.x, player.y - 34, '火力已满 · 能量 +12', special.color);
                }
                syncHud();
              } else if (p.type === 'item') {
                const type = ITEM_SPECS[p.itemType] ? p.itemType : 'nuke';
                if (isMow()) {
                  /* 大杀器库已满载：军械箱直接折算能量，保持掉落有收益。 */
                  addEnergy(MOW.itemEnergy);
                  addFloater(player.x, player.y - 34, '军械已满 · 能量 +' + MOW.itemEnergy, special.color);
                } else if (!giveItem(type)) {
                  addEnergy(10);
                }
              }
              A.Sfx.play('perfect');
              particles.emit(p.x, p.y, {
                count: A.reducedMotion ? 5 : 14,
                speed: [40, 180],
                life: [0.2, 0.5],
                size: [2, 4],
                colors: [special.color, '#ffffff'],
                gravity: 60,
              });
              pickups.splice(i, 1);
              syncJoyTools();
              continue;
            }
            if (isMow()) {
              /* 常驻模式下弹种拾取按能量结算，避免「拿了也没用」。 */
              addEnergy(MOW.buffEnergy);
              addFloater(player.x, player.y - 34, WEAPONS[p.type].name + '常驻 · 能量 +' + MOW.buffEnergy, WEAPONS[p.type].color);
            } else {
              const before = buffs[p.type];
              const added = grantBuff(p.type);
              if (mode === 'challenge') {
                /* 挑战收集物：设计源 powerups 的拾取记录（不影响通关，不标记 assisted）。 */
                const collectedId = p.chPowerup || p.type;
                if (chCollectibles.indexOf(collectedId) === -1) chCollectibles.push(collectedId);
                chPowerupLog.push({ atSec: Math.round(chTime * 10) / 10, kind: collectedId });
              }
              const total = buffTimeLabel(p.type);
              addFloater(
                player.x,
                player.y - 34,
                WEAPONS[p.type].name + '弹 +' + Math.round(added) + 's · 共 ' + total,
                WEAPONS[p.type].color
              );
              if (before >= BUFF_STACK_CAP) addFloater(player.x, player.y - 48, '叠加上限 ' + BUFF_STACK_CAP + 's', '#93a0c8');
            }
            syncHud();
            A.Sfx.play('perfect');
            particles.emit(p.x, p.y, {
              count: A.reducedMotion ? 6 : 18,
              speed: [40, 180],
              life: [0.25, 0.6],
              size: [2, 4],
              colors: [WEAPONS[p.type].color, '#ffffff'],
              gravity: 80,
            });
            pickups.splice(i, 1);
            continue;
          }
          if (p.y > H + 30) pickups.splice(i, 1);
        }
      }

      function addFloater(x, y, text, color) {
        floaters.push({ x, y, text, color, life: 0.8, maxLife: 0.8 });
      }
      function updateFloaters(dt) {
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.life -= dt;
          f.y -= 34 * dt;
          if (f.life <= 0) floaters.splice(i, 1);
        }
      }

      function dropPickup(e) {
        const missing = PICKUP_TYPES.filter((type) => buffs[type] <= 0);
        let type;
        if (missing.length && Math.random() < 0.75) type = pick(missing);
        else type = PICKUP_TYPES[randInt(0, PICKUP_TYPES.length - 1)];
        pickups.push({
          x: clamp(e.x + e.w / 2, 24, W - 24),
          y: e.y + e.h / 2,
          vy: 72,
          r: 15,
          type,
          spin: 0,
        });
        pickupPity = 0;
        A.Sfx.play('bell', 8);
      }

      function killEnemy(e, idx, award) {
        enemies.splice(idx, 1);
        if (e.kind === 'boss') {
          if (!isMow()) {
            const themeScore = classicLike() && run.theme ? run.theme.scoreMul || 1 : 1;
            const gained = Math.round(e.score * (classicLike() ? comboMul() : 1) * themeScore);
            score += gained;
            addFloater(e.x + e.w / 2, e.y + e.h / 2, '+' + gained, '#ffd23f');
          }
          particles.emit(e.x + e.w / 2, e.y + e.h / 2, {
            count: A.reducedMotion ? 14 : 46,
            speed: [80, 360],
            life: [0.4, 1.1],
            size: [2, 7],
            colors: ['#ff5d7a', '#ffd23f', '#ffffff', '#4f7cff'],
            gravity: 90,
          });
          addRing(e.x + e.w / 2, e.y + e.h / 2, '#ffd23f', 260, 0.8, 8);
          A.Sfx.play('explode');
          shake = A.reducedMotion ? 0 : 10;
          if (mode === 'challenge') {
            /* 挑战 Boss 击破 = 关卡通关（endCondition: defeat-boss）。 */
            chBossDefeated = true;
            boss = null;
            shots = [];
            chEvents.forEach((ev) => {
              if (ev.enemyType === 'boss') {
                ev.done = true;
                ev.phase = 'done';
              }
            });
            challengeClear();
            syncHud();
            return;
          }
          if (isMow()) {
            /* 割草 Boss：无分数，只掉大量能量/火力核心并自动进入下一潮。 */
            mowKills += 5;
            addEnergy(MOW.bossEnergy);
            dropMowBossLoot(e);
            flash = Math.max(flash, 0.6);
            flashColor = '#ffd23f';
            run.bossDamageAcc = 0;
            run.bossDamageTimer = 0;
            stageClearMow();
            syncHud();
            return;
          }
          /* 0.13.0：Boss 击破补给能量，接下来由 CLEAR 面板给出整备三选一。 */
          addEnergy(45);
          run.combo = 0;
          run.comboTimer = 0;
          for (let i = 0; i < 3; i++) {
            dropPickup({
              x: e.x + rand(-40, 40),
              y: e.y + rand(-24, 24),
              w: 0,
              h: 0,
            });
          }
          /* boss.defeated 用真实游戏状态：level 是刚击破的关卡号、theme 是 run.theme.id，
             供 T1/T2 的 objective.context（level/theme）判定，不读分数文本。 */
          if (isCareerRun()) careerBattle.bossKills += 1;
          careerObserve('boss.defeated', { level, theme: run.theme && run.theme.id });
          stageClear(level);
          syncHud();
          return;
        }
        if (award !== false) {
          if (isMow()) {
            /* 割草击杀：不记分，只回一点能量 + 密集掉落（能量核心为主）。 */
            mowKills += 1;
            addEnergy(MOW.killEnergy);
            bumpCombo();
            energyPity += 1;
            const theme = run.theme || themeForLevel(level);
            const dropRate = theme.dropRate || 1;
            if (Math.random() < MOW.energyDropChance * dropRate || energyPity >= MOW.energyPity) {
              dropEnergyCore(e);
              energyPity = 0;
            } else if (e.kind === 'tank' && Math.random() < 0.5) {
              dropPowerCore(e);
            } else if (Math.random() < 0.02) {
              dropItemPickup(e);
            }
            pickupPity = 0;
          } else {
            const themeScore = classicLike() && run.theme ? run.theme.scoreMul || 1 : 1;
            const gained = Math.round(e.score * (classicLike() ? comboMul() : 1) * themeScore);
            score += gained;
            syncHud();
            addFloater(e.x + e.w / 2, e.y, '+' + gained, '#ffd23f');
            pickupPity += 1;
            if (classicLike()) {
              careerObserve('enemy.killed', { kind: e.kind, level, theme: run.theme && run.theme.id });
              bumpCombo();
              /* 击杀回能：避免能量枯竭后陷入无补给的死亡螺旋。 */
              addEnergy(0.6);
              itemPity += 1;
              energyPity += 1;
              const theme = run.theme || themeForLevel(level);
              const dropRate = theme.dropRate || 1;
              if (Math.random() < 0.006 * dropRate || itemPity >= 180) {
                dropItemPickup(e);
                itemPity = 0;
              } else if (e.kind === 'tank' && Math.random() < 0.3) {
                dropPowerCore(e);
              } else if (Math.random() < 0.07 * dropRate || energyPity >= 18) {
                dropEnergyCore(e);
                energyPity = 0;
              } else if (Math.random() < (e.kind === 'tank' ? 0.8 : 0.1) || pickupPity >= 12) {
                dropPickup(e);
              }
            } else {
              /* 挑战模式不使用随机掉落：掉 Buff 只由设计源 powerups 时间轴决定。 */
              pickupPity = 0;
            }
          }
        } else {
          addFloater(e.x + e.w / 2, e.y, '撞毁', '#ff9a9a');
          run.combo = 0;
          run.comboTimer = 0;
        }
        particles.emit(e.x + e.w / 2, e.y + e.h / 2, {
          count: A.reducedMotion ? 6 : 16,
          speed: [40, 220],
          life: [0.25, 0.7],
          size: [2, 5],
          colors: [e.color, '#ffd23f', '#ffffff'],
          gravity: 120,
        });
        A.Sfx.play(e.kind === 'tank' ? 'explode' : 'hit');
        if (e.kind === 'tank') shake = A.reducedMotion ? 0 : 5;
      }

      function hitPlayer() {
        if (mode === 'challenge') {
          challengeHit('弹幕/碰撞');
          return;
        }
        if (player.invul > 0 || shieldTimer > 0) return;
        if (isMow()) {
          /* 割草模式不掉命：受击直接扣一大截能量。能量见底才会火力下降，
           * 所以「唯一瓶颈」落在能量管理上，而不是生命数。 */
          player.invul = invulSeconds();
          const loss = Math.round(run.maxEnergy * MOW.hitEnergyRatio);
          run.energy = Math.max(0, run.energy - loss);
          if (run.energy <= 0.001) {
            run.energy = 0;
            run.depleted = true;
            endFormation('能量枯竭');
          }
          run.combo = 0;
          run.comboTimer = 0;
          shake = A.reducedMotion ? 0 : 8;
          flash = Math.max(flash, 0.55);
          flashColor = '#ff5d7a';
          addRing(player.x, player.y, '#ff8f86', 130, 0.5, 4);
          addFloater(player.x, player.y - 44, '受击 · 能量 -' + loss, '#ff8f86');
          A.Sfx.play('explode');
          particles.emit(player.x, player.y, {
            count: 24,
            speed: [60, 260],
            life: [0.3, 0.8],
            size: [2, 5],
            colors: ['#4f7cff', '#ffffff', '#ffd23f'],
            gravity: 100,
          });
          syncHud();
          syncJoyTools();
          return;
        }
        /* 0.17（ADR §19.5 / D17-15）：职业模块只在生涯 run 生效。
           - phase-shield：每趟出击最多抵消一次受击（不扣生命、不扣火力）；
           - cargo-magnet：armorMul 承伤倍率进伤害池，累计满 1 点才扣 1 条生命；
             armorMul=1 时第一次受击立即扣 1 条，与 0.16/经典逐字一致。 */
        if (isCareerRun()) {
          if (careerBattle.shieldCharges > 0) {
            careerBattle.shieldCharges -= 1;
            player.invul = Math.max(1.2, invulSeconds());
            run.combo = 0;
            run.comboTimer = 0;
            addRing(player.x, player.y, '#7ce8e0', 150, 0.5, 4);
            flash = Math.max(flash, 0.4);
            flashColor = '#7ce8e0';
            addFloater(player.x, player.y - 46, '相位护盾 · 抵消一次', '#7ce8e0');
            A.Sfx.play('perfect');
            syncHud();
            syncJoyTools();
            return;
          }
          const armorMulValue = clamp(Number(careerBattle.stats.armorMul) || 1, 0.5, 1.5);
          careerBattle.armorPool += armorMulValue;
          if (careerBattle.armorPool < 1) {
            player.invul = Math.max(0.9, invulSeconds());
            run.combo = 0;
            run.comboTimer = 0;
            addRing(player.x, player.y, '#9ecbff', 110, 0.4, 3);
            addFloater(player.x, player.y - 46, '装甲吸收冲击', '#9ecbff');
            A.Sfx.play('hit');
            syncHud();
            syncJoyTools();
            return;
          }
          careerBattle.armorPool = Math.max(0, careerBattle.armorPool - 1);
        }
        lives -= 1;
        player.invul = invulSeconds();
        shake = A.reducedMotion ? 0 : 8;
        flash = Math.max(flash, 0.55);
        flashColor = '#ff5d7a';
        /* 受击不再是「全部清零」：火力只掉 1 级，能量回到 35% 保底，避免死亡螺旋。 */
        run.power = Math.max(1, run.power - 1);
        run.combo = 0;
        run.comboTimer = 0;
        run.energy = Math.max(run.energy, run.maxEnergy * 0.4);
        run.depleted = false;
        addRing(player.x, player.y, '#ff8f86', 130, 0.5, 4);
        A.Sfx.play('explode');
        particles.emit(player.x, player.y, {
          count: 24,
          speed: [60, 260],
          life: [0.3, 0.8],
          size: [2, 5],
          colors: ['#4f7cff', '#ffffff', '#ffd23f'],
          gravity: 100,
        });
        syncHud();
        syncJoyTools();
        if (lives <= 0) gameOver();
      }

      function collide() {
        /* 僚机拦截敌弹：先于玩家判定，命中后僚机掉 1 点耐久。 */
        if (classicFormula() && run.wingmen.length) {
          for (let i = shots.length - 1; i >= 0; i -= 1) {
            const s = shots[i];
            let absorbed = false;
            for (let w = run.wingmen.length - 1; w >= 0; w -= 1) {
              const wing = run.wingmen[w];
              const wingBox = { x: wing.x - 12, y: wing.y - 10, w: 24, h: 20 };
              if (!A.Physics.circleBox(s.x, s.y, s.r, wingBox)) continue;
              shots.splice(i, 1);
              wing.hp -= 1;
              wing.flash = 0.16;
              particles.emit(s.x, s.y, {
                count: 5,
                speed: [30, 120],
                life: [0.1, 0.3],
                size: [1.5, 3],
                colors: ['#7cf5b2', '#ffffff'],
              });
              A.Sfx.play('hit');
              if (wing.hp <= 0) {
                run.wingmen.splice(w, 1);
                if (!run.wingmen.length) endFormation('僚机损毁');
              }
              absorbed = true;
              break;
            }
            if (absorbed) continue;
          }
        }
        /* 子弹 × 敌机 */
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (b.hitIds && b.hitIds.indexOf(e.uid) !== -1) continue;
            if (A.Physics.circleBox(b.x, b.y, (b.r || 3) + 2, e)) {
              /* 挑战 Boss 的护盾/未暴露阶段吸收伤害（弱点窗口才掉血）。 */
              if (mode === 'challenge' && e.kind === 'boss' && e.exposed === false) {
                particles.emit(b.x, b.y, { count: 2, speed: [20, 70], life: [0.08, 0.22], size: [1.5, 3], colors: ['#7ce8e0'] });
                if (b.pierce) {
                  if (b.hitIds.indexOf(e.uid) === -1) b.hitIds.push(e.uid);
                } else {
                  bullets.splice(j, 1);
                }
                continue;
              }
              e.hp -= b.dmg || 1;
              e.flash = e.kind === 'rock' ? 0.1 : 0.07;
              if (e.kind === 'boss') addBossFloater(e, b.dmg || 1);
              if (mode === 'challenge' && e.kind === 'boss') chBossHits += 1;
              particles.emit(b.x, b.y, { count: 3, speed: [20, 90], life: [0.1, 0.3], size: [1.5, 3], colors: [buffColor()] });
              if (b.pierce) {
                b.hitIds.push(e.uid);
              } else {
                bullets.splice(j, 1);
              }
              if (e.hp <= 0) {
                killEnemy(e, i);
                break;
              }
            }
          }
        }
        /* 玩家判定盒缩小（弹幕游戏惯例） */
        const hb = { x: player.x - 9, y: player.y - 8, w: 18, h: 16 };
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (!A.Physics.aabbOverlap(hb, e)) continue;
          if (e.kind === 'boss') {
            /* Boss 入场穿过顶部时不应撞伤贴顶玩家；完全进入后再启用机体碰撞。 */
            if (e.y >= 100 && player.invul <= 0) hitPlayer();
            continue;
          }
          if (player.invul <= 0) {
            killEnemy(e, i, false);
            hitPlayer();
          }
        }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          if (A.Physics.circleBox(s.x, s.y, s.r, hb)) {
            shots.splice(i, 1);
            hitPlayer();
          }
        }
      }

      /* ---------- 渲染 ---------- */
      function drawPlayer() {
        if (player.invul > 0 && Math.floor(player.invul * 12) % 2 === 0) return;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.tilt * 0.16);
        const active = activeBuffs();
        const spec = WEAPONS[lastBuff !== 'normal' && buffs[lastBuff] > 0 ? lastBuff : active[0] || 'normal'];
        active.forEach((type, index) => {
          ctx.strokeStyle = WEAPONS[type].color;
          ctx.globalAlpha = 0.35 + Math.sin(performance.now() / 120 + index) * 0.12;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 22 + index * 4, 0, TAU);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
        if (shieldTimer > 0) {
          ctx.strokeStyle = '#7ce8e0';
          ctx.lineWidth = 3;
          ctx.globalAlpha = 0.72;
          ctx.beginPath();
          ctx.arc(0, 0, 31, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        /* 喷焰 */
        const flame = 8 + Math.sin(performance.now() / 40) * 4;
        ctx.fillStyle = '#ffb43d';
        ctx.beginPath();
        ctx.moveTo(-5, 12);
        ctx.lineTo(5, 12);
        ctx.lineTo(0, 12 + flame);
        ctx.closePath();
        ctx.fill();
        /* 机体 */
        ctx.fillStyle = '#e8eeff';
        ctx.strokeStyle = spec.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(13, 10);
        ctx.lineTo(5, 6);
        ctx.lineTo(0, 12);
        ctx.lineTo(-5, 6);
        ctx.lineTo(-13, 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = spec.color;
        ctx.beginPath();
        ctx.arc(0, -2, 3.4, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawBoss(b) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
        ctx.fillStyle = '#ff5d7a';
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -b.h / 2);
        ctx.lineTo(b.w * 0.28, -b.h * 0.16);
        ctx.lineTo(b.w / 2, 0);
        ctx.lineTo(b.w * 0.34, b.h * 0.34);
        ctx.lineTo(0, b.h / 2);
        ctx.lineTo(-b.w * 0.34, b.h * 0.34);
        ctx.lineTo(-b.w / 2, 0);
        ctx.lineTo(-b.w * 0.28, -b.h * 0.16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#3b1e3f';
        ctx.beginPath();
        ctx.ellipse(0, 0, b.w * 0.2, b.h * 0.2, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = b.phase >= 3 ? '#ffb0a0' : '#ffd23f';
        ctx.globalAlpha = 0.65 + pulse * 0.35;
        ctx.beginPath();
        ctx.arc(0, 0, 9 + pulse * 3, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        for (const side of [-1, 1]) {
          ctx.fillStyle = '#4f7cff';
          ctx.fillRect(side * b.w * 0.3 - 4, -b.h * 0.08, 8, b.h * 0.32);
        }
        if (isMow()) {
          /* 割草 Boss 专属外观：旋转警戒环 + 双层光晕 + 侧翼炮塔，招式更醒目。 */
          const now = performance.now() / 1000;
          const aura = ctx.createRadialGradient(0, 0, 10, 0, 0, Math.max(b.w, b.h) * 0.95);
          aura.addColorStop(0, 'rgba(255, 154, 61, 0.20)');
          aura.addColorStop(0.55, 'rgba(255, 93, 122, 0.10)');
          aura.addColorStop(1, 'rgba(255, 93, 122, 0)');
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(b.w, b.h) * 0.95, 0, TAU);
          ctx.fill();
          ctx.save();
          ctx.rotate(now * 0.8);
          ctx.strokeStyle = 'rgba(255, 210, 63, 0.55)';
          ctx.lineWidth = 2;
          for (let k = 0; k < 4; k += 1) {
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(b.w, b.h) * 0.66 + pulse * 4, k * (TAU / 4), k * (TAU / 4) + 0.45);
            ctx.stroke();
          }
          ctx.restore();
          for (const side of [-1, 1]) {
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.moveTo(side * b.w * 0.42, -10);
            ctx.lineTo(side * b.w * 0.42, 16);
            ctx.lineTo(side * b.w * 0.55, 3);
            ctx.closePath();
            ctx.fill();
          }
        }
        if (mode === 'challenge' && b.exposed === false) {
          ctx.strokeStyle = 'rgba(124, 232, 224, 0.85)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(b.w, b.h) * 0.55 + pulse * 3, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawEnemy(e) {
        if (e.kind === 'boss') {
          drawBoss(e);
          return;
        }
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        if (e.kind === 'rock') {
          ctx.rotate(e.rot || 0);
          ctx.fillStyle = e.color;
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          for (let k = 0; k < 9; k += 1) {
            const ang = (k / 9) * TAU;
            const radius = (Math.min(e.w, e.h) / 2) * (0.76 + 0.2 * Math.sin(k * 2.3 + (e.uid || 0)));
            const px = Math.cos(ang) * radius;
            const py = Math.sin(ang) * radius;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = 'rgba(20, 16, 12, 0.55)';
          ctx.beginPath();
          ctx.arc(-4, -3, 4, 0, TAU);
          ctx.arc(6, 5, 3, 0, TAU);
          ctx.fill();
          ctx.restore();
          return;
        }
        ctx.fillStyle = e.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (e.kind === 'drone') {
          ctx.moveTo(0, -e.h / 2);
          ctx.lineTo(e.w / 2, 0);
          ctx.lineTo(0, e.h / 2);
          ctx.lineTo(-e.w / 2, 0);
          ctx.closePath();
        } else if (e.kind === 'sine') {
          for (let k = 0; k < 6; k++) {
            const ang = (k / 6) * TAU + Math.PI / 6;
            const px = Math.cos(ang) * (e.w / 2);
            const py = Math.sin(ang) * (e.h / 2);
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (e.kind === 'diver') {
          ctx.moveTo(0, e.h / 2);
          ctx.lineTo(e.w / 2, -e.h / 2);
          ctx.lineTo(-e.w / 2, -e.h / 2);
          ctx.closePath();
        } else {
          for (let k = 0; k < 8; k++) {
            const ang = (k / 8) * TAU;
            const px = Math.cos(ang) * (e.w / 2);
            const py = Math.sin(ang) * (e.h / 2);
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();
        /* 核心 */
        ctx.fillStyle = 'rgba(10,14,30,0.85)';
        ctx.beginPath();
        ctx.arc(0, 0, Math.min(e.w, e.h) * 0.22, 0, TAU);
        ctx.fill();
        if (e.kind === 'tank' && e.hp <= 2) {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillRect(-e.w / 2 + 4, -e.h / 2 + 4, e.w - 8, 2);
        }
        /* 0.13.0 受击白闪：短促、只给反馈，不改变判定。 */
        if (e.flash > 0) {
          ctx.globalAlpha = clamp(e.flash * 7, 0, 0.8);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, Math.min(e.w, e.h) * 0.46, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      function drawPickup(p) {
        const spec = WEAPONS[p.type] || SPECIAL_PICKUPS[p.type] || { name: '补给', short: '?', color: '#ffffff' };
        const isItem = p.type === 'item';
        const itemSpec = isItem && ITEM_SPECS[p.itemType] ? ITEM_SPECS[p.itemType] : null;
        const color = itemSpec ? itemSpec.color : spec.color;
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180 + p.x);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.sin(p.spin) * 0.25);
        if (isItem || p.type === 'core') {
          ctx.globalAlpha = 0.3 + pulse * 0.3;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, p.r + 7 + pulse * 4, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = 'rgba(8,12,26,0.9)';
        A.draw.roundRect(ctx, -p.r, -p.r, p.r * 2, p.r * 2, isItem ? 5 : 7);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        A.draw.label(ctx, itemSpec ? itemSpec.icon : spec.short, 0, 1, {
          font: isItem ? 'bold 15px system-ui' : 'bold 13px system-ui',
          color,
        });
        ctx.restore();
      }

      function drawBullets() {
        bullets.forEach((b) => {
          if (b.laser) {
            ctx.fillStyle = 'rgba(255,134,200,0.3)';
            ctx.fillRect(b.x - 5, b.y - 16, 10, 32);
            ctx.fillStyle = '#ff86c8';
            ctx.fillRect(b.x - 2, b.y - 18, 4, 34);
          } else if (b.homing) {
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#fff6cf';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU);
            ctx.fill();
          } else {
            ctx.fillStyle = '#e8f4ff';
            ctx.fillRect(b.x - 1.5, b.y - 7, 3, 12);
          }
        });
      }

      /* ---------- 0.13.0 背景 / 特效 / 编队 / 轨道炮 ---------- */
      function drawBackground() {
        const theme = run.theme || THEMES[0];
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, theme.tint || '#0a0f26');
        bg.addColorStop(1, '#141b42');
        ctx.fillStyle = bg;
        ctx.fillRect(-12, -12, W + 24, H + 24);
        starsFar.draw(ctx);
        stars.draw(ctx);
        if (theme.id === 'storm') {
          /* 电磁风暴：随机电弧，纯背景表现。 */
          const now = performance.now() / 1000;
          ctx.strokeStyle = 'rgba(124, 232, 224, 0.25)';
          ctx.lineWidth = 1.2;
          for (let i = 0; i < 3; i += 1) {
            const seed = now * (0.6 + i * 0.17);
            const x = ((Math.sin(seed * 2.3 + i) + 1) / 2) * W;
            const y = ((Math.cos(seed * 1.7 + i) + 1) / 2) * H;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.sin(seed * 9) * 40, y + 50 + i * 20);
            ctx.stroke();
          }
        }
        if (run.warpTint > 0) {
          ctx.strokeStyle = 'rgba(180, 220, 255, ' + (0.5 * run.warpTint) + ')';
          ctx.lineWidth = 2;
          for (let i = 0; i < 22; i += 1) {
            const x = ((i * 97) % W);
            const y = ((i * 173 + performance.now() * 0.6) % H);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 26 + run.warpTint * 40);
            ctx.stroke();
          }
        }
      }

      function drawEffects() {
        effects.forEach((item) => {
          const k = clamp(item.life / item.maxLife, 0, 1);
          ctx.globalAlpha = k * 0.9;
          ctx.strokeStyle = item.color;
          ctx.lineWidth = Math.max(1, item.width * k);
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.r, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        });
        if (run.freezeTimer > 0) {
          ctx.fillStyle = 'rgba(158, 203, 255, ' + (0.1 + 0.05 * Math.sin(performance.now() / 120)) + ')';
          ctx.fillRect(-10, -10, W + 20, H + 20);
        }
        if (run.theme && run.theme.vignette) {
          const gradient = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.22, W / 2, H * 0.55, H * 0.72);
          gradient.addColorStop(0, 'rgba(4, 8, 18, 0)');
          gradient.addColorStop(1, 'rgba(4, 8, 18, 0.82)');
          ctx.fillStyle = gradient;
          ctx.fillRect(-10, -10, W + 20, H + 20);
        }
      }

      function drawLance() {
        const beam = run.lance;
        if (!beam) return;
        const alpha = clamp(beam.t / 3.2, 0, 1);
        const width = 28 + Math.sin(performance.now() / 40) * 3;
        const gradient = ctx.createLinearGradient(beam.x - width, 0, beam.x + width, 0);
        gradient.addColorStop(0, 'rgba(124, 232, 224, 0)');
        gradient.addColorStop(0.5, 'rgba(200, 255, 250, ' + (0.55 * alpha) + ')');
        gradient.addColorStop(1, 'rgba(124, 232, 224, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(beam.x - width, 0, width * 2, H);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * alpha) + ')';
        ctx.fillRect(beam.x - 3, 0, 6, H);
      }

      function drawNukeShots() {
        if (!run.nukeShots.length) return;
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 90);
        run.nukeShots.forEach((shot) => {
          /* 目标锁定环：Boss 在动时会跟着走，让玩家看到「追踪」而不是瞬发。 */
          ctx.save();
          ctx.globalAlpha = 0.45 + pulse * 0.45;
          ctx.strokeStyle = '#ffd23f';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(shot.targetX, shot.targetY, 16 + pulse * 9, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(shot.targetX - 26, shot.targetY);
          ctx.lineTo(shot.targetX - 10, shot.targetY);
          ctx.moveTo(shot.targetX + 10, shot.targetY);
          ctx.lineTo(shot.targetX + 26, shot.targetY);
          ctx.moveTo(shot.targetX, shot.targetY - 26);
          ctx.lineTo(shot.targetX, shot.targetY - 10);
          ctx.moveTo(shot.targetX, shot.targetY + 10);
          ctx.lineTo(shot.targetX, shot.targetY + 26);
          ctx.stroke();
          ctx.restore();
          /* 弹体 + 尾焰，朝速度方向旋转。 */
          const angle = Math.atan2(shot.vy, shot.vx) + Math.PI / 2;
          ctx.save();
          ctx.translate(shot.x, shot.y);
          ctx.rotate(angle);
          const flicker = 6 + Math.sin(performance.now() / 35) * 3;
          ctx.fillStyle = 'rgba(255, 170, 60, 0.85)';
          ctx.beginPath();
          ctx.moveTo(-4, 6);
          ctx.lineTo(4, 6);
          ctx.lineTo(0, 6 + flicker * 2.2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#ffe9b0';
          ctx.strokeStyle = '#ff8f5e';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, 5, 9, 0, 0, TAU);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ff8f5e';
          ctx.beginPath();
          ctx.arc(0, -1, 2.4, 0, TAU);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawWingmen() {
        run.wingmen.forEach((wing) => {
          ctx.save();
          ctx.translate(wing.x, wing.y);
          if (wing.flash > 0) {
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          ctx.fillStyle = '#7cf5b2';
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(8, 8);
          ctx.lineTo(0, 4);
          ctx.lineTo(-8, 8);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          for (let i = 0; i < wing.hp; i += 1) {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillRect(-6 + i * 7, 11, 5, 2);
          }
          ctx.restore();
        });
      }

      function drawEnergyHud() {
        const ratio = clamp(run.energy / Math.max(1, run.maxEnergy), 0, 1);
        const low = ratio < 0.25;
        const pulse = low ? 0.5 + 0.5 * Math.sin(performance.now() / 140) : 0.7;
        ctx.fillStyle = 'rgba(7,11,24,0.66)';
        A.draw.roundRect(ctx, 12, 30, W - 24, 7, 3.5);
        ctx.fill();
        const gradient = ctx.createLinearGradient(12, 0, W - 12, 0);
        gradient.addColorStop(0, run.depleted ? '#ff5d7a' : low ? '#ffd23f' : '#63d68c');
        gradient.addColorStop(1, run.depleted ? '#ff9a3d' : '#7ce8e0');
        ctx.globalAlpha = pulse;
        ctx.fillStyle = gradient;
        A.draw.roundRect(ctx, 12, 30, Math.max(2, (W - 24) * ratio), 7, 3.5);
        ctx.fill();
        ctx.globalAlpha = 1;
        const energyText = (run.depleted ? '能量枯竭 · 火力下降 · ' : '能量 ') + Math.round(run.energy) + '/' + run.maxEnergy;
        A.draw.label(ctx, energyText, 12, 47, {
          align: 'left',
          font: 'bold 10px system-ui, sans-serif',
          color: run.depleted ? '#ff8f86' : low ? '#ffd23f' : '#93c8b4',
        });
        A.draw.label(ctx, isMow() ? '火力 MAX' : '火力 LV' + run.power, W - 12, 47, {
          align: 'right',
          font: 'bold 11px system-ui, sans-serif',
          color: '#ffd23f',
        });
        if (run.combo > 1) {
          const pop = run.comboTimer > 2.1 ? 1 + (run.comboTimer - 2.1) * 1.5 : 1;
          A.draw.label(ctx, 'COMBO x' + run.combo, W / 2, 47, {
            font: 'bold ' + Math.round(11 * pop) + 'px system-ui, sans-serif',
            color: '#ffd23f',
          });
        }
        if (run.formationTimer > 0) {
          A.draw.label(ctx, '编队 ' + run.formationTimer.toFixed(1) + 's · 僚机 ×' + run.wingmen.length, W / 2, isMow() ? 74 : 61, {
            font: 'bold 10px system-ui, sans-serif',
            color: '#7cf5b2',
          });
        }
      }

      function render() {
        stage.beginFrame();
        ctx.save();
        if (shake > 0) {
          ctx.translate(rand(-shake, shake), rand(-shake, shake));
        }
        if (mode === 'challenge') {
          /* 挑战模式：背景保持 0.12 的朴素双层星空，避免新主题影响固定波次可读性。 */
          const bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, '#0a0f26');
          bg.addColorStop(1, '#141b42');
          ctx.fillStyle = bg;
          ctx.fillRect(-10, -10, W + 20, H + 20);
          stars.draw(ctx);
        } else {
          drawBackground();
        }
        particles.draw(ctx);
        if (mode === 'challenge') drawChallengeOverlay();

        enemies.forEach(drawEnemy);
        pickups.forEach(drawPickup);
        drawBullets();
        shots.forEach((s) => {
          const color = s.mowColor || '#ff86c8';
          if (s.mowColor) {
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * 1.9, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 0.45, 0, TAU);
          ctx.fill();
        });
        drawLance();
        drawNukeShots();

        if (state === 'playing' || state === 'paused') {
          drawWingmen();
          drawPlayer();
        }
        drawEffects();

        /* 浮动得分 / 伤害数字 */
        floaters.forEach((f) => {
          A.draw.label(ctx, f.text, f.x, f.y, {
            font: 'bold 13px system-ui, sans-serif',
            color: f.color,
            alpha: clamp(f.life / f.maxLife, 0, 1),
          });
        });

        /* 画布内 HUD */
        if (mode === 'challenge') {
          if (flash > 0.02) {
            ctx.globalAlpha = clamp(flash * 0.75, 0, 0.55);
            ctx.fillStyle = flashColor;
            ctx.fillRect(-10, -10, W + 20, H + 20);
            ctx.globalAlpha = 1;
          }
          drawChallengeHud();
          ctx.restore();
          return;
        }
        A.draw.label(ctx, isMow() ? '割草 ' + mowKills : 'SCORE ' + score, 12, 18, { align: 'left', font: 'bold 14px system-ui, sans-serif', color: '#ffd23f' });
        const wave = waveInfo();
        const themeName = run.theme ? run.theme.name : '';
        const centerLabel = isMow()
          ? 'STG ' + level + ' · 星海割草'
          : boss ? 'STG ' + level + ' · ' + themeName + ' · BOSS' : 'STG ' + level + ' · ' + themeName + ' · ' + wave.label;
        A.draw.label(ctx, centerLabel, W / 2, 18, {
          font: 'bold 11px system-ui, sans-serif',
          color: boss ? '#ff9a9d' : wave.phase.rest ? '#63d68c' : '#93a0c8',
        });
        if (isMow()) {
          A.draw.label(ctx, '∞', W - 18, 18, { align: 'right', font: 'bold 15px system-ui, sans-serif', color: '#4f7cff' });
        } else {
          for (let i = 0; i < Math.min(lives, 8); i++) {
            ctx.save();
            ctx.translate(W - 18 - i * 15, 18);
            ctx.fillStyle = '#4f7cff';
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(5, 5);
            ctx.lineTo(-5, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }
        drawEnergyHud();
        if (isMow() && !boss && run.formationTimer <= 0) {
          A.draw.label(ctx, '受击只扣能量 · 大杀器与主动道具消耗能量', W / 2, 74, {
            font: 'bold 10px system-ui, sans-serif',
            color: '#ffd23f',
          });
        }
        const active = activeBuffs();
        if (active.length) {
          const text = isMow()
            ? '常驻 · ' + active.map((type) => WEAPONS[type].short).join('')
            : active.map((type) => WEAPONS[type].short + buffTimeLabel(type)).join(' ');
          A.draw.label(ctx, text, W / 2, 60, {
            font: 'bold 11px system-ui, sans-serif',
            color: buffColor(),
          });
        }
        if (boss) {
          const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
          const bossNameY = isMow() ? 88 : 76;
          const bossBarY = isMow() ? 96 : 84;
          A.draw.label(ctx, boss.name + (isMow() && boss.mowPattern ? ' · ' + boss.mowPattern : ''), W / 2, bossNameY, {
            font: 'bold 10px system-ui, sans-serif',
            color: '#ff9a9d',
          });
          ctx.fillStyle = 'rgba(7,11,24,0.72)';
          ctx.fillRect(60, bossBarY, 300, 6);
          ctx.fillStyle = boss.phase >= 3 ? '#ff5d7a' : boss.phase >= 2 ? '#ff9a3d' : '#ffd23f';

      /* ---------- 挑战模式渲染：安全走廊 / 预警 / 挑战 HUD ---------- */
      function drawChallengeOverlay() {
        challengeActiveEvents().forEach((ev) => {
          const band = challengeBand(ev);
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
          ctx.save();
          ctx.fillStyle = ev.phase === 'attack' ? 'rgba(90, 209, 160, 0.16)' : 'rgba(90, 209, 160, 0.10)';
          ctx.fillRect(band.left, 0, band.right - band.left, H);
          ctx.strokeStyle = 'rgba(90, 209, 160, 0.6)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(band.left, 0);
          ctx.lineTo(band.left, H);
          ctx.moveTo(band.right, 0);
          ctx.lineTo(band.right, H);
          ctx.stroke();
          if (ev.phase === 'telegraph') {
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = 'rgba(255, 210, 63, ' + (0.28 + pulse * 0.3) + ')';
            ctx.lineWidth = 1.5;
            challengeDangerColumns(band).forEach((x) => {
              ctx.beginPath();
              ctx.moveTo(x, 96);
              ctx.lineTo(x, H);
              ctx.stroke();
            });
            ctx.setLineDash([]);
            A.draw.label(ctx, '预警 · ' + challengePatternLabel(ev) + ' · 移向绿色安全走廊', W / 2, 88, {
              font: 'bold 12px system-ui, sans-serif',
              color: '#ffd23f',
            });
          } else if (ev.attackPattern === 'mark-charge') {
            ctx.fillStyle = 'rgba(255, 93, 107, 0.14)';
            challengeDangerColumns(band).forEach((x) => ctx.fillRect(x - 11, 90, 22, H - 90));
          }
          ctx.restore();
        });

        shade.addColorStop(0, 'rgba(7, 11, 24, 0.82)');
        shade.addColorStop(1, 'rgba(7, 11, 24, 0)');
        ctx.fillStyle = shade;
        ctx.fillRect(0, 0, W, 54);
        A.draw.label(ctx, '生命 ' + chHealth + '/' + maxHealth, 12, 20, {
          align: 'left',
          font: 'bold 14px system-ui, sans-serif',

          font: 'bold 13px system-ui, sans-serif',

        A.draw.label(ctx, sub, W / 2, 38, {
          font: 'bold 12px system-ui, sans-serif',
          color: boss ? (boss.exposed === false ? '#7ce8e0' : '#ff9a9d') : '#93a0c8',

          advanceChallenge(seconds) {
            const total = Math.max(0, Number(seconds) || 0);

            while (guard-- > 0 && state === 'playing') update(step);

          /* ---------- 0.9.0 修复回归自检（页面内同步断言，不写测试文件） ---------- */
          regression() {
            const details = [];
            let pass = 0;
            let fail = 0;
            const check = (ok, message) => {
              if (ok) {
                pass += 1;
                details.push('PASS ' + message);
              } else {
                fail += 1;
                details.push('FAIL ' + message);
              }
            };
            const snapshotState = state;
            const snapshot = (state === 'playing' || state === 'paused' || state === 'clear') ? serialize() : null;
            try {
              const stage = challengeStageByRef('star-raid-C05');
              check(!!stage, 'C05 挑战关卡数据可用（Boss 修复依赖）');
              if (stage) {
                resetChallenge(stage);
                state = 'playing';
                chTime = 40.5;
                const bossEv = chEvents.filter((ev) => ev.enemyType === 'boss')[0];
                check(!!bossEv, 'C05 含 Boss 事件');
                if (bossEv) {
                  bossEv.started = true;
                  bossEv.phase = 'attack';
                  bossEv.phaseTime = 2.5;
                  bossEv.salvoIndex = 3;
                  bossEv.lastSalvo = 0.2;
                  challengeSpawnBoss(bossEv);
                }
                if (boss) {
                  boss.t = 3.2;
                  boss.fireTimer = 0.42;
                  boss.hp = 220;
                }
                const powerups = Array.isArray(chContent.powerups) ? chContent.powerups : [];
                chPowerupSpawned = powerups.map((powerup) => (Number(powerup && powerup.atSec) || 0) <= chTime);
                pickups = [];
                const savedRun = serialize();
                check(!!savedRun && !!(savedRun.challenge && savedRun.challenge.boss), '挑战局内档包含 Boss 状态');
                const expectTimer = boss ? boss.fireTimer : -1;
                const expectT = boss ? boss.t : -1;
                const restoredOk = restore(savedRun);
                check(restoredOk === true, '挑战刷新恢复返回成功');
                check(!!boss && Math.abs(boss.fireTimer - expectTimer) < 0.001, '刷新后 Boss fireTimer 连续（' + (boss ? boss.fireTimer : 'null') + '，不是 999）');
                check(!!boss && Math.abs(boss.t - expectT) < 0.001, '刷新后 Boss 阶段计时 b.t 连续');
                const pickupsBefore = pickups.length;
                challengePowerupsSpawned();
                check(pickups.length === pickupsBefore, '刷新后固定拾取物不重复生成（游标已恢复）');
                const timerBeforeStep = boss ? boss.fireTimer : -1;
                update(1 / 60);
                check(!!boss && Math.abs(timerBeforeStep - boss.fireTimer - 1 / 60) < 0.001, '恢复后首帧 Boss 射击计时继续推进');
                /* 旧档安全默认：缺 fireTimer / t / powerupSpawned 字段时也不能回到 999 或重复生成。 */
                const legacy = JSON.parse(JSON.stringify(savedRun));
                if (legacy.challenge && legacy.challenge.boss) {
                  delete legacy.challenge.boss.fireTimer;
                  delete legacy.challenge.boss.t;
                }
                if (legacy.challenge) delete legacy.challenge.powerupSpawned;
                if (Array.isArray(legacy.enemies)) {
                  legacy.enemies.forEach((enemy) => {
                    if (enemy && enemy.kind === 'boss') delete enemy.fireTimer;
                  });
                }
                const legacyOk = restore(legacy);
                check(legacyOk === true && !!boss && boss.fireTimer >= 0 && boss.fireTimer <= 2, '旧档缺 Boss 计时字段时使用安全默认值（' + (boss ? boss.fireTimer : 'null') + '）');
                const legacyPickups = pickups.length;
                challengePowerupsSpawned();
                check(pickups.length === legacyPickups, '旧档缺拾取游标时仍不重复生成');
              }
              /* 缺陷 2：挑战模式 DOM HUD 必须隐藏，只保留画布内 HUD。 */
              setChallengeChrome(true);
              check(dom.chHud && dom.chHud.hidden === true, '挑战模式 DOM 挑战 HUD 已隐藏（只保留画布内 HUD）');
              const gameHud = document.querySelector('.game-hud');
              check(!gameHud || getComputedStyle(gameHud).display === 'none', '挑战模式顶部 DOM 游戏 HUD 已隐藏');
              /* 0.10.0：content.splits 可选字段——设计源同步时拆成两段连续安全走廊；
               * 未同步时保持原 events 时间轴且不崩。C03/C04 各至少一段要求第二次换位。 */
              const splitStages = ['star-raid-C03', 'star-raid-C04'];
              let splitStageCount = 0;
              let relocatingCount = 0;
              let noSplitOk = true;
              splitStages.forEach((ref) => {
                const stage = challengeStageByRef(ref);
                check(!!stage, ref + ' 挑战关卡数据可用');
                if (!stage) { noSplitOk = false; return; }
                const content = stage.content || {};
                const segments = Array.isArray(content.splits) ? content.splits : [];
                resetChallenge(stage);
                const splitEvents = chEvents.filter((ev) => ev.fromSplit);
                if (!segments.length) {
                  check(splitEvents.length === 0 && chEvents.length === (Array.isArray(content.events) ? content.events.length : 0) && chEvents.every((ev) => challengeBand(ev) && Number.isFinite(challengeBand(ev).left)),
                    ref + ' 未拆分路径：按原 events 时间轴构建且安全走廊有效（不崩）');
                  return;
                }
                check(splitEvents.length === segments.length && splitEvents.length === 2, ref + ' splits 展开为两个安全段（实际 ' + splitEvents.length + ' 段）');
                const pairs = splitEvents.slice().sort((a, b) => a.atSec - b.atSec);
                const valid = pairs.length === 2 &&
                  pairs.every((ev) => ev.safeBandXRatio && Number.isFinite(Number(ev.safeBandXRatio.center)) && ev.telegraphSec >= 0.2 && Number.isFinite(ev.atSec)) &&
                  pairs[1].atSec > pairs[0].atSec;
                check(valid, ref + ' 两安全段各含 atSec/telegraphSec/safeBandXRatio 且顺序连续');
                const centers = pairs.map((ev) => challengeBand(ev).center);
                const relocated = valid && Math.abs(centers[1] - centers[0]) > 0.2;
                if (relocated) relocatingCount += 1;
                check(relocated, ref + ' 两段安全走廊中心明显不同，要求第二次换位（' + centers.map((c) => c.toFixed(2)).join(' → ') + '）');
                /* 安全走廊内不放弹：用两段的危险列生成规则反证走廊不重叠危险弹。 */
                const corridorClear = pairs.every((ev) => {
                  const band = challengeBand(ev);
                  return challengeDangerColumns(band).every((x) => x <= band.left - 16 || x >= band.right + 16);
                });
                check(corridorClear, ref + ' 拆分后仍保留可达安全走廊、不随机塞弹');
                splitStageCount += 1;
              });
              check(splitStageCount === 0 || splitStageCount === 2, 'C03/C04 拆分状态一致（均已拆或均未拆，实际 ' + splitStageCount + ' 关；未拆等待 design-data 同步）');
              if (splitStageCount === 2) check(relocatingCount >= 2, 'C03/C04 至少各有一段要求玩家第二次换位（实际 ' + relocatingCount + ' 关）');
              /* 设计源未同步时如实标注 fail，不谎称已拆分。 */
              if (splitStageCount === 0) check(false, '设计源未同步 splits：等待 design-data 同步 C03/C04 splits 后再验证第二次换位');
              /* 未拆路径无 splits 时不能凭空生成 split 事件。 */
              const noSplitStage = challengeStageByRef('star-raid-C01');
              if (noSplitStage) {
                resetChallenge(noSplitStage);
                check(chEvents.every((ev) => !ev.fromSplit), 'C01（无 splits）不产生拆分事件，旧时间轴保持不变');
              }
              /* 缺陷 3：C03 目标文案与实际「只看存活」判定一致。 */
              const c03 = challengeStageByRef('star-raid-C03');
              const c03Text = challengeGoalText(c03);
              check(!!c03 && /存活/.test(c03Text) && !/无碰撞/.test(c03Text), 'C03 目标文案与实际判定一致：' + c03Text);
            } catch (err) {
              fail += 1;
              details.push('FAIL regression 异常：' + (err && err.message ? err.message : err));
            } finally {
              if (snapshot && restore(snapshot)) {
                state = 'playing';
                if (snapshotState === 'playing') {
                  loop.resume();
                  autosave.saveNow();
                } else if (snapshotState === 'paused') {
                  pauseByUser();
                } else if (snapshotState === 'clear') {
                  state = 'clear';
                  loop.pause();
                  showClearPanel(pendingClearStage);
                }
              } else {
                autosave.clear();
                mode = 'classic';
                chStage = null;
                chContent = null;
                chEvents = [];
                setChallengeChrome(false);
                reset();
                state = 'ready';
                showStart();
              }
            }
            return { pass, fail, details };
          },
        };
        /* 0.16（ADR §18.10）：职业委托只读钩子只在 ?careerTest=1 追加；生产 URL 与既有 #test 探针不变。 */
        if (/(?:^|[?&])careerTest=1(?:&|$)/.test(String((window.location && window.location.search) || ''))) {
          window.__arcadeTest.careerInfo = function () {
            const goal = careerGoalParts();
            return {
              isCommission: isCareerRun(),
              startPending: careerStartPending,
              ticketId: careerBattle.ticketId,
              commissionId: careerBattle.commissionId,
              startLevel: careerBattle.startLevel,
              themeId: careerBattle.themeId,
              level,
              theme: run.theme ? run.theme.id : null,
              classicLike: classicLike(),
              mode,
              state,
              bossKills: careerBattle.bossKills,
              targetAtLeast: careerBattle.targetAtLeast,
              objective: goal ? [goal.title, goal.summary].filter(Boolean).join(' · ') : null,
              goalLineVisible: !!document.querySelector('[data-career-goal]'),
              missionLines: Array.prototype.slice.call(document.querySelectorAll('.career-mission-line')).map((node) => {
                const rect = node.getBoundingClientRect();
                return { width: Math.round(rect.width), left: Math.round(rect.left), right: Math.round(rect.right) };
              }),
              serializeNull: serialize() === null,
              settled: careerBattle.settled,
              settledResult: careerBattle.settledResult ? { ...careerBattle.settledResult } : null,
              stats: { ...careerBattle.stats },
              statsSource: careerBattle.statsSource,
              shipName: careerBattle.shipName,
              /* 0.17（D17-15）：职业模块运行态只读探针（phase-shield / cargo-magnet）。 */
              shieldCharges: careerBattle.shieldCharges,
              armorPool: Math.round(careerBattle.armorPool * 1000) / 1000,
              waveCompletions: careerBattle.waveCompletions,
              lives,
              maxLives: maxLives(),
              energy: Math.round(run.energy * 10) / 10,
              maxEnergy: run.maxEnergy,
              itemCap: run.itemCap,
              creditsBonus: run.creditsBonus,
              hangarCredits: hangar.credits,
              runSave: A.RunSave ? A.RunSave.get('star-raid') : null,
              metaRaw: (() => {
                try {
                  return window.localStorage.getItem('studiokit:arcade:meta:v1');
                } catch (err) {
                  return null;
                }
              })(),
              careerChrome: document.body.classList.contains('is-career-run'),
              hangarEntryVisible: !!(dom.ovBtn3 && !dom.ovBtn3.hidden),
              challengeEntryVisible: !!(dom.ovBtn2 && !dom.ovBtn2.hidden),
              mowEntryVisible: !!(dom.ovBtn4 && !dom.ovBtn4.hidden),
              hudCreditsHidden: !!dom.hudCredits && getComputedStyle(dom.hudCredits.parentElement || dom.hudCredits).display === 'none',
            };
          };
        }
      }
      /* 开局弹层（0.15 行为逐字保留）：只有这条经典路径会读旧机库与旧 RunSave。 */
      function prepareStartScreen() {
        if (isCareerRun()) {
          /* 职业 run：不读旧机库、不读旧局内档，直接给带戏内护航目标的经典开始弹层。 */
          showStart();
          return;
        }
        hangar = loadHangar();
        const saved = autosave.load();
        if (saved) {
          A.showResumePrompt(ui, saved, {
            name: '星海突击',
            onResume: () => {
              if (restore(saved.data)) {
                if (pendingClearStage > 0) {
                  /* 刷新前正停在 CLEAR 弹层：恢复后继续让玩家选择下一关或收局。 */
                  state = 'clear';
                  loop.pause();
                  syncJoyTools();
                  ui.hide();
                  showClearPanel(pendingClearStage);
                  pauseUi.sync();
                  autosave.saveNow();
                  return;
                }
                state = 'playing';
                syncJoyTools();
                ui.hide();
                loop.resume();
                pauseUi.sync();
                autosave.saveNow();
              } else {
                autosave.clear();
                showStart();
              }
            },
            onRestart: () => {
              autosave.clear();
              showStart();
            },
          });
        } else {
          showStart();
        }
      }

      /* 0.16 职业入口：URL 带 ?career=<ticketId> 时先等桥确认 ticket，再决定「职业开局弹层」
         还是经典开局；无参数时同步走 0.15 路径（零延迟、零行为变化）。 */
      function bootStartScreen() {
        const ticketId = careerTicketParam();
        const ready = career && career.ready;
        if (!ticketId || !career || !ready || typeof ready.then !== 'function') {
          prepareStartScreen();
          return;
        }
        careerStartPending = true;
        let settled = false;
        let guard = null;
        const finish = () => {
          if (settled) return;
          settled = true;
          careerStartPending = false;
          try {
            if (guard) clearTimeout(guard);
          } catch (err) {
            /* ignore */
          }
          /* 只有桥确认了属于本游戏的 run 才锁定职业 run；否则按 0.15 经典启动（fail-open）。 */
          const runInfo = readCareerRun();
          if (runInfo) activateCareerRun(runInfo);
          else { try { window.__arcadeMode = 'classic'; } catch (err) { /* ignore */ } }
          prepareStartScreen();
        };
        try {
          guard = setTimeout(finish, 10000);
        } catch (err) {
          guard = null;
        }
        Promise.resolve(ready).then(finish, finish);
        /* 极端慢启动兜底：若 3.5s 计时器已按经典开局、桥随后才确认职业 run，
           立刻切回职业开局（清掉这段时间可能写下的经典局内档，不产生任何经典经济）。 */
        try {
          setTimeout(() => {
            if (isCareerRun()) return;
            const late = readCareerRun();
            if (!late) return;
            try {
              /* 保留经典局内档：职业 run 只用自己的内存/IDB，不删除玩家经典存档。 */
            } catch (err) {
              /* ignore */
            }
            activateCareerRun(late);
            showStart();
          }, 1500);
        } catch (err) {
          /* ignore */
        }
      }
      bootStartScreen();
      loop.start();
    })();
  </script>
</body>
</html>
