<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 0.11.5：禁止移动端双击误触放大（游戏误操作防护）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="星海突击：纵版弹幕射击。机库永久改装、火力成长、能量与临时编队、核弹级大杀器，六星区关卡主题轮转，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../career/bridge.js"></script>
  <script src="../challenge/star-raid.js"></script>
  <style>
    /* 0.9 挑战模式：选关容器放进 .stage-box 后需要页面本地定位；面板本体来自 A.Challenge.stageListHtml。 */
    .stage-box > .challenge-select[data-ch-panel] {
      position: absolute;
      inset: 6px;
      z-index: 5;
      max-height: calc(100% - 12px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stage-box > .challenge-select[data-ch-panel][hidden] { display: none; }
    .stage-box > .challenge-select[data-ch-panel] .ac-challenge-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .stage-box > .challenge-select[data-ch-panel] .ac-challenge-head {
      flex-wrap: wrap;
      row-gap: 2px;
    }
    @media (max-width: 340px) {
      .stage-box > .challenge-select[data-ch-panel] .ac-challenge-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .stage-box > .challenge-select[data-ch-panel] [data-ch-back] {
      display: block;
      width: 100%;
      min-height: 44px;
      margin: 8px 0 0;
    }
    .ac-challenge-hud[data-ch-hud] {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 3;
      width: auto;
      max-width: none;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
    }
    .ac-challenge-tip[data-ch-tip] {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 10px;
      z-index: 3;
      margin: 0;
      font-size: 11px;
      pointer-events: none;
    }
    .ac-challenge-tip[data-ch-tip][hidden] { display: none; }
    body.has-challenge .game-hud { display: none; }
    body.has-challenge .touch-pad.game-tools.star-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* 0.14.0 星海割草：不记分、不给星币，顶栏只保留关卡/火力/弹种；提示行改为演武说明。 */
    body.is-mow .mow-hide { display: none !important; }
    body.is-mow .game-hint { color: #ffd23f; }
    /* ---------- 0.13.0 星域远征：机库 / 编队 / 大杀器 / 整备卡 ---------- */
    .stage-box > .hangar-panel {
      position: absolute;
      inset: 6px;
      z-index: 6;
      max-height: calc(100% - 12px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: block;
      text-align: left;
      padding: 10px 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--ac-line);
      background: rgba(8, 12, 26, 0.96);
      color: var(--ac-ink);
      font-size: 13px;
    }
    .stage-box > .hangar-panel[hidden] { display: none !important; }
    .hangar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .hangar-head strong { font-size: 15px; color: #ffd23f; }
    .hangar-credit { font-size: 12px; color: var(--ac-muted); }
    .hangar-credit b { color: #ffd23f; font-size: 14px; }
    .hangar-list { display: grid; gap: 6px; }
    .hangar-row {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      padding: 6px 7px;
      border-radius: 10px;
      border: 1px solid rgba(143, 163, 217, 0.18);
      background: rgba(79, 124, 255, 0.06);
    }
    .hangar-row.is-max { border-color: rgba(255, 210, 63, 0.35); }
    .hangar-icon { font-size: 16px; text-align: center; }
    .hangar-body { min-width: 0; }
    .hangar-name { font-size: 13px; font-weight: 700; }
    .hangar-name em { font-style: normal; color: #7cf5b2; font-size: 11px; margin-left: 4px; }
    .hangar-desc { font-size: 11px; color: var(--ac-muted); line-height: 1.35; }
    .hangar-buy {
      min-width: 76px;
      min-height: 44px;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 210, 63, 0.45);
      background: rgba(255, 210, 63, 0.12);
      color: #ffe9a8;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hangar-buy:disabled { opacity: 0.45; cursor: default; }
    .hangar-back {
      display: block;
      width: 100%;
      min-height: 44px;
      margin: 10px 0 0;
      border-radius: 10px;
      border: 1px solid var(--ac-line);
      background: transparent;
      color: var(--ac-ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .refit-title { margin: 0 0 6px; font-size: 12px; color: #ffd23f; font-weight: 700; }
    .refit-grid { display: grid; gap: 6px; margin: 0 0 10px; }
    .ac-refit-card {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 46px;
      padding: 5px 8px;
      border-radius: 10px;
      border: 1px solid rgba(124, 232, 224, 0.4);
      background: rgba(124, 232, 224, 0.08);
      color: var(--ac-ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }
    .ac-refit-card:hover { border-color: #7ce8e0; }
    .ac-refit-card:disabled { opacity: 0.5; cursor: default; border-color: var(--ac-line); }
    .ac-refit-icon { font-size: 16px; text-align: center; }
    .ac-refit-name { display: block; font-size: 12px; font-weight: 700; }
    .ac-refit-desc { display: block; font-size: 11px; color: var(--ac-muted); }
    .refit-done { font-size: 11px; color: #7cf5b2; margin: 0 0 8px; }
    .refit-summary { font-size: 12px; line-height: 1.5; color: var(--ac-muted); margin: 0 0 8px; }
    .refit-summary b { color: #ffd23f; }
    .refit-hint { display: block; font-size: 11px; color: var(--ac-muted); margin: 0 0 8px; }
    .ac-credits { color: #ffd23f; font-weight: 700; }
    .touch-pad.game-tools.star-tools { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .touch-pad.game-tools.star-tools .touch-btn { font-size: 13px; }
    .touch-pad.game-tools.star-tools .touch-btn .item-name { display: block; font-size: 9px; line-height: 1.1; }
    .touch-pad.game-tools.star-tools .touch-btn .item-icon { display: block; font-size: 14px; line-height: 1.1; }
    .touch-pad.game-tools.star-tools .touch-btn .item-cost { display: block; font-style: normal; font-size: 9px; line-height: 1; color: #ffd23f; }
    [data-joy-tool][hidden], [data-item-slot][hidden], [data-squad-tool][hidden] { display: none !important; }
    @media (max-width: 340px) {
      .hangar-buy { min-width: 64px; font-size: 11px; }
      .hangar-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
      .touch-pad.game-tools.star-tools .touch-btn { font-size: 12px; padding-left: 2px; padding-right: 2px; }
    }
    /* ---------- 0.16 职业委托：戏内护航目标行 / 职业 run 内隐藏旧机库入口 ----------
       只在 ?career=<ticketId> 且桥确认职业 run 后由 body.is-career-run 生效；
       无 ticket 的经典/挑战/割草页面不会出现这些样式命中，布局与 0.15 逐像素一致。 */
    .career-mission-line {
      display: block;
      max-width: 100%;
      margin: 0 0 8px;
      padding: 5px 9px;
      border: 1px solid rgba(124, 232, 224, 0.45);
      border-radius: 10px;
      background: rgba(124, 232, 224, 0.1);
      color: #cfeaf5;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .career-mission-line b { color: #7ce8e0; }
    body.is-career-run .career-hide { display: none !important; }
    body.is-career-run .hangar-panel { display: none !important; }
  </style>
  <title>星海突击 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#4f7cff; --card-accent:#4f7cff">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🚀 星海突击</h1>
      <div class="game-hud">
        <span class="mow-hide">分数 <strong data-hud-score>0</strong></span>
        <span>关卡 <strong data-hud-stage>1</strong></span>
        <span>火力 <strong data-hud-power>LV1</strong></span>
        <span class="mow-hide career-hide">星币 <strong data-hud-credits>0</strong></span>
        <span class="mow-hide career-hide">最高 <strong data-hud-high>0</strong></span>
        <span data-hud-buff hidden>弹种 <strong data-hud-weapon>普通</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="星海突击游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>星海突击</h2>
            <p data-ov-text>纵版弹幕射击</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn3 hidden>机库改装</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn4 hidden>星海割草</button>
          </div>
        </div>
        <span class="ac-challenge-hud" data-ch-hud hidden></span>
        <p class="ac-challenge-tip" data-ch-tip hidden></p>
        <div class="challenge-select" data-ch-panel hidden role="region" aria-label="挑战 6 关"></div>
        <div class="hangar-panel" data-hangar-panel hidden role="region" aria-label="机库改装"></div>
      </div>
    </div>
    <div class="touch-pad game-tools star-tools" data-game-tools aria-label="主动道具与大杀器（快捷键 1–6）">
      <button type="button" class="touch-btn" data-joy-tool="pulse" aria-label="电磁脉冲，剩余 1 次（快捷键 1）" title="电磁脉冲（1）：清空敌弹并击坠普通敌机，Boss 扣 100 HP">
        <span aria-hidden="true">💥</span><span>脉冲</span><span data-joy-count aria-hidden="true">1</span>
      </button>
      <button type="button" class="touch-btn" data-joy-tool="shield" aria-pressed="false" aria-label="星盾 5 秒，剩余 1 次（快捷键 2）" title="星盾（2）：5 秒内不扣生命">
        <span aria-hidden="true">🛡</span><span>星盾</span><span data-joy-count aria-hidden="true">1</span>
      </button>
      <button type="button" class="touch-btn" data-squad-tool="formation" aria-label="僚机编队，剩余 1 次（快捷键 3）" title="僚机编队（3）：消耗 1 次充能召唤两架僚机，持续 8 秒，期间持续消耗能量">
        <span aria-hidden="true">✈</span><span>编队</span><span data-joy-count aria-hidden="true">1</span>
      </button>
      <button type="button" class="touch-btn item-slot" data-item-slot="0" hidden></button>
      <button type="button" class="touch-btn item-slot" data-item-slot="1" hidden></button>
      <button type="button" class="touch-btn item-slot" data-item-slot="2" hidden></button>
      <button type="button" class="touch-btn item-slot" data-item-slot="3" hidden></button>
    </div>
    <p class="game-hint" data-game-hint>拖动 / WASD 移动 · 自动开火 · 1 脉冲 2 星盾 3 编队 · 4–7 大杀器 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const career = window.ArcadeCareer || null;
      const { clamp, rand, randInt, pick, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        ovBtn3: document.querySelector('[data-ov-btn3]'),
        ovBtn4: document.querySelector('[data-ov-btn4]'),
        gameHint: document.querySelector('[data-game-hint]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudStage: document.querySelector('[data-hud-stage]'),
        hudPower: document.querySelector('[data-hud-power]'),
        hudCredits: document.querySelector('[data-hud-credits]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        hudBuff: document.querySelector('[data-hud-buff]'),
        hudWeapon: document.querySelector('[data-hud-weapon]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        joyPulse: document.querySelector('[data-joy-tool="pulse"]'),
        joyShield: document.querySelector('[data-joy-tool="shield"]'),
        joyFormation: document.querySelector('[data-squad-tool="formation"]'),
        itemButtons: Array.prototype.slice.call(document.querySelectorAll('[data-item-slot]')),
        gameTools: document.querySelector('[data-game-tools]'),
        chPanel: document.querySelector('[data-ch-panel]'),
        chHud: document.querySelector('[data-ch-hud]'),
        chTip: document.querySelector('[data-ch-tip]'),
        hangarPanel: document.querySelector('[data-hangar-panel]'),
      };
      const ui = A.createOverlayUi(dom);

      const stars = A.createStarfield(W, H);
      /* 0.13.0：第二层慢速视差星空，远景更亮更稀，配合关卡主题染色。 */
      const starsFar = A.createStarfield(W, H, { layers: 2, count: 26, colors: ['#6f86c8', '#a8b8e8'] });
      const particles = A.createParticles();

      const PLAYER_MIN_Y = 46;
      const PLAYER_MAX_Y = H - 26;
      const STAGE_WAVE_SECONDS = 30;
      const BOSS_NAMES = ['赤焰旗舰', '雷霆母舰', '虚空堡垒'];
      /* 0.13.0：Boss 血量按「白板 DPS × 可接受战斗时长」重标。
       * 白板双发 ≈15.4 DPS，480 HP ≈ 31s 白板战；吃 1–2 个弹种后约 18–22s；
       * 之后每关 +280，配合火力等级/大杀器成长保持压力。 */
      const BOSS_BASE_HP = 480;
      const BOSS_HP_STEP = 280;
      /* 0.14.0 星海割草（模拟割草）：无积分/无星币的常驻火力演武。
       * 设计目标：弹药 Buff 全常驻、大杀器库满载且无限次、主动道具无限次；
       * 敌潮与掉落更密、Boss 招式更炫；玩家唯一需要管理的资源是能量。
       * 数值集中在这里，方便后续按真机手感调参；挑战 6 关完全不走这些分支。 */
      const MOW = {
        name: '星海割草',
        short: '割草',
        stageSeconds: 45,
        drainMul: 2.6,
        killEnergy: 0.12,
        energyCoreAmount: 7,
        energyDropChance: 0.12,
        energyPity: 8,
        powerCoreEnergy: 12,
        itemEnergy: 12,
        buffEnergy: 6,
        hitEnergyRatio: 0.22,
        bossEnergy: 30,
        clearEnergy: 24,
        pulseCost: 14,
        shieldCost: 12,
        formationCost: 16,
        itemCost: { nuke: 30, lance: 24, freeze: 18 },
        enemyHpMul: 3.2,
        enemyCap: 32,
        bossEscortCap: 20,
        spawnDoubleChance: 0.85,
        bossShotCap: 100,
        bossHpMul: 2.6,
        itemSlots: 3,
        pickupCap: 90,
      };
      /* 同一弹种再次拾取改为叠加剩余时长；设 180s 护栏防止坏档/HUD 无限膨胀。 */
      const BUFF_STACK_CAP = 180;
      const player = { x: W / 2, y: H - 90, w: 34, h: 30, cool: 0, invul: 0, tilt: 0, prevX: W / 2 };
      let bullets = [];
      let enemies = [];
      let shots = [];
      let pickups = [];
      let floaters = [];
      let score = 0;
      let lives = 3;
      let mowKills = 0;
      let spawnTimer = 0;
      let shake = 0;
      let state = 'ready';
      let recordSaved = false;
      let dragOffset = null;
      let nextUid = 1;
      let pickupPity = 0;
      let itemPity = 0;
      let energyPity = 0;
      const BUFF_TYPES = ['spread', 'laser', 'homing', 'rapid'];
      const buffs = { spread: 0, laser: 0, homing: 0, rapid: 0 };
      let lastBuff = 'normal';
      let level = 1;
      let stageTime = 0;
      /* 保存“CLEAR 弹层还在等待选择”的关卡；刷新后重新给出下一关/收局选择。 */
      let pendingClearStage = 0;
      let boss = null;
      let stageBanner = 0;
      let stageBannerText = '';
      let elapsed = 0;
      const JOY_TOOL_CAPS = { pulse: 2, shield: 2 };
      const SHIELD_SECONDS = 5;
      const tools = { pulse: 1, shield: 1 };
      let shieldTimer = 0;
      let joyLastResult = null;
      let high = A.Progress.get('star-raid').high;
      dom.hudHigh.textContent = String(high);

      /* ----------------------------------------------------------
       * 0.9 挑战模式（C01–C06）
       * - 数据来自 ../challenge/star-raid.js（window.ArcadeChallengeData）经 A.Challenge 读取。
       * - 挑战用设计源固定波次时间轴替换经典随机刷怪；每个攻击段保证 safeBandXRatio 内为无弹走廊。
       * - 与经典完全隔离：不写 progress 最高分 / Playtime 轮次；数据缺失时入口 fail closed。
       * ---------------------------------------------------------- */
      const CHALLENGE_GAME_ID = 'star-raid';
      const CHALLENGE_COLUMN_STEP = 36;
      let mode = 'classic'; /* classic | challenge | mow | panel | hangar */
      let chStage = null;
      let chContent = null;
      let chTime = 0;
      let chHealth = 3;
      let chAssisted = false;
      let chCollectibles = [];
      let chEvents = [];
      let chDamageLog = [];
      let chPowerupLog = [];
      let chBossDefeated = false;
      let chBossMaxPhase = 0;
      let chBossExposedWindows = 0;
      let chBossExposedSeconds = 0;
      let chFiredVolleys = 0;
      let chBossHits = 0;
      let chTipTimer = 0;
      let chHudTick = 0;
      let chPowerupSpawned = [];

      /* ==============================================================
       * 0.13.0 星域远征
       * 机库永久改装（跨局） · 局内火力等级 · 能量/枯竭 · 临时编队 ·
       * 大杀器 · 6 星区主题 · CLEAR 整备 · 打击反馈。
       * 挑战模式（C01–C06）完全隔离：能量/编队/道具/主题/整备只在经典模式生效。
       * ============================================================== */
      const HANGAR_UPGRADES = [
        { id: 'hull', name: '装甲强化', icon: '🛡', max: 3, costs: [120, 240, 400], desc: '初始生命 +1，上限生命 +1' },
        { id: 'power', name: '火力校准', icon: '🔥', max: 5, costs: [80, 160, 260, 380, 540], desc: '全部子弹伤害 +6%' },
        { id: 'engine', name: '机动强化', icon: '🚀', max: 5, costs: [60, 130, 220, 340, 480], desc: '受击无敌 +0.12s/级，拾取吸附 +6%/级（触屏通用）' },
        { id: 'energy', name: '反应堆', icon: '🔋', max: 5, costs: [90, 180, 300, 440, 600], desc: '能量上限 +10' },
        { id: 'bay', name: '弹仓扩容', icon: '📦', max: 1, costs: [220], desc: '大杀器槽位 +1（2 → 3）' },

        beam.t -= dt;
        beam.x = player.x;
        beam.tick -= dt;
        if (beam.tick <= 0) {
          beam.tick = 0.2;
          const halfW = 14;
          const targets = enemies.slice();
          for (let i = 0; i < targets.length; i += 1) {
            if (state !== 'playing') break;
            const enemy = targets[i];
            const cx = enemy.x + enemy.w / 2;
            if (Math.abs(cx - beam.x) > halfW + enemy.w / 2) continue;
            const index = enemies.indexOf(enemy);
            if (index < 0) continue;
            if (enemy.kind === 'boss') {
              enemy.hp -= 55;
              addBossFloater(enemy, 55);
              if (enemy.hp <= 0) killEnemy(enemy, index);
            } else {
              enemy.hp -= 40;
              if (enemy.hp <= 0) killEnemy(enemy, index);
              else enemy.flash = 0.12;
            }
          }
          particles.emit(beam.x, H - 40, {
            count: A.reducedMotion ? 2 : 5,
            speed: [20, 80],
            life: [0.1, 0.3],
            size: [1.5, 3],
            colors: ['#7ce8e0', '#ffffff'],
            angle: [Math.PI * 0.85, Math.PI * 1.15],

      function pad2(value) {

      /* 0.9.0 修复（缺陷 3）：数据源 content 未声明「无伤 / 零碰撞」判定字段时不能凭空加判定，

       * 若未来 content.win 明确声明 noDamage / hitless / noCollision 等字段，这里保留原目标文案，
       * 判定逻辑仍需数据源与测试同步扩展（不改数据文件）。 */
      function challengeNoDamageRule(stage) {
        const content = stage && stage.content && typeof stage.content === 'object' ? stage.content : chContent;
        const win = content && content.win && typeof content.win === 'object' ? content.win : null;

      function challengeSpawnWaveEnemies(ev) {

      function challengeSalvoColumns(ev) {
        const band = challengeBand(ev);

        const spawnX = clamp(ev.spawnXRatio * W, 18, W - 18);
        const nearest = (x) => cols.reduce((best, col) => (Math.abs(col - x) < Math.abs(best - x) ? col : best), cols[0]);

          dom.joyFormation.querySelector('[data-joy-count]').textContent = mow ? '∞' : String(run.formationCharges);
          dom.joyFormation.disabled = inChallenge || state !== 'playing' || (!mow && run.formationCharges <= 0) || run.formationTimer > 0;
          dom.joyFormation.setAttribute('aria-pressed', String(run.formationTimer > 0));
          dom.joyFormation.setAttribute('aria-label', run.formationTimer > 0
            ? '僚机编队生效中，剩余 ' + run.formationTimer.toFixed(1) + ' 秒'
            : mow
              ? '僚机编队，无限次（快捷键 3），消耗 ' + MOW.formationCost + ' 能量'
              : '僚机编队，剩余 ' + run.formationCharges + ' 次（快捷键 3）');
        }
        syncItemButtons();
      }

      function activateJoyTool(id) {
        if (state !== 'playing') return false;
        if (id === 'pulse') {
          if (!isMow() && (tools.pulse <= 0 || (!shots.length && !enemies.length))) return false;
          if (isMow() && !shots.length && !enemies.length) return false;
          if (isMow()) {
            if (!spendEnergy(MOW.pulseCost, '电磁脉冲')) return false;
          } else {
            tools.pulse -= 1;
          }
          if (mode === 'challenge') chAssisted = true;
          shots = [];
          enemies.slice().forEach((e) => {
            const index = enemies.indexOf(e);
            if (index < 0) return;
            if (e.kind === 'boss') {
              e.hp = Math.max(0, e.hp - 100);
              if (e.hp <= 0) killEnemy(e, index);
            } else {
              killEnemy(e, index);
            }
          });
          addFloater(player.x, player.y - 42, '电磁脉冲！', '#7ce8e0');
          particles.emit(player.x, player.y, {
            count: A.reducedMotion ? 8 : 24,
            speed: [80, 280], life: [0.25, 0.65], size: [2, 5],
            colors: ['#7ce8e0', '#ffffff', '#4f7cff'],
          });
          shake = A.reducedMotion ? 0 : 6;
          A.Sfx.play('explode');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        if (id === 'shield') {
          if ((!isMow() && tools.shield <= 0) || shieldTimer > 0) return false;
          if (isMow()) {
            if (!spendEnergy(MOW.shieldCost, '星盾')) return false;
          } else {
            tools.shield -= 1;
          }
          if (mode === 'challenge') chAssisted = true;
          shieldTimer = SHIELD_SECONDS;
          addFloater(player.x, player.y - 38, '星盾 5 秒', '#7ce8e0');
          addRing(player.x, player.y, '#7ce8e0', 74, 0.4, 3);
          A.Sfx.play('spring');
          syncJoyTools();
          autosave.saveNow();
          return true;
        }
        if (id === 'formation') {
          return startFormation();
        }
        return false;
      }

      function clickJoyTool(id) {
        const button = document.querySelector('[data-joy-tool="' + id + '"]') || document.querySelector('[data-squad-tool="' + id + '"]');
        if (!button) return false;
        joyLastResult = null;
        button.click();
        return joyLastResult === true;
      }

      function bindJoyTools() {
        document.querySelectorAll('[data-joy-tool]').forEach((button) => {
          button.addEventListener('click', () => {
            joyLastResult = activateJoyTool(button.dataset.joyTool);
          });
        });
        /* 编队是 0.13.0 新加的特殊装备按钮：独立 data 属性，不改变既有「每款游戏 2 个主动道具」契约。 */
        document.querySelectorAll('[data-squad-tool]').forEach((button) => {
          button.addEventListener('click', () => {
            joyLastResult = activateJoyTool(button.dataset.squadTool);
          });
        });
        if (dom.itemButtons) {
          dom.itemButtons.forEach((button) => {
            button.addEventListener('click', () => {
              useItem(button.getAttribute('data-item-slot'));
            });
          });
        }
        if (dom.hangarPanel) {
          dom.hangarPanel.addEventListener('click', (event) => {
            const target = event.target instanceof Element ? event.target : null;
            if (!target) return;
            if (target.closest('[data-hangar-back]')) {
              closeHangar();
              return;
            }
            const buy = target.closest('[data-buy]');
            if (buy && !buy.disabled) buyHangarUpgrade(buy.getAttribute('data-buy'));
          });
        }
        window.addEventListener('keydown', (e) => {
          if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
          const target = e.target;
          if (target && target.tagName) {
            const tag = target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
          }
          const id = { '1': 'pulse', '2': 'shield', '3': 'formation' }[e.key];
          if (id) {
            e.preventDefault();
            clickJoyTool(id);
            return;
          }
          const slot = { '4': 0, '5': 1, '6': 2, '7': 3 }[e.key];
          if (slot == null) return;
          e.preventDefault();
          useItem(slot);
        });
      }

      function activeBuffs() {
        return BUFF_TYPES.filter((type) => buffs[type] > 0);
      }
      function buffColor() {
        if (lastBuff !== 'normal' && buffs[lastBuff] > 0) return WEAPONS[lastBuff].color;
        const active = activeBuffs();
        return active.length ? WEAPONS[active[active.length - 1]].color : WEAPONS.normal.color;
      }
      function buffHudText() {
        return activeBuffs()
          .map((type) => WEAPONS[type].short + buffTimeLabel(type))
          .join(' ');
      }

      /* ---------- 敌机类型 ---------- */
      const KINDS = {
        drone: { w: 30, h: 24, hp: 1, score: 10, color: '#c06bff', speed: [95, 150] },
        sine: { w: 32, h: 26, hp: 2, score: 25, color: '#35e0d0', speed: [65, 85] },
        diver: { w: 28, h: 30, hp: 2, score: 20, color: '#ffa53d', speed: [130, 170] },
        tank: { w: 54, h: 44, hp: 6, score: 80, color: '#ff5d7a', speed: [38, 50] },
        /* 0.13.0 陨石带主题：不射击的障碍物，撞机掉命、会被子弹打碎。 */
        rock: { w: 34, h: 34, hp: 4, score: 15, color: '#9c8a74', speed: [55, 95] },
      };

      function bossSpec(lv) {
        const cycle = Math.max(0, lv - 1);
        const theme = themeForLevel(lv);
        return {
          name: BOSS_NAMES[cycle % BOSS_NAMES.length] + ' MK.' + lv,
          w: 118,
          h: 86,
          hp: Math.round((BOSS_BASE_HP + cycle * BOSS_HP_STEP) * theme.bossHp * (isMow() ? MOW.bossHpMul : 1)),
          score: 500 * lv,
        };
      }

      /* ---------- 波次：让难度以可读的阶段递进，而不是只看分数 ---------- */
      const WAVES = [
        { name: '巡逻', at: 0, spawn: 1.2, speed: 1.0, kinds: ['drone'], fire: false, maxEnemies: 7, maxShots: 0 },
        { name: '俯冲', at: 20, spawn: 1.05, speed: 1.08, kinds: ['drone', 'diver'], fire: false, maxEnemies: 8, maxShots: 0 },
        { name: '弹幕', at: 45, spawn: 0.94, speed: 1.15, kinds: ['drone', 'diver', 'sine'], fire: true, maxEnemies: 9, maxShots: 12 },
        { name: '精英', at: 75, spawn: 0.84, speed: 1.22, kinds: ['drone', 'diver', 'sine', 'tank'], fire: true, maxEnemies: 10, maxShots: 18 },
        { name: '休整', at: 95, spawn: 1.7, speed: 0.92, kinds: ['drone'], fire: false, maxEnemies: 5, maxShots: 0, rest: true },
      ];
      const WAVE_CYCLE = 103;

      function waveInfo() {
        if (isMow()) {
          /* 割草模式没有休整段：持续星潮，波次只用于 HUD 与强度递增。 */
          const cycle = Math.floor(elapsed / 45);
          return {
            cycle,
            phase: {
              name: '星潮',
              spawn: 0.26,
              speed: 1.06,
              kinds: ['drone', 'diver', 'sine', 'tank'],
              fire: true,
              maxEnemies: MOW.enemyCap,
              maxShots: 90,
            },
            label: '潮 ' + (cycle + 1),
            scale: 1 + cycle * 0.1,
            maxEnemies: Math.min(36, MOW.enemyCap + cycle * 2),
            maxShots: Math.min(120, 90 + cycle * 5),
          };
        }
        const cycle = Math.floor(elapsed / WAVE_CYCLE);
        const t = elapsed % WAVE_CYCLE;
        let phase = WAVES[0];
        for (let i = 0; i < WAVES.length; i++) {
          if (t >= WAVES[i].at) phase = WAVES[i];
        }
        return {
          cycle,
          phase,
          label: 'W' + (cycle + 1) + ' ' + phase.name,
          scale: 1 + cycle * 0.12,
          maxEnemies: Math.min(14, phase.maxEnemies + cycle * 2),
          maxShots: Math.min(26, phase.maxShots + cycle * 2),
        };
      }

      function spawnEnemy() {
        const wave = waveInfo();
        const theme = run.theme || themeForLevel(level);
        const defs = wave.phase.kinds.map((k) => KINDS[k]);
        /* 舰队封锁：重装敌机权重加倍（只影响本主题）。 */
        if (theme.tankBias > 0) defs.push(KINDS.tank, KINDS.tank);
        if (isMow()) defs.push(KINDS.tank, KINDS.sine);
        const def = pick(defs);
        const kind = Object.keys(KINDS).find((k) => KINDS[k] === def) || 'drone';
        const e = {
          uid: nextUid++,
          kind,
          x: rand(30, W - 30 - def.w),
          y: -def.h - 6,
          w: def.w,
          h: def.h,
          hp: Math.max(1, Math.round((def.hp + (kind === 'tank' ? Math.min(4, wave.cycle * 2) : 0) + (level - 1)) * theme.enemyHp * (isMow() ? MOW.enemyHpMul : 1))),
          score: def.score,
          color: def.color,
          vy: rand(def.speed[0], def.speed[1]) * wave.phase.speed * (1 + wave.cycle * 0.06 + (level - 1) * (isMow() ? 0.045 : 0.06)),
          t: rand(0, 10),
          fireTimer: wave.phase.fire ? rand(isMow() ? 0.45 : 0.8, isMow() ? 1.2 : 2.2) : 999,
          baseX: 0,
          vx: 0,
          flash: 0,
        };
        e.baseX = e.x;
        if (kind === 'diver') {
          const dx = player.x - (e.x + e.w / 2);
          e.vx = clamp(dx / 1.6, -110, 110);
        }
        enemies.push(e);
      }

      function enemyShot(e, speed) {
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h;
        const dx = player.x - cx;
        const dy = player.y - cy;
        const theme = run.theme || themeForLevel(level);
        const jitter = theme.aimJitter || 0;
        const angle = Math.atan2(dy, dx) + (jitter ? rand(-jitter, jitter) : 0);
        shots.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 4 });
      }

      /* ---------- 关卡 Boss ---------- */
      function spawnBoss() {
        if (boss) return;
        const spec = bossSpec(level);
        /* 割草模式保留场上敌潮，Boss 与杂兵同时存在；普通模式仍清场。 */
        if (!isMow()) enemies = [];
        boss = {
          uid: nextUid++,
          kind: 'boss',
          name: spec.name,
          x: (W - spec.w) / 2,
          y: -spec.h,
          w: spec.w,
          h: spec.h,
          hp: spec.hp,
          maxHp: spec.hp,
          score: spec.score,
          color: '#ff5d7a',
          vy: isMow() ? 70 : 55,
          t: 0,
          fireTimer: 1.4,
          baseX: (W - spec.w) / 2,
          vx: 0,
          phase: 1,
          mowPatternIndex: 0,
          mowPattern: '扇形齐射',
          mowPatternsFired: [],
        };
        enemies.push(boss);
        shots = [];
        spawnTimer = isMow() ? 0.8 : 999;
        stageTime = isMow() ? 0 : STAGE_WAVE_SECONDS;
        stageBannerText = isMow() ? 'BOSS 来袭 · ' + spec.name : 'WARNING · ' + (run.theme ? run.theme.name + ' · ' : '') + spec.name;
        stageBanner = 2.0;
        shake = A.reducedMotion ? 0 : (isMow() ? 9 : 5);
        if (isMow()) {
          addRing(W / 2, 150, '#ffd23f', 320, 0.7, 6);
          addFloater(player.x, player.y - 56, '敌潮未停 · Boss 加入战场！', '#ff9a9d');
        }
        A.Sfx.play('explode');
        syncHud();
      }

      function updateBoss(b, dt) {
        b.t += dt;
        if (isMow()) {
          /* 割草 Boss：更大范围横向巡航 + 更高的悬浮，招式期间更醒目。 */
          if (b.y < 108) b.y += b.vy * dt;
          else b.y = 108 + Math.sin(b.t * 1.8) * 14;
          b.x = clamp(b.baseX + (b.t < 1.2 ? 0 : Math.sin(b.t * 1.05) * 120), 18, W - b.w - 18);
        } else {
          if (b.y < 112) b.y += b.vy * dt;
          else b.y = 112 + Math.sin(b.t * 1.4) * 9;
          b.x = clamp(b.baseX + (b.t < 1.4 ? 0 : Math.sin(b.t * 0.75) * 90), 22, W - b.w - 22);
        }

        const ratio = b.hp / b.maxHp;
        if (ratio <= 0.6 && b.phase < 2) {
          b.phase = 2;
          stageBannerText = isMow() ? 'BOSS 狂暴 · 弹幕升级' : 'BOSS 狂暴';
          stageBanner = 1.2;
          shake = A.reducedMotion ? 0 : (isMow() ? 9 : 6);
          if (isMow()) {
            flash = Math.max(flash, 0.28);
            flashColor = '#ff9a3d';
            addRing(b.x + b.w / 2, b.y + b.h / 2, '#ff9a3d', 220, 0.5, 4);
          }
          A.Sfx.play('explode');
        }
        if (ratio <= 0.3 && b.phase < 3) {
          b.phase = 3;
          stageBannerText = isMow() ? 'BOSS 濒危 · 全弹发射' : 'BOSS 濒危 · 火力全开';
          stageBanner = 1.2;
          shake = A.reducedMotion ? 0 : (isMow() ? 12 : 8);
          if (isMow()) {
            flash = Math.max(flash, 0.35);
            flashColor = '#ff5d7a';
            addRing(b.x + b.w / 2, b.y + b.h / 2, '#ff5d7a', 280, 0.6, 5);
          }
          A.Sfx.play('explode');
        }

        b.fireTimer -= dt;
        if (b.fireTimer <= 0 && b.y >= (isMow() ? 96 : 104)) {
          bossFire(b);
          const themeInterval = run.theme ? run.theme.bossInterval : 1;
          b.fireTimer = (isMow()
            ? (ratio < 0.3 ? 0.46 : ratio < 0.6 ? 0.66 : 0.9)
            : (ratio < 0.3 ? 0.72 : ratio < 0.6 ? 0.95 : 1.25)) * themeInterval;
        }
      }

      function bossFire(b) {
        if (isMow()) return bossMowFire(b);
        const ratio = b.hp / b.maxHp;
        const spd = (160 + level * 12) * (run.theme ? run.theme.shotSpeed : 1);
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h * 0.72;
        const base = Math.atan2(player.y - cy, player.x - cx);
        const fan = ratio < 0.3 ? 7 : 5;
        for (let i = -(fan - 1) / 2; i <= (fan - 1) / 2; i++) {
          if (shots.length >= 60) break;
          const angle = base + i * 0.17;
          shots.push({ x: cx, y: cy, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, r: 4 });
        }
        if (ratio < 0.6) {
          const count = ratio < 0.3 ? 14 : 10;
          for (let i = 0; i < count; i++) {
            if (shots.length >= 60) break;
            const angle = (i / count) * TAU + b.t * 0.6;
            shots.push({ x: cx, y: cy, vx: Math.cos(angle) * spd * 0.8, vy: Math.sin(angle) * spd * 0.8, r: 4 });
          }
        }
        A.Sfx.play('shoot');
      }

      /* 割草 Boss 专属四套弹幕：扇形齐射 / 螺旋星雨 / 交叉扫射 / 环爆三连。
       * 只改 Boss 主动弹，不触碰挑战模式的固定弹幕契约。 */
      function bossMowFire(b) {
        const theme = run.theme || THEMES[0];
        const spd = (175 + level * 12) * (theme.shotSpeed || 1) * (1 + (b.phase - 1) * 0.08);
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h * 0.7;
        const base = Math.atan2(player.y - cy, player.x - cx);
        const pattern = b.mowPatternIndex % 4;
        const colors = ['#ff86c8', '#7ce8e0', '#ffd23f', '#ff9a3d'];
        const color = colors[pattern];
        const add = (x, y, angle, speed, radius, bulletColor) => {
          if (shots.length >= MOW.bossShotCap) return;
          shots.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: radius || 4,
            mowColor: bulletColor || color,
          });
        };
        b.mowPatternIndex += 1;
        if (pattern === 0) {
          const fan = 7 + b.phase * 2;
          for (let i = -(fan - 1) / 2; i <= (fan - 1) / 2; i += 1) {
            add(cx, cy, base + i * 0.15, spd, 4.4);
          }
          for (const side of [-1, 1]) {
            for (let k = 0; k < 3; k += 1) {
              add(cx + side * 46, cy - 8, Math.PI / 2 + side * (0.55 + k * 0.12), spd * 0.9, 3.6, '#7ce8e0');
            }
          }
          b.mowPattern = '扇形齐射';
        } else if (pattern === 1) {
          const arms = 4 + b.phase;
          const steps = 8 + b.phase * 3;
          for (let arm = 0; arm < arms; arm += 1) {
            for (let step = 0; step < steps; step += 1) {
              const angle = (arm / arms) * TAU + b.t * 0.9 + step * 0.12;
              add(cx, cy, angle, spd * (0.78 + step * 0.02), 3.8, step % 2 ? '#ffd23f' : '#ff86c8');
            }
          }
          b.mowPattern = '螺旋星雨';
        } else if (pattern === 2) {
          const rows = 8 + b.phase * 2;
          for (let i = 0; i < rows; i += 1) {
            const y = cy + 10 + i * 12;
            add(18, y, 0.12, spd * 0.95, 3.6, '#7ce8e0');
            add(W - 18, y, Math.PI - 0.12, spd * 0.95, 3.6, '#7ce8e0');
          }
          for (let i = -1; i <= 1; i += 1) add(cx, cy, base + i * 0.1, spd * 1.15, 4.6, '#ff9a3d');
          b.mowPattern = '交叉扫射';
        } else {
          const count = 16 + b.phase * 4;
          for (let i = 0; i < count; i += 1) {
            const angle = (i / count) * TAU + b.t * 0.4;
            add(cx, cy, angle, spd * 0.85, 4, i % 3 ? '#ffd23f' : '#ff86c8');
          }
          for (let i = -1; i <= 1; i += 1) add(cx, cy, base + i * 0.12, spd * 1.1, 4.8, '#ff9a3d');
          b.mowPattern = '环爆三连';
        }
        if (b.mowPatternsFired && b.mowPatternsFired.indexOf(b.mowPattern) === -1) {
          b.mowPatternsFired.push(b.mowPattern);
        }
        if (!A.reducedMotion) {
          particles.emit(cx, cy, {
            count: 4,
            speed: [30, 120],
            life: [0.1, 0.3],
            size: [1.5, 3],
            colors: [color, '#ffffff'],
          });
        }
        addRing(cx, cy, color, 70 + pattern * 22, 0.28, 2);
        A.Sfx.play('shoot');
      }

      function stageClear(cleared) {
        /* 0.17（ADR §19.4 / D17-15）：真实关卡清空提交一次 wave.completed。
           - 只在职业 run 提交（经典/挑战/割草不新增事件、零行为变化）；
           - level/theme 取「刚清空这一关」的真实状态（在 level+1 / syncRunTheme 之前捕获）；
           - 只有 Boss 真实被击破（killEnemy → stageClear）才会到达这里，开局/暂停不发。 */
        if (isCareerRun()) {
          const clearedTheme = run.theme && run.theme.id ? run.theme.id : null;
          careerBattle.waveCompletions += 1;
          careerObserve('wave.completed', { level: cleared, theme: clearedTheme });
        }
        boss = null;
        level += 1;
        stageTime = 0;
        shots = [];
        spawnTimer = 1.3;
        lives = Math.min(maxLives(), lives + 1);
        tools.pulse = Math.min(JOY_TOOL_CAPS.pulse, tools.pulse + 1);
        tools.shield = Math.min(JOY_TOOL_CAPS.shield, tools.shield + 1);
        /* 0.13.0 关卡成长：火力必 +1、能量补给、主题换星区。 */
        run.power = Math.min(5, run.power + 1);
        addEnergy(40);
        run.bossDamageAcc = 0;
        run.bossDamageTimer = 0;
        run.freezeTimer = 0;
        run.lance = null;
        run.nukeShots = [];
        syncRunTheme();
        run.warpTint = 1;
        stageBannerText = 'STAGE ' + cleared + ' CLEAR';
        stageBanner = 2.4;
        state = 'clear';
        pendingClearStage = cleared;
        run.refitOffer = null;
        run.refitChosen = [];
        rollRefitOffer(cleared);
        A.Sfx.play('perfect');
        syncHud();
        syncJoyTools();
        autosave.saveNow();
        loop.pause();
        showClearPanel(cleared);
        pauseUi.sync();
      }

      /* 割草模式没有 CLEAR/整备弹层，也不写档：Boss 击破后自动进入下一潮。 */
      function stageClearMow() {
        if (mode !== 'mow') return false;
        boss = null;
        level += 1;
        stageTime = 0;
        shots = [];
        spawnTimer = 0.5;
        run.power = 5;
        addEnergy(MOW.clearEnergy);
        BUFF_TYPES.forEach((type) => {
          buffs[type] = Infinity;
        });
        lastBuff = 'spread';
        run.itemCap = MOW.itemSlots;
        run.items = ['nuke', 'lance', 'freeze'];
        run.formationCharges = 3;
        run.bossDamageAcc = 0;
        run.bossDamageTimer = 0;
        run.freezeTimer = 0;
        run.lance = null;
        run.nukeShots = [];
        syncRunTheme();
        run.warpTint = 1;
        stageBannerText = '第 ' + level + ' 潮 · ' + (run.theme ? run.theme.name : '');
        stageBanner = 2.2;
        state = 'playing';
        pendingClearStage = 0;
        A.Sfx.play('perfect');
        syncHud();
        syncJoyTools();
        pauseUi.sync();
        return true;
      }

      function dropMowBossLoot(e) {
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        for (let i = 0; i < 10; i += 1) {
          dropEnergyCore({ x: cx + rand(-60, 60), y: cy + rand(-30, 30), w: 0, h: 0 });
        }
        for (let i = 0; i < 4; i += 1) {
          dropPowerCore({ x: cx + rand(-50, 50), y: cy + rand(-20, 20), w: 0, h: 0 });
        }
      }

      /* CLEAR 选择弹层抽成函数：刷新恢复后也能重新给出「下一关 / 圆满收局」。
       * 0.13.0 起同时是「整备」界面：3 张补给卡三选一（可选，不影响下一关）。 */
      function showClearPanel(cleared) {
        if (!run.refitOffer || run.refitOffer.length !== 3) rollRefitOffer(cleared);
        const theme = run.theme || themeForLevel(Math.max(1, cleared + 1));
        const summary =
          '<div class="refit-summary">火力 LV' + run.power +
          ' · 生命 ' + lives + '/' + maxLives() +
          ' · 能量 ' + Math.round(run.energy) + '/' + run.maxEnergy +
          ' · 星币 +' + Math.floor(score / 16 + run.creditsBonus) +
          '<br/>下一星区：<b>' + A.escapeHtml(theme.name) + '</b> · ' + A.escapeHtml(theme.desc) + '</div>';
        ui.show({
          result: '回看战场',
          title: 'STAGE ' + cleared + ' CLEAR · 整备',
          text: summary + refitOfferHtml() + '<span class="refit-hint">击坠得分 ' + score + ' · 脉冲/星盾已补给 1 次</span>',
          btn: '下一关',
          onBtn: resumeClear,
          btn2: '圆满收局',
          onBtn2: () => gameOver(true),
        });
        bindRefitClicks();
      }

      function resumeClear() {
        if (state !== 'clear') return false;
        state = 'playing';
        pendingClearStage = 0;
        run.refitOffer = null;
        run.refitChosen = [];
        run.combo = 0;
        run.comboTimer = 0;
        ui.hide();
        loop.resume();
        stageBannerText = 'STAGE ' + level + ' · ' + (run.theme ? run.theme.name : '');
        stageBanner = 2.2;
        syncHud();
        pauseUi.sync();
        syncJoyTools();
        autosave.saveNow();
        return true;
      }

      /* ---------- 游戏流程 ---------- */
      function reset() {
        bullets = [];
        enemies = [];
        shots = [];
        pickups = [];
        floaters = [];
        score = 0;
        initRunState();
        lives = startingLives();
        mowKills = 0;
        spawnTimer = 0.4;
        shake = 0;
        recordSaved = false;
        dragOffset = null;
        nextUid = 1;
        pickupPity = 0;
        BUFF_TYPES.forEach((type) => {
          buffs[type] = 0;
        });
        lastBuff = 'normal';
        /* 职业 run 从委托 startParams.startLevel 起关（T1=1 / T2=3）；经典/挑战/割草仍是第 1 关。 */
        level = isCareerRun() ? clamp(Math.floor(Number(careerBattle.startLevel) || 1), 1, 999) : 1;
        stageTime = 0;
        pendingClearStage = 0;
        boss = null;
        stageBanner = 0;
        stageBannerText = '';
        elapsed = 0;
        tools.pulse = 1;
        tools.shield = 1;
        shieldTimer = 0;
        player.x = W / 2;
        player.y = H - 90;
        player.cool = 0;
        player.invul = 0;
        player.tilt = 0;
        player.prevX = player.x;
        particles.clear();
        syncRunTheme();
        /* 委托 startParams.themeId 只在起始关覆盖主题（T2：第 3 关电磁风暴）。 */
        applyCareerStartTheme();
        /* 0.17 生涯模块：每趟出击重置护盾充能与承伤池（经典/挑战/割草不读这些字段）。 */
        careerBattle.armorPool = 0;
        careerBattle.shieldCharges = careerBattle.stats.shieldOnce ? 1 : 0;
        careerBattle.waveCompletions = 0;
        syncHud();
        syncJoyTools();
      }

      function syncHud() {
        dom.hudScore.textContent = String(score);
        if (dom.hudStage) dom.hudStage.textContent = isMow() ? '潮' + level : String(level);
        if (dom.hudPower) dom.hudPower.textContent = isMow() ? 'MAX' : 'LV' + run.power;
        if (dom.hudCredits) dom.hudCredits.textContent = String(hangar.credits);
        const text = buffHudText();
        if (text) {
          dom.hudBuff.hidden = false;
          if (dom.hudWeapon.textContent !== text) dom.hudWeapon.textContent = text;
        } else {
          dom.hudBuff.hidden = true;
        }
      }

      function startGame() {
        autosave.clear();
        mode = 'classic';
        setMowChrome(false);
        chStage = null;
        chContent = null;
        chEvents = [];
        hideChallengePanel();
        if (dom.hangarPanel) dom.hangarPanel.hidden = true;
        hangarOpen = false;
        setChallengeChrome(false);
        reset();
        state = 'playing';
        stageBannerText = 'STAGE ' + level + ' · ' + run.theme.name;
        stageBanner = 2.2;
        run.warpTint = 1;
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
      }

      /* ---------- 0.14.0 星海割草（模拟割草 / 无积分无星币） ---------- */
      function fillMowArsenal() {
        run.itemCap = MOW.itemSlots;
        run.items = ['nuke', 'lance', 'freeze'];
      }
      function startMow() {
        /* 0.16：职业 run 内不开割草演武（无结算、会打断委托）。 */
        if (isCareerRun()) return false;
        autosave.clear();
        hideChallengePanel();
        if (dom.hangarPanel) dom.hangarPanel.hidden = true;
        hangarOpen = false;
        setChallengeChrome(false);
        reset();
        mode = 'mow';
        state = 'playing';
        score = 0;
        mowKills = 0;
        recordSaved = true; /* 演武不参与最高分/积分记录/星币结算。 */
        run.power = 5;
        run.maxEnergy = energyCap();
        run.energy = run.maxEnergy;
        run.depleted = false;
        fillMowArsenal();
        run.formationCharges = 3;
        run.formationTimer = 0;
        run.wingmen = [];
        run.freezeTimer = 0;
        run.lance = null;
        run.nukeShots = [];
        BUFF_TYPES.forEach((type) => {
          buffs[type] = Infinity;
        });
        lastBuff = 'spread';
        lives = maxLives();
        player.invul = invulSeconds();
        spawnTimer = 0.1;
        setMowChrome(true);
        stageBannerText = '星海割草 · 弹药常驻 · 能量是唯一资源';
        stageBanner = 2.6;
        run.warpTint = 1;
        syncRunTheme();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncHud();
        syncJoyTools();
        return true;
      }

      function quitMow() {
        if (mode !== 'mow') return false;
        autosave.clear();
        mode = 'classic';
        state = 'ready';
        mowKills = 0;
        BUFF_TYPES.forEach((type) => {
          buffs[type] = 0;
        });
        lastBuff = 'normal';
        bullets = [];
        enemies = [];
        shots = [];
        pickups = [];
        floaters = [];
        boss = null;
        effects = [];
        particles.clear();
        stageBanner = 0;
        stageBannerText = '';
        setMowChrome(false);
        syncHud();
        showStart();
        syncJoyTools();
        pauseUi.sync();
        return true;
      }

      function settleCredits(wonRun) {
        /* 星币只由本局得分产生：floor(score/16) + 整备室军费补给。读档/重算都幂等。 */
        const earned = Math.max(0, Math.floor(score / 16) + run.creditsBonus);
        hangar.credits = clamp(hangar.credits + earned, 0, HANGAR_MAX_CREDITS);
        hangar.runs += 1;
        hangar.best = Math.max(hangar.best, score);
        saveHangar();
        syncHangarCredits();
        return earned;
      }

      function gameOver(won) {
        /* 割草模式没有死亡结算：误触也只会回到演武开始界面，不写分/币。 */
        if (mode === 'mow') return quitMow();
        if (state === 'over') return;
        const wonRun = won === true;
        const careerActive = isCareerRun();
        state = 'over';
        pendingClearStage = 0;
        A.Sfx.play(wonRun ? 'perfect' : 'over');
        autosave.clear();
        /* 0.16 职业 run（ADR §18.8）：不结算经典星币、不写旧机库、不调 Progress/Scores/最高分；
           结算只走 career.finish → bridge/commission-core 的独立职业收据。 */
        const earned = careerActive ? 0 : settleCredits(wonRun);
        const rec = careerActive || recordSaved ? null : A.Progress.recordPlay('star-raid', score);
        if (rec) high = rec.high;
        recordSaved = true;
        dom.hudHigh.textContent = String(Math.max(high, score));
        loop.pause();
        if (careerActive) {
          showCareerResult(wonRun);
          careerFinish(wonRun ? 'won' : 'lost');
        } else {
          ui.show({
            result: '回看战场',
            title: wonRun ? '星海凯旋！' : '机体损毁',
            text:
              `<span class="ac-score">${score}</span>` +
              (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
              `击坠得分 · 最高 ${Math.max(high, score)} · 第 ${level} 关<br/>` +
              `<span class="ac-credits">+${earned} 星币</span>（机库共 ${hangar.credits}）`,
            btn: '再来一局',
            onBtn: showStart,
            btn2: '机库改装',
            onBtn2: showHangar,
          });
          if (mode === 'classic' && career) career.finish({ mode: 'classic', outcome: wonRun ? 'won' : 'lost', stats: { score, level, lives } });
        }
        pauseUi.sync();
        syncJoyTools();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        if (mode === 'challenge') {
          ui.show({
            title: '已暂停 · 挑战 ' + (chStage ? 'C' + pad2(chStage.stageNumber || 0) : ''),
            text: challengeLabel(chStage) + '<br/>进度已保存，可以随时离开。',
            btn: '继续',
            onBtn: resumeGame,
            btn2: '退出挑战',
            onBtn2: showChallengePanel,
          });
        } else if (mode === 'mow') {
          ui.show({
            title: '已暂停 · 星海割草',
            text:
              '本模式不记分、不给星币，也不参与最高分与积分记录。<br/>' +
              '弹药常驻 · 大杀器满载无限 · 敌潮与掉落密集 · 能量是唯一资源。<br/>' +
              '当前：第 ' + level + ' 潮 · 击坠 ' + mowKills +
              ' · 能量 ' + Math.round(run.energy) + '/' + run.maxEnergy,
            btn: '继续演武',
            onBtn: resumeGame,
            btn2: '结束演武',
            onBtn2: quitMow,
          });
        } else {
          ui.show({
            title: '已暂停',
            text: isCareerRun()
              ? '护航途中。<br/>' + careerGoalLine() + '<br/>本趟护航不写经典进度；刷新后需从本区开头重来。'
              : '休息一下，敌人不会等太久。<br/>局内进度已保存，可以随时离开。<br/>' +
                '火力 LV' + run.power + ' · 生命 ' + lives + '/' + maxLives() +
                ' · 能量 ' + Math.round(run.energy) + '/' + run.maxEnergy,
            btn: '继续',
            onBtn: resumeGame,
          });
        }
        pauseUi.sync();
        syncJoyTools();
      }

      function showStart() {
        /* 职业 run 不读旧机库（旧 formula:1 与职业装备互不相干）；经典路径保持原样。 */
        if (!isCareerRun()) hangar = loadHangar();
        initRunState();
        mode = 'classic';
        state = 'ready';
        setMowChrome(false);
        chStage = null;
        chContent = null;
        chEvents = [];
        if (dom.hangarPanel) dom.hangarPanel.hidden = true;
        hangarOpen = false;
        chBannerReset();
        setChallengeChrome(false);
        syncHud();
        syncItemButtons();
        const hasChallenge = challengeAvailable();
        if (isCareerRun()) {
          const startLevel = clamp(Math.floor(Number(careerBattle.startLevel) || 1), 1, 999);
          const startTheme = careerStartTheme() || themeForLevel(startLevel);
          const stats = careerBattle.stats;
          const settled = careerBattle.settled;
          ui.show({
            title: '星海突击',
            text:
              careerGoalLine() +
              '<br/>起始星区：第 ' + startLevel + ' 关 · ' + A.escapeHtml(startTheme.name) +
              ' · ' + A.escapeHtml(careerBattle.shipName || '旧翼') +
              '（生命 ' + Math.round(stats.maxLives) + ' · 能量 ' + Math.round(stats.energyCap) + '）' +
              '<br/>击破本区母舰后回旧港结算报酬；本趟不结算经典星币，也不写经典纪录' +
              (settled ? '<br/><span class="refit-hint">这趟护航已经结算，可以在这里继续练手。</span>' : ''),
            btn: settled ? '继续练手' : '开始游戏',
            onBtn: startGame,
            btn2: '',
            btn3: '',
            btn4: '',
          });
        } else {
          ui.show({
            title: '星海突击',
            text:
              '纵版弹幕射击：击落敌机，躲开弹幕。<br/>' +
              '吃下 <b>散射 / 激光 / 追踪 / 速射</b>，同种可叠加时长；能量见底会火力下降，记得捡能量核心<br/>' +
              'Boss 后三选一整备继续下一星区 · 编队 3 · 大杀器 4–7<br/>' +
              '机库星币 <b>' + hangar.credits + '</b> · 已远征 ' + hangar.runs + ' 次<br/>' +
              '<b>星海割草</b>：模拟割草演武，弹种常驻 / 大杀器满载无限 / 敌潮密集；<b>不记分、不给星币</b>',
            btn: '开始游戏',
            onBtn: startGame,
            btn2: hasChallenge ? '挑战 6 关' : '挑战数据不可用',
            onBtn2: hasChallenge ? showChallengePanel : () => A.showToast('挑战数据不可用'),
            btn3: '机库改装',
            onBtn3: showHangar,
            btn4: '星海割草（模拟割草）',
            onBtn4: startMow,
          });
        }
        if (!isCareerRun()) syncHangarCredits();
        syncItemButtons();
      }

      /* 切回开始界面时清掉残留的横幅/特效，避免旧关卡的 WARNING 文字停在新弹层后面。 */
      function chBannerReset() {
        stageBanner = 0;
        stageBannerText = '';
        effects = [];
        flash = 0;
        run.warpTint = 0;
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        /* ADR §18.3/§18.8：职业 run 不读写旧 RunSave（studiokit:arcade:runs:v1），刷新只能重开本趟护航。 */
        if (isCareerRun()) return null;
        /* 星海割草是无结算演武：不写局内档，避免刷新恢复提示/进度串味。 */
        if (mode === 'mow') return null;
        /* 挑战局内档（mode:'challenge'）与经典局内档（mode:'classic'）保持 0.14/0.15 原门禁；本页无 zen 模式。 */
        if (state !== 'playing' && state !== 'paused' && state !== 'clear') return null;
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          player: { x: player.x, y: player.y, invul: player.invul },
          bullets: bullets.map((b) => ({
            x: b.x,
            y: b.y,
            vx: b.vx,
            vy: b.vy,
            r: b.r,
            dmg: b.dmg,
            pierce: !!b.pierce,
            laser: !!b.laser,
            homing: !!b.homing,
            hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
          })),
          enemies: enemies.map((e) => ({
            uid: e.uid,
            kind: e.kind,
            x: e.x,
            y: e.y,
            w: e.w,
            h: e.h,
            hp: e.hp,
            maxHp: e.maxHp || e.hp,
            score: e.score,
            name: e.name || '',
            phase: e.phase || 1,
            vy: e.vy,
            t: e.t,
            fireTimer: e.fireTimer,
            baseX: e.baseX,
            vx: e.vx,
            chSway: e.chSway || 0,
            chChargeAt: e.chChargeAt || 0,
            exposed: e.exposed !== false,
            weakSide: e.weakSide || 'left',
            salvoIndex: e.salvoIndex || 0,
            rot: e.rot || 0,
            rotSpeed: e.rotSpeed || 0,
          })),
          shots,
          pickups,
          score,
          lives,
          spawnTimer,
          nextUid,
          pickupPity,
          buffs: { ...buffs },
          lastBuff,
          stage: level,
          stageTime,
          elapsed,
          tools: { pulse: tools.pulse, shield: tools.shield },
          shieldTimer,
          clearStage: pendingClearStage,
          /* 0.13.0 星域远征局内状态；挑战分支不写，旧档缺字段时 restore 用默认值。 */
          run:
            classicLike()
              ? {
                  power: run.power,
                  energy: Math.round(run.energy * 10) / 10,
                  maxEnergy: run.maxEnergy,
                  depleted: !!run.depleted,
                  items: run.items.map((type) => (type && ITEM_SPECS[type] ? type : null)),
                  formationCharges: run.formationCharges,
                  formationTimer: Math.round(run.formationTimer * 10) / 10,
                  combo: run.combo,
                  comboTimer: run.comboTimer,
                  creditsBonus: run.creditsBonus,
                  refitOfferIds: run.refitOffer ? run.refitOffer.map((card) => card.id) : [],
                  refitChosen: run.refitChosen.slice(),
                  seed: run.seed,
                  lance: run.lance ? { t: Math.round(run.lance.t * 10) / 10 } : null,
                  nukeShots: run.nukeShots.map((shot) => ({
                    x: Math.round(shot.x),
                    y: Math.round(shot.y),
                    vx: Math.round(shot.vx),
                    vy: Math.round(shot.vy),
                    targetX: Math.round(shot.targetX),
                    targetY: Math.round(shot.targetY),
                    tracking: !!shot.tracking,
                    life: Math.round(shot.life * 10) / 10,
                  })),
                  freezeTimer: Math.round(run.freezeTimer * 10) / 10,
                }
              : null,
          challenge:
            mode === 'challenge'
              ? {
                  time: chTime,
                  health: chHealth,
                  assisted: chAssisted,
                  collectibles: chCollectibles.slice(),
                  damageLog: chDamageLog.slice(0, 40),
                  powerupLog: chPowerupLog.slice(0, 40),
                  bossDefeated: chBossDefeated,
                  bossMaxPhase: chBossMaxPhase,
                  bossExposedWindows: chBossExposedWindows,
                  bossExposedSeconds: chBossExposedSeconds,
                  /* 0.9.0 修复（缺陷 1）：固定拾取物生成游标必须随档保存，否则刷新后按
                   * 已通过的 atSec 重新生成一遍（重复掉 Buff）。 */
                  powerupSpawned: chPowerupSpawned.map((spawned) => !!spawned),
                  events: chEvents.map((ev) => ({
                    id: ev.id,
                    started: ev.started,
                    phase: ev.phase,
                    phaseTime: ev.phaseTime,
                    salvoIndex: ev.salvoIndex,
                    lastSalvo: ev.lastSalvo,
                    done: ev.done,
                  })),
                  boss: boss
                    ? {
                        uid: boss.uid,
                        hp: boss.hp,
                        maxHp: boss.maxHp,
                        phase: boss.phase,
                        exposed: boss.exposed !== false,
                        weakSide: boss.weakSide || 'left',
                        salvoIndex: boss.salvoIndex || 0,
                        t: boss.t,
                        /* 0.9.0 修复（缺陷 1）：Boss 射击/阶段计时随档保存，刷新后不回到 999。 */
                        fireTimer: boss.fireTimer,
                        wasExposed: boss.wasExposed !== false,
                      }
                    : null,
                }
              : null,
        };
      }

      function restoreChallenge(data) {
        const stage = challengeStageByRef(String(data.stageId || ''));
        if (!stage) return false;
        try {
          resetChallenge(stage);
          const ch = data.challenge && typeof data.challenge === 'object' ? data.challenge : {};
          const savedBoss = ch.boss && typeof ch.boss === 'object' ? ch.boss : null;
          const savedPlayer = data.player && typeof data.player === 'object' ? data.player : {};
          player.x = clamp(Number(savedPlayer.x) || player.x, 20, W - 20);
          player.y = clamp(Number(savedPlayer.y) || player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
          player.prevX = player.x;
          player.invul = Number(savedPlayer.invul) || 0;
          bullets = (data.bullets || [])
            .filter((b) => b && isFinite(b.x) && isFinite(b.y))
            .map((b) => ({
              x: Number(b.x) || 0,
              y: Number(b.y) || 0,
              vx: Number(b.vx) || 0,
              vy: Number(b.vy) || -640,
              r: Number(b.r) || 3,
              dmg: Number(b.dmg) || 1,
              pierce: !!b.pierce,
              laser: !!b.laser,
              homing: !!b.homing,
              hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
            }));
          shots = (data.shots || [])
            .filter((s) => s && isFinite(s.x) && isFinite(s.y))
            .map((s) => ({
              x: Number(s.x) || 0,
              y: Number(s.y) || 0,
              vx: Number(s.vx) || 0,
              vy: Number(s.vy) || 0,
              r: Number(s.r) || 4,
              chSource: s.chSource ? String(s.chSource) : null,
            }));
          pickups = (data.pickups || [])
            .filter((p) => p && WEAPONS[p.type])
            .map((p) => ({
              x: Number(p.x) || W / 2,
              y: Number(p.y) || 0,
              vy: Number(p.vy) || 70,
              r: 15,
              type: p.type,
              spin: Number(p.spin) || 0,
              chPowerup: p.chPowerup ? String(p.chPowerup) : null,
            }));
          enemies = (data.enemies || [])
            .filter((e) => e && (e.kind === 'boss' || KINDS[e.kind]) && isFinite(e.x) && isFinite(e.y))
            .map((e) => {
              const isBoss = e.kind === 'boss';
              const hp = Math.max(1, Number(e.hp) || 1);
              /* 0.9.0 修复（缺陷 1）：新增保存的 Boss 射击计时优先；旧档未写入时回退到
               * enemies[].fireTimer（旧档本来就有），仍缺失则用 0.55s 安全默认值，
               * 不能像以前那样一律重置为 999（会消掉刷新前应有的弹幕节奏）。 */
              const legacyTimer = Number.isFinite(Number(e.fireTimer)) ? Number(e.fireTimer) : 0.55;
              const bossTimer = Number.isFinite(Number(savedBoss && savedBoss.fireTimer)) ? Number(savedBoss.fireTimer) : legacyTimer;
              return {
                uid: Number(e.uid) || nextUid++,
                kind: e.kind,
                x: Number(e.x) || 0,
                y: Number(e.y) || 0,
                w: Number(e.w) || (isBoss ? 118 : KINDS[e.kind].w),
                h: Number(e.h) || (isBoss ? 86 : KINDS[e.kind].h),
                hp,
                maxHp: Math.max(hp, Number(e.maxHp) || hp),
                score: Number(e.score) || (isBoss ? 1200 : KINDS[e.kind].score),
                color: isBoss ? '#ff5d7a' : KINDS[e.kind].color,
                vy: Number(e.vy) || 120,
                t: Number(e.t) || 0,
                fireTimer: isBoss ? clamp(bossTimer, -10, 30) : 999,
                baseX: Number(e.baseX) || Number(e.x) || 0,
                vx: 0,
                name: isBoss ? String(e.name || 'BOSS') : '',
                phase: Number(e.phase) || 1,
                exposed: e.exposed !== false,
                wasExposed: e.exposed !== false,
                weakSide: e.weakSide === 'right' ? 'right' : 'left',
                salvoIndex: Math.max(0, Math.floor(Number(e.salvoIndex) || 0)),
                chSway: Number(e.chSway) || 0,
                chChargeAt: Number(e.chChargeAt) || 0,
              };
            });
          boss = enemies.find((e) => e.kind === 'boss') || null;
          score = Math.max(0, Number(data.score) || 0);
          nextUid = Math.max(nextUid, Number(data.nextUid) || 1);
          BUFF_TYPES.forEach((type) => {
            buffs[type] = 0;
          });
          if (data.buffs && typeof data.buffs === 'object') {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = Math.max(0, Number(data.buffs[type]) || 0);
            });
          }
          lastBuff = activeBuffs().slice(-1)[0] || 'normal';
          if (data.lastBuff && buffs[data.lastBuff] > 0) lastBuff = data.lastBuff;
          if (data.tools && typeof data.tools === 'object') {
            tools.pulse = Number.isFinite(Number(data.tools.pulse)) ? clamp(Math.floor(Number(data.tools.pulse)), 0, JOY_TOOL_CAPS.pulse) : 1;
            tools.shield = Number.isFinite(Number(data.tools.shield)) ? clamp(Math.floor(Number(data.tools.shield)), 0, JOY_TOOL_CAPS.shield) : 1;
          }
          shieldTimer = clamp(Number(data.shieldTimer) || 0, 0, SHIELD_SECONDS);
          chTime = clamp(Number(ch.time) || 0, 0, 3600);
          const maxHealth = Math.max(1, Math.floor(Number(chContent.startingHealth) || 3));
          chHealth = clamp(Math.floor(Number(ch.health) || maxHealth), 1, maxHealth);
          chAssisted = !!ch.assisted;
          chCollectibles = Array.isArray(ch.collectibles) ? ch.collectibles.filter((id) => typeof id === 'string').slice(0, 48) : [];
          chDamageLog = Array.isArray(ch.damageLog) ? ch.damageLog.slice(0, 40) : [];
          chPowerupLog = Array.isArray(ch.powerupLog) ? ch.powerupLog.slice(0, 40) : [];
          chBossDefeated = !!ch.bossDefeated;
          chBossMaxPhase = clamp(Math.floor(Number(ch.bossMaxPhase) || 0), 0, 9);
          chBossExposedWindows = clamp(Math.floor(Number(ch.bossExposedWindows) || 0), 0, 999);
          chBossExposedSeconds = clamp(Number(ch.bossExposedSeconds) || 0, 0, 3600);
          /* 0.9.0 修复（缺陷 1）：恢复固定拾取物生成游标。旧档缺字段时用安全默认值：
           * 已过 atSec 的拾取物视为已生成，避免刷新把它们再生成一遍。 */
          const savedSpawned = Array.isArray(ch.powerupSpawned) ? ch.powerupSpawned : null;
          const powerupList = Array.isArray(chContent.powerups) ? chContent.powerups : [];
          chPowerupSpawned = powerupList.map((powerup, index) => {
            if (savedSpawned) return !!savedSpawned[index];
            return (Number(powerup && powerup.atSec) || 0) <= chTime;
          });
          const savedEvents = Array.isArray(ch.events) ? ch.events : [];
          chEvents.forEach((ev) => {
            const saved = savedEvents.find((item) => item && item.id === ev.id);
            if (!saved) return;
            ev.started = !!saved.started;
            ev.phase = ['pending', 'telegraph', 'attack', 'done'].indexOf(saved.phase) !== -1 ? saved.phase : 'pending';
            ev.phaseTime = clamp(Number(saved.phaseTime) || 0, 0, 120);
            ev.salvoIndex = Math.max(0, Math.floor(Number(saved.salvoIndex) || 0));
            ev.lastSalvo = Number(saved.lastSalvo) || 0;
            ev.done = !!saved.done;
          });
          if (boss && ch.boss && typeof ch.boss === 'object') {
            boss.exposed = ch.boss.exposed !== false;
            boss.wasExposed = ch.boss.wasExposed === undefined ? boss.exposed : !!ch.boss.wasExposed;
            boss.weakSide = ch.boss.weakSide === 'right' ? 'right' : 'left';
            boss.salvoIndex = Math.max(0, Math.floor(Number(ch.boss.salvoIndex) || 0));
            if (Number.isFinite(Number(ch.boss.hp))) boss.hp = clamp(Number(ch.boss.hp), 1, boss.maxHp);
            /* 0.9.0 修复（缺陷 1）：Boss 阶段计时（b.t 驱动弱点/护盾循环）与射击计时连续。
             * 入场等待期间 fireTimer 允许为负数（<=0 表示“下次进入射程立即开火”），必须原样恢复；
             * 仅对异常大值/无意义值做范围保护。 */
            if (Number.isFinite(Number(ch.boss.t))) boss.t = clamp(Number(ch.boss.t), 0, 3600);
            if (Number.isFinite(Number(ch.boss.fireTimer))) boss.fireTimer = clamp(Number(ch.boss.fireTimer), -10, 30);
          }
          recordSaved = false;
          state = 'playing';
          syncHud();
          syncJoyTools();
          setChallengeChrome(true);
          syncChallengeHud(true);
          return true;
        } catch (err) {
          return false;
        }
      }

      function restore(data) {
        if (!data) return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        if (!data.player || !Array.isArray(data.enemies)) return false;
        try {
          mode = 'classic';
          chStage = null;
          chContent = null;
          chEvents = [];
          setChallengeChrome(false);
          reset();
          player.x = clamp(Number(data.player.x) || W / 2, 20, W - 20);
          player.y = clamp(Number(data.player.y) || H - 90, PLAYER_MIN_Y, PLAYER_MAX_Y);
          player.prevX = player.x;
          player.tilt = 0;
          player.invul = Number(data.player.invul) || 0;
          bullets = (data.bullets || []).filter((b) => b && isFinite(b.x) && isFinite(b.y)).map((b) => ({
            x: Number(b.x) || 0,
            y: Number(b.y) || 0,
            vx: Number(b.vx) || 0,
            vy: Number(b.vy) || -640,
            r: Number(b.r) || 3,
            dmg: Number(b.dmg) || 1,
            pierce: !!b.pierce,
            laser: !!b.laser,
            homing: !!b.homing,
            hitIds: Array.isArray(b.hitIds) ? b.hitIds.slice() : [],
          }));
          level = clamp(Math.floor(Number(data.stage) || 1), 1, 999);
          stageTime = Math.max(0, Number(data.stageTime) || 0);
          const bossDef = bossSpec(level);
          enemies = data.enemies
            .filter((e) => e && (e.kind === 'boss' || KINDS[e.kind]) && isFinite(e.x) && isFinite(e.y))
            .map((e) => {
              const isBoss = e.kind === 'boss';
              const hp = Math.max(1, Number(e.hp) || (isBoss ? bossDef.hp : 1));
              return {
                uid: Number(e.uid) || nextUid++,
                kind: e.kind,
                x: Number(e.x) || 0,
                y: Number(e.y) || 0,
                w: Number(e.w) || (isBoss ? bossDef.w : KINDS[e.kind].w),
                h: Number(e.h) || (isBoss ? bossDef.h : KINDS[e.kind].h),
                hp,
                maxHp: Math.max(hp, Number(e.maxHp) || (isBoss ? bossDef.hp : hp)),
                score: Number(e.score) || (isBoss ? bossDef.score : KINDS[e.kind].score),
                color: isBoss ? '#ff5d7a' : KINDS[e.kind].color,
                vy: Number(e.vy) || 100,
                t: Number(e.t) || 0,
                fireTimer: Number(e.fireTimer) || 1,
                baseX: Number(e.baseX) || 0,
                vx: Number(e.vx) || 0,
                name: isBoss ? String(e.name || bossDef.name) : '',
                phase: Number(e.phase) || 1,
                flash: 0,
                rot: Number(e.rot) || 0,
                rotSpeed: Number(e.rotSpeed) || 0,
              };
            });
          boss = enemies.find((e) => e.kind === 'boss') || null;
          shots = (data.shots || []).filter((s) => s && isFinite(s.x) && isFinite(s.y)).map((s) => ({
            x: Number(s.x) || 0,
            y: Number(s.y) || 0,
            vx: Number(s.vx) || 0,
            vy: Number(s.vy) || 0,
            r: Number(s.r) || 4,
          }));
          pickups = (data.pickups || []).filter((p) => p && (WEAPONS[p.type] || SPECIAL_PICKUPS[p.type])).map((p) => ({
            x: Number(p.x) || W / 2,
            y: Number(p.y) || 0,
            vy: Number(p.vy) || 70,
            r: Number(p.r) || 15,
            type: p.type,
            itemType: ITEM_SPECS[p.itemType] ? p.itemType : null,
            spin: Number(p.spin) || 0,
          }));
          score = Math.max(0, Number(data.score) || 0);
          lives = clamp(Number(data.lives) || startingLives(), 1, maxLives());
          spawnTimer = Number(data.spawnTimer) || 0.4;
          nextUid = Math.max(nextUid, Number(data.nextUid) || 1);
          pickupPity = Number(data.pickupPity) || 0;
          restoreRunState(data.run);
          BUFF_TYPES.forEach((type) => {
            buffs[type] = 0;
          });
          if (data.buffs && typeof data.buffs === 'object') {
            BUFF_TYPES.forEach((type) => {
              buffs[type] = Math.max(0, Number(data.buffs[type]) || 0);
            });
          } else if (WEAPONS[data.weapon] && data.weapon !== 'normal') {
            /* 旧版单弹种存档迁移为对应 Buff。 */
            buffs[data.weapon] = Math.max(0, Number(data.weaponTimer) || 0);
          }
          lastBuff = activeBuffs().slice(-1)[0] || 'normal';
          if (data.lastBuff && buffs[data.lastBuff] > 0) lastBuff = data.lastBuff;
          elapsed = Math.max(0, Number(data.elapsed) || 0);
          if (data.tools && typeof data.tools === 'object') {
            tools.pulse = Number.isFinite(Number(data.tools.pulse)) ? clamp(Math.floor(Number(data.tools.pulse)), 0, JOY_TOOL_CAPS.pulse) : 1;
            tools.shield = Number.isFinite(Number(data.tools.shield)) ? clamp(Math.floor(Number(data.tools.shield)), 0, JOY_TOOL_CAPS.shield) : 1;
          }
          shieldTimer = clamp(Number(data.shieldTimer) || 0, 0, SHIELD_SECONDS);
          pendingClearStage = clamp(Math.floor(Number(data.clearStage) || 0), 0, 999);
          recordSaved = false;
          syncHud();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('star-raid', serialize, {
        every: 4,
        meta: () =>
          mode === 'challenge'
            ? {
                score: Math.floor(chTime),
                summary: `挑战 ${chStage ? 'C' + pad2(chStage.stageNumber || 0) : ''} · 生命 ${chHealth} · ${challengeFmt(chTime)}`,
              }
            : {
                score,
                summary:
                  `得分 ${score} · 第 ${level} 关${boss ? ' · BOSS' : ' · ' + (run.theme ? run.theme.name + ' · ' : '') + waveInfo().label}` +
                  ` · 火力 LV${run.power} · 生命 ${lives} · 能量 ${Math.round(run.energy)}/${run.maxEnergy}`,
              },
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        stars.update(dt, state === 'playing' ? 2.2 : 0.6);
        starsFar.update(dt, state === 'playing' ? 0.9 : 0.25);
        particles.update(dt);
        updateEffects(dt);
        shake = Math.max(0, shake - dt * 26);
        updateFloaters(dt);
        stageBanner = Math.max(0, stageBanner - dt);
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        if (mode === 'challenge') {
          updateChallenge(dt);
          if (state !== 'playing') {
            input.endFrame();
            return;
          }
          updatePlayer(dt);
          updateChallengeEnemies(dt);
          updateBullets(dt);
          updatePickups(dt);
          collide();
          input.endFrame();
          return;
        }
        elapsed += dt;
        updateCombo(dt);
        updateEnergy(dt);
        updateFormation(dt);
        updateLance(dt);
        updateNukeShots(dt);
        updateFreeze(dt);
        updateThemeField(dt);
        if (!boss) {
          stageTime += dt;
          if (stageTime >= (isMow() ? MOW.stageSeconds : STAGE_WAVE_SECONDS)) spawnBoss();
        }
        updatePlayer(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updatePickups(dt);
        collide();
        input.endFrame();
      }

      function fire() {
        /* ADR §18.9：职业 run 与经典共用火力公式（割草 0.14 也沿用经典公式，此处合并保持数值不变）。 */
        const formulaMode = classicFormula();
        const depleted = formulaMode && run.depleted;
        let interval = buffs.rapid > 0 ? 0.075 : 0.13;
        if (formulaMode) {
          if (run.power >= 5) interval *= 0.94;
          if (run.power >= 3) interval *= 0.98;
          if (depleted) interval *= 1.8;
        }
        player.cool = interval;
        if (mode === 'challenge') chFiredVolleys += 1;
        const mul = (formulaMode ? damageMul() : 1) * (depleted ? 0.7 : 1);
        /* 普通弹始终存在；每种已激活 Buff 在每一轮里追加自己的弹型，形成叠加。 */
        bullets.push({ x: player.x - 10, y: player.y - 14, vx: 0, vy: -640, r: 3, dmg: 1 * mul });
        bullets.push({ x: player.x + 10, y: player.y - 14, vx: 0, vy: -640, r: 3, dmg: 1 * mul });
        if (formulaMode) {
          /* 0.13.0 火力等级：每级追加弹道，视觉与伤害同步成长。 */
          if (run.power >= 2) bullets.push({ x: player.x, y: player.y - 16, vx: 0, vy: -680, r: 3.4, dmg: 1 * mul });
          if (run.power >= 3) {
            [-0.1, 0.1].forEach((ang) => {
              bullets.push({ x: player.x, y: player.y - 12, vx: Math.sin(ang) * 560, vy: -Math.cos(ang) * 560, r: 3, dmg: 0.9 * mul });
            });
          }
          if (run.power >= 4) {
            [-16, 16].forEach((dx) => {
              bullets.push({ x: player.x + dx, y: player.y - 6, vx: 0, vy: -620, r: 3, dmg: 1 * mul });
            });
          }
          if (run.power >= 5) bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -600, r: 5, dmg: 2 * mul });
        }
        if (buffs.spread > 0) {
          [-0.24, 0, 0.24].forEach((ang) => {
            bullets.push({
              x: player.x,
              y: player.y - 14,
              vx: Math.sin(ang) * 560,
              vy: -Math.cos(ang) * 560,
              r: 3.2,
              dmg: 1 * mul,
            });
          });
        }
        if (buffs.laser > 0) {
          bullets.push({
            x: player.x,
            y: player.y - 22,
            vx: 0,
            vy: -980,
            r: 5,
            dmg: 2 * mul,
            pierce: true,
            laser: true,
            hitIds: [],
          });
        }
        if (buffs.homing > 0) {
          [-9, 9].forEach((dx) => {
            bullets.push({
              x: player.x + dx,
              y: player.y - 12,
              vx: rand(-60, 60),
              vy: -480,
              r: 4,
              dmg: 1.4 * mul,
              homing: true,
            });
          });
        }
        if (buffs.rapid > 0) {
          bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -780, r: 2.5, dmg: 1 * mul });
        }
        A.Sfx.play('shoot');
      }

      function updatePlayer(dt) {
        const formulaMode = classicFormula();
        const depletedSlow = formulaMode && run.depleted ? 0.92 : 1;
        const speed = (formulaMode ? moveSpeed() : 320) * depletedSlow;
        if (input.isDown('ArrowLeft', 'a')) player.x -= speed * dt;
        if (input.isDown('ArrowRight', 'd')) player.x += speed * dt;
        if (input.isDown('ArrowUp', 'w')) player.y -= speed * dt;
        if (input.isDown('ArrowDown', 's')) player.y += speed * dt;

        if (input.pointer.down) {
          if (dragOffset === null) {
            dragOffset = { x: input.pointer.x - player.x, y: input.pointer.y - player.y };
          }
          player.x = input.pointer.x - dragOffset.x;
          player.y = input.pointer.y - dragOffset.y;
        } else {
          dragOffset = null;
        }

        player.x = clamp(player.x, 20, W - 20);
        player.y = clamp(player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
        /* 机身随横移倾斜：只影响绘制，不参与判定。 */
        const frameDx = player.x - player.prevX;
        const tiltTarget = clamp(frameDx / 4.5, -1, 1);
        player.tilt += (tiltTarget - player.tilt) * Math.min(1, dt * 12);
        player.prevX = player.x;
        player.invul = Math.max(0, player.invul - dt);
        /* 推进器拖尾：纯反馈，不参与判定。 */
        if (classicFormula() && !A.reducedMotion && Math.random() < 0.5) {
          particles.emit(player.x + rand(-4, 4), player.y + 12, {
            count: 1,
            speed: [8, 30],
            life: [0.1, 0.26],
            size: [1.4, 2.8],
            colors: ['#ffb43d', '#ff7a3d'],
            angle: [Math.PI * 0.42, Math.PI * 0.58],
          });
        }
        const hadShield = shieldTimer > 0;
        shieldTimer = Math.max(0, shieldTimer - dt);
        if (hadShield && shieldTimer <= 0) syncJoyTools();

        let buffChanged = false;
        BUFF_TYPES.forEach((type) => {
          if (!isFinite(buffs[type])) return; /* 割草常驻：不衰减 */
          if (buffs[type] <= 0) return;
          buffs[type] = Math.max(0, buffs[type] - dt);
          if (buffs[type] <= 0) {
            buffChanged = true;
            if (lastBuff === type) lastBuff = activeBuffs().slice(-1)[0] || 'normal';
            addFloater(player.x, player.y - 30, WEAPONS[type].name + '结束', '#93a0c8');
          }
        });
        if (buffChanged || activeBuffs().length) syncHud();
