      function fixture(bd, list) {
        for (let i = 0; i < list.length; i += 1) {
          const item = list[i];
          bd[item[0]][item[1]] = item[2];
        }
        return bd;
      }

      function selftest() {
        const before = captureState();
        const beforeSave = A.RunSave.get('gomoku');
        const details = [];
        function ok(name, cond, detail) {
          details.push({ name, ok: !!cond, detail: cond ? '' : String(detail == null ? '' : detail) });
        }
        try {
          /* 1–4：横 / 竖 / 两条斜线五连 */
          const h = fixture(emptyBoard(), [[5, 3, BLACK], [5, 4, BLACK], [5, 5, BLACK], [5, 6, BLACK], [5, 7, BLACK]]);
          ok('横向五连判定', (winLineAt(h, 5, 4, BLACK) || []).length >= 5, JSON.stringify(winLineAt(h, 5, 4, BLACK)));
          const v = fixture(emptyBoard(), [[2, 2, BLACK], [3, 2, BLACK], [4, 2, BLACK], [5, 2, BLACK], [6, 2, BLACK]]);
          ok('竖向五连判定', (winLineAt(v, 4, 2, BLACK) || []).length >= 5, JSON.stringify(winLineAt(v, 4, 2, BLACK)));
          const d1 = fixture(emptyBoard(), [[1, 1, BLACK], [2, 2, BLACK], [3, 3, BLACK], [4, 4, BLACK], [5, 5, BLACK]]);
          ok('斜向五连判定（↘）', (winLineAt(d1, 3, 3, BLACK) || []).length >= 5, JSON.stringify(winLineAt(d1, 3, 3, BLACK)));
          const d2 = fixture(emptyBoard(), [[6, 1, BLACK], [5, 2, BLACK], [4, 3, BLACK], [3, 4, BLACK], [2, 5, BLACK]]);
          ok('斜向五连判定（↗）', (winLineAt(d2, 4, 3, BLACK) || []).length >= 5, JSON.stringify(winLineAt(d2, 4, 3, BLACK)));

          /* 5：长连 ≥5 仍判胜 */
          const over = fixture(emptyBoard(), [[7, 1, BLACK], [7, 2, BLACK], [7, 3, BLACK], [7, 4, BLACK], [7, 5, BLACK], [7, 6, BLACK]]);
          const overLine = winLineAt(over, 7, 3, BLACK);
          ok('长连 ≥5 仍判胜', overLine && overLine.length === 6 && evaluateEnd(over, 12).result === 'win', overLine ? overLine.length : 'null');

          /* 6：平局判定（下满且无五连） */
          const fullDraw = DRAW_PATTERN.map((row) => row.map((value) => (value === 1 ? BLACK : WHITE)));
          const drawEnd = evaluateEnd(fullDraw, N * N);
          ok('棋盘下满且无五连判平局', !findWinner(fullDraw) && isBoardFull(fullDraw) && drawEnd.result === 'draw' && drawEnd.score === 300, JSON.stringify(drawEnd));

          /* 7：计分公式 胜 = max(300, 1000-10×总步数) / 平 = 300 / 负 = 0 */
          const blackFive = h;
          const whiteFive = whiteFiveBoard();
          const win10 = evaluateEnd(blackFive, 10);
          const win80 = evaluateEnd(blackFive, 80);
          const lose = evaluateEnd(whiteFive, 10);
          ok(
            '结算分数公式（胜/平/负）',
            win10.score === 900 && win80.score === 300 && win10.result === 'win' && lose.result === 'lose' && lose.score === 0 && drawEnd.score === 300,
            JSON.stringify({ win10: win10.score, win80: win80.score, lose: lose.score, draw: drawEnd.score })
          );

          /* 8：AI 有立即五连直接取胜 */
          const aiBoard = fixture(emptyBoard(), [[5, 3, WHITE], [5, 4, WHITE], [5, 5, WHITE], [5, 6, WHITE], [0, 0, BLACK], [0, 2, BLACK], [9, 9, BLACK], [10, 0, BLACK]]);
          const aiWinMove = chooseAIMove(aiBoard, WHITE, makeRng(7));
          ok('AI 立即取胜优先', aiWinMove && wouldWin(aiBoard, aiWinMove.r, aiWinMove.c, WHITE), aiWinMove ? coordName(aiWinMove) : 'null');

          /* 9：AI 封堵对手四（黑四 5,3–5,6，左边被白堵，只余 5,7） */
          const blockBoard = fixture(emptyBoard(), [[5, 3, BLACK], [5, 4, BLACK], [5, 5, BLACK], [5, 6, BLACK], [5, 2, WHITE], [8, 8, WHITE], [9, 9, WHITE]]);
          const blockMove = chooseAIMove(blockBoard, WHITE, makeRng(9));
          ok(
            'AI 封堵对手四',
            blockMove && blockMove.r === 5 && blockMove.c === 7 && wouldWin(blockBoard, 5, 7, BLACK),
            blockMove ? coordName(blockMove) : 'null'
          );

          /* 10：AI 落点合法且靠近已有棋子（不乱下） */
          const nearBoard = fixture(emptyBoard(), [[5, 5, BLACK], [5, 6, WHITE], [4, 6, BLACK], [6, 5, WHITE]]);
          const solid = chooseAIMove(nearBoard, WHITE, makeRng(11));
          ok(
            'AI 落点合法且靠近已有棋子',
            solid && nearBoard[solid.r][solid.c] === EMPTY && hasNeighborWithin2(nearBoard, solid.r, solid.c),
            solid ? coordName(solid) : 'null'
          );

          /* 11：悔棋撤销自己一步 + AI 一步 */
          resetStateForTest();
          applyPlayerMove(5, 5);
          performAIMove();
          const aiPoint = lastMove ? { r: lastMove.r, c: lastMove.c } : null;
          const beforeUndoMoves = moves;
          const undoOk = applyUndo();
          ok(
            '悔棋撤销自己一步 + AI 一步',
            undoOk &&
              beforeUndoMoves === 2 &&
              moves === 0 &&
              board[5][5] === EMPTY &&
              (!aiPoint || board[aiPoint.r][aiPoint.c] === EMPTY) &&
              turn === BLACK &&
              tools.undo === TOOL_START.undo - 1,
            JSON.stringify({ undoOk, beforeUndoMoves, moves, aiPoint, turn, undoLeft: tools.undo })
          );

          /* 12：提示返回合法空位 */
          const hintBoard = fixture(emptyBoard(), [[5, 5, BLACK], [6, 6, WHITE]]);
          const hintPoint = recommendMove(hintBoard, BLACK);
          ok(
            '提示返回合法空位',
            hintPoint && hintBoard[hintPoint.r][hintPoint.c] === EMPTY && hasNeighborWithin2(hintBoard, hintPoint.r, hintPoint.c),
            hintPoint ? coordName(hintPoint) : 'null'
          );

          /* 13：同 seed 复现相同 AI 落点 */
          const repBoard = fixture(emptyBoard(), [[5, 5, BLACK], [6, 6, WHITE], [4, 6, BLACK], [5, 7, WHITE]]);
          const rep1 = chooseAIMove(repBoard, WHITE, makeRng(4321));
          const rep2 = chooseAIMove(repBoard, WHITE, makeRng(4321));
          const rngA = makeRng(4321);
          const rngB = makeRng(4321);
          const seqSame = rngA() === rngB() && rngA() === rngB() && rngA() === rngB();
          ok(
            '种子复现相同 AI 落点',
            rep1 && rep2 && rep1.r === rep2.r && rep1.c === rep2.c && seqSame,
            JSON.stringify({ rep1, rep2, seqSame })
          );

          /* 14：先预览再确认（第一次只预览，第二次才落子） */
          resetStateForTest();
          tapAt(px(5), py(5));
          const previewOnly = board[5][5] === EMPTY && preview && preview.r === 5 && preview.c === 5 && moves === 0;
          tapAt(px(5), py(5));
          const confirmed = board[5][5] === BLACK && moves === 1 && preview === null;
          ok('先预览再确认的两步落子', previewOnly && confirmed, JSON.stringify({ previewOnly, confirmed }));

          /* 15：存档序列化 / 恢复往返一致（含逐字段校验） */
          const savedData = JSON.parse(JSON.stringify(serialize()));
          const expectedBoard = boardToLetters(board);
          resetStateForTest();
          const restored = restore(savedData);
          const roundTrip = restored && JSON.stringify(boardToLetters(board)) === JSON.stringify(expectedBoard) && moves === 1 && turn === WHITE;
          const invalidRejected = restore({ v: 1, board: [] }) === false;
          ok('存档序列化/恢复往返一致', roundTrip && invalidRejected, JSON.stringify({ restored, roundTrip, invalidRejected }));

          /* 16（0.10.0）：提示文案为「启发式推荐」，不声称最优 / 强 AI。 */
          const hintTitle = joyTools.buttons.hint && joyTools.buttons.hint.title ? joyTools.buttons.hint.title : '';
          ok(
            'AI 建议文案为启发式推荐',
            /启发式推荐/.test(hintTitle) && !/最优|强\s*AI/.test(hintTitle),
            hintTitle
          );

          /* 17（0.10.0 / 0.11.5）：取消 + 落子两枚透明命中层存在且触控目标 ≥44px，
             且二者无自身文字（消除与画布按钮的重影）。 */
          const placeRect = placeButton.getBoundingClientRect();
          const cancelRect = cancelButton.getBoundingClientRect();
          ok(
            '取消 / 落子按钮 DOM 存在且触控目标足够',
            !!placeButton.parentNode && !!cancelButton.parentNode &&
              placeRect.width >= PLACE_BTN_MIN_CSS - 1 && placeRect.height >= PLACE_BTN_MIN_CSS - 1 &&
              cancelRect.width >= PLACE_BTN_MIN_CSS - 1 && cancelRect.height >= PLACE_BTN_MIN_CSS - 1 &&
              !placeButton.textContent && !cancelButton.textContent,
            { placeW: placeRect.width, placeH: placeRect.height, cancelW: cancelRect.width, cancelH: cancelRect.height, min: PLACE_BTN_MIN_CSS }
          );

          /* 18（0.11.5）：预览取消出口 —— 取消只清预览，不动棋盘/回合/步数。 */
          resetStateForTest();
          tapAt(px(5), py(5));
          const hadPreview = !!preview && board[5][5] === EMPTY && moves === 0;
          const canceled = cancelPreview();
          const cancelOk = canceled && hadPreview && !preview && board[5][5] === EMPTY && moves === 0 && turn === BLACK;
          /* 落子命中区仍可正常确认（先用 DOM 按钮的真实点击路径）。 */
          tapAt(px(5), py(5));
          syncAll();
          syncPlaceButton();
          placeButton.click();
          const confirmOk = board[5][5] === BLACK && moves === 1 && !preview;
          ok('预览取消出口与落子确认互不干扰', cancelOk && confirmOk, JSON.stringify({ cancelOk, confirmOk }));
        } catch (err) {
          details.push({ name: '自测异常', ok: false, detail: String((err && err.message) || err) });
        } finally {
          restoreState(before);
          if (beforeSave) A.RunSave.save('gomoku', beforeSave.data, { score: beforeSave.score, summary: beforeSave.summary });
          else autosave.clear();
          syncAll();
        }
        const fail = details.filter((item) => !item.ok).length;
        return { pass: details.length - fail, fail, details };
      }

      function whiteFiveBoard() {
        return fixture(emptyBoard(), [[2, 1, WHITE], [2, 2, WHITE], [2, 3, WHITE], [2, 4, WHITE], [2, 5, WHITE]]);
      }

      function playToEnd(seedOverride) {
        /* 用确定性策略自动下完一局，走真实结算路径（recordPlay + 结算弹层）。
           可选 seed 仅用于验收时复现不同对局；不传则用固定 TEST_SEED。
           0.10.0：异常或无合法落点时如实返回失败，不伪装和棋、不弹结算、不写记录。 */
        startGame();
        const seed = Number.isInteger(seedOverride) && seedOverride >= 0 ? seedOverride >>> 0 : TEST_SEED;
        aiSeed = seed;
        aiCalls = 0;
        rng = makeRng(aiSeed);
        let guard = 0;
        let reason = null;
        try {
          while (state === 'playing' && guard < 400) {
            guard += 1;
            if (turn === BLACK) {
              const mv = pickAutoMove();
              if (!mv) {
                reason = 'no-move';
                break;
              }
              if (!applyPlayerMove(mv.r, mv.c)) {
                reason = 'place-failed';
                break;
              }
            } else {
              if (!performAIMove()) {
                reason = 'ai-failed';
                break;
              }
            }
            if (state === 'playing' && turn === WHITE) {
              if (!performAIMove()) {
                reason = 'ai-failed';
                break;
              }
            }
          }
          if (!reason && state === 'playing' && guard >= 400) reason = 'guard-exceeded';
        } catch (err) {
          reason = 'exception';
        }
        if (reason) {
          return {
            ok: false,
            reason,
            result: null,
            moves,
            score,
            recorded: recordSaved,
            overlay: !dom.overlay.hidden,
          };
        }
        const rec = A.Progress.get('gomoku');
        return {
          ok: true,
          reason: null,
          result,
          moves,
          score,
          plays: rec.plays,
          high: rec.high,
          overlay: !dom.overlay.hidden,
          overlayTitle: dom.ovTitle.textContent,
          last: lastRecord,
        };
      }

      /* 0.10.0：异常退出不伪装和棋/不写记录的确定性回归。 */
      function runRegression() {
        const details = [];
        let pass = 0;
        let fail = 0;
        function ok(name, cond, detail) {
          details.push({ name, ok: !!cond, detail: cond ? '' : String(detail == null ? '' : detail) });
          if (cond) pass += 1;
          else fail += 1;
        }
        const before = captureState();
        const beforeSave = A.RunSave.get('gomoku');
        const originalPick = pickAutoMove;
        const originalRecord = A.Progress.recordPlay;
        let recorded = 0;
        try {
          /* 强制自动落子失败：playToEnd 必须返回 ok=false，不进入 over，不弹结算，不写记录。 */
          pickAutoMove = function forcedNoMove() {
            return null;
          };
          A.Progress.recordPlay = function regressionSpy() {
            recorded += 1;
            return { isNewHigh: false, high: 0, plays: 0 };
          };
          const failed = playToEnd(TEST_SEED);
          ok(
            'playToEnd 异常退出不伪装和棋/不写记录',
            failed && failed.ok === false && failed.reason === 'no-move' && state === 'playing' && dom.overlay.hidden === true && recorded === 0 && result === null,
            JSON.stringify({ failed, state, overlayHidden: dom.overlay.hidden, recorded, result })
          );
        } catch (err) {
          ok('回归执行无异常', false, String(err && err.stack ? err.stack : err));
        } finally {
          pickAutoMove = originalPick;
          A.Progress.recordPlay = originalRecord;
          restoreState(before);
          if (beforeSave) A.RunSave.save('gomoku', beforeSave.data, { score: beforeSave.score, summary: beforeSave.summary });
          else autosave.clear();
          syncAll();
          syncPlaceButton();
        }
        return { pass, fail, details };
      }

      function pickAutoMove() {
        const cands = candidateMoves(board);
        if (!cands.length) return { r: 5, c: 5 };
        for (let i = 0; i < cands.length; i += 1) {
          if (wouldWin(board, cands[i].r, cands[i].c, BLACK)) return cands[i];
        }
        for (let i = 0; i < cands.length; i += 1) {
          if (wouldWin(board, cands[i].r, cands[i].c, WHITE)) return cands[i];
        }
        return chooseAIMove(board, BLACK, null) || cands[0];
      }

      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            const progress = A.Progress.get('gomoku');
            return {
              boardGeometry: { x: BOARD.x, y: BOARD.y, w: BOARD.w, h: BOARD.h, grid: GRID, gridX: GRID_X, gridY: GRID_Y, stoneR: STONE_R },
              resultReview: { isResult: dom.overlay.classList.contains('is-result') && !dom.overlay.hidden, reviewVisible: ui.reviewVisible, hidden: !dom.overlay.hidden && !!dom.overlay.querySelector('.overlay-panel.review-hidden'), fabVisible: ui.reviewState.fabVisible },
              state,
              turn,
              turnName: turn === BLACK ? 'black' : 'white',
              moves,
              score,
              result,
              preview: preview ? { r: preview.r, c: preview.c } : null,
              lastMove: lastMove ? { r: lastMove.r, c: lastMove.c } : null,
              winLine: winInfo ? winInfo.line.map((p) => ({ r: p.r, c: p.c })) : null,
              seed: aiSeed,
              randCalls: aiCalls,
              tools: { undo: tools.undo, hint: tools.hint },
              hint: hint && hintTimer > 0 ? { r: hint.r, c: hint.c, seconds: Math.round(hintTimer * 10) / 10 } : null,
              plays: progress.plays,
              high: progress.high,
              overlay: !dom.overlay.hidden,
              overlayTitle: dom.ovTitle.textContent,
            };
          },
          joyInfo() {
            return { tools: { undo: tools.undo, hint: tools.hint }, state, turn, moves, seed: aiSeed };
          },
          board() {
            return boardToLetters(board);
          },
          setSeed(value) {
            const seed = Number(value);
            if (!Number.isInteger(seed)) return false;
            aiSeed = seed >>> 0;
            aiCalls = 0;
            rng = makeRng(aiSeed);
            return true;
          },
          place(r, c) {
            const rr = Math.floor(Number(r));
            const cc = Math.floor(Number(c));
            if (!inBoard(rr, cc)) return false;
            if (state !== 'playing') {
              if (state === 'paused') resumeGame();
              else startGame();
            }
            if (state !== 'playing' || board[rr][cc] !== EMPTY) return false;
            board[rr][cc] = BLACK;
            moves += 1;
            lastMove = { r: rr, c: cc };
            preview = null;
            hint = null;
            hintTimer = 0;
            aiDelay = 0;
            const end = evaluateEnd(board, moves);
            if (end.over) finishGame(end.result, end.winInfo);
            else {
              turn = BLACK;
              syncAll();
              autosave.saveNow();
            }
            return true;
          },
          aiMove() {
            if (state !== 'playing') {
              if (state === 'paused') resumeGame();
              else startGame();
            }
            if (state !== 'playing') return null;
            aiDelay = 0;
            return performAIMove();
          },
          playToEnd(seed) {
            return playToEnd(seed);
          },
          /* 0.11.5：预览取消出口钩子（供 CDP 门禁验证取消/确认互不干扰）。 */
          cancelPreview() {
            return cancelPreview();
          },
          actionButtons() {
            const rect = (el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height), text: el.textContent, disabled: el.disabled, opacity: getComputedStyle(el).opacity }; };
            return { cancel: rect(cancelButton), place: rect(placeButton), geometry: { cancel: CANCEL_BTN, place: PLACE_RECT, minCss: PLACE_BTN_MIN_CSS } };
          },
          selftest() {
            return selftest();
          },
          regression() {
            return runRegression();
          },
          /* 0.17 职业委托：真实落子 / 悔棋的测试驱动（仅 #test，不新增生产入口）。
             moveNow 走 applyPlayerMove（与「落子」确认按钮同一条提交路径），
             autoMove 先按真实 AI 路径补上对手应手、再用本局确定性策略真实落子，
             undoNow 走真实 applyUndo；结束路径用既有 playToEnd / 暂停弹层，不另造结算入口。 */
          moveNow(r, c) {
            const rr = Math.floor(Number(r));
            const cc = Math.floor(Number(c));
            if (!inBoard(rr, cc)) return false;
            if (state !== 'playing') {
              if (state === 'paused') resumeGame();
              else if (state === 'ready' || state === 'over') startGame();
            }
            if (state !== 'playing') return false;
            if (turn !== BLACK) performAIMove();
            if (state !== 'playing' || turn !== BLACK) return false;
            return applyPlayerMove(rr, cc);
          },
          autoMove() {
            if (state !== 'playing') {
              if (state === 'paused') resumeGame();
              else if (state === 'ready' || state === 'over') startGame();
            }
            if (state !== 'playing') return null;
            if (turn !== BLACK) performAIMove();
            if (state !== 'playing' || turn !== BLACK) return null;
            const mv = pickAutoMove();
            if (!mv) return null;
            return applyPlayerMove(mv.r, mv.c) ? { r: mv.r, c: mv.c } : null;
          },
          undoNow() {
            /* 真实悔棋：先把真实 AI 应手补上（悔棋一次撤回自己一步 + AI 一步），再走 applyUndo。 */
            if (state === 'paused') resumeGame();
            if (state !== 'playing') return false;
            if (turn !== BLACK) performAIMove();
            if (state !== 'playing') return false;
            return applyUndo();
          },
        };
        /* 0.17 职业委托只读钩子：只在 ?careerTest=1 追加；生产 URL 与既有 #test 探针不变。 */
        if (/(?:^|[?&])careerTest=1(?:&|$)/.test(String((window.location && window.location.search) || ''))) {
          window.__arcadeTest.careerInfo = function careerInfo() {
            const run = readCareerRun();
            const goal = careerGoalParts();
            const goalEls = Array.prototype.slice.call(document.querySelectorAll('[data-career-goal]'));
            const visibleGoalEl = goalEls.filter((el) => el.getClientRects().length > 0)[0] || null;
            const hintGoalEl = hintEl ? hintEl.querySelector('[data-career-goal]') : null;
            const panelGoalEl = dom.overlay.querySelector('[data-career-goal]');
            const progress = A.Progress.get('gomoku');
            let runSave = null;
            try {
              runSave = A.RunSave.get('gomoku');
            } catch (err) {
              runSave = null;
            }
            let bridgeInfo = null;
            try {
              bridgeInfo = window.__arcadeCareerTest && typeof window.__arcadeCareerTest.info === 'function' ? window.__arcadeCareerTest.info() : null;
            } catch (err) {
              bridgeInfo = null;
            }
            return {
              isCommission: !!run,
              locked: careerLocked,
              chrome: document.body.classList.contains('is-career-run'),
              settled: careerSettled
                ? {
                  pending: careerSettled.pending === true,
                  ok: careerSettled.ok === true,
                  reason: careerSettled.reason || null,
                  credits: Number(careerSettled.credits) || 0,
                  duplicate: careerSettled.duplicate === true,
                }
                : null,
              commissionId: run ? run.commissionId : careerGoalSource ? careerGoalSource.commissionId || null : null,
              objectiveKind: goal ? goal.kind : null,
              atLeast: goal ? goal.atLeast : null,
              objectiveText: goal ? careerGoalText(goal) : null,
              moveEvents: careerMoveEvents,
              finishEvents: careerFinishEvents,
              lastMove: careerLastMove ? { moves: careerLastMove.moves, col: careerLastMove.col, row: careerLastMove.row } : null,
              lastFinish: careerLastFinish ? { result: careerLastFinish.result, moves: careerLastFinish.moves } : null,
              state,
              turn: turn === BLACK ? 'black' : 'white',
              moves,
              score,
              result,
              tools: { undo: tools.undo, hint: tools.hint },
              serializeNull: serialize() === null,
              runSavePresent: !!runSave,
              goalLineVisible: !!visibleGoalEl,
              goalLineText: visibleGoalEl ? String(visibleGoalEl.textContent || '') : goalEls.length ? String(goalEls[0].textContent || '') : null,
              goalLineHeight: visibleGoalEl ? Math.round(visibleGoalEl.getBoundingClientRect().height) : 0,
              goalInHint: !!hintGoalEl && hintGoalEl.getClientRects().length > 0,
              goalInPanel: !!panelGoalEl && panelGoalEl.getClientRects().length > 0,
              /* 本页自 0.14 起没有挑战模式入口（无 challenge 脚本、无 mode 选择）；
                 职业 run 更不会新增任何入口，因此恒为 false。 */
              challengeVisible: false,
              hintText: hintEl ? String(hintEl.textContent || '') : '',
              overlay: !dom.overlay.hidden,
              overlayTitle: dom.ovTitle.textContent,
              overlayBtn: dom.ovBtn ? dom.ovBtn.textContent : null,
              overlayBtn2: dom.ovBtn2 && !dom.ovBtn2.hidden ? dom.ovBtn2.textContent : null,
              plays: progress.plays,
              high: progress.high,
              bridgeRunTicketId: bridgeInfo && bridgeInfo.commissionRun ? bridgeInfo.commissionRun.ticketId || null : null,
              lastCommissionResult: bridgeInfo && bridgeInfo.commissionLastResult ? bridgeInfo.commissionLastResult : null,
            };
          };
        }
      }

      /* ----------------------------------------------------------
       * 启动
       * ---------------------------------------------------------- */
      resetGame();
      state = 'ready';

      /* 开局弹层（0.16 行为逐字保留）：只有经典路径会读旧 RunSave。 */
      function prepareStartScreen() {
        if (careerLocked) {
          showStart();
          return;
        }
        const saved = autosave.load();
        if (saved && saved.data && typeof saved.data === 'object') {
          A.showResumePrompt(ui, saved, {
            name: '五子棋 · 静局',
            onResume: () => {
              if (restore(saved.data)) {
                state = 'playing';
                ui.hide();
                loop.resume();
                input.endFrame();
                syncAll();
                autosave.saveNow();
              } else {
                autosave.clear();
                showStart();
              }
            },
            onRestart: () => {
              autosave.clear();
              showStart();
            },
          });
        } else {
          showStart();
        }
      }

      /* 0.17 职业入口：URL 带 ?career=<ticketId> 时先等 bridge 确认 ticket，再决定
         「职业开局弹层」还是经典开局；无参数时同步走 0.16 路径（零延迟、零行为变化）。 */
      function bootStartScreen() {
        const ticketId = careerTicketParam();
        const ready = career && career.ready;
        if (!ticketId || !career || !ready || typeof ready.then !== 'function') {
          prepareStartScreen();
          return;
        }
        let settled = false;
        let guard = null;
        const finishBoot = () => {
          if (settled) return;
          settled = true;
          try {
            if (guard) clearTimeout(guard);
          } catch (err) {
            /* ignore */
          }
          /* 只有 bridge 确认了属于本游戏的 run 才锁死经典记录；否则按经典开局（fail-open）。 */
          const runInfo = readCareerRun();
          if (runInfo) activateCareerRun(runInfo);
          prepareStartScreen();
        };
        try {
          guard = setTimeout(finishBoot, 3500);
        } catch (err) {
          guard = null;
        }
        Promise.resolve(ready).then(finishBoot, finishBoot);
      }
      bootStartScreen();
      loop.start();
    })();
  </script>
</body>
