<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="雪铃：兔子跳铃铛连击游戏，铃铛落点保证可跳达，连击越高铃音越高，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/snowbells.js"></script>
  <style>
    .challenge-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; background: rgba(8, 13, 28, 0.96); border-radius: inherit; }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-btn[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud { position: absolute; left: 8px; right: 8px; top: 8px; width: auto; z-index: 4; pointer-events: none; }
  </style>
  <title>雪铃 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#2fa8a0; --card-accent:#2fa8a0">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🐰 雪铃</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="雪铃游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>雪铃</h2>
            <p data-ov-text>兔子跳铃铛</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <div class="touch-pad game-tools" aria-label="可选道具（快捷键 1 / 2）">
      <button type="button" class="touch-btn" data-joy-tool="magnet" aria-label="铃磁，剩余 2 次（快捷键 1）"><span aria-hidden="true">🧲</span> 铃磁 <strong data-joy-count>2</strong></button>
      <button type="button" class="touch-btn" data-joy-tool="encore" aria-label="安可，剩余 2 次（快捷键 2）"><span aria-hidden="true">🎵</span> 安可 <strong data-joy-count>2</strong></button>
    </div>
    <p class="game-hint">←→ / A D 或触摸左右半屏移动 · 踩铃铛连跳 · 1 铃磁 / 2 安可 · 连击越高得分越多 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const GRAVITY = 1350;
      const BOUNCE_V = -655;
      const PLAYER_R = 13;
      const BELL_R = 9;
      const MAX_JUMP_RISE = (BOUNCE_V * BOUNCE_V) / (2 * GRAVITY); /* ≈159px */
      const MAGNET_DURATION = 6;
      const MAGNET_BONUS = 14;
      const ENCORE_HITS = 2;
      const JOY_START = { magnet: 2, encore: 2 };
      const JOY_CAPS = { magnet: 2, encore: 2 };

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);
      const joyButtons = {
        magnet: document.querySelector('[data-joy-tool="magnet"]'),
        encore: document.querySelector('[data-joy-tool="encore"]'),
      };

      const particles = A.createParticles();

      /* ---------- 0.9 挑战模式：固定铃序关卡（数据/记录/选关由 A.Challenge 提供） ---------- */
      const gameId = 'snowbells';
      const challengeData = A.Challenge ? A.Challenge.stages(gameId) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      const CH_ORIGIN_Y = H - 120;
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chBells = [];
      let chSequence = [];
      let chSeqIndex = 0;
      let chOptional = [];
      let chCollectibles = [];
      let chWrongHits = 0;
      let chElapsed = 0;
      let chAssisted = false;
      let chErrorReason = '';
      let chLastResult = null;
      let chCombo = 0;
      let chGoalHintTimer = 0;
      let chHudSecond = -1;

      const player = { x: W / 2, y: H - 150, vx: 0, vy: 0, face: 1, prevBottom: 0, onPad: true };
      let bells = [];
      let rings = [];
      let pad = null;
      let camY = 0;
      let genY = 0;
      let topY = 0;
      let startY = 0;
      let combo = 0;
      let bellScore = 0;
      let score = 0;
      let state = 'ready';
      let recordSaved = false;
      let snow = [];
      let prevXs = [];
      const tools = { magnet: JOY_START.magnet, encore: JOY_START.encore };
      let magnetTimer = 0;
      let encoreHits = 0;

      let high = A.Progress.get('snowbells').high;
      dom.hudHigh.textContent = String(high);

      for (let i = 0; i < 60; i++) {
        snow.push({ x: rand(0, W), y: rand(0, H), v: rand(14, 44), s: rand(1, 2.6), drift: rand(-8, 8) });
      }

      function heightScore() {
        return Math.max(0, Math.floor((startY - topY) / 10));
      }
      function syncHud() {
        if (mode === 'challenge') {
          syncChallengeHud();
          return;
        }
        score = bellScore + heightScore();
        dom.hudScore.textContent = String(score);
      }

      /* ---------- 铃铛生成：每一排都从上一排可达位置出发 ---------- */
      function ensureBells() {
        const genLine = camY - 120;
        while (genY > genLine) {
          const firstRow = prevXs.length === 0;
          const depth = Math.max(0, -genY);
          const density = clamp(1 - depth / 26000, 0.58, 1);
          /* 第一排固定两颗居中铃铛，保证从雪台起跳就能踩到。 */
          const gap = firstRow ? rand(78, 98) : rand(88, Math.min(118, MAX_JUMP_RISE - 26));
          genY -= gap;

          let xs;
          if (firstRow) {
            /* 第一颗正对雪台中心，起跳必中；第二颗在可达范围内提供选择。 */
            xs = [W / 2, W / 2 + 82];
          } else {
            const anchor = prevXs[randInt(0, prevXs.length - 1)];
            const spread = 96;
            const x1 = clamp(anchor + rand(-spread, spread), 26, W - 26);
            xs = [x1];
            const count = Math.random() < density * 0.72 ? 2 : 1;
            if (count === 2) {
              const dir = Math.random() < 0.5 ? -1 : 1;
              let x2 = clamp(x1 + dir * rand(72, 96), 26, W - 26);
              if (Math.abs(x2 - x1) < 56) x2 = clamp(x1 - dir * 84, 26, W - 26);
              if (Math.abs(x2 - x1) >= 56) xs.push(x2);
            }
          }
          xs.forEach((x) => bells.push({ x, y: genY, r: BELL_R, phase: rand(0, TAU), consumed: false }));
          prevXs = xs;
        }
        bells = bells.filter((b) => b.y < camY + H + 200);
      }

      /* ---------- 每局主动道具 ---------- */
      function syncJoyTools() {
        Object.keys(joyButtons).forEach((id) => {
          const button = joyButtons[id];
          const active = id === 'magnet' ? magnetTimer > 0 : encoreHits > 0;
          const name = id === 'magnet' ? '铃磁' : '安可';
          const detail = id === 'magnet' ? '6 秒内扩大铃铛碰撞半径' : '接下来两颗铃铛得分翻倍';
          button.querySelector('[data-joy-count]').textContent = String(tools[id]);
          button.disabled = state !== 'playing' || tools[id] <= 0 || active;
          button.classList.toggle('is-armed', active);
          button.setAttribute('aria-pressed', String(active));
          button.setAttribute('aria-label', name + '，' + detail + '，剩余 ' + tools[id] + ' 次（快捷键 ' + (id === 'magnet' ? '1' : '2') + '）');
        });
      }
      function useJoy(id) {
        if (state !== 'playing' || !Object.prototype.hasOwnProperty.call(tools, id) || tools[id] <= 0) return false;
        if (id === 'magnet') {
          if (magnetTimer > 0) return false;
          tools.magnet -= 1;
          magnetTimer = MAGNET_DURATION;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('spring');
        } else if (id === 'encore') {
          if (encoreHits > 0) return false;
          tools.encore -= 1;
          encoreHits = ENCORE_HITS;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('bell', 4);
        } else {
          return false;
        }
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      Object.keys(joyButtons).forEach((id) => {
        joyButtons[id].addEventListener('click', () => useJoy(id));
      });
      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        const target = e.target;
        if (target && target.tagName) {
          const tag = target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        }
        const id = { '1': 'magnet', '2': 'encore' }[e.key];
        if (!id) return;
        e.preventDefault();
        useJoy(id);
      });

      /* ---------- 流程 ---------- */
      function reset() {
        bells = [];
        rings = [];
        camY = 0;
        genY = H - 120;
        combo = 0;
        bellScore = 0;
        recordSaved = false;
        prevXs = [];
        tools.magnet = JOY_START.magnet;
        tools.encore = JOY_START.encore;
        magnetTimer = 0;
        encoreHits = 0;
        player.x = W / 2;
        player.y = H - 150;
        player.vx = 0;
        player.vy = 0;
        player.onPad = true;
        startY = player.y;
        topY = player.y;
        pad = { x: W / 2 - 60, y: H - 100, w: 120, h: 14 };
        particles.clear();
        ensureBells();
        syncHud();
        syncJoyTools();
      }

      function startGame() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
      }

      function gameOver() {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        syncHud();
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('snowbells', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          title: '坠入雪夜',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `铃铛分 ${bellScore} + 高度 ${heightScore()} · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync(); syncJoyTools();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        const opts = {
          title: '已暂停',
          text: '铃铛在夜色中等你。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge') {
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        }
        ui.show(opts);
        pauseUi.sync(); syncJoyTools();
      }

      function showStart() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        ui.show({
          title: '雪铃',
          text: '兔子跳铃铛：踩中铃铛向上弹。<br/>每排铃铛都从上一排可达位置生成<br/>连击越高，铃音越高、得分越多',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeAvailable ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }

      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(gameId);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }

      function showChallengePanel() {
        if (!challengeAvailable) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        if (chDom.back) chDom.back.hidden = false;
        loop.pause();
        state = 'challenge-menu';
        pauseUi.sync();
      }

      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        if (chDom.back) chDom.back.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }

      function backToStartFromPanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        showStart();
        pauseUi.sync();
        syncJoyTools();
      }

      function buildChallengeStage(index) {
        const stage = challengeData[index];
        if (!stage) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = index;
        const content = stage.content || {};
        const list = Array.isArray(content.bells) ? content.bells : [];
        chBells = list.map((bell) => ({
          id: String(bell.id),
          x: Number(bell.xCenter),
          y: CH_ORIGIN_Y - Number(bell.height || 0),
          r: Number(bell.radius) || BELL_R,
          kind: bell.kind || 'normal',
          phase: 0,
          consumed: false,
        }));
        chSequence = (Array.isArray(content.requiredSequence) ? content.requiredSequence : []).map(String);
        chOptional = chBells.filter((bell) => bell.kind === 'bonus').map((bell) => bell.id);
        chSeqIndex = 0;
        chCollectibles = [];
        chWrongHits = 0;
        chElapsed = 0;
        chAssisted = false;
        chErrorReason = '';
        chLastResult = null;
        chCombo = 0;
        chGoalHintTimer = 3;
        chHudSecond = -1;
        bells = [];
        rings = [];
        pad = null;
        camY = 0;
        magnetTimer = 0;
        encoreHits = 0;
        tools.magnet = JOY_START.magnet;
        tools.encore = JOY_START.encore;
        const first = chBells.find((bell) => bell.id === (content.startBell || chSequence[0]));
        player.x = first ? first.x : W / 2;
        player.y = first ? first.y - 70 : H - 260;
        player.vx = 0;
        player.vy = 0;
        player.face = 1;
        player.onPad = false;
        startY = player.y;
        topY = player.y;
        particles.clear();
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) return;
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chElapsed);
        if (second === chHudSecond && state === 'playing') return;
        chHudSecond = second;
        const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0');
        const done = chSequence.slice(0, chSeqIndex).join('→');
        const next = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : '完成';
        chDom.hud.innerHTML =
          '<strong>' + chEsc(label + ' ' + chStage.title) + '</strong>' +
          '<span>' + chEsc(chStage.goalStatement || '') + '</span>' +
          '<span>下一铃 ' + chEsc(next) + '</span>' +
          '<span>进度 ' + chEsc((done ? done + '→' : '') + next) + (chSeqIndex >= chSequence.length ? '' : '') + '</span>' +
          '<span>连击 ×' + chCombo + ' · 错 ' + chWrongHits + '</span>' +
          '<span>用时 ' + A.Challenge.formatTime(chElapsed) + '</span>';
      }

      function startChallenge(ref) {
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(gameId, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(gameId, stage.id)) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        state = 'playing';
        hideChallengePanel();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        syncChallengeHud();
        autosave.clear();
        autosave.saveNow();
        return true;
      }

      function challengeHitBell(bell) {
        const content = chStage.content || {};
        const expected = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null;
        if (bell.kind === 'bonus') {
          if (bell.consumed) return;
          bell.consumed = true;
          chCollectibles.push(bell.id);
          player.vy = BOUNCE_V;
          A.Sfx.play('bell', 6);
          rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '彩铃 +' + bell.id });
          syncChallengeHud();
          autosave.saveNow();
          return;
        }
        if (bell.id === expected) {
          bell.consumed = true;
          chSeqIndex += 1;
          player.vy = BOUNCE_V;
          player.lastBellY = player.y;
          if (bell.kind === 'rest') {
            A.Sfx.play('ui');
            rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '休止' });
          } else {
            chCombo += 1;
            A.Sfx.play('bell', Math.min(chCombo, 12));
            rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '命中 ' + bell.id + ' ×' + chCombo });
          }
          particles.emit(bell.x, bell.y, {
            count: A.reducedMotion ? 4 : 10,
            speed: [30, 140],
            life: [0.25, 0.6],
            size: [1.5, 3.5],
            colors: ['#ffd23f', '#fff3c4', '#ffffff'],
            gravity: 200,
          });
          syncChallengeHud();
          if (chSeqIndex >= chSequence.length && content.goalAfterLast !== false) {
            challengeClear();
            return;
          }
          autosave.saveNow();
          return;
        }
        /* 错序：可反弹但不计分、不消耗该铃（后续仍可命中），连击中断。 */
        player.vy = BOUNCE_V;
        player.lastBellY = player.y;
        chCombo = 0;
        chWrongHits += 1;
        A.Sfx.play('land');
        rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '错序，目标是 ' + (expected || '—') });
        syncChallengeHud();
      }

      function updateChallenge(dt) {
        particles.update(dt);
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life -= dt;
          r.r += 90 * dt;
          if (r.life <= 0) rings.splice(i, 1);
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chElapsed += dt;
        chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
        const hadMagnet = magnetTimer > 0;
        magnetTimer = Math.max(0, magnetTimer - dt);
        if (hadMagnet && magnetTimer <= 0) {
          syncJoyTools();
          autosave.saveNow();
        }
        const ACC = 2100;
        const MAX_VX = 250;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) dir = input.pointer.x < W / 2 ? -1 : 1;
        if (dir !== 0) {
          player.vx += dir * ACC * dt;
          player.face = dir;
        } else {
          player.vx -= player.vx * Math.min(1, 10 * dt);
        }
        player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
        player.x += player.vx * dt;
        if (player.x < PLAYER_R) {
          player.x = PLAYER_R;
          player.vx = 0;
        } else if (player.x > W - PLAYER_R) {
          player.x = W - PLAYER_R;
          player.vx = 0;
        }
        player.prevBottom = player.y + PLAYER_R;
        player.vy = Math.min(950, player.vy + GRAVITY * dt);
        player.y += player.vy * dt;
        if (player.vy > 40) {
          for (const bell of chBells) {
            if (bell.consumed) continue;
            if (Math.abs(bell.y - player.y) > 60) continue;
            if (A.Physics.circleCircle(player.x, player.y, PLAYER_R, bell.x, bell.y, bell.r + (magnetTimer > 0 ? MAGNET_BONUS : 0))) {
              challengeHitBell(bell);
              if (state !== 'playing') break;
            }
          }
        }
        if (player.y > H + 40) {
          challengeFail('落空坠回雪地：先预判下一颗铃的横向位置再起跳');
          input.endFrame();
          return;
        }
        syncChallengeHud();
        input.endFrame();
      }

      function challengeClear() {
        if (mode !== 'challenge' || !chStage) return false;
        state = 'cleared';
        chGoalHintTimer = 0;
        autosave.clear();
        loop.pause();
        syncJoyTools();
        const result = { timeSec: Math.round(chElapsed * 10) / 10, assisted: chAssisted, collectibles: chCollectibles.slice() };
        chLastResult = result;
        if (A.Challenge) A.Challenge.markCleared(gameId, chStage.id, result);
        const isLast = chStageIndex >= challengeData.length - 1;
        const marks = chCollectibles.length ? '彩铃 ' + chCollectibles.join('/') : '未收集彩铃';
        ui.show({
          title: '挑战通关',
          text: A.Challenge.resultHtml(chStage, result) + '<p class="ac-challenge-tip">' + chEsc(chStage.goalStatement || '') + ' · ' + chEsc(marks) + '</p>',
          btn: isLast ? '返回选关' : '下一关',
          onBtn: () => {
            if (isLast) exitToChallengeSelect();
            else startChallenge(challengeData[chStageIndex + 1].id);
          },
          btn2: '重玩本关',
          onBtn2: () => startChallenge(chStage.id),
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        chErrorReason = reason || '本关失败';
        autosave.clear();
        loop.pause();
        syncJoyTools();
        ui.show({
          title: '挑战失败',
          text:
            '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
            '<p class="ac-challenge-result-row">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>',
          btn: '重试本关',
          onBtn: () => startChallenge(chStage.id),
          btn2: '返回选关',
          onBtn2: exitToChallengeSelect,
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chBells = [];
        chLastResult = null;
        chErrorReason = '';
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showChallengePanel();
        return true;
      }

      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chBells = [];
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showStart();
        return true;
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(gameId, data.stageId);
        if (!stage) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        if (Array.isArray(data.chConsumed)) {
          for (const id of data.chConsumed) {
            const bell = chBells.find((item) => item.id === id);
            if (bell) bell.consumed = true;
          }
        }
        chSeqIndex = clamp(Math.floor(Number(data.chSeqIndex) || 0), 0, chSequence.length);
        chCombo = Math.max(0, Number(data.chCombo) || 0);
        chWrongHits = Math.max(0, Number(data.chWrongHits) || 0);
        chCollectibles = Array.isArray(data.chCollectibles) ? data.chCollectibles.filter((id) => typeof id === 'string') : [];
        chElapsed = Math.max(0, Number(data.chElapsed) || 0);
        chAssisted = !!data.chAssisted;
        if (data.player && isFinite(data.player.x) && isFinite(data.player.y)) {
          player.x = clamp(Number(data.player.x), PLAYER_R, W - PLAYER_R);
          player.y = Number(data.player.y);
          player.vx = Number(data.player.vx) || 0;
          player.vy = Number(data.player.vy) || 0;
        }
        state = 'playing';
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function challengeObservable() {
        const next = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null;
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageNumber: chStage ? chStage.stageNumber : null,
          state,
          bells: chBells.map((bell) => ({ id: bell.id, x: bell.x, y: bell.y, kind: bell.kind, consumed: bell.consumed, optional: bell.kind === 'bonus' })),
          sequence: chSequence.slice(),
          seqIndex: chSeqIndex,
          nextBellId: next,
          combo: chCombo,
          wrongHits: chWrongHits,
          collectibles: chCollectibles.slice(),
          player: { x: player.x, y: player.y, vx: player.vx, vy: player.vy },
          elapsedSec: Math.round(chElapsed * 10) / 10,
          assisted: chAssisted,
          goalStatement: chStage ? chStage.goalStatement : null,
          errorReason: chErrorReason,
          cleared: !!chLastResult,
          hudHidden: gameHudEl ? gameHudEl.hidden : null,
        };
      }


      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: mode === 'challenge' && chStage ? chStage.id : null,
          chSeqIndex,
          chCombo,
          chWrongHits,
          chCollectibles: chCollectibles.slice(),
          chConsumed: chBells.filter((bell) => bell.consumed).map((bell) => bell.id),
          chElapsed,
          chAssisted,
          player: { x: player.x, y: player.y, vx: player.vx, vy: player.vy, face: player.face, onPad: player.onPad, lastBellY: player.lastBellY },
          bells: bells.map((b) => ({ x: b.x, y: b.y, phase: b.phase, consumed: !!b.consumed })),
          pad,
          camY,
          genY,
          topY,
          startY,
          combo,
          bellScore,
          prevXs,
          tools: { magnet: tools.magnet, encore: tools.encore },
          magnetTimer,
          encoreHits,
        };
      }

      function restoreClassic(data) {
        if (!data || !data.player || !Array.isArray(data.bells)) return false;
        try {
          reset();
          bells = data.bells
            .filter((b) => b && isFinite(b.x) && isFinite(b.y))
            .map((b) => ({ x: clamp(Number(b.x), 20, W - 20), y: Number(b.y), r: BELL_R, phase: Number(b.phase) || 0, consumed: !!b.consumed }));
          player.x = clamp(Number(data.player.x) || W / 2, PLAYER_R, W - PLAYER_R);
          player.y = Number(data.player.y) || H - 150;
          player.vx = Number(data.player.vx) || 0;
          player.vy = Number(data.player.vy) || 0;
          player.face = data.player.face === -1 ? -1 : 1;
          player.onPad = !!data.player.onPad;
          player.lastBellY = typeof data.player.lastBellY === 'number' && isFinite(data.player.lastBellY) ? Number(data.player.lastBellY) : null;
          if (data.pad && isFinite(data.pad.x)) {
            pad = { x: Number(data.pad.x), y: Number(data.pad.y), w: Number(data.pad.w) || 120, h: 14 };
          }
          camY = Number(data.camY) || 0;
          genY = Number(data.genY) || H - 120;
          startY = Number(data.startY) || player.y;
          topY = Number(data.topY) || player.y;
          combo = Math.max(0, Number(data.combo) || 0);
          bellScore = Math.max(0, Number(data.bellScore) || 0);
          prevXs = Array.isArray(data.prevXs) ? data.prevXs.filter((x) => isFinite(x)) : [];
          tools.magnet = data.tools && Number.isFinite(Number(data.tools.magnet))
            ? clamp(Math.floor(Number(data.tools.magnet)), 0, JOY_CAPS.magnet)
            : JOY_START.magnet;
          tools.encore = data.tools && Number.isFinite(Number(data.tools.encore))
            ? clamp(Math.floor(Number(data.tools.encore)), 0, JOY_CAPS.encore)
            : JOY_START.encore;
          magnetTimer = clamp(Number(data.magnetTimer) || 0, 0, MAGNET_DURATION);
          encoreHits = clamp(Math.floor(Number(data.encoreHits) || 0), 0, ENCORE_HITS);
          recordSaved = false;
          syncHud();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      /* 统一恢复入口：0.8 及更早存档缺 mode 一律按经典恢复；mode:'challenge' 走挑战恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      const autosave = A.createRunAutosave('snowbells', serialize, {
        every: 4,
        meta: () => ({ score, summary: mode === 'challenge' && chStage ? '挑战 ' + chStage.id + ' · 进度 ' + chSeqIndex + '/' + chSequence.length : `得分 ${score} · 连击 ${combo}` }),
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        particles.update(dt);
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life -= dt;
          r.r += 90 * dt;
          if (r.life <= 0) rings.splice(i, 1);
        }
        snow.forEach((s) => {
          s.y += s.v * dt;
          s.x += s.drift * dt;
          if (s.y > H) {
            s.y = -4;
            s.x = rand(0, W);
          }
          if (s.x < -4) s.x = W + 4;
          if (s.x > W + 4) s.x = -4;
        });
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        const hadMagnet = magnetTimer > 0;
        magnetTimer = Math.max(0, magnetTimer - dt);
        if (hadMagnet && magnetTimer <= 0) {
          syncJoyTools();
          autosave.saveNow();
        }

        const ACC = 2100;
        const MAX_VX = 250;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) dir = input.pointer.x < W / 2 ? -1 : 1;
        if (dir !== 0) {
          player.vx += dir * ACC * dt;
          player.face = dir;
        } else {
          player.vx -= player.vx * Math.min(1, 10 * dt);
        }
        player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
        player.x += player.vx * dt;
        if (player.x < PLAYER_R) {
          player.x = PLAYER_R;
          player.vx = 0;
        } else if (player.x > W - PLAYER_R) {
          player.x = W - PLAYER_R;
          player.vx = 0;
        }

        player.prevBottom = player.y + PLAYER_R;
        player.vy = Math.min(950, player.vy + GRAVITY * dt);
        player.y += player.vy * dt;

        if (pad && player.onPad) {
          if (player.vy > 0 && player.x > pad.x - 6 && player.x < pad.x + pad.w + 6) {
            if (player.prevBottom <= pad.y + 2 && player.y + PLAYER_R >= pad.y) {
              player.y = pad.y - PLAYER_R;
              player.vy = BOUNCE_V;
              combo = 0;
              A.Sfx.play('jump');
            }
          }
        }

        if (player.vy > 40) {
          for (const b of bells) {
            if (b.consumed) continue;
            if (Math.abs(b.y - player.y) > 40) continue;
            if (A.Physics.circleCircle(player.x, player.y, PLAYER_R, b.x, b.y, b.r + (magnetTimer > 0 ? MAGNET_BONUS : 0))) {
              b.consumed = true;
              combo += 1;
              const usedEncore = encoreHits > 0;
              const gain = 10 * combo * (usedEncore ? 2 : 1);
              if (usedEncore) encoreHits -= 1;
              bellScore += gain;
              player.vy = BOUNCE_V;
              player.lastBellY = player.y;
              A.Sfx.play('bell', combo);
              rings.push({ x: b.x, y: b.y, r: BELL_R + 4, life: 0.65, maxLife: 0.65, text: '+' + gain + ' · ×' + combo });
              particles.emit(b.x, b.y, {
                count: A.reducedMotion ? 4 : 10,
                speed: [30, 140],
                life: [0.25, 0.6],
                size: [1.5, 3.5],
                colors: ['#ffd23f', '#fff3c4', '#ffffff'],
                gravity: 200,
              });
              syncHud();
              if (usedEncore) {
                syncJoyTools();
                autosave.saveNow();
              }
              break;
            }
          }
        }

        if (combo > 0 && player.vy > 0 && player.lastBellY != null && player.y - player.lastBellY > 380) combo = 0;
        if (combo > 0) player.lastBellY = Math.min(player.lastBellY, player.y);

        const line = camY + H * 0.42;
        if (player.y < line) camY -= line - player.y;

        if (player.y < topY) {
          topY = player.y;
          syncHud();
        }

        ensureBells();

        if (player.y > camY + H + 30) {
          gameOver();
          input.endFrame();
          return;
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      function drawBell(b) {
        const y = b.y - camY;
        if (y < -20 || y > H + 20) return;
        const bob = Math.sin(b.phase + performance.now() / 700) * 2;
        ctx.save();
        ctx.globalAlpha = b.consumed ? 0.28 : 1;
        ctx.translate(b.x, y + bob);
        ctx.strokeStyle = 'rgba(147,160,200,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -b.r - bob);
        ctx.lineTo(0, -34);
        ctx.stroke();
        const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, b.r + 2);
        g.addColorStop(0, '#ffe9a3');
        g.addColorStop(1, '#e8b83a');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#9c7420';
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.fillStyle = '#9c7420';
        ctx.beginPath();
        ctx.arc(0, b.r - 2, 2.4, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawRabbit() {
        const y = player.y - camY;
        ctx.save();
        ctx.translate(player.x, y);
        const stretch = clamp(1 + player.vy / -3200, 0.85, 1.15);
        ctx.scale(1, stretch);
        ctx.scale(player.face >= 0 ? 1 : -1, 1);
        ctx.fillStyle = '#f4f6ff';
        ctx.strokeStyle = '#c9cfe8';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(-5, -14, 3.6, 10, -0.25, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(5, -14, 3.6, 10, 0.25, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffc9d6';
        ctx.beginPath();
        ctx.ellipse(-5, -14, 1.6, 6, -0.25, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(5, -14, 1.6, 6, 0.25, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#f4f6ff';
        ctx.beginPath();
        ctx.arc(0, 0, PLAYER_R, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#c9cfe8';
        ctx.stroke();
        ctx.fillStyle = '#2c3352';
        ctx.beginPath();
        ctx.arc(4.5, -3, 1.6, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(10, -3, 1.6, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#2c3352';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(7, 1.5, 2.6, 0.15, Math.PI - 0.15);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,180,200,0.7)';
        ctx.beginPath();
        ctx.arc(2, 1.5, 2, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0c1230');
        bg.addColorStop(0.7, '#1b2c55');
        bg.addColorStop(1, '#31527c');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(245,248,255,0.95)';
        ctx.beginPath();
        ctx.arc(340, 96, 34, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#ffd9e8';
        ctx.beginPath();
        ctx.arc(352, 90, 30, 0, TAU);
        ctx.fill();

        const par = (camY * 0.2) % (H + 300);
        ctx.fillStyle = 'rgba(226,236,255,0.10)';
        for (let k = -1; k < 2; k++) {
          const baseY = k * (H + 300) + par + H;
          ctx.beginPath();
          ctx.moveTo(0, baseY);
          ctx.quadraticCurveTo(110, baseY - 120, 240, baseY - 30);
          ctx.quadraticCurveTo(340, baseY + 40, 420, baseY - 60);
          ctx.lineTo(420, baseY + 300);
          ctx.lineTo(0, baseY + 300);
          ctx.closePath();
          ctx.fill();
        }

        (mode === 'challenge' ? chBells : bells).forEach(drawBell);
        if (mode === 'challenge' && chStage) {
          const nextId = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null;
          const nextBell = nextId ? chBells.find((bell) => bell.id === nextId) : null;
          if (nextBell && !nextBell.consumed) {
            const ny = nextBell.y - camY;
            ctx.save();
            ctx.strokeStyle = 'rgba(99,224,200,0.9)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(nextBell.x, ny, nextBell.r + 10 + Math.sin(performance.now() / 220) * 2, 0, TAU);
            ctx.stroke();
            ctx.setLineDash([]);
            A.draw.label(ctx, '下一铃 ' + nextId, clamp(nextBell.x, 42, W - 42), Math.max(64, ny - 26), {
              font: 'bold 12px system-ui',
              color: '#63e0c8',
            });
            ctx.restore();
          }
        }

        if (pad) {
          const py = pad.y - camY;
          if (py > -40 && py < H + 40) {
            ctx.fillStyle = '#dfe8fb';
            A.draw.roundRect(ctx, pad.x, py, pad.w, pad.h, 7);
            ctx.fill();
            ctx.fillStyle = '#b9c8ec';
            ctx.fillRect(pad.x + 6, py + pad.h - 5, pad.w - 12, 3);
          }
        }

        rings.forEach((r) => {
          const y = r.y - camY;
          if (y < -20 || y > H + 20) return;
          ctx.strokeStyle = `rgba(255,210,63,${(r.life / r.maxLife) * 0.7})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(r.x, y, r.r, 0, TAU);
          ctx.stroke();
          if (r.text) {
            A.draw.label(ctx, r.text, clamp(r.x, 54, W - 54), y - 20, {
              font: 'bold 14px system-ui',
              color: '#fff3c4',
              alpha: clamp(r.life / r.maxLife, 0, 1),
            });
          }
        });

        particles.draw(ctx);
        drawRabbit();

        ctx.fillStyle = 'rgba(240,246,255,0.8)';
        snow.forEach((s) => {
          ctx.globalAlpha = 0.35 + (s.s / 2.6) * 0.5;
          ctx.fillRect(s.x, s.y, s.s, s.s);
        });
        ctx.globalAlpha = 1;

        if (mode === 'challenge' && chStage) {
          const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0') + ' ' + chStage.title;
          A.draw.label(ctx, label, 12, 20, { align: 'left', font: 'bold 14px system-ui', color: '#63e0c8' });
          A.draw.label(ctx, '进度 ' + chSeqIndex + '/' + chSequence.length + ' · 连击 ×' + chCombo, W - 12, 20, {
            align: 'right',
            font: 'bold 13px system-ui',
            color: '#ffd23f',
          });
          if (chGoalHintTimer > 0) {
            A.draw.label(ctx, chStage.goalStatement || '', W / 2, 46, { font: '12px system-ui', color: '#ffe08a' });
          }
        } else {
          A.draw.label(ctx, 'SCORE ' + score, 12, 20, { align: 'left', font: 'bold 14px system-ui', color: '#ffd23f' });
          if (combo >= 2) {
            A.draw.label(ctx, 'COMBO ×' + combo, W - 12, 20, { align: 'right', font: 'bold 13px system-ui', color: '#63e0c8' });
          }
        }
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      syncChallengePanel();
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              score,
              bellScore,
              combo,
              consumed: bells.map((b) => !!b.consumed),
              player: { x: player.x, y: player.y, vy: player.vy },
            };
          },
          joyInfo() {
            return {
              tools: { magnet: tools.magnet, encore: tools.encore },
              magnetTimer,
              magnetActive: magnetTimer > 0,
              magnetRadius: BELL_R + (magnetTimer > 0 ? MAGNET_BONUS : 0),
              encoreHits,
              combo,
              bellScore,
              score,
              state,
              lastRingText: rings.length ? rings[rings.length - 1].text || null : null,
            };
          },
          useJoyTool(id) {
            const button = joyButtons[id];
            if (!button || button.disabled) return false;
            button.click();
            return true;
          },
          forceHit(index, dx, dy) {
            const b = bells[index];
            if (!b) return false;
            player.x = b.x + (Number(dx) || 0);
            player.y = b.y + (Number(dy) || 0);
            player.vy = 120;
            return true;
          },
          /* ---------- 0.9 挑战模式钩子（契约见 docs/arcade/0.9/INTEGRATION-CONTRACT.md §5） ---------- */
          challengeStages() {
            return challengeData.map((stage) => {
              const best = A.Challenge.progress(gameId).best[stage.id] || null;
              return {
                id: stage.id,
                stageNumber: stage.stageNumber,
                title: stage.title,
                unlocked: A.Challenge.isUnlocked(gameId, stage.id),
                best: best ? { timeSec: best.timeSec, assisted: !!best.assisted } : null,
              };
            });
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: chStage ? chStage.id : null,
              stageIndex: chStageIndex,
              state,
              elapsedSec: Math.round(chElapsed * 10) / 10,
              objective: chStage ? chStage.goalStatement : null,
              cleared: !!chLastResult,
              collectibles: chCollectibles.slice(),
              assisted: chAssisted,
              seqIndex: chSeqIndex,
              seqTotal: chSequence.length,
              nextBellId: chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null,
              combo: chCombo,
              wrongHits: chWrongHits,
              errorReason: chErrorReason,
            };
          },
          stageObservable() {
            return challengeObservable();
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing' || !chStage) return false;
            if (assisted === true) chAssisted = true;
            return challengeClear();
          },
          forceStageFail(reason) {
            return challengeFail(typeof reason === 'string' && reason ? reason : '测试强制失败');
          },
          exitChallenge() {
            return exitChallengeToStart();
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '雪铃',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync(); syncJoyTools();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
