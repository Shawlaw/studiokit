<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="雪铃：兔子跳铃铛连击游戏，铃铛落点保证可跳达，连击越高铃音越高，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <title>雪铃 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#2fa8a0; --card-accent:#2fa8a0">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html">‹ 街机厅</a>
      <h1 class="game-title">🐰 雪铃</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="雪铃游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>雪铃</h2>
            <p data-ov-text>兔子跳铃铛</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
      </div>
    </div>
    <p class="game-hint">←→ / A D 或触摸左右半屏移动 · 踩铃铛连跳 · 铃铛落点保证可跳达 · 连击越高得分越多 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const GRAVITY = 1350;
      const BOUNCE_V = -655;
      const PLAYER_R = 13;
      const BELL_R = 9;
      const MAX_JUMP_RISE = (BOUNCE_V * BOUNCE_V) / (2 * GRAVITY); /* ≈159px */

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);

      const particles = A.createParticles();

      const player = { x: W / 2, y: H - 150, vx: 0, vy: 0, face: 1, prevBottom: 0, onPad: true };
      let bells = [];
      let rings = [];
      let pad = null;
      let camY = 0;
      let genY = 0;
      let topY = 0;
      let startY = 0;
      let combo = 0;
      let bellScore = 0;
      let score = 0;
      let state = 'ready';
      let recordSaved = false;
      let snow = [];
      let prevXs = [];

      let high = A.Progress.get('snowbells').high;
      dom.hudHigh.textContent = String(high);

      for (let i = 0; i < 60; i++) {
        snow.push({ x: rand(0, W), y: rand(0, H), v: rand(14, 44), s: rand(1, 2.6), drift: rand(-8, 8) });
      }

      function heightScore() {
        return Math.max(0, Math.floor((startY - topY) / 10));
      }
      function syncHud() {
        score = bellScore + heightScore();
        dom.hudScore.textContent = String(score);
      }

      /* ---------- 铃铛生成：每一排都从上一排可达位置出发 ---------- */
      function ensureBells() {
        const genLine = camY - 120;
        while (genY > genLine) {
          const firstRow = prevXs.length === 0;
          const depth = Math.max(0, -genY);
          const density = clamp(1 - depth / 26000, 0.58, 1);
          /* 第一排固定两颗居中铃铛，保证从雪台起跳就能踩到。 */
          const gap = firstRow ? rand(78, 98) : rand(88, Math.min(118, MAX_JUMP_RISE - 26));
          genY -= gap;

          let xs;
          if (firstRow) {
            /* 第一颗正对雪台中心，起跳必中；第二颗在可达范围内提供选择。 */
            xs = [W / 2, W / 2 + 82];
          } else {
            const anchor = prevXs[randInt(0, prevXs.length - 1)];
            const spread = 96;
            const x1 = clamp(anchor + rand(-spread, spread), 26, W - 26);
            xs = [x1];
            const count = Math.random() < density * 0.72 ? 2 : 1;
            if (count === 2) {
              const dir = Math.random() < 0.5 ? -1 : 1;
              let x2 = clamp(x1 + dir * rand(72, 96), 26, W - 26);
              if (Math.abs(x2 - x1) < 56) x2 = clamp(x1 - dir * 84, 26, W - 26);
              if (Math.abs(x2 - x1) >= 56) xs.push(x2);
            }
          }
          xs.forEach((x) => bells.push({ x, y: genY, r: BELL_R, phase: rand(0, TAU), consumed: false }));
          prevXs = xs;
        }
        bells = bells.filter((b) => b.y < camY + H + 200);
      }

      /* ---------- 流程 ---------- */
      function reset() {
        bells = [];
        rings = [];
        camY = 0;
        genY = H - 120;
        combo = 0;
        bellScore = 0;
        recordSaved = false;
        prevXs = [];
        player.x = W / 2;
        player.y = H - 150;
        player.vx = 0;
        player.vy = 0;
        player.onPad = true;
        startY = player.y;
        topY = player.y;
        pad = { x: W / 2 - 60, y: H - 100, w: 120, h: 14 };
        particles.clear();
        ensureBells();
        syncHud();
      }

      function startGame() {
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
      }

      function gameOver() {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        syncHud();
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('snowbells', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          title: '坠入雪夜',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `铃铛分 ${bellScore} + 高度 ${heightScore()} · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        ui.show({
          title: '已暂停',
          text: '铃铛在夜色中等你。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        });
        pauseUi.sync();
      }

      function showStart() {
        ui.show({
          title: '雪铃',
          text: '兔子跳铃铛：踩中铃铛向上弹。<br/>每排铃铛都从上一排可达位置生成<br/>连击越高，铃音越高、得分越多',
          btn: '开始游戏',
          onBtn: startGame,
        });
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          player: { x: player.x, y: player.y, vx: player.vx, vy: player.vy, face: player.face, onPad: player.onPad, lastBellY: player.lastBellY },
          bells: bells.map((b) => ({ x: b.x, y: b.y, phase: b.phase, consumed: !!b.consumed })),
          pad,
          camY,
          genY,
          topY,
          startY,
          combo,
          bellScore,
          prevXs,
        };
      }

      function restore(data) {
        if (!data || !data.player || !Array.isArray(data.bells)) return false;
        try {
          reset();
          bells = data.bells
            .filter((b) => b && isFinite(b.x) && isFinite(b.y))
            .map((b) => ({ x: clamp(Number(b.x), 20, W - 20), y: Number(b.y), r: BELL_R, phase: Number(b.phase) || 0, consumed: !!b.consumed }));
          player.x = clamp(Number(data.player.x) || W / 2, PLAYER_R, W - PLAYER_R);
          player.y = Number(data.player.y) || H - 150;
          player.vx = Number(data.player.vx) || 0;
          player.vy = Number(data.player.vy) || 0;
          player.face = data.player.face === -1 ? -1 : 1;
          player.onPad = !!data.player.onPad;
          player.lastBellY = typeof data.player.lastBellY === 'number' && isFinite(data.player.lastBellY) ? Number(data.player.lastBellY) : null;
          if (data.pad && isFinite(data.pad.x)) {
            pad = { x: Number(data.pad.x), y: Number(data.pad.y), w: Number(data.pad.w) || 120, h: 14 };
          }
          camY = Number(data.camY) || 0;
          genY = Number(data.genY) || H - 120;
          startY = Number(data.startY) || player.y;
          topY = Number(data.topY) || player.y;
          combo = Math.max(0, Number(data.combo) || 0);
          bellScore = Math.max(0, Number(data.bellScore) || 0);
          prevXs = Array.isArray(data.prevXs) ? data.prevXs.filter((x) => isFinite(x)) : [];
          recordSaved = false;
          syncHud();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('snowbells', serialize, {
        every: 4,
        meta: () => ({ score, summary: `得分 ${score} · 连击 ${combo}` }),
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        particles.update(dt);
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life -= dt;
          r.r += 90 * dt;
          if (r.life <= 0) rings.splice(i, 1);
        }
        snow.forEach((s) => {
          s.y += s.v * dt;
          s.x += s.drift * dt;
          if (s.y > H) {
            s.y = -4;
            s.x = rand(0, W);
          }
          if (s.x < -4) s.x = W + 4;
          if (s.x > W + 4) s.x = -4;
        });
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);

        const ACC = 2100;
        const MAX_VX = 250;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) dir = input.pointer.x < W / 2 ? -1 : 1;
        if (dir !== 0) {
          player.vx += dir * ACC * dt;
          player.face = dir;
        } else {
          player.vx -= player.vx * Math.min(1, 10 * dt);
        }
        player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
        player.x += player.vx * dt;
        if (player.x < PLAYER_R) {
          player.x = PLAYER_R;
          player.vx = 0;
        } else if (player.x > W - PLAYER_R) {
          player.x = W - PLAYER_R;
          player.vx = 0;
        }

        player.prevBottom = player.y + PLAYER_R;
        player.vy = Math.min(950, player.vy + GRAVITY * dt);
        player.y += player.vy * dt;

        if (pad && player.onPad) {
          if (player.vy > 0 && player.x > pad.x - 6 && player.x < pad.x + pad.w + 6) {
            if (player.prevBottom <= pad.y + 2 && player.y + PLAYER_R >= pad.y) {
              player.y = pad.y - PLAYER_R;
              player.vy = BOUNCE_V;
              combo = 0;
              A.Sfx.play('jump');
            }
          }
        }

        if (player.vy > 40) {
          for (const b of bells) {
            if (b.consumed) continue;
            if (Math.abs(b.y - player.y) > 40) continue;
            if (A.Physics.circleCircle(player.x, player.y, PLAYER_R, b.x, b.y, b.r)) {
              b.consumed = true;
              combo += 1;
              const gain = 10 * combo;
              bellScore += gain;
              player.vy = BOUNCE_V;
              player.lastBellY = player.y;
              A.Sfx.play('bell', combo);
              rings.push({ x: b.x, y: b.y, r: BELL_R + 4, life: 0.5, maxLife: 0.5 });
              particles.emit(b.x, b.y, {
                count: A.reducedMotion ? 4 : 10,
                speed: [30, 140],
                life: [0.25, 0.6],
                size: [1.5, 3.5],
                colors: ['#ffd23f', '#fff3c4', '#ffffff'],
                gravity: 200,
              });
              syncHud();
              break;
            }
          }
        }

        if (combo > 0 && player.vy > 0 && player.lastBellY != null && player.y - player.lastBellY > 380) combo = 0;
        if (combo > 0) player.lastBellY = Math.min(player.lastBellY, player.y);

        const line = camY + H * 0.42;
        if (player.y < line) camY -= line - player.y;

        if (player.y < topY) {
          topY = player.y;
          syncHud();
        }

        ensureBells();

        if (player.y > camY + H + 30) {
          gameOver();
          input.endFrame();
          return;
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      function drawBell(b) {
        const y = b.y - camY;
        if (y < -20 || y > H + 20) return;
        const bob = Math.sin(b.phase + performance.now() / 700) * 2;
        ctx.save();
        ctx.globalAlpha = b.consumed ? 0.28 : 1;
        ctx.translate(b.x, y + bob);
        ctx.strokeStyle = 'rgba(147,160,200,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -b.r - bob);
        ctx.lineTo(0, -34);
        ctx.stroke();
        const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, b.r + 2);
        g.addColorStop(0, '#ffe9a3');
        g.addColorStop(1, '#e8b83a');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#9c7420';
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.fillStyle = '#9c7420';
        ctx.beginPath();
        ctx.arc(0, b.r - 2, 2.4, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawRabbit() {
        const y = player.y - camY;
        ctx.save();
        ctx.translate(player.x, y);
        const stretch = clamp(1 + player.vy / -3200, 0.85, 1.15);
        ctx.scale(1, stretch);
        ctx.scale(player.face >= 0 ? 1 : -1, 1);
        ctx.fillStyle = '#f4f6ff';
        ctx.strokeStyle = '#c9cfe8';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(-5, -14, 3.6, 10, -0.25, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(5, -14, 3.6, 10, 0.25, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffc9d6';
        ctx.beginPath();
        ctx.ellipse(-5, -14, 1.6, 6, -0.25, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(5, -14, 1.6, 6, 0.25, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#f4f6ff';
        ctx.beginPath();
        ctx.arc(0, 0, PLAYER_R, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#c9cfe8';
        ctx.stroke();
        ctx.fillStyle = '#2c3352';
        ctx.beginPath();
        ctx.arc(4.5, -3, 1.6, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(10, -3, 1.6, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#2c3352';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(7, 1.5, 2.6, 0.15, Math.PI - 0.15);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,180,200,0.7)';
        ctx.beginPath();
        ctx.arc(2, 1.5, 2, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0c1230');
        bg.addColorStop(0.7, '#1b2c55');
        bg.addColorStop(1, '#31527c');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(245,248,255,0.95)';
        ctx.beginPath();
        ctx.arc(340, 96, 34, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#ffd9e8';
        ctx.beginPath();
        ctx.arc(352, 90, 30, 0, TAU);
        ctx.fill();

        const par = (camY * 0.2) % (H + 300);
        ctx.fillStyle = 'rgba(226,236,255,0.10)';
        for (let k = -1; k < 2; k++) {
          const baseY = k * (H + 300) + par + H;
          ctx.beginPath();
          ctx.moveTo(0, baseY);
          ctx.quadraticCurveTo(110, baseY - 120, 240, baseY - 30);
          ctx.quadraticCurveTo(340, baseY + 40, 420, baseY - 60);
          ctx.lineTo(420, baseY + 300);
          ctx.lineTo(0, baseY + 300);
          ctx.closePath();
          ctx.fill();
        }

        bells.forEach(drawBell);

        if (pad) {
          const py = pad.y - camY;
          if (py > -40 && py < H + 40) {
            ctx.fillStyle = '#dfe8fb';
            A.draw.roundRect(ctx, pad.x, py, pad.w, pad.h, 7);
            ctx.fill();
            ctx.fillStyle = '#b9c8ec';
            ctx.fillRect(pad.x + 6, py + pad.h - 5, pad.w - 12, 3);
          }
        }

        rings.forEach((r) => {
          const y = r.y - camY;
          if (y < -20 || y > H + 20) return;
          ctx.strokeStyle = `rgba(255,210,63,${(r.life / r.maxLife) * 0.7})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(r.x, y, r.r, 0, TAU);
          ctx.stroke();
        });

        particles.draw(ctx);
        drawRabbit();

        ctx.fillStyle = 'rgba(240,246,255,0.8)';
        snow.forEach((s) => {
          ctx.globalAlpha = 0.35 + (s.s / 2.6) * 0.5;
          ctx.fillRect(s.x, s.y, s.s, s.s);
        });
        ctx.globalAlpha = 1;

        A.draw.label(ctx, 'SCORE ' + score, 12, 20, { align: 'left', font: 'bold 14px system-ui', color: '#ffd23f' });
        if (combo >= 2) {
          A.draw.label(ctx, 'COMBO ×' + combo, W - 12, 20, { align: 'right', font: 'bold 13px system-ui', color: '#63e0c8' });
        }
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              score,
              bellScore,
              combo,
              consumed: bells.map((b) => !!b.consumed),
              player: { x: player.x, y: player.y, vy: player.vy },
            };
          },
          forceHit(index) {
            const b = bells[index];
            if (!b) return false;
            player.x = b.x;
            player.y = b.y;
            player.vy = 120;
            return true;
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '雪铃',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
