<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 0.11.5：禁止移动端双击误触放大（游戏误操作防护）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="雪铃：兔子跳铃铛连击游戏，铃铛落点保证可跳达，连击越高铃音越高，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../career/bridge.js"></script>
  <script src="../challenge/snowbells.js"></script>
  <style>
    .challenge-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; background: rgba(8, 13, 28, 0.96); border-radius: inherit; }
    .challenge-layer[hidden] { display: none; }
    .challenge-layer .ac-btn[hidden] { display: none; }
    .challenge-layer .ac-challenge-panel { flex: 0 0 auto; }
    .challenge-layer .ac-btn { flex: 0 0 auto; width: 100%; min-height: 44px; }
    .stage-box > .ac-challenge-hud { position: absolute; left: 8px; right: 8px; top: 8px; width: auto; z-index: 4; pointer-events: none; }
    /* 0.17 职业委托：开局/暂停/结算弹层里的戏内目标行；320/375 也不超过两行。 */
    .career-mission-line { display: block; margin: 2px auto 0; padding: 3px 9px; max-width: 100%; border: 1px solid rgba(90, 209, 160, 0.55); border-radius: 10px; background: rgba(90, 209, 160, 0.12); color: #d9ffe9; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .overlay-panel .career-mission-line { color: #d9ffe9; }
  </style>
  <title>雪铃 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-extra-controls has-game-tools" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#2fa8a0; --card-accent:#2fa8a0">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🐰 雪铃</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="雪铃游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>雪铃</h2>
            <p data-ov-text>兔子跳铃铛</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="ac-challenge-hud" data-ch-hud hidden></div>
        <div class="challenge-layer" data-ch-layer hidden>
          <div data-ch-panel></div>
          <button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>
        </div>
      </div>
    </div>
    <div class="touch-pad game-tools" aria-label="可选道具（快捷键 1 / 2）">
      <button type="button" class="touch-btn" data-joy-tool="magnet" aria-label="铃磁，剩余 2 次（快捷键 1）"><span aria-hidden="true">🧲</span> 铃磁 <strong data-joy-count>2</strong></button>
      <button type="button" class="touch-btn" data-joy-tool="encore" aria-label="安可，剩余 2 次（快捷键 2）"><span aria-hidden="true">🎵</span> 安可 <strong data-joy-count>2</strong></button>
    </div>
    <p class="game-hint">←→ / A D 或触摸左右半屏移动 · 踩铃铛连跳 · 1 铃磁 / 2 安可 · 连击越高得分越多 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const career = window.ArcadeCareer || null;
      const { clamp, lerp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const GRAVITY = 1350;
      const BOUNCE_V = -655;
      const PLAYER_R = 13;
      const BELL_R = 9;
      const MAX_JUMP_RISE = (BOUNCE_V * BOUNCE_V) / (2 * GRAVITY); /* ≈159px */
      const MAGNET_DURATION = 6;
      const MAGNET_BONUS = 14;
      const ENCORE_HITS = 2;
      /* 0.10.0：彩铃命中基础加分；本局可见，不写经典最高分。 */
      const CH_BONUS_POINTS = 25;
      const JOY_START = { magnet: 2, encore: 2 };
      const JOY_CAPS = { magnet: 2, encore: 2 };

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
      };
      const ui = A.createOverlayUi(dom);
      const joyButtons = {
        magnet: document.querySelector('[data-joy-tool="magnet"]'),
        encore: document.querySelector('[data-joy-tool="encore"]'),
      };

      const particles = A.createParticles();

      /* ---------- 0.9 挑战模式：固定铃序关卡（数据/记录/选关由 A.Challenge 提供） ---------- */
      const gameId = 'snowbells';
      const challengeData = A.Challenge ? A.Challenge.stages(gameId) : [];
      const challengeAvailable = challengeData.length === 6;
      const chDom = {
        hud: document.querySelector('[data-ch-hud]'),
        layer: document.querySelector('[data-ch-layer]'),
        panelHost: document.querySelector('[data-ch-panel]'),
        back: document.querySelector('[data-ch-back]'),
      };
      const gameHudEl = document.querySelector('.game-hud');
      const CH_ORIGIN_Y = H - 120;
      let mode = 'classic';
      let chStage = null;
      let chStageIndex = -1;
      let chBells = [];
      let chSequence = [];
      let chSeqIndex = 0;
      let chOptional = [];
      let chCollectibles = [];
      let chWrongHits = 0;
      /* 0.10.0：本局彩铃加分（+25/颗），仅本局可见，不写经典最高分/Progress。 */
      let chBonusScore = 0;
      let chElapsed = 0;
      let chAssisted = false;
      let chErrorReason = '';
      let chLastResult = null;
      /* 0.10.0：纯视觉隐藏雪花乐谱，通关即时显示、不持久化、不影响战力。 */
      let snowflakeScoreTimer = 0;
      let snowflakeScoreVisible = false;
      let chCombo = 0;
      let chGoalHintTimer = 0;
      let chHudSecond = -1;

      const player = { x: W / 2, y: H - 150, vx: 0, vy: 0, face: 1, prevBottom: 0, onPad: true };
      let bells = [];
      let rings = [];
      let pad = null;
      let camY = 0;
      let genY = 0;
      let topY = 0;
      let startY = 0;
      let combo = 0;
      let bellScore = 0;
      let score = 0;
      let state = 'ready';
      let recordSaved = false;
      let snow = [];
      let prevXs = [];
      const tools = { magnet: JOY_START.magnet, encore: JOY_START.encore };
      let magnetTimer = 0;
      let encoreHits = 0;

      let high = A.Progress.get('snowbells').high;
      dom.hudHigh.textContent = String(high);

      for (let i = 0; i < 60; i++) {
        snow.push({ x: rand(0, W), y: rand(0, H), v: rand(14, 44), s: rand(1, 2.6), drift: rand(-8, 8) });
      }

      function heightScore() {
        return Math.max(0, Math.floor((startY - topY) / 10));
      }
      function syncHud() {
        if (mode === 'challenge') {
          syncChallengeHud();
          return;
        }
        score = bellScore + heightScore();
        dom.hudScore.textContent = String(score);
      }

      /* ---------- 铃铛生成：每一排都从上一排可达位置出发 ---------- */
      function ensureBells() {
        const genLine = camY - 120;
        while (genY > genLine) {
          const firstRow = prevXs.length === 0;
          const depth = Math.max(0, -genY);
          const density = clamp(1 - depth / 26000, 0.58, 1);
          /* 第一排固定两颗居中铃铛，保证从雪台起跳就能踩到。 */
          const gap = firstRow ? rand(78, 98) : rand(88, Math.min(118, MAX_JUMP_RISE - 26));
          genY -= gap;

          let xs;
          if (firstRow) {
            /* 第一颗正对雪台中心，起跳必中；第二颗在可达范围内提供选择。 */
            xs = [W / 2, W / 2 + 82];
          } else {
            const anchor = prevXs[randInt(0, prevXs.length - 1)];
            const spread = 96;
            const x1 = clamp(anchor + rand(-spread, spread), 26, W - 26);
            xs = [x1];
            const count = Math.random() < density * 0.72 ? 2 : 1;
            if (count === 2) {
              const dir = Math.random() < 0.5 ? -1 : 1;
              let x2 = clamp(x1 + dir * rand(72, 96), 26, W - 26);
              if (Math.abs(x2 - x1) < 56) x2 = clamp(x1 - dir * 84, 26, W - 26);
              if (Math.abs(x2 - x1) >= 56) xs.push(x2);
            }
          }
          /* 0.17：每颗铃铛带单调唯一 uid（bell.unique 的真实来源，不由分数反推）。 */
          xs.forEach((x) => bells.push({ uid: 'sb-' + (++bellUidSeq), x, y: genY, r: BELL_R, phase: rand(0, TAU), consumed: false }));
          prevXs = xs;
        }
        bells = bells.filter((b) => b.y < camY + H + 200);
      }

      /* ---------- 每局主动道具 ---------- */
      /* 可点击条件集中判断：挑战关的「安可」不生效，直接返回 false 且不消耗次数（经典模式效果保留）。 */
      function joyUsable(id) {
        if (state !== 'playing' || !Object.prototype.hasOwnProperty.call(tools, id) || tools[id] <= 0) return false;
        if (id === 'magnet') return magnetTimer <= 0;
        if (id === 'encore') {
          if (mode === 'challenge') return false;
          return encoreHits <= 0;
        }
        return false;
      }
      function syncJoyTools() {
        Object.keys(joyButtons).forEach((id) => {
          const button = joyButtons[id];
          const active = id === 'magnet' ? magnetTimer > 0 : encoreHits > 0;
          const name = id === 'magnet' ? '铃磁' : '安可';
          const detail = id === 'magnet'
            ? '6 秒内扩大铃铛碰撞半径'
            : mode === 'challenge'
              ? '挑战关不可用（经典模式：接下来两颗铃铛得分翻倍）'
              : '接下来两颗铃铛得分翻倍';
          button.querySelector('[data-joy-count]').textContent = String(tools[id]);
          button.disabled = !joyUsable(id);
          button.classList.toggle('is-armed', active);
          button.setAttribute('aria-pressed', String(active));
          button.setAttribute('aria-label', name + '，' + detail + '，剩余 ' + tools[id] + ' 次（快捷键 ' + (id === 'magnet' ? '1' : '2') + '）');
        });
      }
      function useJoy(id) {
        if (state !== 'playing' || !Object.prototype.hasOwnProperty.call(tools, id) || tools[id] <= 0) return false;
        /* 挑战关没有读取 encoreHits 的命中逻辑：诚实地拒绝使用，避免白扣次数并标记 assisted。 */
        if (id === 'encore' && mode === 'challenge') {
          A.showToast('挑战关不使用安可');
          return false;
        }
        if (id === 'magnet') {
          if (magnetTimer > 0) return false;
          tools.magnet -= 1;
          magnetTimer = MAGNET_DURATION;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('spring');
        } else if (id === 'encore') {
          if (encoreHits > 0) return false;
          tools.encore -= 1;
          encoreHits = ENCORE_HITS;
          if (mode === 'challenge') chAssisted = true;
          A.Sfx.play('bell', 4);
        } else {
          return false;
        }
        syncJoyTools();
        autosave.saveNow();
        return true;
      }
      Object.keys(joyButtons).forEach((id) => {
        joyButtons[id].addEventListener('click', () => useJoy(id));
      });
      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        const target = e.target;
        if (target && target.tagName) {
          const tag = target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        }
        const id = { '1': 'magnet', '2': 'encore' }[e.key];
        if (!id) return;
        e.preventDefault();
        useJoy(id);
      });

      /* ---------- 流程 ---------- */
      function reset() {
        bells = [];
        rings = [];
        camY = 0;
        genY = H - 120;
        combo = 0;
        bellScore = 0;
        recordSaved = false;
        prevXs = [];
        tools.magnet = JOY_START.magnet;
        tools.encore = JOY_START.encore;
        magnetTimer = 0;
        encoreHits = 0;
        player.x = W / 2;
        player.y = H - 150;
        player.vx = 0;
        player.vy = 0;
        player.onPad = true;
        startY = player.y;
        topY = player.y;
        pad = { x: W / 2 - 60, y: H - 100, w: 120, h: 14 };
        particles.clear();
        ensureBells();
        syncHud();
        syncJoyTools();
      }

      function startGame() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        /* 0.17 职业 run：结算后同页再开的局也不再写任何经典记录；首局重置真实事件跟踪。 */
        if (careerLocked && careerGoalDone) careerPostSettled = true;
        careerQuitRequested = false;
        testAimTargetId = null;
        if (careerActive()) resetCareerTracking();
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync(); syncJoyTools();
      }

      function gameOver() {
        if (state === 'over') return;
        state = 'over';
        A.Sfx.play('over');
        autosave.clear();
        syncHud();
        /* 0.17 职业 run：不 recordPlay/Scores/最高分/GameMeta；先把真实最高高度作为最后一次
           提交发出去（仍在真实物理/得分提交点之后），再走 career.finish 的独立职业收据。 */
        if (careerLocked) {
          noteCareerHeight(true);
          loop.pause();
          showCareerResult();
          careerFinish(careerQuitRequested ? 'quit' : 'lost');
          pauseUi.sync(); syncJoyTools();
          return;
        }
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('snowbells', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          result: '回看雪夜',
          title: '坠入雪夜',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `铃铛分 ${bellScore} + 高度 ${heightScore()} · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: showStart,
        });
        if (career && mode === 'classic') career.finish({ mode: 'classic', outcome: 'lost', stats: { score, bellScore, height: heightScore() } });
        pauseUi.sync(); syncJoyTools();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        autosave.saveNow();
        /* 0.17 职业 run：局内进度不落旧 RunSave，文案改为戏内目标 + 如实说明不计分。 */
        const careerGoal = careerLocked && !careerGoalDone ? careerGoalParts() : null;
        const opts = {
          title: '已暂停',
          text: careerLocked
            ? ('雪夜暂停。' + (careerGoal ? '<br/>' + careerGoalLine() : '') + '<br/>本局不写入最高分与积分记录。')
            : '铃铛在夜色中等你。<br/>局内进度已保存，可以随时离开。',
          btn: '继续',
          onBtn: resumeGame,
        };
        if (mode === 'challenge') {
          opts.btn2 = '退出挑战';
          opts.onBtn2 = exitToChallengeSelect;
        } else if (careerLocked && !careerGoalDone && !careerSettled) {
          /* 职业 run 才有的收工出口：玩家达成目标后不必等坠落就能交差。 */
          opts.btn2 = '结束本局';
          opts.onBtn2 = endCareerSession;
        }
        ui.show(opts);
        pauseUi.sync(); syncJoyTools();
      }

      function showStart() {
        mode = 'classic';
        hideChallengePanel();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        /* 0.17 职业 run：追加一行戏内目标（title + 目标）；挑战入口不可进入。 */
        const careerGoal = careerLocked && !careerGoalDone ? careerGoalLine() : '';
        const challengeEntry = !careerLocked;
        ui.show({
          title: '雪铃',
          text: '兔子跳铃铛：踩中铃铛向上弹。<br/>每排铃铛都从上一排可达位置生成<br/>连击越高，铃音越高、得分越多' + (careerGoal ? '<br/>' + careerGoal : ''),
          btn: '开始游戏',
          onBtn: startGame,
          btn2: challengeEntry ? (challengeAvailable ? '挑战 6 关' : '挑战数据不可用') : '',
          onBtn2: challengeEntry && challengeAvailable ? showChallengePanel : null,
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !challengeAvailable;
      }

      /* ---------- 0.9 挑战模式实现 ---------- */
      function chEsc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      /* ===== 0.17 职业委托（ADR §19.2 / §19.3 / §19.4 / §19.8）=====
         - 只有从旧港告示板接单后带 ?career=<ticketId> 进入本页、且 bridge 确认属于本页
           gameId 时才进入职业 run；无 ticket / ticket 不匹配 / bridge 缺失时整段 no-op，
           页面与 0.16 完全一致。
         - 职业 run 内不写 studiokit:arcade:runs:v1（serialize=null + autosave 四出口 no-op），
           不 recordPlay/Scores/挑战/最高分/GameMeta，不进入挑战模式；结算只走 career.finish
           的独立职业收据。
         - bell.unique（§19.4）：每踩中一个不同铃铛一次 {bellId, count}。bellId 来自真实生成/
           消费序号（单调唯一，不由分数反推）；页面侧 Set 兜底，同一 id 复踩/重复调用不再加计。
         - height.reached（§19.4）：只有真实物理把最高点 topY 上移、并在 syncHud 提交分数之后才发，
           按 10 高度分粒度变化发送；height = heightScore() = floor((startY - topY) / 10)，
           与 HUD/结算里的「高度」同一单位。单次跳跃最大上升 = BOUNCE_V²/(2·GRAVITY) ≈ 159px；
           内容 T3/T5 的 240/400 对应 2400/4000px 的真实上攀（约 25/40 次踩铃），不是单跳像素。 */
      let careerLocked = false;
      let careerSettled = null;
      let careerGoalSource = null;
      let careerGoalDone = false;
      let careerPostSettled = false;
      let careerQuitRequested = false;
      let careerBellIds = Object.create(null);
      let careerUniqueCount = 0;
      let careerHeightEmitted = 0;
      let careerHeightMax = 0;
      let bellUidSeq = 0;
      const CAREER_HEIGHT_STEP = 10;
      /* #test 专用：仅横向对准的“踩铃辅助”。默认关闭；生产 URL 与既有 #test 探针不启用。
         纵向速度/碰撞/得分/height.reached 仍完全由真实重力与真实消费分支推进，不伪造高度。 */
      let testAimAssist = false;
      let testAimTargetId = null;

      function careerTicketParam() {
        try {
          const search = String((window.location && window.location.search) || '');
          const match = /(?:^|[?&])career=([^&]+)/.exec(search);
          if (!match) return '';
          const value = decodeURIComponent(match[1].replace(/\+/g, ' '));
          return /^[A-Za-z0-9._:-]{1,120}$/.test(value) ? value : '';
        } catch (err) {
          return '';
        }
      }

      /* 本页当前是否有属于本游戏的职业 run（bridge 只在 ticket 校验通过时填充）。 */
      function readCareerRun() {
        try {
          if (!career || typeof career.isCommissionRun !== 'function' || !career.isCommissionRun()) return null;
          const run = career.commissionRun;
          if (!run || run.gameId !== gameId) return null;
          return run;
        } catch (err) {
          return null;
        }
      }

      /* 戏内目标只来自真实委托内容（commissionRun.commission）；内容缺失时返回 null，不发明文案。 */
      function goalPartsOf(commission) {
        if (!commission || typeof commission !== 'object') return null;
        const title = typeof commission.title === 'string' ? commission.title : '';
        const summary = typeof commission.summary === 'string' ? commission.summary : '';
        if (!title && !summary) return null;
        const objective = commission.objective && typeof commission.objective === 'object' ? commission.objective : {};
        const kind = typeof objective.kind === 'string' ? objective.kind : '';
        const rawAtLeast = Number(objective.atLeast);
        const atLeast = Number.isFinite(rawAtLeast) && rawAtLeast > 0 ? Math.floor(rawAtLeast) : 0;
        const minValue = objective.minValue && typeof objective.minValue === 'object' ? objective.minValue : null;
        const minField = minValue && typeof minValue.field === 'string' ? minValue.field : '';
        const rawMin = minValue ? Number(minValue.value) : NaN;
        const min = Number.isFinite(rawMin) && rawMin > 0 ? Math.floor(rawMin) : 0;
        return { title, summary, kind, atLeast, minField, min };
      }

      function careerGoalParts() {
        const run = readCareerRun();
        const commission = (run && run.commission) || careerGoalSource;
        return goalPartsOf(commission);
      }

      /* 一行戏内目标：只 title + 目标（summary 在告示板可读），320/375 也不超两行。 */
      function careerGoalLine() {
        const goal = careerGoalParts();
        if (!goal) return '';
        const text = goal.title || goal.summary;
        let target = '';
        if (goal.min > 0) {
          target = '（目标高度 ' + goal.min + '）';
        } else if (goal.atLeast > 0) {
          const unit = goal.kind === 'bell.unique' ? ' 铃' : '';
          target = '（目标 ' + goal.atLeast + unit + '）';
        }
        return '<span class="career-mission-line" data-career-goal="1">委托：' + chEsc(text) + chEsc(target) + '</span>';
      }

      /* 职业 run 内断开旧 RunSave：serialize() 返回 null，并兜底替换 autosave 的四个出口。 */
      function lockRunSave() {
        if (careerLocked) return;
        careerLocked = true;
        try {
          autosave.saveNow = function () { return false; };
          autosave.tick = function () {};
          autosave.clear = function () {};
          autosave.load = function () { return null; };
        } catch (err) {
          /* 忽略：serialize() 的职业门禁仍是最终兜底 */
        }
      }

      function activateCareerRun(runInfo) {
        if (!runInfo || runInfo.gameId !== gameId) return false;
        lockRunSave();
        careerGoalSource = runInfo.commission && typeof runInfo.commission === 'object' ? runInfo.commission : null;
        careerGoalDone = false;
        try {
          document.body.classList.toggle('is-career-run', true);
        } catch (err) {
          /* ignore */
        }
        return true;
      }

      /* 只有职业 run 且尚未开始结算时才发职业事件；经典/挑战局与结算后一律 no-op。 */
      function careerActive() {
        return careerLocked && !careerSettled;
      }

      function careerObserve(kind, payload) {
        if (!careerActive()) return false;
        if (!career || typeof career.observe !== 'function') return false;
        try {
          return career.observe(kind, payload);
        } catch (err) {
          return false;
        }
      }

      function resetCareerTracking() {
        careerBellIds = Object.create(null);
        careerUniqueCount = 0;
        careerHeightEmitted = 0;
        careerHeightMax = 0;
      }

      /* 不同铃铛每颗一次；同一 bellId 复踩（含测试重复调用）不计入。 */
      function noteCareerUniqueBell(bellId) {
        if (!careerActive()) return false;
        const id = typeof bellId === 'string' ? bellId : String(bellId == null ? '' : bellId);
        if (!id || id.length > 120) return false;
        if (careerBellIds[id]) return false;
        careerBellIds[id] = true;
        careerUniqueCount += 1;
        careerObserve('bell.unique', { bellId: id, count: careerUniqueCount });
        return true;
      }

      /* 真实最高点上移后（update 内、syncHud 之后）按 10 高度分粒度发送；结算前补发一次终值。 */
      function noteCareerHeight(force) {
        if (!careerActive()) return false;
        const h = heightScore();
        if (h > careerHeightMax) careerHeightMax = h;
        const value = force ? h : Math.floor(h / CAREER_HEIGHT_STEP) * CAREER_HEIGHT_STEP;
        if (value <= careerHeightEmitted) return false;
        careerHeightEmitted = value;
        careerObserve('height.reached', { height: value });
        return true;
      }

      /* #test 专用横向对准：挑“可达的最近上方未消费铃”，只改 x/vx；不改 y/vy/事件。 */
      function testAimNextBell() {
        if (!testAimAssist || state !== 'playing') return null;
        let best = null;
        for (const b of bells) {
          if (b.consumed) continue;
          if (b.y >= player.y - 4) continue;
          if (b.y < player.y - (MAX_JUMP_RISE + 8)) continue;
          if (!best || b.y > best.y) best = b;
        }
        if (!best) {
          testAimTargetId = null;
          return null;
        }
        player.x = clamp(best.x, PLAYER_R, W - PLAYER_R);
        player.vx = 0;
        testAimTargetId = best.uid || null;
        return testAimTargetId;
      }

      function summarizeCareerResult(result) {
        if (!result || typeof result !== 'object') return { ok: false, reason: 'empty' };
        if (result.ok === true) {
          const receipt = result.receipt && typeof result.receipt === 'object' ? result.receipt : null;
          return {
            ok: true,
            duplicate: result.duplicate === true,
            credits: receipt && Number.isFinite(Number(receipt.credits)) ? Number(receipt.credits) : Number(result.credits) || 0,
            hasItems: !!(receipt && receipt.items && Object.keys(receipt.items).length),
            evidence: receipt && Array.isArray(receipt.evidence) ? receipt.evidence.slice() : [],
            receiptId: receipt && (receipt.receiptId || receipt.txId) ? String(receipt.receiptId || receipt.txId) : null,
          };
        }
        return {
          ok: false,
          reason: typeof result.reason === 'string' ? result.reason : 'failed',
          observed: Number.isFinite(Number(result.observed)) ? Number(result.observed) : null,
          reached: Number.isFinite(Number(result.reached)) ? Number(result.reached) : null,
        };
      }

      /* 结算：职业 run 走 bridge/commission-core 独立收据；本页不发钱、不写库。 */
      function careerFinish(outcome) {
        if (!careerLocked) return;
        if (careerSettled) return;
        if (!career || typeof career.finish !== 'function') {
          careerSettled = { ok: false, reason: 'bridge-unavailable' };
          careerGoalDone = true;
          return;
        }
        careerSettled = { pending: true };
        const stats = { score, bellScore, height: heightScore(), uniqueBells: careerUniqueCount };
        let promise = null;
        try {
          promise = career.finish({ mode: 'classic', outcome: outcome || 'lost', stats: stats });
        } catch (err) {
          careerSettled = { ok: false, reason: 'finish-threw' };
          careerGoalDone = true;
          if (state === 'over') showCareerResult();
          return;
        }
        Promise.resolve(promise)
          .then((result) => {
            careerSettled = summarizeCareerResult(result);
            careerGoalDone = true;
            if (state === 'over') showCareerResult();
          })
          .catch(() => {
            careerSettled = { ok: false, reason: 'finish-error' };
            careerGoalDone = true;
            if (state === 'over') showCareerResult();
          });
      }

      /* 结算文案只用戏内措辞；技术原因只留在测试探针（careerInfo），不写给玩家。 */
      function careerResultText() {
        const settled = careerSettled;
        let line = '这一局正在结算，收据会记入旧港档案。';
        if (careerPostSettled) {
          line = '委托已结算；这局不写入最高分与积分记录。';
        } else if (settled && settled.pending !== true) {
          if (settled.ok) {
            line =
              '委托结算完成：报酬 ' + settled.credits +
              (settled.hasItems ? ' · 材料已入册' : '') +
              (settled.evidence && settled.evidence.length ? ' · 档案已归档' : '') +
              (settled.duplicate ? '（此前已结算）' : '') +
              '<br/>收据已记入旧港档案。';
          } else if (settled.reason === 'objective-not-met' || settled.reason === 'value-not-met') {
            line = '目标还差一点，这次没有报酬；可回旧港重新接单。';
          } else {
            line = '结算没有完成，可回旧港核对档案记录。';
          }
        }
        const goal = careerGoalDone ? '' : careerGoalLine();
        return (
          `<span class="ac-score">${score}</span>` +
          `铃铛分 ${bellScore} + 高度 ${heightScore()}<br/>` +
          (goal ? goal + '<br/>' : '') +
          line
        );
      }

      function showCareerResult() {
        ui.show({
          result: '回看雪夜',
          title: careerQuitRequested ? '收工回看' : '坠入雪夜',
          text: careerResultText(),
          btn: '再来一局',
          onBtn: showStart,
        });
        pauseUi.sync();
      }

      /* 玩家主动收工（仅职业 run 的暂停弹层）：自然结束本局并如实结算。 */
      function endCareerSession() {
        if (!careerLocked || state === 'over' || careerSettled) return false;
        careerQuitRequested = true;
        gameOver();
        return true;
      }

      function chPanelRoot() {
        return chDom.panelHost ? chDom.panelHost.querySelector('.ac-challenge-panel') : null;
      }

      function syncChallengePanel() {
        if (!chDom.panelHost || !A.Challenge) return;
        chDom.panelHost.innerHTML = A.Challenge.stageListHtml(gameId);
        const root = chPanelRoot();
        if (root) root.hidden = true;
        chDom.panelHost.querySelectorAll('.ac-stage-btn').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            startChallenge(button.dataset.stageId);
          });
        });
      }

      function showChallengePanel() {
        /* 0.17：职业委托 run 内不开挑战入口（避免写挑战进度记录）。 */
        if (careerLocked) return;
        if (!challengeAvailable) {
          ui.show({ title: '挑战数据不可用', text: '挑战关卡数据加载失败，经典模式不受影响。', btn: '返回', onBtn: showStart });
          return;
        }
        syncChallengePanel();
        const root = chPanelRoot();
        if (root) root.hidden = false;
        if (chDom.layer) chDom.layer.hidden = false;
        if (chDom.back) chDom.back.hidden = false;
        loop.pause();
        state = 'challenge-menu';
        pauseUi.sync();
      }

      function hideChallengePanel() {
        if (chDom.layer) chDom.layer.hidden = true;
        if (chDom.back) chDom.back.hidden = true;
        const root = chPanelRoot();
        if (root) root.hidden = true;
      }

      function backToStartFromPanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        showStart();
        pauseUi.sync();
        syncJoyTools();
      }

      function buildChallengeStage(index) {
        const stage = challengeData[index];
        if (!stage) return false;
        mode = 'challenge';
        chStage = stage;
        chStageIndex = index;
        const content = stage.content || {};
        const list = Array.isArray(content.bells) ? content.bells : [];
        chBells = list.map((bell) => ({
          id: String(bell.id),
          x: Number(bell.xCenter),
          y: CH_ORIGIN_Y - Number(bell.height || 0),
          r: Number(bell.radius) || BELL_R,
          kind: bell.kind || 'normal',
          phase: 0,
          consumed: false,
        }));
        chSequence = (Array.isArray(content.requiredSequence) ? content.requiredSequence : []).map(String);
        chOptional = chBells.filter((bell) => bell.kind === 'bonus').map((bell) => bell.id);
        chSeqIndex = 0;
        chCollectibles = [];
        chWrongHits = 0;
        chBonusScore = 0;
        chElapsed = 0;
        chAssisted = false;
        chErrorReason = '';
        chLastResult = null;
        chCombo = 0;
        snowflakeScoreTimer = 0;
        snowflakeScoreVisible = false;
        chGoalHintTimer = 3;
        chHudSecond = -1;
        bells = [];
        rings = [];
        pad = null;
        camY = 0;
        magnetTimer = 0;
        encoreHits = 0;
        tools.magnet = JOY_START.magnet;
        tools.encore = JOY_START.encore;
        const first = chBells.find((bell) => bell.id === (content.startBell || chSequence[0]));
        player.x = first ? first.x : W / 2;
        player.y = first ? first.y - 70 : H - 260;
        player.vx = 0;
        player.vy = 0;
        player.face = 1;
        player.onPad = false;
        startY = player.y;
        topY = player.y;
        particles.clear();
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function syncChallengeHud() {
        if (mode !== 'challenge' || !chStage) return;
        if (gameHudEl) gameHudEl.hidden = true;
        if (!chDom.hud) return;
        chDom.hud.hidden = false;
        const second = Math.floor(chElapsed);
        if (second === chHudSecond && state === 'playing') return;
        chHudSecond = second;
        const label = 'C' + String(chStage.stageNumber || 0).padStart(2, '0');
        const done = chSequence.slice(0, chSeqIndex).join('→');
        const next = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : '完成';
        chDom.hud.innerHTML =
          '<strong>' + chEsc(label + ' ' + chStage.title) + '</strong>' +
          '<span>' + chEsc(chStage.goalStatement || '') + '</span>' +
          '<span>下一铃 ' + chEsc(next) + '</span>' +
          '<span>进度 ' + chEsc((done ? done + '→' : '') + next) + (chSeqIndex >= chSequence.length ? '' : '') + '</span>' +
          '<span>连击 ×' + chCombo + ' · 错 ' + chWrongHits + '</span>' +
          '<span>彩铃加分 +' + chBonusScore + '（本局可见）</span>' +
          '<span>用时 ' + A.Challenge.formatTime(chElapsed) + '</span>';
      }

      function startChallenge(ref) {
        /* 0.17：职业委托 run 内拒绝进入挑战（真实点击也到不了挑战记录）。 */
        if (careerLocked) return false;
        if (!challengeAvailable || !A.Challenge) return false;
        const stage = A.Challenge.stage(gameId, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(gameId, stage.id)) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        state = 'playing';
        hideChallengePanel();
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncJoyTools();
        syncChallengeHud();
        autosave.clear();
        autosave.saveNow();
        return true;
      }

      function challengeHitBell(bell) {
        const content = chStage.content || {};
        const expected = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null;
        if (bell.kind === 'bonus') {
          if (bell.consumed) return;
          bell.consumed = true;
          chCollectibles.push(bell.id);
          /* 0.17：彩铃/故障铃也按不同 id 计一次（职业 run 不会进入挑战，本分支只作口径兜底）。 */
          if (careerActive()) noteCareerUniqueBell('ch:' + (chStage ? chStage.id : '') + ':' + bell.id);
          chBonusScore += CH_BONUS_POINTS;
          player.vy = BOUNCE_V;
          A.Sfx.play('bell', 6);
          rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '彩铃 +' + bell.id + ' +' + CH_BONUS_POINTS + ' 分' });
          /* 彩铃加分只进入本局可见反馈，绝不写 progress:v1 经典最高分。 */
          syncChallengeHud();
          autosave.saveNow();
          return;
        }
        if (bell.id === expected) {
          bell.consumed = true;
          chSeqIndex += 1;
          /* 0.17：顺序命中的挑战铃也计入不同 id（复踩/错序不消费，不会重复计）。 */
          if (careerActive()) noteCareerUniqueBell('ch:' + (chStage ? chStage.id : '') + ':' + bell.id);
          player.vy = BOUNCE_V;
          player.lastBellY = player.y;
          if (bell.kind === 'rest') {
            A.Sfx.play('ui');
            rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '休止' });
          } else {
            chCombo += 1;
            A.Sfx.play('bell', Math.min(chCombo, 12));
            rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '命中 ' + bell.id + ' ×' + chCombo });
          }
          particles.emit(bell.x, bell.y, {
            count: A.reducedMotion ? 4 : 10,
            speed: [30, 140],
            life: [0.25, 0.6],
            size: [1.5, 3.5],
            colors: ['#ffd23f', '#fff3c4', '#ffffff'],
            gravity: 200,
          });
          syncChallengeHud();
          if (chSeqIndex >= chSequence.length && content.goalAfterLast !== false) {
            challengeClear();
            return;
          }
          autosave.saveNow();
          return;
        }
        /* 错序：可反弹但不计分、不消耗该铃（后续仍可命中），连击中断。 */
        /* 0.17：错序铃未被真实消费，不提交 bell.unique（重复踩同一铃也不会累计）。 */
        player.vy = BOUNCE_V;
        player.lastBellY = player.y;
        chCombo = 0;
        chWrongHits += 1;
        A.Sfx.play('land');
        rings.push({ x: bell.x, y: bell.y, r: bell.r + 4, life: 0.65, maxLife: 0.65, text: '错序，目标是 ' + (expected || '—') });
        syncChallengeHud();
      }

      function updateChallenge(dt) {
        particles.update(dt);
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life -= dt;
          r.r += 90 * dt;
          if (r.life <= 0) rings.splice(i, 1);
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        chElapsed += dt;
        chGoalHintTimer = Math.max(0, chGoalHintTimer - dt);
        const hadMagnet = magnetTimer > 0;
        magnetTimer = Math.max(0, magnetTimer - dt);
        if (hadMagnet && magnetTimer <= 0) {
          syncJoyTools();
          autosave.saveNow();
        }
        const ACC = 2100;
        const MAX_VX = 250;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) dir = input.pointer.x < W / 2 ? -1 : 1;
        if (dir !== 0) {
          player.vx += dir * ACC * dt;
          player.face = dir;
        } else {
          player.vx -= player.vx * Math.min(1, 10 * dt);
        }
        player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
        player.x += player.vx * dt;
        if (player.x < PLAYER_R) {
          player.x = PLAYER_R;
          player.vx = 0;
        } else if (player.x > W - PLAYER_R) {
          player.x = W - PLAYER_R;
          player.vx = 0;
        }
        player.prevBottom = player.y + PLAYER_R;
        player.vy = Math.min(950, player.vy + GRAVITY * dt);
        player.y += player.vy * dt;
        if (player.vy > 40) {
          for (const bell of chBells) {
            if (bell.consumed) continue;
            if (Math.abs(bell.y - player.y) > 60) continue;
            if (A.Physics.circleCircle(player.x, player.y, PLAYER_R, bell.x, bell.y, bell.r + (magnetTimer > 0 ? MAGNET_BONUS : 0))) {
              challengeHitBell(bell);
              if (state !== 'playing') break;
            }
          }
        }
        if (player.y > H + 40) {
          challengeFail('落空坠回雪地：先预判下一颗铃的横向位置再起跳');
          input.endFrame();
          return;
        }
        syncChallengeHud();
        input.endFrame();
      }

      /* 纯视觉开关：不写存档、不改分数、不参与任何通关判定。 */
      function triggerSnowflakeScore(show) {
        snowflakeScoreVisible = !!show;
        snowflakeScoreTimer = show ? 6 : 0;
      }

      function challengeClear() {
        if (mode !== 'challenge' || !chStage) return false;
        state = 'cleared';
        chGoalHintTimer = 0;
        autosave.clear();
        loop.pause();
        syncJoyTools();
        const result = { timeSec: Math.round(chElapsed * 10) / 10, assisted: chAssisted, collectibles: chCollectibles.slice() };
        chLastResult = result;
        if (A.Challenge) A.Challenge.markCleared(gameId, chStage.id, result);
        const isLast = chStageIndex >= challengeData.length - 1;
        const marks = chCollectibles.length ? '彩铃 ' + chCollectibles.join('/') : '未收集彩铃';
        /* 0.10.0：C06 无错通关 → 触发纯视觉雪花乐谱（仅本局渲染，不写存档/不参与判定）。 */
        const perfectFinale = Number(chStage && chStage.stageNumber) === 6 && chWrongHits === 0;
        triggerSnowflakeScore(perfectFinale);
        ui.show({
          result: '回看雪夜',
          title: '挑战通关',
          text: A.Challenge.resultHtml(chStage, result) + '<p class="ac-challenge-tip">' + chEsc(chStage.goalStatement || '') + ' · ' + chEsc(marks) + ' · 彩铃加分 +' + chBonusScore + '（本局，不计经典最高分）</p>' +
            (perfectFinale ? '<p class="ac-challenge-tip">❄ 完美终曲 · 雪花乐谱（纯视觉，不影响战力）</p>' : ''),
          btn: isLast ? '返回选关' : '下一关',
          onBtn: () => {
            if (isLast) exitToChallengeSelect();
            else startChallenge(challengeData[chStageIndex + 1].id);
          },
          btn2: '重玩本关',
          onBtn2: () => startChallenge(chStage.id),
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        chErrorReason = reason || '本关失败';
        autosave.clear();
        loop.pause();
        syncJoyTools();
        ui.show({
          result: '回看雪夜',
          title: '挑战失败',
          text:
            '<p class="ac-challenge-tip">' + chEsc(chErrorReason) + '</p>' +
            '<p class="ac-challenge-result-row">本关目标：' + chEsc(chStage.goalStatement || '') + '</p>',
          btn: '重试本关',
          onBtn: () => startChallenge(chStage.id),
          btn2: '返回选关',
          onBtn2: exitToChallengeSelect,
        });
        pauseUi.sync();
        syncChallengeHud();
        return true;
      }

      function exitToChallengeSelect() {
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chBells = [];
        chLastResult = null;
        chErrorReason = '';
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showChallengePanel();
        return true;
      }

      function exitChallengeToStart() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chStageIndex = -1;
        chBells = [];
        autosave.clear();
        if (chDom.hud) chDom.hud.hidden = true;
        if (gameHudEl) gameHudEl.hidden = false;
        reset();
        state = 'ready';
        pauseUi.sync();
        syncJoyTools();
        showStart();
        return true;
      }

      function restoreChallenge(data) {
        if (!A.Challenge || !data || typeof data.stageId !== 'string') return false;
        const stage = A.Challenge.stage(gameId, data.stageId);
        if (!stage) return false;
        const index = challengeData.findIndex((item) => item.id === stage.id);
        if (index < 0 || !buildChallengeStage(index)) return false;
        if (Array.isArray(data.chConsumed)) {
          for (const id of data.chConsumed) {
            const bell = chBells.find((item) => item.id === id);
            if (bell) bell.consumed = true;
          }
        }
        chSeqIndex = clamp(Math.floor(Number(data.chSeqIndex) || 0), 0, chSequence.length);
        chCombo = Math.max(0, Number(data.chCombo) || 0);
        chWrongHits = Math.max(0, Number(data.chWrongHits) || 0);
        chCollectibles = Array.isArray(data.chCollectibles) ? data.chCollectibles.filter((id) => typeof id === 'string') : [];
        chElapsed = Math.max(0, Number(data.chElapsed) || 0);
        chAssisted = !!data.chAssisted;
        if (data.player && isFinite(data.player.x) && isFinite(data.player.y)) {
          player.x = clamp(Number(data.player.x), PLAYER_R, W - PLAYER_R);
          player.y = Number(data.player.y);
          player.vx = Number(data.player.vx) || 0;
          player.vy = Number(data.player.vy) || 0;
        }
        state = 'playing';
        syncHud();
        syncJoyTools();
        syncChallengeHud();
        return true;
      }

      function challengeObservable() {
        const next = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null;
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageNumber: chStage ? chStage.stageNumber : null,
          state,
          bells: chBells.map((bell) => ({ id: bell.id, x: bell.x, y: bell.y, kind: bell.kind, consumed: bell.consumed, optional: bell.kind === 'bonus' })),
          sequence: chSequence.slice(),
          seqIndex: chSeqIndex,
          nextBellId: next,
          combo: chCombo,
          wrongHits: chWrongHits,
          collectibles: chCollectibles.slice(),
          bonusScore: chBonusScore,
          snowflakeScore: { visible: snowflakeScoreVisible, timer: Math.round(snowflakeScoreTimer * 10) / 10 },
          player: { x: player.x, y: player.y, vx: player.vx, vy: player.vy },
          elapsedSec: Math.round(chElapsed * 10) / 10,
          assisted: chAssisted,
          goalStatement: chStage ? chStage.goalStatement : null,
          errorReason: chErrorReason,
          cleared: !!chLastResult,
          hudHidden: gameHudEl ? gameHudEl.hidden : null,
        };
      }


      function serialize() {
        /* 0.17 职业 run：绝不写 studiokit:arcade:runs:v1（经典/挑战局内档保持原样）。 */
        if (careerLocked) return null;
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: mode === 'challenge' && chStage ? chStage.id : null,
          chSeqIndex,
          chCombo,
          chWrongHits,
          chCollectibles: chCollectibles.slice(),
          chConsumed: chBells.filter((bell) => bell.consumed).map((bell) => bell.id),
          chElapsed,
          chAssisted,
          player: { x: player.x, y: player.y, vx: player.vx, vy: player.vy, face: player.face, onPad: player.onPad, lastBellY: player.lastBellY },
          bells: bells.map((b) => ({ x: b.x, y: b.y, phase: b.phase, consumed: !!b.consumed })),
          pad,
          camY,
          genY,
          topY,
          startY,
          combo,
          bellScore,
          prevXs,
          tools: { magnet: tools.magnet, encore: tools.encore },
          magnetTimer,
          encoreHits,
        };
      }

      function restoreClassic(data) {
        if (!data || !data.player || !Array.isArray(data.bells)) return false;
        try {
          reset();
          bells = data.bells
            .filter((b) => b && isFinite(b.x) && isFinite(b.y))
            .map((b) => ({ x: clamp(Number(b.x), 20, W - 20), y: Number(b.y), r: BELL_R, phase: Number(b.phase) || 0, consumed: !!b.consumed }));
          player.x = clamp(Number(data.player.x) || W / 2, PLAYER_R, W - PLAYER_R);
          player.y = Number(data.player.y) || H - 150;
          player.vx = Number(data.player.vx) || 0;
          player.vy = Number(data.player.vy) || 0;
          player.face = data.player.face === -1 ? -1 : 1;
          player.onPad = !!data.player.onPad;
          player.lastBellY = typeof data.player.lastBellY === 'number' && isFinite(data.player.lastBellY) ? Number(data.player.lastBellY) : null;
          if (data.pad && isFinite(data.pad.x)) {
            pad = { x: Number(data.pad.x), y: Number(data.pad.y), w: Number(data.pad.w) || 120, h: 14 };
          }
          camY = Number(data.camY) || 0;
          genY = Number(data.genY) || H - 120;
          startY = Number(data.startY) || player.y;
          topY = Number(data.topY) || player.y;
          combo = Math.max(0, Number(data.combo) || 0);
          bellScore = Math.max(0, Number(data.bellScore) || 0);
          prevXs = Array.isArray(data.prevXs) ? data.prevXs.filter((x) => isFinite(x)) : [];
          tools.magnet = data.tools && Number.isFinite(Number(data.tools.magnet))
            ? clamp(Math.floor(Number(data.tools.magnet)), 0, JOY_CAPS.magnet)
            : JOY_START.magnet;
          tools.encore = data.tools && Number.isFinite(Number(data.tools.encore))
            ? clamp(Math.floor(Number(data.tools.encore)), 0, JOY_CAPS.encore)
            : JOY_START.encore;
          magnetTimer = clamp(Number(data.magnetTimer) || 0, 0, MAGNET_DURATION);
          encoreHits = clamp(Math.floor(Number(data.encoreHits) || 0), 0, ENCORE_HITS);
          recordSaved = false;
          syncHud();
          syncJoyTools();
          return true;
        } catch (err) {
          return false;
        }
      }

      /* 统一恢复入口：0.8 及更早存档缺 mode 一律按经典恢复；mode:'challenge' 走挑战恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      const autosave = A.createRunAutosave('snowbells', serialize, {
        every: 4,
        meta: () => ({ score, summary: mode === 'challenge' && chStage ? '挑战 ' + chStage.id + ' · 进度 ' + chSeqIndex + '/' + chSequence.length : `得分 ${score} · 连击 ${combo}` }),
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        if (snowflakeScoreTimer > 0) {
          snowflakeScoreTimer = Math.max(0, snowflakeScoreTimer - dt);
          if (snowflakeScoreTimer === 0) snowflakeScoreVisible = false;
        }
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        particles.update(dt);
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life -= dt;
          r.r += 90 * dt;
          if (r.life <= 0) rings.splice(i, 1);
        }
        snow.forEach((s) => {
          s.y += s.v * dt;
          s.x += s.drift * dt;
          if (s.y > H) {
            s.y = -4;
            s.x = rand(0, W);
          }
          if (s.x < -4) s.x = W + 4;
          if (s.x > W + 4) s.x = -4;
        });
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        const hadMagnet = magnetTimer > 0;
        magnetTimer = Math.max(0, magnetTimer - dt);
        if (hadMagnet && magnetTimer <= 0) {
          syncJoyTools();
          autosave.saveNow();
        }

        const ACC = 2100;
        const MAX_VX = 250;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (input.pointer.down) dir = input.pointer.x < W / 2 ? -1 : 1;
        if (dir !== 0) {
          player.vx += dir * ACC * dt;
          player.face = dir;
        } else {
          player.vx -= player.vx * Math.min(1, 10 * dt);
        }
        player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
        player.x += player.vx * dt;
        if (player.x < PLAYER_R) {
          player.x = PLAYER_R;
          player.vx = 0;
        } else if (player.x > W - PLAYER_R) {
          player.x = W - PLAYER_R;
          player.vx = 0;
        }

        player.prevBottom = player.y + PLAYER_R;
        player.vy = Math.min(950, player.vy + GRAVITY * dt);
        player.y += player.vy * dt;

        if (pad && player.onPad) {
          if (player.vy > 0 && player.x > pad.x - 6 && player.x < pad.x + pad.w + 6) {
            if (player.prevBottom <= pad.y + 2 && player.y + PLAYER_R >= pad.y) {
              player.y = pad.y - PLAYER_R;
              player.vy = BOUNCE_V;
              combo = 0;
              A.Sfx.play('jump');
              testAimNextBell();
            }
          }
        }

        if (player.vy > 40) {
          for (const b of bells) {
            if (b.consumed) continue;
            if (Math.abs(b.y - player.y) > 40) continue;
            if (A.Physics.circleCircle(player.x, player.y, PLAYER_R, b.x, b.y, b.r + (magnetTimer > 0 ? MAGNET_BONUS : 0))) {
              b.consumed = true;
              combo += 1;
              const usedEncore = encoreHits > 0;
              const gain = 10 * combo * (usedEncore ? 2 : 1);
              if (usedEncore) encoreHits -= 1;
              bellScore += gain;
              player.vy = BOUNCE_V;
              player.lastBellY = player.y;
              testAimNextBell();
              A.Sfx.play('bell', combo);
              rings.push({ x: b.x, y: b.y, r: BELL_R + 4, life: 0.65, maxLife: 0.65, text: '+' + gain + ' · ×' + combo });
              particles.emit(b.x, b.y, {
                count: A.reducedMotion ? 4 : 10,
                speed: [30, 140],
                life: [0.25, 0.6],
                size: [1.5, 3.5],
                colors: ['#ffd23f', '#fff3c4', '#ffffff'],
                gravity: 200,
              });
              syncHud();
              /* 0.17 职业 run：不同铃铛每个一次（uid 来自真实生成/消费序号；复踩不加计）。 */
              if (careerActive()) noteCareerUniqueBell(b.uid);
              if (careerActive()) careerObserve('bell.rung', { combo, gain });
              else if (career && mode === 'classic' && !careerLocked) career.observe('bell.rung', { combo, gain });
              if (usedEncore) {
                syncJoyTools();
                autosave.saveNow();
              }
              break;
            }
          }
        }

        if (combo > 0 && player.vy > 0 && player.lastBellY != null && player.y - player.lastBellY > 380) combo = 0;
        if (combo > 0) player.lastBellY = Math.min(player.lastBellY, player.y);

        const line = camY + H * 0.42;
        if (player.y < line) camY -= line - player.y;

        if (player.y < topY) {
          topY = player.y;
          syncHud();
          /* 0.17：真实物理把最高点上移、分数提交后，才发 height.reached（每 10 高度分一次）。 */
          noteCareerHeight(false);
        }

        ensureBells();

        if (player.y > camY + H + 30) {
          gameOver();
          input.endFrame();
          return;
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      /* 挑战铃铛按 kind 区分：classic（缺省金铃）/ rest 空心虚线环 / bonus 星形高亮 / blue·red 填色+字样。
       * 静音与色弱可读：休止靠"空心虚线环+双竖线"，彩铃靠星形，蓝/红铃额外写"蓝/红"字样，不只靠颜色。 */
      const BELL_STYLE = {
        normal: { shape: 'classic', dashed: false, fillColor: null, stroke: '#9c7420', label: '' },
        rest: { shape: 'hollow-dashed-ring', dashed: true, fillColor: null, stroke: '#9fb4e8', label: '休' },
        bonus: { shape: 'sparkle-star', dashed: false, fillColor: '#ff9de2', stroke: '#ffd23f', label: '彩' },
        blue: { shape: 'fisheye-disc', dashed: false, fillColor: '#3d7dff', stroke: '#bcd5ff', label: '蓝' },
        red: { shape: 'fisheye-disc', dashed: false, fillColor: '#e8504f', stroke: '#ffc2b8', label: '红' },
      };
      const bellDrawStats = { classic: 0, rest: 0, bonus: 0, blue: 0, red: 0 };
      function bellStyle(kind) {
        return BELL_STYLE[kind] || BELL_STYLE.normal;
      }
      function bellDrawBucket(kind) {
        return kind === 'rest' || kind === 'bonus' || kind === 'blue' || kind === 'red' ? kind : 'classic';
      }

      function drawBell(b) {
        const y = b.y - camY;
        if (y < -20 || y > H + 20) return;
        const kind = b && typeof b.kind === 'string' ? b.kind : 'normal';
        const style = bellStyle(kind);
        bellDrawStats[bellDrawBucket(kind)] += 1;
        const bob = Math.sin(b.phase + performance.now() / 700) * 2;
        ctx.save();
        ctx.globalAlpha = b.consumed ? 0.28 : 1;
        ctx.translate(b.x, y + bob);
        ctx.strokeStyle = 'rgba(147,160,200,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -b.r - bob);
        ctx.lineTo(0, -34);
        ctx.stroke();
        if (style.shape === 'classic') {
          /* 经典模式缺省金铃：与修复前完全一致，不改经典视觉。 */
          const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, b.r + 2);
          g.addColorStop(0, '#ffe9a3');
          g.addColorStop(1, '#e8b83a');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, b.r, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = '#9c7420';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = '#9c7420';
          ctx.beginPath();
          ctx.arc(0, b.r - 2, 2.4, 0, TAU);
          ctx.fill();
        } else if (style.shape === 'hollow-dashed-ring') {
          /* 休止铃：空心虚线环 + 双竖线（静音下也能凭形状识别）。 */
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = style.stroke;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, b.r, 0, TAU);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = style.stroke;
          ctx.fillRect(-3.2, -3.6, 2, 7.2);
          ctx.fillRect(1.2, -3.6, 2, 7.2);
          A.draw.label(ctx, style.label, 0, b.r + 11, { font: 'bold 10px system-ui', color: style.stroke });
        } else if (style.shape === 'sparkle-star') {
          /* 彩铃：六角星高亮，形状与金铃/休止铃不同。 */
          const g = ctx.createRadialGradient(0, 0, 1, 0, 0, b.r + 6);
          g.addColorStop(0, '#fff6c4');
          g.addColorStop(0.55, style.fillColor);
          g.addColorStop(1, style.stroke);
          ctx.fillStyle = g;
          ctx.beginPath();
          const outer = b.r + 6;
          for (let i = 0; i < 10; i += 1) {
            const rad = i % 2 === 0 ? outer : outer * 0.42;
            const ang = -Math.PI / 2 + (i * Math.PI) / 5;
            const px = Math.cos(ang) * rad;
            const py = Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.85)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          A.draw.label(ctx, style.label, 0, b.r + 11, { font: 'bold 10px system-ui', color: '#ffd7f2' });
        } else {
          /* 蓝/红铃：实心填色 + 白字"蓝/红"，色弱/灰度下凭字样仍可区分。 */
          const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, b.r + 2);
          g.addColorStop(0, style.stroke);
          g.addColorStop(1, style.fillColor);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, b.r, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = style.stroke;
          ctx.lineWidth = 1.4;
          ctx.stroke();
          A.draw.label(ctx, style.label, 0, 0.5, { font: 'bold 9px system-ui', color: '#ffffff' });
        }
        ctx.restore();
      }

      function drawRabbit() {
        const y = player.y - camY;
        ctx.save();
        ctx.translate(player.x, y);
        const stretch = clamp(1 + player.vy / -3200, 0.85, 1.15);
        ctx.scale(1, stretch);
        ctx.scale(player.face >= 0 ? 1 : -1, 1);
        ctx.fillStyle = '#f4f6ff';
        ctx.strokeStyle = '#c9cfe8';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(-5, -14, 3.6, 10, -0.25, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(5, -14, 3.6, 10, 0.25, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffc9d6';
        ctx.beginPath();
        ctx.ellipse(-5, -14, 1.6, 6, -0.25, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(5, -14, 1.6, 6, 0.25, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#f4f6ff';
        ctx.beginPath();
        ctx.arc(0, 0, PLAYER_R, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#c9cfe8';
        ctx.stroke();
        ctx.fillStyle = '#2c3352';
        ctx.beginPath();
        ctx.arc(4.5, -3, 1.6, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(10, -3, 1.6, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#2c3352';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(7, 1.5, 2.6, 0.15, Math.PI - 0.15);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,180,200,0.7)';
        ctx.beginPath();
        ctx.arc(2, 1.5, 2, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0c1230');
        bg.addColorStop(0.7, '#1b2c55');
        bg.addColorStop(1, '#31527c');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(245,248,255,0.95)';
        ctx.beginPath();
        ctx.arc(340, 96, 34, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#ffd9e8';
        ctx.beginPath();
        ctx.arc(352, 90, 30, 0, TAU);
        ctx.fill();

        const par = (camY * 0.2) % (H + 300);
        ctx.fillStyle = 'rgba(226,236,255,0.10)';
        for (let k = -1; k < 2; k++) {
          const baseY = k * (H + 300) + par + H;
          ctx.beginPath();
          ctx.moveTo(0, baseY);
          ctx.quadraticCurveTo(110, baseY - 120, 240, baseY - 30);
          ctx.quadraticCurveTo(340, baseY + 40, 420, baseY - 60);
          ctx.lineTo(420, baseY + 300);
          ctx.lineTo(0, baseY + 300);
          ctx.closePath();
          ctx.fill();
        }

        (mode === 'challenge' ? chBells : bells).forEach(drawBell);
        if (mode === 'challenge' && chStage) {
          const nextId = chSeqIndex < chSequence.length ? chSequence[chSeqIndex] : null;
          const nextBell = nextId ? chBells.find((bell) => bell.id === nextId) : null;
          if (nextBell && !nextBell.consumed) {
            const ny = nextBell.y - camY;
            ctx.save();
            ctx.strokeStyle = 'rgba(99,224,200,0.9)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(nextBell.x, ny, nextBell.r + 10 + Math.sin(performance.now() / 220) * 2, 0, TAU);
            ctx.stroke();
            ctx.setLineDash([]);
            A.draw.label(ctx, '下一铃 ' + nextId, clamp(nextBell.x, 42, W - 42), Math.max(64, ny - 26), {
              font: 'bold 12px system-ui',
              color: '#63e0c8',
            });
            ctx.restore();
          }
        }

        if (pad) {
          const py = pad.y - camY;
          if (py > -40 && py < H + 40) {
            ctx.fillStyle = '#dfe8fb';
            A.draw.roundRect(ctx, pad.x, py, pad.w, pad.h, 7);
            ctx.fill();
            ctx.fillStyle = '#b9c8ec';
            ctx.fillRect(pad.x + 6, py + pad.h - 5, pad.w - 12, 3);
          }
        }

        rings.forEach((r) => {
          const y = r.y - camY;
          if (y < -20 || y > H + 20) return;
          ctx.strokeStyle = `rgba(255,210,63,${(r.life / r.maxLife) * 0.7})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(r.x, y, r.r, 0, TAU);
          ctx.stroke();
          if (r.text) {
            A.draw.label(ctx, r.text, clamp(r.x, 54, W - 54), y - 20, {
              font: 'bold 14px system-ui',
              color: '#fff3c4',
              alpha: clamp(r.life / r.maxLife, 0, 1),
            });
          }

      function drawSnowflakeScore() {
        const alpha = clamp(snowflakeScoreTimer / 1.2, 0, 1);
        const baseY = H * 0.42;
        const left = 44;
        const right = W - 44;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(9,16,35,0.82)';
        A.draw.roundRect(ctx, left - 14, baseY - 70, right - left + 28, 140, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,220,255,0.85)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i += 1) {
          const y = baseY - 24 + i * 12;
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.stroke();
        }
        A.draw.label(ctx, '❄ 雪花乐谱 · 完美终曲', W / 2, baseY - 52, { font: 'bold 14px system-ui', color: '#bfe9ff' });
        const notes = [0, 1, 2, 3, 4, 5];
        notes.forEach((i) => {
          const x = left + 22 + i * ((right - left - 44) / 5);
          const y = baseY - 24 + (i % 5) * 12;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          for (let k = 0; k < 3; k += 1) {
            const a = (k * Math.PI) / 3;
            ctx.beginPath();
            ctx.moveTo(x - Math.cos(a) * 6, y - Math.sin(a) * 6);
            ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6);
            ctx.stroke();
          }
          ctx.fillStyle = '#bfe9ff';
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();

          regression() {

              /* 2) 真实绘制分支命中：直接调用内部 drawBell 并读分支计数。 */
              const before = Object.assign({}, bellDrawStats);

                bellDrawStats.rest === before.rest + 1 &&
                bellDrawStats.bonus === before.bonus + 1 &&

                bellDrawStats.red === before.red + 1,
                'drawBell 实际命中 classic/rest/bonus/blue/red 五条绘制分支'

                  /* 0.10.0 回归 2：C06 wrongHits===0 通关显示纯视觉雪花乐谱，不持久化。 */

                  check(snowflakeScoreVisible === true && snowflakeScoreTimer > 0, 'C06 无错通关触发雪花乐谱（纯视觉，timer=' + snowflakeScoreTimer + '）');
                  const runsRaw = localStorage.getItem('studiokit:arcade:runs:v1');

                  check(joyUsable('encore') === false, '挑战关安可仍禁用（joyUsable=false）');

            } catch (err) {

            return { pass, fail, details };
          },

                check(counted === false && careerUniqueCount === before, '同一 bellId 复踩不计（' + known + '）');
              } else {
                check(true, '尚未踩铃：复踩守卫由 fixture/harness 真实覆盖');
              }
            } catch (err) {
              fail += 1;
              details.push('FAIL careerSelfCheck 异常：' + (err && err.message ? err.message : String(err)));
            }
            return { pass, fail, details };
          };
          window.__arcadeTest.endCommissionSession = function () {
            return endCareerSession();
          };
        }
      }

      /* 无 ticket 时同步走 0.16 路径（零延迟、零行为变化）。 */
      function prepareStartScreen() {
        const saved = autosave.load();
        if (saved) {
          A.showResumePrompt(ui, saved, {
            name: '雪铃',
            onResume: () => {
              if (restore(saved.data)) {
                state = 'playing';
                ui.hide();
                loop.resume();
                pauseUi.sync(); syncJoyTools();
                autosave.saveNow();
              } else {
                autosave.clear();
                showStart();
              }
            },
            onRestart: () => {
              autosave.clear();
              showStart();
            },
          });
        } else {
          showStart();
        }
      }

      /* 0.17 职业入口：URL 带 ?career=<ticketId> 时先等桥确认 ticket，再决定
         「职业开局弹层」还是经典开局；无参数时同步走 0.16 路径。 */
      function bootStartScreen() {
        const ticketId = careerTicketParam();
        const ready = career && career.ready;
        if (!ticketId || !career || !ready || typeof ready.then !== 'function') {
          prepareStartScreen();
          return;
        }
        let settled = false;
        let guard = null;
        const finishBoot = () => {
          if (settled) return;
          settled = true;
          try {
            if (guard) clearTimeout(guard);
          } catch (err) {
            /* ignore */
          }
          /* 只有桥确认了属于本游戏的 run 才锁死经典记录；否则按 0.16 经典启动（fail-open）。 */
          const runInfo = readCareerRun();
          if (runInfo) activateCareerRun(runInfo);
          prepareStartScreen();
        };
        try {
          guard = setTimeout(finishBoot, 3500);
        } catch (err) {
          guard = null;
        }
        Promise.resolve(ready).then(finishBoot, finishBoot);
        /* 极端慢启动兜底：若 3.5s 计时器已按经典开局、桥随后才确认职业 run，
           立刻切回职业开局（清掉这段时间可能写下的经典局内档，不产生任何经典记录）。 */
        try {
          setTimeout(() => {
            if (careerLocked) return;
            const late = readCareerRun();
            if (!late) return;
            try {
              A.RunSave.clear('snowbells');
            } catch (err) {
              /* ignore */
            }
            activateCareerRun(late);
            showStart();
          }, 1500);
        } catch (err) {
          /* ignore */
        }
      }
      bootStartScreen();
      loop.start();
    })();
  </script>
</body>
</html>
