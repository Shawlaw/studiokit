<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="砖块计划：挡板反弹打碎砖墙，接住加宽 / 减速 / 加命道具，关卡越高球越快、挡板越窄，竖屏街机小游戏。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <style>
    .challenge-sheet { position: absolute; inset: 8px; z-index: 6; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: auto; }
    .challenge-sheet[hidden] { display: none; }
    .challenge-sheet .ac-challenge-panel { width: 100%; max-height: 100%; overflow: auto; }
  </style>
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/brick-breaker.js"></script>
  <title>砖块计划 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#4fc3f7; --card-accent:#4fc3f7">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">🧱 砖块计划</h1>
      <div class="game-hud">
        <span>分数 <strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <div class="ac-challenge-hud" data-ch-hud hidden>
        <span><strong data-ch-stage>C01</strong> <span data-ch-title>挑战</span></span>
        <span data-ch-goal>目标</span>
        <span>用时 <strong data-ch-time>00:00</strong></span>
        <span>剩余 <strong data-ch-remain>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="砖块计划游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>砖块计划</h2>
            <p data-ov-text>挡板反弹，打碎砖墙</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="challenge-sheet" data-ch-panel hidden></div>
      </div>
    </div>
    <p class="game-hint">拖动 / ←→ 移动挡板 · 点击 / 空格发球 · 接住加宽 / 减速 / 加命道具 · 道具 1 宽板 / 2 重锤 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, randInt, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const FIELD = { x: 18, y: 106, w: 384, h: 548 };
      const PADDLE_Y = 638;
      const BALL_R = 7;
      const COLS = 8;
      const BRICK_W = 44;
      const BRICK_H = 20;
      const BRICK_GAP = 4;
      const BRICK_X = 20;
      const BRICK_Y = 128;

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        chPanel: document.querySelector('[data-ch-panel]'),
        chHud: document.querySelector('[data-ch-hud]'),
        chStage: document.querySelector('[data-ch-stage]'),
        chTitle: document.querySelector('[data-ch-title]'),
        chGoal: document.querySelector('[data-ch-goal]'),
        chTime: document.querySelector('[data-ch-time]'),
        chRemain: document.querySelector('[data-ch-remain]'),
      };
      const classicHudSpans = Array.from(document.querySelectorAll('.game-hud > span'));
      const ui = A.createOverlayUi(dom);

      const particles = A.createParticles();

      const BRICK_COLORS = [
        ['#4fc3f7', '#0d3550'],
        ['#7c5cff', '#1b1145'],
        ['#ff9a3d', '#4a2200'],
        ['#5ad1a0', '#0d3a2a'],
        ['#ff6b9d', '#4a1028'],
        ['#ffd23f', '#4a3800'],
        ['#b06bff', '#2a0d4a'],
      ];
      const POWER_TYPES = ['wide', 'slow', 'life'];
      const TOOL_START = { wide: 1, smash: 1 };
      const TOOL_CAPS = { wide: 1, smash: 1 };
      const WIDE_DURATION = 10;
      const SMASH_HITS = 3;
      const FINAL_LEVEL = 3;
      const tools = { wide: TOOL_START.wide, smash: TOOL_START.smash };
      let smashHits = 0;

      let bricks = [];
      let paddle = { x: W / 2 - 48, y: PADDLE_Y, w: 96, h: 14, baseW: 96 };
      let ball = { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, r: BALL_R };
      let pickups = [];
      let score = 0;
      let lives = 3;
      let level = 1;
      let launched = false;
      let wideTimer = 0;
      /* 区分“主动宽板”与掉落拾取：主动买的效果不因失球被清零。 */
      let wideFromTool = false;
      let slowTimer = 0;
      let levelClearTimer = 0;
      let shake = 0;
      let state = 'ready';
      let recordSaved = false;
      let spaceWasDown = false;
      let lastLevelConfig = null;

      /* 0.9 挑战模式状态：mode='classic' 时经典逻辑完全不变 */
      const GAME_ID = 'brick-breaker';
      let mode = 'classic';
      let panelOpen = false;
      const CH_LAUNCH_ANGLES = [0.45, -0.45, 0.3, -0.3, 0.6, -0.6];
      const CH_TOKEN_HP = { '1': 1, '2': 2, '3': 3, 'K': 1 };
      const ch = {
        active: false,
        stage: null,
        index: -1,
        stageState: 'none',
        elapsed: 0,
        bricks: [],
        paddle: { x: W / 2 - 48, y: PADDLE_Y, w: 96, h: 14 },
        ball: { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0 },
        lives: 3,
        speed: 300,
        launched: false,
        launches: 0,
        unlocked: true,
        keysTotal: 0,
        noBrickSec: 0,
        maxNoBrickSec: 0,
        recoveries: 0,
        hintShown: false,
        done: false,
        assisted: false,
        replayMode: false,
      };

      let high = A.Progress.get('brick-breaker').high;
      dom.hudHigh.textContent = String(high);

      function levelConfig(lv) {
        return {
          rows: Math.min(7, 3 + lv),
          hp: lv <= 2 ? 1 : lv <= 4 ? 2 : 3,
          speed: Math.min(500, 290 + (lv - 1) * 26),
          paddleW: Math.max(62, 96 - (lv - 1) * 6),
          time: 0,
        };
      }

      function currentSpeed() {
        const base = levelConfig(level).speed;
        return base * (slowTimer > 0 ? 0.68 : 1);
      }

      function resetBall() {
        paddle.w = levelConfig(level).paddleW + (wideTimer > 0 ? 30 : 0);
        paddle.x = clamp(paddle.x, FIELD.x + 6, FIELD.x + FIELD.w - paddle.w - 6);
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - BALL_R - 1;
        ball.vx = 0;
        ball.vy = 0;
        launched = false;
      }

      function spawnBricks() {
        const cfg = levelConfig(level);
        lastLevelConfig = cfg;
        bricks = [];
        for (let r = 0; r < cfg.rows; r++) {
          for (let c = 0; c < COLS; c++) {
            const hp = cfg.hp > 1 && (r + c) % 4 === 0 ? cfg.hp : cfg.hp === 3 ? 2 : cfg.hp;
            const colors = BRICK_COLORS[r % BRICK_COLORS.length];
            bricks.push({
              x: BRICK_X + c * (BRICK_W + BRICK_GAP),
              y: BRICK_Y + r * (BRICK_H + BRICK_GAP),
              w: BRICK_W,
              h: BRICK_H,
              hp,
              maxHp: hp,
              color: colors[0],
              dark: colors[1],
              alive: true,
            });
          }
        }
      }

      function reset() {
        score = 0;
        lives = 3;
        level = 1;
        wideTimer = 0;
        wideFromTool = false;
        slowTimer = 0;
        levelClearTimer = 0;
        shake = 0;
        pickups = [];
        tools.wide = TOOL_START.wide;
        tools.smash = TOOL_START.smash;
        smashHits = 0;
        particles.clear();
        recordSaved = false;
        spaceWasDown = false;
        paddle.baseW = levelConfig(1).paddleW;
        paddle.w = paddle.baseW;
        paddle.x = W / 2 - paddle.w / 2;
        spawnBricks();
        resetBall();
        syncHud();
      }

      function syncHud() {
        dom.hudScore.textContent = String(score);
      }

      function startGame() {
        mode = 'classic';
        ch.active = false;
        ch.stage = null;
        ch.done = true;
        if (dom.chPanel) dom.chPanel.hidden = true;
        autosave.clear();
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        joyTools.sync();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        joyTools.sync();
        if (mode === 'challenge') updateChallengeHud();
      }

      function finish(win) {
        if (mode !== 'classic') return;
        if (state === 'over') return;
        state = 'over';
        smashHits = 0;
        joyTools.sync();
        autosave.clear();
        A.Sfx.play(win ? 'perfect' : 'over');
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('brick-breaker', score); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, score));
        }
        loop.pause();
        ui.show({
          title: win ? '全部通关！' : '挡板失守',
          text:
            `<span class="ac-score">${score}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `第 ${level} 关 · 最高 ${Math.max(high, score)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        joyTools.sync();
        autosave.saveNow();
        if (mode === 'challenge') {
          showOverlay({
            title: '已暂停',
            text: '挑战计时与物理已暂停，局内进度已保存。',
            btn: '继续',
            onBtn: resumeGame,
            btn2: '退出挑战',
            onBtn2: exitChallenge,
          });
        } else {
          showOverlay({ title: '已暂停', text: '球停在半空。<br/>局内进度已保存，可以随时离开。', btn: '继续', onBtn: resumeGame });
        }
        pauseUi.sync();
      }

      function showStart() {
        const available = challengeAvailable();
        ui.show({
          title: '砖块计划',
          text: '挡板反弹球，打碎所有砖块。<br/>接住 <b>加宽 / 减速 / 加命</b> 道具<br/>关卡越高球越快、挡板越窄',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: available ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: available ? () => openChallengePanel() : () => A.showToast('挑战数据不可用'),
        });
        if (dom.ovBtn2) dom.ovBtn2.disabled = !available;
      }

      function launch() {
        if (launched) return;
        launched = true;
        const angle = rand(-0.62, 0.62);
        const sp = currentSpeed();
        ball.vx = Math.sin(angle) * sp;
        ball.vy = -Math.cos(angle) * sp;
        A.Sfx.play('jump');
      }

      function spawnPickup(brick) {
        if (Math.random() > 0.14) return;
        pickups.push({
          x: brick.x + brick.w / 2,
          y: brick.y + brick.h / 2,
          r: 11,
          vy: 90,
          type: POWER_TYPES[randInt(0, POWER_TYPES.length - 1)],
          spin: 0,
        });
      }

      function activatePower(type, x, y) {
        if (type === 'wide') {
          wideTimer = WIDE_DURATION;
          wideFromTool = false;
          paddle.w = levelConfig(level).paddleW + 30;
          paddle.x = clamp(paddle.x, FIELD.x + 6, FIELD.x + FIELD.w - paddle.w - 6);
          A.Sfx.play('spring');
        } else if (type === 'slow') {
          slowTimer = 8;
          A.Sfx.play('bell', 2);
        } else {
          lives = Math.min(5, lives + 1);
          A.Sfx.play('perfect');
        }
        particles.emit(x, y, {
          count: A.reducedMotion ? 5 : 14,
          speed: [30, 150],
          life: [0.25, 0.6],
          size: [2, 4],
          colors: ['#4fc3f7', '#ffd23f', '#ffffff'],
          gravity: 80,
        });
      }

      function collectPickup(p) {
        activatePower(p.type, p.x, p.y);
      }

      function hitBrick(brick) {
        const smashed = smashHits > 0;
        if (smashed) {
          brick.hp = 1;
          smashHits -= 1;
        }
        brick.hp -= 1;
        if (brick.hp <= 0) {
          brick.alive = false;
          score += 10 * brick.maxHp + level * 4;
          syncHud();
          particles.emit(brick.x + brick.w / 2, brick.y + brick.h / 2, {
            count: A.reducedMotion ? 4 : 10,
            speed: [30, 160],
            life: [0.2, 0.5],
            size: [2, 4],
            colors: [brick.color, brick.dark, '#ffffff'],
            gravity: 200,
          });
          spawnPickup(brick);
          A.Sfx.play('hit');
        } else {
          A.Sfx.play('ui');
        }
        if (smashed) {
          joyTools.sync();
          autosave.saveNow();
        }
      }

      function loseBall() {
        lives -= 1;
        A.Sfx.play('over');
        /* 主动宽板是花次数买的，失球不清零；拾取来的宽板按原规则清掉。 */
        if (!wideFromTool) wideTimer = 0;
        slowTimer = 0;
        resetBall();
        syncHud();
        joyTools.sync();
        if (lives <= 0) finish(false);
      }

      function moveBall(dt) {
        const steps = Math.max(1, Math.ceil((currentSpeed() * dt) / 7));
        const sub = dt / steps;
        for (let s = 0; s < steps; s++) {
          ball.x += ball.vx * sub;
          ball.y += ball.vy * sub;

          if (ball.x - ball.r < FIELD.x) {
            ball.x = FIELD.x + ball.r;
            ball.vx = Math.abs(ball.vx);
          } else if (ball.x + ball.r > FIELD.x + FIELD.w) {
            ball.x = FIELD.x + FIELD.w - ball.r;
            ball.vx = -Math.abs(ball.vx);
          }
          if (ball.y - ball.r < FIELD.y) {
            ball.y = FIELD.y + ball.r;
            ball.vy = Math.abs(ball.vy);
          }

          /* 挡板 */
          if (
            ball.vy > 0 &&
            ball.y + ball.r >= paddle.y &&
            ball.y - ball.r <= paddle.y + paddle.h &&
            ball.x >= paddle.x - ball.r &&
            ball.x <= paddle.x + paddle.w + ball.r
          ) {
            ball.y = paddle.y - ball.r;
            const offset = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
            const sp = currentSpeed();
            const angle = offset * 0.95;
            ball.vx = Math.sin(angle) * sp;
            ball.vy = -Math.cos(angle) * sp;
            shake = A.reducedMotion ? 0 : 2;
            A.Sfx.play('land');
          }

          /* 砖块 */
          for (const brick of bricks) {
            if (!brick.alive) continue;
            if (A.Physics.circleBox(ball.x, ball.y, ball.r, brick)) {
              const dx = ball.x - (brick.x + brick.w / 2);
              const dy = ball.y - (brick.y + brick.h / 2);
              if (Math.abs(dx) / (brick.w / 2) > Math.abs(dy) / (brick.h / 2)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
              else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
              hitBrick(brick);
              break;
            }
          }

          if (ball.y - ball.r > H + 20) {
            loseBall();
            return;
          }
        }
      }

      function update(dt) {
        particles.update(dt);
        shake = Math.max(0, shake - dt * 30);
        if (mode === 'challenge') {
          updateChallenge(dt);
          return;
        }
        if (state === 'levelclear') {
          levelClearTimer -= dt;
          if (levelClearTimer <= 0) {
            if (level === FINAL_LEVEL) {
              score += 100 + lives * 40;
              syncHud();
              finish(true);
            } else {
              level += 1;
              score += 100 + lives * 40;
              spawnBricks();
              wideTimer = 0;
              wideFromTool = false;
              slowTimer = 0;
              pickups = [];
              resetBall();
              state = 'playing';
              joyTools.sync();
              autosave.saveNow();
              syncHud();
            }
          }
          input.endFrame();
          return;
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);

        if (wideTimer > 0) {
          wideTimer -= dt;
          if (wideTimer <= 0) {
            wideTimer = 0;
            wideFromTool = false;
            paddle.w = levelConfig(level).paddleW;
            joyTools.sync();
          }
        }
        if (slowTimer > 0) slowTimer -= dt;

        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (dir !== 0) paddle.x += dir * 380 * dt;
        if (input.pointer.down) paddle.x = input.pointer.x - paddle.w / 2;
        paddle.x = clamp(paddle.x, FIELD.x + 6, FIELD.x + FIELD.w - paddle.w - 6);

        if (!launched) {
          ball.x = paddle.x + paddle.w / 2;
          ball.y = paddle.y - BALL_R - 1;
          const spaceNow = input.isDown(' ');
          if (input.pointer.wentDown || (spaceNow && !spaceWasDown)) launch();
          spaceWasDown = spaceNow;
        } else {
          moveBall(dt);
        }

        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.y += p.vy * dt;
          p.spin += dt * 3;
          if (p.y > H + 20) {
            pickups.splice(i, 1);
            continue;
          }
          if (p.y + p.r >= paddle.y && p.y - p.r <= paddle.y + paddle.h && p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
            collectPickup(p);
            pickups.splice(i, 1);
          }
        }

        if (bricks.every((b) => !b.alive)) {
          state = 'levelclear';
          levelClearTimer = 1.5;
          pickups = [];
          joyTools.sync();
          A.Sfx.play('perfect');
        }
        input.endFrame();
      }

      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        const classicState = {
          bricks: bricks.map((b) => ({ x: b.x, y: b.y, w: b.w, h: b.h, hp: b.hp, maxHp: b.maxHp, alive: b.alive, color: b.color, dark: b.dark })),
          paddle: { x: paddle.x, y: paddle.y, w: paddle.w, h: paddle.h, baseW: paddle.baseW },
          ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, r: ball.r },
          pickups,
          score,
          lives,
          level,
          launched,
          wideTimer,
          slowTimer,
          wideFromTool,
          tools: { wide: tools.wide, smash: tools.smash },
          smashHits,
        };
        if (mode === 'challenge') {
          return {
            mode: 'challenge',
            stageId: ch.stage ? ch.stage.id : null,
            challengeState: serializeChallenge(),
            classic: classicState,
          };
        }
        return { mode: 'classic', ...classicState };
      }

      /** 存档恢复：mode 缺失 → 经典（0.8 旧档兼容）；mode:'challenge' → 挑战局内恢复。 */
      function restore(data) {
        if (!data || typeof data !== 'object') return false;
        if (data.mode === 'challenge') return restoreChallenge(data);
        return restoreClassic(data);
      }

      function restoreClassic(data) {
        if (!data || !Array.isArray(data.bricks) || !data.ball || !data.paddle) return false;
        try {
          reset();
          bricks = data.bricks
            .filter((b) => b && isFinite(b.x) && isFinite(b.y))
            .map((b) => ({
              x: Number(b.x),
              y: Number(b.y),
              w: Number(b.w) || BRICK_W,
              h: Number(b.h) || BRICK_H,
              hp: Math.max(1, Number(b.hp) || 1),
              maxHp: Math.max(1, Number(b.maxHp) || 1),
              alive: b.alive !== false,
              color: typeof b.color === 'string' ? b.color : '#4fc3f7',
              dark: typeof b.dark === 'string' ? b.dark : '#0d3550',
            }));
          if (!bricks.length) return false;
          level = Math.max(1, Number(data.level) || 1);
          score = Math.max(0, Number(data.score) || 0);
          lives = clamp(Number(data.lives) || 3, 1, 5);
          paddle.x = clamp(Number(data.paddle.x) || W / 2, FIELD.x, FIELD.x + FIELD.w - 60);
          paddle.w = clamp(Number(data.paddle.w) || 96, 50, 160);
          paddle.baseW = clamp(Number(data.paddle.baseW) || levelConfig(level).paddleW, 50, 160);
          ball.x = clamp(Number(data.ball.x) || W / 2, FIELD.x + BALL_R, FIELD.x + FIELD.w - BALL_R);
          ball.y = clamp(Number(data.ball.y) || PADDLE_Y - BALL_R, FIELD.y + BALL_R, H);
          ball.vx = Number(data.ball.vx) || 0;
          ball.vy = Number(data.ball.vy) || 0;
          launched = !!data.launched;
          wideTimer = clamp(Number(data.wideTimer) || 0, 0, WIDE_DURATION);
          wideFromTool = !!data.wideFromTool && wideTimer > 0;
          slowTimer = Math.max(0, Number(data.slowTimer) || 0);
          if (data.tools && typeof data.tools === 'object') {
            tools.wide = Number.isFinite(Number(data.tools.wide)) ? clamp(Math.floor(Number(data.tools.wide)), 0, TOOL_CAPS.wide) : TOOL_START.wide;
            tools.smash = Number.isFinite(Number(data.tools.smash)) ? clamp(Math.floor(Number(data.tools.smash)), 0, TOOL_CAPS.smash) : TOOL_START.smash;
          }
          smashHits = clamp(Math.floor(Number(data.smashHits) || 0), 0, SMASH_HITS);
          pickups = Array.isArray(data.pickups)
            ? data.pickups.filter((p) => p && POWER_TYPES.indexOf(p.type) !== -1).map((p) => ({
                x: Number(p.x) || W / 2,
                y: Number(p.y) || 0,
                r: 11,
                vy: Number(p.vy) || 90,
                type: p.type,
                spin: Number(p.spin) || 0,
              }))
            : [];
          recordSaved = false;
          state = 'playing';
          joyTools.sync();
          syncHud();
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('brick-breaker', serialize, {
        every: 4,
        meta: () =>
          mode === 'challenge' && ch.stage
            ? { score: challengeRemaining(), summary: `挑战 ${ch.stage.id} · 剩余 ${challengeRemaining()} 砖 · 生命 ${ch.lives}` }
            : { score, summary: `得分 ${score} · 第 ${level} 关 · 生命 ${lives}` },
      });

      function useTool(id) {
        if (state !== 'playing' || mode === 'challenge') return false;
        if (id === 'wide') {
          if (tools.wide <= 0 || wideTimer > 0) {
            A.showToast(wideTimer > 0 ? '宽板效果正在进行' : '主动宽板已经用过啦');
            return false;
          }
          tools.wide -= 1;
          activatePower('wide', paddle.x + paddle.w / 2, paddle.y - 18);
          wideFromTool = true;
          A.showToast('宽板 10 秒！');
          autosave.saveNow();
          joyTools.sync();
          return true;
        }
        if (id === 'smash') {
          if (tools.smash <= 0 || smashHits > 0) {
            A.showToast(smashHits > 0 ? '重锤球还剩 ' + smashHits + ' 次击碎' : '重锤球已经用过啦');
            return false;
          }
          tools.smash -= 1;
          smashHits = SMASH_HITS;
          A.Sfx.play('perfect');
          A.showToast('接下来 3 次砖碰直接击碎！');
          autosave.saveNow();
          joyTools.sync();
          return true;
        }
        return false;
      }

      const joyTools = A.createToolbelt([
        { id: 'wide', icon: '↔', name: '主动宽板', description: '立即加宽挡板 10 秒', getCount: () => tools.wide, use: () => useTool('wide'), active: () => wideTimer > 0 },
        { id: 'smash', icon: '🔨', name: '重锤球', description: '接下来三次砖碰直接击碎', getCount: () => tools.smash, use: () => useTool('smash'), active: () => smashHits > 0 },
      ], { isPlaying: () => state === 'playing', keys: ['1', '2'], label: '砖块计划道具', placement: 'below' });

      /* ============================================================
       * 0.9 挑战模式（C01–C06）：固定 8×5 砖阵 + K 钥匙砖 / G 门 + 固定球参数
       * - 数据：../challenge/brick-breaker.js（A.Challenge.stages）；缺失/不足 6 关 fail closed
       * - 砖坐标：x = 20 + col*48, y = 128 + row*24（与经典砖阵同格），w=44, h=20
       * - 挡板接球位置决定反弹角（offset*0.95，0 度=垂直向上）；球速/挡板宽/生命按 content
       * - 挑战不写 progress 最高分 / playtime 轮次，只写 challenge:v1
       * ============================================================ */
      function showOverlay(opts) {
        ui.show(opts);
        if (dom.ovBtn2) dom.ovBtn2.disabled = false;
      }

      function challengeStagesData() {
        if (!A.Challenge || typeof A.Challenge.stages !== 'function') return [];
        return A.Challenge.stages(GAME_ID);
      }
      function challengeAvailable() {
        return challengeStagesData().length === 6;
      }
      function inChallenge() {
        return mode === 'challenge';
      }

      function syncModeUi() {
        const chMode = inChallenge();
        const menuMode = !chMode && panelOpen;
        classicHudSpans.forEach((el) => {
          el.hidden = chMode || menuMode;
        });
        if (dom.chHud) dom.chHud.hidden = !chMode;
        document.body.classList.toggle('has-subhud', chMode || menuMode);
        const toolbelt = joyTools && joyTools.element ? joyTools.element : document.querySelector('[data-game-tools]');
        if (toolbelt) toolbelt.style.display = chMode || menuMode ? 'none' : '';
        joyTools.sync();
        if (chMode) updateChallengeHud();
      }

      function challengeRemaining() {
        return ch.bricks.filter((b) => b.alive && (!b.gate || ch.unlocked)).length;
      }

      function updateChallengeHud() {
        if (!dom.chHud || !ch.stage) return;
        const number = ch.stage.stageNumber || ch.index + 1;
        dom.chStage.textContent = 'C' + String(number).padStart(2, '0');
        dom.chTitle.textContent = ch.stage.title || '';
        dom.chGoal.textContent = '目标：' + (ch.stage.goalStatement || '消除所有可破坏砖');
        dom.chTime.textContent = A.Challenge.formatTime(ch.elapsed);
        dom.chRemain.textContent = String(challengeRemaining());
      }

      function renderChallengePanel() {
        if (!dom.chPanel) return;
        if (!challengeAvailable()) {
          dom.chPanel.innerHTML = '<div class="ac-challenge-panel is-empty"><p class="ac-challenge-tip">挑战数据不可用（缺失或不足 6 关）</p></div>';
          return;
        }
        dom.chPanel.innerHTML = A.Challenge.stageListHtml(GAME_ID);
        const back = document.createElement('button');
        back.type = 'button';
        back.className = 'ac-btn ac-btn-secondary';
        back.textContent = '返回开始界面';
        back.setAttribute('data-ch-back', '');
        dom.chPanel.appendChild(back);
      }

      function openChallengePanel() {
        if (!challengeAvailable()) {
          A.showToast('挑战数据不可用');
          return false;
        }
        mode = 'classic';
        panelOpen = true;
        ch.active = false;
        ch.stage = null;
        ch.done = true;
        state = 'ready';
        renderChallengePanel();
        if (dom.chPanel) dom.chPanel.hidden = false;
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncModeUi();
        return true;
      }

      function closeChallengePanel() {
        panelOpen = false;
        if (dom.chPanel) dom.chPanel.hidden = true;
        showStart();
        syncModeUi();
      }

      if (dom.chPanel) {
        dom.chPanel.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          const stageBtn = target.closest('[data-stage-id]');
          if (stageBtn && !stageBtn.disabled) {
            startChallenge(stageBtn.getAttribute('data-stage-id'));
            return;
          }
          if (target.closest('[data-ch-back]')) closeChallengePanel();
        });
      }

      function buildChallengeBricks(rows) {
        const bricks = [];
        const safeRows = Array.isArray(rows) ? rows : [];
        for (let r = 0; r < safeRows.length; r += 1) {
          const line = String(safeRows[r] || '');
          for (let col = 0; col < line.length; col += 1) {
            const token = line[col];
            if (token === '.' || token === ' ') continue;
            const hp = CH_TOKEN_HP[token] || 1;
            bricks.push({
              x: BRICK_X + col * (BRICK_W + BRICK_GAP),
              y: BRICK_Y + r * (BRICK_H + BRICK_GAP),
              w: BRICK_W,
              h: BRICK_H,
              hp,
              maxHp: hp,
              alive: true,
              tok: token,
              gate: token === 'G',
              col,
              row: r,
            });
          }
        }
        return bricks;
      }

      function resetChallengeState(stage) {
        const content = stage.content || {};
        ch.elapsed = 0;
        ch.bricks = buildChallengeBricks(content.brickRows);
        ch.keysTotal = ch.bricks.filter((b) => b.tok === 'K').length;
        ch.unlocked = ch.keysTotal === 0;
        ch.speed = Number(content.ball && content.ball.speed) || 300;
        ch.lives = clamp(Number(content.ball && content.ball.lives) || 3, 1, 5);
        const paddleW = clamp(Number(content.ball && content.ball.paddleWidth) || 96, 50, 160);
        const startX = Number(content.ball && content.ball.startingPaddleX) || W / 2;
        ch.paddle = { x: clamp(startX - paddleW / 2, FIELD.x + 6, FIELD.x + FIELD.w - paddleW - 6), y: PADDLE_Y, w: paddleW, h: 14 };
        ch.ball = { x: ch.paddle.x + paddleW / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0 };
        ch.launched = false;
        ch.launches = 0;
        ch.noBrickSec = 0;
        ch.maxNoBrickSec = 0;
        ch.recoveries = 0;
        ch.hintShown = false;
        ch.done = false;
        ch.assisted = false;
        ch.replayMode = false;
        ch.recSec = Number(content.stuckBallRecovery && content.stuckBallRecovery.ifNoBrickContactSec) || 12;
        pickups.length = 0;
        particles.clear();
        updateChallengeHud();
      }

      function startChallenge(ref) {
        if (!challengeAvailable()) {
          A.showToast('挑战数据不可用');
          return false;
        }
        const stage = A.Challenge.stage(GAME_ID, ref);
        if (!stage) return false;
        if (!A.Challenge.isUnlocked(GAME_ID, stage.id)) {
          A.showToast('先通过上一关');
          return false;
        }
        panelOpen = false;
        if (dom.chPanel) dom.chPanel.hidden = true;
        mode = 'challenge';
        ch.active = true;
        ch.stage = stage;
        ch.index = challengeStagesData().findIndex((item) => item.id === stage.id);
        ch.stageState = 'playing';
        resetChallengeState(stage);
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncModeUi();
        autosave.saveNow();
        A.showToast('目标：' + (stage.goalStatement || '消除所有可破坏砖') + '。拖动挡板接球，偏心接球改变反弹角。', 3600);
        return true;
      }

      function challengeLaunch() {
        if (ch.launched || ch.done) return;
        ch.launched = true;
        const angle = CH_LAUNCH_ANGLES[ch.launches % CH_LAUNCH_ANGLES.length];
        ch.launches += 1;
        const speed = ch.speed;
        ch.ball.vx = Math.sin(angle) * speed;
        ch.ball.vy = -Math.cos(angle) * speed;
        A.Sfx.play('jump');
      }

      function challengeLoseBall() {
        ch.lives = Math.max(0, ch.lives - 1);
        A.Sfx.play('over');
        ch.launched = false;
        ch.ball.x = ch.paddle.x + ch.paddle.w / 2;
        ch.ball.y = PADDLE_Y - BALL_R - 1;
        ch.ball.vx = 0;
        ch.ball.vy = 0;
        ch.noBrickSec = 0;
        updateChallengeHud();
        if (ch.lives <= 0) {
          challengeFail('生命耗尽：球全部掉出场地');
        } else {
          A.showToast('丢球 · 剩余生命 ' + ch.lives + ' · 点击 / 空格再次发球', 2200);
        }
      }

      function challengeDestroyBrick(brick) {
        brick.hp -= 1;
        ch.noBrickSec = 0;
        if (brick.tok === 'K') {
          const keysLeft = ch.bricks.filter((b) => b.tok === 'K' && b.alive && b.hp > 0).length;
          if (keysLeft === 0 && !ch.unlocked) {
            ch.unlocked = true;
            ch.bricks.forEach((b) => {
              if (b.gate) b.hp = 1;
            });
            A.showToast('钥匙击毁：门砖解锁！', 2200);
            A.Sfx.play('perfect');
          }
        }
        if (brick.hp <= 0 && brick.alive) {
          brick.alive = false;
          A.Sfx.play('hit');
          particles.emit(brick.x + brick.w / 2, brick.y + brick.h / 2, {
            count: A.reducedMotion ? 4 : 10,
            speed: [30, 160],
            life: [0.2, 0.5],
            size: [2, 4],
            colors: ['#4fc3f7', '#ffd23f', '#ffffff'],
            gravity: 200,
          });
        } else {
          A.Sfx.play('ui');
        }
        updateChallengeHud();
      }

      function challengeStuckRecovery() {
        if (ch.noBrickSec < ch.recSec) return;
        ch.noBrickSec = 0;
        if (!ch.hintShown) {
          ch.hintShown = true;
          A.showToast('球在空转：试试用挡板偏心接球改变角度（不扣命）', 2600);
          return;
        }
        ch.recoveries += 1;
        const speed = Math.hypot(ch.ball.vx, ch.ball.vy) || ch.speed;
        let angle = Math.atan2(ch.ball.vx, -ch.ball.vy) + 0.4;
        if (!Number.isFinite(angle)) angle = 0;
        ch.ball.vx = Math.sin(angle) * speed;
        ch.ball.vy = -Math.cos(angle) * speed;
        A.showToast('球路微调（不扣命）', 1600);
      }

      /**
       * 未解锁 G 门被球击中：门保持“硬墙”不可破坏，但正上方的 K 钥匙砖受到 1 点伤害
       * （设计 C03/C06 中 K 全部位于 G 正上方，按字面“G 是硬墙”时 K 在物理上不可直接触及；
       *  这是最小实现修正，见 docs/arcade/0.9/impl/brick-breaker.md “设计差异”）。
       */
      function challengeHitLockedGate(gateBrick) {
        ch.noBrickSec = 0;
        const key = ch.bricks.find((b) => b.tok === 'K' && b.alive && b.hp > 0 && b.col === gateBrick.col && b.row === gateBrick.row - 1);
        if (!key) {
          A.Sfx.play('hit');
          return;
        }
        A.showToast('撞门震钥匙：正上方的 K 钥匙砖 -1', 1800);
        challengeDestroyBrick(key);
      }

      function challengeTick(dt) {
        if (ch.done) return;
        ch.elapsed += dt;
        const speed = ch.speed;
        const steps = Math.max(1, Math.ceil((speed * dt) / 7));
        const sub = dt / steps;
        for (let s = 0; s < steps; s += 1) {
          const ball = ch.ball;
          ball.x += ball.vx * sub;
          ball.y += ball.vy * sub;
          if (ball.x - BALL_R < FIELD.x) {
            ball.x = FIELD.x + BALL_R;
            ball.vx = Math.abs(ball.vx);
          } else if (ball.x + BALL_R > FIELD.x + FIELD.w) {
            ball.x = FIELD.x + FIELD.w - BALL_R;
            ball.vx = -Math.abs(ball.vx);
          }
          if (ball.y - BALL_R < FIELD.y) {
            ball.y = FIELD.y + BALL_R;
            ball.vy = Math.abs(ball.vy);
          }
          const paddle = ch.paddle;
          if (
            ball.vy > 0 &&
            ball.y + BALL_R >= paddle.y &&
            ball.y - BALL_R <= paddle.y + paddle.h &&
            ball.x >= paddle.x - BALL_R &&
            ball.x <= paddle.x + paddle.w + BALL_R
          ) {
            ball.y = paddle.y - BALL_R;
            const offset = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
            const angle = offset * 0.95;
            ball.vx = Math.sin(angle) * speed;
            ball.vy = -Math.cos(angle) * speed;
            A.Sfx.play('land');
          }
          for (const brick of ch.bricks) {
            if (!brick.alive) continue;
            if (!A.Physics.circleBox(ball.x, ball.y, BALL_R, brick)) continue;
            const dx = ball.x - (brick.x + brick.w / 2);
            const dy = ball.y - (brick.y + brick.h / 2);
            if (Math.abs(dx) / (brick.w / 2) > Math.abs(dy) / (brick.h / 2)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
            else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
            if (brick.gate && !ch.unlocked) {
              challengeHitLockedGate(brick);
            } else {
              challengeDestroyBrick(brick);
            }
            break;
          }
          if (ball.y - BALL_R > H + 20) {
            challengeLoseBall();
            return;
          }
        }
        ch.noBrickSec += dt;
        ch.maxNoBrickSec = Math.max(ch.maxNoBrickSec, ch.noBrickSec);
        challengeStuckRecovery();
        updateChallengeHud();
        if (!ch.bricks.some((b) => b.alive)) challengeWin();
      }

      /** 线状路径是否被其它存活砖挡住（含未解锁 G 硬墙）。 */
      function challengeRayBlocked(fromX, fromY, toX, toY, ignoreBrick) {
        const steps = Math.max(2, Math.ceil(Math.hypot(toX - fromX, toY - fromY) / 5));
        for (let i = 1; i < steps; i += 1) {
          const t = i / steps;
          const x = fromX + (toX - fromX) * t;
          const y = fromY + (toY - fromY) * t;
          for (const brick of ch.bricks) {
            if (!brick.alive || brick === ignoreBrick) continue;
            if (A.Physics.circleBox(x, y, 2, brick)) return true;
          }
        }
        return false;
      }

      /**
       * 回放/自动挡板：确定性控制器（仅 #test 回放使用，不改变玩家真实输入物理）。
       * 策略：优先撞“K 正下方的 G 门”开锁 → 直瞄路径无遮挡的砖 → 通过空列到顶部落下砸顶部砖 → 兜底瞄准最近砖。
       */
      function challengeAutoPaddle() {
        const paddle = ch.paddle;
        const ball = ch.ball;
        if (!ch.launched) {
          ball.x = paddle.x + paddle.w / 2;
          ball.y = paddle.y - BALL_R - 1;
          return;
        }
        const alive = ch.bricks.filter((b) => b.alive);
        const targets = [];
        for (const gateBrick of alive) {
          if (!gateBrick.gate || ch.unlocked) continue;
          const key = alive.find((b) => b.tok === 'K' && b.col === gateBrick.col && b.row === gateBrick.row - 1);
          if (key) targets.push({ brick: gateBrick, priority: 0 });
        }
        for (const brick of alive) {
          if (brick.gate && !ch.unlocked) continue;
          targets.push({ brick, priority: 1 });
        }
        let best = null;
        for (const target of targets) {
          const brick = target.brick;
          const cx = brick.x + brick.w / 2;
          const cy = brick.y + brick.h / 2;
          if (cy >= ball.y - 8) continue;
          const angle = Math.atan2(cx - ball.x, ball.y - cy);
          if (Math.abs(angle) > 0.95) continue;
          if (challengeRayBlocked(ball.x, ball.y, cx, cy, brick)) continue;
          const score = (target.priority === 0 ? -3 : 0) + Math.abs(angle) * 2 + Math.hypot(cx - ball.x, cy - ball.y) * 0.001;
          if (!best || score < best.score) best = { angle, score };
        }
        if (!best) {
          /* 顶部攻击：从完全空的列上到砖阵上方，借顶弹与横向速度从上方砸顶部砖 */
          const openCols = [];
          for (let col = 0; col < 8; col += 1) {
            if (alive.some((b) => b.col === col)) continue;
            const cx = BRICK_X + col * (BRICK_W + BRICK_GAP) + BRICK_W / 2;
            if (challengeRayBlocked(ball.x, ball.y, cx, FIELD.y + 8, null)) continue;
            openCols.push(cx);
          }
          let cand = null;
          for (const cx of openCols) {
            const angle = Math.atan2(cx - ball.x, ball.y - (FIELD.y + 8));
            if (Math.abs(angle) > 0.95) continue;
            const xTop = ball.x + Math.tan(angle) * (ball.y - (FIELD.y + 8));
            const xDesc = xTop + Math.tan(angle) * (BRICK_Y - FIELD.y);
            let nearest = null;
            for (const brick of alive) {
              const d = Math.abs(brick.x + brick.w / 2 - xDesc);
              if (!nearest || d < nearest) nearest = d;
            }
            const score = Math.abs(angle) * 2 + (nearest === null ? 0 : nearest * 0.02);
            if (!cand || score < cand.score) cand = { angle: clamp(angle, -0.95, 0.95), score };
          }
          if (cand) best = cand;
        }
        if (!best) {
          let nearest = null;
          for (const brick of alive) {
            const cx = brick.x + brick.w / 2;
            const cy = brick.y + brick.h / 2;
            const d = Math.hypot(cx - ball.x, cy - ball.y);
            if (!nearest || d < nearest.d) nearest = { cx, cy, d };
          }
          best = { angle: nearest ? clamp(Math.atan2(nearest.cx - ball.x, Math.max(20, ball.y - nearest.cy)), -0.95, 0.95) : 0 };
        }
        const offset = clamp(best.angle / 0.95, -1, 1);
        paddle.x = clamp(ball.x - paddle.w / 2 - offset * (paddle.w / 2), FIELD.x + 6, FIELD.x + FIELD.w - paddle.w - 6);
      }

      function updateChallenge(dt) {
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        if (ch.done) {
          input.endFrame();
          return;
        }
        const paddle = ch.paddle;
        let dir = 0;
        if (input.isDown('ArrowLeft', 'a')) dir -= 1;
        if (input.isDown('ArrowRight', 'd')) dir += 1;
        if (dir !== 0) paddle.x += dir * 380 * dt;
        if (input.pointer.down) paddle.x = input.pointer.x - paddle.w / 2;
        paddle.x = clamp(paddle.x, FIELD.x + 6, FIELD.x + FIELD.w - paddle.w - 6);
        if (!ch.launched) {
          ch.ball.x = paddle.x + paddle.w / 2;
          ch.ball.y = paddle.y - BALL_R - 1;
          const spaceNow = input.isDown(' ');
          if (input.pointer.wentDown || (spaceNow && !spaceWasDown)) challengeLaunch();
          spaceWasDown = spaceNow;
        }
        if (ch.launched) challengeTick(dt);
        else ch.elapsed += dt;
        updateChallengeHud();
        input.endFrame();
      }

      function challengeWin() {
        if (!inChallenge() || ch.done) return;
        ch.done = true;
        ch.stageState = 'cleared';
        state = 'cleared';
        A.Sfx.play('perfect');
        autosave.clear();
        const result = { timeSec: Math.round(ch.elapsed * 10) / 10, assisted: ch.assisted === true, collectibles: [] };
        if (A.Challenge && typeof A.Challenge.markCleared === 'function') {
          A.Challenge.markCleared(GAME_ID, ch.stage.id, result);
        }
        const list = challengeStagesData();
        const next = list[ch.index + 1] || null;
        loop.pause();
        showOverlay({
          title: '挑战通关！',
          text: A.Challenge.resultHtml(ch.stage, result),
          btn: next ? '下一关' : '返回选关',
          onBtn: next ? () => startChallenge(next.id) : () => openChallengePanel(),
          btn2: '重玩本关',
          onBtn2: () => startChallenge(ch.stage.id),
        });
        pauseUi.sync();
        syncModeUi();
      }

      function challengeFail(reason) {
        if (!inChallenge() || ch.done) return;
        ch.done = true;
        ch.stageState = 'failed';
        state = 'failed';
        A.Sfx.play('over');
        autosave.clear();
        loop.pause();
        showOverlay({
          title: '挑战失败',
          text:
            (reason || '未能清空砖阵') +
            '<br/>提示：接球位置决定反弹角；K 钥匙砖全部击毁后 G 门砖才可破坏；球空转 12 秒会自动微调方向且不扣命。',
          btn: '重试本关',
          onBtn: () => startChallenge(ch.stage.id),
          btn2: '返回选关',
          onBtn2: () => openChallengePanel(),
        });
        pauseUi.sync();
        syncModeUi();
      }

      function exitChallenge() {
        if (!inChallenge()) return false;
        panelOpen = false;
        mode = 'classic';
        ch.active = false;
        ch.stage = null;
        ch.done = true;
        state = 'ready';
        autosave.clear();
        if (dom.chPanel) dom.chPanel.hidden = true;
        loop.resume();
        pauseUi.sync();
        syncModeUi();
        showStart();
        return true;
      }

      function serializeChallenge() {
        return {
          elapsed: ch.elapsed,
          lives: ch.lives,
          launched: ch.launched,
          launches: ch.launches,
          unlocked: ch.unlocked,
          speed: ch.speed,
          level: 1,
          paddle: { x: ch.paddle.x, w: ch.paddle.w },
          ball: { x: ch.ball.x, y: ch.ball.y, vx: ch.ball.vx, vy: ch.ball.vy },
          bricks: ch.bricks.map((b) => ({ hp: b.hp, alive: !!b.alive })),
          noBrickSec: ch.noBrickSec,
          recoveries: ch.recoveries,
          hintShown: ch.hintShown,
        };
      }

      function restoreChallenge(data) {
        if (!challengeAvailable() || !data || !data.stageId || !data.challengeState) return false;
        const stage = A.Challenge.stage(GAME_ID, data.stageId);
        if (!stage || !A.Challenge.isUnlocked(GAME_ID, stage.id)) return false;
        try {
          mode = 'challenge';
          ch.active = true;
          ch.stage = stage;
          ch.index = challengeStagesData().findIndex((item) => item.id === stage.id);
          ch.stageState = 'playing';
          resetChallengeState(stage);
          const s = data.challengeState || {};
          ch.elapsed = Math.max(0, Number(s.elapsed) || 0);
          ch.lives = clamp(Number(s.lives) || ch.lives, 1, 5);
          ch.launches = Math.max(0, Number(s.launches) || 0);
          ch.unlocked = s.unlocked !== false;
          ch.speed = clamp(Number(s.speed) || ch.speed, 150, 500);
          ch.launched = !!s.launched;
          if (s.paddle && Number.isFinite(Number(s.paddle.x))) {
            ch.paddle.x = clamp(Number(s.paddle.x), FIELD.x + 6, FIELD.x + FIELD.w - ch.paddle.w - 6);
          }
          if (s.ball) {
            ch.ball.x = clamp(Number(s.ball.x) || ch.ball.x, FIELD.x + BALL_R, FIELD.x + FIELD.w - BALL_R);
            ch.ball.y = clamp(Number(s.ball.y) || ch.ball.y, FIELD.y + BALL_R, H);
            ch.ball.vx = Number(s.ball.vx) || 0;
            ch.ball.vy = Number(s.ball.vy) || 0;
          }
          if (Array.isArray(s.bricks)) {
            s.bricks.forEach((item, index) => {
              const brick = ch.bricks[index];
              if (!brick || !item) return;
              brick.alive = item.alive !== false;
              brick.hp = Math.max(0, Number(item.hp) || 0);
            });
          }
          ch.noBrickSec = Math.max(0, Number(s.noBrickSec) || 0);
          ch.recoveries = Math.max(0, Number(s.recoveries) || 0);
          ch.hintShown = !!s.hintShown;
          ch.done = false;
          state = 'playing';
          recordSaved = false;
          syncModeUi();
          return true;
        } catch (err) {
          mode = 'classic';
          return false;
        }
      }

      /** 仅 #test：用确定性挡板瞄准控制器逐帧回放真实物理，返回清场摘要（engine-replay 证据）。 */
      function challengeReplayClear(ref) {
        const started = startChallenge(ref);
        if (!started) return null;
        ch.replayMode = true;
        const maxFrames = 60 * 240;
        let frames = 0;
        for (; frames < maxFrames && state === 'playing'; frames += 1) {
          challengeAutoPaddle();
          if (!ch.launched) challengeLaunch();
          challengeTick(1 / 60);
        }
        ch.replayMode = false;
        const summary = {
          stageId: ch.stage ? ch.stage.id : null,
          cleared: ch.stageState === 'cleared',
          frames,
          seconds: Math.round((frames / 60) * 10) / 10,
          lives: ch.lives,
          launches: ch.launches,
          remaining: ch.bricks.filter((b) => b.alive).length,
          maxNoBrickSec: Math.round(ch.maxNoBrickSec * 10) / 10,
          recoveries: ch.recoveries,
          unlocked: ch.unlocked,
          winType: (ch.stage && ch.stage.content && ch.stage.content.win && ch.stage.content.win.type) || null,
        };
        if (!summary.cleared && state === 'playing') challengeFail('回放超时：未能清空砖阵');
        return summary;
      }

      function renderChallenge() {
        stage.beginFrame();
        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#071426');
        bg.addColorStop(1, '#0d2136');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(79,195,247,0.22)';
        ctx.lineWidth = 2;
        A.draw.roundRect(ctx, FIELD.x, FIELD.y, FIELD.w, FIELD.h, 12);
        ctx.stroke();

        for (const brick of ch.bricks) {
          if (!brick.alive) continue;
          const locked = brick.gate && !ch.unlocked;
          ctx.fillStyle = locked ? '#3a4a66' : brick.tok === 'K' ? '#ffd23f' : brick.maxHp >= 3 ? '#ff9a3d' : brick.maxHp === 2 ? '#b06bff' : '#4fc3f7';
          A.draw.roundRect(ctx, brick.x, brick.y, brick.w, brick.h, 5);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fillRect(brick.x + 3, brick.y + 3, brick.w - 6, 3);
          ctx.fillStyle = locked ? '#9fb0cf' : '#071426';
          const glyph = locked ? '🔒' : brick.tok === 'K' ? 'K' : brick.hp > 1 ? String(brick.hp) : '';
          if (glyph) A.draw.label(ctx, glyph, brick.x + brick.w / 2, brick.y + brick.h / 2, { font: 'bold 10px system-ui', color: locked ? '#9fb0cf' : '#071426' });
        }

        particles.draw(ctx);

        ctx.fillStyle = '#e8f4ff';
        A.draw.roundRect(ctx, ch.paddle.x, ch.paddle.y, ch.paddle.w, ch.paddle.h, 7);
        ctx.fill();
        ctx.fillStyle = '#4fc3f7';
        ctx.fillRect(ch.paddle.x + 4, ch.paddle.y + 3, ch.paddle.w - 8, 3);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ch.ball.x, ch.ball.y, BALL_R, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#4fc3f7';
        ctx.beginPath();
        ctx.arc(ch.ball.x, ch.ball.y, BALL_R * 0.45, 0, TAU);
        ctx.fill();

        A.draw.label(ctx, '剩余 ' + challengeRemaining(), 12, 24, { align: 'left', font: 'bold 14px system-ui', color: '#ffd23f' });
        A.draw.label(ctx, ch.unlocked ? '门已解锁' : '击毁 K 开锁', W / 2, 24, { font: 'bold 12px system-ui', color: ch.unlocked ? '#5ad1a0' : '#ffd23f' });
        for (let i = 0; i < ch.lives; i += 1) {
          ctx.fillStyle = '#ff6b9d';
          ctx.beginPath();
          ctx.arc(W - 20 - i * 17, 24, 5, 0, TAU);
          ctx.fill();
        }
        if (!ch.launched) {
          A.draw.label(ctx, '点击 / 空格发球', W / 2, PADDLE_Y - 54, { font: '13px system-ui', color: '#93a0c8' });
        }
        ctx.restore();
      }
      function drawBrick(b) {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        A.draw.roundRect(ctx, b.x, b.y, b.w, b.h, 5);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3);
        ctx.fillStyle = b.dark;
        ctx.fillRect(b.x + 3, b.y + b.h - 5, b.w - 6, 3);
        if (b.hp > 1) {
          ctx.fillStyle = 'rgba(10,14,26,0.6)';
          A.draw.label(ctx, String(b.hp), b.x + b.w / 2, b.y + b.h / 2, { font: 'bold 10px system-ui', color: '#ffffff' });
        }
      }

      function renderLobby() {
        stage.beginFrame();
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#071426');
        bg.addColorStop(1, '#0d2136');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(79,195,247,0.22)';
        ctx.lineWidth = 2;
        A.draw.roundRect(ctx, FIELD.x, FIELD.y, FIELD.w, FIELD.h, 12);
        ctx.stroke();
        A.draw.label(ctx, '弹道研究所 · 6 关挑战', W / 2, H * 0.28, { font: 'bold 22px system-ui', color: '#e8f4ff' });
        A.draw.label(ctx, '固定砖阵 · K 钥匙砖 / G 门 · 挡板反弹角', W / 2, H * 0.28 + 30, { font: '13px system-ui', color: '#93a0c8' });
      }

      function render() {
        if (mode === 'classic' && panelOpen) {
          renderLobby();
          return;
        }
        if (mode === 'challenge') {
          renderChallenge();
          return;
        }
        stage.beginFrame();
        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#071426');
        bg.addColorStop(1, '#0d2136');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(79,195,247,0.22)';
        ctx.lineWidth = 2;
        A.draw.roundRect(ctx, FIELD.x, FIELD.y, FIELD.w, FIELD.h, 12);
        ctx.stroke();

        bricks.forEach(drawBrick);
        pickups.forEach((p) => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(Math.sin(p.spin) * 0.2);
          ctx.fillStyle = 'rgba(8,16,28,0.92)';
          A.draw.roundRect(ctx, -p.r, -p.r, p.r * 2, p.r * 2, 6);
          ctx.fill();
          ctx.strokeStyle = p.type === 'wide' ? '#4fc3f7' : p.type === 'slow' ? '#b06bff' : '#5ad1a0';
          ctx.lineWidth = 2;
          ctx.stroke();
          A.draw.label(ctx, p.type === 'wide' ? 'W' : p.type === 'slow' ? 'S' : '+', 0, 1, {
            font: 'bold 12px system-ui',
            color: p.type === 'wide' ? '#4fc3f7' : p.type === 'slow' ? '#b06bff' : '#5ad1a0',
          });
          ctx.restore();
        });

        particles.draw(ctx);

        ctx.fillStyle = '#e8f4ff';
        A.draw.roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 7);
        ctx.fill();
        ctx.fillStyle = '#4fc3f7';
        ctx.fillRect(paddle.x + 4, paddle.y + 3, paddle.w - 8, 3);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#4fc3f7';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r * 0.45, 0, TAU);
        ctx.fill();

        A.draw.label(ctx, 'SCORE ' + score, 12, 24, { align: 'left', font: 'bold 14px system-ui', color: '#ffd23f' });
        A.draw.label(ctx, 'LV ' + level, W / 2, 24, { font: 'bold 13px system-ui', color: '#4fc3f7' });
        for (let i = 0; i < lives; i++) {
          ctx.fillStyle = '#ff6b9d';
          ctx.beginPath();
          ctx.arc(W - 20 - i * 17, 24, 5, 0, TAU);
          ctx.fill();
        }
        if (!launched) {
          A.draw.label(ctx, '点击 / 空格发球', W / 2, PADDLE_Y - 54, { font: '13px system-ui', color: '#93a0c8' });
        }
        if (wideTimer > 0) {
          A.draw.label(ctx, '加宽 ' + Math.ceil(wideTimer) + 's', 12, 52, { align: 'left', font: '11px system-ui', color: '#4fc3f7' });
        }
        if (slowTimer > 0) {
          A.draw.label(ctx, '减速 ' + Math.ceil(slowTimer) + 's', 12, 70, { align: 'left', font: '11px system-ui', color: '#b06bff' });
        }
        if (smashHits > 0) {
          A.draw.label(ctx, '重锤 ×' + smashHits, W - 12, 52, { align: 'right', font: 'bold 11px system-ui', color: '#ffd23f' });
        }
        if (state === 'levelclear') {
          A.draw.label(ctx, '第 ' + level + ' 关完成', W / 2, 620, { font: 'bold 22px system-ui', color: '#5ad1a0' });
        }
        ctx.restore();
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      joyTools.sync();
      syncModeUi();
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              mode,
              state,
              level,
              score,
              lives,
              launched,
              wideTimer,
              slowTimer,
              smashHits,
              tools: { wide: tools.wide, smash: tools.smash },
              paddle: { x: paddle.x, w: paddle.w },
              bricks: bricks.map((b) => ({ hp: b.hp, maxHp: b.maxHp, alive: b.alive })),
            };
          },
          joyInfo() {
            return {
              tools: { wide: tools.wide, smash: tools.smash },
              wideTimer,
              smashHits,
              paddle: { x: paddle.x, w: paddle.w },
              level,
              state,
              bricks: bricks.map((b) => ({ hp: b.hp, maxHp: b.maxHp, alive: b.alive })),
            };
          },
          useJoyTool(id) {
            const button = joyTools.buttons[id];
            if (!button) return false;
            button.click();
            return true;
          },
          setLevel(value) {
            level = clamp(Math.floor(Number(value) || 1), 1, 99);
            spawnBricks();
            resetBall();
            state = 'playing';
            ui.hide();
            loop.resume();
            pauseUi.sync();
            joyTools.sync();
            return true;
          },
          hitBrickNow(index) {
            const brick = bricks[Number(index)];
            if (!brick || !brick.alive) return false;
            hitBrick(brick);
            return true;
          },
          clearLevelNow() {
            bricks.forEach((b) => { b.alive = false; });
            pickups = [];
            state = 'levelclear';
            levelClearTimer = 0.01;
            joyTools.sync();
            return true;
          },
          loseBallNow() {
            if (state !== 'playing') return false;
            loseBall();
            return true;
          },
          /* ---- 0.9 挑战模式测试钩子（契约 §5） ---- */
          challengeStages() {
            const progress = A.Challenge && A.Challenge.progress ? A.Challenge.progress(GAME_ID) : { cleared: [], best: {} };
            return challengeStagesData().map((stage) => ({
              id: stage.id,
              stageNumber: stage.stageNumber,
              title: stage.title,
              unlocked: !!(A.Challenge && A.Challenge.isUnlocked && A.Challenge.isUnlocked(GAME_ID, stage.id)),
              cleared: progress.cleared.indexOf(stage.id) !== -1,
              best: progress.best[stage.id] || null,
            }));
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return {
              mode,
              stageId: ch.stage ? ch.stage.id : null,
              stageIndex: ch.index,
              state,
              elapsedSec: Math.round(ch.elapsed * 10) / 10,
              objective: ch.stage ? ch.stage.goalStatement : null,
              cleared: ch.stageState === 'cleared',
              failed: ch.stageState === 'failed',
              collectibles: [],
              assisted: ch.assisted,
              lives: ch.lives,
              remaining: challengeRemaining(),
              unlocked: ch.unlocked,
              launched: ch.launched,
              elapsedFrames: Math.round(ch.elapsed * 60),
              panelOpen: !!(dom.chPanel && !dom.chPanel.hidden),
              overlay: {
                visible: ui.visible,
                title: dom.ovTitle ? dom.ovTitle.textContent : '',
                btn: dom.ovBtn ? dom.ovBtn.textContent : '',
                btn2: dom.ovBtn2 && !dom.ovBtn2.hidden ? dom.ovBtn2.textContent : null,
              },
            };
          },
          stageObservable() {
            return {
              stageId: ch.stage ? ch.stage.id : null,
              elapsed: Math.round(ch.elapsed * 100) / 100,
              speed: ch.speed,
              lives: ch.lives,
              launched: ch.launched,
              unlocked: ch.unlocked,
              keysTotal: ch.keysTotal,
              remaining: challengeRemaining(),
              noBrickSec: Math.round(ch.noBrickSec * 100) / 100,
              maxNoBrickSec: Math.round(ch.maxNoBrickSec * 100) / 100,
              recoveries: ch.recoveries,
              paddle: { x: Math.round(ch.paddle.x * 100) / 100, w: ch.paddle.w, y: ch.paddle.y },
              ball: { x: Math.round(ch.ball.x * 100) / 100, y: Math.round(ch.ball.y * 100) / 100, vx: Math.round(ch.ball.vx * 100) / 100, vy: Math.round(ch.ball.vy * 100) / 100 },
              bricks: ch.bricks.map((b, index) => ({
                index,
                x: b.x,
                y: b.y,
                tok: b.tok,
                gate: b.gate,
                hp: b.hp,
                maxHp: b.maxHp,
                alive: b.alive,
              })),
              content: ch.stage ? ch.stage.content : null,
            };
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing') return false;
            ch.assisted = assisted === true;
            challengeWin();
            return true;
          },
          forceStageFail(reason) {
            if (mode !== 'challenge' || state !== 'playing') return false;
            challengeFail(reason || '测试触发失败');
            return true;
          },
          exitChallenge() {
            return exitChallenge();
          },
          challengeReplayClear(ref) {
            return challengeReplayClear(ref);
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '砖块计划',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              syncModeUi();
              ui.hide();
              loop.resume();
              pauseUi.sync();
              joyTools.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
