<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="黄金矿工：摆钩挖金物理游戏，第一关钟摆较慢并随关卡逐步加速，街机厅小游戏，本地即玩。" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="../../../shared/site.css" />
  <link rel="stylesheet" href="../arcade.css" />
  <script src="../../../shared/site-shell.js" defer></script>
  <script src="../engine.js"></script>
  <script src="../challenge/gold-miner.js"></script>
  <style>
    /* 0.9 挑战模式：选关容器放进 .stage-box 后需要页面本地定位；面板本体来自 A.Challenge.stageListHtml。 */
    .stage-box > .challenge-select[data-ch-panel] {
      position: absolute;
      inset: 6px;
      z-index: 5;
      max-height: calc(100% - 12px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stage-box > .challenge-select[data-ch-panel][hidden] { display: none; }
    .stage-box > .challenge-select[data-ch-panel] .ac-challenge-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .stage-box > .challenge-select[data-ch-panel] .ac-challenge-head {
      flex-wrap: wrap;
      row-gap: 2px;
    }
    @media (max-width: 340px) {
      /* 320px：画布只有约 230px 宽，两列会把关卡名压成 3 个字；窄屏改单列可读性更好。 */
      .stage-box > .challenge-select[data-ch-panel] .ac-challenge-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .stage-box > .challenge-select[data-ch-panel] [data-ch-back] {
      display: block;
      width: 100%;
      min-height: 44px;
      margin: 8px 0 0;
    }
    .ac-challenge-hud[data-ch-hud] {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 3;
      width: auto;
      max-width: none;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
    }
    .ac-challenge-tip[data-ch-tip] {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 96px;
      z-index: 3;
      margin: 0;
      font-size: 11px;
      pointer-events: none;
    }
    .ac-challenge-tip[data-ch-tip][hidden] { display: none; }
  </style>
  <title>黄金矿工 · 街机厅 · StudioKit</title>
</head>
<body class="arcade-body has-subhud" data-studiokit-app="arcade" data-studiokit-app-title="街机厅 Arcade" style="--ac-accent:#f5c542; --card-accent:#f5c542">
  <noscript><p class="ac-noscript">此游戏需要启用 JavaScript 才能运行。</p></noscript>
  <main class="game-page">
    <header class="game-topbar">
      <a class="ac-back" href="../index.html" aria-label="返回街机厅"><span class="ac-back-icon" aria-hidden="true">‹</span><span class="ac-back-label">街机厅</span></a>
      <h1 class="game-title">⛏ 黄金矿工</h1>
      <div class="game-hud">
        <span>$<strong data-hud-score>0</strong></span>
        <span>最高 <strong data-hud-high>0</strong></span>
      </div>
      <button type="button" class="ac-icon-btn" data-pause aria-label="暂停游戏" title="暂停游戏（P / Esc）">⏸</button>
      <button type="button" class="ac-icon-btn" data-mute aria-label="切换音效">🔊</button>
    </header>
    <div class="game-subhud" aria-live="polite">
      <span class="subhud-target">目标 <strong data-hud-target>$650</strong></span>
      <span>第 <strong data-hud-level>1</strong> 关</span>
      <span>剩余 <strong data-hud-time>60</strong>s</span>
    </div>
    <div class="stage-wrap">
      <div class="stage-box">
        <canvas class="game-canvas" aria-label="黄金矿工游戏画面"></canvas>
        <div class="overlay" data-overlay hidden>
          <div class="overlay-panel">
            <h2 data-ov-title>黄金矿工</h2>
            <p data-ov-text>摆钩挖金</p>
            <button type="button" class="ac-btn" data-ov-btn>开始游戏</button>
            <button type="button" class="ac-btn ac-btn-secondary" data-ov-btn2 hidden>重新开始</button>
          </div>
        </div>
        <div class="toolbelt" data-toolbelt aria-label="道具（快捷键 1 / 2 / 3 / 4）">
          <button type="button" class="tool-btn" data-tool="aim" aria-pressed="false" aria-label="指哪打哪，剩余 2 次（快捷键 1）" title="指哪打哪（1）：点选金块或钻石">
            <span class="tool-icon" aria-hidden="true">🎯</span>
            <span class="tool-name">指哪打哪</span>
            <span class="tool-count" data-tool-count aria-hidden="true">2</span>
          </button>
          <button type="button" class="tool-btn" data-tool="time" aria-label="加时 10 秒，剩余 1 次（快捷键 2）" title="加时（2）：本关 +10 秒">
            <span class="tool-icon" aria-hidden="true">⏳</span>
            <span class="tool-name">加 10 秒</span>
            <span class="tool-count" data-tool-count aria-hidden="true">1</span>
          </button>
          <button type="button" class="tool-btn" data-tool="winch" aria-label="强力绞盘，剩余 1 次（快捷键 3）" title="强力绞盘（3）：下次回收无视重量">
            <span class="tool-icon" aria-hidden="true">💪</span>
            <span class="tool-name">强力绞盘</span>
            <span class="tool-count" data-tool-count aria-hidden="true">1</span>
          </button>
          <button type="button" class="tool-btn" data-tool="line" aria-pressed="false" aria-label="瞄准线，开启后每秒扣 2 美元（快捷键 4）" title="瞄准线（4）：显示挖取方向与命中物，每秒 $2">
            <span class="tool-icon" aria-hidden="true">📐</span>
            <span class="tool-name">瞄准线</span>
            <span class="tool-count tool-rate" data-tool-count aria-hidden="true">$2/s</span>
          </button>
        </div>
        <button type="button" class="ac-btn ac-cashout" data-cashout hidden>达标 · 立即进入下一关</button>
        <span class="ac-challenge-hud" data-ch-hud hidden></span>
        <p class="ac-challenge-tip" data-ch-tip hidden></p>
        <div class="challenge-select" data-ch-panel hidden role="region" aria-label="挑战 6 关"></div>
      </div>
    </div>
    <p class="game-hint">看准角度点击 / 空格放钩 · 第一关摆速较慢，逐关加快 · 达标可提前结算 · 重物拉得慢 · 别碰炸药 · 道具 1/2/3/4 · P / Esc 暂停</p>
  </main>
  <script>
    (() => {
      'use strict';
      const A = window.Arcade;
      const { clamp, lerp, rand, TAU } = A.utils;

      const W = 420;
      const H = 740;
      const PIVOT = { x: 210, y: 104 };
      const MIN_LEN = 88;
      const EXTEND_SPEED = 560;
      const CLAW_R = 12;

      /* 摆速基准只用于 HUD 显示；道具条贴在画布底部，物品生成下限按实际高度计算。 */
      const SWING_BASE = 300;
      const AIM_EXTEND_SPEED = 900;
      const AIM_TAP_RADIUS = 56;
      const AIM_RESUME_VEL = 0.9;
      const AIM_LINE_COST_PER_SEC = 2;
      const WINCH_SPEED = 980;
      const TIME_BONUS = 10;
      const TOOL_CAPS = { aim: 3, time: 2, winch: 2 };
      const TOOL_START = { aim: 2, time: 1, winch: 1 };

      const LEVEL_SPECS = [
        { target: 650, time: 60, swing: 300, theme: '教学：金块与钻石', pool: { goldS: 3, goldM: 3, goldL: 2, diamond: 2, rockS: 2, rockL: 1, tnt: 0 } },
        { target: 950, time: 60, swing: 380, theme: '稳定练习：更高目标', pool: { goldS: 3, goldM: 3, goldL: 2, diamond: 2, rockS: 2, rockL: 1, tnt: 0 } },
        { target: 1350, time: 58, swing: 470, theme: '第一颗炸药', pool: { goldS: 3, goldM: 3, goldL: 2, diamond: 2, rockS: 2, rockL: 2, tnt: 1 } },
        { target: 1800, time: 55, swing: 580, theme: '高价值与高风险', pool: { goldS: 2, goldM: 3, goldL: 3, diamond: 2, rockS: 2, rockL: 2, tnt: 3 } },
        { target: 2300, time: 52, swing: 700, theme: '限时冲刺', pool: { goldS: 2, goldM: 3, goldL: 3, diamond: 3, rockS: 2, rockL: 2, tnt: 4 } },
      ];

      const canvas = document.querySelector('.game-canvas');
      const stage = A.createStage(canvas, W, H);
      const ctx = stage.ctx;
      const input = A.createInput(canvas);
      A.installSfxUnlock();

      /* 仅用于瞄准预览：鼠标悬停（或按住拖动）时跟随；不参与实际放钩坐标。 */
      const aimPointer = { x: W / 2, y: H / 2, seen: false };
      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        aimPointer.x = ((e.clientX - rect.left) / rect.width) * W;
        aimPointer.y = ((e.clientY - rect.top) / rect.height) * H;
        aimPointer.seen = true;
      });

      const dom = {
        overlay: document.querySelector('[data-overlay]'),
        ovTitle: document.querySelector('[data-ov-title]'),
        ovText: document.querySelector('[data-ov-text]'),
        ovBtn: document.querySelector('[data-ov-btn]'),
        ovBtn2: document.querySelector('[data-ov-btn2]'),
        hudScore: document.querySelector('[data-hud-score]'),
        hudHigh: document.querySelector('[data-hud-high]'),
        hudTarget: document.querySelector('[data-hud-target]'),
        hudLevel: document.querySelector('[data-hud-level]'),
        hudTime: document.querySelector('[data-hud-time]'),
        pause: document.querySelector('[data-pause]'),
        mute: document.querySelector('[data-mute]'),
        cashout: document.querySelector('[data-cashout]'),
        toolbelt: document.querySelector('[data-toolbelt]'),
        toolAim: document.querySelector('[data-tool="aim"]'),
        toolTime: document.querySelector('[data-tool="time"]'),
        toolWinch: document.querySelector('[data-tool="winch"]'),
        toolLine: document.querySelector('[data-tool="line"]'),
        chPanel: document.querySelector('[data-ch-panel]'),
        chHud: document.querySelector('[data-ch-hud]'),
        chTip: document.querySelector('[data-ch-tip]'),
      };
      const ui = A.createOverlayUi(dom);

      const particles = A.createParticles();

      const TYPES = {
        goldS: { r: 9, value: 50, weight: 2, label: '小金' },
        goldM: { r: 14, value: 150, weight: 4, label: '中金' },
        goldL: { r: 20, value: 350, weight: 8, label: '大金' },
        diamond: { r: 8, value: 600, weight: 1.5, label: '钻石' },
        rockS: { r: 13, value: 15, weight: 9, label: '石头' },
        rockL: { r: 19, value: 20, weight: 14, label: '巨石' },
        tnt: { r: 11, value: 0, weight: 0, label: '炸药' },
      };

      const pend = { angle: 0.9, vel: 0, length: MIN_LEN, gravity: 520, damping: 0 };
      /* 摆角（pend）与钩爪朝向（clawAngle）分离：瞄准时只改朝向，不打断摆动能量。 */
      let clawAngle = pend.angle;
      let clawState = 'swing';
      let items = [];
      let holding = null;
      let money = 0;
      let level = 1;
      let levelStartMoney = 0;
      let target = 650;
      let timeLeft = 60;
      let floaters = [];
      let dirt = [];
      let state = 'ready';
      let recordSaved = false;
      let spaceWasDown = false;
      let clawOpen = 0;

      /* 限量道具：初始补给 + 每关补给；aimTarget 为“指哪打哪”正在飞向的目标。 */
      const tools = { aim: TOOL_START.aim, time: TOOL_START.time, winch: TOOL_START.winch };
      let aimArmed = false;
      let aimTarget = null;
      let winchArmed = false;
      let aimLineActive = false;
      let lastMoneyShown = -1;
      let itemFloor = H - 130;

      let high = A.Progress.get('gold-miner').high;
      dom.hudHigh.textContent = String(high);

      /* ----------------------------------------------------------
       * 0.9 挑战模式（C01–C06）
       * - 数据来自 ../challenge/gold-miner.js（window.ArcadeChallengeData）经 A.Challenge 读取。
       * - 挑战与经典完全隔离：固定物品布局/目标/时限/初始道具=0；不写 progress 最高分/Playtime 轮次。
       * - 数据缺失 / 不足 6 关时入口 fail closed（显示「挑战数据不可用」），不影响经典。
       * ---------------------------------------------------------- */
      const CHALLENGE_GAME_ID = 'gold-miner';
      let mode = 'classic'; /* classic | challenge | panel */
      let chStage = null;
      let chContent = null;
      let chAssisted = false;
      let chCollectibles = [];
      let chCaught = [];
      let chElapsed = 0;
      let chTipTimer = 0;
      let chHudTimer = 0;
      let autoRelease = null; /* #test 专用：等待摆角到区间后自动放钩 */

      function challengeStages() {
        if (!A.Challenge || typeof A.Challenge.stages !== 'function') return [];
        const stages = A.Challenge.stages(CHALLENGE_GAME_ID);
        return Array.isArray(stages) ? stages : [];
      }
      function challengeAvailable() {
        return challengeStages().length === 6;
      }
      function challengeStageByRef(ref) {
        if (!challengeAvailable()) return null;
        const stage = A.Challenge.stage(CHALLENGE_GAME_ID, ref);
        return stage && typeof stage === 'object' ? stage : null;
      }
      function challengeStagesInfo() {
        const progress = A.Challenge && A.Challenge.progress ? A.Challenge.progress(CHALLENGE_GAME_ID) : { best: {} };
        return challengeStages().map((stage) => ({
          id: stage.id,
          stageNumber: stage.stageNumber,
          title: stage.title,
          unlocked: !!(A.Challenge && A.Challenge.isUnlocked && A.Challenge.isUnlocked(CHALLENGE_GAME_ID, stage.id)),
          best: (progress.best && progress.best[stage.id]) || null,
        }));
      }
      function pad2(value) {
        return String(value).padStart(2, '0');
      }
      function challengeFmt(sec) {
        return A.Challenge && A.Challenge.formatTime ? A.Challenge.formatTime(sec) : pad2(Math.floor((Number(sec) || 0) / 60)) + ':' + pad2(Math.floor(Number(sec) || 0) % 60);
      }
      function challengeLabel(stage) {
        return stage ? 'C' + pad2(stage.stageNumber || 0) + ' ' + (stage.title || '') : '挑战';
      }
      function buildChallengeItems(content) {
        const list = content && Array.isArray(content.items) ? content.items : [];
        itemFloor = measureItemFloor();
        return list
          .map((item) => {
            const type = TYPES[item && item.type];
            if (!type) return null;
            const r = type.r;
            return {
              id: String(item.id || ''),
              type: item.type,
              x: clamp(Number(item.x) || PIVOT.x, r + 4, W - r - 4),
              y: clamp(Number(item.y) || 430, 215 + r, itemFloor - r),
              r,
              value: Number.isFinite(Number(item.value)) ? Number(item.value) : type.value,
              weight: Number.isFinite(Number(item.weight)) ? Number(item.weight) : type.weight,
              wob: 0,
            };
          })
          .filter(Boolean);
      }
      function resetChallenge(stage) {
        chStage = stage;
        chContent = stage && stage.content ? stage.content : {};
        mode = 'challenge';
        money = 0;
        level = Math.max(1, Math.floor(Number(stage.stageNumber) || 1));
        target = wholeTarget(Number(chContent.targetMoney) || 1);
        timeLeft = Math.max(1, Number(chContent.timeLimitSec) || 60);
        levelStartMoney = 0;
        floaters = [];
        recordSaved = false;
        lastHudTime = -1;
        chElapsed = 0;
        chAssisted = false;
        chCollectibles = [];
        chCaught = [];
        chTipTimer = 3.2;
        chHudTimer = 0;
        autoRelease = null;
        particles.clear();
        items = buildChallengeItems(chContent);
        holding = null;
        pend.angle = 0.92;
        pend.vel = 0;
        pend.length = MIN_LEN;
        pend.gravity = swingGravity(level);
        clawAngle = pend.angle;
        clawState = 'swing';
        clawOpen = 0;
        spaceWasDown = false;
        const initTools = chContent.initialTools && typeof chContent.initialTools === 'object' ? chContent.initialTools : {};
        tools.aim = clamp(Math.floor(Number(initTools.aim) || 0), 0, TOOL_CAPS.aim);
        tools.time = clamp(Math.floor(Number(initTools.time) || 0), 0, TOOL_CAPS.time);
        tools.winch = clamp(Math.floor(Number(initTools.winch) || 0), 0, TOOL_CAPS.winch);
        aimArmed = false;
        aimTarget = null;
        winchArmed = false;
        aimLineActive = false;
        makeDirt();
        syncTools();
        syncHud();
        syncChallengeHud(true);
      }
      function setChallengeChrome(active) {
        if (dom.chHud) dom.chHud.hidden = !active;
        if (dom.chTip) dom.chTip.hidden = !active || chTipTimer <= 0;
        if (dom.toolbelt) dom.toolbelt.classList.toggle('is-challenge', !!active);
        syncCashout();
      }
      function syncChallengeHud(force) {
        if (!dom.chHud || !chStage || mode !== 'challenge') return;
        const text =
          challengeLabel(chStage) +
          ' · 目标 $' +
          target +
          ' · 用时 ' +
          challengeFmt(chElapsed) +
          ' · 剩余 ' +
          Math.ceil(Math.max(0, timeLeft)) +
          's';
        if (force || dom.chHud.textContent !== text) dom.chHud.textContent = text;
        if (dom.chTip) {
          const show = chTipTimer > 0 && state === 'playing';
          dom.chTip.hidden = !show;
          if (show) dom.chTip.textContent = '目标：' + (chStage.goalStatement || '') + ' · ' + (chStage.decision || '');
        }
      }
      function showChallengePanel() {
        if (!challengeAvailable()) {
          A.showToast('挑战数据不可用');
          return false;
        }
        mode = 'panel';
        state = 'ready';
        loop.pause();
        autosave.clear();
        if (dom.chPanel) {
          dom.chPanel.innerHTML =
            A.Challenge.stageListHtml(CHALLENGE_GAME_ID) +
            '<button type="button" class="ac-btn ac-btn-secondary" data-ch-back>返回开始</button>';
          dom.chPanel.hidden = false;
        }
        setChallengeChrome(false);
        ui.hide();
        pauseUi.sync();
        syncTools();
        return true;
      }
      function hideChallengePanel() {
        if (dom.chPanel) {
          dom.chPanel.hidden = true;
          dom.chPanel.innerHTML = '';
        }
      }
      function closeChallengePanel() {
        hideChallengePanel();
        mode = 'classic';
        chStage = null;
        chContent = null;
        chAssisted = false;
        chCollectibles = [];
        chCaught = [];
        reset();
        state = 'ready';
        setChallengeChrome(false);
        showStart();
        pauseUi.sync();
        syncTools();
        return true;
      }
      function startChallenge(ref) {
        const stage = challengeStageByRef(ref);
        if (!stage) {
          A.showToast('挑战数据不可用');
          return false;
        }
        if (!A.Challenge.isUnlocked(CHALLENGE_GAME_ID, stage.id)) {
          A.showToast('先通关上一关');
          return false;
        }
        autosave.clear();
        hideChallengePanel();
        resetChallenge(stage);
        state = 'playing';
        ui.hide();
        setChallengeChrome(true);
        syncChallengeHud(true);
        loop.resume();
        pauseUi.sync();
        syncTools();
        autosave.saveNow();
        return true;
      }
      function retryChallenge() {
        if (!chStage) return false;
        return startChallenge(chStage.id);
      }
      function nextChallengeStage() {
        const list = challengeStages();
        if (!chStage) return null;
        const index = list.findIndex((stage) => stage.id === chStage.id);
        return index >= 0 && index + 1 < list.length ? list[index + 1] : null;
      }
      function challengeFail(reason) {
        if (mode !== 'challenge' || !chStage) return false;
        if (state === 'failed' || state === 'cleared') return false;
        state = 'failed';
        A.Sfx.play('over');
        autosave.clear();
        loop.pause();
        ui.show({
          title: '挑战失败',
          text:
            '<b>' + challengeLabel(chStage) + '</b><br/>' +
            (reason || '本关失败') +
            '<br/>本关 $' + Math.floor(money) + ' / 目标 $' + target + ' · 剩余 ' + Math.ceil(Math.max(0, timeLeft)) + 's',
          btn: '重试本关',
          onBtn: retryChallenge,
          btn2: '返回选关',
          onBtn2: showChallengePanel,
        });
        pauseUi.sync();
        syncTools();
        syncCashout();
        return true;
      }
      function challengeClear() {
        if (mode !== 'challenge' || !chStage || state === 'cleared') return false;
        state = 'cleared';
        const timeSec = Math.max(0, chElapsed);
        const result = { timeSec, assisted: chAssisted, collectibles: chCollectibles.slice() };
        A.Challenge.markCleared(CHALLENGE_GAME_ID, chStage.id, result);
        A.Sfx.play('perfect');
        autosave.clear();
        loop.pause();
        syncCashout();
        const next = nextChallengeStage();
        ui.show({
          title: '挑战通关 · C' + pad2(chStage.stageNumber || 0),
          text: A.Challenge.resultHtml(chStage, result),
          btn: next ? '下一关' : '返回选关',
          onBtn: next ? () => startChallenge(next.id) : showChallengePanel,
          btn2: '重玩本关',
          onBtn2: retryChallenge,
        });
        syncChallengeHud(true);
        pauseUi.sync();
        syncTools();
        return true;
      }
      function challengeInfo() {
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          stageIndex: chStage ? Math.max(0, (Number(chStage.stageNumber) || 1) - 1) : -1,
          state,
          elapsedSec: Math.round(chElapsed * 10) / 10,
          objective: chStage ? chStage.goalStatement : '',
          cleared: state === 'cleared',
          collectibles: chCollectibles.slice(),
          caught: chCaught.slice(),
          assisted: chAssisted,
          money,
          target,
          timeLeft: Math.round(Math.max(0, timeLeft) * 10) / 10,
          clawState,
          angleDeg: Math.round(((pend.angle * 180) / Math.PI) * 10) / 10,
          holding: holding ? String(holding.id || holding.type) : null,
          itemsLeft: items.length,
          challengeAvailable: challengeAvailable(),
        };
      }
      function stageObservable() {
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          state,
          money,
          target,
          timeLeft,
          elapsedSec: Math.round(chElapsed * 10) / 10,
          items: items.map((o) => ({
            id: o.id || null,
            type: o.type,
            x: o.x,
            y: o.y,
            r: o.r,
            value: o.value,
            weight: o.weight,
          })),
          caught: chCaught.slice(),
          collectibles: chCollectibles.slice(),
          assisted: chAssisted,
          tools: { aim: tools.aim, time: tools.time, winch: tools.winch },
          clawState,
          angleDeg: Math.round(((pend.angle * 180) / Math.PI) * 10) / 10,
          clawAngleDeg: Math.round(((clawAngle * 180) / Math.PI) * 10) / 10,
          holding: holding ? { id: holding.id || null, type: holding.type, value: holding.value } : null,
          winchArmed,
          aimLineActive,
          tntCount: items.filter((o) => o.type === 'tnt').length,
          referenceOrder: chContent && Array.isArray(chContent.referenceCatchOrder) ? chContent.referenceCatchOrder.slice() : null,
          cashoutVisible: !dom.cashout.hidden,
          panelVisible: !!(dom.chPanel && !dom.chPanel.hidden),
        };
      }

      /* 每关有独立目标、时长、物品池、危险物与摆速；前 5 关机制不同。 */
      function levelSpec(lv) {
        if (lv <= LEVEL_SPECS.length) return LEVEL_SPECS[lv - 1];
        const base = LEVEL_SPECS[LEVEL_SPECS.length - 1];
        const extra = lv - LEVEL_SPECS.length;
        return {
          target: base.target + extra * 650,
          time: Math.max(40, base.time - extra * 2),
          swing: Math.min(1300, base.swing + extra * 80),
          theme: '无尽矿场',
          pool: { ...base.pool, tnt: Math.min(6, base.pool.tnt + extra) },
        };
      }
      function swingGravity(lv) {
        return levelSpec(lv).swing;
      }
      function levelTime(lv) {
        /* 挑战关用设计源 timeLimitSec；经典沿用逐关时长。 */
        if (mode === 'challenge' && chContent) return Math.max(1, Number(chContent.timeLimitSec) || levelSpec(lv).time);
        return levelSpec(lv).time;
      }
      /* 瞄准线按秒扣费会留下小数；目标金额统一取整，避免 HUD/结算出现长小数。 */
      function wholeAmount(value) {
        return Math.max(0, Math.floor(Number(value) || 0));
      }
      function wholeTarget(value) {
        return Math.max(1, Math.round(Number(value) || 0));
      }
      function targetFor(lv) {
        if (mode === 'challenge' && chContent) return wholeTarget(Number(chContent.targetMoney) || 1);
        return wholeTarget(levelSpec(lv).target);
      }
      function clawTip() {
        return {
          x: PIVOT.x + Math.sin(clawAngle) * pend.length,
          y: PIVOT.y + Math.cos(clawAngle) * pend.length,
        };
      }
      function retractSpeed() {
        if (!holding) return 840;
        if (winchArmed) return WINCH_SPEED;
        return clamp(200 + 2600 / holding.weight, 200, 840);
      }

      /* ---------- 限量道具 ---------- */
      function toolHint(text, color) {
        floaters.push({
          text,
          x: W / 2,
          y: H - 156,
          life: 1.3,
          maxLife: 1.3,
          color: color || '#eef1ff',
        });
      }

      function syncTools() {
        if (!dom.toolAim) return;
        dom.toolAim.querySelector('[data-tool-count]').textContent = String(tools.aim);
        dom.toolTime.querySelector('[data-tool-count]').textContent = String(tools.time);
        dom.toolWinch.querySelector('[data-tool-count]').textContent = String(tools.winch);
        dom.toolAim.disabled = tools.aim <= 0 && !aimArmed;
        dom.toolTime.disabled = tools.time <= 0;
        dom.toolWinch.disabled = tools.winch <= 0 && !winchArmed;
        dom.toolAim.setAttribute('aria-pressed', String(aimArmed));
        dom.toolWinch.setAttribute('aria-pressed', String(winchArmed));
        dom.toolWinch.classList.toggle('is-armed', winchArmed);
        /* 挑战关不提供经典道具（设计 initialTools 全为 0）；瞄准线也禁用。 */
        if (dom.toolLine) dom.toolLine.disabled = mode === 'challenge';
        dom.toolLine && dom.toolLine.setAttribute('aria-disabled', String(mode === 'challenge'));
        dom.toolAim.setAttribute('aria-label', '指哪打哪，剩余 ' + tools.aim + ' 次（快捷键 1）');
        dom.toolTime.setAttribute('aria-label', '加时 10 秒，剩余 ' + tools.time + ' 次（快捷键 2）');
        dom.toolWinch.setAttribute('aria-label', winchArmed
          ? '强力绞盘已上弦，夹物入账时消耗（快捷键 3）'
          : '强力绞盘，剩余 ' + tools.winch + ' 次（快捷键 3）');
        dom.toolWinch.title = winchArmed ? '已上弦：下一次成功入账时消耗' : '强力绞盘（3）：下一次回收无视重量';
        dom.toolAim.title = aimArmed ? '取消瞄准（1）' : '指哪打哪（1）：点选金块或钻石';
        if (dom.toolLine) {
          dom.toolLine.setAttribute('aria-pressed', String(aimLineActive));
          dom.toolLine.classList.toggle('is-armed', aimLineActive);
          dom.toolLine.setAttribute('aria-label', aimLineActive
            ? '瞄准线已开启，摆动时每秒扣 $' + AIM_LINE_COST_PER_SEC + '，伸出与回收暂停计费，点击关闭（快捷键 4）'
            : '瞄准线，摆动时每秒扣 $' + AIM_LINE_COST_PER_SEC + '，伸出与回收不计费（快捷键 4）');
          dom.toolLine.title = aimLineActive ? '关闭瞄准线（4）' : '瞄准线（4）：显示挖取方向与命中物，摆动时每秒 $' + AIM_LINE_COST_PER_SEC;
        }
      }

      function grantTools(lv) {
        const before = { aim: tools.aim, time: tools.time, winch: tools.winch };
        tools.aim = Math.min(TOOL_CAPS.aim, tools.aim + 1);
        if (lv % 2 === 0) tools.time = Math.min(TOOL_CAPS.time, tools.time + 1);
        if (lv % 3 === 0) tools.winch = Math.min(TOOL_CAPS.winch, tools.winch + 1);
        const gained = [];
        if (tools.aim > before.aim) gained.push('🎯');
        if (tools.time > before.time) gained.push('⏳');
        if (tools.winch > before.winch) gained.push('💪');
        if (gained.length) toolHint('道具补给 ' + gained.join(' '), '#63d68c');
        syncTools();
      }

      function toggleAimLine() {
        if (state !== 'playing') return false;
        if (aimLineActive) {
          aimLineActive = false;
          A.Sfx.play('ui');
          toolHint('瞄准线已关闭');
          syncTools();
          autosave.saveNow();
          return true;
        }
        if (money < AIM_LINE_COST_PER_SEC) {
          toolHint('先挖到 $' + AIM_LINE_COST_PER_SEC + ' 再开瞄准线', '#ff9a9d');
          return false;
        }
        aimLineActive = true;
        aimArmed = false;
        A.Sfx.play('spring');
        toolHint('瞄准线开启：每秒 -$' + AIM_LINE_COST_PER_SEC, '#ffd23f');
        syncTools();
        autosave.saveNow();
        return true;
      }

      function useTool(name) {
        if (state !== 'playing') return false;
        /* 0.9 挑战关按设计不提供经典限量道具（initialTools 全 0），也不提供按秒计费的瞄准线。 */
        if (mode === 'challenge') {
          toolHint(name === 'line' ? '挑战关不提供瞄准线' : '挑战关不提供道具', '#ffd23f');
          return false;
        }
        if (name === 'line') return toggleAimLine();
        if (name === 'aim') {
          if (aimArmed) {
            aimArmed = false;
            A.Sfx.play('ui');
            syncTools();
            return true;
          }
          if (tools.aim <= 0) {
            toolHint('精准钩已用尽，下一关会补给');
            return false;
          }
          if (clawState !== 'swing') {
            toolHint('等钩爪收回再瞄准');
            return false;
          }
          aimArmed = true;
          A.Sfx.play('ui');
          toolHint('点选金块或钻石', '#7ce8e0');
          syncTools();
          return true;
        }
        if (name === 'time') {
          if (tools.time <= 0) return false;
          const cap = levelTime(level) + TIME_BONUS;
          if (timeLeft >= cap - 0.05) {
            toolHint('时间充裕，留到后面再用');
            return false;
          }
          aimArmed = false;
          tools.time -= 1;
          const before = timeLeft;
          timeLeft = Math.min(cap, timeLeft + TIME_BONUS);
          floaters.push({
            text: '+ ' + Math.ceil(timeLeft - before) + 's',
            x: W / 2,
            y: H - 150,
            life: 1.2,
            maxLife: 1.2,
            color: '#7ce8e0',
            big: true,
          });
          A.Sfx.play('bell', 4);
          syncTimerHud();
          syncTools();
          autosave.saveNow();
          return true;
        }
        if (name === 'winch') {
          if (winchArmed) {
            toolHint('绞盘已上弦：夹物入账时消耗', '#ffd23f');
            return false;
          }
          if (tools.winch <= 0) return false;
          aimArmed = false;
          /* 次数延到实际入账时扣除；抓空或遇到炸药不会让本局补给凭空消失。 */
          winchArmed = true;
          A.Sfx.play('spring');
          toolHint('绞盘上弦：下次回收全速', '#ffd23f');
          syncTools();
          autosave.saveNow();
          return true;
        }
        return false;
      }

      function aimableAt(x, y) {
        let best = null;
        let bestD = Infinity;
        items.forEach((o) => {
          if (o.type === 'tnt') return;
          const d = Math.hypot(o.x - x, o.y - y);
          if (d <= AIM_TAP_RADIUS + o.r && d < bestD) {
            best = o;
            bestD = d;
          }
        });
        return best;
      }

      function tryAimAt(x, y) {
        if (!aimArmed || state !== 'playing') return false;
        const target = aimableAt(x, y);
        if (!target) {
          const tnt = items.find(
            (o) => o.type === 'tnt' && Math.hypot(o.x - x, o.y - y) <= AIM_TAP_RADIUS + o.r
          );
          toolHint(tnt ? '炸药不能锁定' : '点中金块或钻石再试', '#ff9a9d');
          return false;
        }
        tools.aim -= 1;
        aimArmed = false;
        aimTarget = target;
        /* 只改变钩爪伸出的朝向，保留当前摆角/角速度；收钩后继续原来的摆动幅度与速度。 */
        clawAngle = Math.atan2(target.x - PIVOT.x, target.y - PIVOT.y);
        pend.length = MIN_LEN;
        clawState = 'extend';
        clawOpen = 1;
        A.Sfx.play('perfect');
        syncTools();
        syncCashout();
        autosave.saveNow();
        return true;
      }

      /* 道具条是 CSS 像素高度，画布按逻辑分辨率缩放；换算成逻辑坐标后再留 14px 安全边。 */
      function measureItemFloor() {
        const canvasRect = canvas.getBoundingClientRect();
        const barRect = dom.toolbelt ? dom.toolbelt.getBoundingClientRect() : null;
        if (!canvasRect.height || !barRect || !barRect.height) return H - 130;
        const hidden = (barRect.height / canvasRect.height) * H;
        return clamp(H - hidden - 14, 420, H - 90);
      }

      /* 首帧/地址栏收放/全屏切换可能改变舞台与道具条比例；只向上收，绝不把物品往下推。 */
      function refreshItemFloor() {
        const next = measureItemFloor();
        itemFloor = next;
        items.forEach((o) => {
          o.y = Math.min(o.y, itemFloor - o.r);
        });
      }

      function makeDirt() {
        dirt = [];
        for (let i = 0; i < 46; i++) {
          dirt.push({
            x: rand(8, W - 8),
            y: rand(190, H - 10),
            r: rand(2, 6),
            shade: Math.random() > 0.5 ? 0.06 : 0.12,
          });
        }
      }

      function itemValue(o) {
        return o.type === 'goldS' || o.type === 'goldM' || o.type === 'goldL' || o.type === 'diamond' ? o.value : 0;
      }

      function totalItemValue() {
        return items.reduce((sum, o) => sum + itemValue(o), 0);
      }

      function placeItem(type) {
        const t = TYPES[type];
        for (let tries = 0; tries < 70; tries++) {
          const x = rand(30 + t.r, W - 30 - t.r);
          /* 底部留给道具条：物品中心不会落到半透明按钮后面。 */
          const y = rand(215 + t.r, itemFloor - t.r);
          /* 只放在摆钩实际可达的角度锥内，避免“看得到够不着”。 */
          const angle = Math.abs(Math.atan2(x - PIVOT.x, y - PIVOT.y));
          if (angle > 0.9) continue;
          const ok = items.every((o) => Math.hypot(o.x - x, o.y - y) > o.r + t.r + 14);
          if (ok) {
            items.push({ type, x, y, r: t.r, value: t.value, weight: t.weight, wob: rand(0, TAU) });
            return true;
          }
        }
        return false;
      }

      function spawnItems() {
        items = [];
        holding = null;
        itemFloor = measureItemFloor();
        const spec = levelSpec(level);
        Object.keys(spec.pool).forEach((type) => {
          for (let n = 0; n < spec.pool[type]; n++) placeItem(type);
        });

        /* 可行性保底：本关物品价值必须明显高于本关目标，避免“目标不可达”。 */
        const levelTarget = levelSpec(level).target;
        let guard = 0;
        while (totalItemValue() < levelTarget * 1.25 && guard++ < 10) {
          placeItem(Math.random() < 0.55 ? 'goldL' : 'diamond');
        }
        if (totalItemValue() < levelTarget * 1.25 || items.length < 4) {
          const low = Math.min(540, itemFloor - 50);
          const fallback = [
            ['diamond', PIVOT.x, 430],
            ['goldL', PIVOT.x - 120, low],
            ['goldM', PIVOT.x + 120, low],
            ['goldS', PIVOT.x, Math.min(600, itemFloor - 12)],
          ];
          fallback.forEach(([type, x, y]) => {
            const t = TYPES[type];
            if (!items.some((o) => Math.hypot(o.x - x, o.y - y) < o.r + t.r + 6)) {
              items.push({ type, x, y, r: t.r, value: t.value, weight: t.weight, wob: rand(0, TAU) });
            }
          });
        }
      }

      function reset() {
        money = 0;
        level = 1;
        levelStartMoney = 0;
        target = targetFor(1);
        timeLeft = levelTime(1);
        floaters = [];
        recordSaved = false;
        lastHudTime = -1;
        particles.clear();
        pend.angle = rand(0.92, 1.0) * (Math.random() > 0.5 ? 1 : -1);
        pend.vel = 0;
        pend.length = MIN_LEN;
        pend.gravity = swingGravity(1);
        clawAngle = pend.angle;
        clawState = 'swing';
        clawOpen = 0;
        spaceWasDown = false;
        tools.aim = TOOL_START.aim;
        tools.time = TOOL_START.time;
        tools.winch = TOOL_START.winch;
        aimArmed = false;
        aimTarget = null;
        winchArmed = false;
        aimLineActive = false;
        syncTools();
        makeDirt();
        spawnItems();
        syncHud();
      }

      function syncHud() {
        lastMoneyShown = Math.floor(money);
        dom.hudScore.textContent = String(lastMoneyShown);
        dom.hudTarget.textContent = '$' + target;
        dom.hudLevel.textContent = mode === 'challenge' && chStage ? 'C' + pad2(chStage.stageNumber || 0) : String(level);
        syncTimerHud();
        syncCashout();
      }

      let lastHudTime = -1;
      function syncTimerHud() {
        const shown = Math.ceil(Math.max(0, timeLeft));
        if (shown === lastHudTime) return;
        lastHudTime = shown;
        dom.hudTime.textContent = String(shown);
      }

      function syncCashout() {
        const canCashout = state === 'playing' && clawState === 'swing' && money >= target;
        dom.cashout.hidden = !canCashout;
        dom.cashout.textContent = mode === 'challenge' ? '达标 · 结算通关' : '达标 · 立即进入下一关';
      }

      function startGame() {
        autosave.clear();
        mode = 'classic';
        chStage = null;
        chContent = null;
        chAssisted = false;
        chCollectibles = [];
        chCaught = [];
        autoRelease = null;
        hideChallengePanel();
        setChallengeChrome(false);
        reset();
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncCashout();
        autosave.saveNow();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        ui.hide();
        loop.resume();
        pauseUi.sync();
        syncCashout();
      }

      function gameOver() {
        if (state === 'over') return;
        state = 'over';
        aimArmed = false;
        aimTarget = null;
        aimLineActive = false;
        syncTools();
        A.Sfx.play('over');
        autosave.clear();
        const total = Math.floor(money);
        let rec = null;
        if (!recordSaved) {
          rec = A.Progress.recordPlay('gold-miner', total); if (rec) high = rec.high;
          recordSaved = true;
          dom.hudHigh.textContent = String(Math.max(high, total));
        }
        loop.pause();
        ui.show({
          title: '收工',
          text:
            `<span class="ac-score">$${total}</span>` +
            (rec && rec.isNewHigh ? '<span class="ac-newhigh">★ 新纪录</span><br/>' : '') +
            `第 ${level} 关 · 目标 $${target} 未达成 · 最高 $${Math.max(high, total)}`,
          btn: '再来一局',
          onBtn: startGame,
        });
        pauseUi.sync();
        syncCashout();
      }

      function nextLevel() {
        /* 挑战关没有“下一关”流程（通关走 challengeClear）。 */
        if (mode === 'challenge') return;
        /* 以 HUD 上显示的整数金额作为本关起点，目标金额保持整数。 */
        levelStartMoney = wholeAmount(money);
        level += 1;
        target = levelStartMoney + wholeTarget(levelSpec(level).target);
        timeLeft = levelTime(level);
        pend.gravity = swingGravity(level);
        pend.angle = rand(0.92, 1.0) * (Math.random() > 0.5 ? 1 : -1);
        pend.vel = 0;
        pend.length = MIN_LEN;
        clawAngle = pend.angle;
        clawState = 'swing';
        clawOpen = 0;
        holding = null;
        aimArmed = false;
        aimTarget = null;
        spaceWasDown = false;
        spawnItems();
        grantTools(level);
        A.Sfx.play('perfect');
        floaters.push({ text: '达标！进入第 ' + level + ' 关', x: W / 2, y: 320, life: 1.6, maxLife: 1.6, color: '#63d68c', big: true });
        syncHud();
      }

      function cashOut() {
        if (state !== 'playing' || clawState !== 'swing' || money < target) return;
        if (mode === 'challenge') {
          challengeClear();
          return;
        }
        const bonus = Math.floor(timeLeft * 4);
        money += bonus;
        floaters.push({
          text: '提前结算 +$' + bonus,
          x: W / 2,
          y: 280,
          life: 1.4,
          maxLife: 1.4,
          color: '#ffd23f',
          big: true,
        });
        A.Sfx.play('bell', 5);
        nextLevel();
        autosave.saveNow();
      }

      function pauseByUser() {
        if (state !== 'playing') return;
        loop.pause();
        state = 'paused';
        aimArmed = false;
        aimTarget = null;
        syncTools();
        autosave.saveNow();
        if (mode === 'challenge') {
          ui.show({
            title: '已暂停 · 挑战 ' + (chStage ? 'C' + pad2(chStage.stageNumber || 0) : ''),
            text: challengeLabel(chStage) + '<br/>进度已保存，可以随时离开。',
            btn: '继续',
            onBtn: resumeGame,
            btn2: '退出挑战',
            onBtn2: showChallengePanel,
          });
        } else {
          ui.show({
            title: '已暂停',
            text: '矿场午休。<br/>局内进度已保存，可以随时离开。',
            btn: '继续',
            onBtn: resumeGame,
          });
        }
        pauseUi.sync();
        syncCashout();
      }

      function showStart() {
        mode = 'classic';
        state = 'ready';
        chStage = null;
        chContent = null;
        setChallengeChrome(false);
        const hasChallenge = challengeAvailable();
        ui.show({
          title: '黄金矿工',
          text:
            '摆钩挖金：限时内赚到目标金额。<br/>第一关摆速较慢，之后逐关加速<br/>' +
            '限量道具：🎯 指哪打哪 · ⏳ 加时 · 💪 强力绞盘<br/>达标后可点击下方按钮提前进入下一关',
          btn: '开始游戏',
          onBtn: startGame,
          btn2: hasChallenge ? '挑战 6 关' : '挑战数据不可用',
          onBtn2: hasChallenge ? showChallengePanel : () => A.showToast('挑战数据不可用'),
        });
      }

      function releaseClaw() {
        if (clawState !== 'swing') return;
        clawAngle = pend.angle;
        clawState = 'extend';
        syncCashout();
        A.Sfx.play('jump');
      }

      function explode(tntItem) {
        A.Sfx.play('explode');
        particles.emit(tntItem.x, tntItem.y, {
          count: A.reducedMotion ? 12 : 30,
          speed: [60, 300],
          life: [0.3, 0.8],
          size: [2, 6],
          colors: ['#ff7847', '#ffd23f', '#ffffff', '#d8443f'],
          gravity: 80,
        });
        /* 挑战关按设计只损失本次抓取收益（不连带炸毁周围矿物），避免固定布局被一次误触清空。 */
        if (mode === 'challenge') {
          items = items.filter((o) => o !== tntItem);
        } else {
          items = items.filter((o) => {
            if (o === tntItem) return false;
            if (Math.hypot(o.x - tntItem.x, o.y - tntItem.y) < 95) {
              particles.emit(o.x, o.y, {
                count: 6,
                speed: [30, 140],
                life: [0.2, 0.5],
                size: [2, 4],
                colors: ['#c9a06b', '#8a6a43'],
                gravity: 200,
              });
              return false;
            }
            return true;
          });
        }
        holding = null;
        aimTarget = null;
        clawState = 'retract';
        syncCashout();
      }

      /* 回到摆动状态时兜底：接近垂直且几乎无角速度时补一点起步能量。 */
      function ensureSwing() {
        clawState = 'swing';
        if (Math.abs(pend.angle) < 0.12 && Math.abs(pend.vel) < 0.25) {
          const dir = pend.angle < 0 ? -1 : 1;
          pend.angle = 0.16 * dir;
          pend.vel = AIM_RESUME_VEL * dir;
        }
        clawAngle = pend.angle;
      }

      function cashIn() {
        if (holding) {
          const val = holding.value;
          money += val;
          if (mode === 'challenge') {
            if (holding.id && chCaught.indexOf(holding.id) === -1) chCaught.push(holding.id);
            if (holding.id && val > 0 && chCollectibles.indexOf(holding.id) === -1) chCollectibles.push(holding.id);
          }
          if (winchArmed) {
            /* 旧档可能是“已上弦且次数已扣为 0”：保持 0，绝不负数或重复补扣。 */
            tools.winch = Math.max(0, tools.winch - 1);
            winchArmed = false;
            syncTools();
          }
          const tip = clawTip();
          floaters.push({
            text: (val >= 300 ? '★★ ' : '') + '+$' + val,
            x: tip.x,
            y: tip.y,
            life: 0.9,
            maxLife: 0.9,
            color: val >= 300 ? '#ffd23f' : val >= 100 ? '#63d68c' : '#93a0c8',
            big: val >= 300,
          });
          A.Sfx.play(val >= 300 ? 'perfect' : val >= 100 ? 'bell' : 'land');
          items = items.filter((o) => o !== holding);
          holding = null;
        }
        ensureSwing();
        syncHud();
        /* 在 holding 清理、钩爪恢复后保存，避免续玩时同一物品重复入账。 */
        autosave.saveNow();
      }

      function attachHolding(item) {
        holding = item;
        clawState = 'retract';
        clawOpen = 0;
        const tip = clawTip();
        const type = TYPES[item.type];
        floaters.push({
          text: '夹住 ' + type.label + ' · $' + item.value,
          x: tip.x,
          y: Math.max(205, tip.y - item.r - 12),
          life: 0.8,
          maxLife: 0.8,
          color: item.value >= 300 ? '#ffd23f' : '#7ce8e0',
          big: item.value >= 300,
        });
        A.Sfx.play('hit');
        syncCashout();
        autosave.saveNow();
      }

      /* ---------- 局内存档 ---------- */
      function serialize() {
        if (state !== 'playing' && state !== 'paused') return null;
        return {
          mode,
          stageId: chStage ? chStage.id : null,
          items: items.map((o) => ({ id: o.id || null, type: o.type, x: o.x, y: o.y, wob: o.wob })),
          holdingIndex: holding ? items.indexOf(holding) : -1,
          money,
          level,
          levelStartMoney,
          target,
          timeLeft,
          pend: { angle: pend.angle, vel: pend.vel, length: pend.length, gravity: pend.gravity },
          clawAngle,
          clawState,
          clawOpen,
          dirt,
          tools: { aim: tools.aim, time: tools.time, winch: tools.winch },
          winchArmed,
          aimLineActive,
          challenge:
            mode === 'challenge'
              ? { elapsed: chElapsed, assisted: chAssisted, collectibles: chCollectibles.slice(), caught: chCaught.slice() }
              : null,
        };
      }

      function restore(data) {
        if (!data || !Array.isArray(data.items)) return false;
        /* 0.9 挑战存档：必须能按 stageId 找到数据，否则 fail closed（不猜关卡）。 */
        const isChallenge = data.mode === 'challenge';
        const stage = isChallenge ? challengeStageByRef(String(data.stageId || '')) : null;
        if (isChallenge && !stage) return false;
        try {
          if (isChallenge) {
            resetChallenge(stage);
          } else {
            mode = 'classic';
            chStage = null;
            chContent = null;
            chAssisted = false;
            chCollectibles = [];
            chCaught = [];
            setChallengeChrome(false);
            reset();
          }
          const contentItems = isChallenge && chContent && Array.isArray(chContent.items) ? chContent.items : [];
          const contentById = Object.create(null);
          contentItems.forEach((item) => {
            if (item && item.id) contentById[String(item.id)] = item;
          });
          items = data.items
            .filter((o) => o && TYPES[o.type] && isFinite(o.x) && isFinite(o.y))
            .map((o) => {
              const designed = isChallenge && o.id ? contentById[String(o.id)] : null;
              const t = TYPES[o.type];
              return {
                id: isChallenge && o.id ? String(o.id) : undefined,
                type: o.type,
                x: clamp(Number(o.x), 0, W),
                /* 旧档可能把物品存在旧的下限；升级后抬到道具条上方。 */
                y: clamp(Number(o.y), 215 + t.r, itemFloor - t.r),
                r: t.r,
                value: designed && Number.isFinite(Number(designed.value)) ? Number(designed.value) : t.value,
                weight: designed && Number.isFinite(Number(designed.weight)) ? Number(designed.weight) : t.weight,
                wob: Number(o.wob) || 0,
              };
            });
          money = Math.max(0, Number(data.money) || 0);
          level = Math.max(1, Number(data.level) || 1);
          /* 旧档可能存了带小数的目标（瞄准线扣费），恢复时统一取整。 */
          target = wholeTarget(Number(data.target) || targetFor(level));
          levelStartMoney = isChallenge
            ? 0
            : Number.isFinite(Number(data.levelStartMoney))
              ? wholeAmount(Number(data.levelStartMoney))
              : Math.max(0, target - levelSpec(level).target);
          const timeCap = isChallenge ? levelTime(level) : levelTime(level) + TIME_BONUS;
          timeLeft = clamp(Number(data.timeLeft) || levelTime(level), 0.1, timeCap);
          if (data.pend && isFinite(data.pend.angle)) {
            pend.angle = Number(data.pend.angle);
            pend.vel = Number(data.pend.vel) || 0;
            pend.length = clamp(Number(data.pend.length) || MIN_LEN, MIN_LEN, 800);
            pend.gravity = Number(data.pend.gravity) || swingGravity(level);
          }
          /* 旧档没有 clawAngle：伸钩方向回退到当时保存的摆角。 */
          clawAngle = isFinite(data.clawAngle) ? Number(data.clawAngle) : pend.angle;
          clawState = ['swing', 'extend', 'retract'].indexOf(data.clawState) !== -1 ? data.clawState : 'swing';
          clawOpen = clamp(Number(data.clawOpen) || 0, 0, 1);
          if (Array.isArray(data.dirt) && data.dirt.length) {
            dirt = data.dirt
              .filter((d) => d && isFinite(d.x) && isFinite(d.y))
              .map((d) => ({ x: Number(d.x), y: Number(d.y), r: Number(d.r) || 3, shade: Number(d.shade) || 0.08 }));
          }
          const hi = Number(data.holdingIndex);
          if (clawState === 'retract' && Number.isInteger(hi) && hi >= 0 && hi < items.length) {
            holding = items[hi];
          } else {
            holding = null;
            if (clawState === 'retract') clawState = 'swing';
          }
          if (data.tools && typeof data.tools === 'object') {
            tools.aim = clamp(Math.floor(Number(data.tools.aim) || 0), 0, TOOL_CAPS.aim);
            tools.time = clamp(Math.floor(Number(data.tools.time) || 0), 0, TOOL_CAPS.time);
            tools.winch = clamp(Math.floor(Number(data.tools.winch) || 0), 0, TOOL_CAPS.winch);
          }
          winchArmed = !!data.winchArmed;
          aimLineActive = !isChallenge && !!data.aimLineActive && money >= AIM_LINE_COST_PER_SEC;
          if (isChallenge) {
            chElapsed = Math.max(0, Number(data.challenge && data.challenge.elapsed) || 0);
            chAssisted = !!(data.challenge && data.challenge.assisted);
            chCollectibles = Array.isArray(data.challenge && data.challenge.collectibles)
              ? data.challenge.collectibles.filter((id) => typeof id === 'string').slice(0, 32)
              : [];
            chCaught = Array.isArray(data.challenge && data.challenge.caught)
              ? data.challenge.caught.filter((id) => typeof id === 'string').slice(0, 32)
              : [];
            chTipTimer = 0;
          }
          /* 旧档可能保存了摆角 0 / 角速度 0 的“停摆”状态；恢复时补起步能量。 */
          if (clawState === 'swing') ensureSwing();
          aimArmed = false;
          aimTarget = null;
          syncTools();
          recordSaved = false;
          spaceWasDown = false;
          state = 'playing';
          syncHud();
          syncCashout();
          setChallengeChrome(isChallenge);
          syncChallengeHud(true);
          return true;
        } catch (err) {
          return false;
        }
      }

      const autosave = A.createRunAutosave('gold-miner', serialize, {
        every: 4,
        meta: () =>
          mode === 'challenge'
            ? {
                score: Math.floor(money),
                summary: `挑战 ${chStage ? 'C' + pad2(chStage.stageNumber || 0) : ''} · $${Math.floor(money)}/$${target}`,
              }
            : { score: Math.floor(money), summary: `$${Math.floor(money)} · 第 ${level} 关 · 目标 $${target}` },
      });

      /* ---------- 更新 ---------- */
      function update(dt) {
        particles.update(dt);
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.life -= dt;
          f.y -= 30 * dt;
          if (f.life <= 0) floaters.splice(i, 1);
        }
        if (state !== 'playing') {
          input.endFrame();
          return;
        }
        autosave.tick(dt);
        if (mode === 'challenge') {
          chElapsed += dt;
          chTipTimer = Math.max(0, chTipTimer - dt);
          chHudTimer -= dt;
          if (chHudTimer <= 0) {
            chHudTimer = 0.15;
            syncChallengeHud(false);
          }
        }
        if (autoRelease && clawState === 'swing' && state === 'playing') {
          const deg = (pend.angle * 180) / Math.PI;
          if (Math.abs(deg - autoRelease.targetDeg) <= autoRelease.tolDeg) {
            /* #test 专用：把摆角精确对准设计 aimAngleDeg 后走真实 releaseClaw 物理（文档标注 engine-replay 差距）。
             * 只微调角度（≤2.2°）、保留当前角速度，避免破坏后续摆动的能量/幅度。 */
            const targetRad = (autoRelease.targetDeg * Math.PI) / 180;
            autoRelease = null;
            pend.angle = targetRad;
            releaseClaw();
          }
        }
        timeLeft -= dt;
        syncTimerHud();
        /* 只有可重新决策的摆动阶段计费；伸出/回收仍显示方向，但暂停扣款。 */
        if (aimLineActive && clawState === 'swing') {
          money = Math.max(0, money - AIM_LINE_COST_PER_SEC * dt);
          if (Math.floor(money) !== lastMoneyShown) syncHud();
          if (money <= 0) {
            aimLineActive = false;
            syncTools();
            toolHint('余额不足，瞄准线已关闭', '#ff9a9d');
            autosave.saveNow();
          }
        }

        if (clawState === 'swing') {
          A.Physics.pendulumStep(pend, dt);
          pend.length = MIN_LEN;
          clawAngle = pend.angle;
          clawOpen = lerp(clawOpen, 0.35, Math.min(1, 10 * dt));
          if (aimArmed) {
            /* 瞄准期间不按摆角放钩；点击画布直接锁定物品。 */
            spaceWasDown = input.isDown(' ');
            if (input.pointer.wentDown) tryAimAt(input.pointer.x, input.pointer.y);
          } else {
            const spaceNow = input.isDown(' ');
            if (input.pointer.wentDown || (spaceNow && !spaceWasDown)) releaseClaw();
            spaceWasDown = spaceNow;
          }
        } else if (clawState === 'extend') {
          const extendSpeed = aimTarget ? AIM_EXTEND_SPEED : EXTEND_SPEED;
          pend.length += extendSpeed * dt;
          clawOpen = lerp(clawOpen, 1, Math.min(1, 10 * dt));
          const tip = clawTip();
          if (aimTarget) {
            const dist = Math.hypot(aimTarget.x - PIVOT.x, aimTarget.y - PIVOT.y);
            if (items.indexOf(aimTarget) === -1) {
              aimTarget = null;
              clawState = 'retract';
            } else if (pend.length >= dist - aimTarget.r * 0.5) {
              const caught = aimTarget;
              aimTarget = null;
              attachHolding(caught);
            }
          } else {
            for (const o of items) {
              if (A.Physics.circleCircle(tip.x, tip.y, CLAW_R, o.x, o.y, o.r)) {
                if (o.type === 'tnt') {
                  explode(o);
                } else {
                  attachHolding(o);
                }
                break;
              }
            }
          }
          /* 钩爪不再钻到道具条后面；物品生成下限以上即为有效挖掘区。 */
          if (clawState === 'extend' && (tip.x < 12 || tip.x > W - 12 || tip.y > itemFloor)) {
            clawState = 'retract';
          }
        } else {
          pend.length -= retractSpeed() * dt;
          clawOpen = lerp(clawOpen, holding ? 0 : 0.35, Math.min(1, 10 * dt));
          if (pend.length <= MIN_LEN) {
            pend.length = MIN_LEN;
            cashIn();
          }
        }

        if (timeLeft <= 0) {
          timeLeft = 0;
          if (mode === 'challenge') {
            if (money >= target) {
              challengeClear();
            } else {
              challengeFail('倒计时归零，未达标');
            }
            input.endFrame();
            return;
          }
          if (money >= target) {
            nextLevel();
          } else {
            gameOver();
            input.endFrame();
            return;
          }
        }
        input.endFrame();
      }

      /* ---------- 渲染 ---------- */
      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, 180);
        sky.addColorStop(0, '#ffd9a0');
        sky.addColorStop(1, '#f2b46b');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, 180);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        [
          [60, 40, 26],
          [120, 58, 18],
          [330, 34, 30],
          [280, 56, 16],
        ].forEach(([x, y, r]) => {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        });
        const soil = ctx.createLinearGradient(0, 180, 0, H);
        soil.addColorStop(0, '#8a5a33');
        soil.addColorStop(1, '#5c3a20');
        ctx.fillStyle = soil;
        ctx.fillRect(0, 180, W, H - 180);
        ctx.fillStyle = '#4f8a3d';
        ctx.fillRect(0, 168, W, 12);
        dirt.forEach((d) => {
          ctx.fillStyle = `rgba(0,0,0,${d.shade})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, TAU);
          ctx.fill();
        });
      }

      function drawMiner() {
        ctx.save();
        ctx.translate(PIVOT.x, PIVOT.y - 4);
        ctx.fillStyle = '#3d5a9c';
        A.draw.roundRect(ctx, -12, -12, 24, 26, 7);
        ctx.fill();
        ctx.fillStyle = '#f0c8a0';
        ctx.beginPath();
        ctx.arc(0, -22, 10, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#f5c542';
        ctx.beginPath();
        ctx.arc(0, -24, 11, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-13, -25, 26, 4);
        ctx.restore();
      }

      function drawClaw() {
        const tip = clawTip();
        ctx.strokeStyle = '#2c2018';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(PIVOT.x, PIVOT.y);
        ctx.lineTo(tip.x, tip.y);
        ctx.stroke();
        if (holding) {
          drawItem({ ...holding, x: tip.x, y: tip.y + holding.r * 0.4 });
        }
        const ang = clawAngle;
        const open = clawOpen;
        ctx.save();
        ctx.translate(tip.x, tip.y);
        ctx.rotate(-ang);
        ctx.fillStyle = '#8d94ad';
        ctx.strokeStyle = '#4a5268';
        ctx.lineWidth = 1.5;
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.rotate(side * (0.35 + open * 0.55));
          ctx.beginPath();
          ctx.moveTo(-3, 2);
          ctx.lineTo(3, 2);
          ctx.lineTo(side * 2 + 4, 14);
          ctx.lineTo(side * 2 - 1, 14);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
        ctx.fillStyle = '#6a7288';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawItem(o) {
        ctx.save();
        ctx.translate(o.x, o.y);
        if (o.type === 'goldS' || o.type === 'goldM' || o.type === 'goldL') {
          const g = ctx.createRadialGradient(-o.r * 0.3, -o.r * 0.3, 1, 0, 0, o.r);
          g.addColorStop(0, '#ffe9a3');
          g.addColorStop(1, '#d8a520');
          ctx.fillStyle = g;
          A.draw.roundRect(ctx, -o.r, -o.r * 0.78, o.r * 2, o.r * 1.56, o.r * 0.32);
          ctx.fill();
          ctx.strokeStyle = '#9c7420';
          ctx.lineWidth = 1.6;
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.fillRect(-o.r * 0.45, -o.r * 0.45, o.r * 0.28, o.r * 0.28);
        } else if (o.type === 'diamond') {
          ctx.fillStyle = '#7ce8e0';
          ctx.strokeStyle = '#3fb8b0';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -o.r);
          ctx.lineTo(o.r * 0.9, -o.r * 0.2);
          ctx.lineTo(0, o.r);
          ctx.lineTo(-o.r * 0.9, -o.r * 0.2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath();
          ctx.moveTo(-o.r * 0.6, -o.r * 0.2);
          ctx.lineTo(0, -o.r * 0.05);
          ctx.lineTo(o.r * 0.6, -o.r * 0.2);
          ctx.stroke();
        } else if (o.type === 'rockS' || o.type === 'rockL') {
          const g = ctx.createRadialGradient(-o.r * 0.3, -o.r * 0.3, 1, 0, 0, o.r);
          g.addColorStop(0, '#9aa0b0');
          g.addColorStop(1, '#5c6270');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, o.r, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = '#464c58';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else {
          ctx.fillStyle = '#d8443f';
          A.draw.roundRect(ctx, -o.r * 0.75, -o.r, o.r * 1.5, o.r * 2, 3);
          ctx.fill();
          ctx.strokeStyle = '#8a2320';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = '#f0f2fa';
          ctx.fillRect(-o.r * 0.75, -o.r * 0.35, o.r * 1.5, o.r * 0.55);
          A.draw.label(ctx, 'TNT', 0, -o.r * 0.08, { font: `bold ${Math.max(7, o.r * 0.6)}px system-ui`, color: '#d8443f' });
          ctx.strokeStyle = '#2c2018';
          ctx.beginPath();
          ctx.moveTo(0, -o.r);
          ctx.quadraticCurveTo(o.r * 0.4, -o.r * 1.5, o.r * 0.75, -o.r * 1.35);
          ctx.stroke();
          ctx.fillStyle = '#ffd23f';
          ctx.beginPath();
          ctx.arc(o.r * 0.75, -o.r * 1.35, 2.2 + Math.sin(performance.now() / 90) * 0.8, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function aimLineHit() {
        const sin = Math.sin(clawAngle);
        const cos = Math.cos(clawAngle);
        let best = null;
        let bestT = Infinity;
        items.forEach((o) => {
          const dx = o.x - PIVOT.x;
          const dy = o.y - PIVOT.y;
          const t = dx * sin + dy * cos;
          if (t < MIN_LEN || t > 900) return;
          const px = PIVOT.x + sin * t;
          const py = PIVOT.y + cos * t;
          if (Math.hypot(o.x - px, o.y - py) <= o.r + CLAW_R * 0.35 && t < bestT) {
            best = o;
            bestT = t;
          }
        });
        return best ? { item: best, t: bestT } : null;
      }

      function drawAimLine() {
        if (!aimLineActive || state !== 'playing') return;
        const hit = aimLineHit();
        const t = hit ? hit.t : 900;
        const sin = Math.sin(clawAngle);
        const cos = Math.cos(clawAngle);
        const ex = PIVOT.x + sin * t;
        const ey = PIVOT.y + cos * t;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, H);
        ctx.clip();
        ctx.setLineDash([9, 8]);
        ctx.lineDashOffset = -(performance.now() / 60) % 17;
        ctx.strokeStyle = hit && hit.item.type === 'tnt' ? 'rgba(255,93,107,0.9)' : 'rgba(255,210,63,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(PIVOT.x, PIVOT.y);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.setLineDash([]);
        if (hit) {
          const o = hit.item;
          const tnt = o.type === 'tnt';
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
          ctx.strokeStyle = tnt ? `rgba(255,93,107,${0.6 + pulse * 0.4})` : `rgba(255,210,63,${0.6 + pulse * 0.4})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r + 7 + pulse * 3, 0, TAU);
          ctx.stroke();
          const label = tnt ? '炸药！' : '+$' + o.value;
          A.draw.label(ctx, label, o.x, o.y - o.r - 14, {
            font: 'bold 12px system-ui, sans-serif',
            color: tnt ? '#ff9a9d' : '#ffd23f',
          });
        }
        ctx.restore();
      }

      function drawAimAssist() {
        if (!aimArmed) return;
        const pointer = aimPointer;
        const hover = pointer.seen ? aimableAt(pointer.x, pointer.y) : null;
        ctx.save();
        if (pointer.seen) {
          const end = hover || pointer;
          ctx.setLineDash([7, 7]);
          ctx.strokeStyle = 'rgba(124, 232, 224, 0.7)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(PIVOT.x, PIVOT.y);
          ctx.lineTo(end.x, end.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        if (hover) {
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
          ctx.strokeStyle = `rgba(255, 210, 63, ${0.55 + pulse * 0.45})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(hover.x, hover.y, hover.r + 10 + pulse * 4, 0, TAU);
          ctx.stroke();
          A.draw.label(ctx, '锁定', hover.x, hover.y - hover.r - 18, {
            font: 'bold 12px system-ui',
            color: '#ffd23f',
          });
        }
        if (pointer.seen) {
          ctx.strokeStyle = 'rgba(238, 241, 255, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, 10, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(pointer.x - 16, pointer.y);
          ctx.lineTo(pointer.x - 5, pointer.y);
          ctx.moveTo(pointer.x + 5, pointer.y);
          ctx.lineTo(pointer.x + 16, pointer.y);
          ctx.moveTo(pointer.x, pointer.y - 16);
          ctx.lineTo(pointer.x, pointer.y - 5);
          ctx.moveTo(pointer.x, pointer.y + 5);
          ctx.lineTo(pointer.x, pointer.y + 16);
          ctx.stroke();
        }
        ctx.restore();
      }

      function render() {
        stage.beginFrame();
        drawBackground();
        items.forEach((o) => {
          if (o !== holding) drawItem(o);
        });
        particles.draw(ctx);
        drawAimLine();
        drawAimAssist();
        drawMiner();
        drawClaw();

        floaters.forEach((f) => {
          A.draw.label(ctx, f.text, clamp(f.x, 40, W - 40), f.y, {
            font: f.big ? 'bold 18px system-ui' : 'bold 14px system-ui',
            color: f.color,
            alpha: clamp(f.life / f.maxLife, 0, 1),
          });
        });

        drawHud();
      }

      /* 画布顶部是浅色天空，直接用黄字会看不清；先铺一层深色渐隐再画 HUD。 */
      function drawHud() {
        const shade = ctx.createLinearGradient(0, 0, 0, 56);
        shade.addColorStop(0, 'rgba(7, 11, 22, 0.82)');
        shade.addColorStop(0.7, 'rgba(7, 11, 22, 0.4)');
        shade.addColorStop(1, 'rgba(7, 11, 22, 0)');
        ctx.fillStyle = shade;
        ctx.fillRect(0, 0, W, 56);

        const done = money >= target;
        A.draw.label(ctx, `$${Math.floor(money)} / $${target}`, 12, 23, {
          align: 'left',
          font: 'bold 15px system-ui',
          color: done ? '#7ff0a4' : '#ffe08a',
        });
        if (aimLineActive) {
          A.draw.label(ctx, `瞄准线摆动时 -$${AIM_LINE_COST_PER_SEC}/s`, 12, 42, {
            align: 'left',
            font: 'bold 11px system-ui',
            color: '#7ce8e0',
          });
        }
        if (clawState === 'retract' && holding) {
          ctx.fillStyle = 'rgba(7, 11, 22, 0.68)';
          A.draw.roundRect(ctx, W / 2 - 104, 52, 208, 25, 9);
          ctx.fill();
          A.draw.label(ctx, TYPES[holding.type].label + ' +$' + holding.value + (winchArmed ? ' · 绞盘' : ''), W / 2, 69, {
            font: 'bold 12px system-ui',
            color: '#ffe08a',
          });
        }
        A.draw.label(ctx, '第 ' + level + ' 关 · 摆速 ' + (pend.gravity / SWING_BASE).toFixed(1) + '×', W / 2, 23, {
          font: 'bold 12px system-ui',
          color: '#e8dcc4',
        });
        const urgent = timeLeft < 10;
        A.draw.label(ctx, Math.ceil(timeLeft) + 's', W - 12, 23, {
          align: 'right',
          font: 'bold 15px system-ui',
          color: urgent ? (Math.floor(timeLeft * 4) % 2 === 0 ? '#ff8f86' : '#ffd0c8') : '#f6ead0',
        });
      }

      const loop = A.createLoop({
        update,
        render,
        onAutoPause() {
          if (state === 'playing') pauseByUser();
        },
      });

      const pauseUi = A.bindPause({
        button: dom.pause,
        pause: pauseByUser,
        resume: resumeGame,
        isPlaying: () => state === 'playing',
        isPaused: () => state === 'paused',
      });
      dom.cashout.addEventListener('click', cashOut);
      if (dom.chPanel) {
        dom.chPanel.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          if (target.closest('[data-ch-back]')) {
            closeChallengePanel();
            return;
          }
          const stageBtn = target.closest('.ac-stage-btn[data-stage-id]');
          if (!stageBtn || stageBtn.disabled) return;
          startChallenge(stageBtn.dataset.stageId);
        });
      }

      if (dom.toolAim) {
        dom.toolAim.addEventListener('click', () => useTool('aim'));
        dom.toolTime.addEventListener('click', () => useTool('time'));
        dom.toolWinch.addEventListener('click', () => useTool('winch'));
        if (dom.toolLine) dom.toolLine.addEventListener('click', () => useTool('line'));
      }
      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        const target = e.target;
        if (target && target.tagName) {
          const tag = target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        }
        const tool = { '1': 'aim', '2': 'time', '3': 'winch', '4': 'line' }[e.key];
        if (!tool) return;
        e.preventDefault();
        useTool(tool);
      });

      function syncMute() {
        dom.mute.textContent = A.Sfx.muted ? '🔇' : '🔊';
      }
      dom.mute.addEventListener('click', () => {
        A.Sfx.setMuted(!A.Sfx.muted);
        syncMute();
      });
      syncMute();

      reset();
      state = 'ready';
      if (typeof ResizeObserver !== 'undefined') {
        const floorObserver = new ResizeObserver(() => refreshItemFloor());
        floorObserver.observe(canvas);
        if (dom.toolbelt) floorObserver.observe(dom.toolbelt);
      }
      window.addEventListener('resize', () => setTimeout(refreshItemFloor, 80));
      window.addEventListener('orientationchange', () => setTimeout(refreshItemFloor, 200));
      requestAnimationFrame(refreshItemFloor);
      if (location.hash === '#test') {
        window.__arcadeTest = {
          info() {
            return {
              money,
              target,
              level,
              timeLeft,
              totalValue: totalItemValue(),
              items: items.length,
              tnt: items.filter((o) => o.type === 'tnt').length,
              swing: pend.gravity,
              spec: levelSpec(level),
              holding: holding ? holding.type : null,
              cashoutHidden: dom.cashout.hidden,
              clawState,
              angle: pend.angle,
              clawAngle,
              vel: pend.vel,
              length: pend.length,
              tools: { aim: tools.aim, time: tools.time, winch: tools.winch },
              winchArmed,
              aimLineActive,
              aimLineCost: AIM_LINE_COST_PER_SEC,
              aimArmed,
              aimTarget: aimTarget ? aimTarget.type : null,
              itemFloor,
              itemList: items.map((o) => ({ type: o.type, x: o.x, y: o.y, r: o.r })),
            };
          },
          useToolNow(name) {
            return useTool(name);
          },
          joyInfo() {
            return {
              tools: { aim: tools.aim, time: tools.time, winch: tools.winch },
              aimArmed,
              winchArmed,
              aimLineActive,
              aimLineCost: AIM_LINE_COST_PER_SEC,
              aimLineBilling: aimLineActive && state === 'playing' && clawState === 'swing',
              clawState,
              holding: holding ? holding.type : null,
              money,
              target,
              level,
              timeLeft,
              lastFeedback: floaters.length ? floaters[floaters.length - 1].text : null,
            };
          },
          useJoyTool(id) {
            const button = { aim: dom.toolAim, time: dom.toolTime, winch: dom.toolWinch, line: dom.toolLine }[id];
            if (!button || button.disabled) return false;
            button.click();
            return true;
          },
          aimAt(x, y) {
            return tryAimAt(Number(x), Number(y));
          },
          addTnt(x, y) {
            const t = TYPES.tnt;
            items.push({
              type: 'tnt',
              x: Number(x) || PIVOT.x,
              y: Number(y) || 520,
              r: t.r,
              value: 0,
              weight: 0,
              wob: 0,
            });
            return true;
          },
          setMoney(value) {
            money = Math.max(0, Number(value) || 0);
            syncHud();
            syncCashout();
          },
          clearItems() {
            items = [];
            holding = null;
            syncCashout();
            return true;
          },
          addGold(x, y) {
            const t = TYPES.goldM;
            items.push({
              type: 'goldM',
              x: Number(x) || PIVOT.x,
              y: Number(y) || 520,
              r: t.r,
              value: t.value,
              weight: t.weight,
              wob: 0,
            });
            syncCashout();
            return true;
          },
          refillTools() {
            tools.aim = TOOL_CAPS.aim;
            tools.time = TOOL_CAPS.time;
            tools.winch = TOOL_CAPS.winch;
            syncTools();
            return true;
          },
          grabFirst(type, length) {
            const item = items.find((o) => o.type !== 'tnt' && (!type || o.type === type));
            if (!item) return false;
            pend.angle = 0.55;
            clawAngle = 0.55;
            pend.length = clamp(Number(length) || 300, MIN_LEN, 800);
            attachHolding(item);
            syncHud();
            autosave.saveNow();
            return true;
          },
          /* ---------- 0.9 挑战模式钩子（契约 INTEGRATION-CONTRACT §5） ---------- */
          challengeStages() {
            return challengeStagesInfo();
          },
          startChallenge(ref) {
            return startChallenge(ref);
          },
          challengeInfo() {
            return challengeInfo();
          },
          stageObservable() {
            return stageObservable();
          },
          forceStageClear(assisted) {
            if (mode !== 'challenge' || state !== 'playing') return false;
            if (assisted) chAssisted = true;
            return challengeClear();
          },
          forceStageFail(reason) {
            return challengeFail(String(reason || 'force'));
          },
          exitChallenge() {
            if (mode !== 'challenge' && mode !== 'failed' && mode !== 'cleared') return false;
            return showChallengePanel();
          },
          openChallengePanel() {
            return showChallengePanel();
          },
          /* #test 专用：等摆角进入目标区间后自动放钩（releaseClaw 仍走真实物理/夹取路径）。 */
          aimRelease(deg, tol) {
            autoRelease = { targetDeg: Number(deg) || 0, tolDeg: Math.max(0.1, Number(tol) || 1.5) };
            return true;
          },
          cancelAimRelease() {
            autoRelease = null;
            return true;
          },
          challengePanelVisible() {
            return !!(dom.chPanel && !dom.chPanel.hidden);
          },
          /* #test 专用：同步推进挑战模拟（固定 1/60 步长，确定性驱动/回放用）。 */
          advanceChallenge(seconds) {
            const total = Math.max(0, Number(seconds) || 0);
            const step = 1 / 60;
            let guard = Math.ceil(total / step) + 2;
            while (guard-- > 0 && state === 'playing') update(step);
            return { state, info: challengeInfo() };
          },
        };
      }
      const saved = autosave.load();
      if (saved) {
        A.showResumePrompt(ui, saved, {
          name: '黄金矿工',
          onResume: () => {
            if (restore(saved.data)) {
              state = 'playing';
              ui.hide();
              loop.resume();
              pauseUi.sync();
              autosave.saveNow();
            } else {
              autosave.clear();
              showStart();
            }
          },
          onRestart: () => {
            autosave.clear();
            showStart();
          },
        });
      } else {
        showStart();
      }
      loop.start();
    })();
  </script>
</body>
</html>
