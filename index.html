<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f6fb" />
  <meta name="description" content="StudioKit：轻量、离线优先的浏览器单页工具集合。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./shared/site.css" />
  <title>StudioKit — Browser Tools</title>
  <script src="./shared/home.js" defer></script>
</head>
<body>
  <div class="studiokit-home">
    <header class="sk-header">
      <div class="sk-container sk-header-inner">
        <span class="sk-brand-mark" aria-hidden="true"></span>
        <div class="sk-brand-name"><strong>StudioKit</strong></div>
        <a class="sk-source" href="https://github.com/Shawlaw/studiokit" target="_blank" rel="noopener noreferrer" title="在 GitHub 查看 StudioKit 源码">源码 GitHub ↗</a>
      </div>
    </header>

    <main class="sk-container sk-main">
      <section id="tools" aria-labelledby="tools-title">
        <div class="sk-section-head">
          <h2 id="tools-title">工具箱</h2>
          <p data-registry-status>正在读取工具列表…</p>
        </div>
        <div class="sk-tool-grid" data-tool-grid aria-live="polite"></div>
      </section>
    </main>

    <footer class="sk-footer">
      <div class="sk-container sk-footer-inner">
        <span>本地优先 · 无账号 · 静态站点</span>
      </div>
    </footer>
  </div>
</body>
</html>
